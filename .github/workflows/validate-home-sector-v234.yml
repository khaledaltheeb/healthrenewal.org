name: Validate institutional home sector v234

on:
  pull_request:
    branches: [main]
    paths:
      - "content/sectors-v10/home.json"
      - ".home-v234bundle/**"
      - "scripts/upgrade_home_sector_v234.py"
      - "scripts/stamp_deployment_v29.py"
      - "tests/test_home_sector_v234.py"
      - ".github/workflows/validate-home-sector-v234.yml"
  push:
    branches: [main]
    paths:
      - "content/sectors-v10/home.json"
      - ".home-v234bundle/**"
      - "scripts/upgrade_home_sector_v234.py"
      - "scripts/stamp_deployment_v29.py"
      - "tests/test_home_sector_v234.py"
      - ".github/workflows/validate-home-sector-v234.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: home-sector-v234-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Compile production upgrade and contracts
        run: |
          python3 --version
          python3 -m py_compile \
            scripts/upgrade_home_sector_v234.py \
            scripts/stamp_deployment_v29.py \
            tests/test_home_sector_v234.py
      - name: Run twenty-guide contract and capture evidence
        id: home_tests
        shell: bash
        run: |
          set +e
          python3 -m unittest -v tests.test_home_sector_v234 > /tmp/home-v234-test.log 2>&1
          code=$?
          cat /tmp/home-v234-test.log
          printf 'exit_code=%s\n' "$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload exact home-sector test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-sector-v234-test-evidence
          path: /tmp/home-v234-test.log
          if-no-files-found: error
          retention-days: 7
      - name: Enforce twenty-guide contract
        if: steps.home_tests.outputs.exit_code != '0'
        run: |
          echo "Home-sector v234 tests failed; inspect uploaded evidence."
          exit 1
      - name: Verify permanent production integration
        run: |
          test "$(find .home-v234bundle -maxdepth 1 -type f -name 'part*' | wc -l)" -eq 5
          grep -q 'from upgrade_home_sector_v234 import upgrade as upgrade_home_sector' scripts/stamp_deployment_v29.py
          grep -q 'home_sector_version' scripts/stamp_deployment_v29.py
          grep -q 'home-sector-v234.json' scripts/stamp_deployment_v29.py
