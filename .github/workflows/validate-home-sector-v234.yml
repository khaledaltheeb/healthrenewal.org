name: Validate institutional home sector v234

on:
  pull_request:
    branches: [main]
    paths:
      - "content/sectors-v10/home.json"
      - ".home-v234bundle/**"
      - "scripts/upgrade_home_sector_v234.py"
      - "scripts/stamp_deployment_v29.py"
      - "tests/test_home_sector_v234.py"
      - ".github/workflows/validate-home-sector-v234.yml"
  push:
    branches: [main]
    paths:
      - "content/sectors-v10/home.json"
      - ".home-v234bundle/**"
      - "scripts/upgrade_home_sector_v234.py"
      - "scripts/stamp_deployment_v29.py"
      - "tests/test_home_sector_v234.py"
      - ".github/workflows/validate-home-sector-v234.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: home-sector-v234-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Compile production upgrade and contracts
        run: |
          python3 --version
          python3 -m py_compile \
            scripts/upgrade_home_sector_v234.py \
            scripts/stamp_deployment_v29.py \
            tests/test_home_sector_v234.py
      - name: Run home-sector contract and capture evidence
        id: home_tests
        shell: bash
        run: |
          set +e
          python3 -m unittest -v tests.test_home_sector_v234 > /tmp/home-v234-test.log 2>&1
          code=$?
          cat /tmp/home-v234-test.log
          printf 'exit_code=%s\n' "$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload exact home-sector test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-sector-v234-test-evidence
          path: /tmp/home-v234-test.log
          if-no-files-found: error
          retention-days: 7
      - name: Enforce home-sector contract
        if: steps.home_tests.outputs.exit_code != '0'
        run: |
          echo "Home-sector v234 tests failed; inspect uploaded evidence."
          exit 1
      - name: Verify permanent production integration
        run: |
          test "$(find .home-v234bundle -maxdepth 1 -type f -name 'part*' | wc -l)" -eq 5
          grep -q 'from upgrade_home_sector_v234 import upgrade as upgrade_home_sector' scripts/stamp_deployment_v29.py
          grep -q 'home_sector_version' scripts/stamp_deployment_v29.py
          grep -q 'home-sector-v234.json' scripts/stamp_deployment_v29.py

  # The build log is uploaded before its exit code is enforced, so a real failure remains diagnosable.
  production-smoke:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SITE_BASE: https://healthrenewal.org/
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Restore verified generators and Arabic sector sources
        run: |
          set -euxo pipefail
          mkdir -p /tmp/v10-content
          cp content/sectors-v10/*.json /tmp/v10-content/
          cat .v10bundle/part00 .v10bundle/part01 .v10bundle/part02 .v10bundle/part03 .v10bundle/part04 | base64 --decode > /tmp/v10-source.tar.gz
          tar -xzf /tmp/v10-source.tar.gz
          cp /tmp/v10-content/*.json content/sectors-v10/
          cat .generator-v6/part00 .generator-v6/part01 .generator-v6/part02 .generator-v6/part03 > build_site.py
          python scripts/verify_enricher_v7.py
          python scripts/verify_expander_v9.py
          python -m py_compile \
            build_site.py \
            enrich_site_v7.py \
            expand_site_v9.py \
            scripts/scale_site_v8.py \
            scripts/design_content_v10.py \
            scripts/upgrade_home_sector_v234.py
      - name: Build the real sector pages and apply v234
        id: production_build
        shell: bash
        run: |
          set +e
          set -o pipefail
          {
            set -eux
            python build_site.py
            python enrich_site_v7.py
            cp google644f1f7a8b7aaa2b.html _site/google644f1f7a8b7aaa2b.html
            python scripts/scale_site_v8.py
            python expand_site_v9.py
            python scripts/design_content_v10.py
            PYTHONPATH=scripts python - <<'PY'
          from pathlib import Path
          from upgrade_home_sector_v234 import upgrade

          result = upgrade(Path('_site'))
          print(result)
          PY
          } 2>&1 | tee /tmp/home-v234-production-build.log
          code=${PIPESTATUS[0]}
          printf 'exit_code=%s\n' "$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload exact production build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-sector-v234-production-build-log
          path: /tmp/home-v234-production-build.log
          if-no-files-found: error
          retention-days: 7
      - name: Enforce production build completion
        if: steps.production_build.outputs.exit_code != '0'
        run: |
          echo "The real v10 build or home-sector upgrade failed. Last 120 lines follow."
          tail -n 120 /tmp/home-v234-production-build.log
          exit 1
      - name: Enforce real generated-page SEO depth safety and discovery
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('_site')
          report = json.loads((root / 'api/home-sector-v234.json').read_text(encoding='utf-8'))
          assert report['status'] == 'passed', report
          assert report['version'] == 234, report
          assert report['source_articles'] == 20, report
          assert report['hub_words'] >= 1800, report
          assert report['minimum_article_words'] >= 450, report
          assert report['banned_term_present'] is False, report
          assert report['diagnostic_claim_present'] is False, report

          pages = sorted((root / 'sectors/home').glob('*/index.html'))
          assert len(pages) == 20, len(pages)
          hub = (root / 'sectors/home/index.html').read_text(encoding='utf-8')
          assert hub.count('<h1') == 1
          assert hub.count('rel="canonical"') == 1
          assert 'noindex' not in hub.lower()
          for schema in ('CollectionPage', 'BreadcrumbList', 'ItemList', 'FAQPage'):
              assert schema in hub, schema
          for page in pages:
              text = page.read_text(encoding='utf-8')
              assert text.count('<h1') == 1, page
              assert text.count('rel="canonical"') == 1, page
              assert '"@type":"Article"' in text, page
              assert 'noindex' not in text.lower(), page
          robots = (root / 'robots.txt').read_text(encoding='utf-8')
          assert robots.count('# home-sector-v234') == 1
          assert 'Allow: /sectors/home/' in robots
          assert 'Sitemap: https://healthrenewal.org/sitemap.xml' in robots
          print({'home_sector': 'passed', 'guides': len(pages), 'hub_words': report['hub_words'], 'minimum_article_words': report['minimum_article_words']})
          PY
      - name: Upload real generated section evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-sector-v234-production-smoke
          path: |
            _site/api/home-sector-v234.json
            _site/sectors/home/
            _site/robots.txt
          if-no-files-found: warn
          retention-days: 7
