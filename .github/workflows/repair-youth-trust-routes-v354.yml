name: Repair youth trust routes v354
# One-time source repair; the job deletes this workflow after a successful commit.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-youth-trust-routes-v354.yml'

permissions:
  contents: write

concurrency:
  group: repair-youth-trust-routes-v354
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Repair the publisher source of truth
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/publish_youth_sector_v353.py')
          text = path.read_text(encoding='utf-8')
          marker = 'BASE_PATH = "/pterminology-site"\n'
          routes = (
              'TRUST_ROUTES = {\n'
              '    "methodology": f"{BASE_PATH}/trust/",\n'
              '    "information_evaluation": f"{BASE_PATH}/trust/#evidence",\n'
              '}\n'
          )
          if 'TRUST_ROUTES = {' not in text:
              if marker not in text:
                  raise SystemExit('BASE_PATH marker not found')
              text = text.replace(marker, marker + routes, 1)

          replacements = {
              'href="{BASE_PATH}/editorial-methodology/"': 'href="{TRUST_ROUTES[\'methodology\']}"',
              'href="{BASE_PATH}/evaluate-mental-health-information/"': 'href="{TRUST_ROUTES[\'information_evaluation\']}"',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)

          for stale in ('/editorial-methodology/', '/evaluate-mental-health-information/'):
              if stale in text:
                  raise SystemExit(f'Stale route remains in publisher: {stale}')
          if text.count("TRUST_ROUTES['methodology']") < 2:
              raise SystemExit('Methodology route was not centralized everywhere')
          if text.count("TRUST_ROUTES['information_evaluation']") < 2:
              raise SystemExit('Information-evaluation route was not centralized everywhere')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Add the route regression test
        run: |
          cat > tests/test_youth_trust_routes_v354.py <<'PY'
          from __future__ import annotations

          import importlib.util
          import shutil
          import tempfile
          import unittest
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          SCRIPT = ROOT / 'scripts' / 'publish_youth_sector_v353.py'
          spec = importlib.util.spec_from_file_location('youth_sector_v353_routes', SCRIPT)
          module = importlib.util.module_from_spec(spec)
          assert spec and spec.loader
          spec.loader.exec_module(module)


          class YouthTrustRoutesV354Tests(unittest.TestCase):
              def test_publisher_uses_only_published_trust_routes(self) -> None:
                  source = SCRIPT.read_text(encoding='utf-8')
                  self.assertNotIn('/editorial-methodology/', source)
                  self.assertNotIn('/evaluate-mental-health-information/', source)
                  self.assertEqual(module.TRUST_ROUTES['methodology'], f'{module.BASE_PATH}/trust/')
                  self.assertEqual(
                      module.TRUST_ROUTES['information_evaluation'],
                      f'{module.BASE_PATH}/trust/#evidence',
                  )
                  trust = (ROOT / 'trust/index.html').read_text(encoding='utf-8')
                  self.assertIn('id="evidence"', trust)

              def test_generated_youth_pages_have_no_retired_routes(self) -> None:
                  site = Path(tempfile.mkdtemp(prefix='youth-trust-v354-'))
                  self.addCleanup(lambda: shutil.rmtree(site, ignore_errors=True))
                  shutil.copy2(ROOT / 'robots.txt', site / 'robots.txt')
                  module.publish(site)
                  pages = sorted((site / 'sectors/youth').rglob('index.html'))
                  self.assertEqual(len(pages), 21)
                  combined = '\n'.join(path.read_text(encoding='utf-8') for path in pages)
                  self.assertNotIn('/editorial-methodology/', combined)
                  self.assertNotIn('/evaluate-mental-health-information/', combined)
                  self.assertIn(module.TRUST_ROUTES['methodology'], combined)
                  self.assertIn(module.TRUST_ROUTES['information_evaluation'], combined)


          if __name__ == '__main__':
              unittest.main()
          PY

      - name: Remove temporary routes and regenerate youth pages
        run: |
          set -euxo pipefail
          rm -rf editorial-methodology evaluate-mental-health-information
          rm -f sitemap-governance.xml
          python - <<'PY'
          from pathlib import Path
          path = Path('sitemap-index.xml')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '<sitemap><loc>https://khaledaltheeb.github.io/pterminology-site/sitemap-governance.xml</loc></sitemap>',
              '',
          )
          path.write_text(text, encoding='utf-8')
          PY
          python scripts/publish_youth_sector_v353.py . > /tmp/youth-v354-first.json
          sha256sum $(find sectors/youth -type f -name 'index.html' | sort) > /tmp/youth-v354-before.sha256
          python scripts/publish_youth_sector_v353.py . > /tmp/youth-v354-second.json
          sha256sum $(find sectors/youth -type f -name 'index.html' | sort) > /tmp/youth-v354-after.sha256
          diff -u /tmp/youth-v354-before.sha256 /tmp/youth-v354-after.sha256

      - name: Validate the focused repair
        run: |
          set -euxo pipefail
          python -m py_compile scripts/publish_youth_sector_v353.py tests/test_youth_sector_v353.py tests/test_youth_trust_routes_v354.py
          python -m unittest -v tests.test_youth_sector_v353 tests.test_youth_trust_routes_v354
          ! grep -R --line-number -E '/(editorial-methodology|evaluate-mental-health-information)/' sectors/youth scripts/publish_youth_sector_v353.py
          grep -R --line-number '/trust/' sectors/youth | head
          git diff --check

      - name: Commit the source repair and retire this workflow
        run: |
          set -euxo pipefail
          rm .github/workflows/repair-youth-trust-routes-v354.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: repair youth trust routes from publisher [skip ci]'
          git push origin HEAD:main
