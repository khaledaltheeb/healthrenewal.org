name: Generate evidence-guided content expansion v1

on:
  pull_request:
    branches:
      - main
    paths:
      - data/content-expansion-v1.json
      - data/content-expansion-v1/**
      - content/family-guide-special-education-tools-v1/**
      - content/v406/women-youth-expansion-ar.json
      - scripts/generate_content_expansion_v1.py
      - scripts/create_content_expansion_root_hubs_v1.py
      - scripts/update_content_expansion_sitemaps_v1.py
      - scripts/migrate_source_reference_contract_v1.py
      - scripts/fix_sitemap_duplicate_ownership_v1.py
      - scripts/family_tools_v1_render.py
      - scripts/publish_family_guide_special_education_tools_v1.py
      - scripts/publish_women_youth_v406.py
      - tests/test_content_expansion_v1.py
      - .github/workflows/generate-content-expansion-v1.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-expansion-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  generate-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile and apply source-reference contract migration
        run: |
          python -m py_compile scripts/migrate_source_reference_contract_v1.py
          python scripts/migrate_source_reference_contract_v1.py

      - name: Normalize diversification repository root
        run: sed -i '0,/parents\[1\]/s//parents[2]/' data/content-expansion-v1/diversify.py

      - name: Compile publication scripts and tests
        run: |
          python -m py_compile scripts/generate_content_expansion_v1.py
          python -m py_compile data/content-expansion-v1/diversify.py
          python -m py_compile data/content-expansion-v1/apply_evidence_profiles.py
          python -m py_compile data/content-expansion-v1/profile-routing-test.py
          python -m py_compile scripts/create_content_expansion_root_hubs_v1.py
          python -m py_compile scripts/update_content_expansion_sitemaps_v1.py
          python -m py_compile scripts/fix_sitemap_duplicate_ownership_v1.py
          python -m py_compile scripts/family_tools_v1_render.py
          python -m py_compile scripts/publish_family_guide_special_education_tools_v1.py
          python -m py_compile scripts/publish_women_youth_v406.py
          python -m py_compile tests/test_content_expansion_v1.py

      - name: Validate migrated legacy content generators
        run: |
          python tests/test_family_guide_special_education_tools_v1.py
          python -m unittest tests/test_women_youth_v406.py

      - name: Generate 100 static pages and collection hubs
        run: python scripts/generate_content_expansion_v1.py

      - name: Add topic-specific decision layers
        run: python data/content-expansion-v1/diversify.py

      - name: Apply official topic-specific evidence profiles
        run: python data/content-expansion-v1/apply_evidence_profiles.py

      - name: Create missing root sector hubs
        run: python scripts/create_content_expansion_root_hubs_v1.py

      - name: Update only relevant sitemap families and public manifest
        run: python scripts/update_content_expansion_sitemaps_v1.py

      - name: Resolve duplicate URL ownership in broad sitemap
        run: |
          python scripts/fix_sitemap_duplicate_ownership_v1.py
          python scripts/validate_sitemap_discovery_contract.py

      - name: Validate depth evidence semantics similarity and publication scope
        run: python tests/test_content_expansion_v1.py

      - name: Validate semantic routing of official evidence profiles
        run: python data/content-expansion-v1/profile-routing-test.py

      - name: Validate repository-wide source evidence contract
        run: python scripts/audit_source_evidence_v76.py . --output reports/source-evidence-contract-v1.json

      - name: Remove transient Python files
        run: find . -type d -name __pycache__ -prune -exec rm -rf {} +

      - name: Commit generated publication surface
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "build: materialize scoped 100-page expansion"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
