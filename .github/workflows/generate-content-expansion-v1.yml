name: Generate evidence-guided content expansion v1

on:
  push:
    branches:
      - agent/content-expansion-100-v2
    paths:
      - data/content-expansion-v1.json
      - data/content-expansion-v1/**
      - scripts/generate_content_expansion_v1.py
      - tests/test_content_expansion_v1.py
      - .github/workflows/generate-content-expansion-v1.yml
  pull_request:
    branches:
      - main
    paths:
      - data/content-expansion-v1.json
      - data/content-expansion-v1/**
      - scripts/generate_content_expansion_v1.py
      - tests/test_content_expansion_v1.py
      - .github/workflows/generate-content-expansion-v1.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-expansion-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  generate-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile generator and tests
        run: |
          python -m py_compile scripts/generate_content_expansion_v1.py
          python -m py_compile tests/test_content_expansion_v1.py

      - name: Generate 100 static pages and hubs
        run: python scripts/generate_content_expansion_v1.py

      - name: Rebuild sitemaps and machine-readable discovery
        run: python scripts/generate_sitemap_index_v304.py

      - name: Validate page depth, sources, semantics, uniqueness, and sitemap coverage
        run: python tests/test_content_expansion_v1.py

      - name: Remove transient Python files
        run: find . -type d -name __pycache__ -prune -exec rm -rf {} +

      - name: Commit generated publication surface
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "build: materialize 100 evidence-guided pages"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
