name: Verify special-needs condition post-launch live v306

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/verify-special-needs-condition-postlaunch-live-v306.yml"
  workflow_run:
    workflows: ["Deploy validated main to GitHub Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: verify-special-needs-condition-live-v306-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate live-verification workflow contract
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/verify-special-needs-condition-postlaunch-live-v306.yml')
          text = path.read_text(encoding='utf-8')
          required = (
              'Deploy validated main to GitHub Pages',
              'special-needs/autism/',
              'special-needs/down-syndrome/',
              'special-needs-condition-postlaunch-v305.json',
              'sitemap-special-needs.xml',
              'condition-postlaunch-v305-content:start',
              'provider-listing-policy',
              'twitter:card',
              'visible_breadcrumbs',
          )
          missing = [item for item in required if item not in text]
          assert not missing, missing
          assert 'MINIMUM_SHA: 31aa159acbd237d1989f142420d85af7ea11d747' in text
          print({'workflow': path.name, 'required_markers': len(required), 'status': 'static-contract-passed'})
          PY

  live-publication:
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      BASE_URL: https://khaledaltheeb.github.io/pterminology-site/
      MINIMUM_SHA: 31aa159acbd237d1989f142420d85af7ea11d747
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Wait for a non-rollback deployment containing v305
        run: |
          set -euo pipefail
          matched=0
          for i in $(seq 1 72); do
            token="${MINIMUM_SHA}-${i}-$(date +%s)"
            if curl --retry 2 --retry-delay 2 -H 'Cache-Control: no-cache' -fsSL "${BASE_URL}deployment.json?v=${token}" -o /tmp/deployment.json; then
              if python - <<'PY'
          import json, os, urllib.error, urllib.request
          from pathlib import Path

          data = json.loads(Path('/tmp/deployment.json').read_text(encoding='utf-8'))
          live = data.get('commit')
          minimum = os.environ['MINIMUM_SHA']
          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          assert isinstance(live, str) and len(live) == 40, data
          if live == minimum:
              raise SystemExit(0)
          request = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/compare/{minimum}...{live}',
              headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'special-needs-condition-live-v306',
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  status = json.loads(response.read().decode('utf-8')).get('status')
          except urllib.error.HTTPError:
              raise SystemExit(1)
          raise SystemExit(0 if status in {'ahead', 'identical'} else 1)
          PY
              then
                matched=1
                break
              fi
            fi
            sleep 10
          done
          test "${matched}" -eq 1

      - name: Download live condition pages hub API and sitemap
        run: |
          set -euxo pipefail
          token="${MINIMUM_SHA}-live-$(date +%s)"
          curl --retry 4 --retry-delay 3 -H 'Cache-Control: no-cache' -fsSL "${BASE_URL}special-needs/autism/?v=${token}" -o /tmp/autism.html
          curl --retry 4 --retry-delay 3 -H 'Cache-Control: no-cache' -fsSL "${BASE_URL}special-needs/down-syndrome/?v=${token}" -o /tmp/down.html
          curl --retry 4 --retry-delay 3 -H 'Cache-Control: no-cache' -fsSL "${BASE_URL}special-needs/?v=${token}" -o /tmp/hub.html
          curl --retry 4 --retry-delay 3 -H 'Cache-Control: no-cache' -fsSL "${BASE_URL}api/special-needs-condition-postlaunch-v305.json?v=${token}" -o /tmp/postlaunch.json
          curl --retry 4 --retry-delay 3 -H 'Cache-Control: no-cache' -fsSL "${BASE_URL}sitemap-special-needs.xml?v=${token}" -o /tmp/sitemap.xml

      - name: Enforce live navigation metadata accessibility links and policy
        run: |
          python - <<'PY'
          import json
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          base = 'https://khaledaltheeb.github.io/pterminology-site/'
          deployment = json.loads(Path('/tmp/deployment.json').read_text(encoding='utf-8'))
          report = json.loads(Path('/tmp/postlaunch.json').read_text(encoding='utf-8'))
          assert report['version'] == 305, report
          assert report['status'] == 'passed', report
          assert report['condition_slugs'] == ['autism', 'down-syndrome'], report
          assert report['condition_count'] == 2, report
          assert report['related_link_count'] == 16, report
          for key in ('visible_breadcrumbs', 'meta_enhanced', 'provider_policy_visible', 'focus_visibility_guard'):
              assert report[key] is True, (key, report.get(key))

          expected_page_links = {
              'autism': (
                  '/pterminology-site/special-needs/autism-daily-participation-support/',
                  '/pterminology-site/special-needs/aac-daily-communication-access/',
                  '/pterminology-site/special-needs/sensory-regulation-daily-environment-plan/',
                  '/pterminology-site/special-needs/visual-schedules-transitions-home-school-plan/',
                  '/pterminology-site/special-needs/early-intervention-family-action-plan/',
                  '/pterminology-site/special-needs/provider-center-quality-selection-checklist/',
                  '/pterminology-site/special-needs/caregiver-wellbeing-sustainable-support-plan/',
                  '/pterminology-site/special-needs/safeguarding-bullying-abuse-response-plan/',
              ),
              'down': (
                  '/pterminology-site/special-needs/early-intervention-family-action-plan/',
                  '/pterminology-site/special-needs/individual-learning-support-plan/',
                  '/pterminology-site/special-needs/accessible-learning-materials-arabic/',
                  '/pterminology-site/special-needs/family-school-collaboration-meeting/',
                  '/pterminology-site/special-needs/transition-adulthood-employment-independence/',
                  '/pterminology-site/special-needs/provider-center-quality-selection-checklist/',
                  '/pterminology-site/special-needs/caregiver-wellbeing-sustainable-support-plan/',
                  '/pterminology-site/special-needs/safeguarding-bullying-abuse-response-plan/',
              ),
          }
          for name in ('autism', 'down'):
              text = Path(f'/tmp/{name}.html').read_text(encoding='utf-8')
              required = (
                  'condition-postlaunch-v305-meta:start',
                  'condition-postlaunch-v305-breadcrumbs:start',
                  'condition-postlaunch-v305-content:start',
                  'condition-postlaunch-v305-style:start',
                  'name="twitter:card" content="summary_large_image"',
                  'property="og:locale" content="ar_AR"',
                  'aria-label="مسار التنقل"',
                  'aria-current="page"',
                  'id="provider-listing-policy"',
                  ':focus-visible',
              )
              missing = [item for item in required if item not in text]
              assert not missing, (name, missing)
              assert text.count('<h1') == 1, name
              assert text.count('فتح الدليل العملي') == 8, name
              ids = re.findall(r'\bid="([^"]+)"', text)
              assert len(ids) == len(set(ids)), (name, [item for item in ids if ids.count(item) > 1])
              for href in expected_page_links[name]:
                  assert text.count(f'href="{href}"') == 1, (name, href)

          hub = Path('/tmp/hub.html').read_text(encoding='utf-8')
          assert hub.count('/pterminology-site/special-needs/autism/') == 1
          assert hub.count('/pterminology-site/special-needs/down-syndrome/') == 1

          sitemap_urls = {
              (node.text or '').strip()
              for node in ET.parse('/tmp/sitemap.xml').getroot().findall('{*}url/{*}loc')
              if node.text
          }
          for url in (
              base + 'special-needs/autism/',
              base + 'special-needs/down-syndrome/',
          ):
              assert url in sitemap_urls, url
          assert len(sitemap_urls) == len(set(sitemap_urls))

          print({
              'live_commit': deployment.get('commit'),
              'condition_pages': 2,
              'contextual_links': report['related_link_count'],
              'sitemap_urls': len(sitemap_urls),
              'status': 'special-needs-condition-live-v306-verified',
          })
          PY
