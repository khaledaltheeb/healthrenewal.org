name: Validate accessibility discovery

on:
  pull_request:
    paths:
      - accessibility/**
      - assets/brand/rawafid-brand.css
      - assets/platform/platform-core.js
      - sitemap-accessibility.xml
      - sitemap-index.xml
      - scripts/validate_accessibility_discovery.py
      - scripts/validate_reduced_motion.py
      - .github/workflows/validate-accessibility-discovery.yml
  push:
    branches:
      - main
    paths:
      - accessibility/**
      - assets/brand/rawafid-brand.css
      - assets/platform/platform-core.js
      - sitemap-accessibility.xml
      - sitemap-index.xml
      - scripts/validate_accessibility_discovery.py
      - scripts/validate_reduced_motion.py
      - .github/workflows/validate-accessibility-discovery.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: accessibility-discovery-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile validators
        run: python -m py_compile scripts/validate_accessibility_discovery.py scripts/validate_reduced_motion.py
      - name: Run negative-path self-tests
        run: |
          python scripts/validate_accessibility_discovery.py --self-test
          python scripts/validate_reduced_motion.py --self-test
      - name: Validate accessibility discovery
        run: python scripts/validate_accessibility_discovery.py
      - name: Validate reduced motion contract
        run: python scripts/validate_reduced_motion.py
