name: Validate accessibility discovery

on:
  pull_request:
    paths:
      - accessibility/**
      - assets/platform/platform-core.js
      - sitemap-accessibility.xml
      - sitemap-index.xml
      - scripts/validate_accessibility_discovery.py
      - .github/workflows/validate-accessibility-discovery.yml
  push:
    branches:
      - main
    paths:
      - accessibility/**
      - assets/platform/platform-core.js
      - sitemap-accessibility.xml
      - sitemap-index.xml
      - scripts/validate_accessibility_discovery.py
      - .github/workflows/validate-accessibility-discovery.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: accessibility-discovery-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile validator
        run: python -m py_compile scripts/validate_accessibility_discovery.py
      - name: Run negative-path self-tests
        run: python scripts/validate_accessibility_discovery.py --self-test
      - name: Validate footer and sitemap discovery
        run: python scripts/validate_accessibility_discovery.py
