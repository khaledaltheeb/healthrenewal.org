name: Diagnose content target routes v248

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/enforce_platform_identity_v201.py"
      - "scripts/upgrade_home_sector_v234.py"
      - ".github/workflows/diagnose-content-target-routes-v248.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Locate workflow command and relevant test methods
        run: |
          set -euxo pipefail
          mkdir -p /tmp/routes-v248
          grep -RniE "Test magazine and assessment routes|magazine.*assessment|assessment.*magazine|Magazine production|research_summaries_published" .github/workflows tests scripts \
            | tee /tmp/routes-v248/search.txt || true
      - name: Run candidate modules independently
        run: |
          python - <<'PY'
          from __future__ import annotations
          import pathlib, subprocess, sys
          out = pathlib.Path('/tmp/routes-v248')
          candidates = []
          for path in sorted(pathlib.Path('tests').glob('test_*.py')):
              text = path.read_text(encoding='utf-8', errors='replace').lower()
              if 'magazine' in text and ('assessment' in text or 'التقييم' in text):
                  candidates.append(path)
          failures = []
          for path in candidates:
              module = path.with_suffix('').as_posix().replace('/', '.')
              result = subprocess.run([sys.executable, '-m', 'unittest', '-v', module], text=True, capture_output=True)
              log = result.stdout + '\n' + result.stderr
              (out / f'{path.stem}.log').write_text(log, encoding='utf-8')
              print(f'===== {module} rc={result.returncode} =====')
              print(log[-16000:])
              if result.returncode:
                  failures.append(module)
          (out / 'summary.txt').write_text(f'candidates={[p.as_posix() for p in candidates]!r}\nfailures={failures!r}\n', encoding='utf-8')
          print({'candidates': [p.as_posix() for p in candidates], 'failures': failures})
          PY
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-target-routes-v248
          path: /tmp/routes-v248
          if-no-files-found: error
          retention-days: 7
