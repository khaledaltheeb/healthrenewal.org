name: Repair quiz text contrast v256

on:
  push:
    branches: [main]
    paths:
      - "scripts/patch_quiz_text_contrast_v256.py"
      - ".github/workflows/repair-quiz-text-contrast-v256.yml"
      - ".github/workflows/repair-tools-real-dom-v253.yml"
      - ".github/workflows/repair-quiz-contrast-v254.yml"
      - ".github/workflows/repair-quiz-text-color-v255.yml"
  workflow_run:
    workflows: ["Deploy validated main to GitHub Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: repair-quiz-text-contrast-v256
  cancel-in-progress: false

jobs:
  repair-and-deploy:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repair source
        uses: actions/checkout@v4
        with:
          ref: main
          show-progress: false

      - name: Resolve latest validated production artifact
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def get(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)

          workflows = get(f"https://api.github.com/repos/{repo}/actions/workflows?per_page=100")["workflows"]
          matches = [item for item in workflows if item.get("name") == "Audit production discovery contract v220"]
          if len(matches) != 1:
              raise SystemExit(f"validated workflow not found uniquely: {matches}")
          workflow_id = matches[0]["id"]
          runs = get(
              f"https://api.github.com/repos/{repo}/actions/workflows/{workflow_id}/runs"
              "?branch=main&status=success&per_page=30"
          ).get("workflow_runs", [])
          selected = None
          for run in runs:
              artifacts = get(run["artifacts_url"]).get("artifacts", [])
              if any(a.get("name") == "validated-production-site" and not a.get("expired") for a in artifacts):
                  selected = run
                  break
          if not selected:
              raise SystemExit("no non-expired validated-production-site artifact was found")
          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as handle:
              handle.write(f"run_id={selected['id']}\n")
              handle.write(f"source_sha={selected['head_sha']}\n")
          print(json.dumps({"run_id": selected["id"], "source_sha": selected["head_sha"]}, indent=2))
          PY

      - name: Download validated site
        uses: actions/download-artifact@v4
        with:
          name: validated-production-site
          path: patched-site
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply adaptive white and light-blue text repair
        run: |
          set -euxo pipefail
          python -m py_compile scripts/patch_quiz_text_contrast_v256.py
          python scripts/patch_quiz_text_contrast_v256.py patched-site | tee /tmp/quiz-v256-first.json
          cp patched-site/tools/quiz/index.html /tmp/quiz-v256-first.html
          python scripts/patch_quiz_text_contrast_v256.py patched-site | tee /tmp/quiz-v256-second.json
          cmp /tmp/quiz-v256-first.html patched-site/tools/quiz/index.html
          python - <<'PY'
          import json
          from pathlib import Path
          first=json.loads(Path('/tmp/quiz-v256-first.json').read_text(encoding='utf-8'))
          second=json.loads(Path('/tmp/quiz-v256-second.json').read_text(encoding='utf-8'))
          quiz=Path('patched-site/tools/quiz/index.html').read_text(encoding='utf-8')
          assert first['version']==256 and first['status']=='patched',first
          assert second['changed'] is False,second
          assert quiz.count('id="quiz-text-contrast-v256-style"')==1
          assert quiz.count('id="quiz-text-contrast-v256-runtime"')==1
          assert '#ffffff' in quiz and '#eaf7ff' in quiz
          assert 'data-quiz-dark-surface' in quiz
          assert 'MutationObserver' in quiz
          PY

      - name: Install Chromium audit runtime
        run: |
          set -euxo pipefail
          python -m pip install --disable-pip-version-check 'playwright>=1.50,<2'
          python -m playwright install --with-deps chromium

      - name: Verify generated quiz contrast before deployment
        run: |
          set -euxo pipefail
          python -m http.server 8765 --directory patched-site >/tmp/quiz-v256-http.log 2>&1 &
          echo $! >/tmp/quiz-v256-http.pid
          python - <<'PY'
          import json
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          audit_script = r'''() => {
            const parse=v=>{const m=String(v||'').match(/rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*([\d.]+))?/i);return m?[+m[1],+m[2],+m[3],m[4]===undefined?1:+m[4]]:null};
            const lum=c=>{const a=c.slice(0,3).map(n=>{n/=255;return n<=.04045?n/12.92:Math.pow((n+.055)/1.055,2.4)});return .2126*a[0]+.7152*a[1]+.0722*a[2]};
            const ratio=(a,b)=>{a=lum(a);b=lum(b);return (Math.max(a,b)+.05)/(Math.min(a,b)+.05)};
            const bg=e=>{let n=e;while(n&&n instanceof HTMLElement){const c=parse(getComputedStyle(n).backgroundColor);if(c&&c[3]>=.55)return c;n=n.parentElement}return [255,255,255,1]};
            const visible=e=>{const r=e.getBoundingClientRect(),s=getComputedStyle(e);return r.width>0&&r.height>0&&s.display!=='none'&&s.visibility!=='hidden'&&+s.opacity>=.05&&(e.textContent||'').trim().length>0};
            const nodes=[...document.querySelectorAll('main [data-quiz-text-painted="v256"]')].filter(visible);
            const rows=nodes.map(e=>{const fg=parse(getComputedStyle(e).color),back=bg(e);return {tag:e.tagName,text:(e.textContent||'').trim().slice(0,90),fg:getComputedStyle(e).color,bg:getComputedStyle(e).backgroundColor,effectiveBg:back,ratio:fg?ratio(fg,back):0,dark:lum(back)<.48}});
            return {painted:nodes.length,darkTextRows:rows.filter(x=>x.dark).length,failures:rows.filter(x=>x.ratio<4.5),hasQuestion:(document.body.innerText||'').includes('السؤال'),styleBlocks:document.querySelectorAll('#quiz-text-contrast-v256-style').length,runtimeBlocks:document.querySelectorAll('#quiz-text-contrast-v256-runtime').length};
          }'''

          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              page=browser.new_page(viewport={'width':1440,'height':1100},color_scheme='dark',reduced_motion='reduce')
              response=page.goto('http://127.0.0.1:8765/tools/quiz/?v=256',wait_until='networkidle',timeout=90000)
              assert response and response.status==200,response
              page.wait_for_function("Number(document.documentElement.getAttribute('data-quiz-text-contrast-applied')||0)>=4",timeout=30000)
              audit=page.evaluate(audit_script)
              page.screenshot(path='/tmp/quiz-v256-before.png',full_page=True)
              browser.close()
          assert audit['painted']>=4,audit
          assert audit['hasQuestion'] is True,audit
          assert audit['failures']==[],audit
          assert audit['styleBlocks']==1 and audit['runtimeBlocks']==1,audit
          Path('/tmp/quiz-v256-before.json').write_text(json.dumps(audit,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(audit,ensure_ascii=False,indent=2))
          PY
          kill "$(cat /tmp/quiz-v256-http.pid)"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload repaired Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: patched-site

      - name: Deploy repaired quiz
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live quiz contrast
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euxo pipefail
          python - <<'PY'
          import json,os,time
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          base=os.environ['PAGE_URL'].rstrip('/')+'/'
          url=base+'tools/quiz/?v=quiz-text-contrast-256-'+os.environ['SOURCE_SHA']
          last=None
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              for attempt in range(1,16):
                  page=browser.new_page(viewport={'width':1440,'height':1100},color_scheme='dark',reduced_motion='reduce')
                  try:
                      response=page.goto(url+f'-{attempt}',wait_until='networkidle',timeout=90000)
                      if not response or response.status!=200:
                          raise AssertionError(response.status if response else None)
                      page.wait_for_function("Number(document.documentElement.getAttribute('data-quiz-text-contrast-applied')||0)>=4",timeout=25000)
                      audit=page.evaluate(r'''() => {
                        const parse=v=>{const m=String(v||'').match(/rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*([\d.]+))?/i);return m?[+m[1],+m[2],+m[3],m[4]===undefined?1:+m[4]]:null};
                        const lum=c=>{const a=c.slice(0,3).map(n=>{n/=255;return n<=.04045?n/12.92:Math.pow((n+.055)/1.055,2.4)});return .2126*a[0]+.7152*a[1]+.0722*a[2]};
                        const ratio=(a,b)=>{a=lum(a);b=lum(b);return (Math.max(a,b)+.05)/(Math.min(a,b)+.05)};
                        const bg=e=>{let n=e;while(n&&n instanceof HTMLElement){const c=parse(getComputedStyle(n).backgroundColor);if(c&&c[3]>=.55)return c;n=n.parentElement}return [255,255,255,1]};
                        const visible=e=>{const r=e.getBoundingClientRect(),s=getComputedStyle(e);return r.width>0&&r.height>0&&s.display!=='none'&&s.visibility!=='hidden'&&+s.opacity>=.05&&(e.textContent||'').trim().length>0};
                        const nodes=[...document.querySelectorAll('main [data-quiz-text-painted="v256"]')].filter(visible);
                        const failures=nodes.map(e=>{const fg=parse(getComputedStyle(e).color),back=bg(e);return {text:(e.textContent||'').trim().slice(0,80),ratio:fg?ratio(fg,back):0}}).filter(x=>x.ratio<4.5);
                        return {painted:nodes.length,failures,hasQuestion:(document.body.innerText||'').includes('السؤال'),styleBlocks:document.querySelectorAll('#quiz-text-contrast-v256-style').length,runtimeBlocks:document.querySelectorAll('#quiz-text-contrast-v256-runtime').length};
                      }''')
                      if audit['painted']<4 or audit['failures'] or not audit['hasQuestion'] or audit['styleBlocks']!=1 or audit['runtimeBlocks']!=1:
                          raise AssertionError(audit)
                      page.screenshot(path='/tmp/quiz-v256-live.png',full_page=True)
                      last=audit
                      page.close()
                      break
                  except Exception as exc:
                      last={'attempt':attempt,'error':repr(exc)}
                      page.close()
                      time.sleep(10)
              browser.close()
          assert isinstance(last,dict) and 'error' not in last,last
          evidence={'version':256,'status':'live-passed','url':url,**last}
          Path('/tmp/quiz-v256-live.json').write_text(json.dumps(evidence,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(evidence,ensure_ascii=False,indent=2))
          PY

      - name: Retain quiz contrast evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quiz-text-contrast-v256
          path: |
            patched-site/api/quiz-text-contrast-v256.json
            /tmp/quiz-v256-first.json
            /tmp/quiz-v256-second.json
            /tmp/quiz-v256-before.json
            /tmp/quiz-v256-before.png
            /tmp/quiz-v256-live.json
            /tmp/quiz-v256-live.png
            /tmp/quiz-v256-http.log
          if-no-files-found: warn
          retention-days: 30
