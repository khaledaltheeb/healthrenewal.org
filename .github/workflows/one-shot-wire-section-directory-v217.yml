name: One-shot wire section directory v217

on:
  push:
    branches: ["agent/institutional-section-directory-v217"]
    paths:
      - ".github/workflows/one-shot-wire-section-directory-v217.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/institutional-section-directory-v217
          fetch-depth: 0
      - name: Wire publisher before the health gate
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply_homepage_v20.py')
          text = path.read_text(encoding='utf-8')
          report_old = '        "cognitive_lab_inventory_publisher": 210,\n'
          report_new = report_old + '        "section_directory_publisher": 217,\n'
          if '"section_directory_publisher": 217' not in text:
              if report_old not in text:
                  raise SystemExit('Report insertion point not found')
              text = text.replace(report_old, report_new, 1)
          call_old = '    publish_api_sitemap()\n    run_publisher("enforce_health_publication_gate_v192.py")\n'
          call_new = '    publish_api_sitemap()\n    run_publisher("publish_section_directory_v217.py")\n    run_publisher("enforce_health_publication_gate_v192.py")\n'
          if 'run_publisher("publish_section_directory_v217.py")' not in text:
              if call_old not in text:
                  raise SystemExit('Publisher insertion point not found')
              text = text.replace(call_old, call_new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile scripts/apply_homepage_v20.py scripts/publish_section_directory_v217.py
          rm .github/workflows/one-shot-wire-section-directory-v217.yml
      - name: Commit production wiring and remove this workflow
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/apply_homepage_v20.py scripts/publish_section_directory_v217.py .github/workflows/one-shot-wire-section-directory-v217.yml
          git commit -m "ربط دليل الأقسام المؤسسي بخط الإنتاج"
          git push origin HEAD:agent/institutional-section-directory-v217
