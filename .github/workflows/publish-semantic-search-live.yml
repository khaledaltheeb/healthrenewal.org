name: Publish semantic search live

on:
  workflow_run:
    workflows: ['Semantic search index']
    types: [completed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-semantic-search-live.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: publish-semantic-search-live
  cancel-in-progress: true

jobs:
  publish:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Verify Pages-compatible semantic package
        id: package
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, json, os
          from pathlib import Path

          manifest_path=Path('ai-search/data/manifest.json')
          manifest=json.loads(manifest_path.read_text(encoding='utf-8'))
          ready=(
              manifest.get('version') == 2
              and manifest.get('ready') is True
              and manifest.get('model') == 'intfloat/multilingual-e5-small'
              and manifest.get('modelRevision') == 'fd1525a9fd15316a2d503bf26ab031a61d056e98'
              and manifest.get('browserModel') == 'Xenova/multilingual-e5-small'
              and manifest.get('browserModelRevision') == '761b726dd34fb83930e26aab4e9ac3899aa1fa78'
              and manifest.get('dimensions') == 384
              and manifest.get('dtype') == 'float16'
              and manifest.get('normalized') is True
              and bool(manifest.get('shards'))
              and all(shard.get('embeddingsJson') for shard in manifest.get('shards',[]))
          )
          output=os.environ['GITHUB_OUTPUT']
          with open(output,'a',encoding='utf-8') as handle:
              handle.write(f"ready={'true' if ready else 'false'}\n")
          if not ready:
              print('Pages-compatible E5 package is not available yet; the semantic build will trigger this workflow again.')
              raise SystemExit(0)

          for shard in manifest['shards']:
              metadata_path=Path('ai-search/data')/shard['metadata']
              json_path=Path('ai-search/data')/shard['embeddingsJson']
              metadata_bytes=metadata_path.read_bytes()
              json_bytes=json_path.read_bytes()
              payload=json.loads(json_bytes)
              raw=base64.b64decode(payload['data'], validate=True)
              assert payload['version'] == 1
              assert payload['encoding'] == 'base64'
              assert payload['dtype'] == 'float16'
              assert payload['endianness'] == 'little'
              assert payload['dimensions'] == manifest['dimensions']
              assert payload['count'] == shard['count']
              assert payload['byteLength'] == shard['embeddingBytes'] == len(raw)
              assert payload['sha256'] == shard['embeddingSha256'] == hashlib.sha256(raw).hexdigest()
              assert shard['metadataBytes'] == len(metadata_bytes)
              assert shard['metadataSha256'] == hashlib.sha256(metadata_bytes).hexdigest()
              assert shard['embeddingsJsonBytes'] == len(json_bytes)
              assert shard['embeddingsJsonSha256'] == hashlib.sha256(json_bytes).hexdigest()
          print({
              'generatedAt':manifest['generatedAt'],
              'documents':manifest['documentCount'],
              'chunks':manifest['chunkCount'],
              'shards':len(manifest['shards']),
          })
          PY

      - name: Dispatch the existing institutional Pages deployment
        if: steps.package.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/dispatch.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            --data '{"ref":"main"}' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-canonical-seo-live-v363.yml/dispatches")"
          if [[ "$code" != '204' ]]; then
            cat /tmp/dispatch.json
            echo "::error::Canonical Pages dispatch returned HTTP ${code}"
            exit 1
          fi

      - name: Verify the live E5 package after deployment
        if: steps.package.outputs.ready == 'true'
        run: |
          set -euo pipefail
          root='https://healthrenewal.org/ai-search/'
          source_generated="$(python -c "import json;print(json.load(open('ai-search/data/manifest.json'))['generatedAt'])")"
          ready=0
          for attempt in $(seq 1 120); do
            if curl -fsS --retry 2 -H 'Cache-Control: no-cache' \
              "${root}data/manifest.json?publish=${GITHUB_RUN_ID}-${attempt}" \
              -o /tmp/live-manifest.json; then
              if SOURCE_GENERATED="$source_generated" python - <<'PY'
          import json,os
          data=json.load(open('/tmp/live-manifest.json',encoding='utf-8'))
          assert data.get('version') == 2
          assert data.get('ready') is True
          assert data.get('generatedAt') == os.environ['SOURCE_GENERATED']
          assert data.get('modelRevision') == 'fd1525a9fd15316a2d503bf26ab031a61d056e98'
          assert data.get('browserModelRevision') == '761b726dd34fb83930e26aab4e9ac3899aa1fa78'
          assert data.get('dimensions') == 384
          assert data.get('dtype') == 'float16'
          assert data.get('normalized') is True
          assert data.get('shards') and all(item.get('embeddingsJson') for item in data['shards'])
          PY
              then ready=1; break; fi
            fi
            echo "Waiting for the E5 release: ${attempt}/120"
            sleep 5
          done
          test "$ready" = 1

          python - <<'PY'
          import base64,hashlib,json,subprocess
          from pathlib import Path

          root='https://healthrenewal.org/ai-search/data/'
          manifest=json.load(open('/tmp/live-manifest.json',encoding='utf-8'))
          for index,shard in enumerate(manifest['shards']):
              metadata=Path(f'/tmp/live-meta-{index}.json')
              package=Path(f'/tmp/live-vectors-{index}.json')
              subprocess.run(['curl','-fsS','--retry','3',root+shard['metadata']+f'?publish={index}', '-o',str(metadata)],check=True)
              subprocess.run(['curl','-fsS','--retry','3',root+shard['embeddingsJson']+f'?publish={index}', '-o',str(package)],check=True)
              metadata_bytes=metadata.read_bytes()
              package_bytes=package.read_bytes()
              payload=json.loads(package_bytes)
              raw=base64.b64decode(payload['data'],validate=True)
              assert len(json.loads(metadata_bytes)) == shard['count']
              assert len(metadata_bytes) == shard['metadataBytes']
              assert hashlib.sha256(metadata_bytes).hexdigest() == shard['metadataSha256']
              assert len(package_bytes) == shard['embeddingsJsonBytes']
              assert hashlib.sha256(package_bytes).hexdigest() == shard['embeddingsJsonSha256']
              assert len(raw) == shard['embeddingBytes'] == shard['count'] * manifest['dimensions'] * 2
              assert hashlib.sha256(raw).hexdigest() == shard['embeddingSha256'] == payload['sha256']
          print({
              'passed':True,
              'generatedAt':manifest['generatedAt'],
              'documents':manifest['documentCount'],
              'chunks':manifest['chunkCount'],
              'shards':len(manifest['shards']),
              'dimensions':manifest['dimensions'],
          })
          PY
