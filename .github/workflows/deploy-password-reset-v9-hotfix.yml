name: Deploy password reset v9 hotfix

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/deploy-password-reset-v9-hotfix.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: password-reset-v9-hotfix-pages
  cancel-in-progress: false

env:
  HOTFIX_RETRY: "2026-07-31T01:10:00+03:00"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      SOURCE_RUN_ID: "30583193860"
      SOURCE_ARTIFACT: validated-production-site
      SITE_URL: https://healthrenewal.org/
      IDENTITY_API: https://pterminology-specialist-accounts.pterminology-826ac349.workers.dev
    steps:
      - name: Checkout current main for hotfix files and receipt
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download exact currently deployed production artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          path: _site
          repository: khaledaltheeb/
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify production artifact and inject only password reset v9
        shell: bash
        run: |
          set -euo pipefail
          test -f _site/index.html
          test -f _site/deployment.json
          test -f specialists-partners/password-reset/index.html
          test -f specialists-partners/password-reset/reset-v9.js
          test -f specialists-partners/password-reset/reset-v9.css

          before_count="$(find _site -type f | wc -l | tr -d ' ')"
          mkdir -p _site/specialists-partners/password-reset
          cp specialists-partners/password-reset/index.html _site/specialists-partners/password-reset/index.html
          cp specialists-partners/password-reset/reset-v9.js _site/specialists-partners/password-reset/reset-v9.js
          cp specialists-partners/password-reset/reset-v9.css _site/specialists-partners/password-reset/reset-v9.css
          touch _site/.nojekyll
          after_count="$(find _site -type f | wc -l | tr -d ' ')"

          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          site=Path('_site')
          page=site/'specialists-partners/password-reset/index.html'
          script=site/'specialists-partners/password-reset/reset-v9.js'
          style=site/'specialists-partners/password-reset/reset-v9.css'
          html=page.read_text(encoding='utf-8')
          js=script.read_text(encoding='utf-8')
          assert 'هذه صفحة مستقلة وآمنة' in html
          assert 'reset-v9.js?v=9.0.0' in html
          assert 'runtime-config.js' not in html
          assert 'admin.js' not in html
          assert 'https://pterminology-specialist-accounts.pterminology-826ac349.workers.dev' in js
          assert '/v1/auth/password/reset' in js
          assert 'pterminology-password-reset-v9' in js
          assert 'PT_SPECIALIST_CONFIG' not in js
          assert style.stat().st_size > 500
          deployment=json.loads((site/'deployment.json').read_text(encoding='utf-8'))
          report={
            'schema_version':1,
            'source_artifact':'validated-production-site',
            'source_workflow_run_id':30583193860,
            'source_deployment_commit':deployment.get('commit'),
            'injected_paths':['specialists-partners/password-reset/index.html','specialists-partners/password-reset/reset-v9.js','specialists-partners/password-reset/reset-v9.css'],
            'hashes':{str(p.relative_to(site)):hashlib.sha256(p.read_bytes()).hexdigest() for p in (page,script,style)}
          }
          Path('/tmp/hotfix-build.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

          expected_delta=4
          actual_delta=$((after_count-before_count))
          if [[ -e _site/specialists-partners/password-reset/index.html && "${actual_delta}" -ge 0 && "${actual_delta}" -le "${expected_delta}" ]]; then
            echo "Production artifact preserved; password reset directory injected."
          else
            echo "::error::Unexpected artifact file delta: ${actual_delta}"
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload patched production artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy patched artifact
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live page, script, and Worker route
        shell: bash
        run: |
          set -euo pipefail
          page_url="${SITE_URL}/specialists-partners/password-reset/"
          js_url="${SITE_URL}/specialists-partners/password-reset/reset-v9.js"
          passed=false
          for attempt in {1..60}; do
            stamp="$(date +%s)"
            page_status="$(curl -sS -L --max-time 20 -o /tmp/live-page.html -w '%{http_code}' "${page_url}?v=9&probe=${stamp}" || true)"
            js_status="$(curl -sS -L --max-time 20 -o /tmp/live-reset.js -w '%{http_code}' "${js_url}?v=9.0.0&probe=${stamp}" || true)"
            if [[ "${page_status}" == "200" && "${js_status}" == "200" ]] \
              && grep -q 'هذه صفحة مستقلة وآمنة' /tmp/live-page.html \
              && grep -q 'reset-v9.js?v=9.0.0' /tmp/live-page.html \
              && grep -q 'pterminology-password-reset-v9' /tmp/live-reset.js \
              && grep -q '/v1/auth/password/reset' /tmp/live-reset.js \
              && ! grep -q 'PT_SPECIALIST_CONFIG' /tmp/live-reset.js; then
              passed=true
              break
            fi
            sleep 5
          done
          [[ "${passed}" == "true" ]] || { echo "::error::Password reset v9 files are not live"; exit 1; }

          route_status="$(curl -sS --max-time 30 -o /tmp/live-route.json -w '%{http_code}' -X POST \
            -H 'Origin: https://healthrenewal.org' \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json;charset=UTF-8' \
            -H 'x-requested-with: pterminology-password-reset-v9' \
            --data '{}' "${IDENTITY_API}/v1/auth/password/reset" || true)"
          export ROUTE_STATUS="${route_status}"
          python - <<'PY'
          import hashlib, json, os
          from datetime import datetime, timezone
          from pathlib import Path
          build=json.loads(Path('/tmp/hotfix-build.json').read_text(encoding='utf-8'))
          route=json.loads(Path('/tmp/live-route.json').read_text(encoding='utf-8'))
          page=Path('/tmp/live-page.html').read_bytes()
          script=Path('/tmp/live-reset.js').read_bytes()
          report={**build,'checked_at':datetime.now(timezone.utc).isoformat(),'page_url':'https://healthrenewal.org/specialists-partners/password-reset/','page_http_status':200,'script_http_status':200,'route_http_status':int(os.environ['ROUTE_STATUS']),'route_error':route.get('error'),'live_hashes':{'index.html':hashlib.sha256(page).hexdigest(),'reset-v9.js':hashlib.sha256(script).hexdigest()},'passed':int(os.environ['ROUTE_STATUS'])==400 and route.get('error')=='missing_field'}
          assert report['passed'], report
          Path('reports/password-reset-v9-hotfix-deployment.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY

      - name: Commit safe deployment receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/password-reset-v9-hotfix-deployment.json
          git commit -m "chore: record password reset v9 hotfix deployment"
          git pull --rebase origin main
          git push origin HEAD:main
