name: Synchronize outside-the-box v306 with current main temporary

on:
  push:
    branches: ["agent/outside-the-box-scientific-review-v305"]
    paths:
      - ".github/workflows/sync-main-outside-review-v306-temporary.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/outside-the-box-scientific-review-v305
          fetch-depth: 0
      - name: Merge current main and resolve the production chain explicitly
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          if git merge --no-edit origin/main; then
            git push origin HEAD:agent/outside-the-box-scientific-review-v305
            exit 0
          fi
          conflicts="$(git diff --name-only --diff-filter=U)"
          test "${conflicts}" = "scripts/apply_homepage_v20.py"
          git checkout --theirs scripts/apply_homepage_v20.py
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply_homepage_v20.py')
          text = path.read_text(encoding='utf-8')
          anchor = '        "outside_the_box_reference_assets_publisher": 303,\n'
          additions = (
              anchor
              + '        "outside_the_box_review_governance_publisher": 305,\n'
              + '        "outside_the_box_quality_audit": 306,\n'
          )
          if '"outside_the_box_review_governance_publisher": 305' not in text:
              if text.count(anchor) != 1:
                  raise SystemExit('outside-the-box metadata anchor missing or ambiguous')
              text = text.replace(anchor, additions, 1)
          run_anchor = '    run_publisher("publish_outside_the_box_reference_assets_v303.py")\n'
          run_additions = (
              run_anchor
              + '    run_publisher("publish_outside_the_box_review_governance_v305.py")\n'
              + '    run_publisher("audit_outside_the_box_quality_v306.py")\n'
          )
          if 'run_publisher("publish_outside_the_box_review_governance_v305.py")' not in text:
              if text.count(run_anchor) != 1:
                  raise SystemExit('outside-the-box publisher anchor missing or ambiguous')
              text = text.replace(run_anchor, run_additions, 1)
          path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile scripts/apply_homepage_v20.py scripts/publish_outside_the_box_review_governance_v305.py scripts/audit_outside_the_box_quality_v306.py
          git add scripts/apply_homepage_v20.py
          git commit --no-edit
          git push origin HEAD:agent/outside-the-box-scientific-review-v305
