name: Verify home-sector live deployment v238

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/verify_home_sector_deployment_v238.py"
      - "tests/test_home_sector_deployment_v238.py"
      - ".github/workflows/verify-home-sector-live-v238.yml"
  workflow_run:
    workflows: ["Deploy validated main to GitHub Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  statuses: write

concurrency:
  group: home-sector-live-v238-${{ github.event.workflow_run.id || github.ref }}
  cancel-in-progress: false

jobs:
  validate-contract:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile and test the live deployment verifier
        run: |
          set -euxo pipefail
          python -m py_compile scripts/verify_home_sector_deployment_v238.py tests/test_home_sector_deployment_v238.py
          python -m unittest -v tests.test_home_sector_deployment_v238

  verify-live:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
      REQUIRED_HOME_SHA: 322e2a36ab6925788050d66026799ca5500f471b
      BASE_URL: https://healthrenewal.org/
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout the deployed source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publish pending verification status
        run: |
          python - <<'PY'
          import json, os, urllib.request
          url=f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['EXPECTED_SHA']}"
          body=json.dumps({"state":"pending","context":"home-sector-live-v238","description":"Checking live home-sector pages"}).encode()
          req=urllib.request.Request(url,data=body,method='POST',headers={"Authorization":f"Bearer {os.environ['GH_TOKEN']}","Accept":"application/vnd.github+json","Content-Type":"application/json","User-Agent":"home-sector-live-v238"})
          urllib.request.urlopen(req,timeout=30).read()
          PY

      - name: Prove the deployed commit contains the home-sector merge
        run: |
          python - <<'PY'
          import json, os, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; required=os.environ['REQUIRED_HOME_SHA']; candidate=os.environ['EXPECTED_SHA']
          req=urllib.request.Request(f'https://api.github.com/repos/{repo}/compare/{required}...{candidate}',headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','User-Agent':'home-sector-live-v238'})
          with urllib.request.urlopen(req,timeout=30) as response: data=json.loads(response.read())
          assert data.get('status') in {'ahead','identical'},data
          print({'required_home_sha':required,'deployed_candidate_sha':candidate,'comparison_status':data['status']})
          PY

      - name: Download deployment report hub and all twenty live guides
        run: |
          set -euxo pipefail
          root=/tmp/home-sector-live-v238
          rm -rf "${root}"
          mkdir -p "${root}/api" "${root}/sectors/home"
          token="${EXPECTED_SHA}-$(date +%s)"
          curl --retry 6 --retry-delay 4 -H 'Cache-Control: no-cache' -fsSL "${BASE_URL}deployment.json?v=${token}" -o "${root}/deployment.json"
          curl --retry 6 --retry-delay 4 -H 'Cache-Control: no-cache' -fsSL "${BASE_URL}api/home-sector-v234.json?v=${token}" -o "${root}/api/home-sector-v234.json"
          curl --retry 6 --retry-delay 4 -H 'Cache-Control: no-cache' -fsSL "${BASE_URL}sectors/home/?v=${token}" -o "${root}/sectors/home/index.html"
          curl --retry 6 --retry-delay 4 -H 'Cache-Control: no-cache' -fsSL "${BASE_URL}robots.txt?v=${token}" -o "${root}/robots.txt"
          python - <<'PY'
          import json, os, pathlib, subprocess
          root=pathlib.Path('/tmp/home-sector-live-v238')
          data=json.loads(pathlib.Path('content/sectors-v10/home.json').read_text(encoding='utf-8'))
          base=os.environ['BASE_URL']; token=os.environ['EXPECTED_SHA']+'-articles'
          for item in data['articles']:
              slug=item['slug']; folder=root/'sectors'/'home'/slug; folder.mkdir(parents=True,exist_ok=True)
              subprocess.run(['curl','--retry','6','--retry-delay','4','-H','Cache-Control: no-cache','-fsSL',f'{base}sectors/home/{slug}/?v={token}', '-o',str(folder/'index.html')],check=True)
          PY

      - name: Verify SHA report depth indexability and every guide
        run: |
          set -euxo pipefail
          python scripts/verify_home_sector_deployment_v238.py \
            /tmp/home-sector-live-v238 \
            --source content/sectors-v10/home.json \
            --expected-sha "${EXPECTED_SHA}" \
            --mode live

      - name: Publish successful verification status
        if: success()
        run: |
          python - <<'PY'
          import json, os, urllib.request
          url=f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['EXPECTED_SHA']}"
          body=json.dumps({"state":"success","context":"home-sector-live-v238","description":"Live hub and twenty guides match deployed SHA","target_url":f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"}).encode()
          req=urllib.request.Request(url,data=body,method='POST',headers={"Authorization":f"Bearer {os.environ['GH_TOKEN']}","Accept":"application/vnd.github+json","Content-Type":"application/json","User-Agent":"home-sector-live-v238"})
          urllib.request.urlopen(req,timeout=30).read()
          PY

      - name: Publish failed verification status
        if: failure()
        run: |
          python - <<'PY'
          import json, os, urllib.request
          url=f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['EXPECTED_SHA']}"
          body=json.dumps({"state":"failure","context":"home-sector-live-v238","description":"Live home-sector verification failed","target_url":f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"}).encode()
          req=urllib.request.Request(url,data=body,method='POST',headers={"Authorization":f"Bearer {os.environ['GH_TOKEN']}","Accept":"application/vnd.github+json","Content-Type":"application/json","User-Agent":"home-sector-live-v238"})
          urllib.request.urlopen(req,timeout=30).read()
          PY

      - name: Upload live deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-sector-live-v238
          path: /tmp/home-sector-live-v238/api/home-sector-deployment-v238.json
          if-no-files-found: error
          retention-days: 30
