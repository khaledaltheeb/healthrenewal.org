name: Temporary deep sitemap audit

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  audit:
    if: github.event.issue.title == '[diagnostic] sitemap deep audit 2026-07-31'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Audit repository and live routes
        run: |
          python3 - <<'PY' > /tmp/deep-report.txt
          from pathlib import Path
          from urllib.parse import urljoin, urlparse, urldefrag
          from urllib.request import Request, urlopen
          from html.parser import HTMLParser
          import collections, json, re, time, xml.etree.ElementTree as ET

          root=Path('.')
          files=[p for p in root.rglob('*') if p.is_file() and '.git' not in p.parts]
          ext=collections.Counter((p.suffix.lower() or '(none)') for p in files)
          print('## Repository file types')
          print('total_files=',len(files))
          for k,v in ext.most_common(30): print(f'{k}: {v}')

          print('\n## Existing sitemap files')
          all_locs=[]
          for p in sorted(root.glob('sitemap*.xml')):
              try:
                  tree=ET.parse(p)
                  locs=[(x.text or '').strip() for x in tree.iter() if x.tag.endswith('loc')]
                  urls=[u for u in locs if not u.endswith('.xml')]
                  maps=[u for u in locs if u.endswith('.xml')]
                  print(f'{p.name}: locs={len(locs)} urls={len(urls)} child_sitemaps={len(maps)} old_domain={sum("khaledaltheeb.github.io/pterminology-site" in u for u in locs)} new_domain={sum(u.startswith("https://healthrenewal.org") for u in locs)}')
                  all_locs.extend(urls)
              except Exception as e:
                  print(f'{p.name}: PARSE_ERROR {e!r}')
          print('all_sitemaps_url_entries=',len(all_locs))
          print('all_sitemaps_unique_urls=',len(set(all_locs)))

          print('\n## Structured content candidates')
          for suffix in ('.json','.jsonl','.md','.csv','.yaml','.yml'):
              candidates=sorted([p for p in files if p.suffix.lower()==suffix], key=lambda p:p.stat().st_size, reverse=True)
              print(f'{suffix}: files={len(candidates)}')
              for p in candidates[:15]: print(f'  {p.as_posix()} bytes={p.stat().st_size}')

          class Links(HTMLParser):
              def __init__(self): super().__init__(); self.hrefs=[]
              def handle_starttag(self,tag,attrs):
                  if tag.lower()=='a':
                      d=dict(attrs); h=d.get('href')
                      if h: self.hrefs.append(h)

          start='https://healthrenewal.org/'
          queue=collections.deque([start]); seen=set(); ok=[]; redirects=[]; errors=[]
          asset_ext={'.css','.js','.png','.jpg','.jpeg','.gif','.svg','.webp','.ico','.pdf','.zip','.xml','.txt','.json','.mp4','.mp3','.wav','.woff','.woff2','.ttf','.eot'}
          while queue and len(seen)<5000:
              url=queue.popleft(); url=urldefrag(url)[0]
              parsed=urlparse(url)
              if parsed.scheme not in ('http','https') or parsed.netloc not in ('healthrenewal.org','www.healthrenewal.org'): continue
              normalized='https://healthrenewal.org'+(parsed.path or '/')
              if parsed.query: normalized += '?' + parsed.query
              if normalized in seen: continue
              if Path(parsed.path).suffix.lower() in asset_ext: continue
              seen.add(normalized)
              try:
                  req=Request(normalized,headers={'User-Agent':'HealthRenewalSitemapAudit/1.0'})
                  with urlopen(req,timeout=20) as r:
                      final=r.geturl(); code=r.status; ctype=r.headers.get('Content-Type','')
                      data=r.read(2_000_000)
                  if final.rstrip('/')!=normalized.rstrip('/'): redirects.append((normalized,final,code))
                  if 200<=code<300 and 'text/html' in ctype:
                      ok.append(normalized)
                      parser=Links(); parser.feed(data.decode('utf-8','ignore'))
                      for href in parser.hrefs:
                          child=urldefrag(urljoin(final,href))[0]
                          cp=urlparse(child)
                          if cp.netloc in ('healthrenewal.org','www.healthrenewal.org') and cp.scheme in ('http','https'):
                              clean='https://healthrenewal.org'+(cp.path or '/')
                              if cp.query: clean+='?'+cp.query
                              if clean not in seen: queue.append(clean)
                  else: errors.append((normalized,code,ctype))
              except Exception as e: errors.append((normalized,'ERR',repr(e)))
              time.sleep(0.01)
          print('\n## Live crawl')
          print('seen_internal_nonasset_urls=',len(seen))
          print('healthy_html_urls=',len(set(ok)))
          print('redirects=',len(redirects))
          print('errors=',len(errors))
          print('queue_remaining=',len(queue))
          print('live_url_sample:')
          for u in sorted(set(ok))[:20]: print(' ',u)
          print('live_url_tail:')
          for u in sorted(set(ok))[-20:]: print(' ',u)
          print('error_sample:')
          for x in errors[:30]: print(' ',x)
          PY
      - name: Publish report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python3 - <<'PY' > /tmp/body.json
          import json
          from pathlib import Path
          report=Path('/tmp/deep-report.txt').read_text(errors='replace') if Path('/tmp/deep-report.txt').exists() else 'No report'
          print(json.dumps({'body':'## Sitemap deep audit\n\n```text\n'+report[-60000:]+'\n```'}))
          PY
          curl -fsSL -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" --data-binary @/tmp/body.json
