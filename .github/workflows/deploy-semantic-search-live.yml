name: Validate multilingual E5 package

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/deploy-semantic-search-live.yml"
      - "tests/test_e5_pages_deployment_v1.py"
      - "ai-search/**"
  workflow_run:
    workflows: ["Semantic search index"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-semantic-search-live.yml"
      - "tests/test_e5_pages_deployment_v1.py"
      - "ai-search/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e5-source-validation-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.workflow_run.id || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate E5 source package
        run: |
          set -euo pipefail
          python tests/test_e5_pages_deployment_v1.py
          python - <<'PY'
          import base64
          import hashlib
          import json
          from pathlib import Path

          root = Path("ai-search/data")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          assert manifest["version"] == 2 and manifest["ready"] is True
          assert manifest["model"] == "intfloat/multilingual-e5-small"
          assert manifest["dimensions"] == 384
          assert manifest["dtype"] == "float16"
          assert manifest["normalized"] is True
          assert manifest["documentCount"] > 0 and manifest["chunkCount"] > 0
          assert manifest["shards"]
          for shard in manifest["shards"]:
              metadata = (root / shard["metadata"]).read_bytes()
              package = (root / shard["embeddingsJson"]).read_bytes()
              payload = json.loads(package)
              raw = base64.b64decode(payload["data"], validate=True)
              assert len(metadata) == shard["metadataBytes"]
              assert hashlib.sha256(metadata).hexdigest() == shard["metadataSha256"]
              assert len(package) == shard["embeddingsJsonBytes"]
              assert hashlib.sha256(package).hexdigest() == shard["embeddingsJsonSha256"]
              assert len(raw) == shard["embeddingBytes"]
              assert hashlib.sha256(raw).hexdigest() == shard["embeddingSha256"] == payload["sha256"]
          print({"documents": manifest["documentCount"], "chunks": manifest["chunkCount"], "shards": len(manifest["shards"])})
          PY
