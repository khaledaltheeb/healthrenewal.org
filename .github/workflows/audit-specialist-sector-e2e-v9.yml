name: Audit specialist sector end to end v10.2

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/audit-specialist-sector-e2e-v9.yml"
      - "scripts/audit_specialist_sector_e2e_v10.py"
  workflow_run:
    workflows:
      - "Deploy validated main to GitHub Pages"
      - "Deploy specialist identity v10 production"
      - "Deploy specialists live messaging v5"
    types: [completed]
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: audit-specialist-sector-e2e-v10-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  read-only-audit:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SITE_BASE: https://healthrenewal.org/specialists-partners
      IDENTITY_API: https://pterminology-specialist-accounts.pterminology-826ac349.workers.dev
      CORE_API: https://pterminology-specialists.pterminology-826ac349.workers.dev
      SPECIALISTS_ADMIN_API_KEY: ${{ secrets.SPECIALISTS_ADMIN_API_KEY }}
      AUDIT_OUTPUT: specialist-sector-e2e-v10.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile the read-only auditor
        run: python -m py_compile scripts/audit_specialist_sector_e2e_v10.py

      - name: Audit live pages registries APIs and CORS without mutations
        run: python scripts/audit_specialist_sector_e2e_v10.py

      - name: Publish truthful operational summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report_path = Path(os.environ["AUDIT_OUTPUT"])
          if not report_path.is_file():
              print("::error::The live audit did not produce an evidence file.")
              raise SystemExit(1)
          report = json.loads(report_path.read_text(encoding="utf-8"))
          functional = report["functionalWithoutEmail"]
          operational = report["fullyOperational"]
          provider = report["protectedDeepHealth"]
          summary = [
              "## Specialist sector read-only audit v10.2",
              "",
              f"- Functional platform: **{functional}**",
              f"- Fully operational email provider: **{operational}**",
              f"- Live verified profiles: **{report['registries']['live']['providerCount']}**",
              f"- Identity version: **{report['identity']['version']}**",
              f"- Provider status code: **{provider.get('providerCode') or 'not checked'}**",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as target:
              target.write("\n".join(summary) + "\n")
          if not functional:
              print("::error::The specialist sector failed a required read-only contract.")
              raise SystemExit(1)
          if not operational:
              print("::warning::The platform is functional, but email-provider readiness is not confirmed.")
          PY

      - name: Retain read-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: specialist-sector-e2e-v10-${{ github.run_id }}
          path: ${{ env.AUDIT_OUTPUT }}
          if-no-files-found: error
          retention-days: 30
