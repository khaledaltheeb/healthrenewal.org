name: Audit specialist sector end to end v9

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/audit-specialist-sector-e2e-v9.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: audit-specialist-sector-e2e-v9
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SITE_BASE: https://khaledaltheeb.github.io/pterminology-site/specialists-partners
      IDENTITY_API: https://pterminology-specialist-accounts.pterminology-826ac349.workers.dev
      CORE_API: https://pterminology-specialists.pterminology-826ac349.workers.dev
      ADMIN_API_KEY: ${{ secrets.SPECIALISTS_ADMIN_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Audit live pages, APIs, and recovery delivery
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${ADMIN_API_KEY:-}" ]] || { echo "::error::SPECIALISTS_ADMIN_API_KEY missing"; exit 1; }
          mkdir -p reports /tmp/specialist-e2e

          probe_page() {
            local name="$1" url="$2"
            curl -sS -L --max-time 30 -o "/tmp/specialist-e2e/${name}.html" -w '%{http_code}' "${url}?e2e=${GITHUB_RUN_ID}-$(date +%s%N)" > "/tmp/specialist-e2e/${name}.status" || true
          }
          probe_page public "${SITE_BASE}/"
          probe_page account "${SITE_BASE}/account/"
          probe_page admin "${SITE_BASE}/admin/"
          probe_page recover "${SITE_BASE}/recover/"
          probe_page password_reset "${SITE_BASE}/password-reset/"
          probe_page portal "${SITE_BASE}/portal/"

          curl -sS --max-time 30 -o /tmp/specialist-e2e/identity-health.json -w '%{http_code}' "${IDENTITY_API}/health?e2e=${GITHUB_RUN_ID}" > /tmp/specialist-e2e/identity-health.status || true
          curl -sS --max-time 30 -o /tmp/specialist-e2e/core-health.json -w '%{http_code}' "${CORE_API}/health?e2e=${GITHUB_RUN_ID}" > /tmp/specialist-e2e/core-health.status || true

          api_post() {
            local name="$1" url="$2" origin="$3" body="$4"
            curl -sS --max-time 30 -o "/tmp/specialist-e2e/${name}.json" -w '%{http_code}' -X POST \
              -H "Origin: ${origin}" -H 'content-type: application/json' -H 'x-requested-with: pterminology-e2e-v9' \
              --data "${body}" "${url}" > "/tmp/specialist-e2e/${name}.status" || true
          }
          api_post recovery_contract "${IDENTITY_API}/v1/auth/password/request" "https://khaledaltheeb.github.io" '{}'
          api_post reset_contract "${IDENTITY_API}/v1/auth/password/reset" "https://khaledaltheeb.github.io" '{}'
          api_post login_contract "${IDENTITY_API}/v1/auth/password/login" "https://khaledaltheeb.github.io" '{}'
          api_post application_contract "${CORE_API}/v1/applications" "https://khaledaltheeb.github.io" '{}'

          curl -sS --max-time 30 -o /tmp/specialist-e2e/delivery.json -w '%{http_code}' -X POST \
            -H "x-bootstrap-key: ${ADMIN_API_KEY}" -H 'content-type: application/json' --data '{}' \
            "${IDENTITY_API}/v1/internal/owner-password-reset?e2e=${GITHUB_RUN_ID}" > /tmp/specialist-e2e/delivery.status || true

          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          root=Path('/tmp/specialist-e2e')
          def status(name):
              try:return int((root/f'{name}.status').read_text().strip())
              except:return 0
          def text(name, suffix='html'):
              try:return (root/f'{name}.{suffix}').read_text(encoding='utf-8',errors='replace')
              except:return ''
          def data(name):
              try:return json.loads(text(name,'json'))
              except:return {}

          page_expectations={
            'public':['قطاع المختصين'],
            'account':['حساب المختص'],
            'admin':['id="admin-forgot" type="button"','href="../recover/?v=8"'],
            'recover':['استعادة الحساب','إرسال رابط إعادة التعيين'],
            'password_reset':['هذه صفحة مستقلة وآمنة','reset-v9.js?v=9.0.0'],
            'portal':['المحادثة'],
          }
          pages={}
          for name,markers in page_expectations.items():
              body=text(name)
              pages[name]={
                'http_status':status(name),
                'markers':{marker:marker in body for marker in markers},
                'passed':status(name)==200 and all(marker in body for marker in markers),
              }

          identity=data('identity-health')
          core=data('core-health')
          contracts={}
          for name in ['recovery_contract','reset_contract','login_contract','application_contract']:
              payload=data(name)
              contracts[name]={
                'http_status':status(name),
                'error':payload.get('error'),
                'message':payload.get('message'),
                'route_exists':status(name) != 404,
              }

          delivery=data('delivery')
          delivery_state={
            'http_status':status('delivery'),
            'delivery':delivery.get('delivery'),
            'provider_message_id':delivery.get('providerMessageId'),
            'error':delivery.get('error'),
            'provider_detail':delivery.get('providerDetail'),
            'passed':status('delivery')==200 and delivery.get('delivery')=='sent' and bool(delivery.get('providerMessageId')),
          }
          report={
            'schema_version':1,
            'checked_at':datetime.now(timezone.utc).isoformat(),
            'pages':pages,
            'identity':{
              'http_status':status('identity-health'),
              'ok':identity.get('ok'),
              'service':identity.get('service'),
              'version':identity.get('version'),
              'checks':identity.get('checks'),
              'passed':status('identity-health')==200 and identity.get('ok') is True and identity.get('version')=='8.0.0',
            },
            'core':{
              'http_status':status('core-health'),
              'ok':core.get('ok'),
              'passed':status('core-health')==200 and core.get('ok') is True,
            },
            'contracts':contracts,
            'password_reset_delivery':delivery_state,
          }
          report['functional_without_email']=all(x['passed'] for x in pages.values()) and report['identity']['passed'] and report['core']['passed'] and all(x['route_exists'] for x in contracts.values())
          report['fully_operational']=report['functional_without_email'] and delivery_state['passed']
          Path('reports/specialist-sector-e2e-v9.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY

      - name: Commit end-to-end audit report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/specialist-sector-e2e-v9.json
          git commit -m "chore: record specialist sector end-to-end audit v9"
          git pull --rebase origin main
          git push origin HEAD:main
