name: Rebuild calendars on current main

on:
  push:
    branches:
      - agent/calendars-current-main-v2
    paths:
      - ".github/workflows/rebuild-calendars-current-main.yml"

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/calendars-current-main-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch source branch
        run: git fetch origin agent/women-daily-calendar-v1:refs/remotes/origin/agent/women-daily-calendar-v1
      - name: Decode and run rebuild
        env:
          REBUILD_PAYLOAD: ""
        run: |
          python - <<'PY'
          import base64, os, zlib
          from pathlib import Path
          payload = os.environ["REBUILD_PAYLOAD"]
          script = zlib.decompress(base64.b64decode(payload))
          Path("/tmp/rebuild_calendars.py").write_bytes(script)
          PY
          python /tmp/rebuild_calendars.py
      - name: Validate expanded calendars
        run: |
          node --check sectors/women/daily-calendar/calendar.js
          node --check sectors/calendars/students/student-calendar.js
          node --check sectors/calendars/students/service-worker.js
          python -m py_compile scripts/apply_homepage_v20.py tests/test_women_daily_calendar.py tests/test_student_daily_calendar.py
          python - <<'PY'
          import runpy
          for path in ("tests/test_women_daily_calendar.py", "tests/test_student_daily_calendar.py"):
              namespace = runpy.run_path(path)
              tests = [value for name, value in sorted(namespace.items()) if name.startswith("test_") and callable(value)]
              for test in tests:
                  test()
                  print(f"PASS {path}: {test.__name__}")
          PY
      - name: Commit rebuilt calendars
        run: |
          rm -f .github/workflows/rebuild-calendars-current-main.yml
          git config user.name "rawafid-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat(calendars): rebuild on current main and expand women wellbeing"
          git push origin HEAD:agent/calendars-current-main-v2
