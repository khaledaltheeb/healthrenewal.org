name: Diagnose password reset v9

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/diagnose-password-reset-v9.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: diagnose-password-reset-v9
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Probe live page, script, and Worker route
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p reports
          stamp="$(date +%s)"
          page_url="https://khaledaltheeb.github.io/pterminology-site/specialists-partners/password-reset/?v=9&probe=${stamp}"
          js_url="https://khaledaltheeb.github.io/pterminology-site/specialists-partners/password-reset/reset-v9.js?v=9.0.0&probe=${stamp}"
          page_status="$(curl -sS -L --max-time 30 -o /tmp/page.html -w '%{http_code}' "${page_url}" || true)"
          js_status="$(curl -sS -L --max-time 30 -o /tmp/reset.js -w '%{http_code}' "${js_url}" || true)"
          route_status="$(curl -sS --max-time 30 -o /tmp/route.json -w '%{http_code}' -X POST \
            -H 'Origin: https://khaledaltheeb.github.io' \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json;charset=UTF-8' \
            -H 'x-requested-with: pterminology-password-reset-v9' \
            --data '{}' 'https://pterminology-specialist-accounts.pterminology-826ac349.workers.dev/v1/auth/password/reset' || true)"
          export PAGE_STATUS="${page_status}" JS_STATUS="${js_status}" ROUTE_STATUS="${route_status}"
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          def read(path):
              try:
                  return open(path,encoding='utf-8',errors='replace').read()
              except Exception:
                  return ''
          page=read('/tmp/page.html')
          js=read('/tmp/reset.js')
          route=read('/tmp/route.json')
          try: route_json=json.loads(route)
          except Exception: route_json={}
          report={
            'schema_version':1,
            'checked_at':datetime.now(timezone.utc).isoformat(),
            'page_http_status':int(os.environ.get('PAGE_STATUS') or 0),
            'script_http_status':int(os.environ.get('JS_STATUS') or 0),
            'route_http_status':int(os.environ.get('ROUTE_STATUS') or 0),
            'page_has_v9_marker':'هذه صفحة مستقلة وآمنة' in page,
            'page_loads_v9_script':'reset-v9.js?v=9.0.0' in page,
            'script_has_direct_worker':'https://pterminology-specialist-accounts.pterminology-826ac349.workers.dev' in js,
            'script_has_reset_route':'/v1/auth/password/reset' in js,
            'script_has_v9_header':'pterminology-password-reset-v9' in js,
            'script_uses_runtime_config':'PT_SPECIALIST_CONFIG' in js,
            'route_error':route_json.get('error'),
            'passed':False,
          }
          report['passed']=(report['page_http_status']==200 and report['script_http_status']==200 and report['route_http_status']==400 and report['page_has_v9_marker'] and report['page_loads_v9_script'] and report['script_has_direct_worker'] and report['script_has_reset_route'] and report['script_has_v9_header'] and not report['script_uses_runtime_config'] and report['route_error']=='missing_field')
          open('reports/password-reset-v9-live.json','w',encoding='utf-8').write(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - name: Commit diagnostic report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/password-reset-v9-live.json
          git commit -m "chore: record password reset v9 live diagnostic"
          git pull --rebase origin main
          git push origin HEAD:main
