name: Audit historical repository and recovery candidates v1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/audit_historical_repository_v1.py'
      - '.github/workflows/audit-historical-repository-v1.yml'

permissions:
  actions: read
  contents: read

concurrency:
  group: historical-repository-audit-v1
  cancel-in-progress: true

jobs:
  audit:
    name: Reconstruct historical bundles and compare publication routes
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout full repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Locate latest validated production artifact
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=validated-production-site&per_page=100" -o /tmp/baselines.json
          python - <<'PY'
          import json, os
          payload = json.load(open('/tmp/baselines.json', encoding='utf-8'))
          candidates = [x for x in payload.get('artifacts', []) if not x.get('expired') and x.get('workflow_run', {}).get('head_branch') == 'main' and x.get('workflow_run', {}).get('id')]
          if not candidates:
              raise SystemExit('No validated-production-site artifact is available')
          item = max(candidates, key=lambda x: x.get('created_at', ''))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write(f"run_id={item['workflow_run']['id']}\n")
          print({'baselineRunId': item['workflow_run']['id'], 'createdAt': item.get('created_at')})
          PY

      - name: Download validated production artifact
        uses: actions/download-artifact@v4
        with:
          name: validated-production-site
          path: /tmp/validated-production
          repository: khaledaltheeb/healthrenewal.org
          run-id: ${{ steps.baseline.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Run exhaustive historical audit
        run: |
          set -euo pipefail
          python -m py_compile scripts/audit_historical_repository_v1.py
          python scripts/audit_historical_repository_v1.py --repo . --production /tmp/validated-production --out historical-audit
          python - <<'PY'
          import json
          p = json.load(open('historical-audit/historical-repository-audit-v1.json', encoding='utf-8'))
          assert p['status'] == 'passed', p
          assert p['historicalRootCount'] > 0, p
          assert p['validatedProductionRoutes'] >= 3000, p
          print({
              'historicalRoots': p['historicalRootCount'],
              'historicalWebVersions': p['historicalWebVersions'],
              'historicalUniqueRoutes': p['historicalUniqueRoutes'],
              'classifications': p['classifications'],
              'recoveryCandidateRoutes': p['recoveryCandidateRoutes'],
              'payloadErrors': p['payloadErrors'],
          })
          PY

      - name: Upload historical audit reports
        uses: actions/upload-artifact@v4
        with:
          name: historical-repository-audit-v1
          path: historical-audit
          retention-days: 90
          compression-level: 6
