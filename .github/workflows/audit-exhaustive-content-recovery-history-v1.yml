name: Audit exhaustive content recovery history v1

on:
  pull_request:
    paths:
      - 'scripts/recover_content_full_history_v3.py'
      - 'tests/test_recovery_no_shortening_guard_v1.py'
      - '.github/workflows/audit-exhaustive-content-recovery-history-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  exhaustive-history:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout exact pull request head with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch every branch and pull-request head for recovery audit
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*' --prune

          mapfile -t remote_pull_refs < <(
            git ls-remote --refs origin 'refs/pull/*/head' | awk '{print $2}'
          )
          test "${#remote_pull_refs[@]}" -gt 0

          batch=()
          fetched=0
          flush_batch() {
            if [ "${#batch[@]}" -eq 0 ]; then
              return
            fi
            git fetch --no-tags origin "${batch[@]}"
            fetched=$((fetched + ${#batch[@]}))
            batch=()
          }

          for ref in "${remote_pull_refs[@]}"; do
            number="${ref#refs/pull/}"
            number="${number%/head}"
            batch+=("+${ref}:refs/remotes/pull/${number}")
            if [ "${#batch[@]}" -ge 100 ]; then
              flush_batch
            fi
          done
          flush_batch

          branch_refs="$(git for-each-ref --format='%(refname)' refs/remotes/origin | wc -l)"
          pull_refs="$(git for-each-ref --format='%(refname)' refs/remotes/pull | wc -l)"
          echo "branch refs: ${branch_refs}"
          echo "advertised pull-request refs: ${#remote_pull_refs[@]}"
          echo "fetched pull-request refs: ${pull_refs}"
          test "${branch_refs}" -gt 0
          test "${pull_refs}" -eq "${#remote_pull_refs[@]}"
          test "${fetched}" -eq "${#remote_pull_refs[@]}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile recovery engine
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/recover_content_v1.py \
            scripts/recover_content_v2.py \
            scripts/recover_content_full_history_v3.py

      - name: Run recovery regression tests
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests/test_recovery_no_shortening_guard_v1.py

      - name: Inventory every distinct historical HTML version
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path('scripts').resolve()))
          import recover_content_full_history_v3 as recovery

          versions = recovery.full_history_candidates('2016-01-01')
          counts = {path: len(commits) for path, commits in versions.items()}
          total_versions = sum(counts.values())
          max_versions = max(counts.values(), default=0)
          over_24 = sorted(
              ({'path': path, 'versions': count} for path, count in counts.items() if count > 24),
              key=lambda item: (-item['versions'], item['path']),
          )
          report = {
              'schemaVersion': 1,
              'status': 'passed',
              'pagePathsWithHistory': len(counts),
              'distinctHistoricalVersions': total_versions,
              'maximumVersionsForOnePath': max_versions,
              'pathsBeyondFormer24VersionLimit': len(over_24),
              'topPathsBeyondFormerLimit': over_24[:100],
          }
          Path('reports').mkdir(exist_ok=True)
          Path('reports/exhaustive-content-recovery-history-v1.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print(report)
          assert counts, 'no historical HTML versions discovered'
          assert total_versions >= len(counts), report
          PY

      - name: Upload exhaustive history evidence
        uses: actions/upload-artifact@v4
        with:
          name: exhaustive-content-recovery-history-v1
          path: reports/exhaustive-content-recovery-history-v1.json
          retention-days: 30
