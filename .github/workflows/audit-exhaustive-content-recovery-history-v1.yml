name: Audit exhaustive content recovery history v1

on:
  pull_request:
    paths:
      - 'scripts/recover_content_full_history_v3.py'
      - 'tests/test_recovery_no_shortening_guard_v1.py'
      - '.github/workflows/audit-exhaustive-content-recovery-history-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  exhaustive-history:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout exact pull request head with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch every branch and advertised pull-request head
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*' --prune

          git ls-remote --refs origin 'refs/pull/*/head' \
            | awk '{ref=$2; sub("refs/pull/", "", ref); sub("/head", "", ref); print ref "\t" $1 "\t" $2}' \
            | sort -n -u > /tmp/pull-heads.tsv

          test -s /tmp/pull-heads.tsv
          : > /tmp/pull-fetch-failures.tsv
          : > /tmp/pull-refspecs.txt

          while IFS=$'\t' read -r number sha remote_ref; do
            test -n "${number}" && test -n "${sha}" && test -n "${remote_ref}"
            printf '+%s:refs/remotes/pull/%s\n' "${remote_ref}" "${number}" >> /tmp/pull-refspecs.txt
          done < /tmp/pull-heads.tsv

          advertised_pull_heads="$(wc -l < /tmp/pull-heads.tsv)"
          test "${advertised_pull_heads}" -gt 0

          split -l 100 /tmp/pull-refspecs.txt /tmp/pull-refspecs-batch-
          for batch in /tmp/pull-refspecs-batch-*; do
            mapfile -t refspecs < "${batch}"
            if ! git fetch --no-tags origin "${refspecs[@]}"; then
              printf 'batch\t%s\n' "${batch}" >> /tmp/pull-fetch-failures.tsv
              exit 1
            fi
          done

          branch_refs="$(git for-each-ref --format='%(refname)' refs/remotes/origin | wc -l)"
          pull_refs="$(git for-each-ref --format='%(refname)' refs/remotes/pull | wc -l)"
          failed_batches="$(wc -l < /tmp/pull-fetch-failures.tsv)"
          echo "branch refs: ${branch_refs}"
          echo "PR heads advertised by origin: ${advertised_pull_heads}"
          echo "local PR refs created: ${pull_refs}"
          echo "failed fetch batches: ${failed_batches}"
          test "${branch_refs}" -gt 0
          test "${failed_batches}" -eq 0
          test "${pull_refs}" -eq "${advertised_pull_heads}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile recovery engine
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/recover_content_v1.py \
            scripts/recover_content_v2.py \
            scripts/recover_content_full_history_v3.py

      - name: Run recovery regression tests
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests/test_recovery_no_shortening_guard_v1.py

      - name: Inventory every distinct historical HTML blob
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path('scripts').resolve()))
          import recover_content_full_history_v3 as recovery

          history = recovery.all_history('1970-01-01')
          counts = {}
          cat = recovery.CatFile()
          try:
              for path, commits in history.items():
                  blobs = set()
                  for commit in commits:
                      loaded = cat.get(commit, path)
                      if loaded:
                          blobs.add(loaded[0])
                  if blobs:
                      counts[path] = len(blobs)
          finally:
              cat.close()

          total_versions = sum(counts.values())
          max_versions = max(counts.values(), default=0)
          over_24 = sorted(
              ({'path': path, 'versions': count} for path, count in counts.items() if count > 24),
              key=lambda item: (-item['versions'], item['path']),
          )
          failed = []
          failure_file = Path('/tmp/pull-fetch-failures.tsv')
          if failure_file.is_file():
              for line in failure_file.read_text(encoding='utf-8').splitlines():
                  if not line.strip():
                      continue
                  failed.append({'fetchBatchFailure': line})

          report = {
              'schemaVersion': 3,
              'status': 'passed' if counts and not failed else 'failed',
              'historyScanMode': 'all reachable branch refs plus every pull-request head advertised by origin; unique git blobs per safe HTML path',
              'pagePathsWithHistory': len(counts),
              'distinctHistoricalBlobVersions': total_versions,
              'maximumBlobVersionsForOnePath': max_versions,
              'pathsBeyondFormer24VersionLimit': len(over_24),
              'topPathsBeyondFormerLimit': over_24[:100],
              'pullRequestFetchFailures': failed,
          }
          Path('reports').mkdir(exist_ok=True)
          Path('reports/exhaustive-content-recovery-history-v1.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print(report)
          assert counts, 'no historical HTML versions discovered'
          assert total_versions >= len(counts), report
          assert not failed, report
          PY

      - name: Upload exhaustive history evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exhaustive-content-recovery-history-v1
          path: reports/exhaustive-content-recovery-history-v1.json
          if-no-files-found: warn
          retention-days: 30
