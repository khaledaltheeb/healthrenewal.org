name: Audit exhaustive content recovery history v1

on:
  pull_request:
    paths:
      - 'scripts/recover_content_full_history_v3.py'
      - 'tests/test_recovery_no_shortening_guard_v1.py'
      - '.github/workflows/audit-exhaustive-content-recovery-history-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  exhaustive-history:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout exact pull request head with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch every branch and recoverable pull-request head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*' --prune

          gh api --paginate \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/pulls?state=all&per_page=100" \
            --jq '.[] | [.number, .head.sha] | @tsv' \
            | sort -n -u > /tmp/pull-heads.tsv

          test -s /tmp/pull-heads.tsv
          : > /tmp/pull-fetch-failures.tsv
          fetched=0
          already_present=0
          while IFS=$'\t' read -r number sha; do
            test -n "${number}" && test -n "${sha}"
            target_ref="refs/remotes/pull/${number}"
            if git cat-file -e "${sha}^{commit}" 2>/dev/null; then
              git update-ref "${target_ref}" "${sha}"
              already_present=$((already_present + 1))
              continue
            fi

            if git fetch --no-tags origin "+refs/pull/${number}/head:${target_ref}" 2>/tmp/pull-fetch.err; then
              fetched=$((fetched + 1))
            elif git fetch --no-tags origin "+${sha}:${target_ref}" 2>/tmp/pull-fetch.err; then
              fetched=$((fetched + 1))
            else
              printf '%s\t%s\n' "${number}" "${sha}" >> /tmp/pull-fetch-failures.tsv
            fi
          done < /tmp/pull-heads.tsv

          branch_refs="$(git for-each-ref --format='%(refname)' refs/remotes/origin | wc -l)"
          api_pull_heads="$(wc -l < /tmp/pull-heads.tsv)"
          pull_refs="$(git for-each-ref --format='%(refname)' refs/remotes/pull | wc -l)"
          failed_pull_heads="$(wc -l < /tmp/pull-fetch-failures.tsv)"
          echo "branch refs: ${branch_refs}"
          echo "PR heads reported by API: ${api_pull_heads}"
          echo "PR heads already reachable locally: ${already_present}"
          echo "PR heads fetched from origin: ${fetched}"
          echo "PR heads unavailable from origin: ${failed_pull_heads}"
          echo "local PR refs created: ${pull_refs}"
          test "${branch_refs}" -gt 0
          test "${pull_refs}" -gt 0
          test "$((pull_refs + failed_pull_heads))" -eq "${api_pull_heads}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile recovery engine
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/recover_content_v1.py \
            scripts/recover_content_v2.py \
            scripts/recover_content_full_history_v3.py

      - name: Run recovery regression tests
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests/test_recovery_no_shortening_guard_v1.py

      - name: Inventory every distinct historical HTML blob
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path('scripts').resolve()))
          import recover_content_full_history_v3 as recovery

          history = recovery.all_history('1970-01-01')
          counts = {}
          cat = recovery.CatFile()
          try:
              for path, commits in history.items():
                  blobs = set()
                  for commit in commits:
                      loaded = cat.get(commit, path)
                      if loaded:
                          blobs.add(loaded[0])
                  if blobs:
                      counts[path] = len(blobs)
          finally:
              cat.close()

          total_versions = sum(counts.values())
          max_versions = max(counts.values(), default=0)
          over_24 = sorted(
              ({'path': path, 'versions': count} for path, count in counts.items() if count > 24),
              key=lambda item: (-item['versions'], item['path']),
          )
          failed = []
          failure_file = Path('/tmp/pull-fetch-failures.tsv')
          if failure_file.is_file():
              for line in failure_file.read_text(encoding='utf-8').splitlines():
                  if not line.strip():
                      continue
                  number, sha = line.split('\t', 1)
                  failed.append({'number': int(number), 'sha': sha})

          report = {
              'schemaVersion': 2,
              'status': 'passed' if counts else 'failed',
              'historyScanMode': 'all reachable branch and PR refs; unique git blobs per safe HTML path',
              'pagePathsWithHistory': len(counts),
              'distinctHistoricalBlobVersions': total_versions,
              'maximumBlobVersionsForOnePath': max_versions,
              'pathsBeyondFormer24VersionLimit': len(over_24),
              'topPathsBeyondFormerLimit': over_24[:100],
              'unavailablePullRequestHeads': failed,
          }
          Path('reports').mkdir(exist_ok=True)
          Path('reports/exhaustive-content-recovery-history-v1.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print(report)
          assert counts, 'no historical HTML versions discovered'
          assert total_versions >= len(counts), report
          PY

      - name: Upload exhaustive history evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exhaustive-content-recovery-history-v1
          path: reports/exhaustive-content-recovery-history-v1.json
          if-no-files-found: warn
          retention-days: 30
