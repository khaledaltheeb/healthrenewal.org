name: Publish women and youth v406 from issue

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: github-pages-production
  cancel-in-progress: false

jobs:
  publish-and-deploy:
    if: github.event.issue.title == '[release] publish women youth v406 2026-08-01'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile and run v406 contract tests
        run: |
          set -euo pipefail
          python -m py_compile scripts/publish_women_youth_v406.py
          python -m unittest -v tests.test_women_youth_v406

      - name: Materialize thirty pages and two hubs
        run: |
          set -euo pipefail
          python scripts/publish_women_youth_v406.py . > /tmp/women-youth-v406.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('api/women-youth-expansion-v406.json').read_text(encoding='utf-8'))
          assert report['status'] == 'passed'
          assert report['page_count'] == 30
          assert report['hub_count'] == 2
          assert report['distribution'] == {'women': 15, 'youth': 15}
          assert report['unique_routes'] == 30
          assert report['minimum_words'] >= 1800
          assert report['minimum_h2'] >= 18
          assert report['minimum_citations'] >= 3
          assert report['minimum_topic_mentions'] >= 16
          assert report['specialized_safety_pages'] == 30
          assert all(report['quality_gates'].values())
          for route in report['routes']:
              page = Path(route) / 'index.html'
              assert page.is_file(), route
              source = page.read_text(encoding='utf-8')
              assert 'data-content-engine="v406"' in source, route
          print(json.dumps({
              'pages': report['page_count'],
              'total_words': report['total_words'],
              'minimum_words': report['minimum_words'],
              'minimum_h2': report['minimum_h2'],
              'distribution': report['distribution'],
          }, ensure_ascii=False, indent=2))
          PY

      - name: Rebuild complete sitemap discovery
        run: |
          set -euo pipefail
          python scripts/rebuild_sitemap_discovery_v405.py . > /tmp/sitemap-v405-after-v406.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('api/sitemap-discovery-v405.json').read_text(encoding='utf-8'))
          assert report['status'] == 'passed'
          indexed = set(report['indexed_sitemaps'])
          assert 'sitemap-sector-women.xml' in indexed
          assert 'sitemap-sector-youth.xml' in indexed
          assert report['undercovered_routes_exposed'] == 100
          robots = Path('robots.txt').read_text(encoding='utf-8')
          assert 'Sitemap: https://healthrenewal.org/sitemap-index.xml' in robots
          PY

      - name: Commit generated corpus and discovery files
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            sectors/women \
            sectors/youth \
            sitemap-sector-women.xml \
            sitemap-sector-youth.xml \
            sitemap-index.xml \
            robots.txt \
            api/women-youth-expansion-v406.json \
            api/sitemap-discovery-v405.json
          git commit -m 'content(v406): publish women and youth sector expansion'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt * 3))
          done
          exit 1

      - name: Select latest validated production artifact
        id: artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsS \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=validated-production-site&per_page=100" \
            -o /tmp/artifacts.json
          python - <<'PY'
          import json, os
          artifacts = [item for item in json.load(open('/tmp/artifacts.json', encoding='utf-8')).get('artifacts', []) if not item.get('expired') and item.get('workflow_run', {}).get('id')]
          if not artifacts:
              raise SystemExit('No active validated-production-site artifact found')
          selected = max(artifacts, key=lambda item: item.get('created_at', ''))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"run_id={selected['workflow_run']['id']}\n")
              output.write(f"artifact_id={selected['id']}\n")
              output.write(f"created_at={selected.get('created_at', '')}\n")
          print({'artifact_id': selected['id'], 'run_id': selected['workflow_run']['id'], 'created_at': selected.get('created_at')})
          PY

      - name: Download validated production artifact
        uses: actions/download-artifact@v4
        with:
          name: validated-production-site
          path: _site
          repository: khaledaltheeb/healthrenewal.org
          run-id: ${{ steps.artifact.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Overlay all current sector and discovery files
        run: |
          set -euo pipefail
          test -f _site/index.html
          mkdir -p _site/sectors _site/api _site/assets/platform
          for sector in child family home women youth; do
            if [ -d "sectors/${sector}" ]; then
              rm -rf "_site/sectors/${sector}"
              cp -a "sectors/${sector}" "_site/sectors/${sector}"
            fi
          done
          find . -maxdepth 1 -type f -name 'sitemap*.xml' -exec cp '{}' _site/ ';'
          cp robots.txt CNAME _site/
          cp api/undercovered-content-v401.json api/women-youth-expansion-v406.json api/sitemap-discovery-v405.json _site/api/
          cp assets/platform/platform-core.css assets/platform/platform-core.js _site/assets/platform/
          touch _site/.nojekyll

      - name: Verify deployment tree
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path
          site = Path('_site')
          report = json.loads((site / 'api/women-youth-expansion-v406.json').read_text(encoding='utf-8'))
          assert report['page_count'] == 30
          for route in report['routes']:
              page = site / route / 'index.html'
              assert page.is_file(), route
              assert 'data-content-engine="v406"' in page.read_text(encoding='utf-8'), route
          for section in ('women', 'youth'):
              hub = site / 'sectors' / section / 'index.html'
              assert hub.is_file()
              assert 'data-content-engine="v406"' in hub.read_text(encoding='utf-8')
          index = ET.parse(site / 'sitemap-index.xml').getroot()
          locations = {(node.text or '').strip() for node in index.findall('{*}sitemap/{*}loc')}
          assert 'https://healthrenewal.org/sitemap-sector-women.xml' in locations
          assert 'https://healthrenewal.org/sitemap-sector-youth.xml' in locations
          PY

      - uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live hubs pages and discovery
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"
          ready=0
          for attempt in $(seq 1 80); do
            nonce="${RUN_ID}-${attempt}-$(date +%s%N)"
            if curl -fsS --retry 2 -H 'Cache-Control: no-cache' "${base}/api/women-youth-expansion-v406.json?release=${nonce}" -o /tmp/live-v406.json && \
               curl -fsS --retry 2 -H 'Cache-Control: no-cache' "${base}/sectors/women/?release=${nonce}" -o /tmp/live-women.html && \
               curl -fsS --retry 2 -H 'Cache-Control: no-cache' "${base}/sectors/youth/?release=${nonce}" -o /tmp/live-youth.html && \
               curl -fsS --retry 2 -H 'Cache-Control: no-cache' "${base}/sectors/women/guides/intimate-partner-violence-safe-help/?release=${nonce}" -o /tmp/live-women-page.html && \
               curl -fsS --retry 2 -H 'Cache-Control: no-cache' "${base}/sectors/youth/guides/suicide-safety-escalation/?release=${nonce}" -o /tmp/live-youth-page.html && \
               curl -fsS --retry 2 -H 'Cache-Control: no-cache' "${base}/sitemap-index.xml?release=${nonce}" -o /tmp/live-index.xml; then
              if python - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path
          report = json.loads(Path('/tmp/live-v406.json').read_text(encoding='utf-8'))
          assert report['status'] == 'passed' and report['page_count'] == 30
          for filename in ('/tmp/live-women.html', '/tmp/live-youth.html', '/tmp/live-women-page.html', '/tmp/live-youth-page.html'):
              source = Path(filename).read_text(encoding='utf-8')
              assert 'data-content-engine="v406"' in source
          assert 'تحقق أمان عند العنف أو السيطرة' in Path('/tmp/live-women-page.html').read_text(encoding='utf-8')
          assert 'تحقق فوري عند خطر إيذاء النفس أو الانتحار' in Path('/tmp/live-youth-page.html').read_text(encoding='utf-8')
          index = ET.parse('/tmp/live-index.xml').getroot()
          locations = {(node.text or '').strip() for node in index.findall('{*}sitemap/{*}loc')}
          assert 'https://healthrenewal.org/sitemap-sector-women.xml' in locations
          assert 'https://healthrenewal.org/sitemap-sector-youth.xml' in locations
          PY
              then ready=1; break; fi
            fi
            sleep 3
          done
          test "$ready" = 1

      - name: Commit verified live receipt
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          RUN_ID: ${{ github.run_id }}
          ARTIFACT_RUN_ID: ${{ steps.artifact.outputs.run_id }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime, json, os, subprocess
          from pathlib import Path
          report = json.loads(Path('api/women-youth-expansion-v406.json').read_text(encoding='utf-8'))
          receipt = {
              'schemaVersion': 1,
              'passed': True,
              'deploymentAccepted': True,
              'verifiedAt': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'site': os.environ['PAGE_URL'],
              'workflowRunId': int(os.environ['RUN_ID']),
              'workflowRunUrl': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['RUN_ID']}",
              'sourceCommit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'baselineArtifactId': int(os.environ['ARTIFACT_ID']),
              'baselineWorkflowRunId': int(os.environ['ARTIFACT_RUN_ID']),
              'pageCount': report['page_count'],
              'hubCount': report['hub_count'],
              'distribution': report['distribution'],
              'totalWords': report['total_words'],
              'minimumWords': report['minimum_words'],
              'minimumSections': report['minimum_h2'],
              'specializedSafetyPages': report['specialized_safety_pages'],
              'womenHubReachable': True,
              'youthHubReachable': True,
              'criticalWomenPageReachable': True,
              'criticalYouthPageReachable': True,
              'sitemapDiscoveryLive': True,
          }
          Path('reports').mkdir(exist_ok=True)
          Path('reports/women-youth-v406-live.json').write_text(json.dumps(receipt, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/women-youth-v406-live.json
          git commit -m 'chore: record verified women youth v406 production [skip ci]'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt * 3))
          done
          exit 1

      - name: Comment release result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ job.status }}';
            const pageUrl = '${{ steps.deployment.outputs.page_url }}';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = status === 'success'
              ? `اكتمل نشر قطاعي المرأة والشباب واليافعين.\n\n- الحالة: success\n- الصفحات: 30\n- المراكز: 2\n- رابط Pages: ${pageUrl}\n- التشغيل: ${runUrl}\n- الإيصال: reports/women-youth-v406-live.json`
              : `فشل مسار نشر v406 قبل اكتمال الإيصال.\n\n- الحالة: ${status}\n- التشغيل: ${runUrl}`;
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body});
