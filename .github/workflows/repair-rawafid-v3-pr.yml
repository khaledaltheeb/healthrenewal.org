name: Repair Rawafid v3 pull request

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: repair-rawafid-v3-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/rawafid-brand-consistency-v3'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Quick Info renderer dependency
        run: python -m pip install pillow

      - name: Rebuild Quick Info and normalize final source
        run: |
          set -euo pipefail
          python scripts/build_quick_info.py
          python scripts/rawafid_brand_consistency.py --root . --fix --report reports/rawafid-brand-consistency-v3.json
          python scripts/repair_homepage_heading_semantics.py index.html --fix
          python scripts/normalize_platform_shell.py --no-report
          python scripts/rawafid_brand_consistency.py --root . --fix --report reports/rawafid-brand-consistency-v3.json

      - name: Validate all affected contracts
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/rawafid_brand_consistency.py \
            scripts/sitecustomize.py \
            scripts/repair_homepage_heading_semantics.py \
            scripts/apply_rawafid_brand.py \
            scripts/verify_homepage_v19.py
          python scripts/repair_homepage_heading_semantics.py index.html
          python scripts/normalize_platform_shell.py --check --no-report
          python scripts/verify_homepage_v19.py
          python - <<'PY'
          import runpy
          namespace = runpy.run_path('tests/test_quick_info_section.py')
          tests = [
              value
              for name, value in sorted(namespace.items())
              if name.startswith('test_') and callable(value)
          ]
          assert tests
          for test in tests:
              test()
              print('PASS', test.__name__)
          PY
          python scripts/rawafid_brand_consistency.py --root . --check --report /tmp/rawafid-v3-check.json

      - name: Commit deterministic generated changes
        run: |
          git config user.name "Rawafid V3 Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "fix(brand): normalize latest site and Quick Info under Rawafid"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
