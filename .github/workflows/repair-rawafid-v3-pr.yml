name: Repair Rawafid v3 pull request

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: repair-rawafid-v3-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/rawafid-brand-consistency-v3'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rawafid-brand-consistency-v3
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Quick Info renderer dependency
        run: python -m pip install pillow
      - name: Make brand asset normalization idempotent
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/rawafid_brand_consistency.py')
          source = path.read_text(encoding='utf-8')
          old = '''    if HEAD_CLOSE_RE.search(text):
              text = HEAD_CLOSE_RE.sub(FAVICON_BLOCK + "\\n</head>", text, count=1)
          return text
          '''
          new = '''    text = re.sub(r"\\s*</head\\s*>", "\\n</head>", text, count=1, flags=re.I)
              if HEAD_CLOSE_RE.search(text):
                  text = HEAD_CLOSE_RE.sub(FAVICON_BLOCK + "\\n</head>", text, count=1)
              return text
          '''
          old = old.replace('          ', '')
          new = new.replace('          ', '')
          if old not in source:
              raise SystemExit('Expected normalize_brand_assets tail not found')
          source = source.replace(old, new, 1)
          path.write_text(source, encoding='utf-8')
          PY
      - name: Align institutional homepage verifier
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/verify_homepage_v19.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('BRAND = "منصة روافد"\n', 'BRAND = "منصة روافد"\nBRAND_EN = "Rawafid Platform"\nMANIFEST_NAME = "منصة روافد للعافية النفسية والدمج والتمكين"\n')
          s=s.replace('assert "الاسم المؤسس: مصطلحات علم النفس" in source, "Founding name must remain visible"', 'assert "الاسم المؤسس: منصة روافد" in source, "The official institutional name must remain visible"')
          s=s.replace('assert 8 <= len(headings) <= 20, "Homepage heading outline must remain concise and proportional"', 'assert h3_count >= 16, "Homepage cards must expose semantic H3 headings"\n    assert 22 <= len(headings) <= 100, "Homepage heading outline must remain structured and proportional"\n    assert not re.search(r\'<p\\s+class=["\\\']item-title["\\\']\', source, re.IGNORECASE), "Homepage card titles must use semantic headings"')
          s=s.replace('<link rel="icon" href="/assets/brand/logo-mark.svg" type="image/svg+xml">', '<link rel="icon" type="image/svg+xml" href="/assets/brand/logo-mark.svg">')
          s=s.replace('assert "مصطلحات علم النفس" in organization.get("alternateName", [])', 'alternate_names = organization.get("alternateName", [])\n    if isinstance(alternate_names, str):\n        alternate_names = [alternate_names]\n    assert BRAND_EN in alternate_names\n    assert "مصطلحات علم النفس" not in alternate_names')
          s=s.replace('assert manifest.get("name") == BRAND\n    assert manifest.get("dir") == "rtl" and manifest.get("lang") == "ar"', 'assert manifest.get("name") == MANIFEST_NAME\n    assert manifest.get("short_name") == "روافد"\n    assert manifest.get("id") == "/"\n    assert manifest.get("dir") == "rtl" and manifest.get("lang") == "ar"\n    assert platform.get("name") == BRAND\n    assert platform.get("alternateName") == BRAND_EN')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Rebuild Quick Info and shared shell
        run: |
          python scripts/build_quick_info.py
          python scripts/repair_homepage_heading_semantics.py index.html --fix
          python scripts/normalize_platform_shell.py --no-report
          python scripts/normalize_platform_shell.py --no-report
      - name: Normalize and audit Rawafid identity
        run: python scripts/rawafid_brand_consistency.py --root . --fix --report reports/rawafid-brand-consistency-v3.json
      - name: Validate all affected contracts
        run: |
          python -m py_compile scripts/rawafid_brand_consistency.py scripts/sitecustomize.py scripts/repair_homepage_heading_semantics.py scripts/apply_rawafid_brand.py scripts/verify_homepage_v19.py
          python scripts/repair_homepage_heading_semantics.py index.html
          python scripts/normalize_platform_shell.py --check --no-report
          python scripts/verify_homepage_v19.py
          python - <<'PY'
          import runpy
          ns=runpy.run_path('tests/test_quick_info_section.py')
          tests=[v for n,v in sorted(ns.items()) if n.startswith('test_') and callable(v)]
          assert tests
          for test in tests:
              test(); print('PASS', test.__name__)
          PY
          python scripts/rawafid_brand_consistency.py --root . --check --report /tmp/rawafid-v3-check.json
      - name: Commit repaired latest-main branch
        run: |
          git config user.name "Rawafid V3 Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "fix(brand): normalize latest site and Quick Info under Rawafid"
          git push origin HEAD:fix/rawafid-brand-consistency-v3
