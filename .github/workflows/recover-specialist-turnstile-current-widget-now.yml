name: Recover specialist Turnstile current widget now

on:
  push:
    branches:
      - agent/inspect-cloudflare-specialists-now
    paths:
      - reports/recover-specialist-turnstile-current-widget-trigger.txt

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '826ac34927c1e045c06145a327c2ac52' }}
      TURNSTILE_SITEKEY: 0x4AAAAAAD_r2o__Ao1RmBTO
      IDENTITY_WORKER: pterminology-specialist-accounts
      CORE_WORKER: pterminology-specialists
      IDENTITY_URL: https://pterminology-specialist-accounts.pterminology-826ac349.workers.dev
      CORE_URL: https://pterminology-specialists.pterminology-826ac349.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/inspect-cloudflare-specialists-now
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Recover the current widget secret safely
        id: recover
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          curl -fsS "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/challenges/widgets/${TURNSTILE_SITEKEY}" \
            -o /tmp/widget-current.json
          python - <<'PY'
          import json, os
          d=json.load(open('/tmp/widget-current.json',encoding='utf-8'))
          assert d.get('success') is True, d
          result=d.get('result') or {}
          assert result.get('sitekey')==os.environ['TURNSTILE_SITEKEY'], result
          assert 'khaledaltheeb.github.io' in (result.get('domains') or []), result.get('domains')
          secret=str(result.get('secret') or '')
          if secret:
              print(f'::add-mask::{secret}')
              open('/tmp/turnstile-secret','w',encoding='utf-8').write(secret)
              open('/tmp/recovery-method','w',encoding='utf-8').write('read_existing')
          PY
          if [[ ! -s /tmp/turnstile-secret ]]; then
            set +e
            http_status="$(curl -sS -o /tmp/widget-rotation.json -w '%{http_code}' "${auth[@]}" -X POST \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/challenges/widgets/${TURNSTILE_SITEKEY}/rotate_secret" \
              --data '{"invalidate_immediately":false}')"
            set -e
            python - "$http_status" <<'PY'
          import json, sys, os
          status=int(sys.argv[1])
          try: data=json.load(open('/tmp/widget-rotation.json',encoding='utf-8'))
          except Exception: data={}
          result=data.get('result') or {}
          secret=str(result.get('secret') or '')
          if status==200 and data.get('success') is True and secret:
              print(f'::add-mask::{secret}')
              open('/tmp/turnstile-secret','w',encoding='utf-8').write(secret)
              open('/tmp/recovery-method','w',encoding='utf-8').write('rotated_with_grace')
          else:
              safe={'http_status':status,'errors':data.get('errors',[])[:3]}
              open('/tmp/rotation-failure.json','w',encoding='utf-8').write(json.dumps(safe,ensure_ascii=False))
          PY
          fi
          [[ -s /tmp/turnstile-secret ]] || { echo '::error::Current widget secret unavailable and safe rotation was rejected'; cat /tmp/rotation-failure.json 2>/dev/null || true; exit 1; }
          chmod 600 /tmp/turnstile-secret

      - name: Validate secret with Siteverify
        shell: bash
        run: |
          set -euo pipefail
          secret="$(cat /tmp/turnstile-secret)"
          curl -fsS -X POST https://challenges.cloudflare.com/turnstile/v0/siteverify \
            --data-urlencode "secret=${secret}" \
            --data-urlencode "response=diagnostic-invalid-token" \
            -o /tmp/siteverify.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/siteverify.json',encoding='utf-8'))
          codes=set(d.get('error-codes') or [])
          assert d.get('success') is False, d
          assert 'invalid-input-secret' not in codes, d
          assert 'missing-input-secret' not in codes, d
          PY

      - name: Restore secret and public route
        shell: bash
        run: |
          set -euo pipefail
          secret="$(cat /tmp/turnstile-secret)"
          for worker in "${IDENTITY_WORKER}" "${CORE_WORKER}"; do
            printf '%s' "${secret}" | npx --yes wrangler@4 secret put TURNSTILE_SECRET --name "${worker}"
          done
          curl -fsS -X POST \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"enabled":true,"previews_enabled":true}' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${IDENTITY_WORKER}/subdomain" \
            -o /tmp/subdomain.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/subdomain.json',encoding='utf-8'))
          assert d.get('success') is True, d
          assert (d.get('result') or {}).get('enabled') is True, d
          PY

      - name: Verify both live Workers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time, urllib.error, urllib.request
          targets={
            'identity':(os.environ['IDENTITY_URL']+'/health','10.2.0'),
            'core':(os.environ['CORE_URL']+'/health','4.0.0'),
          }
          headers={'User-Agent':'pterminology-turnstile-recovery/1.0','Accept':'application/json','Cache-Control':'no-cache'}
          final={}
          for attempt in range(1,46):
              current={}; ready=True
              for name,(url,version) in targets.items():
                  request=urllib.request.Request(url,headers=headers)
                  try:
                      with urllib.request.urlopen(request,timeout=20) as response:
                          status=response.status; data=json.load(response)
                  except urllib.error.HTTPError as error:
                      status=error.code
                      try: data=json.load(error)
                      except Exception: data={}
                  except Exception as error:
                      status=0; data={'transport_error':type(error).__name__}
                  checks=data.get('checks') or {}
                  current[name]={'http_status':status,'ok':data.get('ok'),'version':data.get('version'),'turnstile':checks.get('turnstile')}
                  if not (status==200 and data.get('ok') is True and data.get('version')==version and checks.get('turnstile') is True): ready=False
              final=current
              if ready: break
              time.sleep(6)
          if not all(item.get('http_status')==200 and item.get('ok') is True and item.get('turnstile') is True for item in final.values()):
              raise SystemExit(final)
          open('/tmp/recovered-health.json','w',encoding='utf-8').write(json.dumps(final,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(final,ensure_ascii=False))
          PY

      - name: Commit safe recovery report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          health=json.load(open('/tmp/recovered-health.json',encoding='utf-8'))
          method=open('/tmp/recovery-method',encoding='utf-8').read().strip()
          report={
            'schema_version':1,
            'recovered_at':datetime.now(timezone.utc).isoformat(),
            'sitekey_unchanged':True,
            'method':method,
            'secret_not_recorded':True,
            'workers':health,
            'passed':all(item.get('http_status')==200 and item.get('ok') is True and item.get('turnstile') is True for item in health.values())
          }
          open('reports/specialist-turnstile-current-widget-recovery-now.json','w',encoding='utf-8').write(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/specialist-turnstile-current-widget-recovery-now.json
          git commit -m "chore: record current-widget Turnstile recovery [skip ci]"
          git push origin HEAD:agent/inspect-cloudflare-specialists-now

      - name: Remove secret material
        if: always()
        run: rm -f /tmp/turnstile-secret /tmp/widget-current.json /tmp/widget-rotation.json /tmp/siteverify.json /tmp/recovery-method /tmp/rotation-failure.json
