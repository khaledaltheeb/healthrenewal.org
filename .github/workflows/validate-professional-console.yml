name: Validate Professional Assessment Console

on:
  push:
    branches: [main]
    paths:
      - "provider-assessment-demo/professional-console.html"
      - "provider-assessment-demo/index.html"
      - "provider-assessment-demo/condition-entry-v1.js"
      - "provider-assessment-demo/activation.js"
      - "provider-assessment-demo/professional-master-registry.js"
      - "provider-assessment-demo/professional-workflow.js"
      - "provider-assessment-demo/case-report-v1.js"
      - "provider-assessment-demo/case-report-interpretation-v2.js"
      - "provider-assessment-demo/case-report-export-v2.js"
      - ".github/workflows/validate-professional-console.yml"
  pull_request:
    paths:
      - "provider-assessment-demo/professional-console.html"
      - "provider-assessment-demo/index.html"
      - "provider-assessment-demo/condition-entry-v1.js"
      - "provider-assessment-demo/activation.js"
      - "provider-assessment-demo/professional-master-registry.js"
      - "provider-assessment-demo/professional-workflow.js"
      - "provider-assessment-demo/case-report-v1.js"
      - "provider-assessment-demo/case-report-interpretation-v2.js"
      - "provider-assessment-demo/case-report-export-v2.js"
      - ".github/workflows/validate-professional-console.yml"

permissions:
  contents: read

concurrency:
  group: professional-assessment-console-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-professional-console:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate registry syntax and exact coverage
        run: |
          node --check provider-assessment-demo/professional-master-registry.js
          node --check provider-assessment-demo/professional-workflow.js
          node --check provider-assessment-demo/condition-entry-v1.js
          node --check provider-assessment-demo/activation.js
          node --check provider-assessment-demo/case-report-v1.js
          node --check provider-assessment-demo/case-report-interpretation-v2.js
          node --check provider-assessment-demo/case-report-export-v2.js
          node <<'NODE'
          global.window = { PA_DEMO_DATA: { professional: [] } };
          require('./provider-assessment-demo/professional-master-registry.js');
          const groups = window.PA_PROFESSIONAL_GROUPS;
          if (!Array.isArray(groups) || groups.length !== 18) throw new Error(`Expected 18 professional groups, got ${groups?.length}`);
          const names = groups.flatMap(group => group.names || []);
          if (names.length !== 167) throw new Error(`Expected 167 professional tools and protocols, got ${names.length}`);
          const normalized = names.map(name => String(name).trim().toLowerCase());
          if (new Set(normalized).size !== normalized.length) throw new Error('Duplicate professional assessment names detected');
          for (const group of groups) {
            for (const field of ['category','conditions','kind','inputMode','activationStatus','recommendedRoles','names']) {
              if (!group[field] || (Array.isArray(group[field]) && !group[field].length)) throw new Error(`Missing ${field} in ${group.category || 'unknown group'}`);
            }
          }
          const added = window.PA_DEMO_DATA.professional;
          if (added.length !== 167) throw new Error(`Expected all 167 registry entries in the directory, got ${added.length}`);
          NODE

      - name: Validate unified console landing page
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit, parse_qs

          path = Path('provider-assessment-demo/professional-console.html')
          html = path.read_text(encoding='utf-8')
          required = [
              '<html lang="ar" dir="rtl"',
              'application-version" content="2026.07.24-live.7"',
              'rel="canonical"',
              'بوابة موحدة للسجل التشغيلي والتقارير',
              'لا تستخدم هذه الصفحة نظامًا منفصلًا',
              'مساحة UID المحلية نفسها',
              'فتح المقاييس والفحوص',
              'فتح التطبيقات المسجلة',
              'فتح التقارير المهنية',
              'تقارير متعددة الإصدارات',
              'النسخة الأصلية المصرح بها',
          ]
          missing = [token for token in required if token not in html]
          if missing:
              raise SystemExit(f'Missing unified console contract: {missing}')

          forbidden = [
              'Explore-2026!', 'الدخول التجريبي', 'اسم المستخدم التجريبي',
              'assignedEntity', 'administrationMode', 'recordStatus',
              'ownerUid:identity.uid', 'pa-demo-store-v${VERSION}:${identity.uid}',
              'fetch(', 'XMLHttpRequest', 'WebSocket', 'sendBeacon(', 'EventSource(',
          ]
          found = [token for token in forbidden if token in html]
          if found:
              raise SystemExit(f'Legacy standalone console code remains: {found}')

          class Inspector(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = []
                  self.links = []
                  self.application_scripts = 0
                  self.jsonld_scripts = 0
              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  if values.get('id'):
                      self.ids.append(values['id'])
                  if tag == 'a' and values.get('href'):
                      self.links.append(values['href'])
                  if tag == 'script':
                      if values.get('type') == 'application/ld+json':
                          self.jsonld_scripts += 1
                      else:
                          self.application_scripts += 1

          parser = Inspector()
          parser.feed(html)
          duplicates = sorted({item for item in parser.ids if parser.ids.count(item) > 1})
          if duplicates:
              raise SystemExit(f'Duplicate HTML ids: {duplicates}')
          if parser.application_scripts:
              raise SystemExit('The unified landing page must not contain a second application runtime')
          if parser.jsonld_scripts != 1:
              raise SystemExit(f'Expected one JSON-LD block, got {parser.jsonld_scripts}')

          routes = set()
          for href in parser.links:
              parsed = urlsplit(href.replace('&amp;', '&'))
              value = parse_qs(parsed.query).get('open', [None])[0]
              if value:
                  routes.add(value)
          expected_routes = {'professional', 'records', 'reports'}
          if not expected_routes.issubset(routes):
              raise SystemExit(f'Missing unified routes: {sorted(expected_routes - routes)}')
          for required_href in ['conditions/', 'center-guide.html']:
              if not any(required_href in href for href in parser.links):
                  raise SystemExit(f'Missing institutional destination: {required_href}')
          PY

      - name: Validate target views and professional controls
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          files = {
              'index': Path('provider-assessment-demo/index.html').read_text(encoding='utf-8'),
              'router': Path('provider-assessment-demo/condition-entry-v1.js').read_text(encoding='utf-8'),
              'activation': Path('provider-assessment-demo/activation.js').read_text(encoding='utf-8'),
              'reports': Path('provider-assessment-demo/case-report-v1.js').read_text(encoding='utf-8'),
              'interpretation': Path('provider-assessment-demo/case-report-interpretation-v2.js').read_text(encoding='utf-8'),
              'export': Path('provider-assessment-demo/case-report-export-v2.js').read_text(encoding='utf-8'),
          }
          release_match = re.search(r'<html[^>]+data-release="([^"]+)"', files['index'])
          version_match = re.search(r'<meta name="application-version" content="([^"]+)"', files['index'])
          if not release_match or not version_match or release_match.group(1) != version_match.group(1):
              raise SystemExit('Assessment release metadata is missing or inconsistent')
          release = release_match.group(1)
          required_by_file = {
              'index': ['data-institutional-contract="2026.07.25-v220"', 'data-view="professional"', 'case-report-interpretation-v2.js'],
              'router': ['professional: "professional"', 'records: "professional-records"', 'reports: "reports"', 'routeRequestedView'],
              'activation': ['view-professional-records', 'professional-record-form', 'recordStatus', 'administrationMode', 'scoreReference', 'rightsConfirmed'],
              'reports': ['view-reports', 'case-report-form', 'export-case-report-html', 'export-case-report-json', 'caseRecord.reports'],
              'interpretation': ['assessmentType', 'resultValidity', 'baselineIndicator', 'measurableGoal', 'familySummary', 'reviewAuditTrail', 'form.elements.reportId.value = ""'],
              'export': ['includesInterpretationContract: true', 'includesFamilySummary: true', 'includesReviewAudit: true', 'networkTransfer: false'],
          }
          errors = []
          for name, markers in required_by_file.items():
              for marker in markers:
                  if marker not in files[name]:
                      errors.append(f'{name} missing {marker}')
          combined = '\n'.join(files.values())
          for token in ['XMLHttpRequest', 'WebSocket', 'sendBeacon(', 'EventSource(', 'eval(', 'new Function(']:
              if token in combined:
                  errors.append(f'unsafe API {token}')
          if errors:
              raise SystemExit('\n'.join(errors))
          print({'unified_console': True, 'routes': 3, 'professional_records': True, 'reports': True, 'release': release, 'contract': '2026.07.25-v220'})
          PY

      - name: Validate non-diagnostic and rights boundaries
        run: |
          python - <<'PY'
          from pathlib import Path
          text = '\n'.join([
              Path('provider-assessment-demo/professional-console.html').read_text(encoding='utf-8'),
              Path('provider-assessment-demo/professional-master-registry.js').read_text(encoding='utf-8'),
              Path('provider-assessment-demo/activation.js').read_text(encoding='utf-8'),
              Path('provider-assessment-demo/case-report-interpretation-v2.js').read_text(encoding='utf-8'),
          ])
          required = [
              'النسخة الأصلية المصرح بها',
              'لا ينسخ بنود المقاييس أو مفاتيح التصحيح المحمية',
              'لا يثبت التشخيص أو الأهلية',
              'external-results-and-official-integrations-only-for-protected-instruments',
          ]
          missing = [token for token in required if token not in text]
          if missing:
              raise SystemExit(f'Missing rights or clinical-boundary statements: {missing}')
          forbidden_claims = ['تشخيص نهائي تلقائي', 'معتمد رسميًا لجميع الدول', 'بديل عن التقييم المهني']
          found = [token for token in forbidden_claims if token in text]
          if found:
              raise SystemExit(f'Forbidden clinical claims found: {found}')
          PY
