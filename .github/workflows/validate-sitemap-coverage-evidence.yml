name: Validate sitemap coverage evidence

on:
  pull_request:
    paths:
      - "docs/audits/sitemap-coverage-2026-08-04.md"
      - "api/audits/sitemap-coverage-2026-08-04.json"
      - "tests/test_sitemap_coverage_evidence.py"
      - "tests/test_sitemap_coverage_report_contract.py"
      - ".github/workflows/validate-sitemap-coverage-evidence.yml"
  push:
    branches: [main]
    paths:
      - "docs/audits/sitemap-coverage-2026-08-04.md"
      - "api/audits/sitemap-coverage-2026-08-04.json"
      - "tests/test_sitemap_coverage_evidence.py"
      - "tests/test_sitemap_coverage_report_contract.py"
      - ".github/workflows/validate-sitemap-coverage-evidence.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate audit evidence and completion contract
        run: python -m pytest -q tests/test_sitemap_coverage_evidence.py tests/test_sitemap_coverage_report_contract.py
