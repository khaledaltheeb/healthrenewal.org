name: Apply targeted SEO maintenance

on:
  push:
    branches:
      - integration/seo-targeted-v1

permissions:
  contents: write

concurrency:
  group: targeted-seo-maintenance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/seo-targeted-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply only reviewed SEO fixes
        run: |
          python -m py_compile scripts/fix_specific_seo_warnings_v1.py
          python scripts/fix_specific_seo_warnings_v1.py --write
          python scripts/fix_specific_seo_warnings_v1.py --check
      - name: Enforce exact change scope
        shell: bash
        run: |
          mapfile -t changed < <(git diff --name-only)
          printf '%s\n' "${changed[@]}"
          allowed='^(evidence-guides/clinical-anxiety/index\.html|guides/accessible-travel-planning/index\.html|resources/open-books-discovery/index\.html)$'
          for path in "${changed[@]}"; do
            [[ "$path" =~ $allowed ]] || { echo "Unexpected changed path: $path"; exit 1; }
          done
      - name: Commit deterministic page fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Target pages already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence-guides/clinical-anxiety/index.html \
            guides/accessible-travel-planning/index.html \
            resources/open-books-discovery/index.html
          git commit -m "seo: apply reviewed metadata fixes to three pages"
          git push origin HEAD:integration/seo-targeted-v1
