name: Verify evidence literacy library live v323

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/verify-evidence-literacy-library-live-v323.yml"
  workflow_run:
    workflows: ["Deploy validated main to GitHub Pages"]
    types: [completed]
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: evidence-literacy-library-live-v323-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  static-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate v323 live contract
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/verify-evidence-literacy-library-live-v323.yml').read_text(encoding='utf-8')
          required = (
              'MINIMUM_SHA: 71ebed26f6d3bd7fda2b8c0dea320d2c20f6188f',
              'library/evidence-literacy/',
              'how-to-read-systematic-review',
              'certainty-of-evidence-and-recommendations',
              'study-designs-bias-and-causality',
              'appraise-clinical-guideline',
              'evidence-literacy-library-v322.json',
              'المراجعة المنهجية ليست قوية لمجرد اسمها',
              'التقرير الكامل وفق إرشاد مناسب يسهل التقييم، لكنه لا يصلح تصميمًا ضعيفًا',
              'يقين الدليل يجيب عن مقدار الثقة',
              'الارتباط يعني أن متغيرين يتحركان معًا',
              'الإفصاح وحده ليس إدارة',
              'sitemap-library.xml',
              "section_audit_surface': 'exact-production-workflow-artifact'",
          )
          missing = [marker for marker in required if marker not in text]
          assert not missing, missing
          print({'status': 'static-contract-passed', 'markers': len(required), 'section_audit_surface': 'workflow-artifact-only'})
          PY

  live-publication:
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      BASE_URL: https://healthrenewal.org/
      MINIMUM_SHA: 71ebed26f6d3bd7fda2b8c0dea320d2c20f6188f
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Wait for non-rollback deployment containing v322
        run: |
          set -euo pipefail
          matched=0
          for i in $(seq 1 100); do
            token="${MINIMUM_SHA}-${i}-$(date +%s)"
            if curl --retry 2 --retry-delay 2 -H 'Cache-Control: no-cache' -fsSL "${BASE_URL}deployment.json?v=${token}" -o /tmp/deployment.json; then
              if python - <<'PY'
          import json, os, urllib.request, urllib.error
          from pathlib import Path
          live = json.loads(Path('/tmp/deployment.json').read_text(encoding='utf-8')).get('commit')
          minimum = os.environ['MINIMUM_SHA']
          assert isinstance(live, str) and len(live) == 40
          if live == minimum:
              raise SystemExit(0)
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/compare/{minimum}...{live}",
              headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'evidence-literacy-library-live-v323',
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  status = json.loads(response.read().decode('utf-8')).get('status')
          except urllib.error.HTTPError:
              raise SystemExit(1)
          raise SystemExit(0 if status in {'ahead', 'identical'} else 1)
          PY
              then matched=1; break; fi
            fi
            sleep 10
          done
          test "$matched" -eq 1

      - name: Download live library pages report and sitemap
        run: |
          set -euxo pipefail
          token="${MINIMUM_SHA}-live-$(date +%s)"
          curl --retry 6 --retry-delay 4 -H 'Cache-Control: no-cache' -fsSL "${BASE_URL}library/?v=${token}" -o /tmp/library.html
          curl --retry 6 --retry-delay 4 -H 'Cache-Control: no-cache' -fsSL "${BASE_URL}library/evidence-literacy/?v=${token}" -o /tmp/hub.html
          for slug in how-to-read-systematic-review certainty-of-evidence-and-recommendations study-designs-bias-and-causality appraise-clinical-guideline; do
            curl --retry 6 --retry-delay 4 -H 'Cache-Control: no-cache' -fsSL "${BASE_URL}library/evidence-literacy/${slug}/?v=${token}" -o "/tmp/${slug}.html"
          done
          curl --retry 6 --retry-delay 4 -H 'Cache-Control: no-cache' -fsSL "${BASE_URL}api/evidence-literacy-library-v322.json?v=${token}" -o /tmp/library.json
          curl --retry 6 --retry-delay 4 -H 'Cache-Control: no-cache' -fsSL "${BASE_URL}sitemap-library.xml?v=${token}" -o /tmp/sitemap-library.xml

      - name: Enforce live methodological depth evidence and discovery
        run: |
          python - <<'PY'
          import json, re, xml.etree.ElementTree as ET
          from pathlib import Path

          base = 'https://healthrenewal.org/'
          report = json.loads(Path('/tmp/library.json').read_text(encoding='utf-8'))
          parent = Path('/tmp/library.html').read_text(encoding='utf-8')
          hub = Path('/tmp/hub.html').read_text(encoding='utf-8')
          slugs = [
              'how-to-read-systematic-review',
              'certainty-of-evidence-and-recommendations',
              'study-designs-bias-and-causality',
              'appraise-clinical-guideline',
          ]
          pages = {slug: Path(f'/tmp/{slug}.html').read_text(encoding='utf-8') for slug in slugs}

          assert report['version'] == 322 and report['status'] == 'passed', report
          assert report['guide_count'] == 4 and report['generated_page_count'] == 5, report
          assert report['section_count'] == 24 and report['source_count'] >= 12, report
          assert report['minimum_guide_words'] >= 900, report
          assert report['external_methodology_review_completed'] is False, report
          assert report['review_status'] == 'internally-reviewed-external-methodology-review-required', report
          assert report['next_review_due'] == '2027-01-27', report
          assert parent.count('data-evidence-literacy-library-v322="parent-link"') == 1
          assert parent.count('/library/evidence-literacy/') == 1
          assert hub.count('class="card"') == 4
          assert 'جودة التقرير لا تساوي بالضرورة جودة الدراسة' in hub

          expected = {
              'how-to-read-systematic-review': ('المراجعة المنهجية ليست قوية لمجرد اسمها', 'الدلالة الإحصائية لا تحدد وحدها الأهمية العملية'),
              'certainty-of-evidence-and-recommendations': ('يقين الدليل يجيب عن مقدار الثقة', 'التوصية المشروطة'),
              'study-designs-bias-and-causality': ('الارتباط يعني أن متغيرين يتحركان معًا', 'التقرير الكامل وفق إرشاد مناسب يسهل التقييم، لكنه لا يصلح تصميمًا ضعيفًا'),
              'appraise-clinical-guideline': ('الإفصاح وحده ليس إدارة', 'تكييف الإرشاد ليس ترجمة لغوية فقط'),
          }
          for slug, phrases in expected.items():
              text = pages[slug]
              assert text.count('<h1') == 1, slug
              assert text.count('class="section-card"') == 6, slug
              assert '"@type": "Article"' in text and '"@type": "BreadcrumbList"' in text, slug
              assert 'لم تكتمل مراجعة خارجية مستقلة من متخصص في منهجية البحث' in text, slug
              ids = re.findall(r'\bid="([^"]+)"', text)
              assert len(ids) == len(set(ids)), (slug, ids)
              for phrase in phrases:
                  assert phrase in text, (slug, phrase)

          urls = [(node.text or '').strip() for node in ET.parse('/tmp/sitemap-library.xml').getroot().findall('{*}url/{*}loc') if node.text]
          for route in ['/library/evidence-literacy/'] + [f'/library/evidence-literacy/{slug}/' for slug in slugs]:
              assert urls.count(base + route) == 1, route
          assert len(urls) == len(set(urls))
          deployment = json.loads(Path('/tmp/deployment.json').read_text(encoding='utf-8'))
          print({'live_commit': deployment.get('commit'), 'guides': report['guide_count'], 'minimum_words': report['minimum_guide_words'], 'section_audit_surface': 'exact-production-workflow-artifact', 'status': 'evidence-literacy-library-live-v323-verified'})
          PY
