name: Fix specialist production sender source v2

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/fix-specialist-production-sender-source-v2.yml"

permissions:
  contents: write

concurrency:
  group: fix-specialist-production-sender-source
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Pin verified sender without reading any secret value
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('.github/workflows/deploy-specialist-identity-v10-production.yml')
          lines=path.read_text(encoding='utf-8').splitlines()
          replacement='      FROM_EMAIL: "PTerminology <no-reply@healthrenewal.org>"'
          matches=[]
          for index,line in enumerate(lines):
              stripped=line.strip()
              if stripped.startswith('FROM_EMAIL:') and ('SPECIALISTS_FROM_EMAIL' in line or 'no-reply@healthrenewal.org' in line):
                  matches.append(index)
          if len(matches)!=1:
              raise SystemExit(f'Expected exactly one production FROM_EMAIL line, found {len(matches)}')
          changed=lines[matches[0]] != replacement
          lines[matches[0]]=replacement
          path.write_text('\n'.join(lines)+'\n',encoding='utf-8')
          print({'changed':changed,'sender_domain':'healthrenewal.org','secret_values_read':False})
          PY
          if git diff --quiet -- .github/workflows/deploy-specialist-identity-v10-production.yml; then
            echo "Sender is already pinned."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/deploy-specialist-identity-v10-production.yml
          git commit -m "fix: pin verified specialist production sender"
          for attempt in {1..5}; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            sleep $((attempt*3))
          done
          exit 1
