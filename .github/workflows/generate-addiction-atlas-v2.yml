name: Generate addiction atlas v4

on:
  push:
    branches: [main]
    paths:
      - 'data/addiction-atlas/**'
      - 'scripts/publish_addiction_atlas_v2.py'
      - 'scripts/publish_addiction_atlas_v3.py'
      - 'scripts/validate_addiction_atlas_manifest.py'
      - 'addiction/substances/classes/**'
      - 'addiction/substances/learn/**'
      - '.github/workflows/generate-addiction-atlas-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-addiction-atlas-v4
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile generator and validators
        run: |
          python -m py_compile scripts/publish_addiction_atlas_v2.py scripts/publish_addiction_atlas_v3.py
          python -m py_compile scripts/validate_addiction_atlas_v2.py scripts/validate_addiction_atlas_manifest.py

      - name: Generate substance and comparison pages from registered waves
        run: python scripts/publish_addiction_atlas_v3.py .

      - name: Regenerate dedicated atlas sitemap from manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from xml.etree.ElementTree import Element, SubElement, ElementTree, indent

          root = Path('.')
          manifest = json.loads((root/'data/addiction-atlas/substance-waves.json').read_text(encoding='utf-8'))
          wave_routes = manifest.get('waves') or []
          if not wave_routes:
              raise SystemExit('empty addiction atlas wave manifest')
          slugs = {}
          for route in wave_routes:
              path = root / route.lstrip('/')
              if not path.is_file():
                  raise SystemExit(f'missing registered wave: {route}')
              payload = json.loads(path.read_text(encoding='utf-8'))
              for item in payload.get('substances', []):
                  slug = item['slug']
                  if slug in slugs:
                      raise SystemExit(f'duplicate substance slug: {slug}')
                  slugs[slug] = item
          comparisons = json.loads((root/'data/addiction-atlas/comparison-intents-v2.json').read_text(encoding='utf-8')).get('comparisons', [])
          class_slugs = ['opioids','stimulants','sedatives','cannabinoids','dissociatives','psychedelics','inhalants','nps']
          learn_slugs = ['addiction-dependence-tolerance','overdose','withdrawal','polysubstance-risk','evidence-strength','lower-risk-not-safe','mortality-data']
          urls = [
              'https://healthrenewal.org/addiction/substances/',
              'https://healthrenewal.org/addiction/compare/',
              'https://healthrenewal.org/addiction/substances/methodology/',
              'https://healthrenewal.org/addiction/substances/data/',
              'https://healthrenewal.org/addiction/substances/classes/',
              'https://healthrenewal.org/addiction/substances/learn/',
          ]
          urls += [f"https://healthrenewal.org/addiction/substances/classes/{slug}/" for slug in class_slugs]
          urls += [f"https://healthrenewal.org/addiction/substances/learn/{slug}/" for slug in learn_slugs]
          urls += [f"https://healthrenewal.org/addiction/substances/{slug}/" for slug in sorted(slugs)]
          urls += [f"https://healthrenewal.org/addiction/compare/{c['slug']}/" for c in comparisons if c.get('indexable')]
          if len(urls) != len(set(urls)):
              raise SystemExit('duplicate URL generated for addiction atlas sitemap')
          urlset = Element('urlset', {'xmlns':'http://www.sitemaps.org/schemas/sitemap/0.9'})
          for value in urls:
              node = SubElement(urlset, 'url')
              SubElement(node, 'loc').text = value
              SubElement(node, 'lastmod').text = '2026-08-25'
          indent(urlset, space='  ')
          ElementTree(urlset).write(root/'sitemap-addiction-atlas.xml', encoding='utf-8', xml_declaration=True)
          print({'atlasSitemapUrls': len(urls), 'substances': len(slugs), 'registeredWaves': len(wave_routes), 'indexableComparisons': sum(1 for c in comparisons if c.get('indexable'))})
          PY

      - name: Validate generated publication
        run: |
          python scripts/validate_addiction_atlas_manifest.py
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('api/addiction-atlas-v2.json').read_text(encoding='utf-8'))
          assert report['status'] == 'passed', report
          assert report['substances'] >= 48, report
          assert report['indexableComparisons'] >= 20, report
          substance_pages = list(Path('addiction/substances').glob('*/index.html'))
          comparison_pages = list(Path('addiction/compare').glob('*/index.html'))
          class_pages = list(Path('addiction/substances/classes').glob('*/index.html'))
          learn_pages = list(Path('addiction/substances/learn').glob('*/index.html'))
          assert len(substance_pages) >= report['substances'], (len(substance_pages), report)
          assert len(comparison_pages) >= report['indexableComparisons'], (len(comparison_pages), report)
          assert len(class_pages) >= 8, len(class_pages)
          assert len(learn_pages) >= 7, len(learn_pages)
          print({'substancePages': len(substance_pages), 'comparisonPages': len(comparison_pages), 'classPages': len(class_pages), 'learnPages': len(learn_pages), 'report': report})
          PY

      - name: Commit generated atlas publication
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add addiction/substances addiction/compare api/addiction-atlas-v2.json sitemap-addiction-atlas.xml
          if git diff --cached --quiet; then
            echo 'No generated atlas changes to commit.'
            exit 0
          fi
          git commit -m 'build(addiction-atlas): publish registered evidence waves'
          git push origin HEAD:main
