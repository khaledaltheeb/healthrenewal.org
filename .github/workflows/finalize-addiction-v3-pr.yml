name: Finalize addiction v3 static publication

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: finalize-addiction-v3-static-publication
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'automation/addiction-v3-finalizer'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Exit after finalization
        id: guard
        run: |
          if [ -f api/addiction-condition-guides-v3.json ] \
             && [ ! -f content/addiction-v3-static.part00.b64 ] \
             && [ ! -f content/addiction-v3-static.part01.b64 ] \
             && [ ! -f content/addiction-v3-static.tar.xz.b64 ] \
             && [ ! -f scripts/materialize_addiction_v3_once.py ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Materialize checksum-verified static files
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euxo pipefail
          test -f content/addiction-v3-static.part00.b64
          test -f content/addiction-v3-static.part01.b64
          python scripts/materialize_addiction_v3_once.py
          test -f addiction/index.html
          test -f addiction/conditions/index.html
          test -f addiction/methodology/index.html
          test -f addiction/cannabis-use-disorder/index.html
          test -f addiction/opioid-use-disorder/index.html
          test -f addiction/nicotine-tobacco-dependence/index.html
          test -f addiction/sedative-benzodiazepine-use-disorder/index.html
          test -f api/addiction-condition-guides-v3.json
          test -f tests/test_addiction_condition_guides_v3.py
      - name: Remove temporary machinery
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euxo pipefail
          rm -f content/addiction-v3-static.part00.b64
          rm -f content/addiction-v3-static.part01.b64
          rm -f content/addiction-v3-static.tar.xz.b64
          rm -f scripts/materialize_addiction_v3_once.py
          rm -f scripts/build_clean_addiction_condition_guides_once.sh
          rm -f .github/addiction-v3-finalizer-trigger.txt
          rm -rf diagnostics
          find .github/workflows -maxdepth 1 -type f -name 'one-time-*addiction*' -delete
          rm -f .github/workflows/finalize-addiction-v3-pr.yml
          test ! -e content/addiction-v3-static.part00.b64
          test ! -e content/addiction-v3-static.part01.b64
          test ! -e content/addiction-v3-static.tar.xz.b64
          test ! -e scripts/materialize_addiction_v3_once.py
      - name: Execute static contract
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euxo pipefail
          python -m py_compile tests/test_addiction_condition_guides_v3.py
          python - <<'PY'
          import runpy
          namespace = runpy.run_path('tests/test_addiction_condition_guides_v3.py')
          tests = [
              value
              for name, value in sorted(namespace.items())
              if name.startswith('test_') and callable(value)
          ]
          if len(tests) != 2:
              raise SystemExit(f'Expected 2 v3 tests, found {len(tests)}')
          for test in tests:
              test()
              print(f'PASS {test.__name__}')
          PY
      - name: Commit clean static publication to branch
        if: steps.guard.outputs.skip != 'true'
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euxo pipefail
          git config user.name "healthrenewal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "feat(addiction): publish integrated Arabic addiction guides v3"
          git push origin HEAD:"${HEAD_BRANCH}"
