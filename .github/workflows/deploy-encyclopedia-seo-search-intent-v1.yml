name: Validate encyclopedia SEO and search intent

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/deploy-encyclopedia-seo-search-intent-v1.yml"
      - "scripts/encyclopedia_seo_contract_v1.py"
      - "scripts/rebuild_encyclopedia_v13.py"
      - "scripts/run_encyclopedia_v13.py"
      - "tests/test_encyclopedia_seo_search_intent_v1.py"
      - "tests/test_encyclopedia_topic_hubs_v2.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-encyclopedia-seo-search-intent-v1.yml"
      - "scripts/encyclopedia_seo_contract_v1.py"
      - "scripts/rebuild_encyclopedia_v13.py"
      - "scripts/run_encyclopedia_v13.py"
      - "tests/test_encyclopedia_seo_search_intent_v1.py"
      - "tests/test_encyclopedia_topic_hubs_v2.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SITE_BASE: https://healthrenewal.org/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate all encyclopedia contracts
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/encyclopedia_seo_contract_v1.py \
            scripts/rebuild_encyclopedia_v13.py \
            scripts/run_encyclopedia_v13.py \
            tests/test_encyclopedia_seo_search_intent_v1.py \
            tests/test_encyclopedia_topic_hubs_v2.py
          python -m unittest -v \
            tests.test_encyclopedia_seo_search_intent_v1 \
            tests.test_encyclopedia_topic_hubs_v2
