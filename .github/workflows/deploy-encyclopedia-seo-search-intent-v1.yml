name: Deploy encyclopedia SEO and search intent v1

on:
  push:
    branches: [main]
    paths:
      - scripts/encyclopedia_seo_contract_v1.py
      - scripts/rebuild_encyclopedia_v13.py
      - scripts/run_encyclopedia_v13.py
      - tests/test_encyclopedia_seo_search_intent_v1.py
      - .github/workflows/deploy-encyclopedia-seo-search-intent-v1.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write
  pages: write
  id-token: write

concurrency:
  group: encyclopedia-seo-live-v1
  cancel-in-progress: true

env:
  SITE_BASE: https://healthrenewal.org/

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test 2000-page contract
        run: |
          set -euxo pipefail
          python -m unittest -v tests.test_encyclopedia_seo_search_intent_v1 tests.test_encyclopedia_topic_hubs_v2

      - name: Locate validated production artifact
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=validated-production-site&per_page=100" > /tmp/artifacts.json
          python - <<'PY'
          import json,os
          items=[x for x in json.load(open('/tmp/artifacts.json'))['artifacts'] if not x['expired'] and x.get('workflow_run',{}).get('head_branch')=='main']
          item=max(items,key=lambda x:x['created_at'])
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write(f"run_id={item['workflow_run']['id']}\n")
          print(item['workflow_run'])
          PY

      - uses: actions/download-artifact@v4
        with:
          name: validated-production-site
          path: _site
          repository: khaledaltheeb/healthrenewal.org
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Build encyclopedia and all sitemap families
        run: |
          set -euxo pipefail
          test -f _site/index.html
          python scripts/run_encyclopedia_v13.py _site
          python scripts/performance_hotfix_v14.py _site
          python scripts/optimize_site_performance_v14.py _site
          python scripts/strip_nonlab_runtime_v14.py _site
          python scripts/finalize_pwa_v14.py _site
          python scripts/enforce_platform_identity_v201.py _site
          python - <<'PY'
          from pathlib import Path
          for p in Path('_site').rglob('*'):
              if not p.is_file() or p.suffix.lower() not in {'.html','.xml','.json','.txt','.js','.css','.svg','.webmanifest'}:continue
              try:t=p.read_text(encoding='utf-8')
              except UnicodeDecodeError:continue
              t=t.replace('https://khaledaltheeb.github.io/pterminology-site','https://healthrenewal.org').replace('/pterminology-site/','/')
              p.write_text(t,encoding='utf-8')
          PY
          python scripts/generate_sitemap_index_v304.py _site
          touch _site/.nojekyll

      - name: Verify exact SEO and sitemap coverage
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          root=Path('_site');pages=sorted((root/'encyclopedia').glob('concept-*/index.html'))
          assert len(pages)==2000
          titles=set();descriptions=set();queries=set()
          for page in pages:
              text=page.read_text(encoding='utf-8')
              for mark in ('data-encyclopedia-seo="v1"','data-search-intent="encyclopedia-v1"','data-search-intent-faq="encyclopedia-v1"','"@type":"FAQPage"','rel="canonical"'):
                  assert mark in text,(page,mark)
              titles.add(re.search(r'<title>(.*?)</title>',text,re.S).group(1))
              descriptions.add(re.search(r'<meta name="description" content="([^"]+)">',text).group(1))
              queries.add(re.search(r'<p class="ency-v13__intent-query">(.*?)</p>',text,re.S).group(1))
          assert len(titles)==len(descriptions)==len(queries)==2000
          audit=json.loads((root/'api/encyclopedia-audit-v13.json').read_text())
          seo=json.loads((root/'api/encyclopedia-seo-search-intent-v1.json').read_text())
          sm=json.loads((root/'api/sitemap-index-v305.json').read_text())
          for key in ('concept_pages','unique_seo_titles','unique_descriptions','unique_primary_queries','seo_complete_pages','search_intent_sections','faq_schema_pages'):assert audit[key]==2000,(key,audit[key])
          assert seo['status']=='passed' and len(seo['items'])==2000
          assert sm['families']['encyclopedia']==2002
          family=(root/'sitemap-family-encyclopedia.xml').read_text()
          urls=re.findall(r'https://healthrenewal.org/encyclopedia/concept-\d{4}/',family)
          assert family.count('<url>')==2002 and len(set(urls))==2000
          print({'pages':len(pages),'seo':audit['seo_complete_pages'],'sitemap_urls':family.count('<url>')})
          PY

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live encyclopedia release
        run: |
          python - <<'PY'
          import json
          import re
          import time
          import urllib.error
          import urllib.request
          import xml.etree.ElementTree as ET

          base = 'https://healthrenewal.org'
          headers = {
              'Accept': 'text/html,application/json,application/xml;q=0.9,*/*;q=0.8',
              'Cache-Control': 'no-cache',
              'Pragma': 'no-cache',
              'User-Agent': 'HealthRenewal-Encyclopedia-Release-Verifier/1.0',
          }

          def fetch(path: str, nonce: str) -> bytes:
              separator = '&' if '?' in path else '?'
              request = urllib.request.Request(f'{base}{path}{separator}v={nonce}', headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  if response.status != 200:
                      raise RuntimeError(f'{path}: HTTP {response.status}')
                  return response.read()

          last_error = None
          for attempt in range(1, 91):
              nonce = f'${{ github.run_id }}-{attempt}-{time.time_ns()}'
              try:
                  first = fetch('/encyclopedia/concept-0001/', nonce).decode('utf-8')
                  last = fetch('/encyclopedia/concept-2000/', nonce).decode('utf-8')
                  seo = json.loads(fetch('/api/encyclopedia-seo-search-intent-v1.json', nonce).decode('utf-8'))
                  family_xml = fetch('/sitemap-family-encyclopedia.xml', nonce)

                  assert 'data-encyclopedia-seo="v1"' in first
                  assert 'data-search-intent="encyclopedia-v1"' in first
                  assert 'data-search-intent-faq="encyclopedia-v1"' in first
                  assert '"@type":"FAQPage"' in first
                  assert 'rel="canonical" href="https://healthrenewal.org/encyclopedia/concept-0001/"' in first
                  assert '/pterminology-site/' not in first

                  assert 'data-encyclopedia-seo="v1"' in last
                  assert 'data-search-intent="encyclopedia-v1"' in last
                  assert 'data-search-intent-faq="encyclopedia-v1"' in last
                  assert '"@type":"FAQPage"' in last
                  assert 'rel="canonical" href="https://healthrenewal.org/encyclopedia/concept-2000/"' in last
                  assert '/pterminology-site/' not in last

                  assert seo['status'] == 'passed', seo
                  assert seo['pages'] == 2000, seo.get('pages')
                  assert seo['seo_complete_pages'] == 2000, seo.get('seo_complete_pages')
                  assert seo['search_intent_sections'] == 2000, seo.get('search_intent_sections')
                  assert seo['faq_schema_pages'] == 2000, seo.get('faq_schema_pages')

                  root = ET.fromstring(family_xml)
                  namespace = {'sm': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
                  locations = [node.text for node in root.findall('.//sm:loc', namespace) if node.text]
                  concept_urls = [
                      url for url in locations
                      if re.fullmatch(r'https://healthrenewal\.org/encyclopedia/concept-\d{4}/', url)
                  ]
                  assert len(locations) == 2002, len(locations)
                  assert len(concept_urls) == 2000, len(concept_urls)
                  assert len(set(concept_urls)) == 2000
                  assert f'{base}/encyclopedia/' in locations
                  assert f'{base}/encyclopedia/all/' in locations

                  print(json.dumps({
                      'status': 'passed',
                      'attempt': attempt,
                      'live_pages': seo['pages'],
                      'live_seo_complete_pages': seo['seo_complete_pages'],
                      'live_search_intent_sections': seo['search_intent_sections'],
                      'live_faq_schema_pages': seo['faq_schema_pages'],
                      'live_sitemap_urls': len(locations),
                      'live_concept_urls': len(concept_urls),
                  }, ensure_ascii=False, indent=2))
                  raise SystemExit(0)
              except Exception as exc:
                  last_error = f'{type(exc).__name__}: {exc}'
                  print(json.dumps({'attempt': attempt, 'status': 'waiting', 'error': last_error}, ensure_ascii=False))
                  time.sleep(5)

          raise SystemExit(f'Live encyclopedia verification failed after 90 attempts: {last_error}')
          PY

      - name: Report deployment result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/804/comments" -f body="ENCYCLOPEDIA_DEPLOY_V1 status=${{ job.status }} sha=${{ github.sha }} run_id=${{ github.run_id }}"
