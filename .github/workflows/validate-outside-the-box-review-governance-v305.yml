name: Validate outside-the-box scientific review governance v305

on:
  pull_request:
    branches: ["main"]
    paths:
      - "content/v305/outside-the-box-review-governance-ar.json"
      - "scripts/publish_outside_the_box_review_governance_v305.py"
      - "assets/css/outside-the-box-review-governance-v305.css"
      - "tests/test_outside_the_box_review_governance_v305.py"
      - "scripts/apply_homepage_v20.py"
      - ".github/ISSUE_TEMPLATE/outside-the-box-scientific-review.yml"
      - ".github/workflows/validate-outside-the-box-review-governance-v305.yml"
  push:
    branches: ["main"]
    paths:
      - "content/v305/outside-the-box-review-governance-ar.json"
      - "scripts/publish_outside_the_box_review_governance_v305.py"
      - "assets/css/outside-the-box-review-governance-v305.css"
      - "tests/test_outside_the_box_review_governance_v305.py"
      - "scripts/apply_homepage_v20.py"
      - ".github/ISSUE_TEMPLATE/outside-the-box-scientific-review.yml"
      - ".github/workflows/validate-outside-the-box-review-governance-v305.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scientific-review-governance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Validate machine contracts and compile publishers
        run: |
          set -euxo pipefail
          python -m json.tool content/v254/outside-the-box-conditions-ar.json >/dev/null
          python -m json.tool content/v302/outside-the-box-ten-plan-framework-ar.json >/dev/null
          python -m json.tool content/v305/outside-the-box-review-governance-ar.json >/dev/null
          python -m py_compile scripts/publish_outside_the_box_v254.py
          python -m py_compile scripts/publish_outside_the_box_ten_plans_v302.py
          python -m py_compile scripts/publish_outside_the_box_reference_assets_v303.py
          python -m py_compile scripts/publish_outside_the_box_review_governance_v305.py
          python -m py_compile scripts/apply_homepage_v20.py
          python -m py_compile tests/test_outside_the_box_review_governance_v305.py

      - name: Validate review contract and exact 100-condition 1000-plan register
        run: python -m unittest -v tests.test_outside_the_box_review_governance_v305

      - name: Re-run ten-plan regression contract
        run: python -m unittest -v tests.test_outside_the_box_ten_plans_v302

      - name: Re-run evidence and instrument publication regression
        run: python -m unittest -v tests.test_outside_the_box_reference_assets_v303

      - name: Reject false approvals and unsafe claims
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          contract = json.loads(Path('content/v305/outside-the-box-review-governance-ar.json').read_text(encoding='utf-8'))
          assert contract['scope']['external_review_completed'] is False
          assert contract['scope']['global_accreditation_claim'] is False
          policy = contract['publication_policy']
          assert policy['allow_proprietary_test_content'] is False
          assert policy['allow_diagnostic_automation'] is False
          assert policy['allow_silent_corrections'] is False
          assert policy['allow_self_review_as_independent_review'] is False
          assert policy['allow_single_reviewer_global_approval'] is False

          paths = [
              Path('content/v305/outside-the-box-review-governance-ar.json'),
              Path('scripts/publish_outside_the_box_review_governance_v305.py'),
              Path('assets/css/outside-the-box-review-governance-v305.css'),
          ]
          text = '\n'.join(path.read_text(encoding='utf-8') for path in paths)
          forbidden = (
              'مراجعة خارجية مكتملة',
              'اعتماد عالمي مكتمل',
              'كل المصابين متفوقون',
              'الخطة تصلح للجميع',
              'معاقين',
          )
          found = [term for term in forbidden if term in text]
          assert not found, found
          assert 'لا تُنشر بنود الاختبارات المحمية' in text
          assert 'allow_proprietary_test_content' in text
          print({'false_approvals': 'blocked', 'protected_test_content': 'blocked', 'language': 'passed'})
          PY
