name: Materialize undercovered content v401

on:
  push:
    branches: [main]
    paths:
      - "content/v401/**"
      - "scripts/publish_undercovered_content_v401.py"
      - "scripts/publish_undercovered_content_v402.py"
      - "scripts/publish_undercovered_content_v403.py"
      - "scripts/publish_undercovered_content_v404.py"
      - "scripts/publish_special_needs_guides_v217.py"
      - "tests/test_undercovered_content_v401.py"
      - ".github/workflows/materialize-undercovered-content-v401.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-undercovered-content-v401
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate source contract
        run: |
          python -m py_compile scripts/publish_undercovered_content_v401.py
          python -m py_compile scripts/publish_undercovered_content_v402.py
          python -m py_compile scripts/publish_undercovered_content_v403.py
          python -m py_compile scripts/publish_undercovered_content_v404.py
          python -m unittest -v tests.test_undercovered_content_v401
      - name: Generate one hundred static pages
        run: python scripts/publish_undercovered_content_v401.py . > /tmp/undercovered-v401-report.json
      - name: Verify generated corpus
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          report = json.loads(Path("api/undercovered-content-v401.json").read_text(encoding="utf-8"))
          assert report["status"] == "passed", report
          assert report["version"] == 401, report
          assert report["engine_revision"] == 403, report
          assert report["page_count"] == 100, report
          assert report["unique_routes"] == 100, report
          assert report["profile_count"] == 12, report
          assert report["specialized_safety_check_pages"] == 100, report
          assert report["generic_placeholder_pages"] == 0, report
          assert report["distribution"] == {
              "special-needs": 60,
              "learning-paths": 15,
              "child": 10,
              "family": 8,
              "home": 7,
          }, report
          assert report["minimum_words"] >= 1800, report
          assert report["minimum_h2"] >= 20, report
          assert report["minimum_citations"] >= 3, report
          assert report["minimum_topic_mentions"] >= 18, report
          assert all(report["quality_gates"].values()), report
          placeholder = re.compile(r"بيئة\s+التطبيق|تطبيق\s+غير\s+فردي|المشاركة\s+والاستقلال\s+والرضا")
          for route in report["routes"]:
              page = Path(route) / "index.html"
              assert page.is_file(), route
              source = page.read_text(encoding="utf-8")
              assert 'data-content-engine="v403"' in source, route
              assert "يرتبط مباشرة بـ" not in source, route
              assert not placeholder.search(source), route
          print(json.dumps({
              "page_count": report["page_count"],
              "engine_revision": report["engine_revision"],
              "total_words": report["total_words"],
              "minimum_words": report["minimum_words"],
              "minimum_topic_mentions": report["minimum_topic_mentions"],
              "distribution": report["distribution"],
          }, ensure_ascii=False, indent=2))
          PY
      - name: Commit generated pages to publication branch
        run: |
          set -euo pipefail
          git config user.name "healthrenewal-content-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B automation/materialize-undercovered-v401
          git add \
            special-needs/practical \
            learning-paths \
            sectors/child \
            sectors/family \
            sectors/home \
            special-needs/index.html \
            sitemap-special-needs.xml \
            sitemap-family-special-needs.xml \
            sitemap-family-learning-paths.xml \
            sitemap-family-main.xml \
            api/undercovered-content-v401.json
          if git diff --cached --quiet; then
            echo "Generated publication tree is already current."
            exit 0
          fi
          git commit -m "content(v401): materialize 100 edited topic-specific pages"
          git push --force origin HEAD:automation/materialize-undercovered-v401
