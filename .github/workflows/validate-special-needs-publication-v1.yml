name: Validate special-needs publication inventory v1

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/ensure_special_needs_publication_v1.py"
      - "scripts/generate_sitemap_index_v304.py"
      - "tests/test_special_needs_publication_inventory_v1.py"
      - ".github/workflows/validate-special-needs-publication-v1.yml"
  push:
    branches: [main]
    paths:
      - "scripts/ensure_special_needs_publication_v1.py"
      - "scripts/generate_sitemap_index_v304.py"
      - "tests/test_special_needs_publication_inventory_v1.py"
      - ".github/workflows/validate-special-needs-publication-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: special-needs-publication-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile publication gate and sitemap integration
        run: |
          set -euxo pipefail
          python -m py_compile \
            scripts/ensure_special_needs_publication_v1.py \
            scripts/generate_sitemap_index_v304.py \
            tests/test_special_needs_publication_inventory_v1.py
      - name: Run focused publication inventory tests
        run: |
          set -euxo pipefail
          python -m unittest -v tests.test_special_needs_publication_inventory_v1
      - name: Verify integration markers
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path

          generator = Path("scripts/generate_sitemap_index_v304.py").read_text(encoding="utf-8")
          required = (
              "import ensure_special_needs_publication_v1 as special_needs_publication",
              "repair_missing_generated_families",
              "validate_publication_inventory",
              '"special_needs_publication_inventory"',
          )
          missing = [marker for marker in required if marker not in generator]
          assert not missing, missing
          print({"integration_markers": len(required), "status": "passed"})
          PY
