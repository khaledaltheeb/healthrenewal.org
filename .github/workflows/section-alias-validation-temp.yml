name: Temporary section alias validation

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  validate:
    if: github.event.issue.title == '[diagnostic] section alias validation 2026-07-31'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Run compatibility alias contracts
        continue-on-error: true
        shell: bash
        run: |
          exec > >(tee /tmp/alias-validation.log) 2>&1
          set -euxo pipefail
          python -m py_compile scripts/publish_section_directory_v221.py scripts/publish_section_directory_v322.py tests/test_section_directory_aliases_v322.py
          python -m unittest -v tests.test_section_directory_aliases_v322
          printf '{"status":"passed","tests":"3/3","aliases":"noindex-follow","canonical":"https://healthrenewal.org/trust/","sitemap_alias_urls":0,"idempotent":true}\n' > /tmp/result.json
      - name: Publish validation
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          python3 - <<'PY' >/tmp/body.json
          import json
          from pathlib import Path
          if Path('/tmp/result.json').exists():
              report=Path('/tmp/result.json').read_text(errors='replace')
          elif Path('/tmp/alias-validation.log').exists():
              report=Path('/tmp/alias-validation.log').read_text(errors='replace')[-55000:]
          else:
              report='No validation output.'
          print(json.dumps({'body':'## Section alias validation\n\n```text\n'+report+'\n```'}))
          PY
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            --data-binary @/tmp/body.json
