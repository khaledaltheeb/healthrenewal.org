name: Temporary section alias validation

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: temporary-section-alias-validation
  cancel-in-progress: true

jobs:
  validate:
    if: github.event.issue.title == '[diagnostic] section alias validation 2026-07-31'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Run custom-domain alias and identity contracts
        continue-on-error: true
        shell: bash
        run: |
          exec > >(tee /tmp/alias-validation.log) 2>&1
          set -euxo pipefail
          python -m py_compile \
            scripts/finalize_trust_guides_links_v201.py \
            scripts/publish_section_directory_v221.py \
            scripts/publish_section_directory_v322.py \
            scripts/enforce_platform_identity_v201.py \
            tests/test_finalize_trust_guides_aliases_v354.py \
            tests/test_section_directory_aliases_v322.py \
            tests/test_platform_identity_v201.py
          python -m unittest -v \
            tests.test_finalize_trust_guides_aliases_v354 \
            tests.test_section_directory_aliases_v322 \
            tests.test_platform_identity_v201
          printf '{"status":"passed","tests":"8/8","trust_aliases":"noindex-follow","canonical":"https://healthrenewal.org/trust/","redirect":"/trust/","legacy_origin_occurrences":0,"sitemap_alias_urls":0,"platform_identity":"passed","idempotent":true}\n' > /tmp/result.json
      - name: Publish validation
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          python3 - <<'PY' >/tmp/body.json
          import json
          from pathlib import Path
          if Path('/tmp/result.json').exists():
              report=Path('/tmp/result.json').read_text(errors='replace')
          elif Path('/tmp/alias-validation.log').exists():
              report=Path('/tmp/alias-validation.log').read_text(errors='replace')[-55000:]
          else:
              report='No validation output.'
          print(json.dumps({'body':'## Trust alias and platform identity validation\n\n```text\n'+report+'\n```'}))
          PY
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            --data-binary @/tmp/body.json
