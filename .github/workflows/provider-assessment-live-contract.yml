name: Validate Provider Assessment Live Contract

on:
  push:
    branches: ["main"]
    paths:
      - "provider-assessment-demo/index.html"
      - "provider-assessment-demo/institutional-live-v2.js"
      - "provider-assessment-demo/institutional-contract-v220.js"
      - "provider-assessment-demo/institutional-contract-v220-core.js"
      - "provider-assessment-demo/institutional-contract-v220-integration.js"
      - "provider-assessment-demo/institutional-contract-v220.css"
      - "provider-assessment-demo/institutional-contract-v220.json"
      - "provider-assessment-demo/sw-live-v2.js"
      - "provider-assessment-demo/professional-templates-v1.js"
      - "provider-assessment-demo/case-report-v1.js"
      - "provider-assessment-demo/case-report-interpretation-v2.js"
      - "provider-assessment-demo/condition-entry-v1.js"
      - "provider-assessment-demo/center-guide.html"
      - "provider-assessment-demo/professional-console.html"
      - "provider-assessment-demo/conditions/**"
      - ".github/workflows/provider-assessment-live-contract.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "provider-assessment-demo/index.html"
      - "provider-assessment-demo/institutional-live-v2.js"
      - "provider-assessment-demo/institutional-contract-v220.js"
      - "provider-assessment-demo/institutional-contract-v220-core.js"
      - "provider-assessment-demo/institutional-contract-v220-integration.js"
      - "provider-assessment-demo/institutional-contract-v220.css"
      - "provider-assessment-demo/institutional-contract-v220.json"
      - "provider-assessment-demo/sw-live-v2.js"
      - "provider-assessment-demo/professional-templates-v1.js"
      - "provider-assessment-demo/case-report-v1.js"
      - "provider-assessment-demo/case-report-interpretation-v2.js"
      - "provider-assessment-demo/condition-entry-v1.js"
      - "provider-assessment-demo/center-guide.html"
      - "provider-assessment-demo/professional-console.html"
      - "provider-assessment-demo/conditions/**"
      - ".github/workflows/provider-assessment-live-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-live-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          node --check provider-assessment-demo/case-report-v1.js
          node --check provider-assessment-demo/case-report-interpretation-v2.js
          node --check provider-assessment-demo/professional-templates-v1.js
          node --check provider-assessment-demo/condition-entry-v1.js
          node --check provider-assessment-demo/institutional-live-v2.js
          node --check provider-assessment-demo/institutional-contract-v220.js
          node --check provider-assessment-demo/institutional-contract-v220-core.js
          node --check provider-assessment-demo/institutional-contract-v220-integration.js
          node --check provider-assessment-demo/sw-live-v2.js

      - name: Validate v220 HTML and compatible asset tokens
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('provider-assessment-demo/index.html','utf8');
          const release = '2026.07.25-v220';
          const contractToken = '20260725-v220';
          const compatibleAssetToken = '20260724-live7';
          for (const marker of [
            `data-release="${release}"`, `data-institutional-contract="${release}"`,
            `application-version" content="${release}"`,
            `styles.css?v=${compatibleAssetToken}`, `catalog.js?v=${compatibleAssetToken}`,
            `conditions/conditions-data-v1.js?v=${compatibleAssetToken}`, `condition-entry-v1.js?v=${compatibleAssetToken}`,
            `professional-templates-v1.js?v=${compatibleAssetToken}`, `case-report-v1.js?v=${compatibleAssetToken}`,
            `case-report-interpretation-v2.js?v=${compatibleAssetToken}`, `institutional-live-v2.js?v=${compatibleAssetToken}`,
            `institutional-contract-v220.css?v=${contractToken}`, `institutional-contract-v220.js?v=${contractToken}`,
            'href="institutional-contract-v220.json"', 'data-institutional-contract-v220',
            'conditions-hub-link', 'استعراض الحالات العشرين', 'العقد المؤسسي المنشور v220',
            'مخطط تقييم متعدد المصادر', 'قوالب توثيق مهني', 'تقارير متعددة الإصدارات مع عقد تفسير'
          ]) if (!html.includes(marker)) throw new Error(`Institutional v220 HTML missing ${marker}`);
          const releaseMatch = html.match(/<html[^>]*\bdata-release="([^"]+)"/);
          const applicationMatch = html.match(/<meta\s+name="application-version"\s+content="([^"]+)"/);
          const contractMatch = html.match(/<html[^>]*\bdata-institutional-contract="([^"]+)"/);
          if (releaseMatch?.[1] !== release || applicationMatch?.[1] !== release || contractMatch?.[1] !== release) {
            throw new Error(`Primary institutional release mismatch: ${JSON.stringify({release:releaseMatch?.[1],application:applicationMatch?.[1],contract:contractMatch?.[1]})}`);
          }
          for (const forbidden of ['>مقفل<','>دليل فقط<','النسخة التجريبية المنشورة']) {
            if (html.includes(forbidden)) throw new Error(`Forbidden live wording: ${forbidden}`);
          }
          console.log({release,contractToken,compatibleAssetToken,html:'passed'});
          NODE

      - name: Validate institutional runtime and service worker
        run: |
          node <<'NODE'
          const fs = require('fs');
          const read = file => fs.readFileSync(file,'utf8');
          const compatibilityRelease = '2026.07.24-live.7';
          const institutionalRelease = '2026.07.25-v220';
          const institutional = read('provider-assessment-demo/institutional-live-v2.js');
          const contractLoader = read('provider-assessment-demo/institutional-contract-v220.js');
          const contractCore = read('provider-assessment-demo/institutional-contract-v220-core.js');
          const contractIntegration = read('provider-assessment-demo/institutional-contract-v220-integration.js');
          const worker = read('provider-assessment-demo/sw-live-v2.js');
          const releaseMarker = read('provider-assessment-demo/.report-interpretation-release').trim();
          if (releaseMarker !== compatibilityRelease) throw new Error(`Report interpretation compatibility marker mismatch: ${releaseMarker}`);
          for (const marker of ['loadProfessionalTemplates','loadConditionPathways','loadCaseReports','case-report-interpretation-v2.js']) {
            if (!institutional.includes(marker)) throw new Error(`Institutional compatibility runtime missing ${marker}`);
          }
          if (!contractLoader.includes('import("./institutional-contract-v220-integration.js")') || !contractLoader.includes(institutionalRelease)) {
            throw new Error('Institutional v220 loader or release marker is missing');
          }
          if (!contractCore.includes(`RELEASE = "${institutionalRelease}"`) || !contractCore.includes('institutional-contract-v220')) {
            throw new Error('Institutional v220 core release or schema marker is missing');
          }
          for (const marker of ['institutional-contract-v220-core.js','institutional-contract-v220-plans.js','العقد المؤسسي v220']) {
            if (!contractIntegration.includes(marker)) throw new Error(`Institutional v220 integration missing ${marker}`);
          }
          if (!institutional.includes(compatibilityRelease)) throw new Error('Institutional compatibility runtime release mismatch');
          if (!worker.includes(compatibilityRelease) || !worker.includes('cache: "no-store"')) throw new Error('Service worker release or network-first contract mismatch');
          console.log({institutionalRelease,compatibilityRelease,runtime:'passed',serviceWorker:'passed'});
          NODE

      - name: Validate report engine and interpretation safeguards
        run: |
          node <<'NODE'
          const fs = require('fs');
          const read = file => fs.readFileSync(file,'utf8');
          const reports = read('provider-assessment-demo/case-report-v1.js');
          const interpretation = read('provider-assessment-demo/case-report-interpretation-v2.js');
          for (const marker of ['view-reports','case-report-dialog','caseRecord.reports','versionNumber','sourceSessionCount','sourceProfessionalCount','export-case-report-html','export-case-report-json','report-print-mode','ownerUid: identity.uid']) {
            if (!reports.includes(marker)) throw new Error(`Case report engine missing ${marker}`);
          }
          for (const marker of ['assessmentType','resultValidity','interpretationLimitations','baselineIndicator','measurableGoal','remeasurementDate','familySummary','reviewAuditTrail','supersedesReportId','PA_REPORT_INTERPRETATION_CONTRACT']) {
            if (!interpretation.includes(marker)) throw new Error(`Report interpretation contract missing ${marker}`);
          }
          for (const marker of ['المسح لا يثبت التشخيص أو الأهلية','لا تُنسخ البنود أو مفاتيح التصحيح أو المعايير','ملخص موجه للأسرة أو الشخص']) {
            if (!interpretation.includes(marker)) throw new Error(`Report safeguard missing ${marker}`);
          }
          console.log({reports:true,interpretationContract:true,rightsSafeguards:true});
          NODE

      - name: Validate institutional entry pages
        run: |
          node <<'NODE'
          const fs = require('fs');
          const read = file => fs.readFileSync(file,'utf8');
          const centerGuide = read('provider-assessment-demo/center-guide.html');
          const consolePage = read('provider-assessment-demo/professional-console.html');
          for (const page of [centerGuide, consolePage]) {
            for (const forbidden of ['Explore-2026!','الدخول التجريبي','اسم المستخدم التجريبي','النسخة التجريبية','>مقفل<','>دليل فقط<']) {
              if (page.includes(forbidden)) throw new Error(`Legacy demo wording remains: ${forbidden}`);
            }
            if (!/2026\.07\.(?:24-live\.[567]|25-v220)/.test(page)) throw new Error('Institutional entry page has no accepted release marker');
          }
          if (!consolePage.includes('?open=professional') || !consolePage.includes('?open=records')) throw new Error('Professional console does not route to unified views');
          if (!centerGuide.includes('قوالب التطبيق المتخصصة') || !centerGuide.includes('مسارات الحالات')) throw new Error('Center guide is incomplete');
          console.log({unifiedConsole:true,centerGuide:true,status:'passed'});
          NODE
