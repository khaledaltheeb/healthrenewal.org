name: Validate Provider Assessment Live Contract

on:
  push:
    branches: ["main"]
    paths:
      - "provider-assessment-demo/index.html"
      - "provider-assessment-demo/institutional-live-v2.js"
      - "provider-assessment-demo/sw-live-v2.js"
      - "provider-assessment-demo/professional-templates-v1.js"
      - "provider-assessment-demo/case-report-v1.js"
      - "provider-assessment-demo/condition-entry-v1.js"
      - "provider-assessment-demo/center-guide.html"
      - "provider-assessment-demo/professional-console.html"
      - "provider-assessment-demo/conditions/**"
      - ".github/workflows/provider-assessment-live-contract.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "provider-assessment-demo/index.html"
      - "provider-assessment-demo/institutional-live-v2.js"
      - "provider-assessment-demo/sw-live-v2.js"
      - "provider-assessment-demo/professional-templates-v1.js"
      - "provider-assessment-demo/case-report-v1.js"
      - "provider-assessment-demo/condition-entry-v1.js"
      - "provider-assessment-demo/center-guide.html"
      - "provider-assessment-demo/professional-console.html"
      - "provider-assessment-demo/conditions/**"
      - ".github/workflows/provider-assessment-live-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-live-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check provider-assessment-demo/case-report-v1.js
          node --check provider-assessment-demo/professional-templates-v1.js
          node --check provider-assessment-demo/condition-entry-v1.js
          node --check provider-assessment-demo/institutional-live-v2.js
          node --check provider-assessment-demo/sw-live-v2.js

      - name: Validate static release, reports and institutional entry pages
        run: |
          node <<'NODE'
          const fs = require('fs');
          const read = file => fs.readFileSync(file,'utf8');
          const html = read('provider-assessment-demo/index.html');
          const institutional = read('provider-assessment-demo/institutional-live-v2.js');
          const worker = read('provider-assessment-demo/sw-live-v2.js');
          const reports = read('provider-assessment-demo/case-report-v1.js');
          const centerGuide = read('provider-assessment-demo/center-guide.html');
          const consolePage = read('provider-assessment-demo/professional-console.html');
          const release = '2026.07.24-live.6';
          const cacheToken = '20260724-live6';

          for (const marker of [
            `data-release="${release}"`,
            `application-version" content="${release}"`,
            `styles.css?v=${cacheToken}`,
            `catalog.js?v=${cacheToken}`,
            `conditions/conditions-data-v1.js?v=${cacheToken}`,
            `condition-entry-v1.js?v=${cacheToken}`,
            `professional-templates-v1.js?v=${cacheToken}`,
            `case-report-v1.js?v=${cacheToken}`,
            `institutional-live-v2.js?v=${cacheToken}`,
            'conditions-hub-link',
            'استعراض الحالات العشرين',
            'قوالب إدخال متخصصة',
            'تقارير مهنية متعددة الإصدارات'
          ]) if (!html.includes(marker)) throw new Error(`Live HTML missing ${marker}`);

          for (const stale of ['20260724-live2','20260724-live4','20260724-live5','2026.07.24-live.2','2026.07.24-live.4','2026.07.24-live.5']) {
            if (html.includes(stale)) throw new Error(`Stale release remains in live HTML: ${stale}`);
          }

          if (!institutional.includes(release) || !institutional.includes('loadProfessionalTemplates') || !institutional.includes('loadConditionPathways') || !institutional.includes('loadCaseReports')) throw new Error('Institutional runtime release mismatch');
          if (!worker.includes(release) || !worker.includes('cache: "no-store"')) throw new Error('Service worker release or network-first contract mismatch');

          for (const marker of ['view-reports','case-report-dialog','caseRecord.reports','versionNumber','sourceSessionCount','sourceProfessionalCount','export-case-report-html','export-case-report-json','report-print-mode','ownerUid: identity.uid']) {
            if (!reports.includes(marker)) throw new Error(`Case report engine missing ${marker}`);
          }
          for (const marker of ['نقاط القوة','الاحتياجات والعوائق','الملخص المتكامل','التوصيات وخطة الدعم','قرار المسار','المؤشرات التي ستُتابع']) {
            if (!reports.includes(marker)) throw new Error(`Report content missing ${marker}`);
          }

          for (const page of [centerGuide, consolePage]) {
            for (const forbidden of ['Explore-2026!','الدخول التجريبي','اسم المستخدم التجريبي','النسخة التجريبية','>مقفل<','>دليل فقط<']) {
              if (page.includes(forbidden)) throw new Error(`Legacy demo wording remains: ${forbidden}`);
            }
            if (!page.includes('2026.07.24-live.5') && !page.includes('2026.07.24-live.6')) throw new Error('Institutional entry page has no release marker');
          }
          if (!consolePage.includes('?open=professional') || !consolePage.includes('?open=records')) throw new Error('Professional console does not route to unified views');
          if (!centerGuide.includes('قوالب التطبيق المتخصصة') || !centerGuide.includes('مسارات الحالات')) throw new Error('Center guide is incomplete');

          for (const forbidden of ['>مقفل<','>دليل فقط<','النسخة التجريبية المنشورة']) {
            if (html.includes(forbidden)) throw new Error(`Forbidden live wording: ${forbidden}`);
          }
          console.log({release, cacheToken, conditions:20, templateFamilies:7, reports:true, unifiedConsole:true, status:'passed'});
          NODE
