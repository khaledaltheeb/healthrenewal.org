name: Validate cerebral palsy guide

on:
  push:
    paths:
      - "special-needs/conditions/cerebral-palsy/**"
      - "special-needs/conditions/index.html"
      - "sitemap-cerebral-palsy.xml"
      - "sitemap-index.xml"
      - "tests/test_cerebral_palsy_publication_contract.py"
      - ".github/workflows/validate-cerebral-palsy-guide.yml"
  pull_request:
    paths:
      - "special-needs/conditions/cerebral-palsy/**"
      - "special-needs/conditions/index.html"
      - "sitemap-cerebral-palsy.xml"
      - "sitemap-index.xml"
      - "tests/test_cerebral_palsy_publication_contract.py"
      - ".github/workflows/validate-cerebral-palsy-guide.yml"

permissions:
  contents: read

jobs:
  publication-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest
      - run: python -m pytest -q tests/test_cerebral_palsy_publication_contract.py
