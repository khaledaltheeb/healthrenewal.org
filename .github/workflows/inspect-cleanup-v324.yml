name: Inspect final cleanup v325

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/inspect-cleanup-v324.yml"

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: List cleanup workflow runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']
          req=urllib.request.Request(
              f'https://api.github.com/repos/{repo}/actions/workflows/final-cleanup-v325.yml/runs?per_page=20',
              headers={
                  'Authorization':f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept':'application/vnd.github+json',
                  'X-GitHub-Api-Version':'2022-11-28',
                  'User-Agent':'cleanup-inspector-v325',
              },
          )
          with urllib.request.urlopen(req,timeout=30) as response:
              runs=json.loads(response.read().decode('utf-8')).get('workflow_runs',[])
          compact=[{k:r.get(k) for k in ('id','event','status','conclusion','head_sha','run_number','created_at','updated_at')} for r in runs]
          print(json.dumps({'count':len(compact),'runs':compact},ensure_ascii=False,indent=2))
          if not compact:
              raise SystemExit('No v325 cleanup workflow run found')
          PY
