name: Hotfix password reset email pass-through

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  hotfix:
    if: github.event.issue.title == '[hotfix] restore password reset email pass-through 2026-07-31'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Remove the local sender-domain blockade
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('specialists-partners/account-backend/src/index-v10-production.js')
          text = path.read_text(encoding='utf-8')
          original = text

          text = text.replace("const ADMIN_EMAIL_RESET_PATH = /^\\/v1\\/admin\\/users\\/([a-z0-9-]+)\\/password-reset$/i;\n", "")
          text = re.sub(
              r"const CONSUMER_SENDER_DOMAINS = new Set\(\[.*?\]\);\n\n",
              "",
              text,
              flags=re.S,
          )
          text = re.sub(
              r"\n      if \(request\.method === 'POST' && url\.pathname === '/v1/auth/password/request' && !sender\.ready\) \{\n        return senderUnavailableResponse\(cors, sender, false\);\n      \}\n",
              "\n",
              text,
          )
          text = re.sub(
              r"\n      const adminResetMatch = url\.pathname\.match\(ADMIN_EMAIL_RESET_PATH\);\n      if \(request\.method === 'POST' && adminResetMatch && !sender\.ready\) \{.*?\n      \}\n",
              "\n",
              text,
              flags=re.S,
          )
          text = re.sub(
              r"\n      if \(request\.method === 'POST' && url\.pathname === '/v1/admin/users' && !sender\.ready\) \{.*?\n      \}\n      return ensureCors",
              "\n      return ensureCors",
              text,
              flags=re.S,
          )
          text = text.replace(
              "const ready = provider.authValid === true && sender.ready;",
              "const ready = provider.authValid === true;",
          )
          text = text.replace(
              "code:ready ? (provider.code || 'ready') : (sender.ready ? (provider.code || 'provider_unavailable') : sender.code),",
              "code:ready ? (provider.code || 'ready') : (provider.code || 'provider_unavailable'),",
          )
          text = text.replace(
              "passwordRecoveryEmail:data.capabilities?.passwordRecoveryEmail === true && sender.ready,",
              "passwordRecoveryEmail:data.capabilities?.passwordRecoveryEmail === true,",
          )

          replacement = '''export function senderReadiness(env = {}) {
  const from = String(env.FROM_EMAIL || '').trim().toLowerCase();
  const bracketed = from.match(/<\\s*([^<>\\s]+@[^<>\\s]+)\\s*>$/);
  const address = bracketed ? bracketed[1] : from;
  const match = address.match(/^[^\\s@]+@([^\\s@]+)$/);
  const domain = match ? match[1].replace(/\\.$/, '') : null;
  const policyVersion = '2';
  if (!domain) {
    return {ready:false, configured:false, code:'sender_not_configured', domain:null, policyVersion};
  }
  return {
    ready:true,
    configured:true,
    code:'sender_delivery_delegated_to_provider',
    domain,
    policyVersion,
  };
}

'''
          text, count = re.subn(
              r"export function senderReadiness\(env = \{\}\) \{.*?\n\}\n\nfunction senderUnavailableResponse\(cors, sender, admin\) \{.*?\n\}\n\n",
              replacement,
              text,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'Expected one sender readiness block, replaced {count}')

          required = [
              "sender_delivery_delegated_to_provider",
              "passwordRecoveryEmail:data.capabilities?.passwordRecoveryEmail === true,",
              "const ready = provider.authValid === true;",
          ]
          forbidden = [
              "CONSUMER_SENDER_DOMAINS",
              "senderUnavailableResponse(",
              "url.pathname === '/v1/auth/password/request' && !sender.ready",
              "ADMIN_EMAIL_RESET_PATH",
          ]
          for marker in required:
              if marker not in text:
                  raise SystemExit(f'Missing required marker: {marker}')
          for marker in forbidden:
              if marker in text:
                  raise SystemExit(f'Forbidden marker remains: {marker}')
          if text == original:
              raise SystemExit('No source change was made')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate the specialist identity release
        run: |
          set -euo pipefail
          node --check specialists-partners/account-backend/src/index-v10-production.js
          python -m unittest -v \
            tests.test_specialist_accounts_v5 \
            tests.test_specialist_identity_v6 \
            tests.test_specialist_recovery_v8 \
            tests.test_specialist_identity_v10 \
            tests.test_specialist_turnstile_persistence

      - name: Commit hotfix and remove temporary workflow
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/hotfix-password-reset-email-pass-through-temp.yml
          git add specialists-partners/account-backend/src/index-v10-production.js
          git commit -m 'fix: restore password reset email delivery pass-through'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              break
            fi
            git pull --rebase origin main
            if [ "$attempt" = 5 ]; then exit 1; fi
          done

      - name: Close trigger issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed --comment 'تمت إزالة حاجز نطاق المرسل وإعادة تمرير طلبات الاستعادة إلى مزود البريد الفعلي، مع نجاح اختبارات القطاع.'
