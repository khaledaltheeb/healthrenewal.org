name: Build Quick Information Discover section

on:
  push:
    branches:
      - agent/quick-info-discover-150
    paths:
      - "scripts/quick_info_topics.py"
      - "scripts/generate_quick_info.py"
      - "scripts/render_quick_info_cards_v2.py"
      - "scripts/enrich_quick_info_content.py"
      - "scripts/register_quick_info_discovery.py"
      - ".github/workflows/build-quick-info-discover.yml"
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]
    paths:
      - "quick-info/**"
      - "assets/quick-info/**"
      - "scripts/quick_info_topics.py"
      - "scripts/generate_quick_info.py"
      - "scripts/render_quick_info_cards_v2.py"
      - "scripts/enrich_quick_info_content.py"
      - "scripts/register_quick_info_discovery.py"
      - "api/v1/quick-info.json"
      - "sitemap-quick-info.xml"
      - "sitemap-index.xml"
      - "sitemap.xml"
      - "robots.txt"
      - "index.html"
      - "reports/quick-info-discover-150.json"
      - ".github/workflows/build-quick-info-discover.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quick-info-discover-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve source branch
        id: source
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "branch=${{ github.event.pull_request.head.ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "branch=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.branch }}
          fetch-depth: 0

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image support
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow

      - name: Compile generators
        run: |
          python -m py_compile \
            scripts/quick_info_topics.py \
            scripts/generate_quick_info.py \
            scripts/render_quick_info_cards_v2.py \
            scripts/enrich_quick_info_content.py \
            scripts/register_quick_info_discovery.py

      - name: Generate, illustrate, enrich, and register section
        run: |
          python scripts/generate_quick_info.py
          python scripts/render_quick_info_cards_v2.py
          python scripts/enrich_quick_info_content.py
          python scripts/register_quick_info_discovery.py

      - name: Validate content and Discover contracts
        run: |
          python scripts/generate_quick_info.py --check
          python scripts/register_quick_info_discovery.py
          python scripts/verify_homepage_v19.py
          test "$(find quick-info -mindepth 2 -maxdepth 2 -name index.html | wc -l)" -eq 150
          test "$(find assets/quick-info/cards -maxdepth 1 -name '*.jpg' | wc -l)" -eq 150
          test "$(grep -rl 'data-quality="enriched-v2"' quick-info/*/index.html | wc -l)" -eq 150
          test "$(grep -rl 'data-comparison-quality="pair-specific-v3"' quick-info/*/index.html | wc -l)" -eq 35
          test "$(grep -rl 'G-VLZMV8Y4JP' quick-info/index.html quick-info/*/index.html | wc -l)" -eq 151
          test -s quick-info/index.html
          test -s quick-info/feed.xml
          test -s sitemap-quick-info.xml
          test -s api/v1/quick-info.json
          test -s reports/quick-info-discover-150.json
          grep -q 'max-image-preview:large' quick-info/sadness-or-depression/index.html
          grep -q 'og:image:width.*1280' quick-info/sadness-or-depression/index.html
          grep -q 'معلومات سريعة' index.html
          grep -q 'الخطوة العملية الأقرب' quick-info/five-reasons-procrastination/index.html
          grep -q 'يصبح هذا المؤشر أكثر أهمية' quick-info/five-tips-after-breakup/index.html
          grep -q 'السؤال الحاسم' quick-info/care-or-monitoring/index.html
          grep -q '<strong class="item-title">حزن أم اكتئاب؟</strong>' index.html
          ! grep -q '<h3 class="item-title">حزن أم اكتئاب؟</h3>' index.html
          test "$(grep -c '^Sitemap:' robots.txt)" -eq 1
          grep -q 'Sitemap: https://healthrenewal.org/sitemap-index.xml' robots.txt
          grep -q 'https://healthrenewal.org/sitemap-quick-info.xml' sitemap-index.xml

      - name: Commit generated static section safely
        shell: bash
        env:
          SOURCE_BRANCH: ${{ steps.source.outputs.branch }}
        run: |
          set -euo pipefail
          git config user.name "Rawafid Quick Information Automation"
          git config user.email "actions@users.noreply.github.com"

          GENERATED_PATHS=(
            quick-info
            assets/quick-info
            api/v1/quick-info.json
            sitemap-quick-info.xml
            sitemap-index.xml
            sitemap.xml
            robots.txt
            index.html
            reports/quick-info-discover-150.json
          )

          git add "${GENERATED_PATHS[@]}"
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "feat(quick-info): publish 150 enriched Discover pages"

          for attempt in 1 2 3; do
            echo "Push attempt ${attempt}"
            git fetch origin "${SOURCE_BRANCH}"
            if ! git merge-base --is-ancestor "origin/${SOURCE_BRANCH}" HEAD; then
              if ! git rebase "origin/${SOURCE_BRANCH}"; then
                git rebase --abort || true
                echo "Rebase failed on attempt ${attempt}"
                sleep 2
                continue
              fi

              # Rebuild after incorporating newer branch commits so generated
              # output always matches the latest generator and registry code.
              python scripts/generate_quick_info.py
              python scripts/render_quick_info_cards_v2.py
              python scripts/enrich_quick_info_content.py
              python scripts/register_quick_info_discovery.py
              python scripts/generate_quick_info.py --check
              python scripts/verify_homepage_v19.py
              git add "${GENERATED_PATHS[@]}"
              if ! git diff --cached --quiet; then
                git commit --amend --no-edit
              fi
            fi

            if git push origin "HEAD:${SOURCE_BRANCH}"; then
              echo "Generated output pushed to ${SOURCE_BRANCH}"
              exit 0
            fi
            sleep 2
          done

          echo "Failed to push generated output after three synchronized attempts"
          exit 1
