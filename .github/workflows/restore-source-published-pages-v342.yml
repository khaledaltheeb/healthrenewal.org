name: Restore source-published pages to GitHub Pages v342

on:
  workflow_run:
    workflows: ["Deploy validated main to GitHub Pages"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: source-publication-parity-v342
  cancel-in-progress: false

jobs:
  restore-and-deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout the exact deployed source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Resolve the matching discovery-audited artifact run
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          run_id="$(
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/audit-production-discovery-v220.yml/runs?branch=main&status=success&per_page=50" \
              --jq '.workflow_runs[] | select(.head_sha == env.EXPECTED_SHA) | .id' \
              | head -n 1
          )"
          test -n "${run_id}"
          echo "run_id=${run_id}" >> "${GITHUB_OUTPUT}"
          echo "Matched discovery run ${run_id} to ${EXPECTED_SHA}"

      - name: Download the exact discovery-audited production artifact
        uses: actions/download-artifact@v4
        with:
          name: validated-production-site
          path: validated-site
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore every source-sitemap public route missing from production
        run: |
          set -euxo pipefail
          python -m py_compile scripts/restore_source_published_pages_v342.py
          python scripts/restore_source_published_pages_v342.py \
            validated-site \
            --source-root . \
            --report validated-site/api/source-publication-parity-v342.json

      - name: Enforce restored publication discovery and artifact integrity
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euxo pipefail
          python scripts/audit_orphan_pages_v197.py validated-site --fail-on-critical --require-gateways
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path('validated-site')
          report = json.loads((root / 'api/source-publication-parity-v342.json').read_text(encoding='utf-8'))
          deployment = json.loads((root / 'deployment.json').read_text(encoding='utf-8'))
          discovery = json.loads((root / 'api/orphan-page-audit-v197.json').read_text(encoding='utf-8'))

          assert report['version'] == 342 and report['status'] == 'passed', report
          assert report['initially_missing_routes'] > 0, report
          assert report['restored_routes'] == report['initially_missing_routes'], report
          assert report['remaining_missing_routes'] == [], report
          assert report['broken_local_references'] == [], report
          assert report['critical_files_unchanged'] is True, report
          assert deployment['commit'] == os.environ['EXPECTED_SHA'], deployment
          assert discovery['status'] == 'passed', discovery
          for key in ('critical_orphans', 'critical_unmapped', 'missing_gateways', 'gateway_orphans', 'gateway_unmapped'):
              assert discovery[key] == [], (key, discovery[key])
          for name in ('index.html', 'sitemap.xml', 'manifest.webmanifest', 'sw.js'):
              path = root / name
              expected = deployment['artifacts'][name]
              assert hashlib.sha256(path.read_bytes()).hexdigest() == expected['sha256'], name
              assert path.stat().st_size == expected['bytes'], name
          assert (root / 'family-guide/index.html').is_file(), report
          assert (root / 'family-guide/conditions/autism/index.html').is_file(), report
          assert (root / 'family-guide/tools/family-plan/index.html').is_file(), report
          assert (root / 'sitemap-family-guide.xml').is_file(), report
          print({
              'commit': deployment['commit'],
              'restored_routes': report['restored_routes'],
              'restored_html_routes': report['restored_html_routes'],
              'restored_surfaces': report['restored_top_level_surfaces'],
              'discovery': discovery['status'],
              'critical_files_unchanged': report['critical_files_unchanged'],
          })
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload restored Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: validated-site

      - name: Deploy restored public routes
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify the restored routes live
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euxo pipefail
          base="${PAGE_URL%/}/"
          token="${EXPECTED_SHA}"
          for route in \
            deployment.json \
            family-guide/ \
            family-guide/conditions/autism/ \
            family-guide/conditions/gnb5-related-neurodevelopmental-disorder/ \
            family-guide/tools/family-plan/ \
            sitemap-family-guide.xml \
            api/source-publication-parity-v342.json; do
            curl --retry 8 --retry-delay 5 -H 'Cache-Control: no-cache' -fsSL \
              "${base}${route}?v=${token}" -o "/tmp/$(echo "${route}" | tr '/.' '__')"
          done
          EXPECTED_SHA="${EXPECTED_SHA}" python - <<'PY'
          import json
          import os
          from pathlib import Path

          deployment = json.loads(Path('/tmp/deployment_json').read_text(encoding='utf-8'))
          report = json.loads(Path('/tmp/api_source-publication-parity-v342_json').read_text(encoding='utf-8'))
          assert deployment['commit'] == os.environ['EXPECTED_SHA'], deployment
          assert report['version'] == 342 and report['status'] == 'passed', report
          assert report['restored_routes'] >= 60, report
          for name in (
              '/tmp/family-guide_',
              '/tmp/family-guide_conditions_autism_',
              '/tmp/family-guide_conditions_gnb5-related-neurodevelopmental-disorder_',
              '/tmp/family-guide_tools_family-plan_',
          ):
              text = Path(name).read_text(encoding='utf-8')
              assert '<html' in text.lower() and 'noindex' not in text.lower(), name
          print({
              'live_commit': deployment['commit'],
              'live_restored_routes': report['restored_routes'],
              'status': 'source-publication-parity-live',
          })
          PY

      - name: Upload restoration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-publication-parity-v342
          path: |
            validated-site/api/source-publication-parity-v342.json
            validated-site/api/orphan-page-audit-v197.json
          if-no-files-found: warn
          retention-days: 14
