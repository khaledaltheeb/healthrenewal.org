name: Restore source-published pages to GitHub Pages v346

on:
  workflow_run:
    workflows: ["Deploy validated main to GitHub Pages"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - ".github/workflows/restore-source-published-pages-v342.yml"

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: source-publication-parity-v346
  cancel-in-progress: false

jobs:
  restore-and-deploy:
    if: >-
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout current restoration controller
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve the exact deployed source and artifact run
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_DEPLOY_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          test -f pages-deployment-status-v329.json
          expected_sha="$(jq -r '.source_commit' pages-deployment-status-v329.json)"
          deployment_run_id="$(jq -r '.deployment_workflow_run_id' pages-deployment-status-v329.json)"
          source_workflow_run_id="$(jq -r '.source_workflow_run_id' pages-deployment-status-v329.json)"
          [[ "${expected_sha}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${deployment_run_id}" =~ ^[0-9]+$ ]]
          [[ "${source_workflow_run_id}" =~ ^[0-9]+$ ]]
          if [[ "${EVENT_NAME}" == "workflow_run" && "${deployment_run_id}" != "${TRIGGER_DEPLOY_RUN_ID}" ]]; then
            echo "A newer verified deployment ledger already superseded workflow run ${TRIGGER_DEPLOY_RUN_ID}; skipping stale restoration." >&2
            exit 1
          fi
          git cat-file -e "${expected_sha}^{commit}"
          git merge-base --is-ancestor "${expected_sha}" HEAD
          echo "expected_sha=${expected_sha}" >> "${GITHUB_OUTPUT}"
          echo "deployment_run_id=${deployment_run_id}" >> "${GITHUB_OUTPUT}"
          echo "source_workflow_run_id=${source_workflow_run_id}" >> "${GITHUB_OUTPUT}"
          echo "Restoration controller: $(git rev-parse HEAD)"
          echo "Deployed source snapshot: ${expected_sha}"
          echo "Validated artifact run: ${source_workflow_run_id}"

      - name: Materialize the deployed source snapshot
        env:
          EXPECTED_SHA: ${{ steps.target.outputs.expected_sha }}
        run: |
          set -euxo pipefail
          rm -rf source-snapshot
          git worktree add --detach source-snapshot "${EXPECTED_SHA}"
          test -f source-snapshot/sitemap-family-guide.xml
          test -f source-snapshot/family-guide/index.html
          test -f source-snapshot/family-guide/conditions/autism/index.html

      - name: Verify the deployment-ledger artifact run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_SHA: ${{ steps.target.outputs.expected_sha }}
          SOURCE_RUN_ID: ${{ steps.target.outputs.source_workflow_run_id }}
        run: |
          set -euxo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" > /tmp/source-run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100" > /tmp/source-artifacts.json
          EXPECTED_SHA="${EXPECTED_SHA}" SOURCE_RUN_ID="${SOURCE_RUN_ID}" python - <<'PY'
          import json
          import os
          from pathlib import Path

          run = json.loads(Path('/tmp/source-run.json').read_text(encoding='utf-8'))
          artifacts = json.loads(Path('/tmp/source-artifacts.json').read_text(encoding='utf-8'))
          assert str(run['id']) == os.environ['SOURCE_RUN_ID'], run
          assert run['head_sha'] == os.environ['EXPECTED_SHA'], run
          assert run['head_branch'] == 'main', run
          assert run['status'] == 'completed' and run['conclusion'] == 'success', run
          matches = [
              item for item in artifacts.get('artifacts', [])
              if item['name'] == 'validated-production-site' and not item.get('expired', False)
          ]
          assert len(matches) == 1, matches
          assert matches[0]['workflow_run']['head_sha'] == os.environ['EXPECTED_SHA'], matches[0]
          print({
              'source_run_id': run['id'],
              'source_sha': run['head_sha'],
              'artifact_id': matches[0]['id'],
              'artifact_size': matches[0]['size_in_bytes'],
              'artifact_digest': matches[0].get('digest'),
          })
          PY

      - name: Download the exact validated production artifact
        uses: actions/download-artifact@v4
        with:
          name: validated-production-site
          path: validated-site
          run-id: ${{ steps.target.outputs.source_workflow_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore every source-sitemap public route missing from production
        run: |
          set -euxo pipefail
          python -m py_compile \
            scripts/restore_source_published_pages_v342.py \
            scripts/restore_source_published_pages_v343.py \
            tests/test_source_publication_restore_v344.py
          python -m unittest -v tests.test_source_publication_restore_v344
          python scripts/restore_source_published_pages_v343.py \
            validated-site \
            --source-root source-snapshot \
            --report validated-site/api/source-publication-parity-v342.json

      - name: Enforce restored publication discovery and artifact integrity
        env:
          EXPECTED_SHA: ${{ steps.target.outputs.expected_sha }}
        run: |
          set -euxo pipefail
          python scripts/audit_orphan_pages_v197.py validated-site --fail-on-critical --require-gateways
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path('validated-site')
          report = json.loads((root / 'api/source-publication-parity-v342.json').read_text(encoding='utf-8'))
          deployment = json.loads((root / 'deployment.json').read_text(encoding='utf-8'))
          discovery = json.loads((root / 'api/orphan-page-audit-v197.json').read_text(encoding='utf-8'))

          assert report['version'] == 342 and report['status'] == 'passed', report
          assert report['source_backed_public_routes'] >= 60, report
          assert report['restored_routes'] == report['initially_missing_routes'], report
          assert report['remaining_missing_routes'] == [], report
          assert report['broken_local_references'] == [], report
          assert report['critical_files_unchanged'] is True, report
          assert deployment['commit'] == os.environ['EXPECTED_SHA'], deployment
          assert discovery['status'] == 'passed', discovery
          for key in ('critical_orphans', 'critical_unmapped', 'missing_gateways', 'gateway_orphans', 'gateway_unmapped'):
              assert discovery[key] == [], (key, discovery[key])
          for name in ('index.html', 'sitemap.xml', 'manifest.webmanifest', 'sw.js'):
              path = root / name
              expected = deployment['artifacts'][name]
              assert hashlib.sha256(path.read_bytes()).hexdigest() == expected['sha256'], name
              assert path.stat().st_size == expected['bytes'], name
          assert (root / 'family-guide/index.html').is_file(), report
          assert (root / 'family-guide/conditions/autism/index.html').is_file(), report
          assert (root / 'family-guide/tools/family-plan/index.html').is_file(), report
          assert (root / 'sitemap-family-guide.xml').is_file(), report
          print({
              'commit': deployment['commit'],
              'source_backed_public_routes': report['source_backed_public_routes'],
              'restored_routes': report['restored_routes'],
              'restored_html_routes': report['restored_html_routes'],
              'restored_surfaces': report['restored_top_level_surfaces'],
              'discovery': discovery['status'],
              'critical_files_unchanged': report['critical_files_unchanged'],
          })
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload restored Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: validated-site

      - name: Deploy restored public routes
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify the restored routes live
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ steps.target.outputs.expected_sha }}
        run: |
          set -euxo pipefail
          base="${PAGE_URL%/}/"
          token="${EXPECTED_SHA}-${GITHUB_RUN_ID}"
          for route in \
            deployment.json \
            family-guide/ \
            family-guide/conditions/autism/ \
            family-guide/conditions/gnb5-related-neurodevelopmental-disorder/ \
            family-guide/tools/family-plan/ \
            sitemap-family-guide.xml \
            api/source-publication-parity-v342.json; do
            curl --retry 8 --retry-delay 5 -H 'Cache-Control: no-cache' -fsSL \
              "${base}${route}?v=${token}" -o "/tmp/$(echo "${route}" | tr '/.' '__')"
          done
          EXPECTED_SHA="${EXPECTED_SHA}" python - <<'PY'
          import json
          import os
          from pathlib import Path

          deployment = json.loads(Path('/tmp/deployment_json').read_text(encoding='utf-8'))
          report = json.loads(Path('/tmp/api_source-publication-parity-v342_json').read_text(encoding='utf-8'))
          assert deployment['commit'] == os.environ['EXPECTED_SHA'], deployment
          assert report['version'] == 342 and report['status'] == 'passed', report
          assert report['source_backed_public_routes'] >= 60, report
          assert report['remaining_missing_routes'] == [], report
          for name in (
              '/tmp/family-guide_',
              '/tmp/family-guide_conditions_autism_',
              '/tmp/family-guide_conditions_gnb5-related-neurodevelopmental-disorder_',
              '/tmp/family-guide_tools_family-plan_',
          ):
              text = Path(name).read_text(encoding='utf-8')
              assert '<html' in text.lower() and 'noindex' not in text.lower(), name
          print({
              'live_commit': deployment['commit'],
              'live_restored_routes': report['restored_routes'],
              'live_source_backed_public_routes': report['source_backed_public_routes'],
              'status': 'source-publication-parity-live',
          })
          PY

      - name: Upload restoration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-publication-parity-v349
          path: |
            validated-site/api/source-publication-parity-v342.json
            validated-site/api/orphan-page-audit-v197.json
            /tmp/source-run.json
            /tmp/source-artifacts.json
          if-no-files-found: warn
          retention-days: 14
