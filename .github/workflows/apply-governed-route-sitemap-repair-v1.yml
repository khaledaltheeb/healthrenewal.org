name: Apply verified governed route and sitemap outputs

on:
  push:
    branches:
      - fix/institutional-route-hubs-v1
    paths:
      - .github/workflows/apply-governed-route-sitemap-repair-v1.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-governed-route-sitemap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/institutional-route-hubs-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate governed guides and discovery outputs
        run: python scripts/repair_sitemap_discovery_contract_v1.py
      - name: Verify permanent contracts before commit
        run: |
          python -m unittest tests.test_materialize_sectors_v10_compat_v4 -v
          python -m unittest tests.test_institutional_route_hubs_v1 -v
          python scripts/materialize_sectors_v10_compat_v4.py . --check
          python scripts/validate_sitemap_discovery_contract.py
          git diff --check
      - name: Commit only governed publication and discovery outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            scripts/publish_complete_sitemap_v360.py \
            evidence-guides \
            api/sectors-v10-publication-v1.json \
            robots.txt \
            sitemap.xml \
            sitemap-index.xml \
            api/sitemap-completeness-v360.json
          if git diff --cached --quiet; then
            echo 'Verified outputs are already committed.'
            exit 0
          fi
          git commit -m 'fix(content): publish canonical family routes and sitemap discovery [governed-route-repair]'
          git push origin HEAD:fix/institutional-route-hubs-v1