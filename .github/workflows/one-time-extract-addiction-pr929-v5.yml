name: One-time extract addiction PR 929 v5

on:
  pull_request:
    types: [synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: one-time-extract-addiction-pr929-v5
  cancel-in-progress: false

jobs:
  extract-visible-files:
    if: >-
      github.event.pull_request.number == 929 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/addiction-condition-guides-v2-20260803'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Extract current reviewed payload and commit visible files
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euxo pipefail
          if [ -f addiction/cannabis-use-disorder/index.html ] && [ -f api/addiction-condition-guides-v2.json ]; then
            echo "Visible condition guides already exist; no extraction needed."
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/materialize_addiction_condition_guides_v2.py')
          text = path.read_text(encoding='utf-8')
          old = '717927d839784e453091d3086d17ae3689251f93545c1b1222e119473c1f0d63'
          new = 'e24de57695370943a33b6e4bf80cdfa5fb5763e3fb7219b06899a3ae6fd14758'
          if old not in text:
              raise SystemExit('Expected historical payload checksum not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python scripts/materialize_addiction_condition_guides_v2.py .
          test -f addiction/cannabis-use-disorder/index.html
          test -f addiction/nicotine-tobacco-dependence/index.html
          test -f addiction/sedative-benzodiazepine-use-disorder/index.html
          test -f addiction/gambling-related-harms/index.html
          test -f addiction/gaming-disorder/index.html
          test -f addiction/inhalant-use-disorder/index.html
          test -f addiction/polysubstance-use-and-overdose-risk/index.html
          test -f addiction/editorial-manifest.json
          test -f api/addiction-condition-guides-v2.json
          rm -f diagnostics/addiction-pr929-materializer-v3.log
          rmdir diagnostics 2>/dev/null || true
          git config user.name "healthrenewal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add addiction api assets/addiction sitemap.xml sitemap-addiction.xml sitemap-index.xml diagnostics 2>/dev/null || true
          git status --short
          git commit -m "content(addiction): materialize all ten visible condition guides"
          git push origin HEAD:"${HEAD_BRANCH}"
