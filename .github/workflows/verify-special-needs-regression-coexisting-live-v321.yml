name: Verify special-needs regression and coexisting guides live v321

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/verify-special-needs-regression-coexisting-live-v321.yml"
  workflow_run:
    workflows: ["Deploy validated main to GitHub Pages"]
    types: [completed]
  schedule:
    - cron: "27 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: special-needs-regression-coexisting-live-v321-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  static-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate v321 live workflow contract
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/verify-special-needs-regression-coexisting-live-v321.yml')
          text = path.read_text(encoding='utf-8')
          required = (
              'Deploy validated main to GitHub Pages',
              'MINIMUM_SHA: 282f07d589f52f2c03c4360d46c231f1a40c5877',
              'special-needs/autism-coexisting-conditions-sudden-change/',
              'special-needs/down-syndrome-regression-dementia-urgent-changes/',
              'special-needs-regression-coexisting-v320.json',
              'regression_coexisting_guides_contract',
              'data-regression-guide="autism-coexisting-conditions-sudden-change"',
              'data-regression-guide="down-syndrome-regression-dementia-urgent-changes"',
              'التغير الجديد ليس سمة ثابتة من سمات التوحد',
              'DSRD إطار سريري ناشئ مبني جزئيًا على إجماع خبراء',
              'لا يساوي تلقائيًا تشخيص الخرف السريري',
              'sitemap-special-needs.xml',
          )
          missing = [marker for marker in required if marker not in text]
          assert not missing, missing
          print({'workflow': path.name, 'required_markers': len(required), 'status': 'static-contract-passed'})
          PY

  live-publication:
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: https://healthrenewal.org/
      MINIMUM_SHA: 282f07d589f52f2c03c4360d46c231f1a40c5877
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Wait for a non-rollback deployment containing v320
        run: |
          set -euo pipefail
          matched=0
          for i in $(seq 1 90); do
            token="${MINIMUM_SHA}-${i}-$(date +%s)"
            if curl --retry 2 --retry-delay 2 -H 'Cache-Control: no-cache' -fsSL "${BASE_URL}deployment.json?v=${token}" -o /tmp/deployment.json; then
              if python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path

          deployment = json.loads(Path('/tmp/deployment.json').read_text(encoding='utf-8'))
          live = deployment.get('commit')
          minimum = os.environ['MINIMUM_SHA']
          assert isinstance(live, str) and len(live) == 40, deployment
          if live == minimum:
              raise SystemExit(0)
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/compare/{minimum}...{live}",
              headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'special-needs-regression-coexisting-live-v321',
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  status = json.loads(response.read().decode('utf-8')).get('status')
          except urllib.error.HTTPError:
              raise SystemExit(1)
          raise SystemExit(0 if status in {'ahead', 'identical'} else 1)
          PY
              then
                matched=1
                break
              fi
            fi
            sleep 10
          done
          test "${matched}" -eq 1

      - name: Download live regression pages parent pages reports and sitemap
        run: |
          set -euxo pipefail
          token="${MINIMUM_SHA}-live-$(date +%s)"
          curl --retry 6 --retry-delay 4 -H 'Cache-Control: no-cache' -fsSL "${BASE_URL}special-needs/autism-coexisting-conditions-sudden-change/?v=${token}" -o /tmp/autism-change.html
          curl --retry 6 --retry-delay 4 -H 'Cache-Control: no-cache' -fsSL "${BASE_URL}special-needs/down-syndrome-regression-dementia-urgent-changes/?v=${token}" -o /tmp/down-regression.html
          curl --retry 6 --retry-delay 4 -H 'Cache-Control: no-cache' -fsSL "${BASE_URL}special-needs/autism/?v=${token}" -o /tmp/autism-parent.html
          curl --retry 6 --retry-delay 4 -H 'Cache-Control: no-cache' -fsSL "${BASE_URL}special-needs/down-syndrome/?v=${token}" -o /tmp/down-parent.html
          curl --retry 6 --retry-delay 4 -H 'Cache-Control: no-cache' -fsSL "${BASE_URL}api/special-needs-regression-coexisting-v320.json?v=${token}" -o /tmp/regression.json
          curl --retry 6 --retry-delay 4 -H 'Cache-Control: no-cache' -fsSL "${BASE_URL}api/special-needs-guides-v221.json?v=${token}" -o /tmp/central.json
          curl --retry 6 --retry-delay 4 -H 'Cache-Control: no-cache' -fsSL "${BASE_URL}sitemap-special-needs.xml?v=${token}" -o /tmp/sitemap.xml

      - name: Enforce live regression evidence limits safety and discovery contracts
        run: |
          set -euxo pipefail
          python - <<'PY'
          import json
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          base = 'https://healthrenewal.org/'
          report = json.loads(Path('/tmp/regression.json').read_text(encoding='utf-8'))
          central = json.loads(Path('/tmp/central.json').read_text(encoding='utf-8'))
          pages = {
              'autism-coexisting-conditions-sudden-change': Path('/tmp/autism-change.html').read_text(encoding='utf-8'),
              'down-syndrome-regression-dementia-urgent-changes': Path('/tmp/down-regression.html').read_text(encoding='utf-8'),
          }
          parents = {
              'autism-coexisting-conditions-sudden-change': Path('/tmp/autism-parent.html').read_text(encoding='utf-8'),
              'down-syndrome-regression-dementia-urgent-changes': Path('/tmp/down-parent.html').read_text(encoding='utf-8'),
          }

          assert report['version'] == 320 and report['status'] == 'passed', report
          assert report['review_status'] == 'internally-reviewed-external-clinical-review-required'
          assert report['external_clinical_review_completed'] is False
          assert report['guide_count'] == 2
          assert report['section_count'] == 10
          assert report['source_count'] == 11
          assert report['action_step_count'] == 10
          assert report['urgent_item_count'] == 6
          assert report['parent_links_added'] == 2
          assert report['sitemap_registered'] is True
          assert report['dsrd_consensus_limit_visible'] is True
          assert report['dementia_baseline_limit_visible'] is True
          assert report['diagnostic_overshadowing_guard'] is True
          assert report['next_review_due'] == '2027-01-27'

          assert central['status'] == 'passed'
          assert central['regression_coexisting_guides_contract'] == 320
          embedded = central['condition_hubs']['regression_coexisting']
          for key in (
              'guide_count', 'guide_slugs', 'section_count', 'source_count',
              'action_step_count', 'urgent_item_count', 'parent_links_added',
              'dsrd_consensus_limit_visible', 'dementia_baseline_limit_visible',
              'diagnostic_overshadowing_guard', 'next_review_due'
          ):
              assert embedded[key] == report[key], (key, embedded.get(key), report.get(key))
          assert embedded['external_clinical_review_completed'] is False

          expected_sources = {
              'autism-coexisting-conditions-sudden-change': tuple(f'source-AC{i}' for i in range(1, 6)),
              'down-syndrome-regression-dementia-urgent-changes': tuple(f'source-DR{i}' for i in range(1, 7)),
          }
          for slug, text in pages.items():
              assert text.count('<h1') == 1, slug
              assert text.count('class="section-card"') == 5, slug
              assert 'MedicalWebPage' in text and 'BreadcrumbList' in text, slug
              assert 'لم تكتمل مراجعة سريرية خارجية مستقلة' in text, slug
              assert '2027-01-27' in text, slug
              ids = re.findall(r'\bid="([^"]+)"', text)
              assert len(ids) == len(set(ids)), (slug, ids)
              for source_id in expected_sources[slug]:
                  assert f'id="{source_id}"' in text, (slug, source_id)
              parent = parents[slug]
              assert parent.count(f'data-regression-guide="{slug}"') == 1, slug
              assert parent.count(f'/special-needs/{slug}/') == 1, slug

          autism = pages['autism-coexisting-conditions-sudden-change']
          assert 'التغير الجديد ليس سمة ثابتة من سمات التوحد' in autism
          assert 'لا يجوز تفسير الألم أو الاكتئاب أو الصرع أو الإساءة' in autism
          assert 'منع حجب التشخيص' in autism
          down = pages['down-syndrome-regression-dementia-urgent-changes']
          assert 'DSRD إطار سريري ناشئ مبني جزئيًا على إجماع خبراء' in down
          assert 'لا يملك اختبارًا حاسمًا واحدًا' in down
          assert 'لا يساوي تلقائيًا تشخيص الخرف السريري' in down
          assert 'لا تطلب قائمة ثابتة من الفحوص للجميع' in down
          assert 'بدء تحرٍ سنوي منظم عن ألزهايمر من عمر 40 عامًا' in down

          sitemap_urls = [
              (node.text or '').strip()
              for node in ET.parse('/tmp/sitemap.xml').getroot().findall('{*}url/{*}loc')
              if node.text
          ]
          for slug in pages:
              assert sitemap_urls.count(base + f'special-needs/{slug}/') == 1, slug
          assert len(sitemap_urls) == len(set(sitemap_urls))

          deployment = json.loads(Path('/tmp/deployment.json').read_text(encoding='utf-8'))
          print({
              'live_commit': deployment.get('commit'),
              'regression_guides': report['guide_count'],
              'sections': report['section_count'],
              'sources': report['source_count'],
              'parent_links': report['parent_links_added'],
              'status': 'special-needs-regression-coexisting-live-v321-verified',
          })
          PY
