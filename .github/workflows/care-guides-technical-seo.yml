name: Care Guides Technical SEO Agent

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/care-guides-technical-seo.yml'
      - '.github/scripts/care_guides_seo_round.py'

permissions:
  contents: write

concurrency:
  group: care-guides-technical-seo-agent
  cancel-in-progress: false

jobs:
  seo:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Synchronize latest main
        run: git pull --ff-only origin main

      - name: Run verified care-guides round
        run: python3 .github/scripts/care_guides_seo_round.py

      - name: Verify hard gates
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          r=json.load(open('.github/reports/seo-care-guides-latest.json',encoding='utf-8'))
          print(json.dumps({
            'success':r['success'],
            'skip_reason_counts':r.get('skip_reason_counts',{}),
            'failure_reason_counts':r.get('failure_reason_counts',{}),
            'demand_diagnostics':r.get('demand_diagnostics',{}),
            'sitemap_added_urls':r.get('sitemap_added_urls',0),
            'source_failures':r.get('source_failures',{})
          },ensure_ascii=False))
          assert r['success'] >= 50, r.get('blocker') or r
          v=r['verification']
          assert v['visible_body_unchanged'] is True
          assert v['json_ld_validated'] is True
          assert v['semantic_queries_per_success'] >= 500
          assert v['autocomplete_only_counting'] is True
          assert v['generated_seeds_count_toward_500'] is False
          assert v['topical_filter_applied'] is True
          assert v['sitemap_required_for_success'] is True
          assert v['noindex_pages_modified'] is False
          assert v['title_description_unique_for_successes'] is True
          print('verified success=', r['success'])
          PY

      - name: Commit owned scope only
        shell: bash
        run: |
          git config user.name 'rawafid-care-guides-seo-bot'
          git config user.email '63592172+khaledaltheeb@users.noreply.github.com'
          git add care-guides sitemap.xml .github/seo/care-guides-seo-state.json .github/seo/care-guides-semantic-manifest.json .github/reports/seo-care-guides-latest.json
          git diff --cached --quiet && { echo 'No verified changes'; exit 1; }
          git commit -m 'SEO: optimize 50 verified care-guide pages'

      - name: Rebase safely and publish
        shell: bash
        run: |
          set -e
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo 'Cross-agent conflict detected; failing closed.' >&2
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          echo 'Main moved repeatedly; no unsafe force push attempted.' >&2
          exit 1
