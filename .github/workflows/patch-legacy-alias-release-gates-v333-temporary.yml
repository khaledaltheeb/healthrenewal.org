name: Apply legacy alias release gate patch v333 temporary

on:
  push:
    branches: ["agent/legacy-alias-release-gates-v333"]
    paths:
      - ".github/workflows/patch-legacy-alias-release-gates-v333-temporary.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/legacy-alias-release-gates-v333
          fetch-depth: 0
      - name: Patch source-of-truth audits and release gates
        run: |
          python - <<'PY'
          from pathlib import Path

          audit = Path('scripts/audit_full_site_v16.py')
          text = audit.read_text(encoding='utf-8')

          helper_anchor = '\ndef content_minimum(rel: str) -> int:\n'
          helper = r'''
def legacy_alias_contract(page: Path, parser: AuditParser) -> tuple[bool, str | None, list[str]]:
    """Validate explicit noindex redirect aliases without treating them as indexable content."""
    marker = str(parser.html_attrs.get("data-legacy-path-alias") or "").strip()
    if not marker:
        return False, None, []

    rel = page.relative_to(SITE).as_posix()
    errors: list[str] = []
    robots = meta_value(parser, "robots")
    directives = {
        item.strip().lower()
        for value in robots
        for item in value.split(",")
        if item.strip()
    }
    if len(robots) != 1 or not {"noindex", "follow"}.issubset(directives):
        errors.append(f"Legacy alias robots contract failed in {rel}: {robots}")

    refresh = [
        item for item in parser.meta
        if str(item.get("http-equiv", "")).lower() == "refresh"
    ]
    destination = ""
    if len(refresh) != 1:
        errors.append(f"Legacy alias requires one meta refresh in {rel}, found {len(refresh)}")
    else:
        content = str(refresh[0].get("content", ""))
        match = re.match(r"^\s*0\s*;\s*url\s*=\s*(.+?)\s*$", content, re.I)
        if not match:
            errors.append(f"Legacy alias refresh must be immediate in {rel}: {content}")
        else:
            destination = match.group(1).strip('"\' ')

    canonicals = link_values(parser, "canonical")
    if len(canonicals) != 1:
        errors.append(f"Legacy alias requires one canonical in {rel}, found {len(canonicals)}")

    refresh_target = local_target(page, destination) if destination else None
    canonical_target = local_target(page, canonicals[0]) if len(canonicals) == 1 else None
    if refresh_target is None:
        errors.append(f"Legacy alias refresh target is not an internal page in {rel}: {destination}")
    if canonical_target is None:
        errors.append(f"Legacy alias canonical target is not an internal page in {rel}: {canonicals}")
    if refresh_target is not None and canonical_target is not None and refresh_target != canonical_target:
        errors.append(
            f"Legacy alias refresh/canonical mismatch in {rel}: {destination} != {canonicals[0]}"
        )
    target = refresh_target or canonical_target
    if target is not None:
        try:
            target_rel = target.relative_to(SITE).as_posix()
        except ValueError:
            errors.append(f"Legacy alias target escapes site root in {rel}: {target}")
            target_rel = None
        else:
            if target == page.resolve():
                errors.append(f"Legacy alias redirects to itself in {rel}")
            if not target.is_file():
                errors.append(f"Legacy alias target is missing in {rel}: {target_rel}")
    else:
        target_rel = None
    return True, target_rel, errors

'''
          if 'def legacy_alias_contract(' not in text:
              if text.count(helper_anchor) != 1:
                  raise SystemExit('audit helper anchor missing or ambiguous')
              text = text.replace(helper_anchor, '\n' + helper + 'def content_minimum(rel: str) -> int:\n', 1)

          variable_anchor = '    section_counts: Counter[str] = Counter()\n'
          variable_addition = variable_anchor + '    legacy_aliases: dict[str, str] = {}\n'
          if 'legacy_aliases: dict[str, str]' not in text:
              if text.count(variable_anchor) != 1:
                  raise SystemExit('audit variable anchor missing or ambiguous')
              text = text.replace(variable_anchor, variable_addition, 1)

          registration_old = '''        titles[title].append(rel)
        if descs:
            descriptions[descs[0]].append(rel)
        if canonical:
            canonicals[canonical[0]].append(rel)
'''
          registration_new = '''        is_legacy_alias, alias_target, alias_errors = legacy_alias_contract(page, parser)
        errors.extend(alias_errors)
        if is_legacy_alias:
            legacy_aliases[rel] = alias_target or ""
        else:
            titles[title].append(rel)
            if descs:
                descriptions[descs[0]].append(rel)
            if canonical:
                canonicals[canonical[0]].append(rel)
'''
          if registration_old in text:
              text = text.replace(registration_old, registration_new, 1)
          elif registration_new not in text:
              raise SystemExit('audit registration anchor missing')

          metadata_old = '''        if len(descs) != 1 or not (50 <= len(descs[0]) <= 320):
            errors.append(f"Invalid meta description in {rel}: {len(descs[0]) if descs else 0}")
        if len(canonical) != 1:
            errors.append(f"Expected one canonical in {rel}, found {len(canonical)}")
        elif canonical[0] != BASE_URL + ("" if rel == "index.html" else rel.removesuffix("index.html")):
            errors.append(f"Canonical mismatch in {rel}: {canonical[0]}")
'''
          metadata_new = '''        if not is_legacy_alias:
            if len(descs) != 1 or not (50 <= len(descs[0]) <= 320):
                errors.append(f"Invalid meta description in {rel}: {len(descs[0]) if descs else 0}")
            if len(canonical) != 1:
                errors.append(f"Expected one canonical in {rel}, found {len(canonical)}")
            elif canonical[0] != BASE_URL + ("" if rel == "index.html" else rel.removesuffix("index.html")):
                errors.append(f"Canonical mismatch in {rel}: {canonical[0]}")
'''
          if metadata_old in text:
              text = text.replace(metadata_old, metadata_new, 1)
          elif metadata_new not in text:
              raise SystemExit('audit metadata anchor missing')

          duplicate_id_anchor = '''        if duplicate_ids:
            errors.append(f"Duplicate IDs in {rel}: {duplicate_ids[:6]}")
'''
          duplicate_id_new = duplicate_id_anchor + '''        if is_legacy_alias:
            continue
'''
          if '        if is_legacy_alias:\n            continue\n' not in text:
              if text.count(duplicate_id_anchor) != 1:
                  raise SystemExit('audit alias continue anchor missing or ambiguous')
              text = text.replace(duplicate_id_anchor, duplicate_id_new, 1)

          sitemap_anchor = '''    duplicate_urls = [url for url, count in Counter(sitemap_urls).items() if count > 1]
'''
          sitemap_checks = '''    for alias_rel, target_rel in legacy_aliases.items():
        alias_url = BASE_URL + alias_rel.removesuffix("index.html")
        if alias_url in sitemap_urls:
            errors.append(f"Noindex legacy alias must not be in sitemaps: {alias_url}")
        if target_rel:
            target_url = BASE_URL + target_rel.removesuffix("index.html")
            if target_url not in sitemap_urls:
                errors.append(f"Legacy alias canonical target is missing from sitemaps: {target_url}")

'''
          if 'Noindex legacy alias must not be in sitemaps' not in text:
              if text.count(sitemap_anchor) != 1:
                  raise SystemExit('audit sitemap anchor missing or ambiguous')
              text = text.replace(sitemap_anchor, sitemap_checks + sitemap_anchor, 1)

          report_anchor = '        "content_pages": len(content_files),\n'
          report_new = report_anchor + '        "legacy_alias_count": len(legacy_aliases),\n        "legacy_aliases": legacy_aliases,\n        "legacy_alias_contract": "noindex-follow-immediate-internal-redirect-v333",\n'
          if '"legacy_alias_contract"' not in text:
              if text.count(report_anchor) != 1:
                  raise SystemExit('audit report anchor missing or ambiguous')
              text = text.replace(report_anchor, report_new, 1)

          audit.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/validate-all-labs-v22.yml')
          text = workflow.read_text(encoding='utf-8')
          old = '''          test "$(find _site/daily-tools -name index.html | wc -l)" -eq 9
          test "$(find _site/learning-paths -name index.html | wc -l)" -eq 5
          test "$(grep -o '<url>' _site/sitemap-tools-paths.xml | wc -l)" -eq 14
          test "$(grep -o 'sitemap-tools-paths.xml' _site/sitemap.xml | wc -l)" -eq 1
          test -f _site/api/daily-tools-v24.json
'''
          new = '''          test -f _site/api/daily-tools-v24.json
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('_site')
          report = json.loads((root / 'api/daily-tools-v24.json').read_text(encoding='utf-8'))
          assert report['version'] == 100, report
          assert report['catalog_contract'] == 100, report
          assert report['tools'] == 100, report
          assert report['paths'] == 10, report
          assert report['pages'] == 112, report
          daily_pages = list((root / 'daily-tools').rglob('index.html'))
          learning_pages = list((root / 'learning-paths').rglob('index.html'))
          assert len(daily_pages) == 101, len(daily_pages)
          assert len(learning_pages) == 15, len(learning_pages)
          aliases = []
          for page in learning_pages:
              text = page.read_text(encoding='utf-8')
              if 'data-legacy-path-alias=' in text:
                  aliases.append(page)
                  assert 'noindex,follow' in text, page
                  assert 'http-equiv="refresh"' in text, page
          assert len(aliases) == 4, aliases
          sitemap = (root / 'sitemap-tools-paths.xml').read_text(encoding='utf-8')
          assert sitemap.count('<url>') == 112, sitemap.count('<url>')
          main_sitemap = (root / 'sitemap.xml').read_text(encoding='utf-8')
          assert main_sitemap.count('sitemap-tools-paths.xml') == 1
          print({'daily_pages': len(daily_pages), 'learning_pages': len(learning_pages), 'aliases': len(aliases), 'sitemap_urls': 112})
          PY
'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('daily-tools workflow count anchor missing')
          workflow.write_text(text, encoding='utf-8')

          test = Path('tests/test_legacy_learning_path_alias_v333.py')
          test.write_text(r'''from __future__ import annotations

import importlib.util
import tempfile
import unittest
from pathlib import Path

ROOT = Path(__file__).resolve().parents[1]
AUDITOR = ROOT / "scripts" / "audit_full_site_v16.py"


def load_module():
    spec = importlib.util.spec_from_file_location("audit_full_site_alias_v333", AUDITOR)
    module = importlib.util.module_from_spec(spec)
    assert spec.loader is not None
    spec.loader.exec_module(module)
    return module


class LegacyLearningPathAliasV333Tests(unittest.TestCase):
    def setUp(self) -> None:
        self.module = load_module()
        self.temp = tempfile.TemporaryDirectory(prefix="legacy-alias-v333-")
        self.addCleanup(self.temp.cleanup)
        self.site = Path(self.temp.name).resolve()
        self.module.SITE = self.site
        self.target = self.site / "learning-paths/new-path/index.html"
        self.target.parent.mkdir(parents=True)
        self.target.write_text("<html></html>", encoding="utf-8")
        self.alias = self.site / "learning-paths/old-path/index.html"
        self.alias.parent.mkdir(parents=True)

    def write_alias(self, *, robots: str = "noindex,follow", refresh: str = "/pterminology-site/learning-paths/new-path/", canonical: str = "https://khaledaltheeb.github.io/pterminology-site/learning-paths/new-path/") -> None:
        self.alias.write_text(
            f'''<!doctype html><html lang="ar" dir="rtl" data-legacy-path-alias="v100"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>تم تحديث مسار التعلم</title><meta name="robots" content="{robots}">
<meta http-equiv="refresh" content="0;url={refresh}"><link rel="canonical" href="{canonical}">
</head><body><main><h1>تم تحديث هذا المسار</h1><a href="{refresh}">فتح المسار</a></main></body></html>''',
            encoding="utf-8",
        )

    def test_valid_alias_is_explicit_noindex_internal_redirect(self) -> None:
        self.write_alias()
        parser = self.module.parse_page(self.alias)
        is_alias, target, errors = self.module.legacy_alias_contract(self.alias, parser)
        self.assertTrue(is_alias)
        self.assertEqual(target, "learning-paths/new-path/index.html")
        self.assertEqual(errors, [])

    def test_alias_rejects_indexing_and_target_mismatch(self) -> None:
        self.write_alias(
            robots="index,follow",
            canonical="https://khaledaltheeb.github.io/pterminology-site/learning-paths/other-path/",
        )
        parser = self.module.parse_page(self.alias)
        is_alias, _, errors = self.module.legacy_alias_contract(self.alias, parser)
        self.assertTrue(is_alias)
        self.assertTrue(any("robots contract" in item for item in errors))
        self.assertTrue(any("refresh/canonical mismatch" in item for item in errors))

    def test_normal_page_is_not_treated_as_alias(self) -> None:
        page = self.site / "learning-paths/new-path/index.html"
        parser = self.module.parse_page(page)
        is_alias, target, errors = self.module.legacy_alias_contract(page, parser)
        self.assertFalse(is_alias)
        self.assertIsNone(target)
        self.assertEqual(errors, [])

    def test_release_gate_uses_v100_report_not_historical_counts(self) -> None:
        workflow = (ROOT / ".github/workflows/validate-all-labs-v22.yml").read_text(encoding="utf-8")
        self.assertIn("report['tools'] == 100", workflow)
        self.assertIn("report['paths'] == 10", workflow)
        self.assertIn("report['pages'] == 112", workflow)
        self.assertNotIn('daily-tools -name index.html | wc -l)" -eq 9', workflow)
        self.assertNotIn('learning-paths -name index.html | wc -l)" -eq 5', workflow)


if __name__ == "__main__":
    unittest.main()
''', encoding='utf-8')

          gate = Path('.github/workflows/validate-legacy-alias-release-gates-v333.yml')
          gate.write_text('''name: Validate legacy alias release gates v333

on:
  pull_request:
    branches: ["main"]
    paths:
      - "scripts/audit_full_site_v16.py"
      - ".github/workflows/validate-all-labs-v22.yml"
      - "tests/test_legacy_learning_path_alias_v333.py"
      - ".github/workflows/validate-legacy-alias-release-gates-v333.yml"
  push:
    branches: ["main"]
    paths:
      - "scripts/audit_full_site_v16.py"
      - ".github/workflows/validate-all-labs-v22.yml"
      - "tests/test_legacy_learning_path_alias_v333.py"
      - ".github/workflows/validate-legacy-alias-release-gates-v333.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aliases-and-counts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile contracts
        run: python -m py_compile scripts/audit_full_site_v16.py tests/test_legacy_learning_path_alias_v333.py
      - name: Test redirect aliases and current catalog counts
        run: python -m unittest -v tests.test_legacy_learning_path_alias_v333
''', encoding='utf-8')
          PY
          python -m py_compile scripts/audit_full_site_v16.py tests/test_legacy_learning_path_alias_v333.py
          python -m unittest -v tests.test_legacy_learning_path_alias_v333
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/audit_full_site_v16.py .github/workflows/validate-all-labs-v22.yml tests/test_legacy_learning_path_alias_v333.py .github/workflows/validate-legacy-alias-release-gates-v333.yml
          git rm .github/workflows/patch-legacy-alias-release-gates-v333-temporary.yml
