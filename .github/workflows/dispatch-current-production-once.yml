name: Dispatch current production deployment once
run-name: Dispatch complete production for ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dispatch-current-production-once.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: dispatch-current-production-once
  cancel-in-progress: true

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm this run is bound to current main
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          current_sha="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/git/ref/heads/main" \
            | python -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')"
          test "${current_sha}" = "${EVENT_SHA}"
          echo "Current main verified at ${current_sha}."

      - name: Dispatch the authoritative complete-site workflow on current main
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          payload="$(printf '{\"ref\":\"main\",\"inputs\":{}}')"
          status="$(curl -sS -o /tmp/dispatch-response.txt -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/workflows/deploy-complete-pages-with-ai-search.yml/dispatches" \
            --data "${payload}")"
          if [ "${status}" != "204" ]; then
            cat /tmp/dispatch-response.txt
            echo "Workflow dispatch failed with HTTP ${status}" >&2
            exit 1
          fi
          echo "Dispatched complete-site deployment for main at ${CURRENT_SHA}."
