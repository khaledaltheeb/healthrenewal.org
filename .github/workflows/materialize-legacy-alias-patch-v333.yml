name: Materialize verified legacy alias patch v333

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/materialize-legacy-alias-patch-v333.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Commit patched auditor and workflow blob as data
        run: |
          set -euxo pipefail
          python scripts/apply_legacy_alias_release_gates_v333.py
          python -m py_compile scripts/audit_full_site_v16.py tests/test_legacy_learning_path_alias_v333.py
          python -m unittest -v tests.test_legacy_learning_path_alias_v333
          mkdir -p reports
          cp .github/workflows/validate-all-labs-v22.yml reports/validate-all-labs-v22-v333.yml
          git checkout HEAD -- .github/workflows/validate-all-labs-v22.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/audit_full_site_v16.py reports/validate-all-labs-v22-v333.yml
          git commit -m "build: materialize verified alias audit and release gate v333"
          git push origin HEAD:agent/legacy-alias-release-gates-v333
