name: Normalize platform shell

on:
  push:
    branches:
      - main
      - agent/platform-architecture-v1
    paths:
      - "**/*.html"
      - "assets/platform/**"
      - "scripts/normalize_platform_shell.py"
      - ".github/workflows/platform-normalize.yml"
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - "**/*.html"
      - "assets/platform/**"
      - "scripts/normalize_platform_shell.py"
      - ".github/workflows/platform-normalize.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: platform-normalize-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  normalize:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out writable branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}

      - name: Validate migration source
        run: |
          python -m py_compile scripts/normalize_platform_shell.py
          node --check assets/platform/platform-core.js

      - name: Normalize all production HTML pages
        run: python scripts/normalize_platform_shell.py

      - name: Validate generated changes
        run: |
          git diff --check
          python scripts/normalize_platform_shell.py --check --no-report

      - name: Commit normalized pages
        run: |
          if git diff --quiet; then
            echo "All pages already use the current platform shell."
            exit 0
          fi
          git config user.name "pterminology-platform-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- '*.html' reports/platform-normalization.json
          git commit -m "style: normalize platform shell across HTML pages"
          git push origin HEAD:${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
