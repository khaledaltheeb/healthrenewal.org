name: Normalize platform shell

on:
  push:
    branches:
      - main
    paths:
      - "**/*.html"
      - "assets/platform/**"
      - "scripts/normalize_platform_shell.py"
      - ".github/workflows/platform-normalize.yml"
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - "**/*.html"
      - "assets/platform/**"
      - "scripts/normalize_platform_shell.py"
      - ".github/workflows/platform-normalize.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-normalize-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the exact revision under review
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate migration source
        run: |
          python -m py_compile scripts/normalize_platform_shell.py
          node --check assets/platform/platform-core.js

      - name: Validate repository HTML without mutation
        run: |
          set -euo pipefail
          python scripts/normalize_platform_shell.py --check --no-report
          git diff --check
          git diff --exit-code

      - name: Confirm read-only workflow contract
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/platform-normalize.yml').read_text(encoding='utf-8')
          required = (
              'permissions:\n  contents: read',
              'persist-credentials: false',
              'normalize_platform_shell.py --check --no-report',
              'git diff --exit-code',
          )
          forbidden = (
              'contents: write',
              'git commit',
              'git push',
              'TARGET_BRANCH=',
              'ref: ${{',
          )
          for fragment in required:
              assert fragment in workflow, fragment
          for fragment in forbidden:
              assert fragment not in workflow, fragment
          print({'passed': True, 'contract': 'read-only-platform-normalization-v1'})
          PY
