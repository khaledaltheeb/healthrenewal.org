name: Deploy validated production to GitHub Pages v327

on:
  workflow_run:
    workflows: ["Validate every assessment and cognitive tool v31"]
    types: [completed]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download exact validated production artifact
        uses: actions/download-artifact@v4
        with:
          name: validated-production-site
          path: _site
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify deployment provenance and academic library contract
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
          EXPECTED_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euxo pipefail
          test -f _site/index.html
          test -f _site/deployment.json
          test -f _site/library/index.html
          test -f _site/api/academic-library-v326.json
          test -f _site/sitemap-library-academic-v326.xml
          python - <<'PY'
          import json
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          site = Path("_site")
          deployment = json.loads((site / "deployment.json").read_text(encoding="utf-8"))
          academic = json.loads((site / "api" / "academic-library-v326.json").read_text(encoding="utf-8"))

          assert deployment["commit"] == os.environ["EXPECTED_SHA"], deployment
          assert str(deployment["workflow_run"]) == os.environ["EXPECTED_RUN_ID"], deployment
          assert academic["version"] == 326, academic
          assert academic["status"] == "passed", academic
          assert academic["sections"] == {"branches": 25, "therapies": 27, "research": 28}, academic
          assert academic["total_entries"] == 80, academic
          assert academic["generated_pages"] == 84, academic
          assert academic["minimum_page_words"] >= 180, academic

          root = ET.parse(site / "sitemap-library-academic-v326.xml").getroot()
          urls = [
              (node.text or "").strip()
              for node in root.findall("{*}url/{*}loc")
              if node.text
          ]
          assert len(urls) == 80 and len(urls) == len(set(urls)), len(urls)
          print({
              "deployment_sha": deployment["commit"],
              "validated_run": deployment["workflow_run"],
              "academic_entries": academic["total_entries"],
              "academic_pages": academic["generated_pages"],
              "academic_sitemap_urls": len(urls),
          })
          PY
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy validated artifact
        id: deployment
        uses: actions/deploy-pages@v4
