name: Validate production artifact v330

on:
  workflow_run:
    workflows: ["Validate every assessment and cognitive tool v31"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  validate-artifact:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve artifact run
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if [ -n "${EVENT_RUN_ID}" ]; then
            echo "run_id=${EVENT_RUN_ID}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=validated-production-site&per_page=100" \
            -o /tmp/artifacts.json
          python - <<'PY'
          import json
          import os
          items = [
              item for item in json.load(open("/tmp/artifacts.json", encoding="utf-8")).get("artifacts", [])
              if not item.get("expired")
              and item.get("workflow_run", {}).get("head_branch") == "main"
          ]
          if not items:
              raise SystemExit("No active validated-production-site artifact from main")
          item = max(items, key=lambda value: value.get("created_at", ""))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"run_id={item['workflow_run']['id']}\n")
          PY

      - uses: actions/download-artifact@v4
        with:
          name: validated-production-site
          path: _site
          repository: khaledaltheeb/healthrenewal.org
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Validate artifact completeness without publishing
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          site = Path("_site")
          required = (
              "index.html",
              "library/index.html",
              "api/academic-library-v326.json",
              "sitemap-library-academic-v326.xml",
          )
          missing = [path for path in required if not (site / path).is_file()]
          assert not missing, missing
          routes = list(site.rglob("index.html"))
          assert len(routes) >= 200, len(routes)
          academic = json.loads((site / "api/academic-library-v326.json").read_text(encoding="utf-8"))
          assert academic["status"] == "passed"
          assert academic["total_entries"] == 80
          assert academic["generated_pages"] == 84
          print({"validated_routes": len(routes), "academic_entries": academic["total_entries"]})
          PY
