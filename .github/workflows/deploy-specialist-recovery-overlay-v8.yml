name: Validate specialist recovery v8 compatibility

on:
  pull_request:
    branches: ["main"]
    paths:
      - "specialists-partners/account-backend/src/index-v8.js"
      - "specialists-partners/admin/**"
      - "specialists-partners/recover/**"
      - "tests/test_specialist_recovery_v8.py"
      - ".github/workflows/deploy-specialist-recovery-overlay-v8.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate retained v8 recovery contracts
        run: |
          set -euo pipefail
          node --check specialists-partners/account-backend/src/index-v8.js
          node --check specialists-partners/admin/admin.js
          node --check specialists-partners/recover/recover.js
          python -m unittest -v tests.test_specialist_recovery_v8
          echo "Legacy v8 is validation-only. Production deployment is owned by deploy-specialist-identity-v10.yml."
