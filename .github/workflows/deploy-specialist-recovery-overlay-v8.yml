name: Deploy specialist recovery overlay v8

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/deploy-specialist-recovery-overlay-v8.yml"
      - "specialists-partners/account-backend/src/index-v8.js"
  workflow_run:
    workflows: ["Validate and deploy specialist identity v6"]
    types: [completed]
  workflow_dispatch:
    inputs:
      send_owner_reset_probe:
        description: "Send one verified owner reset email after deployment"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: specialist-recovery-overlay-v8
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '826ac34927c1e045c06145a327c2ac52' }}
      PREFERRED_D1_DATABASE_ID: ${{ secrets.SPECIALISTS_D1_DATABASE_ID }}
      PREFERRED_TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      ADMIN_API_KEY: ${{ secrets.SPECIALISTS_ADMIN_API_KEY }}
      REVIEWER_API_KEY: ${{ secrets.SPECIALISTS_REVIEWER_API_KEY }}
      MODERATOR_API_KEY: ${{ secrets.SPECIALISTS_MODERATOR_API_KEY }}
      RATE_LIMIT_SALT: ${{ secrets.SPECIALISTS_RATE_LIMIT_SALT }}
      PASSWORD_PEPPER: ${{ secrets.SPECIALISTS_PASSWORD_PEPPER }}
      FROM_EMAIL: ${{ secrets.SPECIALISTS_FROM_EMAIL }}
      DATABASE_NAME: pterminology-specialists
      TURNSTILE_WIDGET_NAME: pterminology-specialists-forms
      ALLOWED_HOSTNAME: khaledaltheeb.github.io
      ACCOUNT_API_BASE: https://pterminology-specialist-accounts.pterminology-826ac349.workers.dev
      CORE_API_BASE: https://pterminology-specialists.pterminology-826ac349.workers.dev

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate recovery overlay and interface contract
        run: |
          set -euo pipefail
          node --check specialists-partners/account-backend/src/index-v8.js
          node --check specialists-partners/admin/admin.js
          node --check specialists-partners/recover/recover.js
          python -m unittest -v tests.test_specialist_recovery_v8

      - name: Validate secrets and discover Cloudflare resources
        id: resources
        shell: bash
        run: |
          set -euo pipefail
          required=(CLOUDFLARE_API_TOKEN RESEND_API_KEY ADMIN_API_KEY RATE_LIMIT_SALT FROM_EMAIL)
          for name in "${required[@]}"; do
            [[ -n "${!name:-}" ]] || { echo "::error::$name is required"; exit 1; }
          done
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/tokens/verify" | python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("success") and d.get("result",{}).get("status")=="active", d'
          python - <<'PY'
          import json, os, urllib.parse, urllib.request

          account_id=os.environ['CLOUDFLARE_ACCOUNT_ID']
          token=os.environ['CLOUDFLARE_API_TOKEN']
          database_name=os.environ['DATABASE_NAME']
          widget_name=os.environ['TURNSTILE_WIDGET_NAME']
          hostname=os.environ['ALLOWED_HOSTNAME']
          headers={'Authorization':f'Bearer {token}','Content-Type':'application/json'}

          def call(url, method='GET', payload=None):
              data=None if payload is None else json.dumps(payload).encode()
              req=urllib.request.Request(url,method=method,headers=headers,data=data)
              with urllib.request.urlopen(req,timeout=60) as response:
                  result=json.load(response)
              if result.get('success') is not True:
                  raise SystemExit(result)
              return result

          preferred_db=os.environ.get('PREFERRED_D1_DATABASE_ID','').strip()
          if preferred_db:
              database_id=preferred_db
          else:
              d1_url=f'https://api.cloudflare.com/client/v4/accounts/{account_id}/d1/database?per_page=100'
              databases=call(d1_url).get('result',[])
              matches=[item for item in databases if item.get('name')==database_name]
              if not matches or not matches[0].get('uuid'):
                  raise SystemExit('D1 database not found')
              database_id=matches[0]['uuid']

          preferred_secret=os.environ.get('PREFERRED_TURNSTILE_SECRET','').strip()
          widget_base=f'https://api.cloudflare.com/client/v4/accounts/{account_id}/challenges/widgets'
          query=urllib.parse.urlencode({'filter':f'name:{widget_name}','per_page':100})
          widgets=call(widget_base+'?'+query).get('result',[])
          matches=[item for item in widgets if item.get('name')==widget_name]
          if preferred_secret:
              turnstile_secret=preferred_secret
              sitekey=matches[0].get('sitekey') if matches else ''
          elif matches:
              sitekey=matches[0].get('sitekey')
              rotated=call(f"{widget_base}/{urllib.parse.quote(sitekey,safe='')}/rotate_secret",'POST',{'invalidate_immediately':False}).get('result',{})
              turnstile_secret=rotated.get('secret')
              sitekey=rotated.get('sitekey') or sitekey
          else:
              widget=call(widget_base,'POST',{'domains':[hostname],'mode':'managed','name':widget_name,'clearance_level':'no_clearance','region':'world'}).get('result',{})
              sitekey=widget.get('sitekey')
              turnstile_secret=widget.get('secret')

          if not database_id or not sitekey or not turnstile_secret:
              raise SystemExit('Cloudflare resources incomplete')
          print(f'::add-mask::{turnstile_secret}')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out:
              out.write(f'database_id={database_id}\n')
              out.write(f'turnstile_sitekey={sitekey}\n')
              out.write(f'turnstile_secret={turnstile_secret}\n')
          print(f'D1 ready: {database_name} ({database_id})')
          print(f'Turnstile ready: {widget_name} ({sitekey})')
          PY

      - name: Generate Worker configuration and secrets
        working-directory: specialists-partners/account-backend
        env:
          D1_DATABASE_ID: ${{ steps.resources.outputs.database_id }}
          TURNSTILE_SECRET: ${{ steps.resources.outputs.turnstile_secret }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          def q(v): return '"' + str(v).replace('\\','\\\\').replace('"','\\"') + '"'
          content=f'''name = "pterminology-specialist-accounts"
          main = "src/index-v8.js"
          compatibility_date = "2026-07-01"
          workers_dev = true

          [vars]
          ALLOWED_ORIGINS = "https://khaledaltheeb.github.io"
          ACCOUNT_BASE_URL = "https://khaledaltheeb.github.io/pterminology-site/specialists-partners/account/"
          ADMIN_BASE_URL = "https://khaledaltheeb.github.io/pterminology-site/specialists-partners/admin/"
          PASSWORD_RESET_BASE_URL = "https://khaledaltheeb.github.io/pterminology-site/specialists-partners/password-reset/"
          PORTAL_BASE_URL = "https://khaledaltheeb.github.io/pterminology-site/specialists-partners/portal/"
          CORE_API_BASE = "{os.environ['CORE_API_BASE']}"
          TURNSTILE_EXPECTED_HOSTNAMES = "khaledaltheeb.github.io"
          IDENTITY_SESSION_HOURS = "12"
          OWNER_EMAIL = "pterminology@gmail.com"
          OWNER_PHONE = "+962795945817"
          OWNER_DISPLAY_NAME_AR = "خالد الذيب"
          OWNER_DISPLAY_NAME_EN = "Khaled Altheeb"
          FROM_EMAIL = {q(os.environ['FROM_EMAIL'])}

          [[d1_databases]]
          binding = "DB"
          database_name = "pterminology-specialists"
          database_id = {q(os.environ['D1_DATABASE_ID'])}
          migrations_dir = "../backend/migrations"

          [triggers]
          crons = ["31 2 * * *"]
          '''
          Path('wrangler-v8.toml').write_text(content,encoding='utf-8')
          secrets={
            'RESEND_API_KEY':os.environ['RESEND_API_KEY'],
            'TURNSTILE_SECRET':os.environ['TURNSTILE_SECRET'],
            'ADMIN_API_KEY':os.environ['ADMIN_API_KEY'],
            'RATE_LIMIT_SALT':os.environ['RATE_LIMIT_SALT'],
          }
          if os.environ.get('PASSWORD_PEPPER'): secrets['PASSWORD_PEPPER']=os.environ['PASSWORD_PEPPER']
          if os.environ.get('REVIEWER_API_KEY'): secrets['REVIEWER_API_KEY']=os.environ['REVIEWER_API_KEY']
          if os.environ.get('MODERATOR_API_KEY'): secrets['MODERATOR_API_KEY']=os.environ['MODERATOR_API_KEY']
          Path('worker-secrets-v8.json').write_text(json.dumps(secrets),encoding='utf-8')
          PY
          chmod 600 wrangler-v8.toml worker-secrets-v8.json

      - name: Deploy recovery overlay to identity Worker
        working-directory: specialists-partners/account-backend
        run: npx --yes wrangler@4 deploy --config wrangler-v8.toml --secrets-file worker-secrets-v8.json --minify --keep-vars

      - name: Verify deployed health and recovery routes
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          for attempt in {1..36}; do
            code="$(curl -sS -o /tmp/health.json -w '%{http_code}' "${ACCOUNT_API_BASE}/health?probe=${GITHUB_RUN_ID}-${attempt}" || true)"
            if [[ "${code}" == "200" ]]; then
              if python - <<'PY'
          import json
          d=json.load(open('/tmp/health.json',encoding='utf-8'))
          assert d.get('ok') is True, d
          assert d.get('version') == '8.0.0', d
          checks=d.get('checks') or {}
          assert checks.get('passwordResetBase') is True, checks
          assert checks.get('resendConfigured') is True, checks
          assert checks.get('recoveryOverlay') is True, checks
          PY
              then ready=true; break; fi
            fi
            sleep 5
          done
          [[ "${ready}" == "true" ]] || { cat /tmp/health.json || true; echo "::error::Recovery overlay health did not become ready"; exit 1; }
          empty_code="$(curl -sS -o /tmp/reset-empty.json -w '%{http_code}' -X POST -H 'Origin: https://khaledaltheeb.github.io' -H 'content-type: application/json' -H 'x-requested-with: pterminology-recovery-v8' --data '{}' "${ACCOUNT_API_BASE}/v1/auth/password/request" || true)"
          [[ "${empty_code}" == "400" ]] || { cat /tmp/reset-empty.json || true; exit 1; }

      - name: Send owner reset delivery probe
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.send_owner_reset_probe }}
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/owner-reset.json -w '%{http_code}' -X POST -H "x-bootstrap-key: ${ADMIN_API_KEY}" -H 'content-type: application/json' --data '{}' "${ACCOUNT_API_BASE}/v1/internal/owner-password-reset" || true)"
          cat /tmp/owner-reset.json
          [[ "${code}" == "200" ]] || exit 1
          python - <<'PY'
          import json
          d=json.load(open('/tmp/owner-reset.json',encoding='utf-8'))
          assert d.get('ok') is True and d.get('delivery') == 'sent', d
          assert d.get('providerMessageId'), d
          PY
