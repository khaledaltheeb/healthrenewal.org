name: Build complete institutional site v5 and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-production
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate the complete institutional publication
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      build_sha: ${{ steps.source.outputs.build_sha }}

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Bind build to current main head
        id: source
        run: |
          set -euo pipefail
          build_sha="$(git rev-parse HEAD)"
          echo "build_sha=${build_sha}" >> "${GITHUB_OUTPUT}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Locate latest validated production baseline
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=validated-production-site&per_page=100" -o /tmp/baselines.json
          python - <<'PY'
          import json, os
          payload = json.load(open('/tmp/baselines.json', encoding='utf-8'))
          candidates = [item for item in payload.get('artifacts', []) if not item.get('expired') and item.get('workflow_run', {}).get('head_branch') == 'main' and item.get('workflow_run', {}).get('id')]
          if not candidates: raise SystemExit('No active validated-production-site artifact from main')
          item = max(candidates, key=lambda value: value.get('created_at', ''))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output: output.write(f"run_id={item['workflow_run']['id']}\n")
          print({'baselineRunId': item['workflow_run']['id'], 'createdAt': item.get('created_at')})
          PY

      - name: Download validated baseline
        uses: actions/download-artifact@v4
        with:
          name: validated-production-site
          path: /tmp/validated-baseline
          repository: khaledaltheeb/healthrenewal.org
          run-id: ${{ steps.baseline.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Compile and test the capabilities source contracts
        run: |
          set -euo pipefail
          python -m py_compile scripts/build_clean_site_v1.py scripts/publish_capabilities_v280.py scripts/build_conditions_v281_data.py scripts/publish_conditions_v281.py scripts/enforce_capabilities_seo_v1.py scripts/publish_scientific_special_needs_library_v1.py scripts/normalize_platform_shell.py scripts/publish_complete_sitemap_v360.py scripts/validate_capabilities_production_v1.py tests/test_conditions_v281.py
          python scripts/build_conditions_v281_data.py
          python -m unittest -v tests.test_conditions_v281

      - name: Assemble the complete site and regenerate capabilities
        env:
          BUILD_SHA: ${{ steps.source.outputs.build_sha }}
          CAPABILITIES_LASTMOD: "2026-08-14"
        run: |
          set -euo pipefail
          test -f /tmp/validated-baseline/index.html
          python scripts/build_clean_site_v1.py --root . --site _site --baseline /tmp/validated-baseline
          python scripts/publish_capabilities_v280.py _site
          python scripts/build_conditions_v281_data.py
          python scripts/publish_conditions_v281.py _site
          python scripts/publish_scientific_special_needs_library_v1.py _site
          python scripts/normalize_platform_shell.py _site --report-path _site/reports/final-platform-normalization.json
          if test -f scripts/publish_section_directory_v322.py; then python scripts/publish_section_directory_v322.py _site; fi
          python scripts/publish_complete_sitemap_v360.py _site --minimum-urls 3000
          python scripts/enforce_capabilities_seo_v1.py _site
          python scripts/validate_capabilities_production_v1.py _site --minimum-v281-words 1300
          python - <<'PY'
          import json, os
          from pathlib import Path
          site=Path('_site'); gate=json.loads((site/'api/capabilities-production-gate-v1.json').read_text()); seo=json.loads((site/'api/capabilities-seo-v1.json').read_text()); sitemap=json.loads((site/'api/sitemap-completeness-v360.json').read_text()); normalization=json.loads((site/'reports/final-platform-normalization.json').read_text()); v281=json.loads((site/'api/capabilities-v281.json').read_text()); final_html=sum(1 for p in site.rglob('*.html') if p.is_file())
          assert gate['status']=='passed' and gate['failures']=={} and gate['counts']['capability_pages']>=155 and gate['counts']['capability_condition_pages']>=150 and gate['v280ConditionCount']==100 and gate['v281ConditionCount']==50 and gate['reviewedConditionCount']==50
          assert seo['status']=='passed' and seo['pages_processed']>=155 and seo['legacy_internal_origin_occurrences']==0
          assert v281['status']=='passed' and v281['generated_page_count']==51 and v281['minimum_page_word_count']>=1300
          assert sitemap['status']=='passed' and sitemap['real_indexable_urls']>=3000 and normalization['status']=='passed' and final_html>=3000
          audit={'schemaVersion':7,'status':'passed','releaseCommit':os.environ['BUILD_SHA'],'finalPublication':{'htmlPages':final_html,'indexableUrls':sitemap['real_indexable_urls']},'capabilities':gate,'capabilitiesSeo':seo,'platformNormalization':normalization['counts']}
          (site/'api/repository-production-audit-v2.json').write_text(json.dumps(audit,ensure_ascii=False,indent=2)+'\n')
          (site/'api/final-production-inventory-v1.json').write_text(json.dumps({'schemaVersion':7,'status':'passed','releaseCommit':os.environ['BUILD_SHA'],'finalHtmlPages':final_html,'realIndexableUrls':sitemap['real_indexable_urls'],'specialNeedsCounts':gate['counts'],'v280ConditionCount':gate['v280ConditionCount'],'v281ConditionCount':gate['v281ConditionCount'],'v281MinimumPageWordCount':gate['v281MinimumPageWordCount'],'reviewedConditionCount':gate['reviewedConditionCount'],'capabilitiesSeoPagesProcessed':seo['pages_processed'],'capabilitiesLegacyOrigins':seo['legacy_internal_origin_occurrences']},ensure_ascii=False,indent=2)+'\n')
          PY
          printf '{\n  "schemaVersion": 11,\n  "release_commit": "%s",\n  "build_mode": "institutional-v5-capabilities-seo-complete-site"\n}\n' "${BUILD_SHA}" > _site/deployment.json
          touch _site/.nojekyll

      - name: Preserve validated institutional site
        uses: actions/upload-artifact@v4
        with:
          name: validated-production-site
          path: _site
          include-hidden-files: true
          retention-days: 90
          compression-level: 6
      - uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy and verify the exact capabilities release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify exact capabilities publication live
        env:
          EXPECTED_SHA: ${{ needs.build.outputs.build_sha }}
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 90); do
            nonce="${GITHUB_RUN_ID}-${attempt}-$(date +%s)"
            base="https://healthrenewal.org"
            ok=1
            for item in "deployment.json:/tmp/deployment.json" "api/capabilities-production-gate-v1.json:/tmp/gate.json" "api/capabilities-seo-v1.json:/tmp/seo.json" "api/capabilities-v281.json:/tmp/v281.json" "api/final-production-inventory-v1.json:/tmp/final.json" "capabilities/registry/:/tmp/registry.html" "capabilities/expanded/:/tmp/expanded.html" "capabilities/pura-syndrome/:/tmp/pura.html" "capabilities/foxg1-syndrome/:/tmp/foxg1.html" "sitemap-index.xml:/tmp/sitemap-index.xml" "robots.txt:/tmp/robots.txt"; do
              path="${item%%:*}"; out="${item#*:}"
              curl -fsSL --connect-timeout 8 --max-time 20 --retry 1 -H 'Cache-Control: no-cache' "${base}/${path}?release=${nonce}" -o "${out}" || { ok=0; break; }
            done
            if test "$ok" = 1 && python - <<'PY'
          import json, os, re
          from xml.etree import ElementTree as ET
          deployment=json.load(open('/tmp/deployment.json')); gate=json.load(open('/tmp/gate.json')); seo=json.load(open('/tmp/seo.json')); v281=json.load(open('/tmp/v281.json')); final=json.load(open('/tmp/final.json')); registry=open('/tmp/registry.html').read(); expanded=open('/tmp/expanded.html').read(); pura=open('/tmp/pura.html').read(); foxg1=open('/tmp/foxg1.html').read(); robots=open('/tmp/robots.txt').read(); ET.parse('/tmp/sitemap-index.xml')
          assert deployment['release_commit']==os.environ['EXPECTED_SHA'] and deployment['build_mode']=='institutional-v5-capabilities-seo-complete-site'
          assert gate['status']=='passed' and gate['failures']=={} and gate['counts']['capability_pages']>=155 and gate['counts']['capability_condition_pages']>=150 and gate['v280ConditionCount']==100 and gate['v281ConditionCount']==50 and gate['reviewedConditionCount']==50
          assert seo['status']=='passed' and seo['pages_processed']>=155 and seo['legacy_internal_origin_occurrences']==0
          assert v281['status']=='passed' and v281['condition_count']==50 and v281['generated_page_count']==51 and v281['minimum_page_word_count']>=1300
          assert final['status']=='passed' and final['realIndexableUrls']>=3000 and '150 حالة' in registry and '100 حالة' not in registry
          for page in (registry,expanded,pura,foxg1):
              assert '/pterminology-site/' not in page and 'khaledaltheeb.github.io/pterminology-site' not in page and 'property="og:image"' in page and 'name="twitter:image"' in page and 'summary_large_image' in page and 'BreadcrumbList' in page
          assert 'NBK426063' in pura and 'محتوى تثقيفي' in pura and 'NBK604176' in foxg1 and 'محتوى تثقيفي' in foxg1
          assert len(re.findall(r'[\u0600-\u06ffA-Za-z0-9]+',pura))>=1300 and len(re.findall(r'[\u0600-\u06ffA-Za-z0-9]+',foxg1))>=1300
          assert 'sitemap-capabilities.xml' in robots and 'sitemap-capabilities-v281.xml' in robots
          PY
            then ready=1; break; fi
            sleep 10
          done
          test "$ready" = 1
