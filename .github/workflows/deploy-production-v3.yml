name: Build complete institutional site v4 and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-production
  cancel-in-progress: false

jobs:
  build:
    name: Restore, enrich, validate and assemble full institutional publication
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      build_sha: ${{ steps.source.outputs.build_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - id: source
        run: |
          set -euo pipefail
          echo "build_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Locate latest validated production baseline
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=validated-production-site&per_page=100" -o /tmp/baselines.json
          python - <<'PY'
          import json,os
          p=json.load(open('/tmp/baselines.json',encoding='utf-8'))
          xs=[x for x in p.get('artifacts',[]) if not x.get('expired') and x.get('workflow_run',{}).get('head_branch')=='main' and x.get('workflow_run',{}).get('id')]
          if not xs: raise SystemExit('No validated production baseline')
          x=max(xs,key=lambda y:y.get('created_at',''))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write(f"run_id={x['workflow_run']['id']}\n")
          print({'baselineRunId':x['workflow_run']['id'],'createdAt':x.get('created_at')})
          PY
      - uses: actions/download-artifact@v4
        with:
          name: validated-production-site
          path: /tmp/validated-baseline
          repository: khaledaltheeb/healthrenewal.org
          run-id: ${{ steps.baseline.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Assemble complete publication
        env:
          BUILD_SHA: ${{ steps.source.outputs.build_sha }}
        run: |
          set -euo pipefail
          test -f /tmp/validated-baseline/index.html
          python -m py_compile scripts/normalize_platform_shell.py scripts/build_clean_site_v1.py scripts/ensure_special_needs_publication_v1.py scripts/publish_scientific_special_needs_library_v1.py scripts/publish_complete_sitemap_v360.py scripts/publish_section_directory_v322.py scripts/publish_capabilities_v280.py scripts/build_conditions_v281_data.py scripts/publish_conditions_v281.py scripts/apply_quick_info_editorial_batch.py scripts/finalize_production_quality_v1.py scripts/audit_production_content_v1.py
          python scripts/build_clean_site_v1.py --root . --site _site --baseline /tmp/validated-baseline
          python scripts/publish_capabilities_v280.py _site
          python scripts/build_conditions_v281_data.py
          python scripts/publish_conditions_v281.py _site
          python - <<'PY'
          from pathlib import Path
          old='https://khaledaltheeb.github.io/pterminology-site/'
          new='https://healthrenewal.org/'
          n=0
          for p in Path('_site/capabilities').rglob('*.html'):
              s=p.read_text(encoding='utf-8',errors='replace'); u=s.replace(old,new)
              if u!=s:p.write_text(u,encoding='utf-8',newline='\n');n+=1
          print({'capabilityCanonicalPagesFixed':n})
          PY
          python scripts/publish_scientific_special_needs_library_v1.py _site
          python scripts/normalize_platform_shell.py _site --report-path _site/reports/final-platform-normalization.json

          # Integrate all committed, human-reviewed Quick Info upgrades and normalize SEO metadata.
          python scripts/finalize_production_quality_v1.py --site _site --repo-root .

          python scripts/publish_section_directory_v322.py _site
          python scripts/publish_complete_sitemap_v360.py _site --minimum-urls 3000

          # Homepage count and scientific library entry are derived from the final publication.
          python - <<'PY'
          import json,re
          from pathlib import Path
          site=Path('_site'); sm=json.loads((site/'api/sitemap-completeness-v360.json').read_text(encoding='utf-8')); count=int(sm['real_indexable_urls'])
          p=site/'index.html'; s=p.read_text(encoding='utf-8')
          u,n=re.subn(r'(<strong\b[^>]*data-surface-page-count[^>]*>).*?(</strong>)',rf'\g<1>{count:,}+\g<2>',s,count=1,flags=re.S)
          u=u.replace('صفحة قابلة للفهرسة، بينها 2,000+ صفحة موسوعية مستقلة','رابطًا فعليًا قابلًا للفهرسة ضمن خريطة موقع نهائية محدثة آليًا')
          marker='data-home-science-v1'
          if marker not in u:
              card=('<article class="card" data-home-science-v1><span class="tag">علمي موثق</span><h3 class="item-title">المكتبة العلمية لذوي الاحتياجات الخاصة</h3><p>مراجعات وأدلة تطبيقية تربط الإرشادات المهنية بالمشاركة والتأهيل والتقنية المساعدة والتعليم الدامج.</p><a href="special-needs/science/">فتح المكتبة العلمية</a></article>')
              u,c=re.subn(r'(<article class="card" data-special-needs-v73>.*?</article>)',r'\1'+card,u,count=1,flags=re.S)
              if c!=1: raise SystemExit('Homepage science insertion point missing')
          if n!=1: raise SystemExit('Homepage count placeholder missing')
          p.write_text(u,encoding='utf-8',newline='\n')
          print({'homepageIndexableCount':count,'scienceCard':marker in u})
          PY

          # Re-run full-site content audit on the exact candidate artifact and preserve the report.
          python scripts/audit_production_content_v1.py _site --out _site/reports/content-quality
          python - <<'PY'
          import json,re
          from pathlib import Path
          site=Path('_site'); baseline=Path('/tmp/validated-baseline')
          clean=json.loads((site/'api/clean-site-build-v1.json').read_text(encoding='utf-8'))
          sitemap=json.loads((site/'api/sitemap-completeness-v360.json').read_text(encoding='utf-8'))
          science=json.loads((site/'api/scientific-special-needs-library-v1.json').read_text(encoding='utf-8'))
          normalization=json.loads((site/'reports/final-platform-normalization.json').read_text(encoding='utf-8'))
          quality=json.loads((site/'api/production-quality-finalization-v1.json').read_text(encoding='utf-8'))
          content=json.loads((site/'reports/content-quality/production-content-audit-v1.json').read_text(encoding='utf-8'))
          homepage=(site/'index.html').read_text(encoding='utf-8')
          final_html=sum(1 for p in site.rglob('*.html') if p.is_file()); baseline_html=sum(1 for p in baseline.rglob('*.html') if p.is_file())
          metric=re.search(r'data-surface-page-count[^>]*>([^<]+)',homepage)
          assert clean['status']=='passed' and normalization['status']=='passed'
          assert final_html>=baseline_html>=3000
          assert sitemap['status']=='passed' and sitemap['real_indexable_urls']>=3000
          assert science['status']=='passed' and science['topicPages']>=12
          assert quality['status']=='passed' and quality['editorial']['pages']>=35,quality
          assert content['status']=='passed' and content['totalHtmlPages']>=3000
          assert content['seo']['badCanonical']==0,content['seo']
          assert metric and metric.group(1)==f"{sitemap['real_indexable_urls']:,}+"
          assert 'data-home-science-v1' in homepage
          audit={'schemaVersion':5,'status':'passed','policy':'repository-authoritative plus validated baseline recovery; committed reviewed editorial overlays integrated before final sitemap; canonical metadata normalized across final HTML','validatedBaseline':{'htmlPages':baseline_html},'finalPublication':{'htmlPages':final_html,'indexableUrls':sitemap['real_indexable_urls']},'expansion':{'scientificTopicPages':science['topicPages'],'reviewedQuickInfoPages':quality['editorial']['pages']},'homepage':{'indexableMetric':metric.group(1),'scientificLibraryLinked':True},'platformNormalization':normalization['counts'],'contentQuality':{'thin':content['thin'],'seo':content['seo'],'graph':content['graph'],'duplicates':content['duplicates']}}
          (site/'api/repository-production-audit-v2.json').write_text(json.dumps(audit,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          (site/'api/final-production-inventory-v1.json').write_text(json.dumps({'schemaVersion':5,'status':'passed','finalHtmlPages':final_html,'realIndexableUrls':sitemap['real_indexable_urls'],'scienceTopicPages':science['topicPages'],'reviewedQuickInfoPages':quality['editorial']['pages'],'homepageIndexableMetric':metric.group(1),'contentQuality':audit['contentQuality']},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(audit)
          PY
          cat > _site/deployment.json <<EOF
          {"schemaVersion":10,"release_commit":"${BUILD_SHA}","build_mode":"institutional-v4-reviewed-editorial-canonical-quality-finalization"}
          EOF
          touch _site/.nojekyll
      - uses: actions/upload-artifact@v4
        with:
          name: validated-production-site
          path: _site
          include-hidden-files: true
          retention-days: 90
          compression-level: 6
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify exact production release live
        env:
          EXPECTED_SHA: ${{ needs.build.outputs.build_sha }}
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 60); do
            nonce="${GITHUB_RUN_ID}-${attempt}-$(date +%s)"
            if curl -fsSL -H 'Cache-Control: no-cache' "https://healthrenewal.org/deployment.json?release=${nonce}" -o /tmp/d.json && curl -fsSL -H 'Cache-Control: no-cache' "https://healthrenewal.org/api/repository-production-audit-v2.json?release=${nonce}" -o /tmp/a.json && curl -fsSL -H 'Cache-Control: no-cache' "https://healthrenewal.org/quick-info/break-phone-checking-habit/?release=${nonce}" -o /tmp/q.html; then
              if python - <<'PY'
          import json,os
          d=json.load(open('/tmp/d.json')); a=json.load(open('/tmp/a.json')); q=open('/tmp/q.html',encoding='utf-8').read()
          assert d['release_commit']==os.environ['EXPECTED_SHA']
          assert d['build_mode']=='institutional-v4-reviewed-editorial-canonical-quality-finalization'
          assert a['status']=='passed' and a['finalPublication']['indexableUrls']>=3000
          assert a['expansion']['reviewedQuickInfoPages']>=35
          assert 'QUICK_INFO_EDITORIAL_BATCH_' in q
          assert 'https://healthrenewal.org/quick-info/break-phone-checking-habit/' in q
          print({'deployment':d,'audit':a})
          PY
              then ready=1; break; fi
            fi
            sleep 5
          done
          test "$ready" = 1
