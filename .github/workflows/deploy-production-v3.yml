name: Build complete institutional site v6 and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-production
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate the complete institutional publication
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      build_sha: ${{ steps.source.outputs.build_sha }}

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Bind build to current main head
        id: source
        run: |
          set -euo pipefail
          build_sha="$(git rev-parse HEAD)"
          echo "build_sha=${build_sha}" >> "${GITHUB_OUTPUT}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Locate latest validated production baseline
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=validated-production-site&per_page=100" \
            -o /tmp/baselines.json
          python - <<'PY'
          import json
          import os

          payload = json.load(open('/tmp/baselines.json', encoding='utf-8'))
          candidates = [
              item
              for item in payload.get('artifacts', [])
              if not item.get('expired')
              and item.get('workflow_run', {}).get('head_branch') == 'main'
              and item.get('workflow_run', {}).get('id')
          ]
          if not candidates:
              raise SystemExit('No active validated-production-site artifact from main')
          item = max(candidates, key=lambda value: value.get('created_at', ''))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"run_id={item['workflow_run']['id']}\n")
          print({'baselineRunId': item['workflow_run']['id'], 'createdAt': item.get('created_at')})
          PY

      - name: Download validated baseline
        uses: actions/download-artifact@v4
        with:
          name: validated-production-site
          path: /tmp/validated-baseline
          repository: khaledaltheeb/healthrenewal.org
          run-id: ${{ steps.baseline.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Compile and test publication contracts
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/build_clean_site_v1.py \
            scripts/publish_capabilities_v280.py \
            scripts/build_conditions_v281_data.py \
            scripts/publish_conditions_v281.py \
            scripts/enforce_capabilities_seo_v1.py \
            scripts/publish_scientific_special_needs_library_v1.py \
            scripts/publish_special_needs_wave100_v1.py \
            scripts/validate_special_needs_wave100_v1.py \
            scripts/normalize_platform_shell.py \
            scripts/publish_complete_sitemap_v360.py \
            scripts/validate_capabilities_production_v1.py \
            tests/test_conditions_v281.py
          python scripts/build_conditions_v281_data.py
          python -m unittest -v tests.test_conditions_v281

      - name: Assemble the complete site and regenerate institutional libraries
        env:
          BUILD_SHA: ${{ steps.source.outputs.build_sha }}
          CAPABILITIES_LASTMOD: "2026-08-14"
        run: |
          set -euo pipefail
          test -f /tmp/validated-baseline/index.html

          # Current repository content is authoritative. The validated production
          # artifact restores missing public files without discarding newer sources.
          python scripts/build_clean_site_v1.py \
            --root . \
            --site _site \
            --baseline /tmp/validated-baseline

          # Regenerate capabilities from their reviewable source data.
          python scripts/publish_capabilities_v280.py _site
          python scripts/build_conditions_v281_data.py
          python scripts/publish_conditions_v281.py _site

          # Rebuild scientific surfaces and the reviewed 100-page knowledge wave.
          python scripts/publish_scientific_special_needs_library_v1.py _site
          python scripts/publish_special_needs_wave100_v1.py _site --repo-root .

          # Every late publisher receives the same institutional shell before indexing.
          python scripts/normalize_platform_shell.py \
            _site \
            --report-path _site/reports/final-platform-normalization.json

          if test -f scripts/publish_section_directory_v322.py; then
            python scripts/publish_section_directory_v322.py _site
          fi

          # Discover every final indexable route only after all publishers finish.
          python scripts/publish_complete_sitemap_v360.py _site --minimum-urls 3000

          # Capabilities SEO is a final deterministic mutation for that library.
          python scripts/enforce_capabilities_seo_v1.py _site

          # Existing exhaustive gate for the capability library.
          python scripts/validate_capabilities_production_v1.py \
            _site \
            --minimum-v281-words 1300

          # Independent Wave100 gate counts visible body text only (script/style excluded).
          python scripts/validate_special_needs_wave100_v1.py _site --minimum-words 1200

          # Preserve machine-readable production evidence bound to this commit.
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          site = Path('_site')
          gate = json.loads((site / 'api/capabilities-production-gate-v1.json').read_text(encoding='utf-8'))
          seo = json.loads((site / 'api/capabilities-seo-v1.json').read_text(encoding='utf-8'))
          sitemap = json.loads((site / 'api/sitemap-completeness-v360.json').read_text(encoding='utf-8'))
          normalization = json.loads((site / 'reports/final-platform-normalization.json').read_text(encoding='utf-8'))
          v281 = json.loads((site / 'api/capabilities-v281.json').read_text(encoding='utf-8'))
          wave100 = json.loads((site / 'api/special-needs-wave100-v1.json').read_text(encoding='utf-8'))
          wave100_quality = json.loads((site / 'api/special-needs-wave100-visible-quality-v1.json').read_text(encoding='utf-8'))
          final_html = sum(1 for path in site.rglob('*.html') if path.is_file())

          assert gate['status'] == 'passed', gate
          assert gate['counts']['capability_pages'] >= 155, gate
          assert gate['counts']['capability_condition_pages'] >= 150, gate
          assert gate['v280ConditionCount'] == 100, gate
          assert gate['v281ConditionCount'] == 50, gate
          assert gate['reviewedConditionCount'] == 50, gate
          assert gate['failures'] == {}, gate
          assert seo['status'] == 'passed', seo
          assert seo['pages_processed'] >= 155, seo
          assert seo['legacy_internal_origin_occurrences'] == 0, seo
          assert v281['status'] == 'passed', v281
          assert v281['generated_page_count'] == 51, v281
          assert v281['minimum_page_word_count'] >= 1300, v281
          assert wave100['status'] == 'passed', wave100
          assert wave100['generated'] == 100, wave100
          assert wave100['topicPages'] == 90 and wave100['hubPages'] == 10, wave100
          assert wave100['conflicts'] == [], wave100
          assert wave100_quality['status'] == 'passed', wave100_quality
          assert wave100_quality['pages'] == 100, wave100_quality
          assert wave100_quality['topicPages'] == 90 and wave100_quality['hubPages'] == 10, wave100_quality
          assert wave100_quality['minimumVisibleTopicWords'] >= 1200, wave100_quality
          assert wave100_quality['minimumSourceLinks'] >= 2, wave100_quality
          assert wave100_quality['failures'] == [], wave100_quality
          assert sitemap['status'] == 'passed', sitemap
          assert sitemap['real_indexable_urls'] >= 3000, sitemap
          assert normalization['status'] == 'passed', normalization
          assert final_html >= 3000, final_html
          assert (site / 'special-needs/knowledge/index.html').is_file()
          assert (site / 'special-needs/knowledge/school-distress-neurodivergent-students/index.html').is_file()
          assert (site / 'special-needs/knowledge/aac-complete-arabic-guide/index.html').is_file()

          audit = {
              'schemaVersion': 8,
              'status': 'passed',
              'policy': 'repository-authoritative; baseline loss recovery; deterministic capability and special-needs regeneration; independent visible-content quality gate; final sitemap/indexability gates; exact live release verification',
              'releaseCommit': os.environ['BUILD_SHA'],
              'finalPublication': {
                  'htmlPages': final_html,
                  'indexableUrls': sitemap['real_indexable_urls'],
              },
              'capabilities': gate,
              'capabilitiesSeo': seo,
              'specialNeedsWave100': wave100_quality,
              'platformNormalization': normalization['counts'],
          }
          api = site / 'api'
          (api / 'repository-production-audit-v2.json').write_text(
              json.dumps(audit, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          (api / 'final-production-inventory-v1.json').write_text(
              json.dumps(
                  {
                      'schemaVersion': 8,
                      'status': 'passed',
                      'releaseCommit': os.environ['BUILD_SHA'],
                      'finalHtmlPages': final_html,
                      'realIndexableUrls': sitemap['real_indexable_urls'],
                      'specialNeedsCounts': gate['counts'],
                      'v280ConditionCount': gate['v280ConditionCount'],
                      'v281ConditionCount': gate['v281ConditionCount'],
                      'v281MinimumPageWordCount': gate['v281MinimumPageWordCount'],
                      'reviewedConditionCount': gate['reviewedConditionCount'],
                      'capabilitiesSeoPagesProcessed': seo['pages_processed'],
                      'capabilitiesLegacyOrigins': seo['legacy_internal_origin_occurrences'],
                      'wave100Pages': wave100_quality['pages'],
                      'wave100TopicPages': wave100_quality['topicPages'],
                      'wave100HubPages': wave100_quality['hubPages'],
                      'wave100MinimumVisibleTopicWords': wave100_quality['minimumVisibleTopicWords'],
                  },
                  ensure_ascii=False,
                  indent=2,
              ) + '\n',
              encoding='utf-8',
          )
          print(audit)
          PY

          cat > _site/deployment.json <<EOF
          {
            "schemaVersion": 12,
            "release_commit": "${BUILD_SHA}",
            "build_mode": "institutional-v6-special-needs-wave100-capabilities-seo-complete-site"
          }
          EOF
          touch _site/.nojekyll

      - name: Preserve validated institutional site
        uses: actions/upload-artifact@v4
        with:
          name: validated-production-site
          path: _site
          include-hidden-files: true
          retention-days: 90
          compression-level: 6

      - uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy and verify the exact institutional release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify exact institutional publication live
        env:
          EXPECTED_SHA: ${{ needs.build.outputs.build_sha }}
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 60); do
            nonce="${GITHUB_RUN_ID}-${attempt}-$(date +%s)"
            if curl -fsSL --retry 2 -H 'Cache-Control: no-cache' \
              "https://healthrenewal.org/deployment.json?release=${nonce}" -o /tmp/deployment.json \
              && curl -fsSL --retry 2 -H 'Cache-Control: no-cache' \
              "https://healthrenewal.org/api/capabilities-production-gate-v1.json?release=${nonce}" -o /tmp/gate.json \
              && curl -fsSL --retry 2 -H 'Cache-Control: no-cache' \
              "https://healthrenewal.org/api/capabilities-seo-v1.json?release=${nonce}" -o /tmp/seo.json \
              && curl -fsSL --retry 2 -H 'Cache-Control: no-cache' \
              "https://healthrenewal.org/api/capabilities-v281.json?release=${nonce}" -o /tmp/v281.json \
              && curl -fsSL --retry 2 -H 'Cache-Control: no-cache' \
              "https://healthrenewal.org/api/special-needs-wave100-visible-quality-v1.json?release=${nonce}" -o /tmp/wave100.json \
              && curl -fsSL --retry 2 -H 'Cache-Control: no-cache' \
              "https://healthrenewal.org/api/final-production-inventory-v1.json?release=${nonce}" -o /tmp/final.json \
              && curl -fsSL --retry 2 -H 'Cache-Control: no-cache' \
              "https://healthrenewal.org/capabilities/registry/?release=${nonce}" -o /tmp/registry.html \
              && curl -fsSL --retry 2 -H 'Cache-Control: no-cache' \
              "https://healthrenewal.org/capabilities/expanded/?release=${nonce}" -o /tmp/expanded.html \
              && curl -fsSL --retry 2 -H 'Cache-Control: no-cache' \
              "https://healthrenewal.org/capabilities/pura-syndrome/?release=${nonce}" -o /tmp/pura.html \
              && curl -fsSL --retry 2 -H 'Cache-Control: no-cache' \
              "https://healthrenewal.org/capabilities/foxg1-syndrome/?release=${nonce}" -o /tmp/foxg1.html \
              && curl -fsSL --retry 2 -H 'Cache-Control: no-cache' \
              "https://healthrenewal.org/special-needs/knowledge/?release=${nonce}" -o /tmp/knowledge.html \
              && curl -fsSL --retry 2 -H 'Cache-Control: no-cache' \
              "https://healthrenewal.org/special-needs/knowledge/school-distress-neurodivergent-students/?release=${nonce}" -o /tmp/school.html \
              && curl -fsSL --retry 2 -H 'Cache-Control: no-cache' \
              "https://healthrenewal.org/special-needs/knowledge/aac-complete-arabic-guide/?release=${nonce}" -o /tmp/aac.html \
              && curl -fsSL --retry 2 -H 'Cache-Control: no-cache' \
              "https://healthrenewal.org/sitemap-index.xml?release=${nonce}" -o /tmp/sitemap-index.xml \
              && curl -fsSL --retry 2 -H 'Cache-Control: no-cache' \
              "https://healthrenewal.org/robots.txt?release=${nonce}" -o /tmp/robots.txt; then
              if python - <<'PY'
          import json
          import os
          import re
          from xml.etree import ElementTree as ET

          deployment = json.load(open('/tmp/deployment.json', encoding='utf-8'))
          gate = json.load(open('/tmp/gate.json', encoding='utf-8'))
          seo = json.load(open('/tmp/seo.json', encoding='utf-8'))
          v281 = json.load(open('/tmp/v281.json', encoding='utf-8'))
          wave100 = json.load(open('/tmp/wave100.json', encoding='utf-8'))
          final = json.load(open('/tmp/final.json', encoding='utf-8'))
          registry = open('/tmp/registry.html', encoding='utf-8').read()
          expanded = open('/tmp/expanded.html', encoding='utf-8').read()
          pura = open('/tmp/pura.html', encoding='utf-8').read()
          foxg1 = open('/tmp/foxg1.html', encoding='utf-8').read()
          knowledge = open('/tmp/knowledge.html', encoding='utf-8').read()
          school = open('/tmp/school.html', encoding='utf-8').read()
          aac = open('/tmp/aac.html', encoding='utf-8').read()
          robots = open('/tmp/robots.txt', encoding='utf-8').read()
          ET.parse('/tmp/sitemap-index.xml')

          def visible_words(source):
              source = re.sub(r'<(script|style)\b[^>]*>.*?</\1>', ' ', source, flags=re.I|re.S)
              source = re.sub(r'<[^>]+>', ' ', source)
              return len(re.findall(r'[\u0600-\u06ffA-Za-z0-9]+', source))

          assert deployment['release_commit'] == os.environ['EXPECTED_SHA'], deployment
          assert deployment['build_mode'] == 'institutional-v6-special-needs-wave100-capabilities-seo-complete-site', deployment
          assert gate['status'] == 'passed' and gate['failures'] == {}, gate
          assert seo['status'] == 'passed' and seo['legacy_internal_origin_occurrences'] == 0, seo
          assert v281['status'] == 'passed' and v281['condition_count'] == 50, v281
          assert wave100['status'] == 'passed', wave100
          assert wave100['pages'] == 100 and wave100['topicPages'] == 90 and wave100['hubPages'] == 10, wave100
          assert wave100['minimumVisibleTopicWords'] >= 1200, wave100
          assert wave100['minimumSourceLinks'] >= 2 and wave100['failures'] == [], wave100
          assert final['status'] == 'passed' and final['realIndexableUrls'] >= 3000, final
          assert 'مكتبة روافد للاحتياجات الخاصة' in knowledge, knowledge[:1200]
          assert 'الضيق المدرسي والغياب المرتبط بالمشقة' in school, school[:1600]
          assert 'التواصل المعزز والبديل AAC' in aac, aac[:1600]
          assert visible_words(school) >= 1200, visible_words(school)
          assert visible_words(aac) >= 1200, visible_words(aac)
          assert 'FAQPage' in school and 'Article' in school and 'BreadcrumbList' in school
          assert 'FAQPage' in aac and 'Article' in aac and 'BreadcrumbList' in aac
          assert 'https://healthrenewal.org/special-needs/knowledge/school-distress-neurodivergent-students/' in school
          assert 'https://healthrenewal.org/special-needs/knowledge/aac-complete-arabic-guide/' in aac
          assert '150 حالة' in registry and '100 حالة' not in registry, registry[:2000]
          for page in (registry, expanded, pura, foxg1):
              assert '/pterminology-site/' not in page
              assert 'khaledaltheeb.github.io/pterminology-site' not in page
              assert 'property="og:image"' in page
              assert 'name="twitter:image"' in page
              assert 'summary_large_image' in page
              assert 'BreadcrumbList' in page
          assert 'NBK426063' in pura and 'محتوى تثقيفي' in pura, pura[:2000]
          assert 'NBK604176' in foxg1 and 'محتوى تثقيفي' in foxg1, foxg1[:2000]
          assert len(re.findall(r'[\u0600-\u06ffA-Za-z0-9]+', pura)) >= 1300
          assert len(re.findall(r'[\u0600-\u06ffA-Za-z0-9]+', foxg1)) >= 1300
          assert 'sitemap-capabilities.xml' in robots and 'sitemap-capabilities-v281.xml' in robots, robots
          print({'deployment': deployment, 'gate': gate, 'seo': seo, 'v281': v281, 'wave100': wave100, 'final': final})
          PY
              then
                ready=1
                break
              fi
            fi
            sleep 5
          done
          test "$ready" = 1
