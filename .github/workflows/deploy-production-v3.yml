name: Build complete institutional site v3 and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-production
  cancel-in-progress: false

jobs:
  build:
    name: Restore, validate and assemble full institutional publication
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      build_sha: ${{ steps.source.outputs.build_sha }}

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Bind build to current main head
        id: source
        run: |
          set -euo pipefail
          build_sha="$(git rev-parse HEAD)"
          echo "build_sha=${build_sha}" >> "${GITHUB_OUTPUT}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Locate latest validated production baseline
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=validated-production-site&per_page=100" -o /tmp/baselines.json
          python - <<'PY'
          import json, os
          payload = json.load(open('/tmp/baselines.json', encoding='utf-8'))
          candidates = [item for item in payload.get('artifacts', []) if not item.get('expired') and item.get('workflow_run', {}).get('head_branch') == 'main' and item.get('workflow_run', {}).get('id')]
          if not candidates:
              raise SystemExit('No active validated-production-site artifact from main')
          item = max(candidates, key=lambda x: x.get('created_at', ''))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"run_id={item['workflow_run']['id']}\n")
          print({'baselineRunId': item['workflow_run']['id'], 'createdAt': item.get('created_at')})
          PY

      - name: Download validated baseline
        uses: actions/download-artifact@v4
        with:
          name: validated-production-site
          path: /tmp/validated-baseline
          repository: khaledaltheeb/healthrenewal.org
          run-id: ${{ steps.baseline.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Audit repository, restore all publication families and finalize site
        env:
          BUILD_SHA: ${{ steps.source.outputs.build_sha }}
        run: |
          set -euo pipefail
          test -f /tmp/validated-baseline/index.html
          python -m py_compile scripts/normalize_platform_shell.py scripts/build_clean_site_v1.py scripts/ensure_special_needs_publication_v1.py scripts/publish_scientific_special_needs_library_v1.py scripts/publish_complete_sitemap_v360.py scripts/publish_section_directory_v322.py scripts/publish_capabilities_v280.py scripts/build_conditions_v281_data.py scripts/publish_conditions_v281.py

          # Current main is authoritative. The last validated publication restores only missing historical paths.
          python scripts/build_clean_site_v1.py --root . --site _site --baseline /tmp/validated-baseline

          # Materialize the full capability family before final sitemap discovery.
          python scripts/publish_capabilities_v280.py _site
          python scripts/build_conditions_v281_data.py
          python scripts/publish_conditions_v281.py _site

          # Historical capability publishers still emit an old GitHub Pages first-party URL.
          # Production paths are canonical on healthrenewal.org.
          python - <<'PY'
          from pathlib import Path
          old = 'https://khaledaltheeb.github.io/pterminology-site/'
          new = 'https://healthrenewal.org/'
          changed = 0
          for page in sorted(Path('_site/capabilities').rglob('*.html')):
              source = page.read_text(encoding='utf-8', errors='replace')
              updated = source.replace(old, new)
              if updated != source:
                  page.write_text(updated, encoding='utf-8', newline='\n')
                  changed += 1
          print({'capabilityCanonicalPagesFixed': changed})
          PY

          # Publish evidence-based scientific additions, then normalize every final HTML page.
          python scripts/publish_scientific_special_needs_library_v1.py _site
          python scripts/normalize_platform_shell.py _site --report-path _site/reports/final-platform-normalization.json

          # Refresh the public section directory after all page families exist.
          python scripts/publish_section_directory_v322.py _site

          # Discover the complete final artifact and publish robots/sitemaps.
          python scripts/publish_complete_sitemap_v360.py _site --minimum-urls 3000

          # Finalize homepage from the actual publication inventory, never from a stale manual number.
          python - <<'PY'
          import json, re
          from pathlib import Path
          site = Path('_site')
          sitemap = json.loads((site / 'api/sitemap-completeness-v360.json').read_text(encoding='utf-8'))
          count = int(sitemap['real_indexable_urls'])
          path = site / 'index.html'
          source = path.read_text(encoding='utf-8')
          updated, metric_changes = re.subn(
              r'(<strong\b[^>]*data-surface-page-count[^>]*>).*?(</strong>)',
              rf'\g<1>{count:,}+\g<2>', source, count=1, flags=re.S,
          )
          updated = updated.replace(
              'صفحة قابلة للفهرسة، بينها 2,000+ صفحة موسوعية مستقلة',
              'رابطًا فعليًا قابلًا للفهرسة ضمن خريطة موقع نهائية محدثة آليًا',
          )
          marker = 'data-home-science-v1'
          if marker not in updated:
              card = ('<article class="card" data-home-science-v1><span class="tag">علمي موثق</span>'
                      '<h3 class="item-title">المكتبة العلمية لذوي الاحتياجات الخاصة</h3>'
                      '<p>مراجعات وأدلة تطبيقية تربط الإرشادات المهنية بالمشاركة والتأهيل والتقنية المساعدة والتعليم الدامج.</p>'
                      '<a href="special-needs/science/">فتح المكتبة العلمية</a></article>')
              updated, card_changes = re.subn(
                  r'(<article class="card" data-special-needs-v73>.*?</article>)',
                  r'\1' + card, updated, count=1, flags=re.S,
              )
              if card_changes != 1:
                  raise SystemExit('Homepage special-needs insertion point is missing')
          if metric_changes != 1:
              raise SystemExit('Homepage page-count placeholder is missing')
          path.write_text(updated, encoding='utf-8', newline='\n')
          print({'homepageIndexableCount': count, 'scienceCard': marker in updated})
          PY

          # Validate publication families. Historical redirect aliases remain available but are not indexable pages.
          python - <<'PY'
          import json, re
          from pathlib import Path
          from urllib.parse import urlparse
          from scripts.ensure_special_needs_publication_v1 import (
              BASE_URL, MINIMUM_COUNTS, REQUIRED_ROOTS, TARGET_PREFIXES,
              _read_sitemap_urls, _validate_page, collect_inventory, validate_counts,
          )

          site = Path('_site').resolve()
          inventory = collect_inventory(site)
          count_failures = validate_counts(inventory.counts)
          discovered = sorted({route for routes in inventory.routes.values() for route in routes if route.startswith(TARGET_PREFIXES)})
          noindex_re = re.compile(r'<meta\b(?=[^>]*\bname=["\']robots["\'])[^>]*\bcontent=["\'][^"\']*noindex[^"\']*["\'][^>]*>', re.I | re.S)
          canonical_re = re.compile(r'<link\b(?=[^>]*\brel=["\'][^"\']*canonical[^"\']*["\'])[^>]*\bhref=["\']([^"\']+)["\'][^>]*>', re.I | re.S)
          refresh_re = re.compile(r'<meta\b[^>]*http-equiv=["\']?refresh["\']?[^>]*>', re.I | re.S)
          js_redirect_re = re.compile(r'\b(?:location\.(?:replace|assign)|location\s*=|window\.location)\b', re.I)

          def normalized_route(url: str) -> str:
              path = urlparse(url.strip()).path.strip('/')
              return '/' + path + '/' if path else '/'

          def redirect_alias(page: Path, route: str):
              text = page.read_text(encoding='utf-8', errors='replace')
              if not noindex_re.search(text):
                  return None
              canonicals = [value.strip() for value in canonical_re.findall(text) if value.strip()]
              if len(canonicals) != 1:
                  return None
              target = normalized_route(canonicals[0])
              if target == route or not (refresh_re.search(text) or js_redirect_re.search(text)):
                  return None
              return target

          aliases = {}
          public_routes = []
          page_issues = {}
          for route in discovered:
              page = site / route.strip('/') / 'index.html'
              target = redirect_alias(page, route)
              if target:
                  aliases[route] = target
                  continue
              public_routes.append(route)
              problems = _validate_page(page, route)
              if problems:
                  page_issues[route] = problems

          sitemap_urls = _read_sitemap_urls(site)
          sitemap_missing = [route for route in public_routes if (BASE_URL + route).rstrip('/') + '/' not in sitemap_urls]
          aliases_in_sitemap = [route for route in aliases if (BASE_URL + route).rstrip('/') + '/' in sitemap_urls]
          failures = {
              'count_failures': count_failures,
              'missing_roots': inventory.missing_roots,
              'page_issues': page_issues,
              'sitemap_missing_routes': sitemap_missing,
              'redirect_aliases_in_sitemap': aliases_in_sitemap,
          }
          report = {
              'schemaVersion': 3,
              'status': 'passed' if not any(failures.values()) else 'failed',
              'minimumCounts': MINIMUM_COUNTS,
              'counts': inventory.counts,
              'requiredRoots': list(REQUIRED_ROOTS),
              'missingRoots': inventory.missing_roots,
              'discoveredTargetRouteCount': len(discovered),
              'targetRouteCount': len(public_routes),
              'redirectAliasCount': len(aliases),
              'redirectAliases': aliases,
              'pageIssues': page_issues,
              'sitemapMissingRoutes': sitemap_missing,
              'redirectAliasesInSitemap': aliases_in_sitemap,
              'sitemapUrlCount': len(sitemap_urls),
          }
          api = site / 'api'
          (api / 'special-needs-publication-inventory-v1.json').write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          if report['status'] != 'passed':
              raise SystemExit({'special_needs_publication_inventory_v3': failures})
          print(report)
          PY

          # Cross-check the final artifact against repository, validated baseline, sitemap and homepage.
          python - <<'PY'
          import json, re
          from pathlib import Path
          site = Path('_site')
          baseline = Path('/tmp/validated-baseline')
          clean = json.loads((site / 'api/clean-site-build-v1.json').read_text(encoding='utf-8'))
          sitemap = json.loads((site / 'api/sitemap-completeness-v360.json').read_text(encoding='utf-8'))
          science = json.loads((site / 'api/scientific-special-needs-library-v1.json').read_text(encoding='utf-8'))
          normalization = json.loads((site / 'reports/final-platform-normalization.json').read_text(encoding='utf-8'))
          special = json.loads((site / 'api/special-needs-publication-inventory-v1.json').read_text(encoding='utf-8'))
          homepage = (site / 'index.html').read_text(encoding='utf-8')

          repo_html = sum(1 for p in Path('.').rglob('*.html') if '_site' not in p.parts and '.git' not in p.parts)
          baseline_html = sum(1 for p in baseline.rglob('*.html') if p.is_file())
          final_html = sum(1 for p in site.rglob('*.html') if p.is_file())
          repo_files = sum(1 for p in Path('.').rglob('*') if p.is_file() and '_site' not in p.parts and '.git' not in p.parts)
          baseline_files = sum(1 for p in baseline.rglob('*') if p.is_file())
          final_files = sum(1 for p in site.rglob('*') if p.is_file())
          metric = re.search(r'data-surface-page-count[^>]*>([^<]+)', homepage)

          assert clean['status'] == 'passed', clean
          assert normalization['status'] == 'passed', normalization
          assert baseline_html >= 3000, {'baselineHtml': baseline_html}
          assert final_html >= baseline_html, {'finalHtml': final_html, 'baselineHtml': baseline_html}
          assert sitemap['status'] == 'passed' and sitemap['real_indexable_urls'] >= 3000, sitemap
          assert science['status'] == 'passed' and science['topicPages'] >= 12, science
          assert special['status'] == 'passed', special
          assert special['counts']['capability_pages'] >= 155, special
          assert special['counts']['capability_condition_pages'] >= 150, special
          assert not special['pageIssues'] and not special['sitemapMissingRoutes'], special
          assert (site / 'capabilities/expanded/index.html').is_file()
          assert (site / 'special-needs/science/index.html').is_file()
          assert (site / 'sitemap.xml').is_file() and (site / 'sitemap-index.xml').is_file() and (site / 'robots.txt').is_file()
          assert 'data-home-science-v1' in homepage
          assert metric and metric.group(1) == f"{sitemap['real_indexable_urls']:,}+", {'metric': metric.group(1) if metric else None, 'sitemap': sitemap['real_indexable_urls']}
          assert 'khaledaltheeb.github.io/pterminology-site' not in (site / 'capabilities/adnp-syndrome/index.html').read_text(encoding='utf-8')

          audit = {
              'schemaVersion': 4,
              'status': 'passed',
              'policy': 'repository-authoritative; validated production restores missing paths only; generated publication families materialized before final discovery; intentional redirect aliases preserved but excluded from indexing',
              'repository': {'files': repo_files, 'htmlPages': repo_html},
              'validatedBaseline': {'files': baseline_files, 'htmlPages': baseline_html},
              'finalPublication': {'files': final_files, 'htmlPages': final_html, 'indexableUrls': sitemap['real_indexable_urls']},
              'recovery': {'missingFilesRestored': clean.get('baselineMissingFilesRestored', 0), 'generatedMixBlocksRemoved': clean.get('generatedMixBlocksRemoved', 0), 'pagesPolished': clean.get('pagesPolished', 0)},
              'expansion': {'scientificTopicPages': science['topicPages']},
              'specialNeedsCounts': special['counts'],
              'redirectAliasesPreserved': special['redirectAliasCount'],
              'homepage': {'indexableMetric': metric.group(1), 'scientificLibraryLinked': True},
              'platformNormalization': normalization['counts'],
          }
          api = site / 'api'
          (api / 'repository-production-audit-v2.json').write_text(json.dumps(audit, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          (api / 'final-production-inventory-v1.json').write_text(json.dumps({'schemaVersion':4,'status':'passed','finalHtmlPages':final_html,'realIndexableUrls':sitemap['real_indexable_urls'],'scienceTopicPages':science['topicPages'],'specialNeedsCounts':special['counts'],'redirectAliasesPreserved':special['redirectAliasCount'],'homepageIndexableMetric':metric.group(1),'platformNormalization':normalization['counts']}, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(audit)
          PY

          cat > _site/deployment.json <<EOF
          {
            "schemaVersion": 9,
            "release_commit": "${BUILD_SHA}",
            "build_mode": "institutional-v3-complete-publication-recovery-capabilities-science-homepage-final-sitemap"
          }
          EOF
          touch _site/.nojekyll

      - name: Preserve validated institutional site
        uses: actions/upload-artifact@v4
        with:
          name: validated-production-site
          path: _site
          include-hidden-files: true
          retention-days: 90
          compression-level: 6

      - uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy complete institutional site v3
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify exact production release live
        env:
          EXPECTED_SHA: ${{ needs.build.outputs.build_sha }}
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 60); do
            nonce="${GITHUB_RUN_ID}-${attempt}-$(date +%s)"
            if curl -fsSL --retry 2 -H 'Cache-Control: no-cache' "https://healthrenewal.org/deployment.json?release=${nonce}" -o /tmp/deployment.json \
              && curl -fsSL --retry 2 -H 'Cache-Control: no-cache' "https://healthrenewal.org/api/repository-production-audit-v2.json?release=${nonce}" -o /tmp/audit.json \
              && curl -fsSL --retry 2 -H 'Cache-Control: no-cache' "https://healthrenewal.org/api/final-production-inventory-v1.json?release=${nonce}" -o /tmp/final.json \
              && curl -fsSL --retry 2 -H 'Cache-Control: no-cache' "https://healthrenewal.org/?release=${nonce}" -o /tmp/home.html \
              && curl -fsSL --retry 2 -H 'Cache-Control: no-cache' "https://healthrenewal.org/capabilities/adnp-syndrome/?release=${nonce}" -o /tmp/capability.html \
              && curl -fsSL --retry 2 -H 'Cache-Control: no-cache' "https://healthrenewal.org/special-needs/science/cerebral-palsy-hip-surveillance/?release=${nonce}" -o /tmp/science-page.html \
              && curl -fsSL --retry 2 -H 'Cache-Control: no-cache' "https://healthrenewal.org/sitemap-index.xml?release=${nonce}" -o /tmp/sitemap-index.xml; then
              if python - <<'PY'
          import json, os
          from xml.etree import ElementTree as ET
          deployment = json.load(open('/tmp/deployment.json', encoding='utf-8'))
          audit = json.load(open('/tmp/audit.json', encoding='utf-8'))
          final = json.load(open('/tmp/final.json', encoding='utf-8'))
          home = open('/tmp/home.html', encoding='utf-8').read()
          capability = open('/tmp/capability.html', encoding='utf-8').read()
          science_page = open('/tmp/science-page.html', encoding='utf-8').read()
          ET.parse('/tmp/sitemap-index.xml')
          assert deployment['release_commit'] == os.environ['EXPECTED_SHA'], deployment
          assert deployment['build_mode'] == 'institutional-v3-complete-publication-recovery-capabilities-science-homepage-final-sitemap', deployment
          assert audit['status'] == 'passed', audit
          assert audit['finalPublication']['htmlPages'] >= audit['validatedBaseline']['htmlPages'], audit
          assert audit['finalPublication']['indexableUrls'] >= 3000, audit
          assert final['status'] == 'passed' and final['finalHtmlPages'] >= 3000, final
          assert final['specialNeedsCounts']['capability_pages'] >= 155, final
          assert final['specialNeedsCounts']['capability_condition_pages'] >= 150, final
          assert 'data-home-science-v1' in home and 'المكتبة العلمية لذوي الاحتياجات الخاصة' in home
          assert 'https://healthrenewal.org/capabilities/adnp-syndrome/' in capability
          assert 'khaledaltheeb.github.io/pterminology-site' not in capability
          assert 'مراقبة الورك في الشلل الدماغي' in science_page
          print({'deployment': deployment, 'audit': audit, 'final': final})
          PY
              then
                ready=1
                break
              fi
            fi
            sleep 5
          done
          test "$ready" = 1
