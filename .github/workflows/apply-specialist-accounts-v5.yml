name: Apply specialist accounts v5 patch

on:
  push:
    branches: ["agent/specialist-accounts-cloudflare-v5"]
    paths:
      - "tools/apply_specialist_accounts_v5_patch.py"
      - "tools/specialist_accounts_v5_payload.*"
      - ".github/workflows/apply-specialist-accounts-v5.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "tools/apply_specialist_accounts_v5_patch.py"
      - "tools/specialist_accounts_v5_payload.*"
      - ".github/workflows/apply-specialist-accounts-v5.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-specialist-accounts-v5
  cancel-in-progress: false

jobs:
  apply:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/specialist-accounts-cloudflare-v5
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify reviewed payload
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import glob
          import hashlib
          payload = ''.join(open(path, encoding='ascii').read().strip() for path in sorted(glob.glob('tools/specialist_accounts_v5_payload.*')))
          assert hashlib.sha256(payload.encode('ascii')).hexdigest() == '608082c14dd94c5e5e1a0433bf7258d3a986c4f38971469bd3c38b92bcc7eed1'
          archive = base64.b64decode(payload, validate=True)
          assert hashlib.sha256(archive).hexdigest() == '220477921fe6e4195d8fd3f24911ff116174959526d2257415e35e9a60f9d466'
          print('Reviewed payload checksums verified.')
          PY

      - name: Materialize reviewed patch
        run: python tools/apply_specialist_accounts_v5_patch.py

      - name: Validate generated implementation
        run: |
          set -euo pipefail
          node --check specialists-partners/account-backend/src/index.js
          node --check specialists-partners/account/account.js
          python -m unittest -v tests.test_specialist_accounts_v5

      - name: Commit generated implementation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: add Cloudflare specialist accounts v5"
          git push origin HEAD:agent/specialist-accounts-cloudflare-v5
