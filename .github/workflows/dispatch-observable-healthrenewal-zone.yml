name: Dispatch observable healthrenewal zone bootstrap

on:
  push:
    branches: [main]
    paths:
      - ".github/domain-bootstrap-trigger"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dispatch observable bootstrap
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run "bootstrap-healthrenewal-cloudflare-zone-v2.yml" \
            --repo "$GITHUB_REPOSITORY" \
            --ref main
