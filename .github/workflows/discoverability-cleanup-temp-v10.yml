name: One-time discoverability cleanup

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  cleanup:
    if: github.event.issue.title == '[cleanup] discoverability temporary assets v10'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove temporary diagnostics and obsolete static repair
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/discoverability-cards-repair-temp-v1.yml \
            .github/workflows/discoverability-repair-runner-temp-v2.yml \
            .github/workflows/discoverability-repair-push-temp-v3.yml \
            .github/workflows/discoverability-live-release-temp-v4.yml \
            .github/workflows/discoverability-diagnostic-temp-v5.yml \
            .github/workflows/discoverability-combined-release-temp-v6.yml \
            .github/workflows/combined-release-diagnostic-temp-v7.yml \
            .github/workflows/discoverability-union-release-temp-v8.yml \
            .github/workflows/inspect-union-release-temp-v9.yml \
            .github/workflows/discoverability-cleanup-temp-v10.yml \
            .github/discoverability-repair-trigger.txt \
            scripts/repair_discoverability_cards_v1.py \
            tests/test_user_discoverability_cards_v1.py

          test -f assets/platform/discoverability-cards.js
          test -f tests/test_discoverability_cards_loader_v1.py
          node --check assets/platform/platform-core.js
          node --check assets/platform/discoverability-cards.js
          python - <<'PY'
          from pathlib import Path
          shell=Path('assets/platform/platform-core.js').read_text(encoding='utf-8')
          cards=Path('assets/platform/discoverability-cards.js').read_text(encoding='utf-8')
          test=Path('tests/test_discoverability_cards_loader_v1.py').read_text(encoding='utf-8')
          assert 'discoverability-cards.js?v=1.0.0' in shell
          assert "section.dataset.ptDiscoverabilityCards = 'v1'" in cards
          assert len({
            '/family-guide/','/ai-search/','/contact/','/source-registry/','/team-and-partners/','/accessibility/',
            '/learning-paths/opportunities/','/provider-assessment-demo/training/',
            '/provider-assessment-demo/professional-console.html','/special-needs/assistive-technology/',
            '/special-needs/conditions/prader-willi-syndrome/',
            '/special-needs/assistive-technology/selection-checklist/',
            '/special-needs/assistive-technology/training/',
            '/special-needs/assistive-technology/ethics-and-service/',
            '/special-needs/assistive-technology/innovation-review/',
            '/special-needs/assistive-technology/continuing-education/'
          }) == 16
          assert 'TARGETS' in test
          print({'kept_runtime':'assets/platform/discoverability-cards.js','kept_test':'tests/test_discoverability_cards_loader_v1.py'})
          PY

      - name: Commit cleanup
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: remove temporary discoverability workflows'
          for attempt in $(seq 1 8); do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1

      - name: Report and close task issues
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_ISSUE: ${{ github.event.issue.number }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python - <<'PY' >/tmp/body.json
          import json,os
          ok=os.environ.get('JOB_STATUS')=='success'
          body='## تنظيف أدوات المهمة\n\nالحالة: **'+('passed' if ok else 'failed')+'**\n\n'
          if ok:
            body+='- أزيلت مسارات النشر والتشخيص المؤقتة.\n'
            body+='- أزيل سكربت الإصلاح الثابت غير المستخدم.\n'
            body+='- بقي ملف البطاقات الفعلي واختبار الانحدار الدائم.\n'
          else:
            body+='- لم تكتمل عملية التنظيف أو الدفع.\n'
          print(json.dumps({'body':body},ensure_ascii=False))
          PY
          curl -fsSL -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${CURRENT_ISSUE}/comments" --data-binary @/tmp/body.json
          if [ "${JOB_STATUS}" = success ]; then
            for issue in 826 828 829 832 834 836 838 839 841 842 844 "${CURRENT_ISSUE}"; do
              curl -fsSL -X PATCH -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${issue}" --data '{"state":"closed","state_reason":"completed"}' >/dev/null || true
            done
          fi
