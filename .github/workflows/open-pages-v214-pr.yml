name: Open Pages v214 PR

on:
  push:
    branches: ["fix/pages-deployment-starvation-v214"]
    paths: [".github/workflows/open-pages-v214-pr.yml"]

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Create draft PR v2
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner, repo=context.repo.repo;
            const branch='fix/pages-deployment-starvation-v214';
            const existing=await github.rest.pulls.list({owner,repo,state:'open',head:`${owner}:${branch}`,base:'main'});
            if(existing.data.length){core.notice(`Existing PR #${existing.data[0].number}`);return;}
            const body='يحذف ناشر Pages القديم ذي عقد 48 أداة، ويمنع تجويع النشر عبر السماح بأحدث حزمة ناجحة تكون سلفًا لـ main مع منع الرجوع خلف النسخة الحية. يحافظ على بصمات SHA-256 ويتحقق قبل النشر وبعده من ستروب وlab-v12.js?v=213 ولوحة الألوان الستة.';
            const result=await github.rest.pulls.create({owner,repo,title:'منع تجويع نشر GitHub Pages وتوحيد الناشر v214',head:branch,base:'main',body,draft:true,maintainer_can_modify:true});
            core.notice(`Created PR #${result.data.number}`);
