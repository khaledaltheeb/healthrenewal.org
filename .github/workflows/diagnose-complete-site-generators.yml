name: Diagnose complete-site generators

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  actions: read
  contents: read

concurrency:
  group: diagnose-complete-site-generators
  cancel-in-progress: false

jobs:
  diagnose:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'automation/deploy-addiction-v3-live'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Locate latest complete validated artifact
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=validated-production-site&per_page=100" \
            -o /tmp/artifacts.json
          python - <<'PY'
          import json
          import os
          payload = json.load(open('/tmp/artifacts.json', encoding='utf-8'))
          candidates = [
              item for item in payload.get('artifacts', [])
              if not item.get('expired')
              and item.get('workflow_run', {}).get('id')
              and item.get('workflow_run', {}).get('head_branch') == 'main'
          ]
          if not candidates:
              raise SystemExit('No active validated-production-site artifact from main')
          item = max(candidates, key=lambda value: value.get('created_at', ''))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"run_id={item['workflow_run']['id']}\n")
          print({'artifact_id': item['id'], 'run_id': item['workflow_run']['id'], 'created_at': item.get('created_at')})
          PY

      - name: Restore complete validated baseline
        uses: actions/download-artifact@v4
        with:
          name: validated-production-site
          path: _site
          repository: khaledaltheeb/healthrenewal.org
          run-id: ${{ steps.baseline.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Overlay current public source
        run: |
          set -euo pipefail
          python - <<'PY'
          import shutil
          from pathlib import Path
          root = Path('.')
          site = Path('_site')
          text_suffixes = {'.html', '.htm', '.xml', '.json', '.webmanifest', '.txt', '.js', '.mjs', '.css', '.svg'}
          skip_top = {'.git', '.github', 'node_modules', '.venv', 'venv', 'dist', 'build', 'scripts', 'tests', 'docs', 'reports', 'content', '.v10bundle', '.generator-v6', '_site'}
          skip_parts = {'account-backend', 'backend', 'migrations'}
          copied = 0
          for source in root.rglob('*'):
              if not source.is_file():
                  continue
              relative = source.relative_to(root)
              if not relative.parts or relative.parts[0] in skip_top:
                  continue
              if any(part in skip_parts for part in relative.parts):
                  continue
              if relative.as_posix() == 'deployment.json':
                  continue
              if source.suffix.lower() not in text_suffixes and source.name != 'CNAME':
                  continue
              destination = site / relative
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, destination)
              copied += 1
          print({'current_public_files_overlaid': copied})
          if copied < 100:
              raise SystemExit({'public_overlay_too_small': copied})
          PY

      - name: Generator 1 — encyclopedia
        run: python scripts/run_encyclopedia_v13.py _site

      - name: Generator 2 — daily tools
        run: python scripts/publish_daily_tools_v24.py _site

      - name: Generator 3 — comparisons
        run: python scripts/repair_comparisons_v331.py _site

      - name: Generator 4 — evidence literacy library
        run: python scripts/publish_evidence_literacy_library_v322.py _site

      - name: Generator 5 — sitemap index
        run: python scripts/generate_sitemap_index_v304.py _site
