name: Temporary user discoverability and section-card audit

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  audit:
    if: github.event.issue.title == '[diagnostic] user discoverability audit 2026-08-01'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Audit every public page and section-card path
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re
          from collections import Counter, defaultdict, deque
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urljoin, urlsplit
          from urllib.request import Request, urlopen

          ROOT = Path('.')
          BASE = 'https://healthrenewal.org'
          SKIP_TOP = {'.git','.github','node_modules','.venv','venv','dist','build','scripts','tests','docs','reports','content','.v10bundle','.generator-v6','_site'}
          SKIP_PARTS = {'account-backend','backend','migrations'}
          VOID = {'area','base','br','col','embed','hr','img','input','link','meta','param','source','track','wbr'}
          CARD_TOKENS = ('card','tile','feature','entry','item','panel','module','resource','topic','condition','guide')

          def public_html(path: Path) -> bool:
              rel = path.relative_to(ROOT)
              if not rel.parts or rel.parts[0] in SKIP_TOP: return False
              if any(part in SKIP_PARTS for part in rel.parts): return False
              return path.suffix.lower() in {'.html','.htm'}

          def route_for(path: Path) -> str:
              rel = path.relative_to(ROOT).as_posix()
              if rel == 'index.html': return '/'
              if rel.endswith('/index.html'): return '/' + rel[:-10]
              return '/' + rel

          class LinkParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.stack = []
                  self.links = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == 'a' and attrs.get('href'):
                      context = list(self.stack)
                      context.append((tag, attrs.get('class',''), attrs.get('id','')))
                      card = any(
                          t in {'article','li'} or any(tok in (cls or '').lower() for tok in CARD_TOKENS)
                          for t, cls, _ in context
                      )
                      self.links.append((attrs['href'].strip(), card))
                  if tag not in VOID:
                      self.stack.append((tag, attrs.get('class',''), attrs.get('id','')))
              def handle_startendtag(self, tag, attrs):
                  self.handle_starttag(tag, attrs)
                  if tag not in VOID and self.stack: self.stack.pop()
              def handle_endtag(self, tag):
                  for i in range(len(self.stack)-1, -1, -1):
                      if self.stack[i][0] == tag:
                          del self.stack[i:]
                          break

          files = sorted(p for p in ROOT.rglob('*') if p.is_file() and public_html(p))
          pages = {}
          for path in files:
              text = path.read_text(encoding='utf-8', errors='replace')
              route = route_for(path)
              robots_matches = re.findall(r'<meta[^>]+name=["\']robots["\'][^>]+content=["\']([^"\']+)', text, flags=re.I)
              noindex = any('noindex' in x.lower() for x in robots_matches)
              canonical_match = re.search(r'<link[^>]+rel=["\']canonical["\'][^>]+href=["\']([^"\']+)', text, flags=re.I)
              canonical = canonical_match.group(1).strip() if canonical_match else None
              title_match = re.search(r'<title>(.*?)</title>', text, flags=re.I|re.S)
              title = re.sub(r'\s+',' ', title_match.group(1)).strip() if title_match else path.stem
              technical = bool(re.fullmatch(r'google[a-zA-Z0-9_-]+\.html', path.name))
              error = path.name == '404.html'
              external_canonical = bool(canonical and urlsplit(canonical).netloc not in {'','healthrenewal.org'})
              indexable = not (noindex or technical or error or external_canonical)
              parser = LinkParser(); parser.feed(text)
              pages[route] = {
                  'path': path.relative_to(ROOT).as_posix(), 'route': route, 'title': title,
                  'noindex': noindex, 'technical': technical, 'error': error,
                  'canonical': canonical, 'indexable': indexable,
                  'shell': 'platform-core.js' in text,
                  'raw_links': parser.links,
              }

          route_aliases = {}
          for route in pages:
              route_aliases[route] = route
              if route.endswith('/') and route != '/':
                  route_aliases[route.rstrip('/')] = route
                  route_aliases[route + 'index.html'] = route

          def normalize(source_route, href):
              if not href or href.startswith(('#','mailto:','tel:','javascript:','data:')): return None
              absolute = urljoin(BASE + source_route, href)
              parsed = urlsplit(absolute)
              if parsed.netloc not in {'healthrenewal.org','www.healthrenewal.org'}: return None
              path = re.sub(r'/+','/',parsed.path or '/')
              if path.endswith('/index.html'): path = path[:-10]
              if not path.startswith('/'): path = '/' + path
              candidates = [path]
              if path != '/':
                  candidates.extend([path.rstrip('/'), path.rstrip('/') + '/'])
              for candidate in candidates:
                  if candidate in route_aliases: return route_aliases[candidate]
              return None

          edges = defaultdict(set)
          card_edges = defaultdict(set)
          for source, meta in pages.items():
              for href, is_card in meta['raw_links']:
                  target = normalize(source, href)
                  if target and target != source:
                      edges[source].add(target)
                      if is_card: card_edges[source].add(target)

          # Global shell navigation/footer are visible on every page using the shared shell.
          shell_path = ROOT/'assets/platform/platform-core.js'
          shell_targets = set()
          if shell_path.is_file():
              shell_text = shell_path.read_text(encoding='utf-8', errors='replace')
              for candidate in re.findall(r"url\('([^']+)'\)", shell_text):
                  target = normalize('/', '/' + candidate.lstrip('/'))
                  if target: shell_targets.add(target)
          for source, meta in pages.items():
              if meta['shell']:
                  edges[source].update(t for t in shell_targets if t != source)

          indexable = {r for r,m in pages.items() if m['indexable']}
          inbound = Counter()
          card_inbound = Counter()
          inbound_sources = defaultdict(list)
          card_sources = defaultdict(list)
          for source, targets in edges.items():
              for target in targets:
                  if source != target:
                      inbound[target] += 1
                      inbound_sources[target].append(source)
          for source, targets in card_edges.items():
              for target in targets:
                  if source != target:
                      card_inbound[target] += 1
                      card_sources[target].append(source)

          roots = [r for r in ('/','/sections/','/start-here/') if r in pages]
          reachable = set(roots)
          queue = deque(roots)
          while queue:
              source = queue.popleft()
              for target in edges.get(source, ()):
                  if target in indexable and target not in reachable:
                      reachable.add(target); queue.append(target)

          def nearest_hub(route):
              if route == '/': return None
              if route.count('/') <= 1:
                  return '/sections/' if '/sections/' in pages else '/'
              parts = route.strip('/').split('/')
              if not route.endswith('/') and '.' in parts[-1]: parts = parts[:-1]
              for cut in range(len(parts)-1, 0, -1):
                  candidate = '/' + '/'.join(parts[:cut]) + '/'
                  if candidate in pages and candidate != route:
                      return candidate
              return '/sections/' if '/sections/' in pages else '/'

          rows = []
          for route in sorted(indexable):
              hub = nearest_hub(route)
              direct_hub = bool(hub and route in edges.get(hub,set()))
              card_hub = bool(hub and route in card_edges.get(hub,set()))
              rows.append({
                  'route': route, 'path': pages[route]['path'], 'title': pages[route]['title'],
                  'inbound': inbound[route], 'card_inbound': card_inbound[route],
                  'reachable': route in reachable, 'nearest_hub': hub,
                  'hub_links_directly': direct_hub, 'hub_has_card': card_hub,
                  'inbound_sources': sorted(set(inbound_sources[route]))[:12],
                  'card_sources': sorted(set(card_sources[route]))[:12],
              })

          orphans = [x for x in rows if x['route'] != '/' and x['inbound'] == 0]
          unreachable = [x for x in rows if x['route'] not in reachable]
          missing_hub_link = [x for x in rows if x['nearest_hub'] and not x['hub_links_directly']]
          missing_hub_card = [x for x in rows if x['nearest_hub'] and not x['hub_has_card']]
          no_card_anywhere = [x for x in rows if x['route'] != '/' and x['card_inbound'] == 0]

          # Verify that every audited page is live; this distinguishes hidden from unpublished.
          live_failures = []
          for row in rows:
              try:
                  req = Request(BASE + row['route'] + ('&' if '?' in row['route'] else '?') + 'discoverability_audit=1', headers={'User-Agent':'HealthRenewalDiscoverabilityAudit/1.0','Cache-Control':'no-cache'})
                  with urlopen(req, timeout=20) as response:
                      if response.status != 200: live_failures.append({'route':row['route'],'status':response.status})
              except Exception as exc:
                  live_failures.append({'route':row['route'],'error':str(exc)[:180]})

          report = {
              'status': 'passed' if not orphans and not unreachable and not live_failures else 'attention_required',
              'main_sha': os.environ.get('GITHUB_SHA'),
              'public_html_files': len(files), 'indexable_pages': len(indexable),
              'root_entry_points': roots, 'shell_targets': sorted(shell_targets),
              'orphan_pages': orphans, 'unreachable_pages': unreachable,
              'pages_without_direct_section_hub_link': missing_hub_link,
              'pages_without_section_hub_card': missing_hub_card,
              'pages_without_any_card_link': no_card_anywhere,
              'live_failures': live_failures,
          }
          Path('/tmp/discoverability-report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          def lines(items, limit=80):
              if not items: return ['- لا يوجد.']
              out=[]
              for item in items[:limit]:
                  out.append(f"- `{item['route']}` — {item['title']} — hub: `{item.get('nearest_hub')}` — inbound: {item.get('inbound',0)} — card links: {item.get('card_inbound',0)}")
              if len(items)>limit: out.append(f"- … و{len(items)-limit} صفحة إضافية في التقرير الكامل.")
              return out

          body = [
              '## تدقيق ظهور الصفحات للمستخدم', '',
              f"الحالة: **{report['status']}**", '',
              f"- ملفات HTML العامة: **{len(files)}**",
              f"- الصفحات القابلة للفهرسة: **{len(indexable)}**",
              f"- صفحات يتيمة بلا أي رابط داخلي: **{len(orphans)}**",
              f"- صفحات غير قابلة للوصول من الرئيسية/دليل الأقسام: **{len(unreachable)}**",
              f"- صفحات لا يربطها فهرس قسمها المباشر: **{len(missing_hub_link)}**",
              f"- صفحات بلا بطاقة في فهرس قسمها: **{len(missing_hub_card)}**",
              f"- صفحات بلا أي رابط ضمن بطاقة في الموقع: **{len(no_card_anywhere)}**",
              f"- إخفاقات النشر الحي: **{len(live_failures)}**", '',
              '### الصفحات اليتيمة', *lines(orphans), '',
              '### غير القابلة للوصول من واجهات البداية', *lines(unreachable), '',
              '### بلا رابط مباشر من فهرس القسم الأقرب', *lines(missing_hub_link), '',
              '### بلا بطاقة في فهرس القسم الأقرب', *lines(missing_hub_card), '',
              '### بلا أي بطاقة تعريفية في الموقع', *lines(no_card_anywhere),
          ]
          payload=json.dumps({'body':'\n'.join(body)},ensure_ascii=False).encode('utf-8')
          req=Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/{os.environ['ISSUE_NUMBER']}/comments",
              data=payload, method='POST',
              headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'}
          )
          with urlopen(req, timeout=30) as response:
              print(response.status)
          print(json.dumps({k:(len(v) if isinstance(v,list) else v) for k,v in report.items() if k not in {'shell_targets','root_entry_points'}},ensure_ascii=False,indent=2))
          PY