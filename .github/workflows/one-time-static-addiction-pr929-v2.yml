name: One-time static addiction PR 929 v2

on:
  pull_request_target:
    types: [synchronize]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: one-time-static-addiction-pr929-v2
  cancel-in-progress: false

jobs:
  publish-static-files:
    if: >-
      github.event.pull_request.number == 929 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/addiction-condition-guides-v2-20260803'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Materialize reviewed guides into ordinary files
        run: |
          set -euxo pipefail
          python scripts/materialize_addiction_condition_guides_v2.py .
          test -f addiction/cannabis-use-disorder/index.html
          test -f addiction/nicotine-tobacco-dependence/index.html
          test -f addiction/sedative-benzodiazepine-use-disorder/index.html
          test -f addiction/gambling-related-harms/index.html
          test -f addiction/gaming-disorder/index.html
          test -f addiction/inhalant-use-disorder/index.html
          test -f addiction/polysubstance-use-and-overdose-risk/index.html
          test -f addiction/editorial-manifest.json
          test -f api/addiction-condition-guides-v2.json
      - name: Replace generator test with static publication contract
        run: |
          cat > tests/test_addiction_condition_guides_v2.py <<'PY'
          from __future__ import annotations

          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          BASE_URL = "https://healthrenewal.org/"
          NS = {"s": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          SLUGS = (
              "alcohol-use-disorder",
              "opioid-use-disorder",
              "stimulant-use-disorder",
              "cannabis-use-disorder",
              "nicotine-tobacco-dependence",
              "sedative-benzodiazepine-use-disorder",
              "gambling-related-harms",
              "gaming-disorder",
              "inhalant-use-disorder",
              "polysubstance-use-and-overdose-risk",
          )
          REQUIRED = (
              '<html lang="ar" dir="rtl">',
              "<title>",
              'name="description"',
              'rel="canonical"',
              "<h1",
              'type="application/ld+json"',
          )
          BANNED = ("جرعة:", " ملغ", " mg ", "خفض الجرعة بنسبة", "تناول حبة")


          def test_condition_guides_are_static_complete_and_safe() -> None:
              manifest = json.loads(
                  (ROOT / "addiction" / "editorial-manifest.json").read_text(
                      encoding="utf-8"
                  )
              )
              pages = manifest.get("condition_pages", [])
              assert manifest.get("version") == "2.0.0"
              assert manifest.get("integration", {}).get("extends_existing_center") is True
              assert len(pages) == 10
              assert sum(int(item.get("protocol_count", 0)) for item in pages) == 100

              combined: list[str] = []
              for slug in SLUGS:
                  path = ROOT / "addiction" / slug / "index.html"
                  assert path.is_file(), slug
                  text = path.read_text(encoding="utf-8")
                  assert all(marker in text for marker in REQUIRED), slug
                  assert text.count('class="protocol"') == 10, slug
                  assert "الطوارئ" in text, slug
                  assert "/addiction/sources/" in text, slug
                  assert "/addiction/evidence-library/" not in text, slug
                  assert "/addiction/recovery-plan/" not in text, slug
                  combined.append(text)

              joined = "\n".join(combined)
              assert not [fragment for fragment in BANNED if fragment in joined]

              report = json.loads(
                  (ROOT / "api" / "addiction-condition-guides-v2.json").read_text(
                      encoding="utf-8"
                  )
              )
              assert report["status"] == "passed"
              assert report["centerPages"] >= 18
              assert report["conditionPages"] == 10
              assert report["detailedProtocols"] == 100
              assert report["sourceRegistryEntries"] >= 50
              assert report["safety"]["noIndividualDosing"] is True
              assert report["safety"]["noHomeDetoxPlan"] is True

              assert not list((ROOT / "content" / "addiction").glob("*.b64"))
              assert not (ROOT / "scripts" / "materialize_addiction_condition_guides_v2.py").exists()


          def test_condition_guides_are_linked_and_discoverable() -> None:
              conditions = (ROOT / "addiction" / "conditions" / "index.html").read_text(
                  encoding="utf-8"
              )
              hub = (ROOT / "addiction" / "index.html").read_text(encoding="utf-8")
              for slug in SLUGS:
                  assert f"/addiction/{slug}/" in conditions
              assert "/addiction/conditions/" in hub
              assert "/addiction/methodology/" in hub

              addiction = ET.parse(ROOT / "sitemap-addiction.xml").getroot()
              urls = [node.text for node in addiction.findall("s:url/s:loc", NS)]
              assert len(urls) == len(set(urls))
              assert len(urls) >= 18
              for slug in SLUGS:
                  assert f"{BASE_URL}addiction/{slug}/" in urls
              assert f"{BASE_URL}addiction/conditions/" in urls
              assert f"{BASE_URL}addiction/methodology/" in urls

              index = ET.parse(ROOT / "sitemap-index.xml").getroot()
              sitemap_urls = {
                  node.text for node in index.findall("s:sitemap/s:loc", NS)
              }
              assert f"{BASE_URL}sitemap-addiction.xml" in sitemap_urls
          PY
      - name: Remove opaque inputs and restore canonical sitemap engine
        run: |
          set -euxo pipefail
          git fetch origin main
          git checkout origin/main -- scripts/generate_sitemap_index_v304.py
          rm -f content/addiction/condition-guides-v2.part00.b64
          rm -f content/addiction/condition-guides-v2.part01.b64
          rm -f scripts/materialize_addiction_condition_guides_v2.py
          rm -f .github/workflows/materialize-addiction-condition-guides-v2.yml
          rmdir content/addiction 2>/dev/null || true
      - name: Execute static safety and discovery tests
        run: |
          set -euxo pipefail
          python -m py_compile tests/test_addiction_condition_guides_v2.py
          python - <<'PY'
          import runpy
          namespace = runpy.run_path('tests/test_addiction_condition_guides_v2.py')
          tests = [
              value
              for name, value in sorted(namespace.items())
              if name.startswith('test_') and callable(value)
          ]
          assert len(tests) == 2, len(tests)
          for test in tests:
              test()
              print(f'PASS {test.__name__}')
          PY
          test ! -e content/addiction/condition-guides-v2.part00.b64
          test ! -e content/addiction/condition-guides-v2.part01.b64
          test ! -e scripts/materialize_addiction_condition_guides_v2.py
      - name: Commit clean static publication to the PR branch
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euxo pipefail
          git config user.name "healthrenewal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "content(addiction): publish ten static condition guides"
          git push origin HEAD:"${HEAD_BRANCH}"
      - name: Remove one-time workflow from main
        if: always()
        run: |
          set -euxo pipefail
          git fetch origin main
          git checkout -B main origin/main
          if [ -f .github/workflows/one-time-static-addiction-pr929-v2.yml ]; then
            git rm .github/workflows/one-time-static-addiction-pr929-v2.yml
            git config user.name "healthrenewal-bot"
            git config user.email "actions@users.noreply.github.com"
            git commit -m "ci(addiction): remove one-time static gate v2"
            git push origin main
          fi
