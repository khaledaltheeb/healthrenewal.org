name: Materialize family guide phase four v338

on:
  push:
    branches: ["agent/family-guide-phase4-v338"]
    paths:
      - ".github/workflows/materialize-family-guide-phase4-v338.yml"
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/materialize-family-guide-phase4-v338.yml"
      - "family-guide/**"
      - "api/family-guide-v1.json"
      - "sitemap-family-guide.xml"
      - "tests/test_family_guide_v335.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/family-guide-phase4-v338
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild 32-condition inventory
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re
          from xml.sax.saxutils import escape

          root = Path('.')
          review_date = '2026-07-30'
          version = '1.3.0'
          new_slugs = [
              'spinal-muscular-atrophy',
              'tuberous-sclerosis-complex',
              '22q11-2-deletion-syndrome',
              'charge-syndrome',
              'smith-magenis-syndrome',
              'cri-du-chat-syndrome',
              'joubert-syndrome',
              '16p11-2-deletion-syndrome',
          ]

          api_path = root / 'api/family-guide-v1.json'
          current_api = json.loads(api_path.read_text(encoding='utf-8'))
          old_slugs = [item['slug'] for item in current_api['conditions']]
          order = old_slugs + [slug for slug in new_slugs if slug not in old_slugs]
          assert len(order) == 32, (len(order), order)
          assert len(order) == len(set(order))

          objects = {}
          pattern = re.compile(r'\}\)\((\{.*\})\);\s*$', re.S)
          for slug in order:
              path = root / 'family-guide/conditions' / slug / 'data.js'
              assert path.is_file(), path
              match = pattern.search(path.read_text(encoding='utf-8'))
              assert match, slug
              obj = json.loads(match.group(1))
              assert obj['slug'] == slug
              objects[slug] = obj

          family_data_path = root / 'family-guide/family-guide-data.js'
          existing_text = family_data_path.read_text(encoding='utf-8').strip()
          existing = json.loads(existing_text.split('=', 1)[1].rstrip(';'))
          family_payload = {
              'version': version,
              'reviewed_at': review_date,
              'methodology': existing['methodology'],
              'conditions': [
                  {key: objects[slug][key] for key in ['slug','title','en','classification','summary']}
                  for slug in order
              ],
          }
          family_data_path.write_text(
              'window.FAMILY_GUIDE_DATA=' + json.dumps(family_payload, ensure_ascii=False, separators=(',', ':')) + ';\n',
              encoding='utf-8',
          )

          api_payload = dict(current_api)
          api_payload['version'] = version
          api_payload['reviewed_at'] = review_date
          api_payload['conditions'] = []
          base = 'https://khaledaltheeb.github.io/pterminology-site/family-guide/conditions/'
          for slug in order:
              obj = objects[slug]
              api_payload['conditions'].append({
                  'slug': slug,
                  'title': obj['title'],
                  'en': obj['en'],
                  'classification': obj['classification'],
                  'summary': obj['summary'],
                  'url': f'{base}{slug}/',
                  'data_url': f'{base}{slug}/data.js',
              })
          api_path.write_text(json.dumps(api_payload, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')

          sitemap = ['<?xml version="1.0" encoding="UTF-8"?>', '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">']
          sitemap.append(f'  <url><loc>https://khaledaltheeb.github.io/pterminology-site/family-guide/</loc><lastmod>{review_date}</lastmod><changefreq>monthly</changefreq><priority>1.0</priority></url>')
          for slug in order:
              sitemap.append(f'  <url><loc>{escape(base + slug + "/")}</loc><lastmod>{review_date}</lastmod><changefreq>monthly</changefreq><priority>0.9</priority></url>')
          for tool in ['family-plan','behavior-log','appointment-prep']:
              sitemap.append(f'  <url><loc>https://khaledaltheeb.github.io/pterminology-site/family-guide/tools/{tool}/</loc><lastmod>{review_date}</lastmod><changefreq>monthly</changefreq><priority>0.75</priority></url>')
          sitemap.append('</urlset>')
          (root / 'sitemap-family-guide.xml').write_text('\n'.join(sitemap) + '\n', encoding='utf-8')

          index_path = root / 'family-guide/index.html'
          index = index_path.read_text(encoding='utf-8')
          index = index.replace('عبر 24 دليلًا أسريًا', 'عبر 32 دليلًا أسريًا')
          index = index.replace('"numberOfItems":24', '"numberOfItems":32')
          index = index.replace('يضم الإصدار الحالي 24 دليلًا', 'يضم الإصدار الحالي 32 دليلًا')
          index = index.replace('24 دليلًا منشورًا وقابلًا للتوسع', '32 دليلًا منشورًا وقابلًا للتوسع')
          index = re.sub(r'family-guide-data\.js\?v=[0-9.]+', f'family-guide-data.js?v={version}', index)
          index_path.write_text(index, encoding='utf-8')
          assert '32 دليلًا' in index and '"numberOfItems":32' in index

          test_path = root / 'tests/test_family_guide_v335.py'
          test = test_path.read_text(encoding='utf-8')
          test = re.sub(r"assert api\['version'\]=='[^']+'", "assert api['version']=='1.3.0'", test)
          test = re.sub(r"assert len\(api\['conditions'\]\)==\d+", "assert len(api['conditions'])==32", test)
          test_path.write_text(test, encoding='utf-8')

          readme_path = root / 'family-guide/README.md'
          readme = readme_path.read_text(encoding='utf-8')
          readme = re.sub(r'# دليل الأسرة v\d+', '# دليل الأسرة v338', readme)
          readme = re.sub(r'- \d+ دليل(?: حالة)? منشور(?:ًا)?', '- 32 دليل حالة منشورًا', readme)
          readme = readme.replace('آخر مراجعة: 2026-07-29', f'آخر مراجعة: {review_date}')
          readme_path.write_text(readme, encoding='utf-8')

          workflow_path = root / '.github/workflows/validate-family-guide-v335.yml'
          workflow = workflow_path.read_text(encoding='utf-8')
          workflow = re.sub(r'name: Validate family guide v\d+', 'name: Validate family guide v338', workflow)
          workflow_path.write_text(workflow, encoding='utf-8')

          temp = root / '.github/workflows/materialize-family-guide-phase4-v338.yml'
          temp.unlink()
          print({'conditions': len(order), 'version': version, 'temporary_workflow_removed': not temp.exists()})
          PY
      - name: Validate generated inventory
        run: |
          python tests/test_family_guide_v335.py
          node --check family-guide/family-guide-data.js
          for file in family-guide/conditions/*/data.js; do node --check "$file"; done
          python - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('sitemap-family-guide.xml')
          print({'xml': 'passed'})
          PY
      - name: Commit production files and remove generator
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: expand family guide inventory to 32 conditions v338"
          git push origin HEAD:agent/family-guide-phase4-v338
