name: Temporary verify encyclopedia live v1

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  verify-production-run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Locate, report and wait for encyclopedia production workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess
          import time
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          workflow = 'deploy-encyclopedia-seo-search-intent-v1.yml'
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'encyclopedia-live-verifier',
          }

          def get_json(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          list_url = f'https://api.github.com/repos/{repo}/actions/workflows/{workflow}/runs?event=workflow_dispatch&branch=main&per_page=10'
          run = None
          for _ in range(30):
              data = get_json(list_url)
              candidates = [item for item in data.get('workflow_runs', []) if item.get('head_branch') == 'main']
              if candidates:
                  run = max(candidates, key=lambda item: item.get('created_at', ''))
                  break
              time.sleep(2)
          if not run:
              raise SystemExit('No workflow_dispatch run found for encyclopedia production workflow')

          run_id = int(run['id'])
          run_url = f'https://api.github.com/repos/{repo}/actions/runs/{run_id}'
          report = f'ENCYCLOPEDIA_PRODUCTION_RUN run_id={run_id} created_at={run.get("created_at")} status={run.get("status")}'
          subprocess.run(['gh', 'api', f'repos/{repo}/issues/812/comments', '-f', f'body={report}'], check=True)
          print(json.dumps({'run_id': run_id, 'created_at': run.get('created_at'), 'html_url': run.get('html_url')}, ensure_ascii=False))

          for attempt in range(150):
              current = get_json(run_url)
              status = current.get('status')
              conclusion = current.get('conclusion')
              print(json.dumps({'attempt': attempt + 1, 'run_id': run_id, 'status': status, 'conclusion': conclusion}, ensure_ascii=False))
              if status == 'completed':
                  final = f'ENCYCLOPEDIA_PRODUCTION_RESULT run_id={run_id} conclusion={conclusion}'
                  subprocess.run(['gh', 'api', f'repos/{repo}/issues/812/comments', '-f', f'body={final}'], check=True)
                  if conclusion != 'success':
                      raise SystemExit(f'Encyclopedia production workflow failed: {conclusion}; run_id={run_id}')
                  print(json.dumps({'status': 'success', 'run_id': run_id, 'conclusion': conclusion}, ensure_ascii=False))
                  raise SystemExit(0)
              time.sleep(10)
          raise SystemExit(f'Timed out waiting for encyclopedia production workflow run_id={run_id}')
          PY
