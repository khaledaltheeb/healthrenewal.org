name: Dispatch one-shot Pages v323 from release issue

on:
  issues:
    types: [opened]

permissions:
  actions: write
  issues: write
  contents: read

jobs:
  dispatch:
    if: github.event.issue.title == '[release-v323] deploy validated publication surface'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch validated Pages release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          repo=os.environ['GITHUB_REPOSITORY']
          token=os.environ['GH_TOKEN']
          payload=json.dumps({'ref':'main'}).encode('utf-8')
          request=urllib.request.Request(
              f'https://api.github.com/repos/{repo}/actions/workflows/one-shot-validated-pages-v323.yml/dispatches',
              data=payload,
              method='POST',
              headers={
                  'Authorization':f'Bearer {token}',
                  'Accept':'application/vnd.github+json',
                  'Content-Type':'application/json',
                  'X-GitHub-Api-Version':'2022-11-28',
                  'User-Agent':'release-v323-dispatcher',
              },
          )
          with urllib.request.urlopen(request,timeout=30) as response:
              response.read()
          print({'dispatched':'one-shot-validated-pages-v323.yml','ref':'main'})
          PY

      - name: Close release trigger issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          repo=os.environ['GITHUB_REPOSITORY']
          request=urllib.request.Request(
              f"https://api.github.com/repos/{repo}/issues/{os.environ['ISSUE_NUMBER']}",
              data=json.dumps({'state':'closed','state_reason':'completed'}).encode('utf-8'),
              method='PATCH',
              headers={
                  'Authorization':f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept':'application/vnd.github+json',
                  'Content-Type':'application/json',
                  'X-GitHub-Api-Version':'2022-11-28',
                  'User-Agent':'release-v323-dispatcher',
              },
          )
          with urllib.request.urlopen(request,timeout=30) as response:
              response.read()
          PY
