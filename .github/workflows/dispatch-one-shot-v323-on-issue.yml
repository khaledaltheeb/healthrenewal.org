name: Dispatch production workflow from release issue

on:
  issues:
    types: [opened]

permissions:
  actions: write
  issues: write
  contents: read

jobs:
  dispatch:
    if: >-
      github.event.issue.title == '[release-v323] deploy validated publication surface' ||
      github.event.issue.title == '[release-complete-site] deploy current main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch the selected authoritative release workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          title = os.environ['ISSUE_TITLE']
          workflows = {
              '[release-v323] deploy validated publication surface': 'one-shot-validated-pages-v323.yml',
              '[release-complete-site] deploy current main': 'deploy-complete-pages-with-ai-search.yml',
          }
          workflow = workflows[title]
          payload = json.dumps({'ref': 'main'}).encode('utf-8')
          request = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/actions/workflows/{workflow}/dispatches',
              data=payload,
              method='POST',
              headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'Content-Type': 'application/json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'healthrenewal-release-dispatcher',
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              response.read()
          print({'dispatched': workflow, 'ref': 'main', 'issueTitle': title})
          PY

      - name: Close release trigger issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/issues/{os.environ['ISSUE_NUMBER']}",
              data=json.dumps({'state': 'closed', 'state_reason': 'completed'}).encode('utf-8'),
              method='PATCH',
              headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'Content-Type': 'application/json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'healthrenewal-release-dispatcher',
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              response.read()
          PY
