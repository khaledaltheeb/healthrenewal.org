name: Audit addiction atlas v5

on:
  push:
    branches: [main]
    paths:
      - 'addiction/substances/**'
      - 'addiction/compare/**'
      - 'assets/addiction/atlas-*.js'
      - 'assets/addiction/atlas-*.css'
      - 'data/addiction-atlas/**'
      - 'scripts/publish_addiction_atlas_v2.py'
      - 'scripts/publish_addiction_atlas_v3.py'
      - 'scripts/normalize_addiction_atlas_page_dates.py'
      - 'scripts/validate_addiction_atlas_v2.py'
      - 'scripts/validate_addiction_atlas_manifest.py'
      - 'scripts/validate_addiction_atlas_dates.py'
      - 'scripts/validate_addiction_atlas_evidence_contract.py'
      - 'scripts/validate_addiction_atlas_risk_evidence.py'
      - 'scripts/validate_addiction_sitemap_registration_v1.py'
      - 'scripts/generate_addiction_atlas_sitemap.py'
      - 'scripts/publish_complete_sitemap_v360.py'
      - 'sitemap-addiction-atlas.xml'
      - 'sitemap-index.xml'
      - 'robots.txt'
      - '.github/workflows/audit-addiction-atlas-v2.yml'
  pull_request:
    paths:
      - 'addiction/substances/**'
      - 'addiction/compare/**'
      - 'assets/addiction/atlas-*.js'
      - 'assets/addiction/atlas-*.css'
      - 'data/addiction-atlas/**'
      - 'scripts/publish_addiction_atlas_v2.py'
      - 'scripts/publish_addiction_atlas_v3.py'
      - 'scripts/normalize_addiction_atlas_page_dates.py'
      - 'scripts/validate_addiction_atlas_v2.py'
      - 'scripts/validate_addiction_atlas_manifest.py'
      - 'scripts/validate_addiction_atlas_dates.py'
      - 'scripts/validate_addiction_atlas_evidence_contract.py'
      - 'scripts/validate_addiction_atlas_risk_evidence.py'
      - 'scripts/validate_addiction_sitemap_registration_v1.py'
      - 'scripts/generate_addiction_atlas_sitemap.py'
      - 'scripts/publish_complete_sitemap_v360.py'
      - 'sitemap-addiction-atlas.xml'
      - 'sitemap-index.xml'
      - 'robots.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-addiction-atlas-v5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile atlas Python tooling
        run: |
          python -m py_compile scripts/publish_addiction_atlas_v2.py
          python -m py_compile scripts/publish_addiction_atlas_v3.py
          python -m py_compile scripts/normalize_addiction_atlas_page_dates.py
          python -m py_compile scripts/generate_addiction_atlas_sitemap.py
          python -m py_compile scripts/validate_addiction_atlas_v2.py
          python -m py_compile scripts/validate_addiction_atlas_manifest.py
          python -m py_compile scripts/validate_addiction_atlas_dates.py
          python -m py_compile scripts/validate_addiction_atlas_evidence_contract.py
          python -m py_compile scripts/validate_addiction_atlas_risk_evidence.py
          python -m py_compile scripts/validate_addiction_sitemap_registration_v1.py
          python -m py_compile scripts/publish_complete_sitemap_v360.py
      - name: Validate all registered atlas waves
        run: python scripts/validate_addiction_atlas_manifest.py
      - name: Validate complete claim-to-evidence coverage
        run: python scripts/validate_addiction_atlas_evidence_contract.py
      - name: Validate dimension-level risk evidence
        run: python scripts/validate_addiction_atlas_risk_evidence.py
      - name: Validate page, schema and sitemap modification dates
        run: python scripts/validate_addiction_atlas_dates.py
      - name: Validate central sitemap registration
        run: python scripts/validate_addiction_sitemap_registration_v1.py
      - name: Validate JSON syntax independently
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files = sorted(Path('data/addiction-atlas').glob('*.json'))
          for path in files:
              json.loads(path.read_text(encoding='utf-8'))
          print({'validatedJsonFiles': len(files), 'files': [p.name for p in files]})
          PY
      - name: Reject hidden SEO keyword patterns
        run: |
          if grep -RniE '<meta[[:space:]]+name="keywords"|seo-keywords|hidden-keywords|keyword-cloud' addiction/substances addiction/compare; then
            echo 'Prohibited keyword-stuffing pattern found.'
            exit 1
          fi
          echo 'No prohibited hidden-keyword pattern found.'
