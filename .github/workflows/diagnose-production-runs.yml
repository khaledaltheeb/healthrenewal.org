name: Diagnose production workflow runs

on:
  push:
    branches: [agent/pediatric-oncology-deploy-run-7]
    paths:
      - '.github/workflows/diagnose-production-runs.yml'
      - 'production-diagnostic.trigger'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pediatric-oncology-deploy-run-7
          fetch-depth: 1
      - name: Capture production and pediatric hotfix runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p api
          gh run list --repo "$GH_REPO" --workflow deploy-production-v3.yml --limit 20 --json databaseId,status,conclusion,event,headSha,createdAt,updatedAt,url > api/production-runs-diagnostic.json
          gh run list --repo "$GH_REPO" --workflow deploy-pediatric-oncology-hotfix.yml --limit 20 --json databaseId,status,conclusion,event,headSha,createdAt,updatedAt,url > api/pediatric-oncology-hotfix-runs-diagnostic.json
          cat api/production-runs-diagnostic.json
          cat api/pediatric-oncology-hotfix-runs-diagnostic.json
      - name: Persist diagnostic snapshot
        run: |
          set -euo pipefail
          git config user.name 'Rawafid Diagnostics'
          git config user.email 'actions@users.noreply.github.com'
          git add api/production-runs-diagnostic.json api/pediatric-oncology-hotfix-runs-diagnostic.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: capture production and hotfix diagnostics'
          git push origin HEAD:agent/pediatric-oncology-deploy-run-7
