name: Verify password reset route v8

on:
  push:
    branches: ["main"]
    paths:
      - "specialists-partners/account-backend/DEPLOY_VERSION"
      - ".github/workflows/verify-password-reset-route-v8.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-password-reset-route-v8
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IDENTITY_URL: https://pterminology-specialist-accounts.pterminology-826ac349.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Wait for live password reset route
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          route_present=false
          http_status=0
          response_error=""
          for attempt in {1..72}; do
            http_status="$(curl -sS -o /tmp/password-reset-route.json -w '%{http_code}' \
              -X POST \
              -H 'origin: https://healthrenewal.org' \
              -H 'content-type: application/json;charset=UTF-8' \
              -H 'x-requested-with: pterminology-password-reset-v8' \
              --data '{}' \
              "${IDENTITY_URL}/v1/auth/password/reset" || echo 0)"
            if [[ "$http_status" != "404" && "$http_status" != "000" && "$http_status" != "0" ]]; then
              route_present=true
              break
            fi
            sleep 5
          done
          response_error="$(python - <<'PY'
          import json
          try:
              d=json.load(open('/tmp/password-reset-route.json',encoding='utf-8'))
              print(d.get('error',''))
          except Exception:
              print('')
          PY
          )"
          export route_present http_status response_error
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          report={
            'schema_version':1,
            'checked_at':datetime.now(timezone.utc).isoformat(),
            'identity_url':os.environ['IDENTITY_URL'],
            'route':'POST /v1/auth/password/reset',
            'http_status':int(os.environ.get('http_status','0') or 0),
            'response_error':os.environ.get('response_error',''),
            'route_present':os.environ.get('route_present','false').lower()=='true'
          }
          report['passed']=report['route_present'] and report['http_status'] != 404
          open('reports/password-reset-route-v8.json','w',encoding='utf-8').write(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY

      - name: Commit route verification report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/password-reset-route-v8.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: record password reset route v8 verification"
          git push origin HEAD:main

      - name: Enforce live route
        shell: bash
        run: python -c 'import json; d=json.load(open("reports/password-reset-route-v8.json")); assert d.get("passed") is True, d'
