name: SEO knowledge technical round

on:
  push:
    branches: [main]
    paths:
      - "scripts/seo_knowledge_round.py"
      - ".github/workflows/seo-knowledge-round.yml"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seo-knowledge-round
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile optimizer
        run: python -m py_compile scripts/seo_knowledge_round.py
      - name: Run scoped SEO round on latest main and publish safely
        shell: bash
        run: |
          set -euo pipefail
          echo "Starting verified knowledge SEO round (up to 50 material pages)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/seo_knowledge_round.py --target 50 | tee /tmp/seo-knowledge-report.txt

            read -r successes remaining failures < <(python -c 'import json; r=json.load(open(".github/seo/knowledge-round-report.json", encoding="utf-8")); print(r.get("successes_actual",0), r.get("eligible_remaining",0), r.get("failed_count",0))')

            if [ "$successes" -eq 0 ] && [ "$remaining" -eq 0 ] && [ "$failures" -eq 0 ]; then
              echo "Agent healthy: no material eligible SEO changes remain."
              git reset --hard origin/main
              exit 0
            fi

            if [ "$successes" -gt 0 ] && [ "$remaining" -eq 0 ] && [ "$failures" -eq 0 ]; then
              python -c 'import json; p=".github/seo/knowledge-round-report.json"; r=json.load(open(p,encoding="utf-8")); r["status"]="drained"; r["status_ar"]="اكتملت معالجة جميع الصفحات المؤهلة المتبقية"; r["agent_health"]="healthy"; r["completion_reason"]="all-eligible-pages-processed"; r["hard_blocker"]=None; open(p,"w",encoding="utf-8").write(json.dumps(r,ensure_ascii=False,indent=2)+"\n")'
            fi

            paths=(psychology terms resources sitemap.xml .github/seo)
            if [ -d encyclopedia ]; then paths+=(encyclopedia); fi
            if [ -d sectors/short-encyclopedia ]; then paths+=(sectors/short-encyclopedia); fi
            git add -A -- "${paths[@]}" 2>/dev/null || true

            if git diff --cached --quiet; then
              echo "No material verified SEO changes to publish."
              exit 0
            fi

            python -c 'import json; r=json.load(open(".github/seo/knowledge-round-report.json", encoding="utf-8")); assert r["successes_actual"] > 0, r; assert r["failed_count"] == 0, r; assert r["successes_actual"] >= r["target"] or r["eligible_remaining"] == 0, r; print(json.dumps(r, ensure_ascii=False, indent=2))'

            git commit -m "SEO: optimize verified knowledge pages"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Concurrent update detected; recomputing from newest main (attempt $attempt)."
          done

          echo "Unable to publish after three safe recomputations." >&2
          exit 1
