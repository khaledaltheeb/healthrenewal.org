name: Verify specialist recovery delivery v8

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/verify-specialist-recovery-v8.yml"
  workflow_run:
    workflows: ["Deploy specialist recovery overlay v8"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-specialist-recovery-delivery-v8
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ACCOUNT_API_BASE: https://pterminology-specialist-accounts.pterminology-826ac349.workers.dev
      ADMIN_API_KEY: ${{ secrets.SPECIALISTS_ADMIN_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Skip duplicate automatic delivery probe
        id: guard
        shell: bash
        run: |
          if [[ -f reports/specialist-recovery-v8-delivery.json && "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify stable Worker v8 and send one real owner reset email
        if: ${{ steps.guard.outputs.skip != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${ADMIN_API_KEY:-}" ]] || { echo "::error::SPECIALISTS_ADMIN_API_KEY missing"; exit 1; }

          stable=0
          for attempt in {1..60}; do
            code="$(curl -sS -o /tmp/health.json -w '%{http_code}' "${ACCOUNT_API_BASE}/health?delivery-probe=${GITHUB_RUN_ID}-${attempt}-$(date +%s%N)" || true)"
            if [[ "${code}" == "200" ]] && python - <<'PY'
          import json
          d=json.load(open('/tmp/health.json',encoding='utf-8'))
          assert d.get('ok') is True and d.get('version') == '8.0.0', d
          checks=d.get('checks') or {}
          assert checks.get('turnstile') is True, checks
          assert checks.get('resendConfigured') is True, checks
          assert checks.get('passwordResetBase') is True, checks
          PY
            then
              stable=$((stable+1))
              if [[ "${stable}" -ge 3 ]]; then break; fi
              sleep 2
            else
              stable=0
              sleep 5
            fi
          done
          [[ "${stable}" -ge 3 ]] || { cat /tmp/health.json || true; echo "::error::Worker v8 did not remain stable"; exit 1; }

          sent=false
          for attempt in {1..36}; do
            code="$(curl -sS -o /tmp/delivery.json -w '%{http_code}' -X POST \
              -H "x-bootstrap-key: ${ADMIN_API_KEY}" \
              -H 'content-type: application/json' \
              --data '{}' \
              "${ACCOUNT_API_BASE}/v1/internal/owner-password-reset?probe=${GITHUB_RUN_ID}-${attempt}-$(date +%s%N)" || true)"
            if [[ "${code}" == "200" ]] && python - <<'PY'
          import json
          d=json.load(open('/tmp/delivery.json',encoding='utf-8'))
          assert d.get('ok') is True and d.get('delivery') == 'sent', d
          assert d.get('providerMessageId'), d
          PY
            then
              sent=true
              break
            fi
            error="$(python - <<'PY'
          import json
          try:
              d=json.load(open('/tmp/delivery.json',encoding='utf-8'))
              print(d.get('error',''))
          except Exception:
              print('')
          PY
          )"
            if [[ "${code}" == "403" ]]; then
              cat /tmp/delivery.json || true
              echo "::error::Owner delivery probe is forbidden"
              exit 1
            fi
            echo "Delivery route not ready yet: HTTP ${code}, error=${error}, attempt=${attempt}"
            sleep 5
          done
          [[ "${sent}" == "true" ]] || { cat /tmp/delivery.json || true; echo "::error::Owner reset email was not accepted by Resend"; exit 1; }

          mkdir -p reports
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          d=json.load(open('/tmp/delivery.json',encoding='utf-8'))
          report={
            'schema_version':1,
            'checked_at':datetime.now(timezone.utc).isoformat(),
            'worker_version':'8.0.0',
            'delivery':'sent',
            'request_id':d.get('requestId'),
            'provider_message_id':d.get('providerMessageId'),
            'expires_at':d.get('expiresAt'),
            'workflow_run_id':os.environ['GITHUB_RUN_ID'],
          }
          open('reports/specialist-recovery-v8-delivery.json','w',encoding='utf-8').write(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          PY

      - name: Commit safe delivery receipt
        if: ${{ steps.guard.outputs.skip != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/specialist-recovery-v8-delivery.json
          git commit -m "chore: record specialist recovery v8 delivery"
          git pull --rebase origin main
          git push origin HEAD:main
