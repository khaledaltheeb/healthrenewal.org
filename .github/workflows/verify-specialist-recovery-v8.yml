name: Verify specialist recovery compatibility without email

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ACCOUNT_API_BASE: https://pterminology-specialist-accounts.pterminology-826ac349.workers.dev
    steps:
      - uses: actions/checkout@v4
      - name: Verify public health without issuing recovery tokens
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/health.json -w '%{http_code}' "${ACCOUNT_API_BASE}/health?compatibility=${GITHUB_RUN_ID}" || true)"
          [[ "${code}" == "200" || "${code}" == "503" ]] || { cat /tmp/health.json || true; exit 1; }
          python - <<'PY'
          import json
          data=json.load(open('/tmp/health.json',encoding='utf-8'))
          assert data.get('service') == 'pterminology-specialist-identity', data
          assert (data.get('checks') or {}).get('database') is True, data
          assert (data.get('checks') or {}).get('identitySchema') is True, data
          PY
          echo "Compatibility check completed without creating a reset token or sending email."
