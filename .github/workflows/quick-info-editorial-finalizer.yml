name: Quick Info reviewed editorial finalizer

on:
  push:
    branches:
      - "agent/quick-info-editorial-*"
    paths:
      - ".github/workflows/quick-info-editorial-finalizer.yml"
      - "content/quick-info-editorial/**"
      - "scripts/apply_quick_info_editorial_batch.py"
      - "scripts/normalize_platform_shell.py"
      - "scripts/inject_google_tag_manager.py"
  workflow_run:
    workflows:
      - Recover richest historical content and deploy complete site
    types:
      - completed

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: quick-info-reviewed-editorial-${{ github.event.workflow_run.id || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      source_sha: ${{ steps.context.outputs.source_sha }}
      production: ${{ steps.context.outputs.production }}

    steps:
      - name: Resolve test or production context
        id: context
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "source_ref=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
            echo "source_sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
            echo "upstream_run=${{ github.event.workflow_run.id }}" >> "$GITHUB_OUTPUT"
            echo "production=true" >> "$GITHUB_OUTPUT"
          else
            echo "source_ref=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "source_sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            # Last fully validated safe production run used only for branch testing.
            echo "upstream_run=31262113373" >> "$GITHUB_OUTPUT"
            echo "production=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout editorial source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.context.outputs.source_ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Refuse stale production finalization
        if: steps.context.outputs.production == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.context.outputs.source_sha }}
        run: |
          set -euo pipefail
          current_sha="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" \
            | python -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')"
          test "${current_sha}" = "${SOURCE_SHA}"
          echo "Finalizing current main at ${SOURCE_SHA}."

      - name: Download validated recovered production artifact
        uses: actions/download-artifact@v4
        with:
          name: validated-production-site
          path: _site
          repository: khaledaltheeb/healthrenewal.org
          run-id: ${{ steps.context.outputs.upstream_run }}
          github-token: ${{ github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile deterministic editorial applicator
        run: |
          python -m py_compile \
            scripts/apply_quick_info_editorial_batch.py \
            scripts/normalize_platform_shell.py \
            scripts/inject_google_tag_manager.py

      - name: Apply reviewed editorial batch 001
        run: |
          set -euo pipefail
          test "$(find _site/quick-info -mindepth 2 -maxdepth 2 -name index.html | wc -l)" -eq 395
          python scripts/apply_quick_info_editorial_batch.py \
            --root _site \
            --repo-root . \
            --batch 001 \
            --minimum-total-words 1500

      - name: Enforce editorial and discovery quality gates
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          import xml.etree.ElementTree as ET

          report = json.loads(Path('_site/api/quick-info-editorial-batch-001.json').read_text(encoding='utf-8'))
          assert report['status'] == 'passed', report
          assert report['primaryInventory'] == 250, report
          assert report['productionArticlePages'] == 395, report
          assert report['historicalRecoveredPages'] == 145, report
          assert report['batchPages'] == 5, report
          assert report['historicalRecoveredUpgraded'] == 5, report
          assert report['historicalRecoveredBacklog'] == 140, report
          assert report['minimumBatchTotalWords'] >= 1500, report
          assert report['maximumBatchContentCosine'] <= 0.20, report
          assert report['repeatedLongParagraphs'] == 0, report
          assert report['sectionSitemapUrls'] == 256, report
          assert report['runtime']['pages'] == 396, report
          assert report['failures'] == [], report
          assert all(len(item['reviewedSources']) >= 3 for item in report['items'])
          assert all(item['origin'] == 'historical-recovered' for item in report['items'])

          ns = {'sm': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
          root = ET.parse('_site/sitemap-quick-info.xml').getroot()
          locations = [node.text or '' for node in root.findall('sm:url/sm:loc', ns)]
          assert len(locations) == 256, len(locations)
          assert len(locations) == len(set(locations)), 'duplicate section sitemap URLs'
          for item in report['items']:
              assert item['url'] in locations, item['url']
          print({k: v for k, v in report.items() if k not in {'items', 'similarityPairs'}})
          PY

          for slug in \
            after-night-without-sleep \
            caffeine-and-anxiety \
            caregiver-needs-support \
            when-gaming-becomes-problem \
            what-stress-does-to-body; do
            page="_site/quick-info/${slug}/index.html"
            grep -q 'QUICK_INFO_EDITORIAL_BATCH_001_START' "$page"
            grep -q 'GTM-WBLQVBG4' "$page"
            grep -q 'G-VLZMV8Y4JP' "$page"
            grep -q 'pt-platform-shell:v1' "$page"
          done
          ! grep -q 'SAMHSA: Find Support' _site/quick-info/when-gaming-becomes-problem/index.html
          ! grep -q 'WHO: Substance use' _site/quick-info/when-gaming-becomes-problem/index.html
          grep -q 'QUICK_INFO_EDITORIAL_DIRECTORY_001_START' _site/quick-info/index.html
          grep -q '/quick-info/when-gaming-becomes-problem/' _site/quick-info/index.html

          # Runtime is normalized for the whole recovered section, including pages still in the editorial backlog.
          grep -q 'GTM-WBLQVBG4' _site/quick-info/fatigue-or-laziness/index.html
          grep -q 'G-VLZMV8Y4JP' _site/quick-info/fatigue-or-laziness/index.html
          grep -q 'pt-platform-shell:v1' _site/quick-info/fatigue-or-laziness/index.html

      - name: Upload editorial diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: quick-info-editorial-001-${{ github.run_id }}
          path: |
            _site/api/quick-info-editorial-batch-001.json
            _site/sitemap-quick-info.xml
          retention-days: 90

      - name: Configure Pages for production
        if: steps.context.outputs.production == 'true'
        uses: actions/configure-pages@v5

      - name: Upload reviewed production artifact
        if: steps.context.outputs.production == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy reviewed Quick Info editorial batch
    if: needs.build.outputs.production == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Refuse stale deployment if main advanced
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
        run: |
          set -euo pipefail
          current_sha="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" \
            | python -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')"
          test "${current_sha}" = "${SOURCE_SHA}"

      - name: Deploy reviewed production artifact
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify editorial batch live
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 80); do
            nonce="${GITHUB_RUN_ID}-${attempt}-$(date +%s%N)"
            if curl -fsSL --retry 2 -H 'Cache-Control: no-cache' \
              "https://healthrenewal.org/api/quick-info-editorial-batch-001.json?release=${nonce}" \
              -o /tmp/report.json \
              && curl -fsSL --retry 2 -H 'Cache-Control: no-cache' \
              "https://healthrenewal.org/quick-info/when-gaming-becomes-problem/?release=${nonce}" \
              -o /tmp/gaming.html \
              && curl -fsSL --retry 2 -H 'Cache-Control: no-cache' \
              "https://healthrenewal.org/quick-info/after-night-without-sleep/?release=${nonce}" \
              -o /tmp/sleep.html \
              && curl -fsSL --retry 2 -H 'Cache-Control: no-cache' \
              "https://healthrenewal.org/sitemap-quick-info.xml?release=${nonce}" \
              -o /tmp/sitemap.xml; then
              if python - <<'PY'
          import json
          from pathlib import Path
          import xml.etree.ElementTree as ET
          report = json.loads(Path('/tmp/report.json').read_text(encoding='utf-8'))
          assert report['status'] == 'passed', report
          assert report['batchPages'] == 5, report
          assert report['historicalRecoveredBacklog'] == 140, report
          assert report['minimumBatchTotalWords'] >= 1500, report
          assert report['maximumBatchContentCosine'] <= 0.20, report
          for filename in ('/tmp/gaming.html', '/tmp/sleep.html'):
              source = Path(filename).read_text(encoding='utf-8')
              assert 'QUICK_INFO_EDITORIAL_BATCH_001_START' in source
              assert 'GTM-WBLQVBG4' in source
              assert 'G-VLZMV8Y4JP' in source
              assert 'pt-platform-shell:v1' in source
          assert 'SAMHSA: Find Support' not in Path('/tmp/gaming.html').read_text(encoding='utf-8')
          ns = {'sm': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
          root = ET.parse('/tmp/sitemap.xml').getroot()
          assert len(root.findall('sm:url', ns)) == 256
          print(report)
          PY
              then
                ready=1
                break
              fi
            fi
            sleep 4
          done
          test "$ready" = 1
