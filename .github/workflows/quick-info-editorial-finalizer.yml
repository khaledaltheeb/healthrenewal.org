name: Quick Info reviewed editorial finalizer

on:
  push:
    branches:
      - "agent/quick-info-editorial-*"
    paths:
      - ".github/workflows/quick-info-editorial-finalizer.yml"
      - "content/quick-info-editorial/**"
      - "scripts/apply_quick_info_editorial_batch.py"
      - "scripts/normalize_platform_shell.py"
      - "scripts/inject_google_tag_manager.py"
  workflow_run:
    workflows:
      - Recover richest historical content and deploy complete site
    types: [completed]

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: quick-info-reviewed-editorial-${{ github.event.workflow_run.id || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      source_sha: ${{ steps.context.outputs.source_sha }}
      production: ${{ steps.context.outputs.production }}

    steps:
      - name: Resolve test or production context
        id: context
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "source_ref=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
            echo "source_sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
            echo "upstream_run=${{ github.event.workflow_run.id }}" >> "$GITHUB_OUTPUT"
            echo "production=true" >> "$GITHUB_OUTPUT"
          else
            echo "source_ref=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "source_sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            # Latest fully validated no-loss production artifact; branch tests never deploy it.
            echo "upstream_run=31263475201" >> "$GITHUB_OUTPUT"
            echo "production=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout editorial source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.context.outputs.source_ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Refuse stale production finalization
        if: steps.context.outputs.production == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.context.outputs.source_sha }}
        run: |
          set -euo pipefail
          current_sha="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" | python -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')"
          test "$current_sha" = "$SOURCE_SHA"

      - name: Download validated no-loss artifact
        uses: actions/download-artifact@v4
        with:
          name: validated-production-site
          path: _site
          repository: khaledaltheeb/healthrenewal.org
          run-id: ${{ steps.context.outputs.upstream_run }}
          github-token: ${{ github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile deterministic editorial applicator
        run: |
          python -m py_compile scripts/apply_quick_info_editorial_batch.py scripts/normalize_platform_shell.py scripts/inject_google_tag_manager.py

      - name: Apply every reviewed batch from a clean no-loss artifact
        run: |
          set -euo pipefail
          test "$(find _site/quick-info -mindepth 2 -maxdepth 2 -name index.html | wc -l)" -eq 395
          mapfile -t batches < <(find content/quick-info-editorial -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort)
          test "${#batches[@]}" -gt 0
          for batch in "${batches[@]}"; do
            test "$(find "content/quick-info-editorial/${batch}" -maxdepth 1 -name '*.html' | wc -l)" -eq 5
            echo "Applying reviewed batch ${batch}"
            python scripts/apply_quick_info_editorial_batch.py --root _site --repo-root . --batch "$batch" --minimum-total-words 1500
          done

      - name: Build cumulative editorial report and enforce gates
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re
          from pathlib import Path
          import xml.etree.ElementTree as ET

          site = Path('_site')
          expected_batches = sorted(p.name for p in Path('content/quick-info-editorial').iterdir() if p.is_dir())
          reports = sorted(site.glob('api/quick-info-editorial-batch-*.json'))
          report_batches = [p.stem.rsplit('-', 1)[-1] for p in reports]
          assert report_batches == expected_batches, (report_batches, expected_batches)
          data = [json.loads(p.read_text(encoding='utf-8')) for p in reports]
          for report in data:
              assert report['status'] == 'passed', report
              assert report['batchPages'] == 5, report
              assert report['minimumBatchTotalWords'] >= 1500, report
              assert report['maximumBatchContentCosine'] <= 0.20, report
              assert report['repeatedLongParagraphs'] == 0, report
              assert report['failures'] == [], report
              assert all(len(item['reviewedSources']) >= 3 for item in report['items'])
              assert all(item['origin'] == 'historical-recovered' for item in report['items'])

          primary = json.loads((site/'api/v1/quick-info.json').read_text(encoding='utf-8'))
          primary_slugs = {item['slug'] for item in primary['items']}
          assert len(primary_slugs) == 250
          article_pages = sorted((site/'quick-info').glob('*/index.html'))
          historical = [p for p in article_pages if p.parent.name not in primary_slugs]
          upgraded = {}
          for page in historical:
              source = page.read_text(encoding='utf-8')
              markers = re.findall(r'QUICK_INFO_EDITORIAL_BATCH_(\d+)_START', source)
              if markers:
                  assert len(set(markers)) == 1, (page, markers)
                  upgraded[page.parent.name] = markers[0]
          assert len(article_pages) == 395
          assert len(historical) == 145

          reviewed_items = [(r['batch'], item['slug']) for r in data for item in r['items']]
          assert len(reviewed_items) == len(set(slug for _, slug in reviewed_items)), reviewed_items
          assert len(upgraded) == len(reviewed_items), (len(upgraded), len(reviewed_items))
          for batch, slug in reviewed_items:
              assert upgraded.get(slug) == batch, (batch, slug, upgraded.get(slug))

          expected_sitemap_urls = 251 + len(upgraded)
          ns = {'sm':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          sitemap = ET.parse(site/'sitemap-quick-info.xml').getroot()
          locations = [n.text or '' for n in sitemap.findall('sm:url/sm:loc', ns)]
          assert len(locations) == expected_sitemap_urls, (len(locations), expected_sitemap_urls)
          assert len(locations) == len(set(locations))
          for _, slug in reviewed_items:
              assert f'https://healthrenewal.org/quick-info/{slug}/' in locations, slug

          latest = data[-1]
          cumulative = {
              'version':'1.1.0',
              'status':'passed',
              'batches':expected_batches,
              'latestBatch':expected_batches[-1],
              'latestBatchItems':[item['slug'] for item in latest['items']],
              'productionArticlePages':395,
              'primaryPages':250,
              'historicalRecoveredPages':145,
              'historicalRecoveredUpgradedCumulative':len(upgraded),
              'historicalRecoveredBacklog':145-len(upgraded),
              'sectionSitemapUrls':expected_sitemap_urls,
              'minimumWordsByBatch':{r['batch']:r['minimumBatchTotalWords'] for r in data},
              'maximumCosineByBatch':{r['batch']:r['maximumBatchContentCosine'] for r in data},
              'runtimePages':data[-1]['runtime']['pages'],
              'failures':[],
          }
          assert cumulative['runtimePages'] == 396
          (site/'api/quick-info-editorial-cumulative.json').write_text(json.dumps(cumulative, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          print(cumulative)
          PY

          # Confirm every reviewed page carries exactly its committed batch marker and full runtime.
          python - <<'PY'
          import json
          from pathlib import Path
          site=Path('_site')
          for report_path in sorted(site.glob('api/quick-info-editorial-batch-*.json')):
              report=json.loads(report_path.read_text(encoding='utf-8'))
              marker=f'QUICK_INFO_EDITORIAL_BATCH_{report["batch"]}_START'
              for item in report['items']:
                  source=(site/'quick-info'/item['slug']/'index.html').read_text(encoding='utf-8')
                  assert source.count(marker)==1, item['slug']
                  assert 'GTM-WBLQVBG4' in source, item['slug']
                  assert 'G-VLZMV8Y4JP' in source, item['slug']
                  assert 'pt-platform-shell:v1' in source, item['slug']
          PY

          # Topic-specific source regression guards for pages whose legacy source boxes were wrong/generic.
          ! grep -q 'WHO: Substance use' _site/quick-info/break-phone-checking-habit/index.html
          ! grep -q 'SAMHSA: Find Support' _site/quick-info/break-phone-checking-habit/index.html
          grep -q 'Cochrane 2022' _site/quick-info/does-music-help-sleep/index.html
          grep -q 'BMJ 2024' _site/quick-info/does-exercise-help-mood/index.html
          grep -q 'Imagery Rehearsal Therapy' _site/quick-info/deal-with-recurring-nightmare/index.html
          grep -q 'مراجعة منهجية وتحليل تلوي' _site/quick-info/five-reasons-procrastination/index.html
          grep -q 'American Academy of Pediatrics' _site/quick-info/five-signs-teen-needs-listening/index.html

      - name: Upload editorial diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: quick-info-editorial-${{ github.run_id }}
          path: |
            _site/api/quick-info-editorial-batch-*.json
            _site/api/quick-info-editorial-cumulative.json
            _site/sitemap-quick-info.xml
          retention-days: 90

      - if: steps.context.outputs.production == 'true'
        uses: actions/configure-pages@v5

      - name: Upload reviewed production artifact
        if: steps.context.outputs.production == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy reviewed Quick Info editorial batches
    if: needs.build.outputs.production == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Refuse stale deployment if main advanced
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
        run: |
          set -euo pipefail
          current_sha="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" | python -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')"
          test "$current_sha" = "$SOURCE_SHA"

      - name: Deploy reviewed production artifact
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify cumulative editorial release live
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 80); do
            nonce="${GITHUB_RUN_ID}-${attempt}-$(date +%s%N)"
            if curl -fsSL --retry 2 -H 'Cache-Control: no-cache' "https://healthrenewal.org/api/quick-info-editorial-cumulative.json?release=${nonce}" -o /tmp/cumulative.json \
              && curl -fsSL --retry 2 -H 'Cache-Control: no-cache' "https://healthrenewal.org/sitemap-quick-info.xml?release=${nonce}" -o /tmp/sitemap.xml; then
              python - <<'PY' >/tmp/live-context
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/cumulative.json').read_text(encoding='utf-8'))
          assert r['status']=='passed', r
          assert r['historicalRecoveredUpgradedCumulative']==5*len(r['batches']), r
          assert r['historicalRecoveredBacklog']==145-r['historicalRecoveredUpgradedCumulative'], r
          assert r['sectionSitemapUrls']==251+r['historicalRecoveredUpgradedCumulative'], r
          assert all(v>=1500 for v in r['minimumWordsByBatch'].values()), r
          assert all(v<=0.20 for v in r['maximumCosineByBatch'].values()), r
          print(r['latestBatch'])
          print(r['latestBatchItems'][0])
          PY
              latest_batch="$(sed -n '1p' /tmp/live-context)"
              sample_slug="$(sed -n '2p' /tmp/live-context)"
              if curl -fsSL --retry 2 -H 'Cache-Control: no-cache' "https://healthrenewal.org/quick-info/${sample_slug}/?release=${nonce}" -o /tmp/sample.html; then
                if python - "$latest_batch" <<'PY'
          import sys, xml.etree.ElementTree as ET
          from pathlib import Path
          batch=sys.argv[1]
          source=Path('/tmp/sample.html').read_text(encoding='utf-8')
          assert f'QUICK_INFO_EDITORIAL_BATCH_{batch}_START' in source
          assert 'GTM-WBLQVBG4' in source and 'G-VLZMV8Y4JP' in source and 'pt-platform-shell:v1' in source
          ns={'sm':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          root=ET.parse('/tmp/sitemap.xml').getroot()
          count=len(root.findall('sm:url',ns))
          import json
          report=json.loads(Path('/tmp/cumulative.json').read_text(encoding='utf-8'))
          assert count==report['sectionSitemapUrls'], (count, report)
          print(report)
          PY
                then ready=1; break; fi
              fi
            fi
            sleep 4
          done
          test "$ready" = 1
