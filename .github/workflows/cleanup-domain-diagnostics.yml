name: Cleanup domain diagnostics

on:
  push:
    branches: [main]
    paths:
      - ".github/domain-diagnostics-cleanup-trigger"

permissions:
  contents: write
  issues: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove temporary domain diagnostic workflows and triggers
        run: |
          set -euo pipefail
          git rm -f --ignore-unmatch \
            .github/workflows/repair-canonical-domain-dns.yml \
            .github/workflows/report-canonical-domain-dns.yml \
            .github/workflows/bootstrap-healthrenewal-cloudflare-zone.yml \
            .github/workflows/report-healthrenewal-cloudflare-zone.yml \
            .github/workflows/dispatch-healthrenewal-cloudflare-zone.yml \
            .github/workflows/bootstrap-healthrenewal-cloudflare-zone-v2.yml \
            .github/workflows/dispatch-observable-healthrenewal-zone.yml \
            .github/workflows/audit-hostinger-domain-api.yml \
            .github/workflows/cleanup-domain-diagnostics.yml \
            .github/domain-bootstrap-trigger \
            .github/hostinger-domain-audit-trigger \
            .github/domain-diagnostics-cleanup-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "chore(domain): remove temporary DNS diagnostics"
            git push origin HEAD:main
          fi

      - name: Close temporary diagnostic issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          note="Diagnostic completed. The repository CNAME is correct. The remaining blocker is external authorization: the current Cloudflare token lacks Zone Create permission and no Hostinger API token is stored in GitHub Actions secrets. Temporary workflows were removed to prevent recurring failures."
          for issue in 980 981 983; do
            gh issue close "$issue" --repo "$GITHUB_REPOSITORY" --reason not_planned --comment "$note" || true
          done
