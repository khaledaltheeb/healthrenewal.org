name: Validate published locale contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'en/**'
      - 'es/**'
      - 'data/published-locales.json'
      - 'scripts/validate_published_locales.py'
      - '.github/workflows/validate-published-locales.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'en/**'
      - 'es/**'
      - 'data/published-locales.json'
      - 'scripts/validate_published_locales.py'
      - '.github/workflows/validate-published-locales.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: published-locales-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile validator
        run: python -m py_compile scripts/validate_published_locales.py
      - name: Validate locale registry and artifacts
        run: python scripts/validate_published_locales.py
      - name: Prove read-only checkout
        run: git diff --exit-code && test -z "$(git status --porcelain)"
