name: Validate AI crawler machine-readable surface v1

on:
  pull_request:
    branches: ["main"]
    paths:
      - "robots.txt"
      - "llms.txt"
      - "llms-full.txt"
      - "feed.xml"
      - "atom.xml"
      - "api/v1/content-index.json"
      - "api/v1/ai-discovery.json"
      - "api/v1/ai-discovery.openapi.json"
      - "scripts/generate_sitemap_index_v304.py"
      - "scripts/generate_sitemap_index_v304_core.py"
      - "scripts/ai_machine_readable_v1.py"
      - "scripts/robots_policy.py"
      - "tests/test_ai_crawler_machine_readable_v1.py"
      - "tests/test_robots_policy.py"
      - ".github/workflows/validate-ai-crawler-machine-readable-v1.yml"
  push:
    branches: ["main"]
    paths:
      - "robots.txt"
      - "llms.txt"
      - "llms-full.txt"
      - "feed.xml"
      - "atom.xml"
      - "api/v1/content-index.json"
      - "api/v1/ai-discovery.json"
      - "api/v1/ai-discovery.openapi.json"
      - "scripts/generate_sitemap_index_v304.py"
      - "scripts/generate_sitemap_index_v304_core.py"
      - "scripts/ai_machine_readable_v1.py"
      - "scripts/robots_policy.py"
      - "tests/test_ai_crawler_machine_readable_v1.py"
      - "tests/test_robots_policy.py"
      - ".github/workflows/validate-ai-crawler-machine-readable-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-crawler-machine-readable-v1-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile generator and regression tests
        run: |
          python -m py_compile \
            scripts/generate_sitemap_index_v304.py \
            scripts/generate_sitemap_index_v304_core.py \
            scripts/ai_machine_readable_v1.py \
            scripts/robots_policy.py \
            tests/test_ai_crawler_machine_readable_v1.py \
            tests/test_robots_policy.py
      - name: Run AI crawler and machine-readable regression suite
        run: |
          python -m unittest discover -s tests -p 'test_ai_crawler_machine_readable_v1.py' -v
          python -m unittest discover -s tests -p 'test_robots_policy.py' -v
      - name: Validate committed public artifacts
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path
          from xml.etree import ElementTree as ET

          sys.path.insert(0, str(Path("scripts").resolve()))
          from ai_machine_readable_v1 import AI_USER_AGENTS
          from robots_policy import validate_robots_policy

          for path in (
              Path("api/v1/content-index.json"),
              Path("api/v1/ai-discovery.json"),
              Path("api/v1/ai-discovery.openapi.json"),
          ):
              json.loads(path.read_text(encoding="utf-8"))

          ET.parse("feed.xml")
          ET.parse("atom.xml")

          robots = Path("robots.txt").read_text(encoding="utf-8")
          validate_robots_policy(
              robots,
              required_agents=AI_USER_AGENTS,
              required_paths=(
                  "/",
                  "/feed.xml",
                  "/atom.xml",
                  "/llms.txt",
                  "/llms-full.txt",
                  "/sitemap.xml",
                  "/sitemap-index.xml",
                  "/api/v1/content-index.json",
                  "/api/v1/ai-discovery.json",
                  "/api/v1/ai-discovery.openapi.json",
              ),
              required_sitemaps=(
                  "https://healthrenewal.org/sitemap.xml",
                  "https://healthrenewal.org/sitemap-index.xml",
              ),
              require_explicit_agents=True,
          )
          assert "research.xml" not in Path("llms.txt").read_text(encoding="utf-8")
          PY
