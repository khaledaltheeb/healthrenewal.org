name: Apply specialist identity v6 setup hardening

on:
  pull_request:
    branches: ["main"]
    paths:
      - "tools/apply_specialist_identity_v6_setup_hardening.py"
      - ".github/workflows/apply-specialist-identity-v6-setup-hardening.yml"

permissions:
  contents: write

concurrency:
  group: apply-specialist-identity-v6-setup-hardening-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/specialist-identity-admin-v6
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Detect setup hardening patch
        id: patch
        shell: bash
        run: |
          [[ -f tools/apply_specialist_identity_v6_setup_hardening.py ]] && echo 'present=true' >> "$GITHUB_OUTPUT" || echo 'present=false' >> "$GITHUB_OUTPUT"
      - name: Apply reviewed setup hardening
        if: ${{ steps.patch.outputs.present == 'true' }}
        run: python tools/apply_specialist_identity_v6_setup_hardening.py
      - name: Validate setup hardening and compatibility
        if: ${{ steps.patch.outputs.present == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          node --check specialists-partners/account-backend/src/index.js
          node --check specialists-partners/account/account.js
          node --check specialists-partners/admin/admin.js
          python -m unittest -v tests.test_specialist_accounts_v5 tests.test_specialist_identity_v6
      - name: Commit hardened application files
        if: ${{ steps.patch.outputs.present == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tests/__pycache__
          git checkout HEAD -- .github/workflows
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: support initial password setup and preserve account state"
          git push origin HEAD:agent/specialist-identity-admin-v6
