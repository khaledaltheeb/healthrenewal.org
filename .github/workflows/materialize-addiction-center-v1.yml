name: Materialize addiction reference center v1

on:
  push:
    branches: ["agent/addiction-reference-center-v1"]
    paths:
      - ".addiction-payload/**"
      - "scripts/materialize_addiction_center_v1.py"
      - ".github/workflows/materialize-addiction-center-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/addiction-reference-center-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reconstruct reviewed publication files
        run: python scripts/materialize_addiction_center_v1.py
      - name: Run addiction publication gates
        run: python scripts/audit_addiction_center_v1.py
      - name: Commit materialized center
        run: |
          set -euxo pipefail
          git config user.name "healthrenewal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add addiction api docs scripts
          if git diff --cached --quiet; then
            echo "No materialized changes"
            exit 0
          fi
          git commit -m "feat: materialize Arabic addiction reference center v1"
          git push origin HEAD:agent/addiction-reference-center-v1
