name: Validate Published Provider Assessment Demo

on:
  push:
    branches: [main]
    paths:
      - "provider-assessment-demo/**"
      - ".github/workflows/provider-assessment-demo-production.yml"
  pull_request:
    paths:
      - "provider-assessment-demo/**"
      - ".github/workflows/provider-assessment-demo-production.yml"

permissions:
  contents: read

concurrency:
  group: provider-assessment-demo-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-published-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate JavaScript syntax
        run: |
          node --check provider-assessment-demo/catalog.js
          node --check provider-assessment-demo/catalog-extra.js
          node --check provider-assessment-demo/catalog-contract-fix.js
          node --check provider-assessment-demo/professional-master-registry.js
          node --check provider-assessment-demo/app.js
          node --check provider-assessment-demo/activation.js
          node --check provider-assessment-demo/activation-guard.js
          node --check provider-assessment-demo/professional-record-lifecycle.js
          node --check provider-assessment-demo/professional-record-integrity.js
          node --check provider-assessment-demo/backup-integrity.js
          node --check provider-assessment-demo/backup-large-file-patch.js
          node --check provider-assessment-demo/enhancements.js

      - name: Validate catalog and UI contracts
        run: |
          node <<'NODE'
          global.window = {};
          require('./provider-assessment-demo/catalog.js');
          require('./provider-assessment-demo/catalog-extra.js');
          require('./provider-assessment-demo/catalog-contract-fix.js');
          const data = window.PA_DEMO_DATA;
          if (!data || data.explorers.length !== 20) throw new Error(`Expected twenty exploratory tools, found ${data?.explorers?.length}`);
          if (data.categories.length !== 8) throw new Error('Expected eight primary categories');
          const requiredTypes = ['radio', 'checkbox', 'select', 'textarea'];
          for (const tool of data.explorers) {
            if (!Array.isArray(tool.questions) || tool.questions.length < 4) throw new Error(`${tool.id}: insufficient questions`);
            const types = new Set(tool.questions.map(question => question.type));
            const missing = requiredTypes.filter(type => !types.has(type));
            if (missing.length) throw new Error(`${tool.id}: missing response types ${missing.join(', ')}`);
            if (!Array.isArray(tool.ages) || !tool.ages.length) throw new Error(`${tool.id}: age scope missing`);
            if (!Array.isArray(tool.guide) || tool.guide.length < 3) throw new Error(`${tool.id}: application guide incomplete`);
            if (!Array.isArray(tool.next)) throw new Error(`${tool.id}: next-step routing missing`);
          }
          const ids = data.explorers.map(tool => tool.id);
          if (new Set(ids).size !== ids.length) throw new Error('Duplicate exploratory tool identifiers');
          NODE

      - name: Validate UID isolation and offline-only behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [
              Path('provider-assessment-demo/app.js'),
              Path('provider-assessment-demo/enhancements.js'),
              Path('provider-assessment-demo/activation.js'),
              Path('provider-assessment-demo/activation-guard.js'),
              Path('provider-assessment-demo/professional-record-lifecycle.js'),
              Path('provider-assessment-demo/professional-record-integrity.js'),
              Path('provider-assessment-demo/backup-integrity.js'),
              Path('provider-assessment-demo/backup-large-file-patch.js'),
              Path('provider-assessment-demo/catalog-contract-fix.js'),
              Path('provider-assessment-demo/professional-master-registry.js'),
          ]
          text = '\n'.join(path.read_text(encoding='utf-8') for path in files)
          forbidden = ['fetch(', 'XMLHttpRequest', 'WebSocket', 'sendBeacon(', 'EventSource(', 'eval(', 'new Function(']
          found = [token for token in forbidden if token in text]
          if found:
              raise SystemExit(f'Network or unsafe APIs are forbidden in the local platform: {found}')
          required = [
              'storeKey=u=>`pa-demo-store-v${V}:${u}`',
              'ownerUid: identity.uid',
              'payload.ownerUid !== identity.uid',
              'candidate.uid !== identity.uid',
              'pa-demo-uid-backup-v1',
              'pa-demo-uid-backup-v2',
              'pa-demo-uid-backup-encrypted-v1',
              'professionalAssessments',
              'rightsConfirmed',
              'recordedByUid: identity.uid',
              'auditTrail',
              'metadataAuditTrail',
              'lastUpdatedByUid',
              'locked_pending_rights',
              'locked_or_link_only',
              'integrity_mismatch',
              'createRollbackSnapshot',
              'transferConfirmation',
              'bytesToBase64Chunked',
              'backup-large-file-patch.js?v=20260724-backup2',
          ]
          missing = [token for token in required if token not in text]
          if missing:
              raise SystemExit(f'UID isolation, rights, audit, or backup gates missing: {missing}')
          patch = Path('provider-assessment-demo/backup-large-file-patch.js').read_text(encoding='utf-8')
          if 'String.fromCharCode(...bytes)' in patch:
              raise SystemExit('Large encrypted backup encoding still spreads the full byte array')
          PY

      - name: Validate HTML links and unique identifiers
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit

          class Inspector(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = []
                  self.assets = set()
              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  if 'id' in values:
                      self.ids.append(values['id'])
                  raw = values.get('src') if tag == 'script' else values.get('href') if tag == 'link' else None
                  if raw:
                      self.assets.add(urlsplit(raw).path)

          base = Path('provider-assessment-demo')
          html = (base / 'index.html').read_text(encoding='utf-8')
          parser = Inspector()
          parser.feed(html)
          duplicates = sorted({item for item in parser.ids if parser.ids.count(item) > 1})
          if duplicates:
              raise SystemExit(f'Duplicate HTML ids: {duplicates}')
          expected = {
              'styles.css',
              'enhancements.css',
              'catalog.js',
              'catalog-extra.js',
              'professional-master-registry.js',
              'catalog-operational-v2.js',
              'app.js',
              'activation.js',
              'activation-guard.js',
              'enhancements.js',
              'institutional-live-v2.js',
          }
          missing = expected - parser.assets
          if missing:
              raise SystemExit(f'Missing published assets: {sorted(missing)}')
          dynamically_loaded = {
              'professional-record-lifecycle.js': 'professional-record-lifecycle',
              'professional-record-integrity.js': 'professional-record-integrity',
              'backup-integrity.js': 'backup-integrity',
              'backup-large-file-patch.js': 'backup-large-file-patch',
          }
          guard = (base / 'activation-guard.js').read_text(encoding='utf-8')
          for asset, marker in dynamically_loaded.items():
              if not (base / asset).exists():
                  raise SystemExit(f'Missing dynamic module: {asset}')
              if asset not in guard or marker not in guard:
                  raise SystemExit(f'Dynamic module is not wired: {asset}')
          combined = '\n'.join([
              html,
              (base / 'activation.js').read_text(encoding='utf-8'),
              guard,
              (base / 'professional-record-lifecycle.js').read_text(encoding='utf-8'),
              (base / 'professional-record-integrity.js').read_text(encoding='utf-8'),
              (base / 'backup-integrity.js').read_text(encoding='utf-8'),
              (base / 'backup-large-file-patch.js').read_text(encoding='utf-8'),
              (base / 'enhancements.js').read_text(encoding='utf-8'),
          ])
          required_text = [
              '20 أداة استكشافية',
              'مساحة مقدم الخدمة',
              'السجل المهني',
              'professionalAssessments',
              'تحديث الحالة',
              'تحرير البيانات',
              'طباعة السجل',
              'سجل الأحداث الموحد',
              'مراجعة النسخة قبل الاستيراد',
              'التراجع عن آخر استيراد',
          ]
          absent = [value for value in required_text if value not in combined]
          if absent:
              raise SystemExit(f'Missing operational user-visible features: {absent}')
          PY
