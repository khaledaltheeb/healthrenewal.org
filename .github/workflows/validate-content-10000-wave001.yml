name: Validate content 10000 wave001

on:
  push:
    branches:
      - agent/content-10000-master-wave001
    paths:
      - 'content/strategy/content-10000-master-plan-v1.json'
      - 'content/strategy/source-registry-wave001-v1.json'
      - 'scripts/publish_content_10000_wave001.py'
      - '.github/workflows/validate-content-10000-wave001.yml'
  pull_request:
    paths:
      - 'content/strategy/content-10000-master-plan-v1.json'
      - 'content/strategy/source-registry-wave001-v1.json'
      - 'scripts/publish_content_10000_wave001.py'
      - '.github/workflows/validate-content-10000-wave001.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile publisher
        run: python -m py_compile scripts/publish_content_10000_wave001.py
      - name: Build isolated wave
        run: |
          set -euo pipefail
          rm -rf /tmp/content-wave001
          mkdir -p /tmp/content-wave001
          python scripts/publish_content_10000_wave001.py /tmp/content-wave001
      - name: Validate editorial, source, SEO and duplication contract
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          root = Path('/tmp/content-wave001')
          section = root / 'care-guides/clinical-literacy'
          pages = sorted(section.glob('*/index.html'))
          assert len(pages) == 66, len(pages)
          assert (section / 'index.html').is_file()
          titles, descriptions, canonicals = [], [], []
          paragraph_sets = {}
          minimum_words = 10**9
          minimum_sources = 10**9
          for page in pages:
              source = page.read_text(encoding='utf-8')
              visible = re.sub(r'\s+', ' ', re.sub(r'<[^>]+>', ' ', source)).strip()
              wc = len(re.findall(r'[\w\u0600-\u06ff]+', visible, re.UNICODE))
              minimum_words = min(minimum_words, wc)
              assert wc >= 1100, (page, wc)
              assert source.count('<!-- content-10000-wave001 -->') == 1, page
              assert 'index,follow' in source, page
              assert 'application/ld+json' in source, page
              assert 'BreadcrumbList' in source, page
              assert 'المصادر الأساسية للتحقق والتوسع' in source, page
              assert 'محتوى تثقيفي غير تشخيصي' in source, page
              source_count = source.count('rel="noopener noreferrer"')
              minimum_sources = min(minimum_sources, source_count)
              assert source_count >= 3, (page, source_count)
              titles.append(re.search(r'<title>(.*?)</title>', source, re.S).group(1))
              descriptions.append(re.search(r'<meta name="description" content="([^"]+)"', source).group(1))
              canonicals.append(re.search(r'<link rel="canonical" href="([^"]+)"', source).group(1))
              paras = {
                  re.sub(r'\s+', ' ', re.sub(r'<[^>]+>', ' ', p)).strip()
                  for p in re.findall(r'<p\b[^>]*>(.*?)</p>', source, re.S | re.I)
              }
              paragraph_sets[page.parent.name] = {p for p in paras if len(p) >= 80}
          assert len(set(titles)) == len(pages)
          assert len(set(descriptions)) == len(pages)
          assert len(set(canonicals)) == len(pages)
          names = sorted(paragraph_sets)
          worst = (0.0, '', '')
          for i, left in enumerate(names):
              a = paragraph_sets[left]
              for right in names[i+1:]:
                  b = paragraph_sets[right]
                  union = a | b
                  score = len(a & b) / len(union) if union else 1.0
                  if score > worst[0]: worst = (score, left, right)
          assert worst[0] < 0.60, worst
          print({'status':'passed','pages':len(pages),'minimumWords':minimum_words,'minimumSources':minimum_sources,'maxParagraphJaccard':round(worst[0],4)})
          PY
      - name: Upload wave artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-10000-wave001-${{ github.run_id }}
          path: /tmp/content-wave001
          retention-days: 30
