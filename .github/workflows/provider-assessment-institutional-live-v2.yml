name: Validate provider assessment institutional live v2

on:
  push:
    branches: ["main"]
    paths:
      - "provider-assessment-demo/**"
      - ".github/workflows/provider-assessment-institutional-live-v2.yml"
  pull_request:
    paths:
      - "provider-assessment-demo/**"
      - ".github/workflows/provider-assessment-institutional-live-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provider-assessment-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-live-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check provider-assessment-demo/catalog-operational-v2.js
          node --check provider-assessment-demo/institutional-live-v2.js
          node --check provider-assessment-demo/sw-live-v2.js
          node --check provider-assessment-demo/activation.js
          node --check provider-assessment-demo/activation-guard.js
          node --check provider-assessment-demo/professional-record-lifecycle.js
          node --check provider-assessment-demo/professional-record-integrity.js
          node --check provider-assessment-demo/backup-integrity.js
          node --check provider-assessment-demo/backup-large-file-patch.js
          node --check provider-assessment-demo/conditions/conditions-data-v1.js
          node --check provider-assessment-demo/condition-entry-v1.js
          node --check provider-assessment-demo/professional-templates-v1.js
          node --check provider-assessment-demo/case-report-v1.js
          node --check provider-assessment-demo/case-report-interpretation-v2.js
          node --check provider-assessment-demo/training/training-v1.js
          node --check provider-assessment-demo/training/training-accessibility-v2.js

      - name: Validate operational registry and release assets
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const base = 'provider-assessment-demo/';
          const required = [
            'index.html','catalog.js','catalog-extra.js','professional-master-registry.js',
            'catalog-operational-v2.js','app.js','activation.js','activation-guard.js',
            'professional-record-lifecycle.js','professional-record-integrity.js','backup-integrity.js',
            'backup-large-file-patch.js','enhancements.js','conditions/conditions-data-v1.js',
            'condition-entry-v1.js','professional-templates-v1.js','case-report-v1.js',
            'case-report-interpretation-v2.js','institutional-live-v2.js','sw-live-v2.js',
            'training/index.html','training/training-v1.js','training/training-accessibility-v2.js'
          ];
          for (const file of required) if (!fs.existsSync(base + file)) throw new Error(`Missing ${file}`);
          const html = fs.readFileSync(base + 'index.html','utf8');
          for (const marker of [
            '<html lang="ar" dir="rtl"','2026.07.24-live.7','catalog-operational-v2.js?v=20260724-live7',
            'case-report-v1.js?v=20260724-live7','case-report-interpretation-v2.js?v=20260724-live7',
            'institutional-live-v2.js?v=20260724-live7','المقاييس والفحوص والبروتوكولات المهنية الفعّالة'
          ]) if (!html.includes(marker)) throw new Error(`Missing live marker ${marker}`);
          for (const forbidden of ['مقفل','دليل فقط','النسخة التجريبية المنشورة']) {
            if (html.includes(forbidden)) throw new Error(`Forbidden stale static UI text: ${forbidden}`);
          }
          const context = { window: {} };
          vm.runInNewContext(fs.readFileSync(base + 'catalog.js','utf8'), context);
          vm.runInNewContext(fs.readFileSync(base + 'catalog-extra.js','utf8'), context);
          vm.runInNewContext(fs.readFileSync(base + 'professional-master-registry.js','utf8'), context);
          vm.runInNewContext(fs.readFileSync(base + 'catalog-operational-v2.js','utf8'), context);
          const data = context.window.PA_DEMO_DATA;
          if (!data || data.explorers.length !== 20) throw new Error(`Expected 20 exploratory tools, found ${data?.explorers?.length}`);
          if (data.professional.length < 150) throw new Error(`Professional registry too small: ${data.professional.length}`);
          if (data.professional.some(item => !item.operational)) throw new Error('Non-operational professional directory entries remain');
          if (data.professional.some(item => !['locked','external'].includes(item.status))) throw new Error('Unexpected rights-gated source registry status remains');
          if (data.professional.some(item => item.status === 'locked' && item.activationStatus !== 'locked_pending_rights')) throw new Error('Locked professional entry lacks the rights activation gate');
          if (data.professional.some(item => item.status === 'external' && item.activationStatus !== 'external_result_workflow')) throw new Error('External-result entry lacks the external report workflow');
          const institutional = fs.readFileSync(base + 'institutional-live-v2.js','utf8');
          for (const marker of ['role(tablist, "tablist")','"tab"','"tabpanel"','aria-controls','aria-labelledby','تبقى المقاييس المحمية مقفلة']) {
            if (!institutional.includes(marker) && !institutional.includes(marker.replace('role(', 'setRole('))) throw new Error(`Institutional rights or ARIA marker missing: ${marker}`);
          }
          for (const forbidden of ['["مقفل", "مسار عمل متاح"]','["دليل فقط", "مسار عمل متاح"]']) {
            if (institutional.includes(forbidden)) throw new Error(`Institutional runtime still hides a protected-tool state: ${forbidden}`);
          }
          const training = fs.readFileSync(base + 'training/index.html','utf8');
          for (const marker of ['training-accessibility-v2.js?v=20260724-a11y2','training-data-v1.js?v=20260724-training1" defer','training-v1.js?v=20260724-training1" defer']) {
            if (!training.includes(marker)) throw new Error(`Training accessibility marker missing: ${marker}`);
          }
          const progress = fs.readFileSync(base + 'training/training-accessibility-v2.js','utf8');
          for (const marker of ['role", "progressbar"','aria-valuemin','aria-valuemax','aria-valuenow','aria-valuetext']) {
            if (!progress.includes(marker)) throw new Error(`Training progress contract missing: ${marker}`);
          }
          const conditionContext = { window: {} };
          vm.runInNewContext(fs.readFileSync(base + 'conditions/conditions-data-v1.js','utf8'), conditionContext);
          if (conditionContext.window.PA_CONDITION_PATHWAYS?.conditions?.length !== 20) throw new Error('Twenty-condition registry missing');
          console.log({explorers:data.explorers.length, professional:data.professional.length, conditions:20, rights:'gated', tabs:'semantic', progressbars:'semantic', release:'2026.07.24-live.7'});
          NODE

      - name: Validate UID, rights, audit, backup and report contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [
              'app.js','activation.js','activation-guard.js','institutional-live-v2.js',
              'professional-record-lifecycle.js','professional-record-integrity.js',
              'backup-integrity.js','backup-large-file-patch.js','condition-entry-v1.js',
              'professional-templates-v1.js','case-report-v1.js','case-report-interpretation-v2.js'
          ]
          text='\n'.join(Path('provider-assessment-demo',p).read_text(encoding='utf-8') for p in files)
          required=[
              'storeKey=u=>`pa-demo-store-v${V}:${u}`','professionalAssessments',
              'recordedByUid: identity.uid','rightsConfirmed','MutationObserver',
              'serviceWorker.register','auditTrail','metadataAuditTrail',
              'practitionerQualification','resultSourceType','reportReference',
              'recordEvents','printableDocument','codes[codes.length - 1]',
              'locked_pending_rights','locked_or_link_only','pa-demo-uid-backup-v2',
              'pa-demo-uid-backup-encrypted-v1','PBKDF2_ITERATIONS','AES-GCM',
              'SHA-256','stableStringify','integrity_mismatch','createRollbackSnapshot',
              'conflictReport','transferConfirmation','importHistory','backup-integrity.js?v=20260724-backup1',
              'backup-large-file-patch.js?v=20260724-backup2','CHUNK_SIZE','bytesToBase64Chunked',
              'case-report-interpretation-v2.js','PA_REPORT_INTERPRETATION_CONTRACT',
              'assessmentType','resultValidity','interpretationLimitations','baselineIndicator',
              'measurableGoal','remeasurementDate','familySummary','reviewAuditTrail','supersedesReportId'
          ]
          missing=[x for x in required if x not in text]
          if missing: raise SystemExit({'missing':missing})
          forbidden=['fetch("http','fetch(\'http','XMLHttpRequest','WebSocket','sendBeacon(','eval(','new Function(']
          found=[x for x in forbidden if x in text]
          if found: raise SystemExit({'unexpected_unsafe_api':found})
          lifecycle=Path('provider-assessment-demo/professional-record-lifecycle.js').read_text(encoding='utf-8')
          if 'card.querySelector(".code.small")?.textContent' in lifecycle:
              raise SystemExit('Lifecycle still selects the case id instead of the professional record id')
          integrity=Path('provider-assessment-demo/professional-record-integrity.js').read_text(encoding='utf-8')
          for protected in ['toolId','toolName','category','recordStatus','recordedAt','recordedByUid']:
              if f'"{protected}",' in integrity.split('const EDITABLE_FIELDS = [',1)[1].split('];',1)[0]:
                  raise SystemExit({'protected_field_became_editable':protected})
          backup=Path('provider-assessment-demo/backup-integrity.js').read_text(encoding='utf-8')
          for gate in ['payload.integrity?.digest','actual !== expected','sourceUid !== identity.uid','typed !== identity.uid','createRollbackSnapshot()','mode === "merge"']:
              if gate not in backup: raise SystemExit({'missing_backup_gate':gate})
          report=Path('provider-assessment-demo/case-report-interpretation-v2.js').read_text(encoding='utf-8')
          for gate in ['data.assessmentType === "screening"','form.reportValidity()','form.elements.reportId.value = ""','computeChangedFields','reviewAuditTrail','external-results-and-official-integrations-only-for-protected-instruments']:
              if gate not in report: raise SystemExit({'missing_report_gate':gate})
          patch=Path('provider-assessment-demo/backup-large-file-patch.js').read_text(encoding='utf-8')
          if 'String.fromCharCode(...bytes)' in patch:
              raise SystemExit('Large encrypted backup patch still spreads the full byte array')
          for gate in ['CHUNK_SIZE = 0x8000','bytes.subarray(offset','event.stopImmediatePropagation()','crypto.subtle.encrypt']:
              if gate not in patch: raise SystemExit({'missing_large_backup_gate':gate})
          print({'uid':'isolated','rights':'gated','lifecycle':'audited','metadata_edits':'audited','backup_digest':'sha256','report_types':4,'report_revisions':'immutable','family_summary':'required_for_reviewed','release':'live.7'})
          PY
