name: Validate provider assessment institutional live v2

on:
  push:
    branches: ["main"]
    paths:
      - "provider-assessment-demo/**"
      - ".github/workflows/provider-assessment-institutional-live-v2.yml"
  pull_request:
    paths:
      - "provider-assessment-demo/**"
      - ".github/workflows/provider-assessment-institutional-live-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provider-assessment-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-live-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check provider-assessment-demo/catalog-operational-v2.js
          node --check provider-assessment-demo/institutional-live-v2.js
          node --check provider-assessment-demo/sw-live-v2.js
          node --check provider-assessment-demo/activation.js
          node --check provider-assessment-demo/activation-guard.js
          node --check provider-assessment-demo/professional-record-lifecycle.js
          node --check provider-assessment-demo/professional-record-integrity.js
      - name: Validate operational registry and release assets
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const base = 'provider-assessment-demo/';
          const required = [
            'index.html','catalog.js','catalog-extra.js','professional-master-registry.js',
            'catalog-operational-v2.js','app.js','activation.js','activation-guard.js',
            'professional-record-lifecycle.js','professional-record-integrity.js',
            'enhancements.js','institutional-live-v2.js','sw-live-v2.js'
          ];
          for (const file of required) if (!fs.existsSync(base + file)) throw new Error(`Missing ${file}`);
          const html = fs.readFileSync(base + 'index.html','utf8');
          for (const marker of [
            '2026.07.24-live.2','catalog-operational-v2.js?v=20260724-live2',
            'institutional-live-v2.js?v=20260724-live2','المقاييس والفحوص والبروتوكولات المهنية الفعّالة'
          ]) if (!html.includes(marker)) throw new Error(`Missing live marker ${marker}`);
          for (const forbidden of ['مقفل','دليل فقط','النسخة التجريبية المنشورة']) {
            if (html.includes(forbidden)) throw new Error(`Forbidden stale UI text: ${forbidden}`);
          }
          const context = { window: {} };
          vm.runInNewContext(fs.readFileSync(base + 'catalog.js','utf8'), context);
          vm.runInNewContext(fs.readFileSync(base + 'catalog-extra.js','utf8'), context);
          vm.runInNewContext(fs.readFileSync(base + 'professional-master-registry.js','utf8'), context);
          vm.runInNewContext(fs.readFileSync(base + 'catalog-operational-v2.js','utf8'), context);
          const data = context.window.PA_DEMO_DATA;
          if (!data || data.explorers.length !== 20) throw new Error(`Expected 20 exploratory tools, found ${data?.explorers?.length}`);
          if (data.professional.length < 150) throw new Error(`Professional registry too small: ${data.professional.length}`);
          if (data.professional.some(item => !item.operational)) throw new Error('Non-operational professional entries remain');
          if (data.professional.some(item => item.status === 'locked')) throw new Error('Locked source registry states remain');
          if (data.professional.some(item => !['workflow','external'].includes(item.status))) throw new Error('Unexpected source registry status remains');
          console.log({explorers:data.explorers.length, professional:data.professional.length, release:context.window.PA_OPERATIONAL_RELEASE});
          NODE
      - name: Validate UID, rights, lifecycle, and record-integrity contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [
              'app.js','activation.js','activation-guard.js','institutional-live-v2.js',
              'professional-record-lifecycle.js','professional-record-integrity.js'
          ]
          text='\n'.join(Path('provider-assessment-demo',p).read_text(encoding='utf-8') for p in files)
          required=[
              'storeKey=u=>`pa-demo-store-v${V}:${u}`','professionalAssessments',
              'recordedByUid: identity.uid','rightsConfirmed','MutationObserver',
              'serviceWorker.register','auditTrail','metadataAuditTrail',
              'practitionerQualification','resultSourceType','reportReference',
              'recordEvents','printableDocument','codes[codes.length - 1]',
              'locked_pending_rights','locked_or_link_only'
          ]
          missing=[x for x in required if x not in text]
          if missing: raise SystemExit({'missing':missing})
          forbidden=['fetch("http','fetch(\'http','XMLHttpRequest','WebSocket','sendBeacon(']
          found=[x for x in forbidden if x in text]
          if found: raise SystemExit({'unexpected_network_api':found})
          lifecycle=Path('provider-assessment-demo/professional-record-lifecycle.js').read_text(encoding='utf-8')
          if 'card.querySelector(".code.small")?.textContent' in lifecycle:
              raise SystemExit('Lifecycle still selects the case id instead of the professional record id')
          integrity=Path('provider-assessment-demo/professional-record-integrity.js').read_text(encoding='utf-8')
          for protected in ['toolId','toolName','category','recordStatus','recordedAt','recordedByUid']:
              if f'"{protected}",' in integrity.split('const EDITABLE_FIELDS = [',1)[1].split('];',1)[0]:
                  raise SystemExit({'protected_field_became_editable':protected})
          print({'uid':'isolated','rights':'gated','lifecycle':'audited','metadata_edits':'audited','printing':'enabled'})
          PY
