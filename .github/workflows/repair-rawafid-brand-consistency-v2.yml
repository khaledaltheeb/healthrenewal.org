name: Repair Rawafid brand consistency v2

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: rawafid-brand-consistency-v2-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repair-and-audit:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/rawafid-brand-consistency-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/rawafid-brand-consistency-v2
          fetch-depth: 0

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile consistency tools
        run: |
          python -m py_compile \
            scripts/rawafid_brand_consistency.py \
            scripts/rawafid_brand_runner.py \
            scripts/repair_homepage_heading_semantics.py \
            scripts/normalize_platform_shell.py \
            scripts/sitecustomize.py \
            scripts/apply_rawafid_brand.py \
            scripts/verify_homepage_v19.py

      - name: Repair homepage heading semantics
        run: |
          python scripts/repair_homepage_heading_semantics.py index.html --fix
          python scripts/repair_homepage_heading_semantics.py index.html

      - name: Apply initial Rawafid normalization
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys

          sys.path.insert(0, 'scripts')
          from rawafid_brand_runner import normalize_root

          report = normalize_root(Path('.'), fix=True, production=False)
          raise SystemExit(0 if report.status == 'passed' else 1)
          PY

      - name: Converge shared platform shell
        run: |
          python scripts/normalize_platform_shell.py --no-report
          python scripts/normalize_platform_shell.py --no-report

      - name: Finalize and audit Rawafid identity
        run: |
          python - <<'PY'
          import json
          from dataclasses import asdict
          from pathlib import Path
          import sys

          sys.path.insert(0, 'scripts')
          from rawafid_brand_runner import normalize_root

          report = normalize_root(
              Path('.'),
              fix=True,
              production=False,
              report_path=Path('reports/rawafid-brand-consistency-v2.json'),
          )
          print(json.dumps(asdict(report), ensure_ascii=False, indent=2))
          raise SystemExit(0 if report.status == 'passed' else 1)
          PY

      - name: Validate platform shell and homepage contracts
        run: |
          python scripts/normalize_platform_shell.py --check --no-report
          python scripts/repair_homepage_heading_semantics.py index.html
          python scripts/verify_homepage_v19.py

      - name: Validate report contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('reports/rawafid-brand-consistency-v2.json').read_text(encoding='utf-8'))
          assert report['status'] == 'passed', report
          assert report['legacy_occurrences'] == 0, report
          assert report['html_duplicate_meta_tags'] == 0, report
          assert report['files_needing_changes'] == 0, report
          assert report['manifest_valid'] is True, report
          assert report['missing_assets'] == [], report
          print(report)
          PY

      - name: Commit deterministic repairs
        run: |
          git config user.name "Rawafid Consistency Automation"
          git config user.email "actions@users.noreply.github.com"
          git restore --source=HEAD --worktree --staged .github
          git restore --source=HEAD --worktree --staged reports/rawafid-brand-consistency-v2.json || true
          git add -A
          if git diff --cached --quiet; then
            echo "No consistency changes to commit"
            exit 0
          fi
          git commit -m "fix(brand): converge identity, metadata and semantic shell"
          git push origin HEAD:fix/rawafid-brand-consistency-v2
