name: Deploy password reset Worker v10

on:
  push:
    branches: ["main"]
    paths:
      - "specialists-partners/password-reset-worker/**"
      - ".github/workflows/deploy-password-reset-worker-v10.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-password-reset-worker-v10
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '826ac34927c1e045c06145a327c2ac52' }}
      WORKER_NAME: pterminology-password-reset
      WORKER_URL: https://pterminology-password-reset.pterminology-826ac349.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate Worker source
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]] || { echo "::error::CLOUDFLARE_API_TOKEN missing"; exit 1; }
          node --check specialists-partners/password-reset-worker/src/index.js
          grep -q "pterminology-password-reset-worker-v10" specialists-partners/password-reset-worker/src/index.js
          grep -q "IDENTITY_RESET_URL" specialists-partners/password-reset-worker/src/index.js
          ! grep -q "console.log" specialists-partners/password-reset-worker/src/index.js

      - name: Deploy isolated reset gateway
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/wrangler.toml <<EOF
          name = "${WORKER_NAME}"
          main = "${GITHUB_WORKSPACE}/specialists-partners/password-reset-worker/src/index.js"
          compatibility_date = "2026-07-01"
          workers_dev = true
          EOF
          cd /tmp
          npx --yes wrangler@4 deploy --config /tmp/wrangler.toml

      - name: Verify live gateway and identity proxy
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          for attempt in {1..60}; do
            stamp="$(date +%s)"
            health_status="$(curl -sS --max-time 20 -o /tmp/health.json -w '%{http_code}' "${WORKER_URL}/health?probe=${stamp}" || true)"
            page_status="$(curl -sS --max-time 20 -o /tmp/page.html -w '%{http_code}' "${WORKER_URL}/?v=10&probe=${stamp}" || true)"
            if [[ "${health_status}" == "200" && "${page_status}" == "200" ]] \
              && grep -q 'pterminology-password-reset' /tmp/health.json \
              && grep -q 'بوابة Cloudflare الآمنة' /tmp/page.html \
              && grep -q 'pterminology-password-reset-worker-v10' /tmp/page.html \
              && grep -q "fetch('/submit'" /tmp/page.html; then
              ready=true
              break
            fi
            sleep 5
          done
          [[ "${ready}" == "true" ]] || { echo "::error::Password reset gateway did not become ready"; exit 1; }

          proxy_status="$(curl -sS --max-time 30 -o /tmp/proxy.json -w '%{http_code}' -X POST \
            -H "Origin: ${WORKER_URL}" \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json;charset=UTF-8' \
            --data '{"token":"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA","password":"Temporary!Pass123"}' \
            "${WORKER_URL}/submit" || true)"
          export PROXY_STATUS="${proxy_status}"
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          health=json.loads(Path('/tmp/health.json').read_text(encoding='utf-8'))
          proxy=json.loads(Path('/tmp/proxy.json').read_text(encoding='utf-8'))
          report={
            'schema_version':1,
            'checked_at':datetime.now(timezone.utc).isoformat(),
            'worker_url':'https://pterminology-password-reset.pterminology-826ac349.workers.dev',
            'health_http_status':200,
            'page_http_status':200,
            'proxy_http_status':int(os.environ['PROXY_STATUS']),
            'service':health.get('service'),
            'version':health.get('version'),
            'proxy_error':proxy.get('error'),
            'passed':health.get('ok') is True and health.get('version')=='1.0.0' and int(os.environ['PROXY_STATUS'])==401 and proxy.get('error')=='invalid_reset_token'
          }
          assert report['passed'], report
          Path('reports/password-reset-worker-v10-production.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY

      - name: Commit safe production receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/password-reset-worker-v10-production.json
          git commit -m "chore: record password reset Worker v10 production"
          git pull --rebase origin main
          git push origin HEAD:main
