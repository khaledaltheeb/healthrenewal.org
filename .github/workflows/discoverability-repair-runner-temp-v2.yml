name: Temporary compact discoverability repair runner

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  repair:
    if: github.event.issue.title == '[release] repair hidden page cards v2'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply and test
        run: |
          set -euo pipefail
          python scripts/repair_discoverability_cards_v1.py
          python -m pytest -q tests/test_user_discoverability_cards_v1.py
      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/platform/platform-core.css sections/index.html learning-paths/index.html provider-assessment-demo/index.html special-needs/index.html special-needs/assistive-technology/index.html tests/test_user_discoverability_cards_v1.py
          if ! git diff --cached --quiet; then git commit -m 'fix(navigation): expose hidden pages with section cards'; fi
          for attempt in $(seq 1 8); do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            git reset --hard origin/main
            python scripts/repair_discoverability_cards_v1.py
            python -m pytest -q tests/test_user_discoverability_cards_v1.py
            git add assets/platform/platform-core.css sections/index.html learning-paths/index.html provider-assessment-demo/index.html special-needs/index.html special-needs/assistive-technology/index.html tests/test_user_discoverability_cards_v1.py
            git commit -m 'fix(navigation): expose hidden pages with section cards'
            sleep $((attempt * 2))
          done
          exit 1
      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python - <<'PY' >/tmp/body.json
          import json,os
          ok=os.environ.get('JOB_STATUS')=='success'
          print(json.dumps({'body':f"## تطبيق بطاقات الاكتشاف\n\nالحالة: **{'passed' if ok else 'failed'}**\n\n- البطاقات المستهدفة: **16**\n- الفهارس المستهدفة: **5**\n- الاختبار الدائم: `tests/test_user_discoverability_cards_v1.py`"},ensure_ascii=False))
          PY
          curl -fsSL -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" --data-binary @/tmp/body.json
