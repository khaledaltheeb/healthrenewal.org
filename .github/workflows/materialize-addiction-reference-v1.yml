name: Materialize Arabic addiction reference

on:
  push:
    branches:
      - agent/addiction-reference-arabic-20260803
    paths:
      - .github/workflows/materialize-addiction-reference-v1.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-addiction-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out requested branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Materialize and validate section
        run: python scripts/materialize_addiction_reference_v1.py

      - name: Commit generated reference
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "healthrenewal-content-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No materialized changes were produced."
            exit 1
          fi
          git commit -m "content: add evidence-based Arabic addiction reference"
          git push origin "HEAD:${GITHUB_REF_NAME}"
