name: Publish capabilities library v280

on:
  workflow_run:
    workflows: ["Audit production discovery contract v220"]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: capabilities-v280-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  publish-capabilities:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout the audited source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download the exact discovery-audited artifact
        uses: actions/download-artifact@v4
        with:
          name: validated-production-site
          path: validated-site
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate structured evidence and publisher contracts
        run: |
          set -euxo pipefail
          python -m json.tool content/v280/capabilities-100-ar.json >/dev/null
          for profile in content/v280/profiles/*.json; do python -m json.tool "$profile" >/dev/null; done
          for evidence in content/v280/evidence/*.json; do python -m json.tool "$evidence" >/dev/null; done
          python -m py_compile scripts/build_capabilities_evidence_v280.py scripts/publish_capabilities_v280.py tests/test_capabilities_v280.py
          node --check assets/js/capabilities-v280.js
          python - <<'PY'
          import unittest
          from tests import test_capabilities_v280 as module

          loaded = unittest.defaultTestLoader.loadTestsFromModule(module)
          filtered = unittest.TestSuite()

          def visit(suite):
              for test in suite:
                  if isinstance(test, unittest.TestSuite):
                      visit(test)
                  elif test._testMethodName != 'test_main_build_pipeline_invokes_v280_after_provider_pathways':
                      filtered.addTest(test)

          visit(loaded)
          result = unittest.TextTestRunner(verbosity=2).run(filtered)
          if not result.wasSuccessful():
              raise SystemExit(1)
          PY
          python - <<'PY'
          from pathlib import Path
          workflow=Path('.github/workflows/publish-capabilities-v280.yml').read_text(encoding='utf-8')
          assert 'python scripts/publish_capabilities_v280.py validated-site' in workflow
          assert 'Audit production discovery contract v220' in workflow
          print({'integration':'post-audit-artifact','publisher':'v280'})
          PY

      - name: Publish all 100 condition protocols into the audited artifact
        run: |
          set -euxo pipefail
          python scripts/publish_capabilities_v280.py validated-site > /tmp/capabilities-v280.json
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('validated-site')
          report=json.loads((root/'api/capabilities-v280.json').read_text(encoding='utf-8'))
          assert report['version']==280 and report['status']=='passed',report
          assert report['condition_count']==100,report
          assert report['detailed_guide_count']==100,report
          assert report['generated_page_count']==104,report
          assert report['sitemap_url_count']==104,report
          assert report['source_count']==132,report
          assert report['curated_evidence_packet_count']==100,report
          assert report['curated_evidence_claim_count']==300,report
          assert report['curated_evidence_source_count']==112,report
          assert report['curated_evidence_remaining_count']==0,report
          assert report['external_clinical_review_completed'] is False,report
          assert report['diagnostic_automation'] is False,report
          pages=list((root/'capabilities').rglob('index.html'))
          assert len(pages)==104,len(pages)
          for path in pages:
              text=path.read_text(encoding='utf-8')
              assert text.count('<h1')==1,path
              assert 'لا توجد مصادقة أو مراجعة خارجية مستقلة' in text,path
              assert 'معاقين' not in text,path
          assert (root/'capabilities/autism/index.html').is_file()
          assert (root/'capabilities/down-syndrome/index.html').is_file()
          assert (root/'capabilities/cerebral-palsy/index.html').is_file()
          print({'pages':len(pages),'conditions':100,'sources':132,'claims':300})
          PY

      - name: Re-finalize PWA metadata platform shell sitemap coverage and deployment evidence
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euxo pipefail
          python scripts/finalize_pwa_v14.py validated-site
          GITHUB_SHA="${RELEASE_SHA}" GITHUB_RUN_ID="${GITHUB_RUN_ID}" python scripts/stamp_deployment_v29.py validated-site
          python scripts/audit_orphan_pages_v197.py validated-site --fail-on-critical --require-gateways
          python scripts/audit_content_quality_v32.py validated-site
          python - <<'PY'
          import hashlib,json,os,re
          from pathlib import Path
          root=Path('validated-site')
          deployment=json.loads((root/'deployment.json').read_text(encoding='utf-8'))
          report=json.loads((root/'api/capabilities-v280.json').read_text(encoding='utf-8'))
          discovery=json.loads((root/'api/orphan-page-audit-v197.json').read_text(encoding='utf-8'))
          assert deployment['schema_version']==30,deployment
          assert deployment['commit']==os.environ['RELEASE_SHA'],deployment
          assert report['status']=='passed' and report['generated_page_count']==104,report
          assert discovery['status']=='passed',discovery
          for key in ('critical_orphans','critical_unmapped','missing_gateways','gateway_orphans','gateway_unmapped'):
              assert discovery.get(key)==[],(key,discovery.get(key))
          for name in ('index.html','sitemap.xml','manifest.webmanifest','sw.js'):
              path=root/name; evidence=deployment['artifacts'][name]
              assert hashlib.sha256(path.read_bytes()).hexdigest()==evidence['sha256'],name
              assert path.stat().st_size==evidence['bytes'],name
          sitemap=(root/'sitemap-capabilities.xml').read_text(encoding='utf-8')
          assert sitemap.count('<url>')==104,sitemap.count('<url>')
          assert (root/'sitemap.xml').read_text(encoding='utf-8').count('sitemap-capabilities.xml')==1
          print({'commit':deployment['commit'],'capability_pages':104,'discovery':'passed'})
          PY

      - name: Upload the capabilities-complete validated artifact
        uses: actions/upload-artifact@v4
        with:
          name: validated-production-site
          path: validated-site
          if-no-files-found: error
          retention-days: 7

      - name: Retain capability publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capabilities-v280-publication-evidence
          path: |
            validated-site/api/capabilities-v280.json
            validated-site/api/orphan-page-audit-v197.json
            validated-site/api/content-quality-v32.json
            validated-site/deployment.json
          if-no-files-found: warn
          retention-days: 30
