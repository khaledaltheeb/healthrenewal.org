name: Bootstrap healthrenewal Cloudflare zone

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-healthrenewal-cloudflare-zone.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  DOMAIN: healthrenewal.org
  WWW_DOMAIN: www.healthrenewal.org
  CLOUDFLARE_ACCOUNT_ID: 826ac34927c1e045c06145a327c2ac52
  GITHUB_PAGES_TARGET: khaledaltheeb.github.io

concurrency:
  group: bootstrap-healthrenewal-cloudflare-zone
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Create or discover zone and configure canonical records
        id: zone
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          API = "https://api.cloudflare.com/client/v4"
          TOKEN = os.environ["CLOUDFLARE_API_TOKEN"]
          ACCOUNT_ID = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          DOMAIN = os.environ["DOMAIN"]
          WWW = os.environ["WWW_DOMAIN"]
          TARGET = os.environ["GITHUB_PAGES_TARGET"]

          def request(method: str, path: str, payload=None):
              body = None if payload is None else json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(
                  API + path,
                  data=body,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {TOKEN}",
                      "Accept": "application/json",
                      "Content-Type": "application/json",
                      "User-Agent": "healthrenewal-zone-bootstrap/1.0",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=45) as response:
                      data = json.load(response)
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode("utf-8", errors="replace")
                  raise SystemExit(f"Cloudflare API {method} {path} failed: HTTP {exc.code}: {detail[:1200]}")
              if not data.get("success"):
                  raise SystemExit(f"Cloudflare API {method} {path} failed: {data.get('errors')}")
              return data

          query = urllib.parse.urlencode({"name": DOMAIN, "account.id": ACCOUNT_ID, "per_page": 50})
          zones = request("GET", f"/zones?{query}").get("result", [])
          created = False
          if not zones:
              result = request(
                  "POST",
                  "/zones",
                  {
                      "name": DOMAIN,
                      "account": {"id": ACCOUNT_ID},
                      "type": "full",
                      "jump_start": True,
                  },
              ).get("result")
              if not result:
                  raise SystemExit("Cloudflare returned no zone after creation")
              zone = result
              created = True
              time.sleep(8)
          elif len(zones) == 1:
              zone = zones[0]
          else:
              raise SystemExit({"multiple_matching_zones": [(z.get('id'), z.get('status')) for z in zones]})

          zone_id = zone["id"]
          zone = request("GET", f"/zones/{zone_id}").get("result", zone)
          records = request("GET", f"/zones/{zone_id}/dns_records?per_page=500").get("result", [])
          Path("cloudflare-zone-before.json").write_text(json.dumps(records, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          desired = [
              {"type": "A", "name": DOMAIN, "content": "185.199.108.153", "ttl": 3600, "proxied": False},
              {"type": "A", "name": DOMAIN, "content": "185.199.109.153", "ttl": 3600, "proxied": False},
              {"type": "A", "name": DOMAIN, "content": "185.199.110.153", "ttl": 3600, "proxied": False},
              {"type": "A", "name": DOMAIN, "content": "185.199.111.153", "ttl": 3600, "proxied": False},
              {"type": "AAAA", "name": DOMAIN, "content": "2606:50c0:8000::153", "ttl": 3600, "proxied": False},
              {"type": "AAAA", "name": DOMAIN, "content": "2606:50c0:8001::153", "ttl": 3600, "proxied": False},
              {"type": "AAAA", "name": DOMAIN, "content": "2606:50c0:8002::153", "ttl": 3600, "proxied": False},
              {"type": "AAAA", "name": DOMAIN, "content": "2606:50c0:8003::153", "ttl": 3600, "proxied": False},
              {"type": "CNAME", "name": WWW, "content": TARGET, "ttl": 3600, "proxied": False},
          ]
          desired_keys = {(r["type"], r["name"], r["content"]) for r in desired}
          managed_names = {DOMAIN, WWW}
          managed_types = {"A", "AAAA", "CNAME"}

          for record in records:
              key = (
                  record.get("type"),
                  str(record.get("name", "")).rstrip("."),
                  str(record.get("content", "")).rstrip("."),
              )
              if key[1] in managed_names and key[0] in managed_types:
                  request("DELETE", f"/zones/{zone_id}/dns_records/{record['id']}")

          for item in desired:
              payload = dict(item)
              payload["comment"] = "Canonical GitHub Pages record managed by healthrenewal zone bootstrap"
              request("POST", f"/zones/{zone_id}/dns_records", payload)

          after = request("GET", f"/zones/{zone_id}/dns_records?per_page=500").get("result", [])
          Path("cloudflare-zone-after.json").write_text(json.dumps(after, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          actual = {
              (
                  r.get("type"),
                  str(r.get("name", "")).rstrip("."),
                  str(r.get("content", "")).rstrip("."),
              )
              for r in after
              if str(r.get("name", "")).rstrip(".") in managed_names and r.get("type") in managed_types
          }
          if actual != desired_keys:
              raise SystemExit({"canonical_record_mismatch": {"desired": sorted(desired_keys), "actual": sorted(actual)}})

          mail_and_verification = [
              {
                  "type": r.get("type"),
                  "name": r.get("name"),
                  "content": r.get("content"),
                  "priority": r.get("priority"),
              }
              for r in after
              if r.get("type") in {"MX", "TXT", "CAA"}
          ]
          report = {
              "domain": DOMAIN,
              "zone_id": zone_id,
              "zone_created": created,
              "zone_status": zone.get("status"),
              "name_servers": zone.get("name_servers", []),
              "original_name_servers": zone.get("original_name_servers", []),
              "canonical_records": desired,
              "preserved_mail_verification_count": len(mail_and_verification),
              "preserved_mail_verification_records": mail_and_verification,
          }
          Path("cloudflare-zone-report.json").write_text(json.dumps(report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          output = os.environ["GITHUB_OUTPUT"]
          with open(output, "a", encoding="utf-8") as handle:
              handle.write(f"status={zone.get('status', 'unknown')}\n")
              handle.write(f"created={'true' if created else 'false'}\n")
              handle.write(f"zone_id={zone_id}\n")
              handle.write("nameservers=" + ",".join(zone.get("name_servers", [])) + "\n")
              handle.write(f"preserved={len(mail_and_verification)}\n")
          print(json.dumps({k: v for k, v in report.items() if k != "preserved_mail_verification_records"}, ensure_ascii=False))
          PY

      - name: Publish activation receipt
        env:
          GH_TOKEN: ${{ github.token }}
          ZONE_STATUS: ${{ steps.zone.outputs.status }}
          ZONE_CREATED: ${{ steps.zone.outputs.created }}
          ZONE_ID: ${{ steps.zone.outputs.zone_id }}
          NAMESERVERS: ${{ steps.zone.outputs.nameservers }}
          PRESERVED: ${{ steps.zone.outputs.preserved }}
        run: |
          set -euo pipefail
          title="Cloudflare DNS zone activation: healthrenewal.org"
          body=$(cat <<EOF
          ## Cloudflare DNS zone

          - **Domain:** healthrenewal.org
          - **Zone ID:** ${ZONE_ID}
          - **Created in this run:** ${ZONE_CREATED}
          - **Status:** ${ZONE_STATUS}
          - **Assigned nameservers:** ${NAMESERVERS}
          - **Preserved MX/TXT/CAA records:** ${PRESERVED}
          - **Canonical apex:** four GitHub Pages IPv4 and four IPv6 records
          - **Canonical www:** CNAME to khaledaltheeb.github.io
          - **Cloudflare proxy:** disabled for GitHub Pages certificate stability
          - **Run:** https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          If the status is `pending`, the registrar must replace the current Hostinger nameservers with the two assigned Cloudflare nameservers above. No email record is intentionally deleted by this workflow.
          EOF
          )
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state all --limit 100 --json number,title --jq ".[] | select(.title == \"${title}\") | .number" | head -n 1)
          if [ -z "$number" ]; then
            number=$(gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body" | sed -n 's#.*/##p')
          else
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          fi
          if [ "$ZONE_STATUS" = "active" ]; then
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" --reason completed --comment "Cloudflare zone is active and canonical records are configured." || true
          else
            gh issue reopen "$number" --repo "$GITHUB_REPOSITORY" || true
          fi

      - name: Upload zone evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: healthrenewal-cloudflare-zone-${{ github.run_id }}
          path: |
            cloudflare-zone-before.json
            cloudflare-zone-after.json
            cloudflare-zone-report.json
          if-no-files-found: warn
          retention-days: 30
