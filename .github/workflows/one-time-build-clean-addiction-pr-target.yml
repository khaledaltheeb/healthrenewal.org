name: One-time publish integrated addiction v3

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: one-time-publish-integrated-addiction-v3
  cancel-in-progress: false

jobs:
  publish-static-v3:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'automation/addiction-condition-guides-clean-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the exact reviewed branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Materialize checksum-verified static publication
        run: |
          set -euxo pipefail
          if [ -f api/addiction-condition-guides-v3.json ] && [ ! -f content/addiction-v3-static.tar.xz.b64 ]; then
            echo "Static v3 publication already exists."
            exit 0
          fi
          python scripts/materialize_addiction_v3_once.py
          test -f addiction/index.html
          test -f addiction/conditions/index.html
          test -f addiction/methodology/index.html
          test -f addiction/cannabis-use-disorder/index.html
          test -f addiction/opioid-use-disorder/index.html
          test -f addiction/nicotine-tobacco-dependence/index.html
          test -f addiction/sedative-benzodiazepine-use-disorder/index.html
          test -f api/addiction-condition-guides-v3.json
          test -f tests/test_addiction_condition_guides_v3.py
      - name: Remove temporary build inputs and obsolete one-time gates
        run: |
          set -euxo pipefail
          rm -f content/addiction-v3-static.tar.xz.b64
          rm -f scripts/materialize_addiction_v3_once.py
          rm -f scripts/build_clean_addiction_condition_guides_once.sh
          rm -rf diagnostics
          find .github/workflows -maxdepth 1 -type f -name 'one-time-*addiction*' -delete
          test ! -e content/addiction-v3-static.tar.xz.b64
          test ! -e scripts/materialize_addiction_v3_once.py
      - name: Execute the static safety and discovery contract
        run: |
          set -euxo pipefail
          python -m py_compile tests/test_addiction_condition_guides_v3.py
          python - <<'PY'
          import runpy
          namespace = runpy.run_path('tests/test_addiction_condition_guides_v3.py')
          tests = [
              value
              for name, value in sorted(namespace.items())
              if name.startswith('test_') and callable(value)
          ]
          if len(tests) != 2:
              raise SystemExit(f'Expected 2 v3 tests, found {len(tests)}')
          for test in tests:
              test()
              print(f'PASS {test.__name__}')
          PY
      - name: Commit visible static files to the pull-request branch
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euxo pipefail
          git config user.name "healthrenewal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git status --short
          if git diff --cached --quiet; then
            echo "No publication changes remain."
            exit 0
          fi
          git commit -m "feat(addiction): publish integrated Arabic addiction guides v3"
          git push origin HEAD:"${HEAD_BRANCH}"
