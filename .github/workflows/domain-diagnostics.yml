name: Domain diagnostics

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install diagnostic tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dnsutils jq

      - name: Collect DNS, HTTP, TLS, and GitHub Pages state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          mkdir -p /tmp/domain-audit

          echo '=== A: healthrenewal.org ==='
          dig +short A healthrenewal.org | sort -u | tee /tmp/domain-audit/apex-a.txt

          echo '=== AAAA: healthrenewal.org ==='
          dig +short AAAA healthrenewal.org | sort -u | tee /tmp/domain-audit/apex-aaaa.txt

          echo '=== CNAME: www.healthrenewal.org ==='
          dig +short CNAME www.healthrenewal.org | sort -u | tee /tmp/domain-audit/www-cname.txt

          echo '=== NS: healthrenewal.org ==='
          dig +short NS healthrenewal.org | sort -u | tee /tmp/domain-audit/ns.txt

          echo '=== HTTP status and final URLs ==='
          for url in \
            http://healthrenewal.org \
            https://healthrenewal.org \
            http://www.healthrenewal.org \
            https://www.healthrenewal.org \
            https://khaledaltheeb.github.io/pterminology-site/; do
            printf '%s -> ' "$url"
            curl -sS -L --max-time 30 -o /dev/null \
              -w 'status=%{http_code} final=%{url_effective} remote_ip=%{remote_ip}\n' \
              "$url" || true
          done | tee /tmp/domain-audit/http.txt

          echo '=== TLS certificate: apex ==='
          timeout 30 openssl s_client -connect healthrenewal.org:443 \
            -servername healthrenewal.org </dev/null 2>/dev/null \
            | openssl x509 -noout -subject -issuer -dates -ext subjectAltName \
            | tee /tmp/domain-audit/tls-apex.txt || true

          echo '=== TLS certificate: www ==='
          timeout 30 openssl s_client -connect www.healthrenewal.org:443 \
            -servername www.healthrenewal.org </dev/null 2>/dev/null \
            | openssl x509 -noout -subject -issuer -dates -ext subjectAltName \
            | tee /tmp/domain-audit/tls-www.txt || true

          echo '=== GitHub Pages API ==='
          curl -sS --max-time 30 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/khaledaltheeb/pterminology-site/pages \
            | tee /tmp/domain-audit/pages.json \
            | jq '{url,status,cname,custom_404,html_url,build_type,source,public,https_certificate,https_enforced}' || true

      - name: Validate required configuration
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          root = Path('/tmp/domain-audit')
          expected_ipv4 = {
              '185.199.108.153',
              '185.199.109.153',
              '185.199.110.153',
              '185.199.111.153',
          }

          def lines(name):
              p = root / name
              return {x.strip().rstrip('.') for x in p.read_text().splitlines() if x.strip()} if p.exists() else set()

          failures = []
          warnings = []

          apex_a = lines('apex-a.txt')
          if apex_a != expected_ipv4:
              failures.append(f'A records are {sorted(apex_a)}; expected {sorted(expected_ipv4)}')

          apex_aaaa = lines('apex-aaaa.txt')
          if apex_aaaa:
              warnings.append(f'AAAA records exist: {sorted(apex_aaaa)}; verify they are intentional GitHub Pages addresses')

          www_cname = lines('www-cname.txt')
          if www_cname != {'khaledaltheeb.github.io'}:
              failures.append(f'www CNAME is {sorted(www_cname)}; expected khaledaltheeb.github.io')

          http = (root / 'http.txt').read_text() if (root / 'http.txt').exists() else ''
          for url in ('https://healthrenewal.org', 'https://www.healthrenewal.org'):
              match = re.search(re.escape(url) + r' -> status=(\d{3})', http)
              if not match or not (200 <= int(match.group(1)) < 400):
                  failures.append(f'{url} is not returning a successful/redirect HTTP status')

          for filename, hostname in (('tls-apex.txt', 'healthrenewal.org'), ('tls-www.txt', 'www.healthrenewal.org')):
              text = (root / filename).read_text() if (root / filename).exists() else ''
              if hostname not in text:
                  failures.append(f'TLS certificate output does not cover {hostname}')

          pages_path = root / 'pages.json'
          try:
              pages = json.loads(pages_path.read_text())
          except Exception as exc:
              failures.append(f'Could not parse GitHub Pages API response: {exc}')
              pages = {}

          if pages.get('cname') != 'healthrenewal.org':
              failures.append(f"GitHub Pages cname is {pages.get('cname')!r}; expected 'healthrenewal.org'")
          if pages.get('status') not in {'built', 'building'}:
              failures.append(f"GitHub Pages status is {pages.get('status')!r}")
          if pages.get('https_enforced') is not True:
              failures.append('GitHub Pages HTTPS enforcement is not enabled')

          print('\n=== FINAL DOMAIN AUDIT ===')
          if warnings:
              print('Warnings:')
              for item in warnings:
                  print(f'- {item}')
          if failures:
              print('FAILED:')
              for item in failures:
                  print(f'- {item}')
              raise SystemExit(1)
          print('PASS: DNS, www alias, HTTPS, TLS coverage, and GitHub Pages configuration are ready.')
          PY
