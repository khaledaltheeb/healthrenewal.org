name: Validate child mental-health sector v328

on:
  pull_request:
    branches: [main]
    paths:
      - "sectors/child/**"
      - "sectors/index.html"
      - "scripts/verify_child_sector_v328.py"
      - "tests/test_child_sector_v328.py"
      - ".github/workflows/validate-child-sector-v328.yml"
  push:
    branches: [main]
    paths:
      - "sectors/child/**"
      - "sectors/index.html"
      - "scripts/verify_child_sector_v328.py"
      - "tests/test_child_sector_v328.py"
      - ".github/workflows/validate-child-sector-v328.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: child-sector-v328-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Compile verifier and tests
        run: |
          python3 --version
          python3 -m py_compile scripts/verify_child_sector_v328.py tests/test_child_sector_v328.py

      - name: Run child-sector contract
        id: contract
        shell: bash
        run: |
          set +e
          python3 scripts/verify_child_sector_v328.py --json > /tmp/child-sector-v328-report.json 2>&1
          code=$?
          cat /tmp/child-sector-v328-report.json
          printf 'exit_code=%s\n' "$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload exact contract report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: child-sector-v328-report
          path: /tmp/child-sector-v328-report.json
          if-no-files-found: error
          retention-days: 7

      - name: Enforce contract
        if: steps.contract.outputs.exit_code != '0'
        run: exit 1

      - name: Run regression and mutation tests
        run: python3 -m unittest -v tests.test_child_sector_v328

      - name: Verify publication wiring
        run: |
          set -euxo pipefail
          test -s sectors/child/index.html
          test -s sectors/child/library/index.html
          test -s sectors/child/assessment/index.html
          test -s sectors/child/interventions/index.html
          test -s sectors/child/assets/child-sector.css
          grep -q 'href="child/"' sectors/index.html
          grep -q 'MedicalWebPage' sectors/child/index.html
          grep -q 'FAQPage' sectors/child/index.html
          grep -q 'لا تعني مراجعة سريرية خارجية مستقلة' sectors/child/index.html
          ! grep -R -n 'noindex' sectors/child
          ! grep -R -n 'href="#"' sectors/child
