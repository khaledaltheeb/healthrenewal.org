name: Observable healthrenewal Cloudflare zone bootstrap

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-healthrenewal-cloudflare-zone-v2.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  DOMAIN: healthrenewal.org
  ACCOUNT_ID: 826ac34927c1e045c06145a327c2ac52

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Create zone and canonical website records
        id: attempt
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set +e
          python - <<'PY' > cloudflare-bootstrap.log 2>&1
          from __future__ import annotations

          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          API = "https://api.cloudflare.com/client/v4"
          TOKEN = os.environ.get("CLOUDFLARE_API_TOKEN", "")
          ACCOUNT = os.environ["ACCOUNT_ID"]
          DOMAIN = os.environ["DOMAIN"]
          WWW = "www." + DOMAIN
          if not TOKEN:
              raise SystemExit("CLOUDFLARE_API_TOKEN is missing")

          def call(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(
                  API + path,
                  data=data,
                  method=method,
                  headers={
                      "Authorization": "Bearer " + TOKEN,
                      "Accept": "application/json",
                      "Content-Type": "application/json",
                      "User-Agent": "healthrenewal-observable-bootstrap/2.0",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=45) as response:
                      result = json.load(response)
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode(errors="replace")
                  raise RuntimeError(f"Cloudflare API {method} {path}: HTTP {exc.code}: {detail[:1000]}")
              if not result.get("success"):
                  raise RuntimeError(f"Cloudflare API {method} {path}: {result.get('errors')}")
              return result.get("result")

          query = urllib.parse.urlencode({"name": DOMAIN, "account.id": ACCOUNT, "per_page": 50})
          zones = call("GET", "/zones?" + query) or []
          created = False
          if not zones:
              zone = call("POST", "/zones", {
                  "name": DOMAIN,
                  "account": {"id": ACCOUNT},
                  "type": "full",
                  "jump_start": True,
              })
              created = True
              time.sleep(10)
          elif len(zones) == 1:
              zone = zones[0]
          else:
              raise RuntimeError("Multiple Cloudflare zones matched the domain")

          zone_id = zone["id"]
          zone = call("GET", f"/zones/{zone_id}")
          records = call("GET", f"/zones/{zone_id}/dns_records?per_page=500") or []
          Path("cloudflare-records-before.json").write_text(json.dumps(records, ensure_ascii=False, indent=2) + "\n")

          desired = [
              ("A", DOMAIN, "185.199.108.153"),
              ("A", DOMAIN, "185.199.109.153"),
              ("A", DOMAIN, "185.199.110.153"),
              ("A", DOMAIN, "185.199.111.153"),
              ("AAAA", DOMAIN, "2606:50c0:8000::153"),
              ("AAAA", DOMAIN, "2606:50c0:8001::153"),
              ("AAAA", DOMAIN, "2606:50c0:8002::153"),
              ("AAAA", DOMAIN, "2606:50c0:8003::153"),
              ("CNAME", WWW, "khaledaltheeb.github.io"),
          ]
          for record in records:
              name = str(record.get("name", "")).rstrip(".")
              if name in {DOMAIN, WWW} and record.get("type") in {"A", "AAAA", "CNAME"}:
                  call("DELETE", f"/zones/{zone_id}/dns_records/{record['id']}")

          for rtype, name, content in desired:
              call("POST", f"/zones/{zone_id}/dns_records", {
                  "type": rtype,
                  "name": name,
                  "content": content,
                  "ttl": 3600,
                  "proxied": False,
                  "comment": "Canonical GitHub Pages DNS managed by healthrenewal bootstrap v2",
              })

          after = call("GET", f"/zones/{zone_id}/dns_records?per_page=500") or []
          Path("cloudflare-records-after.json").write_text(json.dumps(after, ensure_ascii=False, indent=2) + "\n")
          actual = {
              (r.get("type"), str(r.get("name", "")).rstrip("."), str(r.get("content", "")).rstrip("."))
              for r in after
              if str(r.get("name", "")).rstrip(".") in {DOMAIN, WWW}
              and r.get("type") in {"A", "AAAA", "CNAME"}
          }
          if actual != set(desired):
              raise RuntimeError(f"Canonical record mismatch: {sorted(actual)}")

          preserved = [r for r in after if r.get("type") in {"MX", "TXT", "CAA"}]
          result = {
              "ok": True,
              "domain": DOMAIN,
              "zone_id": zone_id,
              "created": created,
              "status": zone.get("status"),
              "name_servers": zone.get("name_servers", []),
              "original_name_servers": zone.get("original_name_servers", []),
              "preserved_mx_txt_caa": len(preserved),
              "website_records": [
                  {"type": rtype, "name": name, "content": content, "proxied": False}
                  for rtype, name, content in desired
              ],
          }
          Path("cloudflare-bootstrap-result.json").write_text(json.dumps(result, ensure_ascii=False, indent=2) + "\n")
          print(json.dumps(result, ensure_ascii=False))
          PY
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat cloudflare-bootstrap.log
          exit 0

      - name: Publish complete bootstrap receipt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          EXIT_CODE: ${{ steps.attempt.outputs.exit_code }}
        run: |
          set -euo pipefail
          title="Cloudflare zone setup: healthrenewal.org"
          if [ "${EXIT_CODE:-1}" = "0" ] && [ -f cloudflare-bootstrap-result.json ]; then
            status=$(jq -r '.status // "unknown"' cloudflare-bootstrap-result.json)
            zone_id=$(jq -r '.zone_id // "unknown"' cloudflare-bootstrap-result.json)
            nameservers=$(jq -r '.name_servers | join(", ")' cloudflare-bootstrap-result.json)
            original=$(jq -r '.original_name_servers | join(", ")' cloudflare-bootstrap-result.json)
            preserved=$(jq -r '.preserved_mx_txt_caa' cloudflare-bootstrap-result.json)
            outcome="success"
            detail="Cloudflare zone and canonical website records were configured."
          else
            status="not-created"
            zone_id="unavailable"
            nameservers="unavailable"
            original="unavailable"
            preserved="unknown"
            outcome="failure"
            detail=$(tail -n 12 cloudflare-bootstrap.log | sed 's/`/\\`/g' | head -c 3000)
          fi
          body=$(cat <<EOF
          ## Cloudflare zone setup

          - **Outcome:** ${outcome}
          - **Zone status:** ${status}
          - **Zone ID:** ${zone_id}
          - **Assigned Cloudflare nameservers:** ${nameservers}
          - **Previous authoritative nameservers detected by Cloudflare:** ${original}
          - **MX/TXT/CAA records retained after import:** ${preserved}
          - **Run:** https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          ${detail}

          When the status is `pending`, Hostinger must delegate the domain to the two assigned Cloudflare nameservers. The website records are already prepared inside Cloudflare. Email records are not intentionally removed.
          EOF
          )
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state all --limit 100 --json number,title --jq ".[] | select(.title == \"${title}\") | .number" | head -n 1)
          if [ -z "$number" ]; then
            number=$(gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body" | sed -n 's#.*/##p')
          else
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          fi
          if [ "$outcome" = "success" ] && [ "$status" = "active" ]; then
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" --reason completed --comment "Cloudflare zone is active." || true
          else
            gh issue reopen "$number" --repo "$GITHUB_REPOSITORY" || true
          fi

      - name: Upload non-secret bootstrap evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observable-healthrenewal-cloudflare-zone-${{ github.run_id }}
          path: |
            cloudflare-bootstrap.log
            cloudflare-bootstrap-result.json
            cloudflare-records-before.json
            cloudflare-records-after.json
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce bootstrap result
        if: always()
        env:
          EXIT_CODE: ${{ steps.attempt.outputs.exit_code }}
        run: test "${EXIT_CODE:-1}" = "0"
