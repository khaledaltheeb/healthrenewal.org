name: One-shot validated Pages release v323

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-validated-pages-v323.yml"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: one-shot-validated-pages-v323
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Pin writable release branch
        run: git switch -C release-v323-work "${GITHUB_SHA}"

      - name: Restore generators and compile release sources
        run: |
          set -euxo pipefail
          mkdir -p /tmp/v10-content
          cp content/sectors-v10/*.json /tmp/v10-content/
          cat .v10bundle/part00 .v10bundle/part01 .v10bundle/part02 .v10bundle/part03 .v10bundle/part04 | base64 --decode > /tmp/v10.tar.gz
          tar -xzf /tmp/v10.tar.gz
          cp /tmp/v10-content/*.json content/sectors-v10/
          cat .generator-v6/part00 .generator-v6/part01 .generator-v6/part02 .generator-v6/part03 > build_site.py
          python scripts/verify_enricher_v7.py
          python scripts/verify_expander_v9.py
          python -m py_compile \
            build_site.py enrich_site_v7.py expand_site_v9.py \
            scripts/scale_site_v8.py scripts/design_content_v10.py \
            scripts/apply_contrast_v11.py scripts/expand_v12_direct.py \
            scripts/run_encyclopedia_v13.py scripts/performance_hotfix_v14.py \
            scripts/optimize_site_performance_v14.py scripts/strip_nonlab_runtime_v14.py \
            scripts/finalize_pwa_v14.py scripts/complete_core_sections_v15.py \
            scripts/diagnose_apply_homepage_v221.py scripts/polish_site_v16.py \
            scripts/audit_site_integrity_v13.py scripts/verify_performance_v14.py \
            scripts/verify_core_sections_v15.py scripts/audit_full_site_i18n_v72.py \
            scripts/audit_publication_surface_v322.py scripts/stamp_deployment_v29.py

      - name: Build complete production package
        run: |
          set -euxo pipefail
          python build_site.py
          python enrich_site_v7.py
          cp google644f1f7a8b7aaa2b.html _site/google644f1f7a8b7aaa2b.html
          python scripts/scale_site_v8.py
          python expand_site_v9.py
          python scripts/design_content_v10.py
          python scripts/apply_contrast_v11.py _site
          python scripts/expand_v12_direct.py _site
          python scripts/run_encyclopedia_v13.py _site
          python scripts/performance_hotfix_v14.py _site
          python scripts/optimize_site_performance_v14.py _site
          python scripts/strip_nonlab_runtime_v14.py _site
          python scripts/finalize_pwa_v14.py _site
          python scripts/complete_core_sections_v15.py _site
          python scripts/diagnose_apply_homepage_v221.py _site
          python scripts/polish_site_v16.py _site

      - name: Enforce production publication contracts
        run: |
          set -euxo pipefail
          python scripts/audit_site_integrity_v13.py _site
          python scripts/verify_performance_v14.py _site
          python scripts/verify_core_sections_v15.py _site
          python scripts/audit_full_site_i18n_v72.py _site
          python scripts/audit_publication_surface_v322.py _site
          test -f _site/index.html
          test -f _site/sections/index.html
          test -f _site/sectors/index.html
          test -f _site/specialists-partners/index.html
          test -f _site/platform/index.html
          test -f _site/copyright/index.html
          grep -q 'data-publication-surface="v322"' _site/index.html
          grep -q 'المعرفة ليست صفحات مبعثرة' _site/index.html
          grep -q 'فريقنا وشركاؤنا ذوو الاختصاص' _site/index.html
          grep -q 'دليل جميع الأقسام' _site/sections/index.html
          grep -q 'الأقسام المتخصصة للصحة النفسية' _site/sectors/index.html

      - name: Stamp release provenance
        run: |
          set -euxo pipefail
          python scripts/stamp_deployment_v29.py _site
          EXPECTED_SHA="${GITHUB_SHA}" python - <<'PY'
          import json, os
          from pathlib import Path
          data=json.loads(Path('_site/deployment.json').read_text(encoding='utf-8'))
          assert data.get('schema_version') == 30, data
          assert data.get('commit') == os.environ['EXPECTED_SHA'], (data, os.environ['EXPECTED_SHA'])
          assert int(data.get('pwa_pages', 0)) > 0, data
          print({'release_commit': data['commit'], 'pwa_pages': data['pwa_pages']})
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload validated Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy validated site
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live homepage gateways and exact SHA
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euxo pipefail
          BASE="${PAGE_URL%/}/"
          matched=0
          for i in $(seq 1 30); do
            if curl --retry 2 --retry-delay 2 -H 'Cache-Control: no-cache' -fsS "${BASE}deployment.json?v=${GITHUB_SHA}-${i}" -o /tmp/deployment.json; then
              if EXPECTED_SHA="${GITHUB_SHA}" python -c "import json,os; d=json.load(open('/tmp/deployment.json',encoding='utf-8')); raise SystemExit(0 if d.get('commit')==os.environ['EXPECTED_SHA'] else 1)"; then
                matched=1
                break
              fi
            fi
            sleep 10
          done
          test "${matched}" -eq 1
          curl --retry 3 --retry-delay 3 -H 'Cache-Control: no-cache' -fsS "${BASE}?v=${GITHUB_SHA}" -o /tmp/index.html
          curl --retry 3 --retry-delay 3 -H 'Cache-Control: no-cache' -fsS "${BASE}sections/?v=${GITHUB_SHA}" -o /tmp/sections.html
          curl --retry 3 --retry-delay 3 -H 'Cache-Control: no-cache' -fsS "${BASE}sectors/?v=${GITHUB_SHA}" -o /tmp/sectors.html
          curl --retry 3 --retry-delay 3 -H 'Cache-Control: no-cache' -fsS "${BASE}specialists-partners/?v=${GITHUB_SHA}" -o /tmp/specialists.html
          curl --retry 3 --retry-delay 3 -H 'Cache-Control: no-cache' -fsS "${BASE}platform/?v=${GITHUB_SHA}" -o /tmp/platform.html
          curl --retry 3 --retry-delay 3 -H 'Cache-Control: no-cache' -fsS "${BASE}copyright/?v=${GITHUB_SHA}" -o /tmp/copyright.html
          python - <<'PY'
          from pathlib import Path
          checks={
              '/tmp/index.html': ('data-publication-surface="v322"','المعرفة ليست صفحات مبعثرة','فريقنا وشركاؤنا ذوو الاختصاص'),
              '/tmp/sections.html': ('دليل جميع الأقسام',),
              '/tmp/sectors.html': ('الأقسام المتخصصة للصحة النفسية',),
              '/tmp/specialists.html': ('فريقنا وشركاؤنا ذوو الاختصاص',),
              '/tmp/platform.html': ('دليل المنصة',),
              '/tmp/copyright.html': ('حقوق النشر',),
          }
          for path, phrases in checks.items():
              text=Path(path).read_text(encoding='utf-8')
              assert all(phrase in text for phrase in phrases), (path, phrases)
              assert 'noindex' not in text.lower(), path
          print({'live_routes': len(checks), 'status': 'verified'})
          PY

      - name: Record failed release receipt
        if: failure()
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          receipt={
              'schema_version':323,
              'status':'failed',
              'deployment_outcome':'failure',
              'artifact':'_site',
              'source_commit':os.environ['GITHUB_SHA'],
              'source_ref':os.environ['GITHUB_REF'],
              'workflow_run_id':os.environ['GITHUB_RUN_ID'],
              'page_url':'',
              'recorded_at':datetime.now(timezone.utc).replace(microsecond=0).isoformat(),
              'failure_scope':'one-shot-validated-pages-v323',
          }
          Path('pages-deployment-status.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages-deployment-status.json
          git commit -m "ci: record failed validated Pages release v323 [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Finalize official queue policy and remove temporary release files
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          target=Path('.github/workflows/validate-all-labs-v22.yml')
          text=target.read_text(encoding='utf-8')
          marker='concurrency:\n  group: validate-all-labs-v31-main\n  cancel-in-progress: true\n'
          if marker not in text:
              anchor='env:\n  SITE_BASE: https://healthrenewal.org/\n\njobs:\n'
              replacement='env:\n  SITE_BASE: https://healthrenewal.org/\n\n'+marker+'\njobs:\n'
              if anchor not in text:
                  raise SystemExit('v31 workflow anchor is missing')
              target.write_text(text.replace(anchor,replacement,1),encoding='utf-8')

          cleanup=(
              '.github/workflows/patch-v31-concurrency-once.yml',
              '.github/workflows/patch-v31-concurrency-direct.yml',
              '.github/workflows/one-shot-validated-pages-v323.yml',
              '.github/workflows/dispatch-one-shot-v323-on-issue.yml',
              'release-v323-issue-trigger.txt',
              'production-rebuild-trigger-v322.json',
              'production-rebuild-trigger-v322.md',
              'production-rebuild-trigger-v322.txt',
              'production-rebuild-trigger-v322.lock',
              'production-rebuild-trigger-v322.ready',
              'production-rebuild-trigger-v322.final',
              'production-rebuild-trigger-v322.complete',
              'production-rebuild-trigger-v322.go',
              'production-rebuild-trigger-v322.merge',
              'production-rebuild-trigger-v322.pr',
              'production-rebuild-trigger-v322.open',
          )
          for relative in cleanup:
              path=Path(relative)
              if path.exists():
                  path.unlink()

          receipt={
              'schema_version':323,
              'status':'deployed',
              'deployment_outcome':'success',
              'artifact':'_site',
              'source_commit':os.environ['GITHUB_SHA'],
              'source_ref':os.environ['GITHUB_REF'],
              'workflow_run_id':os.environ['GITHUB_RUN_ID'],
              'page_url':os.environ.get('PAGE_URL',''),
              'recorded_at':datetime.now(timezone.utc).replace(microsecond=0).isoformat(),
              'live_routes_verified':6,
          }
          Path('pages-deployment-status.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          repo=os.environ['GITHUB_REPOSITORY']
          token=os.environ['GH_TOKEN']
          headers={
              'Authorization':f'Bearer {token}',
              'Accept':'application/vnd.github+json',
              'Content-Type':'application/json',
              'X-GitHub-Api-Version':'2022-11-28',
              'User-Agent':'release-v323-cleanup',
          }
          query=urllib.parse.quote('[release-v323] deploy validated publication surface in:title is:issue is:open')
          request=urllib.request.Request(f'https://api.github.com/search/issues?q={query}+repo:{repo}',headers=headers)
          with urllib.request.urlopen(request,timeout=30) as response:
              items=json.loads(response.read().decode('utf-8')).get('items',[])
          for item in items:
              close=urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/issues/{item['number']}",
                  data=json.dumps({'state':'closed','state_reason':'completed'}).encode('utf-8'),
                  method='PATCH',
                  headers=headers,
              )
              with urllib.request.urlopen(close,timeout=30) as response:
                  response.read()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci: finalize validated Pages release v323 [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
