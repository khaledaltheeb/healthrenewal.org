name: Inspect cleanup v325 on issue

on:
  issues:
    types: [opened]

permissions:
  actions: read
  issues: write
  contents: read

jobs:
  inspect:
    if: github.event.issue.title == '[inspect-cleanup-v325]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect final cleanup workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']
          headers={
              'Authorization':f"Bearer {os.environ['GH_TOKEN']}",
              'Accept':'application/vnd.github+json',
              'X-GitHub-Api-Version':'2022-11-28',
              'User-Agent':'cleanup-v325-issue-inspector',
          }
          req=urllib.request.Request(
              f'https://api.github.com/repos/{repo}/actions/workflows/final-cleanup-v325.yml/runs?per_page=20',
              headers=headers,
          )
          with urllib.request.urlopen(req,timeout=30) as response:
              runs=json.loads(response.read().decode('utf-8')).get('workflow_runs',[])
          compact=[{k:r.get(k) for k in ('id','event','status','conclusion','head_sha','run_number','created_at','updated_at')} for r in runs]
          print(json.dumps({'count':len(compact),'runs':compact},ensure_ascii=False,indent=2))
          if not compact:
              raise SystemExit('No v325 cleanup workflow run found')
          PY

      - name: Close trigger issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']
          req=urllib.request.Request(
              f"https://api.github.com/repos/{repo}/issues/{os.environ['ISSUE_NUMBER']}",
              data=json.dumps({'state':'closed','state_reason':'completed'}).encode('utf-8'),
              method='PATCH',
              headers={
                  'Authorization':f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept':'application/vnd.github+json',
                  'Content-Type':'application/json',
                  'X-GitHub-Api-Version':'2022-11-28',
                  'User-Agent':'cleanup-v325-issue-inspector',
              },
          )
          with urllib.request.urlopen(req,timeout=30) as response:
              response.read()
          PY
