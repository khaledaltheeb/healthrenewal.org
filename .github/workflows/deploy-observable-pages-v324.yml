name: Deploy observable validated Pages v324

on:
  workflow_run:
    workflows: ["Observable validated Pages release v324"]
    types: [completed]

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: github-pages-production-v324
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout current default branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download exact validated site artifact
        uses: actions/download-artifact@v4
        with:
          name: observable-validated-site-v324
          path: validated-site
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify artifact provenance and publication surface
        id: provenance
        run: |
          set -euxo pipefail
          test -f validated-site/deployment.json
          test -f validated-site/index.html
          test -f validated-site/sections/index.html
          test -f validated-site/sectors/index.html
          test -f validated-site/specialists-partners/index.html
          test -f validated-site/platform/index.html
          test -f validated-site/copyright/index.html
          RELEASE_SHA="$(python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('validated-site/deployment.json').read_text(encoding='utf-8'))
          assert data.get('schema_version') == 29, data
          print(data['commit'])
          PY
          )"
          git fetch origin main
          git cat-file -e "${RELEASE_SHA}^{commit}"
          git merge-base --is-ancestor "${RELEASE_SHA}" origin/main
          grep -q 'data-publication-surface="v322"' validated-site/index.html
          grep -q 'المعرفة ليست صفحات مبعثرة' validated-site/index.html
          grep -q 'فريقنا وشركاؤنا ذوو الاختصاص' validated-site/index.html
          grep -q 'دليل جميع الأقسام' validated-site/sections/index.html
          grep -q 'الأقسام المتخصصة للصحة النفسية' validated-site/sectors/index.html
          echo "release_sha=${RELEASE_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload exact Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: validated-site

      - name: Deploy exact validated site
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live SHA and six gateways
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          RELEASE_SHA: ${{ steps.provenance.outputs.release_sha }}
        run: |
          set -euxo pipefail
          BASE="${PAGE_URL%/}/"
          matched=0
          for i in $(seq 1 30); do
            if curl --retry 2 --retry-delay 2 -H 'Cache-Control: no-cache' -fsS "${BASE}deployment.json?v=${RELEASE_SHA}-${i}" -o /tmp/deployment.json; then
              if EXPECTED_SHA="${RELEASE_SHA}" python -c "import json,os; d=json.load(open('/tmp/deployment.json',encoding='utf-8')); raise SystemExit(0 if d.get('commit')==os.environ['EXPECTED_SHA'] else 1)"; then
                matched=1
                break
              fi
            fi
            sleep 10
          done
          test "${matched}" -eq 1
          curl --retry 3 --retry-delay 3 -H 'Cache-Control: no-cache' -fsS "${BASE}?v=${RELEASE_SHA}" -o /tmp/index.html
          curl --retry 3 --retry-delay 3 -H 'Cache-Control: no-cache' -fsS "${BASE}sections/?v=${RELEASE_SHA}" -o /tmp/sections.html
          curl --retry 3 --retry-delay 3 -H 'Cache-Control: no-cache' -fsS "${BASE}sectors/?v=${RELEASE_SHA}" -o /tmp/sectors.html
          curl --retry 3 --retry-delay 3 -H 'Cache-Control: no-cache' -fsS "${BASE}specialists-partners/?v=${RELEASE_SHA}" -o /tmp/specialists.html
          curl --retry 3 --retry-delay 3 -H 'Cache-Control: no-cache' -fsS "${BASE}platform/?v=${RELEASE_SHA}" -o /tmp/platform.html
          curl --retry 3 --retry-delay 3 -H 'Cache-Control: no-cache' -fsS "${BASE}copyright/?v=${RELEASE_SHA}" -o /tmp/copyright.html
          python - <<'PY'
          from pathlib import Path
          checks={
              '/tmp/index.html': ('data-publication-surface="v322"','المعرفة ليست صفحات مبعثرة','فريقنا وشركاؤنا ذوو الاختصاص'),
              '/tmp/sections.html': ('دليل جميع الأقسام',),
              '/tmp/sectors.html': ('الأقسام المتخصصة للصحة النفسية',),
              '/tmp/specialists.html': ('فريقنا وشركاؤنا ذوو الاختصاص',),
              '/tmp/platform.html': ('دليل المنصة',),
              '/tmp/copyright.html': ('حقوق النشر',),
          }
          for path, phrases in checks.items():
              text=Path(path).read_text(encoding='utf-8')
              assert all(phrase in text for phrase in phrases), (path, phrases)
              assert 'noindex' not in text.lower(), path
          print({'live_routes': len(checks), 'status': 'verified'})
          PY

      - name: Record failed default-branch deployment
        if: failure()
        env:
          RELEASE_SHA: ${{ steps.provenance.outputs.release_sha }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          Path('pages-deployment-status.json').write_text(json.dumps({
              'schema_version':324,
              'status':'failed',
              'deployment_outcome':'failure',
              'artifact':'observable-validated-site-v324',
              'source_commit':os.environ.get('RELEASE_SHA',''),
              'workflow_run_id':os.environ['GITHUB_RUN_ID'],
              'source_workflow_run_id':os.environ['SOURCE_RUN_ID'],
              'recorded_at':datetime.now(timezone.utc).replace(microsecond=0).isoformat(),
          },ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages-deployment-status.json
          git commit -m "ci: record failed observable Pages deployment v324 [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Finalize release and clean temporary machinery
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          RELEASE_SHA: ${{ steps.provenance.outputs.release_sha }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          target=Path('.github/workflows/validate-all-labs-v22.yml')
          text=target.read_text(encoding='utf-8')
          marker='concurrency:\n  group: validate-all-labs-v31-main\n  cancel-in-progress: true\n'
          if marker not in text:
              anchor='env:\n  SITE_BASE: https://khaledaltheeb.github.io/pterminology-site/\n\njobs:\n'
              replacement='env:\n  SITE_BASE: https://khaledaltheeb.github.io/pterminology-site/\n\n'+marker+'\njobs:\n'
              if anchor not in text:
                  raise SystemExit('v31 workflow anchor is missing')
              target.write_text(text.replace(anchor,replacement,1),encoding='utf-8')

          cleanup=(
              '.github/workflows/patch-v31-concurrency-once.yml',
              '.github/workflows/patch-v31-concurrency-direct.yml',
              '.github/workflows/one-shot-validated-pages-v323.yml',
              '.github/workflows/dispatch-one-shot-v323-on-issue.yml',
              '.github/workflows/deploy-observable-pages-v324.yml',
              'release-v323-issue-trigger.txt',
              'production-rebuild-trigger-v322.json',
              'production-rebuild-trigger-v322.md',
              'production-rebuild-trigger-v322.txt',
              'production-rebuild-trigger-v322.lock',
              'production-rebuild-trigger-v322.ready',
              'production-rebuild-trigger-v322.final',
              'production-rebuild-trigger-v322.complete',
              'production-rebuild-trigger-v322.go',
              'production-rebuild-trigger-v322.merge',
              'production-rebuild-trigger-v322.pr',
              'production-rebuild-trigger-v322.open',
          )
          for relative in cleanup:
              path=Path(relative)
              if path.exists():
                  path.unlink()

          Path('pages-deployment-status.json').write_text(json.dumps({
              'schema_version':324,
              'status':'deployed',
              'deployment_outcome':'success',
              'artifact':'observable-validated-site-v324',
              'source_commit':os.environ['RELEASE_SHA'],
              'workflow_run_id':os.environ['GITHUB_RUN_ID'],
              'source_workflow_run_id':os.environ['SOURCE_RUN_ID'],
              'page_url':os.environ.get('PAGE_URL',''),
              'recorded_at':datetime.now(timezone.utc).replace(microsecond=0).isoformat(),
              'live_routes_verified':6,
          },ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          repo=os.environ['GITHUB_REPOSITORY']
          token=os.environ['GH_TOKEN']
          pr=os.environ.get('PR_NUMBER','').strip()
          if pr:
              request=urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/pulls/{pr}',
                  data=json.dumps({'state':'closed'}).encode('utf-8'),
                  method='PATCH',
                  headers={
                      'Authorization':f'Bearer {token}',
                      'Accept':'application/vnd.github+json',
                      'Content-Type':'application/json',
                      'X-GitHub-Api-Version':'2022-11-28',
                      'User-Agent':'observable-pages-v324-cleanup',
                  },
              )
              with urllib.request.urlopen(request,timeout=30) as response:
                  response.read()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci: finalize observable Pages release v324 [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
