name: Materialize pediatric oncology evidence

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'scripts/materialize_pediatric_oncology.py'
      - 'scripts/sync_pediatric_oncology_dynamic_counts.py'
      - 'tests/test_materialize_pediatric_oncology.py'
      - 'tests/test_sync_pediatric_oncology_dynamic_counts.py'
      - '.github/workflows/materialize-pediatric-oncology.yml'
      - 'pediatric-oncology-publish.trigger'
  issue_comment:
    types: [created]
  push:
    branches: [main]
    paths:
      - '.github/workflows/materialize-pediatric-oncology.yml'
      - 'scripts/sync_pediatric_oncology_dynamic_counts.py'
      - 'pediatric-oncology-publish.trigger'
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: pediatric-oncology-materialization-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  test:
    name: Test pediatric oncology materializer and dynamic counters
    if: github.event_name != 'issue_comment' || (github.actor == 'khaledaltheeb' && github.event.issue.pull_request && github.event.comment.body == '/materialize-pediatric-oncology')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and run unit tests
        run: |
          set -euo pipefail
          python -m py_compile scripts/materialize_pediatric_oncology.py scripts/sync_pediatric_oncology_dynamic_counts.py tests/test_materialize_pediatric_oncology.py tests/test_sync_pediatric_oncology_dynamic_counts.py
          python -m unittest -v tests.test_materialize_pediatric_oncology tests.test_sync_pediatric_oncology_dynamic_counts

  materialize-pr:
    name: Materialize scheduled evidence into owner PR
    if: github.event_name == 'pull_request' && github.actor == 'khaledaltheeb' && github.event.pull_request.head.repo.full_name == github.repository
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize OIDC-authorized Supabase release feed
        run: python scripts/materialize_pediatric_oncology.py --root .
      - name: Synchronize dynamic pediatric-oncology counters
        run: python scripts/sync_pediatric_oncology_dynamic_counts.py --root .
      - name: Validate generated release contracts and dynamic counts
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('api/pediatric-oncology-materialization-v1.json').read_text(encoding='utf-8'))
          assert report['status'] == 'passed', report
          assert report['public_route_contract'] == 2, report
          assert report['records'] >= 1, report
          assert report['records'] == report['studies'] + report['theses'], report
          base = Path('magazine/pediatric-oncology')
          hubs = (
              (base / 'index.html', report['records']),
              (base / 'studies/index.html', report['studies']),
              (base / 'theses/index.html', report['theses']),
          )
          for hub, expected_count in hubs:
              text = hub.read_text(encoding='utf-8')
              assert 'rawafid:pediatric-oncology-materializer:v1' in text, hub
              assert 'rawafid:pediatric-oncology-dynamic-counts:v1' in text, hub
              assert 'name="robots" content="index,follow' in text, hub
              assert 'rel="canonical"' in text, hub
              assert f'data-current-count="{expected_count}"' in text, hub
              assert f'العدد الحالي: {expected_count}' in text, hub
          legacy = Path('sections/pediatric-cancer-latest-100-theses/index.html')
          legacy_text = legacy.read_text(encoding='utf-8')
          assert 'name="robots" content="noindex,follow"' in legacy_text, legacy
          assert 'href="https://healthrenewal.org/magazine/pediatric-oncology/theses/"' in legacy_text, legacy
          assert f'data-current-count="{report["theses"]}"' in legacy_text, legacy
          for route in report['routes']:
              page = Path(route.lstrip('/')) / 'index.html'
              text = page.read_text(encoding='utf-8')
              slug = page.parent.name
              token = report['release_tokens'][slug]
              assert f'name="rawafid-release-token" content="{token}"' in text, page
              assert f'href="https://healthrenewal.org{route}"' in text, page
              assert 'name="robots" content="index,follow' in text, page
              assert text.count('<h1>') == 1, page
              assert len(text) > 5000, page
          print({'status': 'passed', 'records': report['records'], 'studies': report['studies'], 'theses': report['theses']})
          PY
      - name: Commit generated evidence and counters to PR branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name 'Rawafid Publisher'
          git config user.email 'actions@users.noreply.github.com'
          git add magazine/pediatric-oncology api/pediatric-oncology-materialization-v1.json sections/pediatric-cancer-latest-100-theses
          if git diff --cached --quiet; then
            echo 'No pediatric oncology materialization/count changes.'
            exit 0
          fi
          git commit -m 'publish: materialize pediatric oncology evidence and counts'
          git push origin "HEAD:${HEAD_REF}"

  materialize-main:
    name: Materialize eligible evidence on main
    if: (github.event_name == 'issue_comment' && github.actor == 'khaledaltheeb' && github.event.issue.pull_request && github.event.comment.body == '/materialize-pediatric-oncology') || (github.event_name != 'pull_request' && github.event_name != 'issue_comment' && github.ref == 'refs/heads/main')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      actions: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize OIDC-authorized Supabase release feed
        run: python scripts/materialize_pediatric_oncology.py --root .
      - name: Synchronize dynamic pediatric-oncology counters
        run: python scripts/sync_pediatric_oncology_dynamic_counts.py --root .
      - name: Validate generated release contracts and dynamic counts
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('api/pediatric-oncology-materialization-v1.json').read_text(encoding='utf-8'))
          assert report['status'] == 'passed', report
          assert report['public_route_contract'] == 2, report
          assert report['records'] >= 1, report
          assert report['records'] == report['studies'] + report['theses'], report
          base = Path('magazine/pediatric-oncology')
          hubs = (
              (base / 'index.html', report['records']),
              (base / 'studies/index.html', report['studies']),
              (base / 'theses/index.html', report['theses']),
          )
          for hub, expected_count in hubs:
              text = hub.read_text(encoding='utf-8')
              assert 'rawafid:pediatric-oncology-materializer:v1' in text, hub
              assert 'rawafid:pediatric-oncology-dynamic-counts:v1' in text, hub
              assert 'name="robots" content="index,follow' in text, hub
              assert 'rel="canonical"' in text, hub
              assert f'data-current-count="{expected_count}"' in text, hub
              assert f'العدد الحالي: {expected_count}' in text, hub
          legacy = Path('sections/pediatric-cancer-latest-100-theses/index.html')
          legacy_text = legacy.read_text(encoding='utf-8')
          assert 'name="robots" content="noindex,follow"' in legacy_text, legacy
          assert 'href="https://healthrenewal.org/magazine/pediatric-oncology/theses/"' in legacy_text, legacy
          assert f'data-current-count="{report["theses"]}"' in legacy_text, legacy
          for route in report['routes']:
              page = Path(route.lstrip('/')) / 'index.html'
              text = page.read_text(encoding='utf-8')
              slug = page.parent.name
              token = report['release_tokens'][slug]
              assert f'name="rawafid-release-token" content="{token}"' in text, page
              assert f'href="https://healthrenewal.org{route}"' in text, page
              assert 'name="robots" content="index,follow' in text, page
              assert text.count('<h1>') == 1, page
              assert len(text) > 5000, page
          print({'status': 'passed', 'records': report['records'], 'studies': report['studies'], 'theses': report['theses']})
          PY
      - name: Commit deterministic materialization and counters
        run: |
          set -euo pipefail
          git config user.name 'Rawafid Publisher'
          git config user.email 'actions@users.noreply.github.com'
          git add magazine/pediatric-oncology api/pediatric-oncology-materialization-v1.json sections/pediatric-cancer-latest-100-theses
          if git diff --cached --quiet; then
            echo 'No pediatric oncology materialization/count changes.'
          else
            git commit -m 'publish: materialize pediatric oncology evidence and counts'
            git push origin HEAD:main
          fi
      - name: Dispatch exact production workflow
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          gh workflow run deploy-production-v3.yml --repo "$GH_REPO" --ref main
          gh issue comment "$ISSUE_NUMBER" --repo "$GH_REPO" --body "production-dispatch: accepted from pediatric oncology materializer at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
