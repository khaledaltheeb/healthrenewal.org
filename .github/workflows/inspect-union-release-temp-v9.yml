name: Temporary union release run inspector

on:
  issues:
    types: [opened]

permissions:
  actions: read
  issues: write

jobs:
  inspect:
    if: github.event.issue.title == '[diagnostic] inspect union release v9'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch latest v8 run and jobs
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/discoverability-union-release-temp-v8.yml/runs?per_page=5" -o /tmp/runs.json
          python - <<'PY' >/tmp/run-id
          import json
          runs=json.load(open('/tmp/runs.json',encoding='utf-8')).get('workflow_runs',[])
          if not runs: raise SystemExit('no v8 runs')
          r=runs[0]
          print(r['id'])
          print({'id':r['id'],'status':r['status'],'conclusion':r['conclusion'],'created_at':r['created_at'],'head_sha':r['head_sha']},file=open('/tmp/run-summary','w'))
          PY
          RUN_ID=$(head -1 /tmp/run-id)
          curl -fsS -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100" -o /tmp/jobs.json
          python - <<'PY' >/tmp/body.json
          import json
          run=open('/tmp/run-summary').read().strip()
          jobs=json.load(open('/tmp/jobs.json',encoding='utf-8')).get('jobs',[])
          lines=['## فحص تشغيل الإصدار v8','',f'- التشغيل: `{run}`','']
          for job in jobs:
            lines.append(f"### {job['name']} — {job.get('conclusion')}")
            for s in job.get('steps',[]):
              lines.append(f"- {s.get('number')}. {s.get('name')}: **{s.get('conclusion')}**")
          print(json.dumps({'body':'\n'.join(lines)},ensure_ascii=False))
          PY
          curl -fsSL -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" --data-binary @/tmp/body.json
