name: Deploy specialists signed application review v6

on:
  push:
    branches: [main]
    paths:
      - 'specialists-partners/backend/src/index-v4.js'
      - 'specialists-partners/backend/src/application-review-v6.js'
      - 'specialists-partners/backend/migrations/0005_signed_application_reviews.sql'
      - 'tests/test_specialist_signed_review_v6.py'
      - 'tests/test_specialists_signed_review_deployment_safety.py'
      - '.github/workflows/deploy-specialists-signed-review-v6.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-specialists-signed-review-v6
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    environment: specialists-production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.SPECIALISTS_D1_DATABASE_ID }}
      FROM_EMAIL: ${{ secrets.SPECIALISTS_FROM_EMAIL }}
      OWNER_EMAIL_SECRET: ${{ secrets.SPECIALISTS_OWNER_EMAIL }}
      API_BASE: https://pterminology-specialists.pterminology-826ac349.workers.dev
      WORKER_NAME: pterminology-specialists

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate signed-review and deployment-safety contracts
        run: |
          set -euo pipefail
          node --check specialists-partners/backend/src/index-v4.js
          node --check specialists-partners/backend/src/application-review-v6.js
          python -m unittest \
            tests.test_specialist_signed_review_v6 \
            tests.test_specialists_signed_review_deployment_safety

      - name: Validate Cloudflare access, configuration, and existing Worker secret names
        shell: bash
        run: |
          set -euo pipefail
          required=(CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID D1_DATABASE_ID FROM_EMAIL OWNER_EMAIL_SECRET)
          for name in "${required[@]}"; do
            [[ -n "${!name:-}" ]] || { echo "::error::$name is required"; exit 1; }
          done
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[a-fA-F0-9]{32}$ ]] || { echo "::error::CLOUDFLARE_ACCOUNT_ID has invalid format"; exit 1; }
          [[ "$D1_DATABASE_ID" =~ ^[a-fA-F0-9-]{36}$ ]] || { echo "::error::D1_DATABASE_ID has invalid format"; exit 1; }

          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          curl -fsS "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/tokens/verify" \
            -o /tmp/specialists-token-verify.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/specialists-token-verify.json',encoding='utf-8'))
          assert data.get('success') is True, data
          assert (data.get('result') or {}).get('status') == 'active', data
          PY

          curl -fsS "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/secrets" \
            -o /tmp/specialists-worker-secrets.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/specialists-worker-secrets.json',encoding='utf-8'))
          assert data.get('success') is True, data
          names={str(item.get('name') or '') for item in (data.get('result') or [])}
          required={
              'RESEND_API_KEY',
              'TURNSTILE_SECRET',
              'ADMIN_API_KEY',
              'REVIEWER_API_KEY',
              'MODERATOR_API_KEY',
              'RATE_LIMIT_SALT',
              'REVIEW_LINK_SECRET',
          }
          missing=sorted(required-names)
          if missing:
              raise SystemExit('Missing required Worker secret names: '+', '.join(missing))
          print({'required_worker_secret_names_verified':sorted(required)})
          PY

      - name: Generate production Worker configuration
        working-directory: specialists-partners/backend
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path

          def toml(value: str) -> str:
              return '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"'

          content = f'''name = "pterminology-specialists"
          main = "src/index-v4.js"
          compatibility_date = "2026-07-01"
          workers_dev = true

          [vars]
          ALLOWED_ORIGINS = "https://healthrenewal.org,https://www.healthrenewal.org,https://khaledaltheeb.github.io"
          OWNER_EMAIL = {toml(os.environ['OWNER_EMAIL_SECRET'])}
          OWNER_DISPLAY_NAME = "خالد الذيب"
          PORTAL_BASE_URL = "https://healthrenewal.org/specialists-partners/portal/"
          ADMIN_CONSOLE_URL = "https://healthrenewal.org/specialists-partners/admin/#applications"
          REVIEW_BASE_URL = "https://pterminology-specialists.pterminology-826ac349.workers.dev/v1/reviews/applications"
          REVIEW_LINK_TTL_MINUTES = "30"
          TURNSTILE_EXPECTED_HOSTNAMES = "healthrenewal.org,www.healthrenewal.org,khaledaltheeb.github.io"
          FROM_EMAIL = {toml(os.environ['FROM_EMAIL'])}
          ADMIN_SESSION_MINUTES = "20"

          [[d1_databases]]
          binding = "DB"
          database_name = "pterminology-specialists"
          database_id = {toml(os.environ['D1_DATABASE_ID'])}
          migrations_dir = "migrations"

          [triggers]
          crons = ["17 2 * * *"]
          '''
          Path('wrangler.toml').write_text(content, encoding='utf-8')
          PY
          chmod 600 wrangler.toml

      - name: Apply D1 migrations
        working-directory: specialists-partners/backend
        run: npx --yes wrangler@4 d1 migrations apply pterminology-specialists --remote --config wrangler.toml

      - name: Deploy signed-review Worker v6 without replacing existing secrets
        working-directory: specialists-partners/backend
        run: npx --yes wrangler@4 deploy --config wrangler.toml --minify --keep-vars

      - name: Remove ephemeral configuration
        if: always()
        working-directory: specialists-partners/backend
        run: rm -f wrangler.toml

      - name: Verify live signed-review health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            status="$(curl -sS -o /tmp/review-health.json -w '%{http_code}' "${API_BASE%/}/health" || true)"
            if [[ "$status" == "200" ]]; then
              python - <<'PY'
              import json
              from pathlib import Path
              health = json.loads(Path('/tmp/review-health.json').read_text(encoding='utf-8'))
              assert health['ok'] is True, health
              assert health['version'] == '6.0.0', health
              for name in ('signedReviews', 'signedReviewSchema', 'signedReviewEmail'):
                  assert health['checks'].get(name) is True, (name, health)
              print({'version': health['version'], 'signedReviewChecks': {name: health['checks'][name] for name in ('signedReviews','signedReviewSchema','signedReviewEmail')}})
              PY
              exit 0
            fi
            sleep 5
          done
          cat /tmp/review-health.json || true
          exit 1
