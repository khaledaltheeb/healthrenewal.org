name: Deploy specialists signed application review v6

on:
  push:
    branches: [main]
    paths:
      - 'specialists-partners/backend/src/index-v4.js'
      - 'specialists-partners/backend/src/application-review-v6.js'
      - 'specialists-partners/backend/migrations/0005_signed_application_reviews.sql'
      - 'tests/test_specialist_signed_review_v6.py'
      - '.github/workflows/deploy-specialists-signed-review-v6.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-specialists-signed-review-v6
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.SPECIALISTS_D1_DATABASE_ID }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
      ADMIN_API_KEY: ${{ secrets.SPECIALISTS_ADMIN_API_KEY }}
      REVIEWER_API_KEY: ${{ secrets.SPECIALISTS_REVIEWER_API_KEY }}
      MODERATOR_API_KEY: ${{ secrets.SPECIALISTS_MODERATOR_API_KEY }}
      RATE_LIMIT_SALT: ${{ secrets.SPECIALISTS_RATE_LIMIT_SALT }}
      REVIEW_LINK_SECRET: ${{ secrets.SPECIALISTS_REVIEW_LINK_SECRET }}
      FROM_EMAIL: ${{ secrets.SPECIALISTS_FROM_EMAIL }}
      OWNER_EMAIL_SECRET: ${{ secrets.SPECIALISTS_OWNER_EMAIL }}
      API_BASE: https://pterminology-specialists.pterminology-826ac349.workers.dev

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate signed-review contracts
        run: |
          set -euo pipefail
          node --check specialists-partners/backend/src/index-v4.js
          node --check specialists-partners/backend/src/application-review-v6.js
          python -m unittest tests.test_specialist_signed_review_v6

      - name: Validate deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          required=(CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID D1_DATABASE_ID RESEND_API_KEY TURNSTILE_SECRET ADMIN_API_KEY RATE_LIMIT_SALT FROM_EMAIL)
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is required"
              exit 1
            fi
          done
          [[ ${#ADMIN_API_KEY} -ge 32 ]]
          [[ ${#RATE_LIMIT_SALT} -ge 32 ]]
          if [[ -n "${REVIEW_LINK_SECRET:-}" ]]; then
            [[ ${#REVIEW_LINK_SECRET} -ge 32 ]]
          fi

      - name: Generate production Worker configuration
        working-directory: specialists-partners/backend
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path

          def toml(value: str) -> str:
              return '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"'

          owner_email = os.environ.get('OWNER_EMAIL_SECRET') or 'pterminology@gmail.com'
          content = f'''name = "pterminology-specialists"
          main = "src/index-v4.js"
          compatibility_date = "2026-07-01"
          workers_dev = true

          [vars]
          ALLOWED_ORIGINS = "https://healthrenewal.org"
          OWNER_EMAIL = {toml(owner_email)}
          OWNER_DISPLAY_NAME = "خالد الذيب"
          PORTAL_BASE_URL = "https://healthrenewal.org/specialists-partners/portal/"
          ADMIN_CONSOLE_URL = "https://healthrenewal.org/specialists-partners/admin/#applications"
          REVIEW_BASE_URL = "https://pterminology-specialists.pterminology-826ac349.workers.dev/v1/reviews/applications"
          REVIEW_LINK_TTL_MINUTES = "30"
          TURNSTILE_EXPECTED_HOSTNAMES = "khaledaltheeb.github.io"
          FROM_EMAIL = {toml(os.environ['FROM_EMAIL'])}
          ADMIN_SESSION_MINUTES = "20"

          [[d1_databases]]
          binding = "DB"
          database_name = "pterminology-specialists"
          database_id = {toml(os.environ['D1_DATABASE_ID'])}
          migrations_dir = "migrations"

          [triggers]
          crons = ["17 2 * * *"]
          '''
          Path('wrangler.toml').write_text(content, encoding='utf-8')
          PY

      - name: Create ephemeral Worker secrets
        working-directory: specialists-partners/backend
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import hmac
          import json
          import os
          from pathlib import Path

          dedicated = os.environ.get('REVIEW_LINK_SECRET', '')
          review_secret = dedicated or hmac.new(
              os.environ['RATE_LIMIT_SALT'].encode(),
              b'pterminology/application-review-v6',
              hashlib.sha256,
          ).hexdigest()
          payload = {
              'RESEND_API_KEY': os.environ['RESEND_API_KEY'],
              'TURNSTILE_SECRET': os.environ['TURNSTILE_SECRET'],
              'ADMIN_API_KEY': os.environ['ADMIN_API_KEY'],
              'RATE_LIMIT_SALT': os.environ['RATE_LIMIT_SALT'],
              'REVIEW_LINK_SECRET': review_secret,
          }
          for name in ('REVIEWER_API_KEY', 'MODERATOR_API_KEY'):
              if os.environ.get(name):
                  payload[name] = os.environ[name]
          Path('worker-secrets.json').write_text(json.dumps(payload), encoding='utf-8')
          PY
          chmod 600 worker-secrets.json

      - name: Apply D1 migrations
        working-directory: specialists-partners/backend
        run: npx --yes wrangler@4 d1 migrations apply pterminology-specialists --remote --config wrangler.toml

      - name: Deploy signed-review Worker v6
        working-directory: specialists-partners/backend
        run: npx --yes wrangler@4 deploy --config wrangler.toml --secrets-file worker-secrets.json --minify --keep-vars

      - name: Remove ephemeral configuration
        if: always()
        working-directory: specialists-partners/backend
        run: rm -f worker-secrets.json wrangler.toml

      - name: Verify live signed-review health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            status="$(curl -sS -o /tmp/review-health.json -w '%{http_code}' "${API_BASE%/}/health" || true)"
            if [[ "$status" == "200" ]]; then
              python - <<'PY'
              import json
              from pathlib import Path
              health = json.loads(Path('/tmp/review-health.json').read_text(encoding='utf-8'))
              assert health['ok'] is True, health
              assert health['version'] == '6.0.0', health
              for name in ('signedReviews', 'signedReviewSchema', 'signedReviewEmail'):
                  assert health['checks'].get(name) is True, (name, health)
              print({'version': health['version'], 'signedReviewChecks': {name: health['checks'][name] for name in ('signedReviews','signedReviewSchema','signedReviewEmail')}})
              PY
              exit 0
            fi
            sleep 5
          done
          cat /tmp/review-health.json || true
          exit 1
