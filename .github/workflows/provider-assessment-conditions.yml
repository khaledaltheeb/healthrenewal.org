name: Validate Assessment Condition Pathways

on:
  push:
    branches: ["main"]
    paths:
      - "provider-assessment-demo/conditions/**"
      - "provider-assessment-demo/condition-entry-v1.js"
      - "provider-assessment-demo/professional-templates-v1.js"
      - "provider-assessment-demo/case-report-v1.js"
      - "provider-assessment-demo/case-report-interpretation-v2.js"
      - "provider-assessment-demo/institutional-live-v2.js"
      - "provider-assessment-demo/sw-live-v2.js"
      - "provider-assessment-demo/index.html"
      - "sitemap.xml"
      - ".github/workflows/provider-assessment-conditions.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "provider-assessment-demo/conditions/**"
      - "provider-assessment-demo/condition-entry-v1.js"
      - "provider-assessment-demo/professional-templates-v1.js"
      - "provider-assessment-demo/case-report-v1.js"
      - "provider-assessment-demo/case-report-interpretation-v2.js"
      - "provider-assessment-demo/institutional-live-v2.js"
      - "provider-assessment-demo/sw-live-v2.js"
      - "provider-assessment-demo/index.html"
      - "sitemap.xml"
      - ".github/workflows/provider-assessment-conditions.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assessment-condition-content-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-condition-pathways:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check provider-assessment-demo/conditions/conditions-data-v1.js
          node --check provider-assessment-demo/conditions/conditions-ui-v1.js
          node --check provider-assessment-demo/conditions/condition-education-v1.js
          node --check provider-assessment-demo/condition-entry-v1.js
          node --check provider-assessment-demo/professional-templates-v1.js
          node --check provider-assessment-demo/case-report-v1.js
          node --check provider-assessment-demo/case-report-interpretation-v2.js
          node --check provider-assessment-demo/institutional-live-v2.js
          node --check provider-assessment-demo/sw-live-v2.js

      - name: Validate Arabic pathways and report interpretation contract
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const vm = require('vm');
          const read = file => fs.readFileSync(file, 'utf8');

          const context = { window: {} };
          vm.runInNewContext(read('provider-assessment-demo/conditions/conditions-data-v1.js'), context);
          const registry = context.window.PA_CONDITION_PATHWAYS;
          if (!registry || registry.conditions?.length !== 20) throw new Error('Expected exactly 20 condition pathways');
          if (new Set(registry.conditions.map(item => item.slug)).size !== 20) throw new Error('Duplicate condition slugs');

          for (const item of registry.conditions) {
            for (const key of ['team','primary','supporting','external','focus','deliverables','alerts']) {
              if (!Array.isArray(item[key]) || item[key].length < 2) throw new Error(`${item.slug}: incomplete ${key}`);
            }
            const file = path.join('provider-assessment-demo/conditions', item.slug, 'index.html');
            const html = read(file);
            for (const marker of ['<html lang="ar" dir="rtl"','<main','id="condition-root"','rel="canonical"','application/ld+json']) {
              if (!html.includes(marker)) throw new Error(`${item.slug}: missing ${marker}`);
            }
          }

          const education = read('provider-assessment-demo/conditions/condition-education-v1.js');
          for (const marker of ['المسح أو الفرز','التقييم التشخيصي','التقييم الوظيفي','متابعة التقدم','progressByCondition','قائمة توثيق الحالة المهنية','دليل الأسرة ومقدم الخدمة']) {
            if (!education.includes(marker)) throw new Error(`Education contract missing ${marker}`);
          }
          for (const item of registry.conditions) if (!education.includes(`"${item.slug}"`)) throw new Error(`Progress indicators missing ${item.slug}`);

          const interpretation = read('provider-assessment-demo/case-report-interpretation-v2.js');
          const required = [
            'assessmentType','evidenceSources','decisionAuthority','functionalContexts','resultValidity',
            'interpretationLimitations','baselineIndicator','measurementMethod','measurableGoal',
            'remeasurementDate','providerInterpretation','familySummary','revisionReason',
            'supersedesReportId','sourceVersionNumber','reviewAuditTrail','interpretationContractVersion',
            'screening','diagnostic','functional','progress','computeChangedFields',
            'form.elements.reportId.value = ""','PA_REPORT_INTERPRETATION_CONTRACT'
          ];
          for (const marker of required) if (!interpretation.includes(marker)) throw new Error(`Interpretation contract missing ${marker}`);
          for (const safeguard of ['لا يثبت التشخيص أو الأهلية','لا تُنسخ البنود أو مفاتيح التصحيح أو المعايير','ملخص موجه للأسرة أو الشخص']) {
            if (!interpretation.includes(safeguard)) throw new Error(`Safety wording missing ${safeguard}`);
          }

          const institutional = read('provider-assessment-demo/institutional-live-v2.js');
          if (!institutional.includes('case-report-interpretation-v2.js')) throw new Error('Interpretation module is not wired');
          if (!institutional.includes('2026.07.24-live.6')) throw new Error('Institutional release mismatch');
          if (!read('provider-assessment-demo/sw-live-v2.js').includes('2026.07.24-live.6')) throw new Error('Service worker release mismatch');

          const platformIndex = read('provider-assessment-demo/index.html');
          if (!platformIndex.includes('<html lang="ar" dir="rtl"')) throw new Error('Platform RTL missing');
          if (!platformIndex.includes('case-report-v1.js?v=20260724-live6')) throw new Error('Base report engine missing');

          const combined = [education, interpretation, read('provider-assessment-demo/condition-entry-v1.js')].join('\n');
          for (const token of ['XMLHttpRequest','WebSocket','sendBeacon(','EventSource(','eval(','new Function(']) {
            if (combined.includes(token)) throw new Error(`Unsafe API forbidden: ${token}`);
          }

          const sitemap = read('sitemap.xml');
          for (const item of registry.conditions) if (!sitemap.includes(`/conditions/${item.slug}/`)) throw new Error(`Sitemap missing ${item.slug}`);
          console.log({ conditions: 20, assessmentTypes: 4, reportInterpretation: true, immutableVersions: true, rtl: true, status: 'passed' });
          NODE
