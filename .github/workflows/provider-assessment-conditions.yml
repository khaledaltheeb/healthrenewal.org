name: Validate Assessment Condition Pathways

on:
  push:
    branches: ["main"]
    paths:
      - "provider-assessment-demo/conditions/**"
      - "provider-assessment-demo/condition-entry-v1.js"
      - "provider-assessment-demo/professional-templates-v1.js"
      - "provider-assessment-demo/institutional-live-v2.js"
      - "provider-assessment-demo/sw-live-v2.js"
      - "sitemap.xml"
      - ".github/workflows/provider-assessment-conditions.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "provider-assessment-demo/conditions/**"
      - "provider-assessment-demo/condition-entry-v1.js"
      - "provider-assessment-demo/professional-templates-v1.js"
      - "provider-assessment-demo/institutional-live-v2.js"
      - "provider-assessment-demo/sw-live-v2.js"
      - "sitemap.xml"
      - ".github/workflows/provider-assessment-conditions.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-condition-pathways:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          node --check provider-assessment-demo/conditions/conditions-data-v1.js
          node --check provider-assessment-demo/conditions/conditions-ui-v1.js
          node --check provider-assessment-demo/condition-entry-v1.js
          node --check provider-assessment-demo/professional-templates-v1.js
          node --check provider-assessment-demo/institutional-live-v2.js
          node --check provider-assessment-demo/sw-live-v2.js

      - name: Validate registry, pages, SEO, templates and operational links
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const vm = require('vm');

          const context = { window: {} };
          vm.runInNewContext(fs.readFileSync('provider-assessment-demo/conditions/conditions-data-v1.js', 'utf8'), context);
          const registry = context.window.PA_CONDITION_PATHWAYS;
          if (!registry || !Array.isArray(registry.conditions)) throw new Error('Condition registry missing');
          if (registry.conditions.length !== 20) throw new Error(`Expected 20 conditions, found ${registry.conditions.length}`);
          if (new Set(registry.conditions.map(item => item.slug)).size !== 20) throw new Error('Duplicate condition slugs');
          if (new Set(registry.conditions.map(item => item.title)).size !== 20) throw new Error('Duplicate condition titles');
          if (!Array.isArray(registry.workflowStages) || registry.workflowStages.length < 7) throw new Error('Workflow stages incomplete');
          if (!Array.isArray(registry.commonDomains) || registry.commonDomains.length < 9) throw new Error('Common domains incomplete');

          const forbidden = [/مقفل/u, /دليل فقط/u, /النسخة التجريبية المنشورة/u, /status\s*:\s*["']locked["']/u];
          const requiredArrays = ['team', 'primary', 'supporting', 'external', 'focus', 'deliverables', 'alerts'];
          for (const item of registry.conditions) {
            if (!item.summary || item.summary.length < 50) throw new Error(`Thin summary: ${item.slug}`);
            for (const key of requiredArrays) {
              if (!Array.isArray(item[key]) || item[key].length < 2) throw new Error(`Incomplete ${key}: ${item.slug}`);
            }
            const file = path.join('provider-assessment-demo/conditions', item.slug, 'index.html');
            if (!fs.existsSync(file)) throw new Error(`Missing condition page: ${file}`);
            const html = fs.readFileSync(file, 'utf8');
            const required = [
              '<title>',
              'meta name="description"',
              'rel="canonical"',
              'application/ld+json',
              `data-condition="${item.slug}"`,
              '../conditions-data-v1.js',
              '../conditions-ui-v1.js'
            ];
            const missing = required.filter(marker => !html.includes(marker));
            if (missing.length) throw new Error(`SEO/runtime markers missing in ${item.slug}: ${missing.join(', ')}`);
            for (const pattern of forbidden) if (pattern.test(html)) throw new Error(`Forbidden locked/demo wording in ${item.slug}`);
          }

          const index = fs.readFileSync('provider-assessment-demo/conditions/index.html', 'utf8');
          for (const marker of ['conditions-grid', 'condition-search', 'team-filter', 'CollectionPage', '2026.07.24-live.5']) {
            if (!index.includes(marker)) throw new Error(`Conditions index missing ${marker}`);
          }

          const ui = fs.readFileSync('provider-assessment-demo/conditions/conditions-ui-v1.js', 'utf8');
          for (const marker of ['pa-selected-condition-v1', 'pa-condition-pathway-history-v1', 'data-start-condition', '?condition=']) {
            if (!ui.includes(marker)) throw new Error(`Condition UI missing ${marker}`);
          }

          const bridge = fs.readFileSync('provider-assessment-demo/condition-entry-v1.js', 'utf8');
          for (const marker of ['professional-search', 'open-condition-professional', 'conditions-hub-link', 'pa-selected-condition-v1']) {
            if (!bridge.includes(marker)) throw new Error(`Condition bridge missing ${marker}`);
          }

          const templates = fs.readFileSync('provider-assessment-demo/professional-templates-v1.js', 'utf8');
          const templateMarkers = [
            'ratingTemplate', 'performanceTemplate', 'interviewTemplate', 'externalTemplate',
            'classificationTemplate', 'behaviorTemplate', 'communicationTemplate',
            'detail_informants', 'detail_accommodations', 'بيانات القالب المهني'
          ];
          for (const marker of templateMarkers) {
            if (!templates.includes(marker)) throw new Error(`Professional templates missing ${marker}`);
          }

          const institutional = fs.readFileSync('provider-assessment-demo/institutional-live-v2.js', 'utf8');
          for (const marker of ['2026.07.24-live.5', 'loadConditionPathways', 'loadProfessionalTemplates', 'conditions/conditions-data-v1.js', 'condition-entry-v1.js', 'professional-templates-v1.js']) {
            if (!institutional.includes(marker)) throw new Error(`Institutional release missing ${marker}`);
          }

          const worker = fs.readFileSync('provider-assessment-demo/sw-live-v2.js', 'utf8');
          if (!worker.includes('2026.07.24-live.5')) throw new Error('Service worker release mismatch');

          const sitemap = fs.readFileSync('sitemap.xml', 'utf8');
          const sitemapConditionUrls = [...sitemap.matchAll(/provider-assessment-demo\/conditions\//g)].length;
          if (sitemapConditionUrls !== 21) throw new Error(`Expected 21 condition sitemap URLs, found ${sitemapConditionUrls}`);
          for (const item of registry.conditions) {
            if (!sitemap.includes(`/conditions/${item.slug}/`)) throw new Error(`Sitemap missing ${item.slug}`);
          }

          const combined = [
            fs.readFileSync('provider-assessment-demo/conditions/conditions-data-v1.js', 'utf8'),
            fs.readFileSync('provider-assessment-demo/conditions/conditions-ui-v1.js', 'utf8'),
            fs.readFileSync('provider-assessment-demo/condition-entry-v1.js', 'utf8'),
            templates
          ].join('\n');
          for (const token of ['fetch(', 'XMLHttpRequest', 'WebSocket', 'sendBeacon(', 'EventSource(']) {
            if (combined.includes(token)) throw new Error(`Network API forbidden in local pathways: ${token}`);
          }

          console.log({
            conditionPages: registry.conditions.length,
            commonDomains: registry.commonDomains.length,
            workflowStages: registry.workflowStages.length,
            templateFamilies: 7,
            sitemapConditionUrls,
            release: '2026.07.24-live.5',
            status: 'passed'
          });
          NODE
