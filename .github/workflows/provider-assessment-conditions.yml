name: Validate Assessment Condition Pathways

on:
  push:
    branches: ["main"]
    paths:
      - "provider-assessment-demo/conditions/**"
      - "provider-assessment-demo/condition-entry-v1.js"
      - "provider-assessment-demo/professional-templates-v1.js"
      - "provider-assessment-demo/case-report-v1.js"
      - "provider-assessment-demo/case-report-interpretation-v2.js"
      - "provider-assessment-demo/institutional-live-v2.js"
      - "provider-assessment-demo/sw-live-v2.js"
      - "provider-assessment-demo/index.html"
      - "sitemap.xml"
      - ".github/workflows/provider-assessment-conditions.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "provider-assessment-demo/conditions/**"
      - "provider-assessment-demo/condition-entry-v1.js"
      - "provider-assessment-demo/professional-templates-v1.js"
      - "provider-assessment-demo/case-report-v1.js"
      - "provider-assessment-demo/case-report-interpretation-v2.js"
      - "provider-assessment-demo/institutional-live-v2.js"
      - "provider-assessment-demo/sw-live-v2.js"
      - "provider-assessment-demo/index.html"
      - "sitemap.xml"
      - ".github/workflows/provider-assessment-conditions.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assessment-condition-content-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-condition-pathways:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check provider-assessment-demo/conditions/conditions-data-v1.js
          node --check provider-assessment-demo/conditions/conditions-ui-v1.js
          node --check provider-assessment-demo/conditions/condition-education-v1.js
          node --check provider-assessment-demo/condition-entry-v1.js
          node --check provider-assessment-demo/professional-templates-v1.js
          node --check provider-assessment-demo/case-report-v1.js
          node --check provider-assessment-demo/case-report-interpretation-v2.js
          node --check provider-assessment-demo/institutional-live-v2.js
          node --check provider-assessment-demo/sw-live-v2.js

      - name: Validate registry, education, RTL pages, accessibility, reports and links
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const vm = require('vm');
          const read = file => fs.readFileSync(file, 'utf8');

          const context = { window: {} };
          vm.runInNewContext(read('provider-assessment-demo/conditions/conditions-data-v1.js'), context);
          const registry = context.window.PA_CONDITION_PATHWAYS;
          if (!registry || !Array.isArray(registry.conditions)) throw new Error('Condition registry missing');
          if (registry.conditions.length !== 20) throw new Error(`Expected 20 conditions, found ${registry.conditions.length}`);
          if (new Set(registry.conditions.map(item => item.slug)).size !== 20) throw new Error('Duplicate condition slugs');
          if (new Set(registry.conditions.map(item => item.title)).size !== 20) throw new Error('Duplicate condition titles');
          if (registry.workflowStages.length < 7 || registry.commonDomains.length < 9) throw new Error('Common pathway content incomplete');

          const requiredArrays = ['team','primary','supporting','external','focus','deliverables','alerts'];
          const forbidden = [/مقفل/u,/دليل فقط/u,/النسخة التجريبية المنشورة/u,/status\s*:\s*["']locked["']/u];
          for (const item of registry.conditions) {
            if (!item.summary || item.summary.length < 50) throw new Error(`Thin summary: ${item.slug}`);
            for (const key of requiredArrays) if (!Array.isArray(item[key]) || item[key].length < 2) throw new Error(`Incomplete ${key}: ${item.slug}`);
            const file = path.join('provider-assessment-demo/conditions', item.slug, 'index.html');
            if (!fs.existsSync(file)) throw new Error(`Missing condition page: ${file}`);
            const html = read(file);
            for (const marker of ['<html lang="ar" dir="rtl"','<title>','meta name="description"','rel="canonical"','application/ld+json',`data-condition="${item.slug}"`,'../conditions-data-v1.js','../conditions-ui-v1.js']) if (!html.includes(marker)) throw new Error(`${item.slug} missing ${marker}`);
            if (!/<main[^>]+id="condition-root"/u.test(html)) throw new Error(`${item.slug} missing accessible main condition root`);
            for (const pattern of forbidden) if (pattern.test(html)) throw new Error(`Forbidden wording in ${item.slug}`);
          }

          const index = read('provider-assessment-demo/conditions/index.html');
          for (const marker of ['<html lang="ar" dir="rtl"','conditions-grid','condition-search','team-filter','CollectionPage']) if (!index.includes(marker)) throw new Error(`Conditions index missing ${marker}`);

          const ui = read('provider-assessment-demo/conditions/conditions-ui-v1.js');
          for (const marker of ['pa-selected-condition-v1','pa-condition-pathway-history-v1','data-start-condition','?condition=','condition-education-v1.js?v=20260724-content1','script.dataset.module = "condition-education-v1"']) if (!ui.includes(marker)) throw new Error(`Condition UI missing ${marker}`);

          const education = read('provider-assessment-demo/conditions/condition-education-v1.js');
          const typeMarkers = ['المسح أو الفرز','التقييم التشخيصي','التقييم الوظيفي','متابعة التقدم'];
          for (const marker of typeMarkers) if (!education.includes(marker)) throw new Error(`Assessment type missing: ${marker}`);
          for (const marker of ['progressByCondition','قائمة توثيق الحالة المهنية','دليل الأسرة ومقدم الخدمة','مراجعة جودة خطة التقييم','pa-condition-course-v1','aria-pressed','data-assessment-education']) if (!education.includes(marker)) throw new Error(`Education module missing ${marker}`);
          for (const item of registry.conditions) if (!education.includes(`"${item.slug}"`)) throw new Error(`Condition-specific progress indicators missing: ${item.slug}`);
          const officialSources = ['https://www.who.int/standards/classifications/international-classification-of-functioning-disability-and-health','https://www.aap.org/en/patient-care/developmental-surveillance-and-screening-patient-care/','https://www.cdc.gov/act-early/about/developmental-monitoring-and-screening.html'];
          for (const source of officialSources) if (!education.includes(source)) throw new Error(`Authoritative source missing: ${source}`);
          for (const claim of ['النتيجة المرتفعة في أداة مسح','لا تعني ثبوت الحالة','الدرجة دليل واحد ضمن مصادر متعددة','العوامل البيئية']) if (!education.includes(claim)) throw new Error(`Interpretation safeguard missing: ${claim}`);

          const bridge = read('provider-assessment-demo/condition-entry-v1.js');
          for (const marker of ['professional-search','open-condition-professional','conditions-hub-link','pa-selected-condition-v1','requestedView','professional-records']) if (!bridge.includes(marker)) throw new Error(`Condition bridge missing ${marker}`);

          const templates = read('provider-assessment-demo/professional-templates-v1.js');
          for (const marker of ['ratingTemplate','performanceTemplate','interviewTemplate','externalTemplate','classificationTemplate','behaviorTemplate','communicationTemplate','commonFields','informants','accommodations','بيانات القالب المهني']) if (!templates.includes(marker)) throw new Error(`Professional templates missing ${marker}`);
          if (!templates.includes('key.startsWith("detail_")') || !templates.includes('notesField.value')) throw new Error('Dynamic template persistence is incomplete');

          const reports = read('provider-assessment-demo/case-report-v1.js');
          for (const marker of ['view-reports','case-report-dialog','caseRecord.reports','versionNumber','export-case-report-html','export-case-report-json']) if (!reports.includes(marker)) throw new Error(`Case report engine missing ${marker}`);

          const interpretation = read('provider-assessment-demo/case-report-interpretation-v2.js');
          const contractFields = ['assessmentType','evidenceSources','decisionAuthority','functionalContexts','resultValidity','interpretationLimitations','baselineIndicator','measurementMethod','measurableGoal','remeasurementDate','providerInterpretation','familySummary','revisionReason','supersedesReportId','sourceVersionNumber','reviewAuditTrail','interpretationContractVersion'];
          for (const marker of contractFields) if (!interpretation.includes(marker)) throw new Error(`Report interpretation contract missing ${marker}`);
          for (const marker of ['screening','diagnostic','functional','progress']) if (!interpretation.includes(marker)) throw new Error(`Assessment type contract missing ${marker}`);
          for (const marker of ['fieldset','legend','role="note"','required-by-contract','data-screening-confirmation']) if (!interpretation.includes(marker)) throw new Error(`Report accessibility contract missing ${marker}`);
          for (const marker of ['data.assessmentType === "screening"','form.reportValidity()','form.elements.reportId.value = ""','computeChangedFields','reviewAuditTrail','PA_REPORT_INTERPRETATION_CONTRACT']) if (!interpretation.includes(marker)) throw new Error(`Versioning or audit safeguard missing ${marker}`);
          for (const marker of ['المسح لا يثبت التشخيص أو الأهلية','لا تُنسخ البنود أو مفاتيح التصحيح أو المعايير','ملخص موجه للأسرة أو الشخص','خط الأساس والهدف وإعادة القياس']) if (!interpretation.includes(marker)) throw new Error(`Interpretation safeguard missing ${marker}`);

          const institutional = read('provider-assessment-demo/institutional-live-v2.js');
          for (const marker of ['2026.07.24-live.7','loadConditionPathways','loadProfessionalTemplates','loadCaseReports','conditions/conditions-data-v1.js','condition-entry-v1.js','professional-templates-v1.js','case-report-v1.js','case-report-interpretation-v2.js']) if (!institutional.includes(marker)) throw new Error(`Institutional release missing ${marker}`);
          if (!read('provider-assessment-demo/sw-live-v2.js').includes('2026.07.24-live.7')) throw new Error('Service worker release mismatch');
          const platformIndex = read('provider-assessment-demo/index.html');
          for (const marker of ['<html lang="ar" dir="rtl"','2026.07.24-live.7','case-report-interpretation-v2.js?v=20260724-live7']) if (!platformIndex.includes(marker)) throw new Error(`Platform index missing ${marker}`);

          const sitemap = read('sitemap.xml');
          const sitemapConditionUrls = [...sitemap.matchAll(/provider-assessment-demo\/conditions\//g)].length;
          if (sitemapConditionUrls !== 21) throw new Error(`Expected 21 condition sitemap URLs, found ${sitemapConditionUrls}`);
          for (const item of registry.conditions) if (!sitemap.includes(`/conditions/${item.slug}/`)) throw new Error(`Sitemap missing ${item.slug}`);

          const combined = [read('provider-assessment-demo/conditions/conditions-data-v1.js'),ui,education,bridge,templates,reports,interpretation].join('\n');
          for (const token of ['fetch(','XMLHttpRequest','WebSocket','sendBeacon(','EventSource(','eval(','new Function(']) if (combined.includes(token)) throw new Error(`Network or unsafe API forbidden: ${token}`);

          console.log({conditionPages:20, assessmentTypes:4, conditionProgressSets:20, familyGuide:true, course:true, officialSources:3, commonDomains:registry.commonDomains.length, workflowStages:registry.workflowStages.length, templateFamilies:7, reports:true, reportInterpretationContract:true, immutableRevisions:true, familySummary:true, auditTrail:true, sitemapConditionUrls, release:'2026.07.24-live.7', status:'passed'});
          NODE