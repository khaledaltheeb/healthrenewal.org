name: Verify live Stroop deployment v213

on:
  push:
    branches: ["ops/verify-live-stroop-v213"]
    paths:
      - ".github/workflows/verify-live-stroop-v213.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  verify-live-stroop:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BASE_URL: https://khaledaltheeb.github.io/pterminology-site/
      EVIDENCE_ISSUE: "187"
      V214_MERGE_SHA: a08e3092352ba786c74ab01d647260ad531b8d55
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Wait for a validated v214-or-later live deployment
        run: |
          set -euo pipefail
          rm -f /tmp/deployment.json /tmp/stroop-basic.html /tmp/lab-v12.js
          matched=0
          for attempt in $(seq 1 100); do
            token="$(date +%s)-${attempt}"
            if curl --retry 2 --retry-delay 2 -H 'Cache-Control: no-cache' -fsSL "${BASE_URL}deployment.json?v=${token}" -o /tmp/deployment.json \
              && curl --retry 2 --retry-delay 2 -H 'Cache-Control: no-cache' -fsSL "${BASE_URL}cognitive-lab/stroop-basic/?v=${token}" -o /tmp/stroop-basic.html \
              && curl --retry 2 --retry-delay 2 -H 'Cache-Control: no-cache' -fsSL "${BASE_URL}assets/js/lab-v12.js?v=213&probe=${token}" -o /tmp/lab-v12.js; then
              if V214_MERGE_SHA="${V214_MERGE_SHA}" GH_TOKEN="${GH_TOKEN}" GITHUB_REPOSITORY="${GITHUB_REPOSITORY}" ATTEMPT="${attempt}" python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          deployment=json.loads(Path('/tmp/deployment.json').read_text(encoding='utf-8'))
          html=Path('/tmp/stroop-basic.html').read_text(encoding='utf-8')
          runtime=Path('/tmp/lab-v12.js').read_text(encoding='utf-8')
          live=deployment.get('commit')
          base=os.environ['V214_MERGE_SHA']
          descendant=False
          compare_status=None
          if live:
              if live==base:
                  descendant=True
                  compare_status='identical'
              else:
                  headers={
                      'Authorization':f"Bearer {os.environ['GH_TOKEN']}",
                      'Accept':'application/vnd.github+json',
                      'X-GitHub-Api-Version':'2022-11-28',
                      'User-Agent':'pterminology-live-stroop-v214',
                  }
                  request=urllib.request.Request(f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/compare/{base}...{live}",headers=headers)
                  try:
                      with urllib.request.urlopen(request,timeout=30) as response:
                          compare_status=json.loads(response.read().decode('utf-8')).get('status')
                      descendant=compare_status in {'ahead','identical'}
                  except Exception:
                      descendant=False
          evidence={
              'attempt':int(os.environ['ATTEMPT']),
              'live_commit':live,
              'contains_v214_merge':descendant,
              'v214_to_live_compare':compare_status,
              'schema_version':deployment.get('schema_version'),
              'page_uses_v213':html.count('assets/js/lab-v12.js?v=213')==1,
              'page_has_no_unversioned_runtime':'assets/js/lab-v12.js"' not in html and "assets/js/lab-v12.js'" not in html,
              'page_is_stroop_basic':'"mode":"stroop_basic"' in html,
              'runtime_has_inline_ink':'class="stroop-word"' in runtime and 'style="color:' in runtime,
              'runtime_has_stimulus_metadata':'stimulusInk' in runtime and 'stimulusWord' in runtime,
              'runtime_has_six_color_palette':all(x in runtime for x in ['#b42318','#175cd3','#067647','#b54708','#6941c6','#087e8b']),
          }
          Path('/tmp/live-stroop-static-v213.json').write_text(json.dumps(evidence,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(evidence,ensure_ascii=False,indent=2))
          required=[
              'contains_v214_merge','page_uses_v213','page_has_no_unversioned_runtime','page_is_stroop_basic',
              'runtime_has_inline_ink','runtime_has_stimulus_metadata','runtime_has_six_color_palette'
          ]
          raise SystemExit(0 if all(evidence[key] for key in required) else 1)
          PY
              then
                matched=1
                break
              fi
            fi
            sleep 15
          done
          test "${matched}" -eq 1

      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Measure live computed ink colors after clearing all caches
        run: |
          cat > /tmp/live-stroop-v213.mjs <<'NODE'
          import fs from 'node:fs';
          import { chromium } from 'playwright';
          const base=process.env.BASE_URL;
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:390,height:844},locale:'ar-JO'});
          const page=await context.newPage();
          const errors=[];
          page.on('pageerror',error=>errors.push(String(error)));
          page.on('console',message=>{if(message.type()==='error')errors.push(message.text())});
          const token=Date.now();
          await page.goto(`${base}cognitive-lab/stroop-basic/?v=${token}`,{waitUntil:'networkidle',timeout:60000});
          await page.evaluate(async()=>{
            localStorage.clear();
            sessionStorage.clear();
            if('serviceWorker' in navigator){
              const registrations=await navigator.serviceWorker.getRegistrations();
              await Promise.all(registrations.map(registration=>registration.unregister()));
            }
            if('caches' in window){
              const keys=await caches.keys();
              await Promise.all(keys.map(key=>caches.delete(key)));
            }
          });
          await context.clearCookies();
          await page.goto(`${base}cognitive-lab/stroop-basic/?v=${token+1}`,{waitUntil:'networkidle',timeout:60000});
          const scriptSrc=await page.locator('script[src*="assets/js/lab-v12.js"]').getAttribute('src');
          if(!scriptSrc?.includes('lab-v12.js?v=213'))throw new Error(`Live page is not using v213: ${scriptSrc}`);
          const inks=new Set(),words=new Set(),computed=new Set();
          const trials=[];
          for(let index=0;index<30;index++){
            const start=page.locator('button.start');
            if(await start.count())await start.click();
            await page.waitForSelector('.stroop-word',{timeout:10000});
            const stimulus=await page.locator('.stroop-word').evaluate(node=>({
              ink:node.dataset.ink||'',
              word:node.dataset.word||'',
              computed:getComputedStyle(node).color,
              inline:node.getAttribute('style')||''
            }));
            if(!stimulus.ink||!stimulus.word||!stimulus.computed||!stimulus.inline.includes('color:'))throw new Error(`Invalid stimulus ${index}: ${JSON.stringify(stimulus)}`);
            inks.add(stimulus.ink);words.add(stimulus.word);computed.add(stimulus.computed);trials.push(stimulus);
            await page.locator('button.choice-button').first().click();
            await page.waitForTimeout(20);
          }
          const deployment=await page.evaluate(async base=>await (await fetch(`${base}deployment.json?v=${Date.now()}`,{cache:'no-store'})).json(),base);
          const report={
            liveCommit:deployment.commit,
            scriptSrc,
            sampledTrials:trials.length,
            inkValues:[...inks],
            wordValues:[...words],
            computedColors:[...computed],
            distinctInkValues:inks.size,
            distinctWordValues:words.size,
            distinctComputedColors:computed.size,
            errors,
            trials
          };
          fs.writeFileSync('/tmp/live-stroop-browser-v213.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify(report,null,2));
          await browser.close();
          if(errors.length)process.exit(1);
          if(inks.size<6||words.size<6||computed.size<6)process.exit(2);
          NODE
          node /tmp/live-stroop-v213.mjs

      - name: Upload live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-stroop-evidence-v214
          path: |
            /tmp/deployment.json
            /tmp/live-stroop-static-v213.json
            /tmp/live-stroop-browser-v213.json
          if-no-files-found: warn
          retention-days: 7

      - name: Publish evidence to issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const read = path => fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : '{"status":"missing"}';
            const staticEvidence = read('/tmp/live-stroop-static-v213.json');
            const browserEvidence = read('/tmp/live-stroop-browser-v213.json');
            const body = [
              `## Final live Stroop v214 probe — run ${context.runId}`,
              '### Static deployment evidence',
              '```json', staticEvidence, '```',
              '### Clean-browser computed-color evidence',
              '```json', browserEvidence, '```'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.EVIDENCE_ISSUE),
              body
            });
