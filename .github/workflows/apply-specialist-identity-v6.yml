name: Apply specialist identity v6 patch

on:
  pull_request:
    branches: ["main"]
    paths:
      - "tools/apply_specialist_identity_v6.py"
      - "tools/specialist_identity_v6_payload.*"
      - ".github/workflows/apply-specialist-identity-v6.yml"

permissions:
  contents: write

concurrency:
  group: apply-specialist-identity-v6-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/specialist-identity-admin-v6
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Detect reviewed transport payload
        id: transport
        shell: bash
        run: |
          if compgen -G 'tools/specialist_identity_v6_payload.*' >/dev/null && [[ -f tools/apply_specialist_identity_v6.py ]]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Materialize checksum-verified implementation
        if: ${{ steps.transport.outputs.present == 'true' }}
        run: python tools/apply_specialist_identity_v6.py

      - name: Validate final implementation
        if: ${{ steps.transport.outputs.present == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          node --check specialists-partners/account-backend/src/index.js
          node --check specialists-partners/account/account.js
          node --check specialists-partners/admin/admin.js
          python -m unittest -v tests.test_specialist_accounts_v5 tests.test_specialist_identity_v6

      - name: Commit application files
        if: ${{ steps.transport.outputs.present == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tests/__pycache__
          git checkout HEAD -- .github/workflows
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "feat: add specialist identity and owner administration v6"
          git push origin HEAD:agent/specialist-identity-admin-v6
