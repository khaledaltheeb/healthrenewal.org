name: Normalize family guide v335 branch

on:
  push:
    branches: ["agent/family-guide-foundation-v335"]
    paths:
      - "family-guide/**"
      - ".github/workflows/normalize-family-guide-v335.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/family-guide-foundation-v335
          fetch-depth: 0
      - name: Apply canonical platform shell
        run: python scripts/normalize_platform_shell.py . --no-report
      - name: Validate normalized repository
        run: python scripts/normalize_platform_shell.py . --check --no-report
      - name: Commit normalized family guide pages
        run: |
          if git diff --quiet -- family-guide; then
            echo "No family guide normalization changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add family-guide
          git commit -m "fix: normalize family guide platform shell"
          git push origin HEAD:agent/family-guide-foundation-v335
