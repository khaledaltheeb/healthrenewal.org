name: Repair canonical domain DNS

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-canonical-domain-dns.yml"
      - "CNAME"
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

env:
  DOMAIN: healthrenewal.org
  WWW_DOMAIN: www.healthrenewal.org
  CLOUDFLARE_ACCOUNT_ID: 826ac34927c1e045c06145a327c2ac52
  GITHUB_PAGES_TARGET: khaledaltheeb.github.io

concurrency:
  group: canonical-domain-dns
  cancel-in-progress: false

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout canonical repository state
        uses: actions/checkout@v4

      - name: Validate repository CNAME contract
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n ' < CNAME)" = "${DOMAIN}"
          grep -Fq '<link rel="canonical" href="https://healthrenewal.org/">' index.html

      - name: Repair Cloudflare website DNS without touching mail
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          API = "https://api.cloudflare.com/client/v4"
          TOKEN = os.environ["CLOUDFLARE_API_TOKEN"]
          ACCOUNT_ID = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          DOMAIN = os.environ["DOMAIN"]
          WWW = os.environ["WWW_DOMAIN"]
          TARGET = os.environ["GITHUB_PAGES_TARGET"]

          desired = [
              {"type": "A", "name": DOMAIN, "content": "185.199.108.153", "ttl": 3600, "proxied": False},
              {"type": "A", "name": DOMAIN, "content": "185.199.109.153", "ttl": 3600, "proxied": False},
              {"type": "A", "name": DOMAIN, "content": "185.199.110.153", "ttl": 3600, "proxied": False},
              {"type": "A", "name": DOMAIN, "content": "185.199.111.153", "ttl": 3600, "proxied": False},
              {"type": "AAAA", "name": DOMAIN, "content": "2606:50c0:8000::153", "ttl": 3600, "proxied": False},
              {"type": "AAAA", "name": DOMAIN, "content": "2606:50c0:8001::153", "ttl": 3600, "proxied": False},
              {"type": "AAAA", "name": DOMAIN, "content": "2606:50c0:8002::153", "ttl": 3600, "proxied": False},
              {"type": "AAAA", "name": DOMAIN, "content": "2606:50c0:8003::153", "ttl": 3600, "proxied": False},
              {"type": "CNAME", "name": WWW, "content": TARGET, "ttl": 3600, "proxied": False},
          ]

          def request(method: str, path: str, payload=None):
              body = None if payload is None else json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(
                  API + path,
                  data=body,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {TOKEN}",
                      "Accept": "application/json",
                      "Content-Type": "application/json",
                      "User-Agent": "healthrenewal-domain-repair/1.0",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=40) as response:
                      data = json.load(response)
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode("utf-8", errors="replace")
                  raise SystemExit(f"Cloudflare API {method} {path} failed: HTTP {exc.code}: {detail[:1000]}")
              if not data.get("success"):
                  raise SystemExit(f"Cloudflare API {method} {path} failed: {data.get('errors')}")
              return data

          query = urllib.parse.urlencode({"name": DOMAIN, "account.id": ACCOUNT_ID, "status": "active", "per_page": 50})
          zones = request("GET", f"/zones?{query}").get("result", [])
          if len(zones) != 1:
              raise SystemExit({"expected_one_active_zone": DOMAIN, "found": [(z.get('id'), z.get('status')) for z in zones]})
          zone = zones[0]
          zone_id = zone["id"]

          records = request("GET", f"/zones/{zone_id}/dns_records?per_page=500").get("result", [])
          Path("dns-before.json").write_text(json.dumps(records, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          managed_names = {DOMAIN, WWW}
          managed_types = {"A", "AAAA", "CNAME"}
          desired_keys = {(item["type"], item["name"].rstrip("."), item["content"].rstrip(".")) for item in desired}

          deleted = []
          kept = []
          for record in records:
              key = (record.get("type"), str(record.get("name", "")).rstrip("."), str(record.get("content", "")).rstrip("."))
              name = key[1]
              if name in managed_names and record.get("type") in managed_types:
                  if key not in desired_keys:
                      request("DELETE", f"/zones/{zone_id}/dns_records/{record['id']}")
                      deleted.append({"type": record.get("type"), "name": name, "content": record.get("content")})
                  else:
                      payload = {
                          "type": record["type"],
                          "name": name,
                          "content": str(record["content"]).rstrip("."),
                          "ttl": 3600,
                          "proxied": False,
                          "comment": "Canonical GitHub Pages DNS managed by repair-canonical-domain-dns.yml",
                      }
                      request("PUT", f"/zones/{zone_id}/dns_records/{record['id']}", payload)
                      kept.append(key)

          for item in desired:
              key = (item["type"], item["name"], item["content"])
              if key in kept:
                  continue
              payload = dict(item)
              payload["comment"] = "Canonical GitHub Pages DNS managed by repair-canonical-domain-dns.yml"
              request("POST", f"/zones/{zone_id}/dns_records", payload)

          time.sleep(5)
          after = request("GET", f"/zones/{zone_id}/dns_records?per_page=500").get("result", [])
          Path("dns-after.json").write_text(json.dumps(after, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          actual_keys = {
              (item.get("type"), str(item.get("name", "")).rstrip("."), str(item.get("content", "")).rstrip("."))
              for item in after
              if str(item.get("name", "")).rstrip(".") in managed_names and item.get("type") in managed_types
          }
          if actual_keys != desired_keys:
              raise SystemExit({"dns_contract_mismatch": {"desired": sorted(desired_keys), "actual": sorted(actual_keys)}})

          mail = [
              {"type": r.get("type"), "name": r.get("name"), "content": r.get("content"), "priority": r.get("priority")}
              for r in after
              if r.get("type") in {"MX", "TXT"}
          ]
          report = {
              "domain": DOMAIN,
              "zone_id": zone_id,
              "zone_status": zone.get("status"),
              "nameservers": zone.get("name_servers", []),
              "deleted_conflicting_website_records": deleted,
              "canonical_website_records": desired,
              "preserved_mail_and_verification_record_count": len(mail),
              "preserved_mail_and_verification_records": mail,
          }
          Path("domain-repair-report.json").write_text(json.dumps(report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps({k: v for k, v in report.items() if k != "preserved_mail_and_verification_records"}, ensure_ascii=False))
          PY

      - name: Verify public DNS delegation and records
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import time
          import urllib.parse
          import urllib.request
          from pathlib import Path

          domain = os.environ["DOMAIN"]
          www = os.environ["WWW_DOMAIN"]
          expected_a = {"185.199.108.153", "185.199.109.153", "185.199.110.153", "185.199.111.153"}
          expected_aaaa = {"2606:50c0:8000::153", "2606:50c0:8001::153", "2606:50c0:8002::153", "2606:50c0:8003::153"}

          def resolve(name, rtype):
              query = urllib.parse.urlencode({"name": name, "type": rtype, "cd": "false", "do": "true"})
              req = urllib.request.Request(
                  f"https://dns.google/resolve?{query}",
                  headers={"Accept": "application/dns-json", "User-Agent": "healthrenewal-domain-verify/1.0"},
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          snapshots = {}
          matched = False
          for attempt in range(1, 13):
              snapshots = {
                  "NS": resolve(domain, "NS"),
                  "A": resolve(domain, "A"),
                  "AAAA": resolve(domain, "AAAA"),
                  "WWW_CNAME": resolve(www, "CNAME"),
                  "MX": resolve(domain, "MX"),
                  "TXT": resolve(domain, "TXT"),
              }
              def values(key):
                  return {str(item.get("data", "")).rstrip(".") for item in snapshots[key].get("Answer", [])}
              ns = {value.lower() for value in values("NS")}
              a = values("A")
              aaaa = values("AAAA")
              cname = {value.lower() for value in values("WWW_CNAME")}
              matched = (
                  snapshots["NS"].get("Status") == 0
                  and ns
                  and all(value.endswith(".ns.cloudflare.com") for value in ns)
                  and expected_a.issubset(a)
                  and expected_aaaa.issubset(aaaa)
                  and "khaledaltheeb.github.io" in cname
              )
              if matched:
                  break
              time.sleep(15)

          Path("public-dns-snapshot.json").write_text(json.dumps(snapshots, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          if not matched:
              raise SystemExit("Public DNS did not reach the canonical Cloudflare/GitHub Pages contract during verification window")
          print({"delegation": "cloudflare", "apex_ipv4": 4, "apex_ipv6": 4, "www_cname": "khaledaltheeb.github.io"})
          PY

      - name: Verify HTTPS and canonical host behavior
        run: |
          set -euo pipefail
          success=0
          for attempt in $(seq 1 12); do
            root_code="$(curl -L -sS -o /tmp/root.html -w '%{http_code}' --connect-timeout 15 --max-time 45 "https://${DOMAIN}/?dns_verify=${GITHUB_SHA}-${attempt}" || true)"
            www_code="$(curl -L -sS -o /tmp/www.html -w '%{http_code}' --connect-timeout 15 --max-time 45 "https://${WWW_DOMAIN}/?dns_verify=${GITHUB_SHA}-${attempt}" || true)"
            if [ "$root_code" = "200" ] && [ "$www_code" = "200" ] && grep -Fq "healthrenewal.org" /tmp/root.html; then
              success=1
              break
            fi
            sleep 15
          done
          test "$success" -eq 1
          openssl s_client -connect "${DOMAIN}:443" -servername "${DOMAIN}" </dev/null 2>/dev/null \
            | openssl x509 -noout -subject -issuer -dates -ext subjectAltName \
            > tls-certificate.txt
          grep -Fq "DNS:${DOMAIN}" tls-certificate.txt

      - name: Publish domain audit summary
        if: always()
        run: |
          {
            echo "# Canonical domain audit"
            echo
            echo "- Domain: https://${DOMAIN}"
            echo "- Repository CNAME: ${DOMAIN}"
            echo "- Apex: four GitHub Pages IPv4 and four IPv6 records"
            echo "- www: CNAME to ${GITHUB_PAGES_TARGET}"
            echo "- Cloudflare proxy: disabled for GitHub Pages certificate stability"
            echo "- Mail records: preserved; this workflow never deletes MX or TXT"
            echo "- Checked at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } | tee domain-audit.md
          cat domain-audit.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload non-secret DNS evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-domain-dns-audit-${{ github.run_id }}
          path: |
            dns-before.json
            dns-after.json
            domain-repair-report.json
            public-dns-snapshot.json
            tls-certificate.txt
            domain-audit.md
          if-no-files-found: warn
          retention-days: 30
