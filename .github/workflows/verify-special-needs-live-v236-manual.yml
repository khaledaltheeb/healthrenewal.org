name: Verify special-needs live deployment v236 manual

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/verify-special-needs-live-v236-manual.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: special-needs-live-v236-manual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      EXPECTED_SHA: b2f67cc76e709b0b6308ae45e57f52a21f012f0a
      BASE_URL: https://khaledaltheeb.github.io/pterminology-site/
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b2f67cc76e709b0b6308ae45e57f52a21f012f0a

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download uncached live evidence with per-URL diagnostics
        id: download
        shell: bash
        run: |
          set -uo pipefail
          root=/tmp/special-needs-live-v236
          rm -rf "${root}"
          mkdir -p "${root}/api" "${root}/special-needs"
          token="${EXPECTED_SHA}-manual-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          diagnostics="${root}/api/live-download-diagnostics-v236.tsv"
          printf 'label\tstatus\tbytes\turl\n' > "${diagnostics}"
          failures=0

          download() {
            label="$1"; relative="$2"; output="$3"
            mkdir -p "$(dirname "${output}")"
            url="${BASE_URL}${relative}?v=${token}"
            tmp="${output}.part"
            status=$(curl --retry 4 --retry-delay 4 --retry-all-errors \
              -H 'Cache-Control: no-cache' -sS -L \
              -o "${tmp}" -w '%{http_code}' "${url}" || printf '000')
            bytes=0
            if [ -f "${tmp}" ]; then bytes=$(wc -c < "${tmp}"); fi
            printf '%s\t%s\t%s\t%s\n' "${label}" "${status}" "${bytes}" "${url}" | tee -a "${diagnostics}"
            if [ "${status}" = "200" ] && [ "${bytes}" -gt 0 ]; then
              mv "${tmp}" "${output}"
            else
              failures=$((failures+1))
              rm -f "${tmp}"
            fi
          }

          download deployment deployment.json "${root}/deployment.json"
          download report api/special-needs-guides-v221.json "${root}/api/special-needs-guides-v221.json"
          download hub special-needs/ "${root}/special-needs/index.html"
          download sitemap sitemap-special-needs.xml "${root}/sitemap-special-needs.xml"
          for slug in \
            assessment-homework-accommodations-plan \
            visual-schedules-transitions-home-school-plan \
            inclusive-play-peer-friendship-plan \
            siblings-family-balance-support-plan \
            accessible-family-emergency-preparedness-plan; do
            download "guide:${slug}" "special-needs/${slug}/" "${root}/special-needs/${slug}/index.html"
          done

          python - <<'PY'
          import csv,json
          from pathlib import Path
          tsv=Path('/tmp/special-needs-live-v236/api/live-download-diagnostics-v236.tsv')
          rows=list(csv.DictReader(tsv.open(encoding='utf-8'),delimiter='\t'))
          payload={
              'version':236,
              'expected_sha':'b2f67cc76e709b0b6308ae45e57f52a21f012f0a',
              'status':'passed' if rows and all(row['status']=='200' and int(row['bytes'])>0 for row in rows) else 'failed',
              'downloads':rows,
          }
          Path('/tmp/special-needs-live-v236/api/live-download-diagnostics-v236.json').write_text(
              json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(payload,ensure_ascii=False,indent=2))
          PY
          if [ "${failures}" -ne 0 ]; then
            echo "Required live downloads failed: ${failures}" >&2
            exit 1
          fi

      - name: Verify SHA, twenty-five links, five batches and v214 pages
        env:
          PYTHONPATH: .
        run: |
          set -euxo pipefail
          python scripts/verify_special_needs_deployment_v236.py \
            /tmp/special-needs-live-v236 \
            --mode live \
            --expected-sha "${EXPECTED_SHA}"

      - name: Prove blocked review sources remain private
        run: |
          set -euxo pipefail
          token="${EXPECTED_SHA}-blocked-${GITHUB_RUN_ID}"
          for path in \
            content/v73/special-needs-executable-instructions-ar.json \
            data/disability-dignity-safety.json \
            data/urgent-help-governance.json; do
            status=$(curl --retry 3 --retry-delay 3 --retry-all-errors -H 'Cache-Control: no-cache' \
              -sS -L -o /tmp/blocked-response -w '%{http_code}' \
              "${BASE_URL}${path}?v=${token}")
            case "${status}" in
              404|410) ;;
              *) echo "Blocked review source returned HTTP ${status}: ${path}" >&2; exit 1 ;;
            esac
          done

      - name: Enrich evidence with manual verification context
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('/tmp/special-needs-live-v236/api/special-needs-deployment-v236.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          data.update({
              'verification_trigger':'pull-request-manual-proof',
              'expected_sha':'b2f67cc76e709b0b6308ae45e57f52a21f012f0a',
              'blocked_review_files_published':False,
          })
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          assert data['status']=='passed',data
          assert data['guide_count']==25,data
          assert data['batch_count']==5,data
          assert data['hub_links']==25,data
          assert data['v214_pages_verified']==5,data
          print(json.dumps(data,ensure_ascii=False,indent=2))
          PY

      - name: Upload live deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: special-needs-live-v236
          path: |
            /tmp/special-needs-live-v236/api/special-needs-deployment-v236.json
            /tmp/special-needs-live-v236/api/live-download-diagnostics-v236.json
            /tmp/special-needs-live-v236/api/live-download-diagnostics-v236.tsv
          if-no-files-found: warn
          retention-days: 30
