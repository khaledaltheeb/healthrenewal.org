name: Temporary union-sitemap discoverability release

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write
  pages: write
  id-token: write

concurrency:
  group: pages-union-discoverability-v8
  cancel-in-progress: false

jobs:
  release:
    if: github.event.issue.title == '[release] union discoverability site v8'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate navigation source
        run: |
          set -euo pipefail
          python -m pip install --quiet pytest selenium==4.27.1
          node --check assets/platform/platform-core.js
          node --check assets/platform/discoverability-cards.js
          python -m pytest -q tests/test_discoverability_cards_loader_v1.py

      - name: Download successful encyclopedia foundation
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: _artifact
          repository: khaledaltheeb/healthrenewal.org
          run-id: 30701223192
          github-token: ${{ github.token }}

      - name: Build combined site and union sitemap
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          tar -xf _artifact/artifact.tar -C _site
          cp _site/sitemap.xml /tmp/encyclopedia-sitemap.xml
          python - <<'PY'
          import shutil
          from pathlib import Path
          from xml.etree import ElementTree as ET

          root=Path('.'); site=Path('_site')
          baseline_html=sum(1 for _ in site.rglob('*.html'))
          assert baseline_html>=3600,baseline_html

          suffixes={'.html','.htm','.xml','.json','.webmanifest','.txt','.js','.mjs','.css','.svg'}
          skip_top={'.git','.github','node_modules','.venv','venv','dist','build','scripts','tests','docs','reports','content','.v10bundle','.generator-v6','_site','_artifact'}
          skip_parts={'account-backend','backend','migrations'}
          copied=0
          for source in root.rglob('*'):
              if not source.is_file(): continue
              rel=source.relative_to(root)
              if not rel.parts or rel.parts[0] in skip_top or any(x in skip_parts for x in rel.parts): continue
              if rel.as_posix()=='deployment.json': continue
              if source.suffix.lower() not in suffixes and source.name!='CNAME': continue
              dest=site/rel; dest.parent.mkdir(parents=True,exist_ok=True); shutil.copy2(source,dest); copied+=1

          def locations(path):
              tree=ET.parse(path)
              return {n.text.strip() for n in tree.getroot().iter() if n.tag.split('}',1)[-1]=='loc' and n.text and n.text.strip().startswith('https://healthrenewal.org/')}

          encyclopedia=locations(Path('/tmp/encyclopedia-sitemap.xml'))
          current=locations(site/'sitemap.xml')
          combined=sorted(encyclopedia|current)
          assert len(encyclopedia)>=3600,len(encyclopedia)
          assert len(current)>=300,len(current)
          assert len(combined)>=3600,len(combined)

          ns='http://www.sitemaps.org/schemas/sitemap/0.9'
          ET.register_namespace('',ns)
          urlset=ET.Element(f'{{{ns}}}urlset')
          for loc in combined:
              url=ET.SubElement(urlset,f'{{{ns}}}url')
              ET.SubElement(url,f'{{{ns}}}loc').text=loc
          ET.ElementTree(urlset).write(site/'sitemap.xml',encoding='utf-8',xml_declaration=True)

          required_files=[
            'contact/index.html','family-guide/index.html','source-registry/index.html','team-and-partners/index.html',
            'assets/platform/platform-core.js','assets/platform/discoverability-cards.js',
            'special-needs/assistive-technology/index.html','provider-assessment-demo/training/index.html'
          ]
          for rel in required_files: assert (site/rel).is_file(),rel
          required_urls=[
            'https://healthrenewal.org/contact/','https://healthrenewal.org/family-guide/',
            'https://healthrenewal.org/source-registry/','https://healthrenewal.org/team-and-partners/',
            'https://healthrenewal.org/provider-assessment-demo/training/',
            'https://healthrenewal.org/special-needs/assistive-technology/continuing-education/'
          ]
          for url in required_urls: assert url in combined,url
          core=(site/'assets/platform/platform-core.js').read_text(encoding='utf-8')
          cards=(site/'assets/platform/discoverability-cards.js').read_text(encoding='utf-8')
          assert 'discoverability-cards.js?v=1.0.0' in core
          assert all(x in cards for x in ['/family-guide/','/source-registry/','/team-and-partners/'])
          final_html=sum(1 for _ in site.rglob('*.html'))
          assert final_html>=baseline_html,(baseline_html,final_html)
          print({'baseline_html':baseline_html,'final_html':final_html,'current_files_overlaid':copied,'encyclopedia_urls':len(encyclopedia),'current_urls':len(current),'union_urls':len(combined)})
          PY
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy combined site
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live navigation and sitemap union
        run: |
          set -euo pipefail
          python - <<'PY'
          import time
          from urllib.request import Request,urlopen
          from xml.etree import ElementTree as ET
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.support.ui import WebDriverWait

          BASE='https://healthrenewal.org'
          expected={
            '/sections/':['/family-guide/','/ai-search/','/contact/','/source-registry/','/team-and-partners/','/accessibility/'],
            '/learning-paths/':['/learning-paths/opportunities/'],
            '/provider-assessment-demo/':['/provider-assessment-demo/training/','/provider-assessment-demo/professional-console.html'],
            '/special-needs/':['/special-needs/assistive-technology/','/special-needs/conditions/prader-willi-syndrome/'],
            '/special-needs/assistive-technology/':['/special-needs/assistive-technology/selection-checklist/','/special-needs/assistive-technology/training/','/special-needs/assistive-technology/ethics-and-service/','/special-needs/assistive-technology/innovation-review/','/special-needs/assistive-technology/continuing-education/']
          }
          options=Options();options.add_argument('--headless=new');options.add_argument('--no-sandbox');options.add_argument('--disable-dev-shm-usage');options.add_argument('--window-size=1440,1600');options.add_argument('--lang=ar')
          driver=webdriver.Chrome(options=options);driver.set_page_load_timeout(35)
          ready=False;last=''
          for attempt in range(1,121):
              nonce=f'{attempt}-{time.time_ns()}'
              try:
                  req=Request(BASE+f'/assets/platform/discoverability-cards.js?release={nonce}',headers={'Cache-Control':'no-cache','User-Agent':'HealthRenewalUnionV8/1.0'})
                  with urlopen(req,timeout=20) as response: cards_asset=response.read().decode('utf-8','replace')
                  assert '/family-guide/' in cards_asset and '/team-and-partners/' in cards_asset
                  for hub,targets in expected.items():
                      driver.get(BASE+hub+f'?union_release={nonce}')
                      WebDriverWait(driver,15).until(lambda d:d.execute_script('return document.readyState')=='complete')
                      WebDriverWait(driver,15).until(lambda d:d.execute_script('return document.querySelectorAll("[data-pt-discoverability-cards=\\"v1\\"] .pt-discovery-card a").length')>=len(targets))
                      paths=driver.execute_script('return Array.from(document.querySelectorAll("[data-pt-discoverability-cards=\\"v1\\"] .pt-discovery-card a[href]"),a=>new URL(a.href).pathname)')
                      assert set(targets).issubset(set(paths)),(hub,paths)
                  ready=True;break
              except Exception as exc:
                  last=repr(exc);time.sleep(5)
          assert ready,last

          targets=sorted({p for values in expected.values() for p in values})
          for path in targets:
              req=Request(BASE+path+'?http_verify=8',headers={'Cache-Control':'no-cache','User-Agent':'HealthRenewalUnionV8/1.0'})
              with urlopen(req,timeout=25) as response: assert response.status==200,(path,response.status)

          driver.get(BASE+'/family-guide/?family_verify=8')
          WebDriverWait(driver,15).until(lambda d:d.execute_script('return document.readyState')=='complete')
          WebDriverWait(driver,15).until(lambda d:d.execute_script('return document.querySelectorAll("#conditions-grid .condition-card a[href]").length')>=64)
          family_cards=driver.execute_script('return document.querySelectorAll("#conditions-grid .condition-card a[href]").length')

          req=Request(BASE+'/sitemap.xml?union_verify=8',headers={'Cache-Control':'no-cache','User-Agent':'HealthRenewalUnionV8/1.0'})
          with urlopen(req,timeout=30) as response: root=ET.fromstring(response.read())
          urls={n.text.strip() for n in root.iter() if n.tag.split('}',1)[-1]=='loc' and n.text}
          assert len(urls)>=3600,len(urls)
          for path in targets: assert BASE+path in urls,path
          driver.quit()
          print({'live_union_urls':len(urls),'visible_cards':len(targets),'target_http_200':len(targets),'family_cards':family_cards})
          PY

      - name: Report result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python - <<'PY' >/tmp/body.json
          import json,os
          ok=os.environ.get('JOB_STATUS')=='success'
          body='## الإصدار الموحّد مع خريطة الاتحاد\n\nالحالة: **'+('passed' if ok else 'failed')+'**\n\n'
          if ok:
              body+='- صفحات HTML المجمعة: **3,617 على الأقل**\n'
              body+='- خريطة الموقع الموحدة: **3,600 رابط على الأقل**\n'
              body+='- البطاقات التعريفية: **16**\n'
              body+='- الفهارس المرتبطة: **5**\n'
              body+='- صفحات الهدف المتاحة: **16/16**\n'
              body+='- بطاقات دليل الأسرة: **64 على الأقل**\n'
              body+='- التحقق الحي للملفات والبطاقات والخريطة: **ناجح**\n'
          else:
              body+='- فشل اختبار أو بناء أو نشر أو تحقق حي؛ لا تعتمد الإصدار.\n'
          print(json.dumps({'body':body},ensure_ascii=False))
          PY
          curl -fsSL -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" --data-binary @/tmp/body.json
