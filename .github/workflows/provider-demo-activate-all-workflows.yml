name: Activate every professional assessment workflow

# Historical one-shot activation workflow retained for auditability.
# It is intentionally read-only: production source changes must be made
# through reviewed commits, never by CI mutating or deleting repository files.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/provider-demo-activate-all-workflows.yml"
      - "provider-assessment-demo/index.html"
      - "provider-assessment-demo/professional-master-registry.js"

permissions:
  contents: read

concurrency:
  group: provider-demo-professional-activation-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit-current-state:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository read-only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Verify professional assessment surface without mutation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          index = Path('provider-assessment-demo/index.html')
          registry = Path('provider-assessment-demo/professional-master-registry.js')

          missing = [str(path) for path in (index, registry) if not path.is_file()]
          if missing:
              raise SystemExit(f'Missing required professional assessment files: {missing}')

          html = index.read_text(encoding='utf-8')
          registry_text = registry.read_text(encoding='utf-8')

          required_html_contracts = {
              'rtl document direction': 'dir="rtl"',
              'responsive viewport': 'name="viewport"',
              'professional registry script': 'professional-master-registry.js',
              'main landmark': '<main',
          }
          failed = [name for name, token in required_html_contracts.items() if token not in html]
          if failed:
              raise SystemExit(f'Professional assessment HTML contract failed: {failed}')

          if not registry_text.strip():
              raise SystemExit('Professional assessment registry is empty')

          forbidden_ci_mutation_tokens = ('git push', 'git commit', 'rm -f .github/workflows/')
          workflow = Path('.github/workflows/provider-demo-activate-all-workflows.yml').read_text(encoding='utf-8')
          violations = [token for token in forbidden_ci_mutation_tokens if token in workflow]
          if violations:
              raise SystemExit(f'Read-only CI contract violated: {violations}')

          print('Professional assessment activation history retained; current surface passed read-only semantic audit.')
          PY

      - name: Verify working tree is unchanged
        shell: bash
        run: git diff --exit-code -- .
