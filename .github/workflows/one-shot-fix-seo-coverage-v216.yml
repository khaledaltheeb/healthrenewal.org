name: One-shot fix SEO coverage v216

on:
  push:
    branches: ["agent/sitewide-seo-v216"]
    paths:
      - ".github/workflows/one-shot-fix-seo-coverage-v216.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sitewide-seo-v216
          fetch-depth: 0
      - name: Fix generic taxonomy coverage and verification-file exclusion
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/enhance_sitewide_seo_v216.py")
          text = path.read_text(encoding="utf-8")
          replacements = {
              'SKIP_FILES = {"404.html", "offline.html"}': 'SKIP_FILES = {"404.html", "offline.html", "google644f1f7a8b7aaa2b.html"}',
              '"ar": ["الصحة النفسية", "علم النفس", "مصطلحات علم النفس"],': '"ar": ["الصحة النفسية", "علم النفس", "مصطلحات علم النفس", "التثقيف النفسي"],',
              '"en": ["mental health", "psychology", "psychology terminology"],': '"en": ["mental health", "psychology", "psychology terminology", "mental health education"],',
              '"es": ["salud mental", "psicología", "términos de psicología"],': '"es": ["salud mental", "psicología", "términos de psicología", "educación en salud mental"],',
          }
          for old, new in replacements.items():
              if old not in text and new not in text:
                  raise SystemExit(f"Missing patch marker: {old}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
          rm .github/workflows/one-shot-fix-seo-coverage-v216.yml
      - name: Commit coverage fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/enhance_sitewide_seo_v216.py .github/workflows/one-shot-fix-seo-coverage-v216.yml
          git commit -m "SEO: cover generic collections and skip verification HTML"
          git push origin HEAD:agent/sitewide-seo-v216
