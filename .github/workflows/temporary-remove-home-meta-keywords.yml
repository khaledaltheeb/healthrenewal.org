name: Temporary homepage meta-keywords cleanup

on:
  push:
    branches:
      - agent/seo-remove-home-meta-keywords-20260730
    paths:
      - .github/workflows/temporary-remove-home-meta-keywords.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/seo-remove-home-meta-keywords-20260730
          fetch-depth: 0
      - name: Remove obsolete meta keywords and temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          lines = text.splitlines(keepends=True)
          matched = [line for line in lines if '<meta name="keywords"' in line.lower()]
          if len(matched) != 1:
              raise SystemExit(f'expected exactly one homepage meta keywords tag, found {len(matched)}')
          path.write_text(''.join(line for line in lines if '<meta name="keywords"' not in line.lower()), encoding='utf-8')
          PY
          rm .github/workflows/temporary-remove-home-meta-keywords.yml
          test "$(grep -ci '<meta name="keywords"' index.html || true)" -eq 0
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html .github/workflows/temporary-remove-home-meta-keywords.yml
          git commit -m "SEO: remove obsolete homepage meta keywords"
          git push origin HEAD:agent/seo-remove-home-meta-keywords-20260730
