name: Apply E5 runtime cleanup

on:
  pull_request:
    paths:
      - '.github/workflows/apply-e5-runtime-cleanup-temp.yml'
      - 'scripts/apply_e5_runtime_cleanup.py'

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/e5-json-pages-publish-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/e5-json-pages-publish-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply and validate
        run: |
          set -euxo pipefail
          python scripts/apply_e5_runtime_cleanup.py
          node --check ai-search/assets/search-worker.js
          python -m unittest -v tests.test_ai_search_browser_index_v2 tests.test_multilingual_e5_production_v3
      - name: Commit Worker source only
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai-search/assets/search-worker.js
          git commit -m 'fix: use verified default WASM fallback for E5'
          git push origin HEAD:agent/e5-json-pages-publish-v1
