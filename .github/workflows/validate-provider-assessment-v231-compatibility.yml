name: Validate provider assessment compatibility v231

on:
  pull_request:
    paths:
      - "provider-assessment-demo/institutional-contract-v220.js"
      - "provider-assessment-demo/institutional-contract-v231-compat.js"
      - "provider-assessment-demo/institutional-contract-v231-save-fallback.js"
      - "tests/test_provider_assessment_v231_compatibility.py"
      - ".github/workflows/validate-provider-assessment-v231-compatibility.yml"
      - ".github/workflows/validate-provider-assessment-v231-browser.yml"
  push:
    branches:
      - main
      - agent/provider-assessment-v231-compatibility-v236
    paths:
      - "provider-assessment-demo/institutional-contract-v220.js"
      - "provider-assessment-demo/institutional-contract-v231-compat.js"
      - "provider-assessment-demo/institutional-contract-v231-save-fallback.js"
      - "tests/test_provider_assessment_v231_compatibility.py"
      - ".github/workflows/validate-provider-assessment-v231-compatibility.yml"
      - ".github/workflows/validate-provider-assessment-v231-browser.yml"

permissions:
  contents: read
  statuses: write

jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate compatibility contract and JavaScript
        run: |
          node --check provider-assessment-demo/institutional-contract-v220.js
          node --check provider-assessment-demo/institutional-contract-v231-compat.js
          node --check provider-assessment-demo/institutional-contract-v231-save-fallback.js
          python -m unittest -v tests/test_provider_assessment_v231_compatibility.py
      - name: Publish contract commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          case "$JOB_STATUS" in
            success) STATE=success ;;
            cancelled) STATE=error ;;
            *) STATE=failure ;;
          esac
          curl --fail --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$SHA" \
            -d "{\"state\":\"$STATE\",\"target_url\":\"$RUN_URL\",\"description\":\"Contract and syntax checks for v231\",\"context\":\"v231/contract\"}" >/dev/null