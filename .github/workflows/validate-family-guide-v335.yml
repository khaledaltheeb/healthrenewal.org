name: Validate family guide v342

on:
  pull_request:
    branches: ["main"]
    paths:
      - "family-guide/**"
      - "api/family-guide-v1.json"
      - "api/family-guide-v1-phase8.json"
      - "api/family-guide-v2.json"
      - "sitemap-family-guide.xml"
      - "sitemap-family-guide-phase8.xml"
      - "sitemap-index.xml"
      - "tests/test_family_guide_v335.py"
      - "tests/test_family_guide_v342.py"
      - ".github/workflows/validate-family-guide-v335.yml"
  push:
    branches: ["main"]
    paths:
      - "family-guide/**"
      - "api/family-guide-v1.json"
      - "api/family-guide-v1-phase8.json"
      - "api/family-guide-v2.json"
      - "sitemap-family-guide.xml"
      - "sitemap-family-guide-phase8.xml"
      - "sitemap-index.xml"
      - "tests/test_family_guide_v335.py"
      - "tests/test_family_guide_v342.py"
      - ".github/workflows/validate-family-guide-v335.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-family-guide:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate core family guide inventory
        run: python tests/test_family_guide_v335.py
      - name: Validate phase 8 and combined inventory
        run: python tests/test_family_guide_v342.py
      - name: Validate JavaScript syntax
        run: |
          node --check family-guide/family-guide-ui.js
          node --check family-guide/family-guide-data.js
          node --check family-guide/family-guide-phase8-data.js
          for file in family-guide/conditions/*/data.js; do node --check "$file"; done
      - name: Parse family guide JSON and XML
        run: |
          python - <<'PY'
          import json, xml.etree.ElementTree as ET
          for path in ['api/family-guide-v1.json','api/family-guide-v1-phase8.json','api/family-guide-v2.json']:
              json.load(open(path,encoding='utf-8'))
          for path in ['sitemap-family-guide.xml','sitemap-family-guide-phase8.xml','sitemap-index.xml']:
              ET.parse(path)
          print({'json':'passed','xml':'passed'})
          PY
