name: Repair sitemap discovery contract

on:
  push:
    branches:
      - fix/institutional-route-hubs-v1
    paths:
      - scripts/repair_sitemap_discovery_contract_v1.py
      - .github/workflows/repair-sitemap-discovery-contract-v1.yml

permissions:
  contents: write

concurrency:
  group: repair-sitemap-discovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/institutional-route-hubs-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repair publisher and regenerate sitemap outputs
        run: python scripts/repair_sitemap_discovery_contract_v1.py
      - name: Verify institutional discovery and formatting
        run: |
          python -m unittest tests.test_institutional_route_hubs_v1 -v
          python scripts/validate_sitemap_discovery_contract.py
          git diff --check
      - name: Commit permanent publisher and sitemap outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            scripts/publish_complete_sitemap_v360.py \
            robots.txt \
            sitemap.xml \
            sitemap-index.xml \
            api/sitemap-completeness-v360.json
          if git diff --cached --quiet; then
            echo 'Sitemap discovery contract already repaired.'
            exit 0
          fi
          git commit -m 'fix(seo): align sitemap publisher with discovery contract [sitemap-contract]'
          git push origin HEAD:fix/institutional-route-hubs-v1