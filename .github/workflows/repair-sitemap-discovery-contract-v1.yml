name: Validate sitemap discovery contract

on:
  pull_request:
    paths:
      - scripts/repair_sitemap_discovery_contract_v1.py
      - scripts/publish_complete_sitemap_v360.py
      - scripts/validate_sitemap_discovery_contract.py
      - tests/test_institutional_route_hubs_v1.py
      - safety/**
      - services/**
      - robots.txt
      - sitemap.xml
      - sitemap-index.xml
      - api/sitemap-completeness-v360.json
      - .github/workflows/repair-sitemap-discovery-contract-v1.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-sitemap-discovery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate discovery outputs in the runner
        run: python scripts/repair_sitemap_discovery_contract_v1.py
      - name: Verify institutional discovery and formatting
        run: |
          python -m unittest tests.test_institutional_route_hubs_v1 -v
          python scripts/validate_sitemap_discovery_contract.py
          git diff --check
      - name: Verify committed outputs are reproducible
        run: |
          git diff --exit-code -- \
            scripts/publish_complete_sitemap_v360.py \
            robots.txt \
            sitemap.xml \
            sitemap-index.xml \
            api/sitemap-completeness-v360.json
