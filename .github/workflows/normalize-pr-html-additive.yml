name: Normalize changed PR HTML safely

on:
  pull_request:
    branches: ["main"]
    paths:
      - "**/*.html"
      - "scripts/normalize_platform_shell.py"
      - ".github/workflows/normalize-pr-html-additive.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: normalize-pr-html-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  normalize:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out PR head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Select only HTML changed by this PR
        id: changed
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            git fetch --no-tags origin "$base"
            git diff --name-only --diff-filter=ACMR "$base" HEAD -- '*.html' > /tmp/changed-html.txt
          else
            git diff --name-only --diff-filter=ACMR HEAD^ HEAD -- '*.html' > /tmp/changed-html.txt || true
          fi
          sed -i '/^$/d' /tmp/changed-html.txt
          echo "count=$(wc -l < /tmp/changed-html.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"
          cat /tmp/changed-html.txt

      - name: Normalize changed documents in an isolated mirror
        if: steps.changed.outputs.count != '0'
        shell: bash
        run: |
          set -euo pipefail
          fixture="$(mktemp -d)"
          while IFS= read -r path; do
            test -f "$path" || continue
            mkdir -p "$fixture/$(dirname "$path")"
            cp "$path" "$fixture/$path"
          done < /tmp/changed-html.txt

          python scripts/normalize_platform_shell.py "$fixture" --no-report

          while IFS= read -r path; do
            test -f "$fixture/$path" || continue
            cp "$fixture/$path" "$path"
          done < /tmp/changed-html.txt

      - name: Prove editorial text was preserved
        if: steps.changed.outputs.count != '0'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, subprocess
          from pathlib import Path

          base = "${{ github.event.pull_request.base.sha }}" if "${{ github.event_name }}" == "pull_request" else "HEAD^"
          changed = [x.strip() for x in Path('/tmp/changed-html.txt').read_text().splitlines() if x.strip()]
          shell_patterns = [
              re.compile(r'<!--\s*pt-platform-shell:v1\s*-->', re.I),
              re.compile(r'<link\b[^>]*assets/platform/platform-core\.css[^>]*>', re.I),
              re.compile(r'<script\b[^>]*assets/platform/platform-core\.js[^>]*>\s*</script>', re.I),
              re.compile(r'<meta\b[^>]*(?:name=["\'](?:copyright|rights)["\'])[^>]*>', re.I),
              re.compile(r'<link\b[^>]*rel=["\']license["\'][^>]*>', re.I),
          ]
          body_shell_attrs = re.compile(r'\s+(?:class=["\'][^"\']*pt-platform[^"\']*["\']|data-pt-(?:normalized|enhancer|home)=["\'][^"\']*["\'])', re.I)

          def editorial(html: str) -> str:
              for pat in shell_patterns:
                  html = pat.sub('', html)
              html = body_shell_attrs.sub('', html)
              return re.sub(r'\s+', ' ', html).strip()

          failures = []
          for path in changed:
              p = Path(path)
              if not p.is_file():
                  continue
              current = p.read_text(encoding='utf-8')
              try:
                  before = subprocess.check_output(['git','show',f'HEAD:{path}'], text=True)
              except subprocess.CalledProcessError:
                  continue
              if editorial(before) != editorial(current):
                  failures.append(path)
          if failures:
              raise SystemExit('Editorial-content preservation failed: ' + ', '.join(failures))
          print({'editorial_content_preserved': len(changed)})
          PY

      - name: Verify shell idempotency
        if: steps.changed.outputs.count != '0'
        shell: bash
        run: |
          set -euo pipefail
          fixture="$(mktemp -d)"
          while IFS= read -r path; do
            test -f "$path" || continue
            mkdir -p "$fixture/$(dirname "$path")"
            cp "$path" "$fixture/$path"
          done < /tmp/changed-html.txt
          python scripts/normalize_platform_shell.py "$fixture" --check --no-report

      - name: Commit normalization only when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- '*.html'; then
            echo "Changed HTML is already normalized."
            exit 0
          fi
          git config user.name "rawafid-quality-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- '*.html'
          git commit -m "fix(platform): normalize changed HTML shell without editorial rewrites"
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
