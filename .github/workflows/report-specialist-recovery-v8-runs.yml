name: Report specialist recovery v8 runs

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/report-specialist-recovery-v8-runs.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

env:
  STATUS_TRIGGER: "2026-07-31T01:59:00+03:00"

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Read latest recovery workflow runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports /tmp/recovery-runs
          for workflow in \
            deploy-specialists-account-backend.yml \
            deploy-specialist-recovery-overlay-v8.yml \
            verify-specialist-recovery-v8.yml \
            deploy-specialist-recovery-pages-v8.yml; do
            curl -fsS \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?per_page=5" \
              -o "/tmp/recovery-runs/${workflow}.json"
          done
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          names=[
            'deploy-specialists-account-backend.yml',
            'deploy-specialist-recovery-overlay-v8.yml',
            'verify-specialist-recovery-v8.yml',
            'deploy-specialist-recovery-pages-v8.yml',
          ]
          result={}
          for name in names:
              data=json.loads((Path('/tmp/recovery-runs')/(name+'.json')).read_text(encoding='utf-8'))
              runs=data.get('workflow_runs') or []
              latest=runs[0] if runs else {}
              result[name]={
                'id':latest.get('id'),
                'name':latest.get('name'),
                'status':latest.get('status'),
                'conclusion':latest.get('conclusion'),
                'event':latest.get('event'),
                'head_branch':latest.get('head_branch'),
                'head_sha':latest.get('head_sha'),
                'created_at':latest.get('created_at'),
                'updated_at':latest.get('updated_at'),
                'html_url':latest.get('html_url'),
              }
          report={'schema_version':1,'checked_at':datetime.now(timezone.utc).isoformat(),'workflows':result}
          Path('reports/specialist-recovery-v8-runs.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - name: Commit safe run report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/specialist-recovery-v8-runs.json
          git commit -m "chore: record specialist recovery v8 workflow states"
          git pull --rebase origin main
          git push origin HEAD:main
