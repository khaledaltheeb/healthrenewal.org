name: Run legacy alias patch on pull request v333

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/run-legacy-alias-patch-on-pr-v333.yml"

permissions:
  contents: write

jobs:
  run-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Extract reviewed patch payload
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/patch-legacy-alias-release-gates-v333-temporary.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(source) if line == '        run: |') + 1
          payload = []
          for line in source[start:]:
              if line and not line.startswith('          '):
                  break
              payload.append(line[10:] if line.startswith('          ') else '')
          Path('/tmp/apply-legacy-alias-v333.sh').write_text('\n'.join(payload) + '\n', encoding='utf-8')
          PY
      - name: Execute patch with full trace
        run: bash -x /tmp/apply-legacy-alias-v333.sh 2>&1 | tee /tmp/legacy-alias-patch-v333.log
      - name: Upload patch diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-alias-patch-v333-diagnostic
          path: |
            /tmp/apply-legacy-alias-v333.sh
            /tmp/legacy-alias-patch-v333.log
          if-no-files-found: warn
          retention-days: 3
