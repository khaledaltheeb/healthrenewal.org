name: Run legacy alias patch on pull request v333

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/run-legacy-alias-patch-on-pr-v333.yml"

permissions:
  contents: write

jobs:
  run-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Extract and execute complete reviewed patch payload
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/patch-legacy-alias-release-gates-v333-temporary.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(source) if line.strip() == "python - <<'PY'")
          end = next(i for i, line in enumerate(source[start:], start) if line.strip() == 'git push origin HEAD:agent/legacy-alias-release-gates-v333')
          payload = [line[10:] if line.startswith('          ') else line for line in source[start:end + 1]]
          payload[0] = "python - <<'PATCHPY'"
          compile_index = next(i for i, line in enumerate(payload) if line.startswith('python -m py_compile scripts/audit_full_site_v16.py'))
          outer_close = max(i for i, line in enumerate(payload[:compile_index]) if line == 'PY')
          payload[outer_close] = 'PATCHPY'
          Path('/tmp/apply-legacy-alias-v333.sh').write_text('\n'.join(payload) + '\n', encoding='utf-8')
          PY
          bash -euxo pipefail /tmp/apply-legacy-alias-v333.sh
          git fetch origin agent/legacy-alias-release-gates-v333
          git reset --hard origin/agent/legacy-alias-release-gates-v333
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/run-legacy-alias-patch-on-pr-v333.yml
          git commit -m "chore: remove temporary pull-request patch runner"
          git push origin HEAD:agent/legacy-alias-release-gates-v333
