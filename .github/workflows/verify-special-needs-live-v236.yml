name: Verify special-needs live deployment v236

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/verify_special_needs_deployment_v236.py"
      - "tests/test_special_needs_deployment_v236.py"
      - ".github/workflows/verify-special-needs-live-v236.yml"
  workflow_run:
    workflows: ["Deploy validated main to GitHub Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: special-needs-live-v236-${{ github.event.workflow_run.id || github.ref }}
  cancel-in-progress: false

jobs:
  validate-contract:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile and test the deployment verifier
        env:
          PYTHONPATH: .
        run: |
          set -euxo pipefail
          python -m py_compile scripts/verify_special_needs_deployment_v236.py tests/test_special_needs_deployment_v236.py
          python -m unittest -v tests.test_special_needs_deployment_v236

  verify-live:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
      REQUIRED_GUIDES_SHA: ce993959f283de4d374c8777c8446c5c26077e7d
      BASE_URL: https://khaledaltheeb.github.io/pterminology-site/
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout the deployed source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prove the deployed commit contains the twenty-five-guide merge
        run: |
          set -euxo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request

          repository = os.environ['GITHUB_REPOSITORY']
          required = os.environ['REQUIRED_GUIDES_SHA']
          candidate = os.environ['EXPECTED_SHA']
          token = os.environ['GH_TOKEN']
          request = urllib.request.Request(
              f'https://api.github.com/repos/{repository}/compare/{required}...{candidate}',
              headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'special-needs-live-v236',
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              comparison = json.loads(response.read().decode('utf-8'))
          assert comparison.get('status') in {'ahead', 'identical'}, comparison
          print({
              'required_guides_sha': required,
              'deployed_candidate_sha': candidate,
              'comparison_status': comparison['status'],
              'status': 'guide-merge-is-ancestor',
          })
          PY

      - name: Download the live special-needs evidence
        run: |
          set -euxo pipefail
          root=/tmp/special-needs-live-v236
          rm -rf "${root}"
          mkdir -p "${root}/api" "${root}/special-needs"
          token="${EXPECTED_SHA}-$(date +%s)"
          curl --retry 5 --retry-delay 4 -H 'Cache-Control: no-cache' -fsSL "${BASE_URL}deployment.json?v=${token}" -o "${root}/deployment.json"
          curl --retry 5 --retry-delay 4 -H 'Cache-Control: no-cache' -fsSL "${BASE_URL}api/special-needs-guides-v221.json?v=${token}" -o "${root}/api/special-needs-guides-v221.json"
          curl --retry 5 --retry-delay 4 -H 'Cache-Control: no-cache' -fsSL "${BASE_URL}special-needs/?v=${token}" -o "${root}/special-needs/index.html"
          curl --retry 5 --retry-delay 4 -H 'Cache-Control: no-cache' -fsSL "${BASE_URL}sitemap-special-needs.xml?v=${token}" -o "${root}/sitemap-special-needs.xml"
          for slug in \
            assessment-homework-accommodations-plan \
            visual-schedules-transitions-home-school-plan \
            inclusive-play-peer-friendship-plan \
            siblings-family-balance-support-plan \
            accessible-family-emergency-preparedness-plan; do
            mkdir -p "${root}/special-needs/${slug}"
            curl --retry 5 --retry-delay 4 -H 'Cache-Control: no-cache' -fsSL \
              "${BASE_URL}special-needs/${slug}/?v=${token}" \
              -o "${root}/special-needs/${slug}/index.html"
          done

      - name: Verify SHA, twenty-five links, five batches, v214 pages and sitemap uniqueness
        run: |
          set -euxo pipefail
          PYTHONPATH=. python scripts/verify_special_needs_deployment_v236.py \
            /tmp/special-needs-live-v236 \
            --mode live \
            --expected-sha "${EXPECTED_SHA}"

      - name: Prove blocked review sources are not publicly deployed
        run: |
          set -euxo pipefail
          token="${EXPECTED_SHA}-blocked"
          for path in \
            content/v73/special-needs-executable-instructions-ar.json \
            data/disability-dignity-safety.json \
            data/urgent-help-governance.json; do
            if curl --retry 2 --retry-delay 2 -H 'Cache-Control: no-cache' -fsSL \
              "${BASE_URL}${path}?v=${token}" -o /tmp/unexpected-blocked-source; then
              echo "Blocked review source is publicly accessible: ${path}" >&2
              exit 1
            fi
          done

      - name: Upload live deployment evidence
        uses: actions/upload-artifact@v4
        with:
          name: special-needs-live-v236
          path: /tmp/special-needs-live-v236/api/special-needs-deployment-v236.json
          if-no-files-found: error
          retention-days: 30
