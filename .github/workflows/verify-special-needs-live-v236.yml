name: Verify special-needs live deployment v236

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/verify_special_needs_deployment_v236.py"
      - "tests/test_special_needs_deployment_v236.py"
      - "tests/test_pages_artifact_sha_v242.py"
      - ".github/workflows/deploy-validated-main.yml"
      - ".github/workflows/verify-special-needs-live-v236.yml"
      - ".github/workflows/validate-pages-artifact-sha-v242.yml"
  workflow_run:
    workflows: ["Deploy validated main to GitHub Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: special-needs-live-v236-${{ github.event.workflow_run.id || github.ref }}
  cancel-in-progress: false

jobs:
  validate-contract:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile and test deployment and provenance contracts
        env:
          PYTHONPATH: .
        run: |
          set -euxo pipefail
          python -m py_compile \
            scripts/verify_special_needs_deployment_v236.py \
            tests/test_special_needs_deployment_v236.py \
            tests/test_pages_artifact_sha_v242.py
          python -m unittest -v \
            tests.test_special_needs_deployment_v236 \
            tests.test_pages_artifact_sha_v242

  verify-live:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REQUIRED_GUIDES_SHA: ce993959f283de4d374c8777c8446c5c26077e7d
      BASE_URL: https://healthrenewal.org/
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TRIGGER_REPORTED_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout current verification source
        uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download the live special-needs evidence and export authoritative SHA
        id: live
        run: |
          set -euxo pipefail
          root=/tmp/special-needs-live-v236
          rm -rf "${root}"
          mkdir -p "${root}/api" "${root}/special-needs"
          token="${TRIGGER_REPORTED_SHA}-$(date +%s)"
          curl --retry 6 --retry-delay 4 -H 'Cache-Control: no-cache' -fsSL "${BASE_URL}deployment.json?v=${token}" -o "${root}/deployment.json"
          LIVE_SHA="$(python - <<'PY'
          import json,re
          from pathlib import Path
          data=json.loads(Path('/tmp/special-needs-live-v236/deployment.json').read_text(encoding='utf-8'))
          sha=data.get('commit')
          assert data.get('schema_version') in {29, 30}, data
          assert isinstance(sha,str) and re.fullmatch(r'[0-9a-f]{40}',sha), data
          print(sha)
          PY
          )"
          echo "LIVE_SHA=${LIVE_SHA}" >> "$GITHUB_ENV"
          echo "live_sha=${LIVE_SHA}" >> "$GITHUB_OUTPUT"
          token="${LIVE_SHA}-$(date +%s)"
          curl --retry 6 --retry-delay 4 -H 'Cache-Control: no-cache' -fsSL "${BASE_URL}api/special-needs-guides-v221.json?v=${token}" -o "${root}/api/special-needs-guides-v221.json"
          curl --retry 6 --retry-delay 4 -H 'Cache-Control: no-cache' -fsSL "${BASE_URL}special-needs/?v=${token}" -o "${root}/special-needs/index.html"
          curl --retry 6 --retry-delay 4 -H 'Cache-Control: no-cache' -fsSL "${BASE_URL}sitemap-special-needs.xml?v=${token}" -o "${root}/sitemap-special-needs.xml"
          for slug in \
            assessment-homework-accommodations-plan \
            visual-schedules-transitions-home-school-plan \
            inclusive-play-peer-friendship-plan \
            siblings-family-balance-support-plan \
            accessible-family-emergency-preparedness-plan; do
            mkdir -p "${root}/special-needs/${slug}"
            curl --retry 6 --retry-delay 4 -H 'Cache-Control: no-cache' -fsSL \
              "${BASE_URL}special-needs/${slug}/?v=${token}" \
              -o "${root}/special-needs/${slug}/index.html"
          done

      - name: Prove live SHA contains the guide merge and is a safe main ancestor
        run: |
          set -euxo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request

          repository = os.environ['GITHUB_REPOSITORY']
          required = os.environ['REQUIRED_GUIDES_SHA']
          live = os.environ['LIVE_SHA']
          token = os.environ['GH_TOKEN']
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'special-needs-live-v242',
          }

          def api(path):
              request = urllib.request.Request(f'https://api.github.com/repos/{repository}{path}', headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.loads(response.read().decode('utf-8'))

          def compare(base, head):
              if base == head:
                  return 'identical'
              return api(f'/compare/{base}...{head}').get('status')

          required_to_live = compare(required, live)
          assert required_to_live in {'ahead', 'identical'}, {
              'required_guides_sha': required,
              'live_sha': live,
              'comparison_status': required_to_live,
          }
          current = api('/git/ref/heads/main')['object']['sha']
          live_to_current = compare(live, current)
          assert live_to_current in {'ahead', 'identical'}, {
              'live_sha': live,
              'current_main_sha': current,
              'comparison_status': live_to_current,
          }
          print({
              'required_guides_sha': required,
              'live_sha': live,
              'current_main_sha': current,
              'required_to_live': required_to_live,
              'live_to_current': live_to_current,
              'trigger_reported_sha': os.environ.get('TRIGGER_REPORTED_SHA'),
              'status': 'live-sha-proven-safe-and-guide-complete',
          })
          PY

      - name: Verify SHA twenty-five links five batches v214 pages and sitemap uniqueness
        run: |
          set -euxo pipefail
          PYTHONPATH=. python scripts/verify_special_needs_deployment_v236.py \
            /tmp/special-needs-live-v236 \
            --mode live \
            --expected-sha "${LIVE_SHA}"

      - name: Prove blocked review sources are not publicly deployed
        run: |
          set -euxo pipefail
          token="${LIVE_SHA}-blocked"
          for path in \
            content/v73/special-needs-executable-instructions-ar.json \
            data/disability-dignity-safety.json \
            data/urgent-help-governance.json; do
            if curl --retry 2 --retry-delay 2 -H 'Cache-Control: no-cache' -fsSL \
              "${BASE_URL}${path}?v=${token}" -o /tmp/unexpected-blocked-source; then
              echo "Blocked review source is publicly accessible: ${path}" >&2
              exit 1
            fi
          done

      - name: Record proof provenance
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          path=Path('/tmp/special-needs-live-v236/api/special-needs-deployment-v236.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          data['trigger_reported_sha']=os.environ.get('TRIGGER_REPORTED_SHA')
          data['authoritative_live_sha']=os.environ['LIVE_SHA']
          data['sha_source']='live-deployment-json'
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Upload live deployment evidence
        uses: actions/upload-artifact@v4
        with:
          name: special-needs-live-v236
          path: /tmp/special-needs-live-v236/api/special-needs-deployment-v236.json
          if-no-files-found: error
          retention-days: 30
