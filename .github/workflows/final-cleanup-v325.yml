name: Final repository cleanup v325 once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/final-cleanup-v325.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Synchronize current main
        run: git pull --rebase origin main

      - name: Verify successful Pages receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          status=json.loads(Path('pages-deployment-status.json').read_text(encoding='utf-8'))
          expected={
              'schema_version':324,
              'status':'deployed',
              'deployment_outcome':'success',
              'live_routes_verified':6,
          }
          for key,value in expected.items():
              assert status.get(key)==value,(key,value,status.get(key),status)
          print(status)
          PY

      - name: Serialize validated production builds v31
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('.github/workflows/validate-all-labs-v22.yml')
          text=path.read_text(encoding='utf-8')
          marker='concurrency:\n  group: validate-all-labs-v31-main\n  cancel-in-progress: true\n'
          if marker not in text:
              anchor='env:\n  SITE_BASE: https://healthrenewal.org/\n\njobs:\n'
              assert anchor in text,'v31 insertion anchor missing'
              replacement='env:\n  SITE_BASE: https://healthrenewal.org/\n\n'+marker+'\njobs:\n'
              path.write_text(text.replace(anchor,replacement,1),encoding='utf-8')
          assert marker in path.read_text(encoding='utf-8')
          print({'v31_concurrency':'enabled'})
          PY

      - name: Remove temporary release machinery
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          paths=(
              '.github/workflows/patch-v31-concurrency-once.yml',
              '.github/workflows/patch-v31-concurrency-direct.yml',
              '.github/workflows/one-shot-validated-pages-v323.yml',
              '.github/workflows/dispatch-one-shot-v323-on-issue.yml',
              '.github/workflows/deploy-observable-pages-v324.yml',
              '.github/workflows/finalize-publication-cleanup-v324.yml',
              '.github/workflows/final-cleanup-v325.yml',
              'release-v323-issue-trigger.txt',
              'production-rebuild-trigger-v322.json',
              'production-rebuild-trigger-v322.md',
              'production-rebuild-trigger-v322.txt',
              'production-rebuild-trigger-v322.lock',
              'production-rebuild-trigger-v322.ready',
              'production-rebuild-trigger-v322.final',
              'production-rebuild-trigger-v322.complete',
              'production-rebuild-trigger-v322.go',
              'production-rebuild-trigger-v322.merge',
              'production-rebuild-trigger-v322.pr',
              'production-rebuild-trigger-v322.open',
          )
          removed=[]
          for relative in paths:
              path=Path(relative)
              if path.is_file():
                  path.unlink()
                  removed.append(relative)
          trigger=Path('deployment.json')
          if trigger.is_file():
              try:
                  payload=json.loads(trigger.read_text(encoding='utf-8'))
              except Exception:
                  payload={}
              if payload.get('status')=='publication-surface-ready':
                  trigger.unlink()
                  removed.append('deployment.json')
          print({'removed':removed})
          PY

      - name: Commit final cleanup
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git status --short
          git add -A
          test -n "$(git diff --cached --name-only)"
          git commit -m "ci: finalize repository cleanup v325 [skip ci]"
          git push origin HEAD:main
