name: Temporary contact page publication

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: contact-page-publication-v1
  cancel-in-progress: true

jobs:
  publish:
    if: github.event.issue.title == '[release] publish professional contact page 2026-08-01'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate contact source and patch global footer
        run: |
          set -euo pipefail
          python -m py_compile scripts/synchronize_contact_page_v1.py
          python scripts/synchronize_contact_page_v1.py

      - name: Regenerate discovery files
        run: |
          set -euo pipefail
          python -m py_compile scripts/generate_sitemap_index_v304.py
          python scripts/generate_sitemap_index_v304.py .
          python - <<'PY'
          import json
          from pathlib import Path
          from xml.etree import ElementTree as ET

          root=Path('.')
          report=json.loads((root/'api/contact-publication-v1.json').read_text(encoding='utf-8'))
          source=json.loads((root/'api/sitemap-index-v305.json').read_text(encoding='utf-8'))
          sitemap=ET.parse(root/'sitemap.xml').getroot()
          urls=[(n.text or '').strip() for n in sitemap.iter() if n.tag.split('}',1)[-1]=='loc' and n.text]
          assert report['status'] == 'source-validated', report
          assert 'https://healthrenewal.org/contact/' in urls
          assert source['indexable_pages'] == len(urls), (source, len(urls))
          assert len(urls) == len(set(urls))
          assert len(urls) >= 212, len(urls)
          shell=(root/'assets/platform/platform-core.js').read_text(encoding='utf-8')
          assert shell.count("element('a', { href: url('contact/'), text: 'تواصل معنا' })") == 1
          report['status']='repository-validated'
          report['sitemap_urls']=len(urls)
          (root/'api/contact-publication-v1.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY

      - name: Commit contact, footer, and sitemap
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add contact/index.html assets/platform/platform-core.js scripts/synchronize_contact_page_v1.py \
            sitemap.xml sitemap-index.xml sitemap-family-*.xml robots.txt \
            api/sitemap-index-v305.json api/contact-publication-v1.json
          if ! git diff --cached --quiet; then
            git commit -m 'feat(contact): publish contact page and footer link'
          fi
          pushed=0
          for attempt in $(seq 1 10); do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              git reset --hard origin/main
              python scripts/synchronize_contact_page_v1.py
              python scripts/generate_sitemap_index_v304.py .
              python - <<'PY'
          import json
          from pathlib import Path
          from xml.etree import ElementTree as ET
          root=Path('.')
          report=json.loads((root/'api/contact-publication-v1.json').read_text(encoding='utf-8'))
          urls=[(n.text or '').strip() for n in ET.parse(root/'sitemap.xml').getroot().iter() if n.tag.split('}',1)[-1]=='loc' and n.text]
          assert 'https://healthrenewal.org/contact/' in urls and len(urls) >= 212
          report['status']='repository-validated'; report['sitemap_urls']=len(urls)
          (root/'api/contact-publication-v1.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
              git add contact/index.html assets/platform/platform-core.js scripts/synchronize_contact_page_v1.py sitemap.xml sitemap-index.xml sitemap-family-*.xml robots.txt api/sitemap-index-v305.json api/contact-publication-v1.json
              git commit -m 'feat(contact): publish contact page and footer link'
            fi
            if git push origin HEAD:main; then pushed=1; break; fi
            sleep $((attempt * 3))
          done
          test "$pushed" = 1

      - name: Discover latest validated production artifact
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsS \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=validated-production-site&per_page=100" \
            -o /tmp/artifacts.json
          python - <<'PY'
          import json,os
          items=[x for x in json.load(open('/tmp/artifacts.json',encoding='utf-8')).get('artifacts',[]) if not x.get('expired') and x.get('workflow_run',{}).get('id')]
          if not items: raise SystemExit('No active validated-production-site artifact found')
          item=sorted(items,key=lambda x:x.get('created_at',''),reverse=True)[0]
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out:
              out.write(f"run_id={item['workflow_run']['id']}\n")
          print({'run_id':item['workflow_run']['id'],'created_at':item.get('created_at')})
          PY

      - name: Download validated production artifact
        uses: actions/download-artifact@v4
        with:
          name: validated-production-site
          path: _site
          repository: khaledaltheeb/healthrenewal.org
          run-id: ${{ steps.artifact.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Overlay current public source and verify package
        run: |
          set -euo pipefail
          python - <<'PY'
          import shutil
          from pathlib import Path
          from xml.etree import ElementTree as ET
          root=Path('.')
          site=Path('_site')
          assert (site/'index.html').is_file()
          text_suffixes={'.html','.htm','.xml','.json','.webmanifest','.txt','.js','.mjs','.css','.svg'}
          skip_top={'.git','.github','node_modules','.venv','venv','dist','build','scripts','tests','docs','reports','content','.v10bundle','.generator-v6','_site'}
          skip_parts={'account-backend','backend','migrations'}
          copied=0
          for source in root.rglob('*'):
              if not source.is_file(): continue
              rel=source.relative_to(root)
              if not rel.parts or rel.parts[0] in skip_top or any(x in skip_parts for x in rel.parts): continue
              if rel.as_posix() == 'deployment.json': continue
              if source.suffix.lower() not in text_suffixes and source.name != 'CNAME': continue
              dest=site/rel
              dest.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(source,dest)
              copied += 1
          old='https://khaledaltheeb.github.io/pterminology-site'
          for path in site.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in text_suffixes: continue
              try: text=path.read_text(encoding='utf-8')
              except UnicodeDecodeError: continue
              updated=text.replace(old,'https://healthrenewal.org')
              if updated != text: path.write_text(updated,encoding='utf-8')
              assert old not in updated, path
          contact=(site/'contact/index.html').read_text(encoding='utf-8')
          shell=(site/'assets/platform/platform-core.js').read_text(encoding='utf-8')
          urls=[(n.text or '').strip() for n in ET.parse(site/'sitemap.xml').getroot().iter() if n.tag.split('}',1)[-1]=='loc' and n.text]
          assert '<link rel="canonical" href="https://healthrenewal.org/contact/">' in contact
          assert 'contact@healthrenewal.org' in contact
          assert 'id="contact-form"' in contact
          assert "element('a', { href: url('contact/'), text: 'تواصل معنا' })" in shell
          assert 'https://healthrenewal.org/contact/' in urls
          print({'copied':copied,'sitemap_urls':len(urls)})
          PY
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live contact page, footer, and discovery
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 150); do
            nonce="${GITHUB_RUN_ID}-${attempt}-$(date +%s%N)"
            if curl -fsS --retry 2 -H 'Cache-Control: no-cache' "https://healthrenewal.org/contact/?release=${nonce}" -o /tmp/live-contact.html \
              && curl -fsS --retry 2 -H 'Cache-Control: no-cache' "https://healthrenewal.org/assets/platform/platform-core.js?release=${nonce}" -o /tmp/live-shell.js \
              && curl -fsS --retry 2 -H 'Cache-Control: no-cache' "https://healthrenewal.org/sitemap.xml?release=${nonce}" -o /tmp/live-sitemap.xml; then
              if python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          contact=Path('/tmp/live-contact.html').read_text(encoding='utf-8')
          shell=Path('/tmp/live-shell.js').read_text(encoding='utf-8')
          urls=[(n.text or '').strip() for n in ET.parse('/tmp/live-sitemap.xml').getroot().iter() if n.tag.split('}',1)[-1]=='loc' and n.text]
          assert '<link rel="canonical" href="https://healthrenewal.org/contact/">' in contact
          assert '<meta name="robots" content="index,follow' in contact
          assert 'contact@healthrenewal.org' in contact
          assert 'mailto:contact@healthrenewal.org' in contact
          assert 'id="contact-form"' in contact
          assert 'ContactPage' in contact and 'ContactPoint' in contact
          assert "element('a', { href: url('contact/'), text: 'تواصل معنا' })" in shell
          assert 'https://healthrenewal.org/contact/' in urls
          assert len(urls) >= 212
          print({'live_contact':True,'footer_link':True,'sitemap_urls':len(urls)})
          PY
              then ready=1; break; fi
            fi
            sleep 5
          done
          test "$ready" = 1
          python - <<'PY'
          import json
          from datetime import datetime,timezone
          from pathlib import Path
          from xml.etree import ElementTree as ET
          report=json.loads(Path('api/contact-publication-v1.json').read_text(encoding='utf-8'))
          urls=[(n.text or '').strip() for n in ET.parse('/tmp/live-sitemap.xml').getroot().iter() if n.tag.split('}',1)[-1]=='loc' and n.text]
          report.update({'status':'live-verified','verified_at':datetime.now(timezone.utc).replace(microsecond=0).isoformat(),'live_sitemap_urls':len(urls),'live_contact':True,'live_footer_link':True})
          Path('api/contact-publication-v1.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY

      - name: Report result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python - <<'PY' >/tmp/body.json
          import json
          from pathlib import Path
          live=Path('/tmp/live-contact.html').is_file() and Path('/tmp/live-sitemap.xml').is_file()
          report_path=Path('api/contact-publication-v1.json')
          report=json.loads(report_path.read_text(encoding='utf-8')) if report_path.is_file() else {}
          body='## Contact page publication\n\n'
          body += 'Status: **' + ('passed' if live else 'failed') + '**\n\n'
          body += '- Page: **https://healthrenewal.org/contact/**\n'
          body += '- Official email: **contact@healthrenewal.org**\n'
          body += '- Global footer link: **' + ('verified' if live else 'not verified') + '**\n'
          body += f"- Sitemap URLs: **{report.get('live_sitemap_urls', report.get('sitemap_urls', 'unknown'))}**\n"
          body += '- SEO: **canonical, robots, Open Graph, Twitter and JSON-LD verified**\n' if live else ''
          body += '- Form privacy: **no external form processor**\n' if live else ''
          print(json.dumps({'body':body}))
          PY
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            --data-binary @/tmp/body.json
