name: Report password reset hotfix run

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/report-password-reset-hotfix-run.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Read latest hotfix workflow run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          curl -fsS \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-password-reset-v9-hotfix.yml/runs?per_page=5" \
            -o /tmp/runs.json
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          data=json.loads(Path('/tmp/runs.json').read_text(encoding='utf-8'))
          runs=data.get('workflow_runs') or []
          latest=runs[0] if runs else {}
          report={
            'schema_version':1,
            'checked_at':datetime.now(timezone.utc).isoformat(),
            'run_id':latest.get('id'),
            'status':latest.get('status'),
            'conclusion':latest.get('conclusion'),
            'event':latest.get('event'),
            'head_sha':latest.get('head_sha'),
            'created_at':latest.get('created_at'),
            'updated_at':latest.get('updated_at'),
            'html_url':latest.get('html_url'),
            'run_attempt':latest.get('run_attempt'),
            'total_runs_returned':len(runs),
          }
          Path('reports/password-reset-v9-hotfix-run.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - name: Commit run report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/password-reset-v9-hotfix-run.json
          git commit -m "chore: record password reset hotfix run state"
          git pull --rebase origin main
          git push origin HEAD:main
