name: Report password reset deployment runs

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/report-password-reset-hotfix-run.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

env:
  REPORT_TRIGGER: "2026-07-31T01:12:00+03:00"

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Read latest deployment workflow runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          for workflow in deploy-password-reset-v9-hotfix.yml deploy-password-reset-worker-v10.yml diagnose-password-reset-v9.yml; do
            safe="${workflow//./-}"
            curl -fsS \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?per_page=5" \
              -o "/tmp/${safe}.json"
          done
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          workflows={
            'pages_hotfix':'/tmp/deploy-password-reset-v9-hotfix-yml.json',
            'worker_v10':'/tmp/deploy-password-reset-worker-v10-yml.json',
            'proven_deployer':'/tmp/diagnose-password-reset-v9-yml.json',
          }
          def compact(path):
              data=json.loads(Path(path).read_text(encoding='utf-8'))
              runs=data.get('workflow_runs') or []
              latest=runs[0] if runs else {}
              return {k:latest.get(k) for k in ('id','status','conclusion','event','head_sha','created_at','updated_at','html_url','run_attempt')}
          report={'schema_version':2,'checked_at':datetime.now(timezone.utc).isoformat(),'workflows':{name:compact(path) for name,path in workflows.items()}}
          Path('reports/password-reset-deployment-runs.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - name: Commit run report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/password-reset-deployment-runs.json
          git commit -m "chore: record password reset deployment run states"
          git pull --rebase origin main
          git push origin HEAD:main
