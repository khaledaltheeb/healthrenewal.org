name: Force verified E5 Pages production once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/force-e5-pages-production-once.yml'

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: force-e5-pages-production-v2
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate current complete E5 package
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, json
          from pathlib import Path

          root = Path('ai-search/data')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          coverage = json.loads((root / 'coverage.json').read_text(encoding='utf-8'))
          assert manifest['version'] == 2 and manifest['ready'] is True
          assert manifest['model'] == 'intfloat/multilingual-e5-small'
          assert manifest['dimensions'] == 384
          assert manifest['dtype'] == 'float16'
          assert manifest['normalized'] is True
          assert coverage['passed'] is True
          assert coverage['downloadSuccessRatio'] == 1.0
          assert coverage['indexCoverageRatio'] == 1.0
          assert coverage['failedDownloadCount'] == 0
          assert coverage['failedDataAssetCount'] == 0
          assert coverage['unindexedUrls'] == []
          assert coverage['discoveredUrlCount'] == manifest['documentCount'] == coverage['indexedUrlCount']
          assert coverage['chunkCount'] == manifest['chunkCount']
          assert manifest['shards']
          for shard in manifest['shards']:
              metadata = (root / shard['metadata']).read_bytes()
              vectors = (root / shard['embeddings']).read_bytes()
              package = (root / shard['embeddingsJson']).read_bytes()
              payload = json.loads(package)
              raw = base64.b64decode(payload['data'], validate=True)
              assert hashlib.sha256(metadata).hexdigest() == shard['metadataSha256']
              assert hashlib.sha256(vectors).hexdigest() == shard['embeddingSha256']
              assert hashlib.sha256(package).hexdigest() == shard['embeddingsJsonSha256']
              assert raw == vectors
              assert len(raw) == shard['count'] * manifest['dimensions'] * 2
          print({
              'generatedAt': manifest['generatedAt'],
              'documents': manifest['documentCount'],
              'chunks': manifest['chunkCount'],
              'dataAssets': coverage['dataAssetCount'],
              'shards': len(manifest['shards']),
          })
          PY

      - name: Discover latest validated production site
        id: artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsS \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=validated-production-site&per_page=100" \
            -o /tmp/artifacts.json
          python - <<'PY'
          import json, os
          artifacts = [
              item for item in json.load(open('/tmp/artifacts.json', encoding='utf-8')).get('artifacts', [])
              if not item.get('expired') and item.get('workflow_run', {}).get('id')
          ]
          if not artifacts:
              raise SystemExit('No active validated-production-site artifact found')
          selected = max(artifacts, key=lambda item: item.get('created_at', ''))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"run_id={selected['workflow_run']['id']}\n")
          print({'run_id': selected['workflow_run']['id'], 'created_at': selected.get('created_at')})
          PY

      - name: Download validated production site
        uses: actions/download-artifact@v4
        with:
          name: validated-production-site
          path: _site
          repository: khaledaltheeb/healthrenewal.org
          run-id: ${{ steps.artifact.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Overlay current homepage and E5 package
        run: |
          set -euo pipefail
          test -f _site/index.html
          rm -rf _site/ai-search
          cp -a ai-search _site/ai-search
          cp index.html _site/index.html
          mkdir -p _site/assets/platform
          cp assets/platform/platform-core.js _site/assets/platform/platform-core.js
          cp assets/platform/platform-core.css _site/assets/platform/platform-core.css
          cp robots.txt _site/robots.txt
          cp sitemap-index.xml _site/sitemap-index.xml
          find . -maxdepth 1 -type f -name 'sitemap-family-*.xml' -exec cp '{}' _site/ ';'
          touch _site/.nojekyll

          python - <<'PY'
          import json
          from pathlib import Path
          source = Path('ai-search/data/manifest.json').read_bytes()
          deployed = Path('_site/ai-search/data/manifest.json').read_bytes()
          assert source == deployed
          manifest = json.loads(deployed)
          coverage = json.loads(Path('_site/ai-search/data/coverage.json').read_text(encoding='utf-8'))
          assert manifest['ready'] is True
          assert coverage['passed'] is True
          assert manifest['documentCount'] == coverage['indexedUrlCount']
          home = Path('_site/index.html').read_text(encoding='utf-8')
          shell = Path('_site/assets/platform/platform-core.js').read_text(encoding='utf-8')
          assert 'assets/platform/platform-core.js' in home
          assert "action: url('ai-search/')" in shell
          assert 'multilingual-e5-small' in shell
          print({'generatedAt': manifest['generatedAt'], 'chunks': manifest['chunkCount']})
          PY

      - uses: actions/configure-pages@v5

      - name: Upload production Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy production Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live E5 package and homepage integration
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          source_generated="$(python -c "import json; print(json.load(open('ai-search/data/manifest.json'))['generatedAt'])")"
          ready=0
          for attempt in $(seq 1 150); do
            nonce="${RUN_ID}-${attempt}-$(date +%s%N)"
            if curl -fsS --retry 2 -H 'Cache-Control: no-cache' \
              "https://healthrenewal.org/ai-search/data/manifest.json?release=${nonce}" \
              -o /tmp/live-manifest.json && \
              curl -fsS --retry 2 -H 'Cache-Control: no-cache' \
              "https://healthrenewal.org/ai-search/data/coverage.json?release=${nonce}" \
              -o /tmp/live-coverage.json; then
              if SOURCE_GENERATED="$source_generated" python - <<'PY'
          import json, os
          manifest = json.load(open('/tmp/live-manifest.json', encoding='utf-8'))
          coverage = json.load(open('/tmp/live-coverage.json', encoding='utf-8'))
          assert manifest['generatedAt'] == os.environ['SOURCE_GENERATED']
          assert manifest['ready'] is True
          assert manifest['model'] == 'intfloat/multilingual-e5-small'
          assert manifest['dimensions'] == 384
          assert coverage['passed'] is True
          assert coverage['indexCoverageRatio'] == 1.0
          assert coverage['downloadSuccessRatio'] == 1.0
          assert coverage['indexedUrlCount'] == manifest['documentCount']
          assert coverage['chunkCount'] == manifest['chunkCount']
          PY
              then ready=1; break; fi
            fi
            sleep 4
          done
          test "$ready" = 1

          curl -fsS --retry 3 "https://healthrenewal.org/?e5_release=${RUN_ID}" -o /tmp/live-home.html
          curl -fsS --retry 3 "https://healthrenewal.org/assets/platform/platform-core.js?e5_release=${RUN_ID}" -o /tmp/live-shell.js
          grep -F 'assets/platform/platform-core.js' /tmp/live-home.html
          grep -F "action: url('ai-search/')" /tmp/live-shell.js
          grep -F 'multilingual-e5-small' /tmp/live-shell.js

      - name: Verify every live shard and write receipt
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, datetime, hashlib, json, os, subprocess
          from pathlib import Path

          manifest_bytes = Path('/tmp/live-manifest.json').read_bytes()
          manifest = json.loads(manifest_bytes)
          coverage = json.loads(Path('/tmp/live-coverage.json').read_text(encoding='utf-8'))
          root = 'https://healthrenewal.org/ai-search/data/'
          verified_shards = []
          for index, shard in enumerate(manifest['shards']):
              metadata_path = Path(f'/tmp/live-meta-{index}.json')
              vectors_path = Path(f'/tmp/live-vectors-{index}.json')
              subprocess.run(['curl', '-fsS', '--retry', '3', root + shard['metadata'] + '?v=' + shard['metadataSha256'][:20], '-o', str(metadata_path)], check=True)
              subprocess.run(['curl', '-fsS', '--retry', '3', root + shard['embeddingsJson'] + '?v=' + shard['embeddingsJsonSha256'][:20], '-o', str(vectors_path)], check=True)
              metadata = metadata_path.read_bytes()
              package = vectors_path.read_bytes()
              payload = json.loads(package)
              raw = base64.b64decode(payload['data'], validate=True)
              assert hashlib.sha256(metadata).hexdigest() == shard['metadataSha256']
              assert hashlib.sha256(package).hexdigest() == shard['embeddingsJsonSha256']
              assert hashlib.sha256(raw).hexdigest() == shard['embeddingSha256']
              verified_shards.append({
                  'metadata': shard['metadata'],
                  'metadataSha256': shard['metadataSha256'],
                  'embeddingsJson': shard['embeddingsJson'],
                  'embeddingsJsonSha256': shard['embeddingsJsonSha256'],
                  'embeddingSha256': shard['embeddingSha256'],
                  'count': shard['count'],
              })

          receipt = {
              'schemaVersion': 2,
              'passed': True,
              'verifiedAt': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'site': 'https://healthrenewal.org/',
              'workflowRunId': os.environ['RUN_ID'],
              'workflowRunUrl': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['RUN_ID']}",
              'sourceCommit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'generatedAt': manifest['generatedAt'],
              'model': manifest['model'],
              'modelRevision': manifest['modelRevision'],
              'browserModel': manifest['browserModel'],
              'browserModelRevision': manifest['browserModelRevision'],
              'dimensions': manifest['dimensions'],
              'dtype': manifest['dtype'],
              'normalized': manifest['normalized'],
              'documentCount': manifest['documentCount'],
              'chunkCount': manifest['chunkCount'],
              'dataAssetCount': coverage['dataAssetCount'],
              'downloadedDataAssetCount': coverage['downloadedDataAssetCount'],
              'downloadSuccessRatio': coverage['downloadSuccessRatio'],
              'indexCoverageRatio': coverage['indexCoverageRatio'],
              'manifestSha256': hashlib.sha256(manifest_bytes).hexdigest(),
              'homepageSearchConnected': True,
              'shards': verified_shards,
          }
          Path('reports').mkdir(exist_ok=True)
          Path('reports/e5-live-production.json').write_text(
              json.dumps(receipt, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(receipt, ensure_ascii=False, indent=2))
          PY

      - name: Commit verified live production receipt
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/e5-live-production.json
          git commit -m 'chore: record verified complete E5 production receipt [skip ci]'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt * 3))
          done
          exit 1
