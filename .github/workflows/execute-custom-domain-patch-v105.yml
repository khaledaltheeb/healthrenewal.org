name: Execute custom-domain identity patch v105

on:
  pull_request:
    branches: ["main"]
    paths:
      - "scripts/patch_custom_domain_identity_v105.py"
      - ".github/workflows/execute-custom-domain-patch-v105.yml"
      - ".github/workflows/patch-custom-domain-identity-v105.yml"

permissions:
  contents: write

concurrency:
  group: custom-domain-identity-patch-v105-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Patch and validate branch
        run: |
          set -euo pipefail
          python scripts/patch_custom_domain_identity_v105.py
          rm -rf tests/__pycache__

          # Validate the complete intended state, including the production
          # workflow contract, before excluding that workflow from this
          # token-limited code commit.
          node --check specialists-partners/account-backend/src/index-v10.js
          node --check specialists-partners/account-backend/src/index-v10-production.js
          node --check tests/specialist_sender_policy_v104_runtime.mjs
          node tests/specialist_sender_policy_v104_runtime.mjs
          python -m unittest -v tests.test_specialist_identity_v10 tests.test_specialist_turnstile_persistence
          rm -rf tests/__pycache__

          # GitHub Actions tokens cannot update workflow files. Keep the
          # production workflow unchanged in this commit; the repository
          # connector applies the already validated workflow change next.
          git checkout -- .github/workflows/deploy-specialist-identity-v10-production.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            specialists-partners/account-backend/src/index-v10.js \
            specialists-partners/account-backend/src/index-v10-production.js \
            tests/specialist_sender_policy_v104_runtime.mjs \
            tests/test_specialist_identity_v10.py \
            tests/test_specialist_turnstile_persistence.py
          git diff --cached --quiet && { echo "::error::Patch produced no code changes"; exit 1; }
          git commit -m "feat: prepare specialist identity for healthrenewal.org"
          git push origin HEAD:${{ github.head_ref }}
