name: Stage custom-domain production workflow v105

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/execute-custom-domain-patch-v105.yml"

permissions:
  contents: write

concurrency:
  group: custom-domain-workflow-stage-v105-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  stage:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Stage validated production workflow content
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/deploy-specialist-identity-v10-production.yml')
          text = source.read_text(encoding='utf-8')

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one match, found {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              'ALLOWED_ORIGINS = "https://khaledaltheeb.github.io"',
              'ALLOWED_ORIGINS = "https://khaledaltheeb.github.io,https://healthrenewal.org,https://www.healthrenewal.org"',
          )
          replace_once(
              'TURNSTILE_EXPECTED_HOSTNAMES = "khaledaltheeb.github.io"',
              'TURNSTILE_EXPECTED_HOSTNAMES = "khaledaltheeb.github.io,healthrenewal.org,www.healthrenewal.org"',
          )
          replace_once(
              "          provider=deep.get('emailProvider') or {}\n          report={",
              "          provider=deep.get('emailProvider') or {}\n          capabilities=deep.get('capabilities') or normal.get('capabilities') or {}\n          sender_ready=provider.get('senderReady') is True\n          recovery_email_ready=capabilities.get('passwordRecoveryEmail') is True\n          fully_operational=(\n              normal.get('ok') is True\n              and provider.get('authValid') is True\n              and sender_ready\n              and recovery_email_ready\n          )\n          report={",
          )
          replace_once(
              "            'email_provider':{'http_status':int(os.environ.get('DEEP_STATUS') or 0),'configured':provider.get('configured'),'auth_valid':provider.get('authValid'),'access':provider.get('access'),'code':provider.get('code')},",
              "            'email_provider':{'http_status':int(os.environ.get('DEEP_STATUS') or 0),'configured':provider.get('configured'),'auth_valid':provider.get('authValid'),'access':provider.get('access'),'code':provider.get('code'),'sender_ready':sender_ready,'sender_code':provider.get('senderCode'),'sender_domain':provider.get('senderDomain')},",
          )
          replace_once(
              "            'fully_operational':normal.get('ok') is True and provider.get('authValid') is True,",
              "            'password_recovery_email_ready':recovery_email_ready,\n            'operational_mode':'full' if fully_operational else 'manual_recovery',\n            'fully_operational':fully_operational,",
          )

          target = Path('reports/staged-deploy-specialist-identity-v10-production-v105.yml')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(text, encoding='utf-8')
          PY

          grep -F 'https://healthrenewal.org' reports/staged-deploy-specialist-identity-v10-production-v105.yml
          grep -F 'operational_mode' reports/staged-deploy-specialist-identity-v10-production-v105.yml
          grep -F 'sender_ready' reports/staged-deploy-specialist-identity-v10-production-v105.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/staged-deploy-specialist-identity-v10-production-v105.yml
          git commit -m "chore: stage custom-domain production workflow"
          git push origin HEAD:${{ github.head_ref }}
