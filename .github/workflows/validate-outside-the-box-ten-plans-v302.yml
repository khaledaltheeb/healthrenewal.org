name: Validate outside-the-box ten-plan expansion v302

on:
  pull_request:
    branches: ["main"]
    paths:
      - "content/v302/outside-the-box-ten-plan-framework-ar.json"
      - "scripts/publish_outside_the_box_ten_plans_v302.py"
      - "scripts/publish_outside_the_box_reference_assets_v303.py"
      - "scripts/check_ten_plan_idempotence_v302.py"
      - "assets/css/outside-the-box-ten-plans-v302.css"
      - "tests/test_outside_the_box_ten_plans_v302.py"
      - "tests/test_outside_the_box_reference_assets_v303.py"
      - ".github/workflows/validate-outside-the-box-ten-plans-v302.yml"
      - ".github/workflows/validate-all-labs-v22.yml"
  push:
    branches: ["main"]
    paths:
      - "content/v302/outside-the-box-ten-plan-framework-ar.json"
      - "scripts/publish_outside_the_box_ten_plans_v302.py"
      - "scripts/publish_outside_the_box_reference_assets_v303.py"
      - "scripts/check_ten_plan_idempotence_v302.py"
      - "assets/css/outside-the-box-ten-plans-v302.css"
      - "tests/test_outside_the_box_ten_plans_v302.py"
      - "tests/test_outside_the_box_reference_assets_v303.py"
      - ".github/workflows/validate-outside-the-box-ten-plans-v302.yml"
      - ".github/workflows/validate-all-labs-v22.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ten-plan-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Validate sources and compile publishers
        run: |
          set -euxo pipefail
          python -m json.tool content/v302/outside-the-box-ten-plan-framework-ar.json >/dev/null
          python -m json.tool content/v254/outside-the-box-instruments-ar.json >/dev/null
          python -m py_compile scripts/publish_outside_the_box_v254.py
          python -m py_compile scripts/publish_outside_the_box_ten_plans_v302.py
          python -m py_compile scripts/publish_outside_the_box_reference_assets_v303.py
          python -m py_compile scripts/check_ten_plan_idempotence_v302.py
          python -m py_compile tests/test_outside_the_box_ten_plans_v302.py
          python -m py_compile tests/test_outside_the_box_reference_assets_v303.py

      - name: Validate framework contract
        run: python -m unittest tests.test_outside_the_box_ten_plans_v302.TenPlanSourceContractV302.test_framework_declares_exact_complete_contract

      - name: Generate ten plans for every condition
        run: python -m unittest tests.test_outside_the_box_ten_plans_v302.TenPlanSourceContractV302.test_every_condition_can_generate_ten_evidence_linked_plans

      - name: Publish 1000 complete plan instances
        run: python -m unittest tests.test_outside_the_box_ten_plans_v302.TenPlanPublisherV302.test_publishes_one_thousand_complete_plan_instances

      - name: Validate hub methodology sitemap and API integration
        run: python -m unittest tests.test_outside_the_box_ten_plans_v302.TenPlanPublisherV302.test_hub_methodology_sitemap_and_base_api_are_integrated

      - name: Check hub idempotence
        run: python scripts/check_ten_plan_idempotence_v302.py hub

      - name: Check condition-page idempotence
        run: python scripts/check_ten_plan_idempotence_v302.py condition

      - name: Check methodology idempotence
        run: python scripts/check_ten_plan_idempotence_v302.py methodology

      - name: Check API idempotence
        run: python scripts/check_ten_plan_idempotence_v302.py api

      - name: Check sitemap idempotence
        run: python scripts/check_ten_plan_idempotence_v302.py sitemap

      - name: Validate idempotent publication
        run: python -m unittest tests.test_outside_the_box_ten_plans_v302.TenPlanPublisherV302.test_extension_is_idempotent

      - name: Validate responsible language and review status
        run: python -m unittest tests.test_outside_the_box_ten_plans_v302.TenPlanPublisherV302.test_language_is_responsible_and_review_state_is_honest

      - name: Validate evidence standard and instrument registry publication
        run: python -m unittest -v tests.test_outside_the_box_reference_assets_v303
