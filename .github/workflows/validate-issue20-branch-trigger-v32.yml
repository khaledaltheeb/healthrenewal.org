name: Validate Issue 20 branch from trigger issue v32

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: read

concurrency:
  group: validate-issue20-branch-v32
  cancel-in-progress: true

jobs:
  validate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.issue.title == '[validate-issue20-v32] laboratory branch acceptance'
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      ISSUE20_REF: agent/issue-20-labs-exhaustive-v32
    steps:
      - name: Checkout Issue 20 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.ISSUE20_REF }}
          fetch-depth: 0

      - name: Record exact tested branch head
        id: source
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          remote_sha="$(git ls-remote origin "refs/heads/${ISSUE20_REF}" | awk '{print $1}')"
          test -n "${remote_sha}"
          test "${sha}" = "${remote_sha}"
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"
          echo "Testing ${ISSUE20_REF} at ${sha}"

      - name: Fetch all current branches for the production recovery algorithm
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*' --prune

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Locate latest validated production baseline from main
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=validated-production-site&per_page=100" \
            -o /tmp/baselines.json
          python - <<'PY'
          import json, os
          payload=json.load(open('/tmp/baselines.json', encoding='utf-8'))
          candidates=[
              item for item in payload.get('artifacts', [])
              if not item.get('expired')
              and item.get('workflow_run', {}).get('head_branch') == 'main'
              and item.get('workflow_run', {}).get('id')
          ]
          if not candidates:
              raise SystemExit('No active validated-production-site artifact from main')
          item=max(candidates, key=lambda x: x.get('created_at',''))
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out:
              out.write(f"run_id={item['workflow_run']['id']}\n")
              out.write(f"artifact_id={item['id']}\n")
          print({'artifact':item['id'],'run':item['workflow_run']['id'],'created':item.get('created_at')})
          PY

      - name: Download validated production baseline
        uses: actions/download-artifact@v4
        with:
          name: validated-production-site
          path: /tmp/validated-baseline
          repository: khaledaltheeb/healthrenewal.org
          run-id: ${{ steps.baseline.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Compile every Issue 20 production component
        run: |
          set -euxo pipefail
          python -m py_compile \
            scripts/recover_content_v2.py \
            scripts/review_content_aliases_v1.py \
            scripts/finalize_content_quality_v1.py \
            scripts/publish_monitor_items_v32.py \
            scripts/harden_lab_runtime_v32.py \
            scripts/harden_monitor_runtime_v32.py \
            scripts/harden_cognitive_distinctness_v32.py \
            scripts/enrich_lab_content_v32.py \
            scripts/render_lab_specificity_v32.py \
            scripts/apply_scale_provenance_v32.py \
            tests/test_lab_issue20_v32.py \
            tests/test_monitor_items_v32.py
          node --check scripts/e2e_all_labs_v22.mjs
          node --check scripts/e2e_lab_acceptance_v32.mjs
          node --check scripts/e2e_monitor_items_v32.mjs

      - name: Run source-level unit and idempotence tests
        run: |
          set -euxo pipefail
          python -m unittest -v tests/test_lab_issue20_v32.py
          python -m unittest -v tests/test_monitor_items_v32.py

      - name: Run exact production recovery and finalization against Issue 20 branch
        run: |
          set -euxo pipefail
          test -f /tmp/validated-baseline/index.html
          rm -rf _site
          python scripts/recover_content_v2.py \
            --root . \
            --site _site \
            --baseline /tmp/validated-baseline \
            --days 10
          python scripts/review_content_aliases_v1.py \
            --site _site \
            --baseline /tmp/validated-baseline \
            --days 10
          python scripts/finalize_content_quality_v1.py --site _site
          python scripts/audit_all_labs_v22.py _site
          node --check _site/assets/js/lab-v12.js

      - name: Enforce exact production contract before browser tests
        env:
          TESTED_SHA: ${{ steps.source.outputs.sha }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path('_site/api')
          recovery=json.loads((root/'content-recovery-report.json').read_text(encoding='utf-8'))
          monitor=json.loads((root/'monitor-items-v32.json').read_text(encoding='utf-8'))
          depth=json.loads((root/'lab-depth-v32.json').read_text(encoding='utf-8'))
          runtime=json.loads((root/'lab-runtime-v32.json').read_text(encoding='utf-8'))
          monitor_runtime=json.loads((root/'monitor-runtime-v32.json').read_text(encoding='utf-8'))
          cognitive=json.loads((root/'cognitive-distinctness-v32.json').read_text(encoding='utf-8'))
          specificity=json.loads((root/'lab-specificity-v32.json').read_text(encoding='utf-8'))
          provenance=json.loads((root/'scale-provenance-v32.json').read_text(encoding='utf-8'))
          static=json.loads((root/'all-labs-v22.json').read_text(encoding='utf-8'))

          assert recovery.get('status') == 'passed', recovery.get('status')
          assert recovery.get('remainingThinPages') == 0 and recovery.get('completenessRatio') == 1.0
          assert recovery.get('integrityStatus') == 'passed' and recovery.get('integrityMissingInternalPaths') == 0
          assert recovery.get('monitorItemPublicationStatus') == 'passed'
          assert recovery.get('monitorItemProfiles') == 36
          assert recovery.get('monitorItemTotal') == 432 and recovery.get('monitorItemUnique') == 432
          assert recovery.get('monitorItemGenericTemplates') == 0
          assert recovery.get('laboratoryRuntimeStatus') == 'passed'
          assert recovery.get('monitorRuntimeStatus') == 'passed'
          assert recovery.get('cognitiveDistinctnessStatus') == 'passed'
          assert recovery.get('laboratoryDepthStatus') == 'passed'
          assert recovery.get('laboratoryAssessmentPages') == 40 and recovery.get('laboratoryCognitivePages') == 53
          assert recovery.get('laboratoryTotalTools') == 93 and recovery.get('laboratoryMinimumVisibleWords',0) >= 850
          assert recovery.get('laboratorySpecificityStatus') == 'passed'
          assert recovery.get('laboratoryMonitorSpecificityMinimumWords',0) >= 130
          assert recovery.get('laboratoryCognitiveSpecificityMinimumWords',0) >= 95
          assert recovery.get('laboratoryDuplicateSpecificBlocks') == 0
          assert recovery.get('scaleProvenanceStatus') == 'passed'
          assert recovery.get('scaleProvenanceProfiles') == ['audit_guided','gad7','phq9','who5']
          assert recovery.get('who5ArabicPolicy') == 'adapted_arabic_descriptive_only'
          assert recovery.get('arabicExactTextRequiredBeforeValidatedClaim') is True

          assert monitor['status']=='passed' and monitor['monitor_pages']==36 and monitor['profiles']==36
          assert monitor['total_items']==432 and monitor['unique_items']==432 and monitor['generic_template_items']==0
          assert monitor['written_failures']==[]
          assert depth['status']=='passed' and depth['assessment_pages']==40 and depth['cognitive_pages']==53 and depth['total_tools']==93
          assert depth['minimum_actual_words']>=850 and depth['pages_below_depth']==[] and depth['missing_task_profiles']==[]
          assert runtime['status']=='passed'
          assert monitor_runtime['status']=='passed'
          assert cognitive['status']=='passed' and cognitive['missing_pages']==[]
          assert specificity['status']=='passed' and specificity['monitor_pages']==36 and specificity['cognitive_pages']==53
          assert specificity['minimum_monitor_specific_words']>=130 and specificity['minimum_cognitive_specific_words']>=95
          assert specificity['monitor_failures']==[] and specificity['cognitive_failures']==[] and specificity['duplicate_specific_blocks']==0
          assert provenance['status']=='passed' and provenance['found']==['audit_guided','gad7','phq9','who5']
          assert provenance['who5_policy']=='adapted_arabic_descriptive_only'
          assert provenance['arabic_exact_text_required_before_validated_claim'] is True
          assert static['assessment_count']==40 and static['cognitive_count']==53 and static['error_count']==0

          who5=Path('_site/assessment-lab/who-5-plus/index.html').read_text(encoding='utf-8')
          phq9=Path('_site/assessment-lab/phq-9-plus/index.html').read_text(encoding='utf-8')
          simple=Path('_site/cognitive-lab/simple-reaction/index.html').read_text(encoding='utf-8')
          assert '<!-- scale-provenance-v32:start -->' in who5 and '<!-- scale-provenance-v32:start -->' in phq9
          assert 'متابعة العافية بخمسة بنود — عرض عربي متكيف مستلهم من WHO-5' in who5
          assert '<!-- lab-specificity-v32:start -->' in simple
          print({'tested_sha':os.environ['TESTED_SHA'],'production_contract':'passed','tools':93,'monitor_items':'432/432 unique','specificity':'36+53','provenance':'4/4'})
          PY

      - name: Install Chromium for exhaustive browser acceptance
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Run 186 complete-stage and 186 Issue 20 acceptance runs
        run: |
          set -euxo pipefail
          python -m http.server 8000 --directory _site >/tmp/issue20-trigger-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/ >/dev/null && break; sleep 1; done
          AUDIT_BASE_URL=http://127.0.0.1:8000/ AUDIT_SITE_ROOT=_site AUDIT_OUT_DIR=_site/api node scripts/e2e_all_labs_v22.mjs
          AUDIT_BASE_URL=http://127.0.0.1:8000/ AUDIT_SITE_ROOT=_site AUDIT_OUT_DIR=_site/api node scripts/e2e_lab_acceptance_v32.mjs
          AUDIT_BASE_URL=http://127.0.0.1:8000/ AUDIT_SITE_ROOT=_site AUDIT_OUT_DIR=_site/api node scripts/e2e_monitor_items_v32.mjs

      - name: Enforce browser evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('_site/api')
          all_labs=json.loads((root/'all-labs-e2e-v22.json').read_text(encoding='utf-8'))
          acceptance=json.loads((root/'lab-acceptance-v32.json').read_text(encoding='utf-8'))
          monitor=json.loads((root/'monitor-items-e2e-v32.json').read_text(encoding='utf-8'))
          assert all_labs['expectedRuns']==186 and all_labs['passedRuns']==186 and all_labs['failedRuns']==0 and all_labs['errorCount']==0, all_labs
          assert acceptance['status']=='passed' and acceptance['expectedRuns']==186 and acceptance['passedRuns']==186 and acceptance['failedRuns']==0 and acceptance['errorCount']==0, acceptance
          assert acceptance['assessmentDefinitions']==40 and acceptance['cognitiveDefinitions']==53, acceptance
          assert monitor['status']=='passed' and monitor['failedRuns']==0 and monitor['errorCount']==0, monitor
          print({'complete_stage':'186/186','acceptance':'186/186','monitor_browser':monitor})
          PY

      - name: Upload full Issue 20 validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue20-triggered-branch-validation-v32
          path: |
            _site/api/content-recovery-report.json
            _site/api/monitor-items-v32.json
            _site/api/lab-runtime-v32.json
            _site/api/monitor-runtime-v32.json
            _site/api/cognitive-distinctness-v32.json
            _site/api/lab-depth-v32.json
            _site/api/lab-specificity-v32.json
            _site/api/scale-provenance-v32.json
            _site/api/all-labs-v22.json
            _site/api/all-labs-e2e-v22.json
            _site/api/lab-acceptance-v32.json
            _site/api/monitor-items-e2e-v32.json
            _site/assessment-lab/who-5-plus/index.html
            _site/assessment-lab/phq-9-plus/index.html
            _site/cognitive-lab/simple-reaction/index.html
            /tmp/issue20-trigger-http.log
          if-no-files-found: warn
          retention-days: 30