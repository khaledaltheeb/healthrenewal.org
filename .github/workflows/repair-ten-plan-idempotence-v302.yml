name: Repair ten-plan idempotence v302

on:
  push:
    branches: ["agent/outside-the-box-ten-plans-v302"]
    paths:
      - ".github/workflows/repair-ten-plan-idempotence-v302.yml"
      - "scripts/publish_outside_the_box_ten_plans_v302.py"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/outside-the-box-ten-plans-v302

      - name: Replace every remaining base description deterministically
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/publish_outside_the_box_ten_plans_v302.py")
          text = path.read_text(encoding="utf-8")
          old = '''    text = text.replace(
                  "مسار مؤسسي لمقدم الخدمة حول",
                  "مسار مؤسسي موسع يتضمن عشر خطط لمقدم الخدمة حول",
                  1,
              )'''
          new = '''    text = text.replace(
                  "مسار مؤسسي لمقدم الخدمة حول",
                  "مسار مؤسسي موسع يتضمن عشر خطط لمقدم الخدمة حول",
              )'''
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")
              print("Applied deterministic replacement fix")
          elif new in text:
              print("Fix already present")
          else:
              raise SystemExit("Expected description replacement block was not found")
          PY

      - name: Commit repair when needed
        run: |
          if git diff --quiet; then
            echo "No repair commit needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/publish_outside_the_box_ten_plans_v302.py
          git commit -m "fix: make ten-plan condition publication idempotent"
          git push origin HEAD:agent/outside-the-box-ten-plans-v302
