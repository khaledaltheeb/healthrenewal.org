name: Verify institutional special-needs hub live v241

on:
  pull_request:
    branches: ["main"]
    paths:
      - "scripts/publish_special_needs_hub_v235.py"
      - "scripts/publish_special_needs_hub_v235_compat.py"
      - "scripts/publish_special_needs_guides_v217.py"
      - "scripts/verify_special_needs_hub_live_v241.py"
      - "tests/test_special_needs_hub_v235.py"
      - ".github/workflows/verify-special-needs-hub-live-v241.yml"
  workflow_run:
    workflows: ["Deploy validated main to GitHub Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: special-needs-hub-live-v241-${{ github.event.workflow_run.id || github.ref }}
  cancel-in-progress: false

jobs:
  validate-contract:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile and test hub publication and live-verification contracts
        run: |
          set -euxo pipefail
          python -m py_compile \
            scripts/publish_special_needs_hub_v235.py \
            scripts/publish_special_needs_hub_v235_compat.py \
            scripts/publish_special_needs_guides_v217.py \
            scripts/verify_special_needs_hub_live_v241.py \
            tests/test_special_needs_hub_v235.py
          python -m unittest -v tests.test_special_needs_hub_v235

  verify-live:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_URL: https://healthrenewal.org/
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TRIGGER_REPORTED_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout current verification source
        uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download exact live hub evidence and export authoritative SHA
        id: live
        run: |
          set -euxo pipefail
          root=/tmp/special-needs-hub-live-v241
          rm -rf "${root}"
          mkdir -p "${root}/api" "${root}/special-needs"
          token="${TRIGGER_REPORTED_SHA}-$(date +%s)"
          curl --retry 6 --retry-delay 4 -H 'Cache-Control: no-cache' -fsSL "${BASE_URL}deployment.json?v=${token}" -o "${root}/deployment.json"
          LIVE_SHA="$(python - <<'PY'
          import json,re
          from pathlib import Path
          data=json.loads(Path('/tmp/special-needs-hub-live-v241/deployment.json').read_text(encoding='utf-8'))
          sha=data.get('commit')
          assert data.get('schema_version') in {29, 30}, data
          assert isinstance(sha,str) and re.fullmatch(r'[0-9a-f]{40}',sha), data
          print(sha)
          PY
          )"
          echo "LIVE_SHA=${LIVE_SHA}" >> "$GITHUB_ENV"
          echo "live_sha=${LIVE_SHA}" >> "$GITHUB_OUTPUT"
          token="${LIVE_SHA}-$(date +%s)"
          curl --retry 6 --retry-delay 4 -H 'Cache-Control: no-cache' -fsSL "${BASE_URL}api/special-needs-guides-v221.json?v=${token}" -o "${root}/api/special-needs-guides-v221.json"
          curl --retry 6 --retry-delay 4 -H 'Cache-Control: no-cache' -fsSL "${BASE_URL}special-needs/?v=${token}" -o "${root}/special-needs/index.html"
          curl --retry 6 --retry-delay 4 -H 'Cache-Control: no-cache' -fsSL "${BASE_URL}sitemap-special-needs.xml?v=${token}" -o "${root}/sitemap-special-needs.xml"
          curl --retry 6 --retry-delay 4 -H 'Cache-Control: no-cache' -fsSL "${BASE_URL}robots.txt?v=${token}" -o "${root}/robots.txt"

      - name: Prove live hub deployment is a safe main ancestor
        run: |
          set -euxo pipefail
          python - <<'PY'
          import json,os,urllib.request
          repository=os.environ['GITHUB_REPOSITORY']
          live=os.environ['LIVE_SHA']
          token=os.environ['GH_TOKEN']
          headers={
              'Authorization':f'Bearer {token}',
              'Accept':'application/vnd.github+json',
              'X-GitHub-Api-Version':'2022-11-28',
              'User-Agent':'special-needs-hub-live-v241',
          }
          def api(path):
              request=urllib.request.Request(f'https://api.github.com/repos/{repository}{path}',headers=headers)
              with urllib.request.urlopen(request,timeout=30) as response:
                  return json.loads(response.read().decode('utf-8'))
          current=api('/git/ref/heads/main')['object']['sha']
          status='identical' if live==current else api(f'/compare/{live}...{current}').get('status')
          assert status in {'ahead','identical'}, {'live_sha':live,'current_main_sha':current,'status':status}
          print({
              'live_sha':live,
              'current_main_sha':current,
              'live_to_current':status,
              'trigger_reported_sha':os.environ.get('TRIGGER_REPORTED_SHA'),
              'status':'live-hub-sha-is-safe-main-ancestor',
          })
          PY

      - name: Verify deployment metadata schema pathways sources links sitemap robots and safety
        run: |
          set -euxo pipefail
          python scripts/verify_special_needs_hub_live_v241.py \
            /tmp/special-needs-hub-live-v241 \
            --expected-sha "${LIVE_SHA}"

      - name: Record live hub proof provenance
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          path=Path('/tmp/special-needs-hub-live-v241/api/special-needs-hub-live-v241.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          data['trigger_reported_sha']=os.environ.get('TRIGGER_REPORTED_SHA')
          data['authoritative_live_sha']=os.environ['LIVE_SHA']
          data['sha_source']='live-deployment-json'
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Upload immutable live hub evidence
        uses: actions/upload-artifact@v4
        with:
          name: special-needs-hub-live-v241
          path: /tmp/special-needs-hub-live-v241/api/special-needs-hub-live-v241.json
          if-no-files-found: error
          retention-days: 30
