name: Materialize family guide phase two v336

on:
  push:
    branches: ["agent/family-guide-phase2-v336"]
    paths:
      - ".github/workflows/materialize-family-guide-phase2-v336.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/family-guide-phase2-v336
          fetch-depth: 0
      - name: Decode reviewed guide bundle
        run: |
          set -euxo pipefail
          mkdir -p family-guide/conditions
          cat > /tmp/family-phase2.b64 <<'B64'

B64
          base64 -d /tmp/family-phase2.b64 > /tmp/family-phase2.tar.gz
          tar -xzf /tmp/family-phase2.tar.gz -C family-guide/conditions
          for slug in epilepsy spina-bifida muscular-dystrophy fragile-x-syndrome acquired-brain-injury; do
            test -s "family-guide/conditions/$slug/data.js"
            test -s "family-guide/conditions/$slug/index.html"
          done
      - name: Commit materialized guides
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add family-guide/conditions/epilepsy family-guide/conditions/spina-bifida family-guide/conditions/muscular-dystrophy family-guide/conditions/fragile-x-syndrome family-guide/conditions/acquired-brain-injury
          git commit -m "content: materialize five phase-two family guides"
          git push origin HEAD:agent/family-guide-phase2-v336
