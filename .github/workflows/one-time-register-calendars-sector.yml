name: One-time register calendars sector

on:
  push:
    branches:
      - agent/women-daily-calendar-v1
    paths:
      - ".github/workflows/one-time-register-calendars-sector.yml"
      - "api/student-daily-calendar-v1.json"

permissions:
  contents: write

jobs:
  register-sector:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/women-daily-calendar-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Add calendars to sectors directory
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("sectors/index.html")
          text = path.read_text(encoding="utf-8")

          replacements = {
              "قطاعات الصحة النفسية للطفل والشباب والأسرة والعائلة والمرأة | دليل منهجي": "قطاعات الصحة النفسية والتقويمات للطفل والشباب والأسرة والعائلة والمرأة | دليل منهجي",
              "قطاعات الصحة النفسية للطفل والشباب والأسرة والعائلة والمرأة": "قطاعات الصحة النفسية والتقويمات للطفل والشباب والأسرة والعائلة والمرأة",
              '"numberOfItems":5': '"numberOfItems":6',
              '<a href="#choose-sector">القطاعات الخمسة</a>': '<a href="#choose-sector">القطاعات والتقويمات</a>',
              'خمسة مداخل مترابطة': 'ستة مداخل مترابطة',
              'تجمع هذه البوابة خمسة قطاعات متخصصة': 'تجمع هذه البوابة ستة قطاعات ومسارات متخصصة',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)

          json_old = '        {"@type":"ListItem","position":5,"name":"الصحة النفسية للمرأة","url":"https://healthrenewal.org/sectors/women/"}'
          json_new = json_old + ',\n        {"@type":"ListItem","position":6,"name":"قطاع التقويمات التفاعلية","url":"https://healthrenewal.org/sectors/calendars/"}'
          if '"position":6,"name":"قطاع التقويمات التفاعلية"' not in text:
              if json_old not in text:
                  raise SystemExit("Could not find sector JSON list insertion point")
              text = text.replace(json_old, json_new, 1)

          card_anchor = '''          <a class="card-link" href="women/">فتح قطاع المرأة ←</a>
        </article>
      </div>'''
          calendar_card = '''          <a class="card-link" href="women/">فتح قطاع المرأة ←</a>
        </article>

        <article class="card" data-calendars-sector-v1>
          <span class="tag">خطط يومية وتذكيرات وأدوات تفاعلية</span>
          <h3>قطاع التقويمات التفاعلية</h3>
          <p>مسار مؤسسي يحوّل المعرفة إلى خطط يومية وأسبوعية قابلة للتنفيذ، مع تذكيرات الهاتف وحفظ محلي وخصوصية واضحة. يبدأ بتقويم المرأة وتقويم الطلاب، ويتوسع إلى الرياضيين والأسرة والتعافي والنوم ومقدمي الرعاية.</p>
          <ul>
            <li>تقويم المرأة: متابعة يومية ورسائل ووقفة ظهر وتذكيرات.</li>
            <li>تقويم الطلاب: مهام واختبارات وتركيز ومراجعة متباعدة.</li>
            <li>بنية قابلة لإضافة تقويم الرياضيين والفئات الأخرى.</li>
          </ul>
          <div class="questions">
            <strong>ابدأ بهذه الأسئلة</strong>
            ما الفئة التي تحتاج خطة؟ ما المواعيد التي يجب تذكرها؟ وما البيانات التي ينبغي أن تبقى محلية على الجهاز؟
          </div>
          <a class="card-link" href="calendars/">فتح قطاع التقويمات ←</a>
        </article>
      </div>'''
          if 'data-calendars-sector-v1' not in text:
              if card_anchor not in text:
                  raise SystemExit("Could not find women sector card insertion point")
              text = text.replace(card_anchor, calendar_card, 1)

          path.write_text(text, encoding="utf-8")
          PY
      - name: Validate integration contracts
        run: |
          python - <<'PY'
          import runpy
          namespace = runpy.run_path("tests/test_student_daily_calendar.py")
          for name, test in sorted(namespace.items()):
              if name.startswith("test_") and callable(test):
                  test()
                  print(f"PASS {name}")
          text = open("sectors/index.html", encoding="utf-8").read()
          assert 'data-calendars-sector-v1' in text
          assert 'href="calendars/"' in text
          assert '"numberOfItems":6' in text
          PY
      - name: Commit sectors directory link
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "healthrenewal-actions"
          git config user.email "actions@users.noreply.github.com"
          git add sectors/index.html
          git commit -m "feat(calendars): register sector in directory"
          git push origin HEAD:agent/women-daily-calendar-v1
