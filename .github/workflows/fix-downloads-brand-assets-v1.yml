name: Fix downloads brand assets

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-downloads-brand-assets-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-downloads-brand-assets-v1
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Normalize brand asset references
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("downloads/index.html")
          html = path.read_text(encoding="utf-8")
          old = '''  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="/assets/brand/logo-mark.svg">
  <link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">'''
          new = '''  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="/assets/brand/logo-mark.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/assets/brand/rawafid-brand.css">
  <script defer src="/assets/brand/rawafid-brand.js"></script>'''
          if old not in html:
              raise SystemExit("Expected downloads brand block was not found")
          html = html.replace(old, new, 1)
          path.write_text(html, encoding="utf-8")
          PY

      - name: Validate metadata and assets contract
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          html = Path("downloads/index.html").read_text(encoding="utf-8")
          assert '/assets/brand/apple-touch-icon.png' not in html
          for token in (
              '/favicon.ico',
              '/assets/brand/logo-mark.svg',
              '/favicon-32x32.png',
              '/favicon-16x16.png',
              '/apple-touch-icon.png',
              '/manifest.webmanifest',
              '/assets/brand/rawafid-brand.css',
              '/assets/brand/rawafid-brand.js',
          ):
              assert token in html, token
          assert html.count('name="description"') == 1
          assert html.count('rel="canonical"') == 1
          assert html.count('<h1') == 1
          assert 'https://healthrenewal.org/downloads/' in html
          scripts = re.findall(r'<script[^>]*type="application/ld\+json"[^>]*>(.*?)</script>', html, re.S | re.I)
          assert scripts
          for script in scripts:
              json.loads(script)
          PY
          git diff --check

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/index.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(brand): normalize downloads identity assets"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1
