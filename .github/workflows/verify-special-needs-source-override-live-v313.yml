name: Verify special-needs ASHA source override live v313

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/verify-special-needs-source-override-live-v313.yml"
  workflow_run:
    workflows: ["Deploy validated main to GitHub Pages"]
    types: [completed]
  schedule:
    - cron: "37 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: special-needs-source-override-live-v313-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  static-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate v313 live-verification contract
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/verify-special-needs-source-override-live-v313.yml')
          text = path.read_text(encoding='utf-8')
          required = (
              'Deploy validated main to GitHub Pages',
              'MINIMUM_SHA: c3b20e228bc541009887ead3f61603f64d7df27b',
              'special-needs/autism/',
              'special-needs/down-syndrome/',
              'special-needs-condition-hubs-v302.json',
              'special-needs-condition-source-maintenance-v310.json',
              'special-needs-guides-v221.json',
              'https://apps.asha.org/EvidenceMaps/Maps/LandingPage/990772a6-9cd8-4203-a76c-6ccd91eac874',
              'Augmentative and Alternative Communication (AAC) Evidence Map',
              'https://www.asha.org/Practice-Portal/Professional-Issues/Augmentative-and-Alternative-Communication/',
              'https://www.asha.org/practice-portal/professional-issues/augmentative-and-alternative-communication/',
              'https://www.asha.org/NJC/AAC/',
              'source_url_override_count',
              'source_url_override_source',
              'sitemap-special-needs.xml',
          )
          missing = [marker for marker in required if marker not in text]
          assert not missing, missing
          print({'workflow': path.name, 'required_markers': len(required), 'status': 'static-contract-passed'})
          PY

  live-publication:
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: https://healthrenewal.org/
      MINIMUM_SHA: c3b20e228bc541009887ead3f61603f64d7df27b
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Wait for a non-rollback deployment containing v312
        run: |
          set -euo pipefail
          matched=0
          for i in $(seq 1 90); do
            token="${MINIMUM_SHA}-${i}-$(date +%s)"
            if curl --retry 2 --retry-delay 2 -H 'Cache-Control: no-cache' -fsSL "${BASE_URL}deployment.json?v=${token}" -o /tmp/deployment.json; then
              if python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path

          deployment = json.loads(Path('/tmp/deployment.json').read_text(encoding='utf-8'))
          live = deployment.get('commit')
          minimum = os.environ['MINIMUM_SHA']
          assert isinstance(live, str) and len(live) == 40, deployment
          if live == minimum:
              raise SystemExit(0)

          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/compare/{minimum}...{live}",
              headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'special-needs-source-override-live-v313',
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  status = json.loads(response.read().decode('utf-8')).get('status')
          except urllib.error.HTTPError:
              raise SystemExit(1)
          raise SystemExit(0 if status in {'ahead', 'identical'} else 1)
          PY
              then
                matched=1
                break
              fi
            fi
            sleep 10
          done
          test "${matched}" -eq 1

      - name: Download live condition pages and contracts
        run: |
          set -euxo pipefail
          token="${MINIMUM_SHA}-live-$(date +%s)"
          curl --retry 6 --retry-delay 4 -H 'Cache-Control: no-cache' -fsSL "${BASE_URL}special-needs/autism/?v=${token}" -o /tmp/autism.html
          curl --retry 6 --retry-delay 4 -H 'Cache-Control: no-cache' -fsSL "${BASE_URL}special-needs/down-syndrome/?v=${token}" -o /tmp/down.html
          curl --retry 6 --retry-delay 4 -H 'Cache-Control: no-cache' -fsSL "${BASE_URL}api/special-needs-condition-hubs-v302.json?v=${token}" -o /tmp/hubs.json
          curl --retry 6 --retry-delay 4 -H 'Cache-Control: no-cache' -fsSL "${BASE_URL}api/special-needs-condition-source-maintenance-v310.json?v=${token}" -o /tmp/sources.json
          curl --retry 6 --retry-delay 4 -H 'Cache-Control: no-cache' -fsSL "${BASE_URL}api/special-needs-guides-v221.json?v=${token}" -o /tmp/central.json
          curl --retry 6 --retry-delay 4 -H 'Cache-Control: no-cache' -fsSL "${BASE_URL}sitemap-special-needs.xml?v=${token}" -o /tmp/sitemap.xml

      - name: Enforce live ASHA override and condition contracts
        run: |
          set -euxo pipefail
          python - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          base = 'https://healthrenewal.org/'
          corrected = 'https://apps.asha.org/EvidenceMaps/Maps/LandingPage/990772a6-9cd8-4203-a76c-6ccd91eac874'
          corrected_title = 'Augmentative and Alternative Communication (AAC) Evidence Map'
          obsolete = (
              'https://www.asha.org/Practice-Portal/Professional-Issues/Augmentative-and-Alternative-Communication/',
              'https://www.asha.org/practice-portal/professional-issues/augmentative-and-alternative-communication/',
              'https://www.asha.org/NJC/AAC/',
          )

          deployment = json.loads(Path('/tmp/deployment.json').read_text(encoding='utf-8'))
          hubs = json.loads(Path('/tmp/hubs.json').read_text(encoding='utf-8'))
          sources = json.loads(Path('/tmp/sources.json').read_text(encoding='utf-8'))
          central = json.loads(Path('/tmp/central.json').read_text(encoding='utf-8'))
          autism = Path('/tmp/autism.html').read_text(encoding='utf-8')
          down = Path('/tmp/down.html').read_text(encoding='utf-8')

          assert hubs['version'] == 302 and hubs['status'] == 'passed', hubs
          assert hubs['condition_slugs'] == ['autism', 'down-syndrome']
          assert hubs['source_count'] == 17
          assert hubs['source_url_override_count'] == 1
          assert hubs['source_url_override_source'] == 'content/v312/special-needs-condition-source-url-overrides.json'

          assert sources['version'] == 310 and sources['status'] == 'passed', sources
          assert sources['source_count'] == 17
          assert sources['maintenance_overdue'] is False
          assert sources['condition_slugs'] == ['autism', 'down-syndrome']

          assert central['status'] == 'passed'
          assert central['condition_source_maintenance_contract'] == 310
          assert central['condition_hubs']['source_count'] == 17

          assert autism.count(corrected) == 1
          assert autism.count(corrected_title) == 1
          assert 'id="A9"' in autism
          for failed in obsolete:
              assert failed not in autism, failed
          assert corrected not in down
          assert corrected_title not in down

          for name, text in (('autism', autism), ('down-syndrome', down)):
              assert text.count('<h1') == 1, name
              assert '"@type": "FAQPage"' in text or '"@type":"FAQPage"' in text, name
              assert 'id="provider-listing-policy"' in text, name
              assert '2027-01-27' in text, name

          sitemap_urls = {
              (node.text or '').strip()
              for node in ET.parse('/tmp/sitemap.xml').getroot().findall('{*}url/{*}loc')
              if node.text
          }
          assert base + 'special-needs/autism/' in sitemap_urls
          assert base + 'special-needs/down-syndrome/' in sitemap_urls
          assert len(sitemap_urls) == len(set(sitemap_urls))

          print({
              'live_commit': deployment.get('commit'),
              'conditions': 2,
              'sources': hubs['source_count'],
              'source_overrides': hubs['source_url_override_count'],
              'corrected_source': 'A9',
              'obsolete_paths_present': 0,
              'status': 'special-needs-source-override-live-v313-verified',
          })
          PY
