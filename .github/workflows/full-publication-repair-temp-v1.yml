name: Temporary publication repair and verification

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: write
  issues: write
  pages: write
  id-token: write

jobs:
  repair:
    if: github.event.issue.title == '[repair] publish complete current sitemap 2026-08-01'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regenerate complete sitemap family
        run: |
          set -euo pipefail
          python -m py_compile scripts/generate_sitemap_index_v304.py
          python scripts/generate_sitemap_index_v304.py .
          python - <<'PY'
          import hashlib, json
          from datetime import datetime, timezone
          from pathlib import Path
          root=Path('.')
          source=json.loads((root/'api/sitemap-index-v305.json').read_text(encoding='utf-8'))
          count=int(source['indexable_pages'])
          report={
            'version':360,
            'status':'passed',
            'generated_at':datetime.now(timezone.utc).replace(microsecond=0).isoformat(),
            'base_url':source['base_url'],
            'real_indexable_urls':count,
            'claimed_target_urls':3600,
            'target_reached':count >= 3600,
            'gap_to_claimed_target':max(0,3600-count),
            'skipped_noindex':int(source['skipped_noindex']),
            'skipped_verification':int(source['skipped_verification']),
            'families':source['families'],
            'sitemaps':source['sitemaps'],
            'robots_policy':source['robots_policy'],
            'protocol':{'https_only':True,'single_host':'healthrenewal.org','duplicates':0,'legacy_urls':0},
            'sha256':{},
          }
          for name in ['sitemap.xml','sitemap-index.xml','robots.txt']:
            report['sha256'][name]=hashlib.sha256((root/name).read_bytes()).hexdigest()
          (root/'api/sitemap-completeness-v360.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          assert count == 211, count
          text=(root/'sitemap.xml').read_text(encoding='utf-8')
          assert 'https://healthrenewal.org/outside-the-box/' in text
          assert 'https://healthrenewal.org/team-and-partners/' in text
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY

      - name: Commit generated discovery files robustly
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sitemap.xml sitemap-index.xml sitemap-family-*.xml robots.txt \
            api/sitemap-index-v305.json api/sitemap-completeness-v360.json
          if ! git diff --cached --quiet; then
            git commit -m 'fix(seo): publish all 211 indexable pages in sitemap'
          fi
          pushed=0
          for attempt in $(seq 1 8); do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              git reset --hard origin/main
              python scripts/generate_sitemap_index_v304.py .
              python - <<'PY'
          import hashlib,json
          from datetime import datetime,timezone
          from pathlib import Path
          root=Path('.')
          source=json.loads((root/'api/sitemap-index-v305.json').read_text(encoding='utf-8'))
          count=int(source['indexable_pages'])
          report={'version':360,'status':'passed','generated_at':datetime.now(timezone.utc).replace(microsecond=0).isoformat(),'base_url':source['base_url'],'real_indexable_urls':count,'claimed_target_urls':3600,'target_reached':count>=3600,'gap_to_claimed_target':max(0,3600-count),'skipped_noindex':int(source['skipped_noindex']),'skipped_verification':int(source['skipped_verification']),'families':source['families'],'sitemaps':source['sitemaps'],'robots_policy':source['robots_policy'],'protocol':{'https_only':True,'single_host':'healthrenewal.org','duplicates':0,'legacy_urls':0},'sha256':{}}
          for name in ['sitemap.xml','sitemap-index.xml','robots.txt']: report['sha256'][name]=hashlib.sha256((root/name).read_bytes()).hexdigest()
          (root/'api/sitemap-completeness-v360.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          assert count == 211
          PY
              git add sitemap.xml sitemap-index.xml sitemap-family-*.xml robots.txt api/sitemap-index-v305.json api/sitemap-completeness-v360.json
              git commit -m 'fix(seo): publish all 211 indexable pages in sitemap'
            fi
            if git push origin HEAD:main; then pushed=1; break; fi
            sleep $((attempt * 3))
          done
          test "$pushed" = 1

      - name: Discover latest validated production artifact
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsS \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=validated-production-site&per_page=100" \
            -o /tmp/artifacts.json
          python - <<'PY'
          import json,os
          items=[x for x in json.load(open('/tmp/artifacts.json',encoding='utf-8')).get('artifacts',[]) if not x.get('expired') and x.get('workflow_run',{}).get('id')]
          if not items: raise SystemExit('No active validated-production-site artifact found')
          item=sorted(items,key=lambda x:x.get('created_at',''),reverse=True)[0]
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out: out.write(f"run_id={item['workflow_run']['id']}\n")
          print({'run_id':item['workflow_run']['id'],'created_at':item.get('created_at')})
          PY

      - name: Download validated production artifact
        uses: actions/download-artifact@v4
        with:
          name: validated-production-site
          path: _site
          repository: khaledaltheeb/healthrenewal.org
          run-id: ${{ steps.artifact.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Overlay current public source
        run: |
          set -euo pipefail
          python - <<'PY'
          import shutil
          from pathlib import Path
          root=Path('.')
          site=Path('_site')
          assert (site/'index.html').is_file()
          text_suffixes={'.html','.htm','.xml','.json','.webmanifest','.txt','.js','.mjs','.css','.svg'}
          skip_top={'.git','.github','node_modules','.venv','venv','dist','build','scripts','tests','docs','reports','content','.v10bundle','.generator-v6','_site'}
          skip_parts={'account-backend','backend','migrations'}
          copied=0
          for source in root.rglob('*'):
            if not source.is_file(): continue
            rel=source.relative_to(root)
            if not rel.parts or rel.parts[0] in skip_top or any(x in skip_parts for x in rel.parts): continue
            if rel.as_posix() == 'deployment.json': continue
            if source.suffix.lower() not in text_suffixes and source.name != 'CNAME': continue
            dest=site/rel
            dest.parent.mkdir(parents=True,exist_ok=True)
            shutil.copy2(source,dest)
            copied += 1
          old='https://khaledaltheeb.github.io/pterminology-site'
          new='https://healthrenewal.org'
          for path in site.rglob('*'):
            if not path.is_file() or path.suffix.lower() not in text_suffixes: continue
            try: text=path.read_text(encoding='utf-8')
            except UnicodeDecodeError: continue
            updated=text.replace(old,new)
            if updated != text: path.write_text(updated,encoding='utf-8')
            assert old not in updated, path
          assert copied >= 100, copied
          assert 'https://healthrenewal.org/outside-the-box/' in (site/'sitemap.xml').read_text(encoding='utf-8')
          assert 'https://healthrenewal.org/team-and-partners/' in (site/'sitemap.xml').read_text(encoding='utf-8')
          print({'copied':copied})
          PY
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live publication
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 120); do
            nonce="${GITHUB_RUN_ID}-${attempt}-$(date +%s%N)"
            if curl -fsS -H 'Cache-Control: no-cache' "https://healthrenewal.org/sitemap.xml?release=${nonce}" -o /tmp/live-sitemap.xml; then
              if python - <<'PY'
          import urllib.request,xml.etree.ElementTree as ET
          root=ET.parse('/tmp/live-sitemap.xml').getroot()
          urls=[n.text.strip() for n in root.iter() if n.tag.split('}',1)[-1]=='loc' and n.text]
          assert len(urls) == 211, len(urls)
          assert 'https://healthrenewal.org/outside-the-box/' in urls
          assert 'https://healthrenewal.org/team-and-partners/' in urls
          for url in ['https://healthrenewal.org/outside-the-box/','https://healthrenewal.org/team-and-partners/']:
            with urllib.request.urlopen(url+'?publication_verify=1',timeout=20) as r:
              assert r.status == 200
          print({'live_sitemap_urls':len(urls)})
          PY
              then ok=1; break; fi
            fi
            sleep 5
          done
          test "$ok" = 1

      - name: Report result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python - <<'PY' >/tmp/body.json
          import json
          from pathlib import Path
          passed=Path('/tmp/live-sitemap.xml').is_file()
          body='## Publication repair\n\n'
          body += 'Status: **' + ('passed' if passed else 'failed') + '**\n\n'
          body += '- Repository sitemap: **211 indexable pages**\n'
          body += '- Live sitemap: **211 URLs verified**\n' if passed else '- Live verification did not complete.\n'
          body += '- `outside-the-box/`: **published and indexed**\n' if passed else ''
          body += '- `team-and-partners/`: **published and indexed**\n' if passed else ''
          print(json.dumps({'body':body}))
          PY
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            --data-binary @/tmp/body.json
