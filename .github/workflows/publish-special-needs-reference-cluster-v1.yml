name: Publish special-needs reference cluster v1

on:
  push:
    branches: [main]
    paths:
      - 'scripts/publish_special_needs_reference_cluster_v1.py'
      - 'assets/css/special-needs-reference-v1.css'
      - 'docs/SPECIAL_NEEDS_REFERENCE_CLUSTER_V1_AR.md'
      - 'tests/test_special_needs_reference_cluster_v1.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: special-needs-reference-cluster-v1
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate publisher
        run: |
          set -euo pipefail
          python -m py_compile scripts/publish_special_needs_reference_cluster_v1.py
          python -m unittest -v tests.test_special_needs_reference_cluster_v1
      - name: Generate reviewed reference pages in repository
        run: |
          set -euo pipefail
          python scripts/publish_special_needs_reference_cluster_v1.py .
          test -f special-needs/reference/index.html
          test -f special-needs/reference/autism-adhd-differential/index.html
          test -f special-needs/reference/aac-complete-guide/index.html
          test -f api/special-needs-reference-cluster-v1.json
      - name: Commit generated publication
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add special-needs/reference api/special-needs-reference-cluster-v1.json
          if git diff --cached --quiet; then
            echo 'Reference publication already current.'
            exit 0
          fi
          git commit -m 'content: publish special-needs reference cluster v1'
          git push origin HEAD:main
