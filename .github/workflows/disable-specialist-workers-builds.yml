name: Disable redundant specialist Workers Builds

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/disable-specialist-workers-builds.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: disable-specialist-workers-builds
  cancel-in-progress: false

env:
  WORKER_NAME: pterminology-specialist-accounts

jobs:
  disable-builds:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '826ac34927c1e045c06145a327c2ac52' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Remove only this Worker's Git build triggers
        id: disable
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          account = os.environ.get('CLOUDFLARE_ACCOUNT_ID', '').strip()
          token = os.environ.get('CLOUDFLARE_API_TOKEN', '').strip()
          worker_name = os.environ['WORKER_NAME']
          base = f'https://api.cloudflare.com/client/v4/accounts/{account}'
          headers = {
              'Authorization': f'Bearer {token}',
              'Content-Type': 'application/json',
              'User-Agent': 'pterminology-disable-redundant-builds/1.0',
          }

          def api(path: str, method: str = 'GET') -> tuple[int, dict]:
              request = urllib.request.Request(base + path, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      status = response.status
                      raw = response.read()
              except urllib.error.HTTPError as error:
                  status = error.code
                  raw = error.read()
              except Exception as error:
                  return 0, {'success': False, 'errors': [{'message': type(error).__name__}]}
              try:
                  payload = json.loads(raw.decode('utf-8'))
              except Exception:
                  payload = {'success': False, 'errors': [{'message': 'invalid_json'}]}
              return status, payload if isinstance(payload, dict) else {'success': False}

          report = {
              'schema_version': 1,
              'checked_at': datetime.now(timezone.utc).isoformat(),
              'worker_name': worker_name,
              'status': 'blocked',
              'failure_stage': None,
              'worker_tag_found': False,
              'trigger_count_before': None,
              'trigger_count_after': None,
              'deleted_trigger_count': 0,
              'repository_connection_deleted': False,
              'production_worker_modified': False,
              'contains_secret_values': False,
          }

          if not account or not token:
              report['failure_stage'] = 'github_secret_preflight'
          else:
              status, scripts = api('/workers/scripts')
              rows = scripts.get('result') or []
              worker = next((row for row in rows if row.get('id') == worker_name), None)
              tag = str((worker or {}).get('tag') or '')
              report['worker_tag_found'] = bool(tag)
              if status != 200 or scripts.get('success') is not True or not tag:
                  report['failure_stage'] = 'worker_tag_lookup'
                  report['api_http_status'] = status
              else:
                  status, trigger_payload = api(f'/builds/workers/{tag}/triggers')
                  triggers = trigger_payload.get('result') or []
                  report['trigger_count_before'] = len(triggers) if isinstance(triggers, list) else None
                  if status != 200 or trigger_payload.get('success') is not True or not isinstance(triggers, list):
                      report['failure_stage'] = 'workers_builds_api_access'
                      report['api_http_status'] = status
                      errors = trigger_payload.get('errors') or []
                      report['api_error_codes'] = [item.get('code') for item in errors if isinstance(item, dict)]
                  else:
                      failures = []
                      for trigger in triggers:
                          trigger_uuid = str(trigger.get('trigger_uuid') or '')
                          if not trigger_uuid:
                              failures.append('missing_trigger_uuid')
                              continue
                          delete_status, deleted = api(f'/builds/triggers/{trigger_uuid}', method='DELETE')
                          if delete_status not in {200, 204} or deleted.get('success') is not True:
                              failures.append(trigger_uuid)
                          else:
                              report['deleted_trigger_count'] += 1

                      verify_status, verified = api(f'/builds/workers/{tag}/triggers')
                      remaining = verified.get('result') or []
                      report['trigger_count_after'] = len(remaining) if isinstance(remaining, list) else None
                      if failures:
                          report['failure_stage'] = 'trigger_delete'
                          report['failed_delete_count'] = len(failures)
                      elif verify_status != 200 or verified.get('success') is not True:
                          report['failure_stage'] = 'trigger_verify'
                      elif remaining:
                          report['failure_stage'] = 'triggers_still_present'
                      else:
                          report['status'] = 'passed'
                          report['failure_stage'] = None

          Path('/tmp/disable-specialist-workers-builds.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(report, ensure_ascii=False, indent=2))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"status={report['status']}\n")
          PY

      - name: Record safe result and retire workflow after success
        env:
          DISABLE_STATUS: ${{ steps.disable.outputs.status }}
        run: |
          set -euo pipefail
          mkdir -p reports
          cp /tmp/disable-specialist-workers-builds.json reports/specialist-workers-builds-disabled.json
          if [[ "${DISABLE_STATUS}" == "passed" ]]; then
            rm .github/workflows/disable-specialist-workers-builds.yml
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/specialist-workers-builds-disabled.json .github/workflows/disable-specialist-workers-builds.yml
          git commit -m "chore: record specialist Workers Builds state [skip ci]" || exit 0
          for attempt in {1..5}; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            sleep $((attempt * 3))
          done
          echo "::error::Could not publish Workers Builds report"
          exit 1
