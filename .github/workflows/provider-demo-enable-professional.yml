name: Archived provider demo professional registry patch

# Historical one-shot migration retained for auditability.
# The original workflow modified main and deleted itself during a push run.
# It is intentionally manual and read-only now; production changes must pass
# the normal PR, build, and deployment gates.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: archived-provider-demo-professional-registry
  cancel-in-progress: true

jobs:
  archived-record:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Explain archived migration
        run: |
          cat <<'EOF'
          This workflow is retained as a historical record only.
          The provider demo professional-registry migration must not mutate the
          repository from CI. Reapply any future change through a reviewed pull
          request and the repository's standard validation and deployment gates.
          EOF
