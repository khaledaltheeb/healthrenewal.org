name: Validate institutional SEO content depth and section discovery v216

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/upgrade_institutional_seo_v215.py'
      - 'scripts/publish_section_discovery_v216.py'
      - 'scripts/publish_global_metadata_v27.py'
      - 'scripts/publish_global_metadata_v27_core.py'
      - 'tests/test_institutional_seo_v215.py'
      - 'tests/test_section_discovery_v216.py'
      - '.github/workflows/validate-institutional-seo-v215.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile metadata SEO and section discovery publishers
        run: |
          python -m py_compile scripts/publish_global_metadata_v27.py scripts/publish_global_metadata_v27_core.py scripts/upgrade_institutional_seo_v215.py scripts/publish_section_discovery_v216.py tests/test_institutional_seo_v215.py tests/test_section_discovery_v216.py
      - name: Test keywords social metadata headings images links reports and generated section discovery
        run: python -m unittest -v tests/test_institutional_seo_v215.py tests/test_section_discovery_v216.py
      - name: Verify wrapper preserves the v27 API and invokes discovery before SEO
        run: |
          python - <<'PY'
          import inspect
          import scripts.publish_global_metadata_v27 as wrapper
          for name in ('MetadataState','parse_metadata','enrich_page','verify_contract','main'):
              if not hasattr(wrapper, name):
                  raise SystemExit({'missing_export': name})
          source=inspect.getsource(wrapper.main)
          if source.index('_publish_section_discovery') > source.index('_publish_institutional_seo'):
              raise SystemExit('Section discovery must run before institutional SEO')
          wrapper.verify_contract()
          print({'v27_exports':'preserved','v216_discovery_hook':'before-seo','v215_hook':'compiled'})
          PY
