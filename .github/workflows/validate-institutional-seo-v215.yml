name: Validate institutional SEO and content depth v215

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/upgrade_institutional_seo_v215.py'
      - 'scripts/publish_global_metadata_v27.py'
      - 'scripts/publish_global_metadata_v27_core.py'
      - 'tests/test_institutional_seo_v215.py'
      - '.github/workflows/validate-institutional-seo-v215.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile metadata and SEO publishers
        run: |
          python -m py_compile scripts/publish_global_metadata_v27.py scripts/publish_global_metadata_v27_core.py scripts/upgrade_institutional_seo_v215.py tests/test_institutional_seo_v215.py
      - name: Test keywords social metadata headings images links and reports
        run: python -m unittest -v tests/test_institutional_seo_v215.py
      - name: Verify wrapper preserves the v27 API and invokes v215
        run: |
          python - <<'PY'
          import scripts.publish_global_metadata_v27 as wrapper
          for name in ('MetadataState','parse_metadata','enrich_page','verify_contract','main'):
              if not hasattr(wrapper, name):
                  raise SystemExit({'missing_export': name})
          wrapper.verify_contract()
          print({'v27_exports':'preserved','v215_hook':'compiled'})
          PY
