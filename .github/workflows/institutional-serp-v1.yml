name: Institutional SERP v1

on:
  push:
    branches:
      - seo/institutional-serp-v1
    paths:
      - .github/workflows/institutional-serp-v1.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: institutional-serp-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Align canonical and generated hubs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply_institutional_serp_v1.py')
          text = path.read_text(encoding='utf-8')

          # The academic library and care-guides hub are deployment-generated surfaces.
          # Use the source-backed 560-page research/evidence hub for the primary
          # scientific-evidence sitelink, while preserving /library/ as a secondary route.
          text = text.replace('"path": "/library/",', '"path": "/sections/research-evidence-learning/",')
          text = text.replace('"title": "المكتبة الأكاديمية العربية والأدلة العلمية | منصة روافد",', '"title": "البحث والدليل والتعلم: تقييم الدراسات والأدلة | منصة روافد",')
          text = text.replace('"description": "المكتبة الأكاديمية في روافد لتنظيم الدراسات والمراجع والأدلة العلمية وقراءة قوة الدليل وحدوده وربط النتائج بالتطبيق في الصحة النفسية والدمج والرعاية.",', '"description": "موسوعة عربية منهجية لقراءة الدراسات وتقييم قوة الدليل وحدوده، تشمل تصميم البحث والتحيز والقياس والإحصاء والمراجعات المنهجية والتطبيق المبني على الدليل.",')

          # care-guides/index.html is materialized by the publication pipeline. It is a
          # valid production route but intentionally absent from this source snapshot.
          text = text.replace(
              '"path": "/care-guides/",\n        "title":',
              '"path": "/care-guides/",\n        "source_optional": True,\n        "title":',
              1,
          )
          text = text.replace(
              '    if not file_path.is_file():\n        raise RuntimeError(f"Priority hub missing: {file_path.relative_to(ROOT)}")\n',
              '    if not file_path.is_file():\n        if item.get("source_optional"):\n            return False\n        raise RuntimeError(f"Priority hub missing: {file_path.relative_to(ROOT)}")\n',
              1,
          )
          text = text.replace(
              '        if not file_path.is_file():\n            errors.append(f"missing hub: {file_path.relative_to(ROOT)}")\n            continue\n',
              '        if not file_path.is_file():\n            if item.get("source_optional"):\n                continue\n            errors.append(f"missing hub: {file_path.relative_to(ROOT)}")\n            continue\n',
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Compile migration
        run: python -m py_compile scripts/apply_institutional_serp_v1.py

      - name: Apply institutional SERP migration
        run: python scripts/apply_institutional_serp_v1.py

      - name: Validate no destructive changes
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --name-status | grep -E '^D[[:space:]]'; then
            echo 'Refusing to continue: deleted files detected.' >&2
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          import json, re
          root = Path('.')
          report = json.loads((root/'reports/institutional-serp-v1.json').read_text(encoding='utf-8'))
          assert report['status'] == 'passed'
          assert not report['deleted_files']
          assert report['index_html_count_before'] == report['index_html_count_after']
          home = (root/'index.html').read_text(encoding='utf-8')
          assert 'data-institutional-sitelinks-v1' in home
          assert '<meta name="robots" content="index,follow,max-snippet:-1,max-image-preview:large,max-video-preview:-1">' in home
          assert 'noindex' not in re.sub(r'\s+', ' ', home[:8000]).lower()
          assert '/sections/research-evidence-learning/' in home
          assert '/care-guides/' in home
          assert '/library/' in home, 'secondary academic library route must remain discoverable'
          print('Institutional SERP guard passed.')
          PY

      - name: Commit validated migration
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'rawafid-seo-bot'
          git config user.email '63592172+khaledaltheeb@users.noreply.github.com'
          git add index.html manifest.webmanifest opensearch.xml feed.xml sitemap.xml \
            sectors/mental-health/index.html special-needs/index.html sectors/pediatric-oncology/index.html \
            sections/research-evidence-learning/index.html specialists-partners/index.html \
            scripts/apply_rawafid_brand.py scripts/rawafid_brand_consistency.py \
            scripts/apply_institutional_serp_v1.py reports/institutional-serp-v1.json
          git commit -m 'SEO: institutional search appearance and sitelink signals'
          git push origin HEAD:${{ github.ref_name }}
