name: Institutional SERP v1

on:
  push:
    branches:
      - seo/institutional-serp-v1
    paths:
      - .github/workflows/institutional-serp-v1.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: institutional-serp-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile migration
        run: python -m py_compile scripts/apply_institutional_serp_v1.py

      - name: Apply institutional SERP migration
        run: python scripts/apply_institutional_serp_v1.py

      - name: Validate no destructive changes
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --name-status | grep -E '^D[[:space:]]'; then
            echo 'Refusing to continue: deleted files detected.' >&2
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          import json, re
          root = Path('.')
          report = json.loads((root/'reports/institutional-serp-v1.json').read_text(encoding='utf-8'))
          assert report['status'] == 'passed'
          assert not report['deleted_files']
          assert report['index_html_count_before'] == report['index_html_count_after']
          home = (root/'index.html').read_text(encoding='utf-8')
          assert 'data-institutional-sitelinks-v1' in home
          assert '<meta name="robots" content="index,follow,max-snippet:-1,max-image-preview:large,max-video-preview:-1">' in home
          assert 'noindex' not in re.sub(r'\s+', ' ', home[:8000]).lower()
          print('Institutional SERP guard passed.')
          PY

      - name: Commit validated migration
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'rawafid-seo-bot'
          git config user.email '63592172+khaledaltheeb@users.noreply.github.com'
          git add index.html manifest.webmanifest opensearch.xml feed.xml sitemap.xml \
            sectors/mental-health/index.html special-needs/index.html sectors/pediatric-oncology/index.html \
            library/index.html care-guides/index.html specialists-partners/index.html \
            scripts/apply_rawafid_brand.py scripts/rawafid_brand_consistency.py \
            scripts/apply_institutional_serp_v1.py reports/institutional-serp-v1.json
          git commit -m 'SEO: institutional search appearance and sitelink signals'
          git push origin HEAD:${{ github.ref_name }}
