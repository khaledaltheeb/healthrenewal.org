name: Bootstrap structured-data implementation v332

on:
  push:
    branches: ["agent/sitewide-structured-data-v332"]
    paths:
      - ".bootstrap-v332/**"
      - ".github/workflows/bootstrap-structured-data-v332.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-structured-data-v332
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sitewide-structured-data-v332
          fetch-depth: 0

      - name: Decode reviewed implementation files
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64
          import shutil
          import zlib

          mapping = {
              '.bootstrap-v332/apply.b64': 'scripts/apply_structured_data_v332.py',
              '.bootstrap-v332/tests.b64': 'tests/test_structured_data_v332.py',
              '.bootstrap-v332/docs.b64': 'docs/structured-data-v332.md',
              '.bootstrap-v332/workflow.b64': '.github/workflows/structured-data-v332.yml',
          }
          for encoded, target in mapping.items():
              payload = Path(encoded).read_text(encoding='utf-8').strip()
              data = zlib.decompress(base64.b64decode(payload))
              output = Path(target)
              output.parent.mkdir(parents=True, exist_ok=True)
              output.write_bytes(data)
          shutil.rmtree('.bootstrap-v332')
          Path('.github/workflows/bootstrap-structured-data-v332.yml').unlink()
          PY

      - name: Validate generated source before committing
        run: |
          set -euxo pipefail
          python -m py_compile scripts/apply_structured_data_v332.py tests/test_structured_data_v332.py
          python -m unittest -v tests/test_structured_data_v332.py
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/structured-data-v332.yml').read_text(encoding='utf-8')
          required = (
              'name: Site-wide structured data and Pages v332',
              '  build-and-validate:',
              '  deploy:',
              'python scripts/apply_structured_data_v332.py _site --strict --min-pages 1000',
          )
          assert all(marker in text for marker in required), required
          print({'workflow': 'valid', 'required_markers': len(required)})
          PY

      - name: Commit materialized implementation
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "إضافة محرك البيانات المنظمة الشامل v332"
          git push origin HEAD:agent/sitewide-structured-data-v332
