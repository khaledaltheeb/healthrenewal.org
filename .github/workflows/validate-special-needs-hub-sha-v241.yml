name: Validate special-needs hub SHA provenance v241

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/verify-special-needs-hub-live-v241.yml"
      - ".github/workflows/validate-special-needs-hub-sha-v241.yml"
      - "tests/test_special_needs_hub_sha_v241.py"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/verify-special-needs-hub-live-v241.yml"
      - ".github/workflows/validate-special-needs-hub-sha-v241.yml"
      - "tests/test_special_needs_hub_sha_v241.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: special-needs-hub-sha-v241-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile workflow provenance regression test
        run: python -m py_compile tests/test_special_needs_hub_sha_v241.py
      - name: Prove live deployment stamp is authoritative
        run: python -m unittest -v tests.test_special_needs_hub_sha_v241
