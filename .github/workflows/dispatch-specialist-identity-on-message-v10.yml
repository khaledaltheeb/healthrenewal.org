name: Dispatch specialist identity deployment for message v10

on:
  push:
    branches: ["main"]
    paths:
      - "specialists-partners/account-backend/src/specialist-message-v10.js"
      - "specialists-partners/account-backend/migrations/**"
      - ".github/workflows/dispatch-specialist-identity-on-message-v10.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: dispatch-specialist-identity-on-message-v10
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch canonical specialist identity production workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/workflows/deploy-specialist-identity-v10-production.yml/dispatches" \
            -d '{"ref":"main"}'
