name: Quick Info visual template refresh

on:
  push:
    branches:
      - fix/quick-info-visual-template-20260830
    paths:
      - scripts/quick_info_visuals.py
      - scripts/apply_quick_info_visual_system.py
      - .github/workflows/quick-info-visual-template.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quick-info-visual-template-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: fix/quick-info-visual-template-20260830
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image dependency
        run: python -m pip install --disable-pip-version-check pillow

      - name: Apply approved Quick Info visual system
        run: python scripts/apply_quick_info_visual_system.py

      - name: Validate Python syntax
        run: python -m py_compile scripts/build_quick_info.py scripts/quick_info_visuals.py scripts/apply_quick_info_visual_system.py

      - name: Commit generated visual and accessibility updates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "rawafid-quick-info-visual-bot"
          git config user.email "63592172+khaledaltheeb@users.noreply.github.com"
          git add scripts/build_quick_info.py assets/quick-info/quick-info-cover.png assets/quick-info/cards quick-info api/v1/quick-info.json reports/quick-info-visual-refresh.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Quick Info: adopt text-first cards and image alt metadata"
          git push origin HEAD:fix/quick-info-visual-template-20260830
