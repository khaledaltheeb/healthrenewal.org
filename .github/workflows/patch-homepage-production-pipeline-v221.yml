name: Patch homepage production pipeline v221

on:
  push:
    branches: ["fix/final-production-ci-diagnostics-v221"]
    paths: [".github/workflows/patch-homepage-production-pipeline-v221.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/final-production-ci-diagnostics-v221
          fetch-depth: 0
      - name: Integrate daily tools publisher and remove temporary workflow
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/apply_homepage_v20.py")
          text = path.read_text(encoding="utf-8")

          report_marker = '        "sitewide_seo_publisher": 216,\n'
          report_insert = report_marker + '        "daily_tools_publisher": 219,\n'
          if '"daily_tools_publisher": 219' not in text:
              if report_marker not in text:
                  raise SystemExit("Missing report insertion marker")
              text = text.replace(report_marker, report_insert, 1)

          pipeline_marker = (
              '    run_publisher("publish_accessible_arabic_content_v190.py")\n'
              '    register_sitemap("sitemap-accessible-arabic-content.xml")\n'
          )
          pipeline_insert = pipeline_marker + '    run_publisher("publish_daily_tools_v24.py")\n'
          if 'run_publisher("publish_daily_tools_v24.py")' not in text:
              if pipeline_marker not in text:
                  raise SystemExit("Missing pipeline insertion marker")
              text = text.replace(pipeline_marker, pipeline_insert, 1)

          path.write_text(text, encoding="utf-8")
          PY
          git rm .github/workflows/patch-homepage-production-pipeline-v221.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/apply_homepage_v20.py
          git diff --cached --check
          git commit -m "fix: publish linked daily tools in production"
          git push origin HEAD:fix/final-production-ci-diagnostics-v221
