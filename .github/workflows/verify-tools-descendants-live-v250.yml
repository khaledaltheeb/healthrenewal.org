name: Verify tools descendants live v250

on:
  workflow_run:
    workflows: ["Deploy validated main to GitHub Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-tools-descendants-live-v250
  cancel-in-progress: true

jobs:
  verify-live:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_BASE: https://khaledaltheeb.github.io/pterminology-site/
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download uncached production report and deployment record
        run: |
          set -euxo pipefail
          token="$(date +%s)-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          curl --retry 10 --retry-delay 8 --retry-all-errors \
            -H 'Cache-Control: no-cache, no-store, max-age=0' \
            -H 'Pragma: no-cache' \
            -fsSL "${SITE_BASE}api/tools-descendant-marshmallow-v250.json?v=${token}" \
            -o /tmp/tools-descendants-report.json
          curl --retry 10 --retry-delay 8 --retry-all-errors \
            -H 'Cache-Control: no-cache, no-store, max-age=0' \
            -H 'Pragma: no-cache' \
            -fsSL "${SITE_BASE}deployment.json?v=${token}" \
            -o /tmp/live-deployment.json
          test -s /tmp/tools-descendants-report.json
          test -s /tmp/live-deployment.json

      - name: Verify every published tools page and the quiz route
        run: |
          set -euxo pipefail
          python - <<'PY'
          import hashlib
          import json
          import re
          import time
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          base = "https://khaledaltheeb.github.io/pterminology-site/"
          report = json.loads(Path('/tmp/tools-descendants-report.json').read_text(encoding='utf-8'))
          deployment = json.loads(Path('/tmp/live-deployment.json').read_text(encoding='utf-8'))

          assert report.get('status') == 'published', report
          assert report.get('scope') == 'tools/**/*.html', report
          assert report.get('pages', 0) >= 2, report
          assert report.get('child_pages', 0) >= 1, report
          assert report.get('quiz_route') == 'tools/quiz/index.html', report
          assert report.get('quiz_fixed') is True, report
          assert report.get('unstyled_pages') == [], report
          assert report.get('dark_mode_blackening_blocked') is True, report

          routes = report.get('routes')
          assert isinstance(routes, list) and routes, report
          assert 'tools/index.html' in routes, routes
          assert 'tools/quiz/index.html' in routes, routes
          assert len(routes) == report['pages'], report
          assert len(routes) == len(set(routes)), routes

          commit = deployment.get('commit')
          assert isinstance(commit, str) and re.fullmatch(r'[0-9a-f]{40}', commit), deployment

          required = (
              'data-tools-design="marshmallow-v245"',
              'tools-marshmallow-v245',
              'tools-descendant-marshmallow-v250',
              'id="tools-marshmallow-v245-style"',
              'id="tools-descendant-marshmallow-v250-style"',
              '--tm-mint:#e5faf5',
              '--tdm-mint:#e5faf5',
              'background:linear-gradient(145deg,#fff,var(--tdm-mint))!important',
              'color:var(--tdm-ink)!important',
              '@media(prefers-color-scheme:dark)',
          )

          verified = []
          failures = []
          token = f"{int(time.time())}-{commit[:12]}"
          for route in routes:
              if not isinstance(route, str) or not route.startswith('tools/') or not route.endswith('.html'):
                  failures.append({'route': route, 'error': 'invalid route'})
                  continue
              public_route = route[:-10] if route.endswith('/index.html') else route
              url = base + public_route + ('/' if not public_route.endswith('/') else '') + f'?v={token}'
              request = urllib.request.Request(
                  url,
                  headers={
                      'User-Agent': 'tools-descendants-live-v250',
                      'Cache-Control': 'no-cache, no-store, max-age=0',
                      'Pragma': 'no-cache',
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=35) as response:
                      html = response.read().decode('utf-8')
                      status = response.status
              except Exception as exc:
                  failures.append({'route': route, 'error': repr(exc)})
                  continue

              missing = [marker for marker in required if marker not in html]
              if status != 200 or missing:
                  failures.append({'route': route, 'status': status, 'missing': missing})
                  continue
              if html.count('id="tools-marshmallow-v245-style"') != 1:
                  failures.append({'route': route, 'error': 'base style count'})
                  continue
              if html.count('id="tools-descendant-marshmallow-v250-style"') != 1:
                  failures.append({'route': route, 'error': 'descendant style count'})
                  continue
              verified.append({
                  'route': route,
                  'status': status,
                  'sha256': hashlib.sha256(html.encode('utf-8')).hexdigest(),
              })

          assert not failures, failures[:20]
          assert len(verified) == len(routes), (len(verified), len(routes))

          evidence = {
              'version': 250,
              'status': 'passed',
              'live_commit': commit,
              'pages_reported': report['pages'],
              'pages_verified': len(verified),
              'quiz_verified': any(item['route'] == 'tools/quiz/index.html' for item in verified),
              'all_descendants_verified': True,
              'dark_mode_blackening_blocked': True,
              'verified_at': datetime.now(timezone.utc).isoformat(),
              'pages': verified,
          }
          Path('/tmp/tools-descendants-live-v250.json').write_text(
              json.dumps(evidence, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(evidence, ensure_ascii=False, indent=2))
          PY

      - name: Retain live descendant evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tools-descendants-live-v250
          path: |
            /tmp/tools-descendants-live-v250.json
            /tmp/tools-descendants-report.json
            /tmp/live-deployment.json
          if-no-files-found: warn
          retention-days: 30
