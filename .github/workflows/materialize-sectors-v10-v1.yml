name: Materialize governed sectors v10 content

on:
  pull_request:
    branches: [main]
    paths:
      - "content/sectors-v10/**"
      - "data/content-reviews/sectors-v10-editorial-release-v2.json"
      - "scripts/materialize_sectors_v10_v1.py"
      - "scripts/materialize_sectors_v10_compat_v2.py"
      - "scripts/materialize_sectors_v10_metadata_v3.py"
      - "scripts/materialize_sectors_v10_compat_v4.py"
      - "scripts/publish_complete_sitemap_v360.py"
      - "scripts/validate_sitemap_discovery_contract.py"
      - "tests/test_materialize_sectors_v10_v1.py"
      - "tests/test_materialize_sectors_v10_compat_v2.py"
      - "tests/test_materialize_sectors_v10_compat_v4.py"
      - "tests/test_institutional_route_hubs_v1.py"
      - ".github/workflows/materialize-sectors-v10-v1.yml"
  push:
    branches: [main]
    paths:
      - "content/sectors-v10/**"
      - "data/content-reviews/sectors-v10-editorial-release-v2.json"
      - "scripts/materialize_sectors_v10_v1.py"
      - "scripts/materialize_sectors_v10_compat_v2.py"
      - "scripts/materialize_sectors_v10_metadata_v3.py"
      - "scripts/materialize_sectors_v10_compat_v4.py"
      - "scripts/publish_complete_sitemap_v360.py"
      - "scripts/validate_sitemap_discovery_contract.py"
      - "tests/test_materialize_sectors_v10_v1.py"
      - "tests/test_materialize_sectors_v10_compat_v2.py"
      - "tests/test_materialize_sectors_v10_compat_v4.py"
      - "tests/test_institutional_route_hubs_v1.py"
      - ".github/workflows/materialize-sectors-v10-v1.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: materialize-sectors-v10-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile publisher and run focused tests
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/materialize_sectors_v10_v1.py \
            scripts/materialize_sectors_v10_compat_v2.py \
            scripts/materialize_sectors_v10_metadata_v3.py \
            scripts/materialize_sectors_v10_compat_v4.py \
            scripts/publish_complete_sitemap_v360.py \
            scripts/validate_sitemap_discovery_contract.py \
            tests/test_materialize_sectors_v10_v1.py \
            tests/test_materialize_sectors_v10_compat_v2.py \
            tests/test_materialize_sectors_v10_compat_v4.py \
            tests/test_institutional_route_hubs_v1.py
          python -m unittest -v \
            tests.test_materialize_sectors_v10_v1 \
            tests.test_materialize_sectors_v10_compat_v2 \
            tests.test_materialize_sectors_v10_compat_v4 \
            tests.test_institutional_route_hubs_v1

      - name: Materialize canonical v4 public pages
        run: |
          set -euo pipefail
          python scripts/materialize_sectors_v10_compat_v4.py .
          python scripts/materialize_sectors_v10_compat_v4.py . --check

      - name: Publish complete sitemap inventory and verify discovery
        run: |
          set -euo pipefail
          python scripts/publish_complete_sitemap_v360.py . --minimum-urls 1
          python scripts/validate_sitemap_discovery_contract.py
          python -m unittest -v tests.test_institutional_route_hubs_v1

      - name: Verify dynamic inventory and complete clinical guide
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("api/sectors-v10-publication-v1.json").read_text(encoding="utf-8"))
          assert report["status"] == "passed", report
          assert report["pageCount"] >= 37, report
          assert report["hubCount"] == 1, report
          assert report["pageCount"] == len(report["routes"]), report
          assert report["qualityGates"]["minimumPages"] is True, report
          assert report["qualityGates"]["allRoutesUnique"] is True, report
          assert report["qualityGates"]["manualReviewSourcesExcluded"] is True, report
          assert report["qualityGates"]["legacySourcesNotDuplicated"] is True, report

          pages = list(Path("evidence-guides").glob("*/index.html"))
          assert len(pages) == report["pageCount"], (len(pages), report["pageCount"])
          clinical_route = "/evidence-guides/clinical-anxiety/"
          assert clinical_route in set(report["routes"]), report["routes"]
          skipped = {entry["source"] for entry in report["skipped"]}
          assert "content/sectors-v10/clinical-anxiety.json" not in skipped, skipped

          clinical_path = Path("evidence-guides/clinical-anxiety/index.html")
          clinical = clinical_path.read_text(encoding="utf-8")
          required_titles = (
              "متى يكون القلق طبيعيًا ومتى يصبح اضطرابًا؟",
              "الفرق بين نوبة الهلع واضطراب الهلع",
              "الوسواس القهري والأفكار الاقتحامية: ما الفرق؟",
              "كيف تُبنى خطة علاج مشتركة؟",
              "متى تصبح الأولوية للسلامة أو التقييم العاجل؟",
          )
          for title in required_titles:
              assert title in clinical, title
          assert clinical.count('id="practical-questions"') == 1
          assert clinical.count('id="governance"') == 1
          assert clinical.count('id="related-links"') == 1
          assert "MedicalWebPage" in clinical
          assert "CollectionPage" in clinical
          assert "مختبر التقييمات النفسية الآمنة" in clinical
          assert "مراجعة خارجية موصى بها ولم تكتمل" in clinical
          assert "علامات الخطر التي تستلزم تصعيدًا عاجلًا" in clinical
          assert "هذه الصفحة للتثقيف العام ولا تثبت تشخيصًا" in clinical
          assert "معاقين" not in clinical

          for path in pages:
              text = path.read_text(encoding="utf-8")
              assert text.count("<h1") == 1, path
              assert 'data-publication="sectors-v10-v1"' in text, path
              assert '<link rel="canonical"' in text, path
              assert "منصة روافد" in text, path
              assert "<script>alert(" not in text, path
              assert "معاقين" not in text, path

          print({
              "pages": report["pageCount"],
              "articles": report["articleCount"],
              "references": report["sourceReferenceCount"],
              "clinical_units": len(required_titles),
          })
          PY

      - name: Commit generated source pages and discovery inventory
        if: github.event_name != 'pull_request'
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            evidence-guides \
            api/sectors-v10-publication-v1.json \
            sitemap.xml \
            sitemap-index.xml \
            robots.txt \
            api/sitemap-completeness-v360.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No materialization or discovery changes."
          else
            git commit -m "content: materialize governed sectors-v10 guides and sitemap inventory"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch complete Pages publisher
        if: github.event_name != 'pull_request' && steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-complete-pages-with-ai-search.yml/dispatches" \
            -d '{"ref":"main"}'