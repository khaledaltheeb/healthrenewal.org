name: Validate institutional homepage v19

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile verifier and tests
        run: |
          python -m py_compile scripts/verify_homepage_v19.py tests/test_verify_homepage_v19.py
      - name: Run semantic discovery metadata unit tests
        run: python -m unittest -v tests.test_verify_homepage_v19
      - name: Validate homepage discovery, metadata, and structure
        run: |
          set +e
          python scripts/verify_homepage_v19.py > /tmp/homepage-v19.log 2>&1
          status=$?
          cat /tmp/homepage-v19.log
          exit "$status"
      - name: Upload homepage verifier failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-v19-failure-log
          path: /tmp/homepage-v19.log
          if-no-files-found: error
          retention-days: 7
