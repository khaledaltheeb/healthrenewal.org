name: Validate addiction expansion wave CDE v1

on:
  pull_request:
    paths:
      - "addiction/populations/**"
      - "addiction/tools/**"
      - "assets/addiction/addiction-expansion-v1.css"
      - "data/addiction-evidence/source-registry-wave-cde-v1.json"
      - "data/addiction-evidence/claim-source-map-v2.json"
      - "api/addiction-expansion-wave-cde-v1.json"
      - "tests/test_addiction_expansion_wave_cde_v1.py"
      - "sitemap-addiction.xml"
      - ".github/workflows/validate-addiction-expansion-wave-cde-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: addiction-wave-cde-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile and run dependency-free contracts
        run: |
          set -euxo pipefail
          python -m py_compile tests/test_addiction_expansion_wave_cde_v1.py
          python - <<'PY'
          import runpy
          ns = runpy.run_path("tests/test_addiction_expansion_wave_cde_v1.py")
          tests = [v for k,v in sorted(ns.items()) if k.startswith("test_") and callable(v)]
          if len(tests) != 4:
              raise SystemExit(f"Expected 4 tests, found {len(tests)}")
          for test in tests:
              test()
              print(f"PASS {test.__name__}")
          PY
