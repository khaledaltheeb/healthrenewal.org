name: One-shot homepage report compatibility v216

on:
  push:
    branches: ["agent/special-needs-guides-v214-clean"]

permissions:
  contents: write

jobs:
  patch-and-remove-self:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/special-needs-guides-v214-clean
          fetch-depth: 0
      - name: Preserve homepage report field compatibility
        run: |
          python - <<'PY'
          from pathlib import Path

          script = Path("scripts/apply_homepage_v20.py")
          text = script.read_text(encoding="utf-8")
          old = '        "lab_inventory_updated": True,\n'
          new = (
              '        "lab_inventory_updated": True,\n'
              '        "lab_inventory_metadata_updated": True,\n'
          )
          if '"lab_inventory_metadata_updated": True' not in text:
              if text.count(old) != 1:
                  raise SystemExit("Homepage report inventory field is missing or ambiguous")
              text = text.replace(old, new, 1)
              script.write_text(text, encoding="utf-8")

          workflow = Path(".github/workflows/one-shot-homepage-report-compat-v216.yml")
          workflow.unlink()
          PY
      - name: Verify compatibility contract
        run: |
          python -m py_compile scripts/apply_homepage_v20.py
          grep -q '"lab_inventory_updated": True' scripts/apply_homepage_v20.py
          grep -q '"lab_inventory_metadata_updated": True' scripts/apply_homepage_v20.py
      - name: Commit compatibility fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/apply_homepage_v20.py .github/workflows/one-shot-homepage-report-compat-v216.yml
          git commit -m "تثبيت توافق عقد تقرير مخزون الأدوات"
          git push origin HEAD:agent/special-needs-guides-v214-clean
