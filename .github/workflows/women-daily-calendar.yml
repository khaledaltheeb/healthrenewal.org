name: Women daily calendar quality

on:
  pull_request:
    paths:
      - "sectors/women/daily-calendar/**"
      - "sectors/women/index.html"
      - "sectors/calendars/**"
      - "api/women-daily-calendar-v1.json"
      - "scripts/apply_homepage_v20.py"
      - "scripts/publish_calendars_v221.py"
      - "scripts/finalize_calendar_release_once.py"
      - "tests/test_women_daily_calendar.py"
      - "sitemap-women-calendar.xml"
      - "sitemap-calendars.xml"
      - ".github/workflows/women-daily-calendar.yml"
  push:
    branches:
      - main
      - agent/women-calendar-publish-v3
    paths:
      - "sectors/women/daily-calendar/**"
      - "sectors/women/index.html"
      - "sectors/calendars/**"
      - "api/women-daily-calendar-v1.json"
      - "scripts/apply_homepage_v20.py"
      - "scripts/publish_calendars_v221.py"
      - "scripts/finalize_calendar_release_once.py"
      - "tests/test_women_daily_calendar.py"
      - "sitemap-women-calendar.xml"
      - "sitemap-calendars.xml"
      - ".github/workflows/women-daily-calendar.yml"

permissions:
  contents: read

jobs:
  static-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript and Python syntax
        run: |
          node --check sectors/women/daily-calendar/calendar.js
          node --check sectors/women/daily-calendar/calendar-core.js
          node --check sectors/women/daily-calendar/calendar-enhancements.js
          node --check sectors/women/daily-calendar/service-worker.js
          python -m py_compile scripts/apply_homepage_v20.py scripts/publish_calendars_v221.py tests/test_women_daily_calendar.py
      - name: Validate JSON manifests
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in [
              Path("sectors/women/daily-calendar/manifest.webmanifest"),
              Path("sectors/women/daily-calendar/editorial-manifest.json"),
              Path("api/women-daily-calendar-v1.json"),
          ]:
              json.loads(path.read_text(encoding="utf-8"))
              print(f"PASS {path}")
          PY
      - name: Run calendar contract without external dependencies
        run: |
          python - <<'PY'
          import runpy
          namespace = runpy.run_path("tests/test_women_daily_calendar.py")
          tests = [value for name, value in sorted(namespace.items()) if name.startswith("test_") and callable(value)]
          if len(tests) != 2:
              raise SystemExit(f"Expected 2 tests, found {len(tests)}")
          for test in tests:
              test()
              print(f"PASS {test.__name__}")
          PY

  finalize-release:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/women-calendar-publish-v3'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/women-calendar-publish-v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply final release cleanup
        run: python scripts/finalize_calendar_release_once.py
      - name: Validate calendar-owned release surfaces
        run: |
          node --check sectors/women/daily-calendar/calendar.js
          node --check sectors/women/daily-calendar/calendar-core.js
          node --check sectors/women/daily-calendar/calendar-enhancements.js
          python -m py_compile scripts/apply_homepage_v20.py scripts/publish_calendars_v221.py tests/test_women_daily_calendar.py tests/test_student_daily_calendar.py
          python - <<'PY'
          import runpy
          from pathlib import Path
          from scripts.normalize_platform_shell import normalize_file
          root = Path('.').resolve()
          for relative in ('sectors/calendars/index.html', 'sectors/calendars/women/index.html'):
              result = normalize_file(root / relative, root, check_only=True)
              if result.status != 'current':
                  raise SystemExit(f'{relative}: {result.status} {result.detail}')
              print(f'PASS normalized {relative}')
          for path in ('tests/test_women_daily_calendar.py', 'tests/test_student_daily_calendar.py'):
              namespace = runpy.run_path(path)
              for name, test in sorted(namespace.items()):
                  if name.startswith('test_') and callable(test):
                      test()
                      print(f'PASS {path}: {name}')
          PY
      - name: Commit final release cleanup
        run: |
          git config user.name "rawafid-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(calendars): finalize public release surfaces"
          git push origin HEAD:agent/women-calendar-publish-v3
