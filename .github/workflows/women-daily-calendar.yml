name: Women daily calendar quality

on:
  pull_request:
    paths:
      - "sectors/women/daily-calendar/**"
      - "sectors/women/index.html"
      - "api/women-daily-calendar-v1.json"
      - "scripts/apply_homepage_v20.py"
      - "index.html"
      - "tests/test_women_daily_calendar.py"
      - "sitemap-women-calendar.xml"
      - "sitemap-index.xml"
      - ".github/workflows/women-daily-calendar.yml"
  push:
    branches:
      - agent/women-daily-calendar-v1
    paths:
      - "sectors/women/daily-calendar/**"
      - "sectors/women/index.html"
      - "api/women-daily-calendar-v1.json"
      - "scripts/apply_homepage_v20.py"
      - "index.html"
      - "tests/test_women_daily_calendar.py"
      - "sitemap-women-calendar.xml"
      - "sitemap-index.xml"
      - ".github/workflows/women-daily-calendar.yml"

permissions:
  contents: read

jobs:
  static-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript and publisher syntax
        run: |
          node --check sectors/women/daily-calendar/calendar.js
          python -m py_compile scripts/apply_homepage_v20.py tests/test_women_daily_calendar.py
      - name: Run calendar contract without external dependencies
        run: |
          python - <<'PY'
          import runpy
          namespace = runpy.run_path("tests/test_women_daily_calendar.py")
          tests = [
              value
              for name, value in sorted(namespace.items())
              if name.startswith("test_") and callable(value)
          ]
          if len(tests) != 2:
              raise SystemExit(f"Expected 2 tests, found {len(tests)}")
          for test in tests:
              test()
              print(f"PASS {test.__name__}")
          PY

  apply-menstruation-terminology:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/women-daily-calendar-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply terminology and regression contract
        run: |
          python - <<'PY'
          from pathlib import Path

          targets = [
              Path("sectors/women/daily-calendar/index.html"),
              Path("sectors/women/daily-calendar/calendar.js"),
              Path("sectors/women/daily-calendar/editorial-manifest.json"),
              Path("sectors/women/daily-calendar/manifest.webmanifest"),
              Path("sectors/women/index.html"),
              Path("sectors/calendars/index.html"),
              Path("sectors/calendars/women/index.html"),
              Path("index.html"),
              Path("scripts/apply_homepage_v20.py"),
          ]
          replacements = [
              ("الدورة الشهرية", "الحيض"),
              ("دورات متكررة أقصر أو أطول بوضوح من نمطك", "فواصل متكررة بين بدايات الحيض أقصر أو أطول بوضوح من نمطك"),
              ("متوسط طول الدورة", "متوسط الفاصل بين بدايات الحيض"),
              ("طول الدورة", "الفاصل بين بدايات الحيض"),
              ("اليوم التقديري من الدورة", "اليوم التقديري منذ بداية الحيض"),
              ("اليوم من الدورة", "اليوم منذ بداية الحيض"),
              ("أول يوم لآخر دورة", "أول يوم لآخر حيض"),
              ("آخر دورة", "آخر حيض"),
              ("موعد الدورة المتوقع", "موعد الحيض المتوقع"),
              ("موعد الدورة", "موعد الحيض"),
              ("توقع الدورة", "توقع الحيض"),
              ("تتبع الدورة", "تتبع الحيض"),
              ("تاريخ الدورة", "تاريخ الحيض"),
              ("حالة الدورة", "حالة الحيض"),
              ("نافذة دورة متوقعة", "نافذة حيض متوقعة"),
              ("نافذة الدورة", "نافذة الحيض"),
              ("نوافذ الدورة", "نوافذ الحيض"),
              ("إعدادات الدورة", "إعدادات الحيض"),
              ("ضبط الدورة", "ضبط الحيض"),
              ("بدء الدورة اليوم", "بدء الحيض اليوم"),
              ("غياب الدورة ثلاثة أشهر", "غياب الحيض ثلاثة أشهر"),
              ("مرتبط بالدورة", "مرتبط بالحيض"),
              ("يذكر الدورة عند أحداثها", "يذكر الحيض عند أيامه المتوقعة"),
              ("الدورة والخصوصية", "الحيض والخصوصية"),
              ("الدورة في التقويم", "الحيض في التقويم"),
              ("عبر عدة دورات", "عبر عدة مرات حيض"),
              ("كل دورة", "كل مرة حيض"),
              ("أكثر من دورة", "أكثر من مرة حيض"),
          ]
          changed = []
          for path in targets:
              if not path.exists():
                  continue
              text = path.read_text(encoding="utf-8")
              original = text
              for old, new in replacements:
                  text = text.replace(old, new)
              text = text.replace("الدورات", "مرات الحيض")
              text = text.replace("الدورة", "الحيض")
              text = text.replace("طول الحيض", "الفاصل بين بدايات الحيض")
              if text != original:
                  path.write_text(text, encoding="utf-8")
                  changed.append(str(path))

          test_path = Path("tests/test_women_daily_calendar.py")
          test_text = test_path.read_text(encoding="utf-8")
          anchor = '    assert "كيف تشعرين الآن؟" in html\n'
          block = '''    assert "الحيض" in html
    assert "الفاصل بين بدايات الحيض" in html
    for forbidden_term in ("الدورة الشهرية", "الدورة"):
        assert forbidden_term not in html
        assert forbidden_term not in js
    assert "طول الحيض" not in html
    assert "طول الحيض" not in js
'''
          if block not in test_text:
              if anchor not in test_text:
                  raise SystemExit("Could not locate terminology-test insertion point")
              test_text = test_text.replace(anchor, anchor + block, 1)
              test_path.write_text(test_text, encoding="utf-8")
              changed.append(str(test_path))

          app_text = "\n".join(
              p.read_text(encoding="utf-8")
              for p in [
                  Path("sectors/women/daily-calendar/index.html"),
                  Path("sectors/women/daily-calendar/calendar.js"),
              ]
          )
          forbidden = [term for term in ("الدورة الشهرية", "الدورة", "طول الحيض") if term in app_text]
          if forbidden:
              raise SystemExit(f"Forbidden or inaccurate terminology remains: {forbidden}")
          if "الحيض" not in app_text or "الفاصل بين بدايات الحيض" not in app_text:
              raise SystemExit("Approved terminology was not applied completely")
          print("Changed files:")
          print("\n".join(changed))
          PY
      - name: Validate corrected application
        run: |
          node --check sectors/women/daily-calendar/calendar.js
          python -m py_compile tests/test_women_daily_calendar.py
          python - <<'PY'
          import runpy
          namespace = runpy.run_path("tests/test_women_daily_calendar.py")
          for name, test in sorted(namespace.items()):
              if name.startswith("test_") and callable(test):
                  test()
                  print(f"PASS {name}")
          PY
      - name: Commit correction
        run: |
          rm -f .github/workflows/one-time-adopt-menstruation-term.yml
          git config user.name "healthrenewal-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No terminology changes remain"
            exit 0
          fi
          git commit -m "fix(women): use الحيض terminology consistently"
          git push origin HEAD:agent/women-daily-calendar-v1
