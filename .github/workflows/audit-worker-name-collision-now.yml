name: Audit Worker deployment name collision now

on:
  push:
    branches:
      - agent/inspect-cloudflare-specialists-now
    paths:
      - reports/audit-worker-name-collision-trigger.txt

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Audit deployment files and Worker name occurrences
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          root=Path('.')
          skip={'.git','node_modules','dist','build','.cache'}
          interesting_names={'wrangler.toml','wrangler.json','wrangler.jsonc','package.json'}
          files=[]; occurrences=[]; deploy_commands=[]
          for path in root.rglob('*'):
              if not path.is_file() or any(part in skip for part in path.parts): continue
              rel=path.as_posix()
              if path.name in interesting_names or rel.startswith('.github/workflows/'):
                  files.append(rel)
              if path.suffix.lower() not in {'.yml','.yaml','.toml','.json','.jsonc','.js','.mjs','.cjs','.ts','.py','.sh','.md','.txt'}: continue
              try: text=path.read_text(encoding='utf-8')
              except Exception: continue
              for no,line in enumerate(text.splitlines(),1):
                  low=line.lower()
                  if 'pterminology-specialist-accounts' in line:
                      occurrences.append({'path':rel,'line':no,'text':line[:500]})
                  if 'wrangler' in low and ('deploy' in low or 'publish' in low):
                      deploy_commands.append({'path':rel,'line':no,'text':line[:500]})
          report={'schema_version':1,'checked_at':datetime.now(timezone.utc).isoformat(),'config_and_workflow_files':sorted(files),'worker_name_occurrences':occurrences,'wrangler_deploy_commands':deploy_commands}
          Path('reports/worker-name-collision-audit-now.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Commit report to diagnostic branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/worker-name-collision-audit-now.json
          git commit -m "chore: record Worker name collision audit [skip ci]"
          git pull --rebase origin agent/inspect-cloudflare-specialists-now
          git push origin HEAD:agent/inspect-cloudflare-specialists-now
