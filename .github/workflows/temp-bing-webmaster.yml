name: Temporary Encrypted Bing Webmaster Runner

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  bing-webmaster:
    if: github.event.issue.title == '[TEMP] Bing Webmaster encrypted run'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Generate ephemeral transport key
        shell: bash
        run: |
          set -euo pipefail
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out /tmp/private.pem 2>/dev/null
          openssl pkey -in /tmp/private.pem -pubout -out /tmp/public.pem 2>/dev/null
          public_key_b64="$(base64 -w0 /tmp/public.pem)"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -f body="BING_PUBLIC_KEY:${public_key_b64}" >/dev/null

      - name: Receive encrypted payload
        shell: bash
        run: |
          set -euo pipefail
          payload=""
          for _ in $(seq 1 150); do
            payload="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments?per_page=100" \
              --jq '[.[] | select(.body | startswith("BING_PAYLOAD:"))][-1].body // ""')"
            if [[ -n "$payload" ]]; then
              break
            fi
            sleep 4
          done
          if [[ -z "$payload" ]]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
              -f body="BING_RUN_FAILED: encrypted payload was not received." >/dev/null
            exit 1
          fi
          printf '%s' "${payload#BING_PAYLOAD:}" | base64 -d > /tmp/payload.bin
          openssl pkeyutl -decrypt -inkey /tmp/private.pem -in /tmp/payload.bin -out /tmp/payload.json \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          api_key="$(jq -r '.api_key' /tmp/payload.json)"
          if [[ -z "$api_key" || "$api_key" == "null" ]]; then
            exit 1
          fi
          echo "::add-mask::$api_key"

      - name: Run Bing Webmaster operations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import datetime as dt
          import gzip
          import hashlib
          import hmac
          import json
          import os
          import re
          import subprocess
          import urllib.error
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET
          from pathlib import Path

          payload = json.loads(Path('/tmp/payload.json').read_text(encoding='utf-8'))
          API_KEY = payload['api_key']
          REPORT_SECRET = payload['report_secret']
          TARGET_DOMAIN = payload.get('target_domain', 'healthrenewal.org').strip().lower()
          BASE = 'https://ssl.bing.com/webmaster/api.svc/json'
          UA = 'HealthRenewal-BingWebmaster-Temporary/1.0'

          def sanitize_text(value):
              return str(value).replace(API_KEY, '[REDACTED]')

          def scrub(value):
              if isinstance(value, dict):
                  out = {}
                  for k, v in value.items():
                      if k.lower() in {'authenticationcode', 'dnsverificationcode', 'apikey', 'api_key'}:
                          continue
                      out[k] = scrub(v)
                  return out
              if isinstance(value, list):
                  return [scrub(v) for v in value]
              if isinstance(value, str):
                  return sanitize_text(value)
              return value

          def api_get(method, params=None, timeout=45):
              q = dict(params or {})
              q['apikey'] = API_KEY
              url = f"{BASE}/{method}?{urllib.parse.urlencode(q)}"
              req = urllib.request.Request(url, headers={'Accept': 'application/json', 'User-Agent': UA})
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as resp:
                      raw = resp.read().decode('utf-8', 'replace')
                      obj = json.loads(raw) if raw else {'d': None}
                      return {'ok': True, 'status': resp.status, 'data': scrub(obj.get('d'))}
              except urllib.error.HTTPError as e:
                  body = e.read(4096).decode('utf-8', 'replace')
                  return {'ok': False, 'status': e.code, 'error': sanitize_text(body)[:2000]}
              except Exception as e:
                  return {'ok': False, 'status': None, 'error': sanitize_text(type(e).__name__ + ': ' + str(e))[:2000]}

          def api_post(method, body, timeout=60):
              url = f"{BASE}/{method}?apikey={urllib.parse.quote(API_KEY)}"
              data = json.dumps(body, ensure_ascii=False).encode('utf-8')
              req = urllib.request.Request(url, data=data, method='POST', headers={
                  'Accept': 'application/json',
                  'Content-Type': 'application/json; charset=utf-8',
                  'User-Agent': UA,
              })
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as resp:
                      raw = resp.read().decode('utf-8', 'replace')
                      obj = json.loads(raw) if raw else {'d': None}
                      return {'ok': True, 'status': resp.status, 'data': scrub(obj.get('d'))}
              except urllib.error.HTTPError as e:
                  err = e.read(4096).decode('utf-8', 'replace')
                  return {'ok': False, 'status': e.code, 'error': sanitize_text(err)[:2000]}
              except Exception as e:
                  return {'ok': False, 'status': None, 'error': sanitize_text(type(e).__name__ + ': ' + str(e))[:2000]}

          def fetch_public(url, timeout=35, max_bytes=12_000_000):
              req = urllib.request.Request(url, headers={'User-Agent': UA, 'Accept': 'application/xml,text/xml,text/plain,*/*'})
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as resp:
                      data = resp.read(max_bytes + 1)
                      if len(data) > max_bytes:
                          return {'ok': False, 'status': resp.status, 'error': 'response too large'}
                      return {
                          'ok': True,
                          'status': resp.status,
                          'url': resp.geturl(),
                          'content_type': resp.headers.get('Content-Type', ''),
                          'body': data,
                      }
              except urllib.error.HTTPError as e:
                  return {'ok': False, 'status': e.code, 'error': f'HTTP {e.code}'}
              except Exception as e:
                  return {'ok': False, 'status': None, 'error': type(e).__name__}

          def host_matches(url):
              try:
                  host = (urllib.parse.urlparse(url).hostname or '').lower()
              except Exception:
                  return False
              return host == TARGET_DOMAIN or host == 'www.' + TARGET_DOMAIN

          report = {
              'generated_at_utc': dt.datetime.now(dt.timezone.utc).isoformat(),
              'target_domain': TARGET_DOMAIN,
              'actions': {},
              'diagnostics': {},
              'errors': [],
          }

          sites_resp = api_get('GetUserSites')
          report['diagnostics']['user_sites'] = sites_resp
          sites = sites_resp.get('data') if sites_resp.get('ok') else []
          sites = sites if isinstance(sites, list) else []
          candidates = [s for s in sites if isinstance(s, dict) and s.get('IsVerified') and host_matches(s.get('Url', ''))]
          candidates.sort(key=lambda s: (0 if str(s.get('Url', '')).startswith('https://') else 1, 0 if '://www.' not in str(s.get('Url', '')) else 1))
          if not candidates:
              report['errors'].append('No verified Bing Webmaster site matched the target domain.')
              report['site_verified'] = False
              selected_site = None
          else:
              selected_site = candidates[0]['Url']
              report['site_verified'] = True
              report['selected_site'] = selected_site

          valid_feeds = []
          discovered_urls = []
          seen_feed_fetch = set()

          if selected_site:
              scheme = urllib.parse.urlparse(selected_site).scheme or 'https'
              public_root = f'https://{TARGET_DOMAIN}'
              robots_url = public_root + '/robots.txt'
              robots = fetch_public(robots_url, max_bytes=1_000_000)
              report['diagnostics']['robots'] = {k: v for k, v in robots.items() if k != 'body'}
              candidates_feed = []
              if robots.get('ok'):
                  text = robots['body'].decode('utf-8', 'replace')
                  for line in text.splitlines():
                      m = re.match(r'\s*Sitemap\s*:\s*(\S+)\s*$', line, re.I)
                      if m:
                          candidates_feed.append(m.group(1))
              candidates_feed.extend([
                  public_root + '/sitemap.xml',
                  public_root + '/sitemap_index.xml',
                  public_root + '/sitemap-index.xml',
              ])
              candidates_feed = list(dict.fromkeys(candidates_feed))

              def parse_feed(url, depth=0):
                  if depth > 3 or url in seen_feed_fetch or len(seen_feed_fetch) >= 40:
                      return
                  seen_feed_fetch.add(url)
                  fetched = fetch_public(url)
                  if not fetched.get('ok'):
                      return
                  body = fetched['body']
                  try:
                      root = ET.fromstring(body)
                  except Exception:
                      return
                  tag = root.tag.rsplit('}', 1)[-1].lower()
                  locs = []
                  if tag == 'sitemapindex':
                      for node in root.iter():
                          if node.tag.rsplit('}', 1)[-1].lower() == 'loc' and node.text:
                              locs.append(node.text.strip())
                      for child in locs[:40]:
                          if host_matches(child):
                              parse_feed(child, depth + 1)
                  elif tag == 'urlset':
                      entries = []
                      for urlnode in list(root):
                          if urlnode.tag.rsplit('}', 1)[-1].lower() != 'url':
                              continue
                          loc = None
                          lastmod = ''
                          for child in list(urlnode):
                              lname = child.tag.rsplit('}', 1)[-1].lower()
                              if lname == 'loc' and child.text:
                                  loc = child.text.strip()
                              elif lname == 'lastmod' and child.text:
                                  lastmod = child.text.strip()
                          if loc and host_matches(loc):
                              entries.append({'url': loc, 'lastmod': lastmod})
                      discovered_urls.extend(entries)

              for feed in candidates_feed:
                  fetched = fetch_public(feed)
                  if not fetched.get('ok'):
                      continue
                  try:
                      root = ET.fromstring(fetched['body'])
                      tag = root.tag.rsplit('}', 1)[-1].lower()
                  except Exception:
                      continue
                  if tag in {'urlset', 'sitemapindex'}:
                      final_url = fetched.get('url', feed)
                      if host_matches(final_url):
                          valid_feeds.append(final_url)
                          parse_feed(final_url)
              valid_feeds = list(dict.fromkeys(valid_feeds))

              existing_feeds_before = api_get('GetFeeds', {'siteUrl': selected_site})
              report['diagnostics']['feeds_before'] = existing_feeds_before
              feed_actions = []
              for feed in valid_feeds:
                  res = api_post('SubmitFeed', {'siteUrl': selected_site, 'feedUrl': feed})
                  feed_actions.append({'feed': feed, 'result': res})
              report['actions']['submit_feeds'] = feed_actions

              quota_before = api_get('GetUrlSubmissionQuota', {'siteUrl': selected_site})
              report['diagnostics']['quota_before'] = quota_before
              qdata = quota_before.get('data') if quota_before.get('ok') else {}
              qdata = qdata if isinstance(qdata, dict) else {}
              daily = int(qdata.get('DailyQuota') or 0)
              monthly = int(qdata.get('MonthlyQuota') or 0)
              available = min([x for x in (daily, monthly, 500) if x > 0], default=0)

              dedup = {}
              for item in discovered_urls:
                  u = item.get('url')
                  if u and host_matches(u):
                      previous = dedup.get(u)
                      if previous is None or item.get('lastmod', '') > previous.get('lastmod', ''):
                          dedup[u] = item
              homepage = public_root + '/'
              if homepage not in dedup:
                  dedup[homepage] = {'url': homepage, 'lastmod': ''}
              ordered = sorted(dedup.values(), key=lambda x: (x.get('url') != homepage, -(len(x.get('url', ''))), x.get('lastmod', '')), reverse=False)
              # Prefer homepage, recently modified URLs, then shorter canonical paths.
              ordered = [dedup[homepage]] + sorted(
                  [x for x in dedup.values() if x.get('url') != homepage],
                  key=lambda x: (x.get('lastmod', ''), -len(x.get('url', ''))),
                  reverse=True,
              )
              urls_to_submit = [x['url'] for x in ordered[:available]] if available > 0 else []
              batch_result = None
              if urls_to_submit:
                  batch_result = api_post('SubmitUrlBatch', {'siteUrl': selected_site, 'urlList': urls_to_submit})
                  if not batch_result.get('ok') and batch_result.get('status') in {404, 405}:
                      batch_result = api_post('SubmitUrlbatch', {'siteUrl': selected_site, 'urlList': urls_to_submit})
              report['actions']['submit_urls'] = {
                  'available_quota_used': len(urls_to_submit),
                  'submitted_urls': urls_to_submit,
                  'result': batch_result,
                  'discovered_url_count': len(dedup),
              }

              diagnostics = [
                  ('feeds_after', 'GetFeeds', {'siteUrl': selected_site}),
                  ('quota_after', 'GetUrlSubmissionQuota', {'siteUrl': selected_site}),
                  ('crawl_stats', 'GetCrawlStats', {'siteUrl': selected_site}),
                  ('crawl_issues', 'GetCrawlIssues', {'siteUrl': selected_site}),
                  ('rank_traffic', 'GetRankAndTrafficStats', {'siteUrl': selected_site}),
                  ('query_stats', 'GetQueryStats', {'siteUrl': selected_site}),
                  ('page_stats', 'GetPageStats', {'siteUrl': selected_site}),
                  ('link_counts', 'GetLinkCounts', {'siteUrl': selected_site, 'count': 100}),
                  ('blocked_urls', 'GetBlockedUrls', {'siteUrl': selected_site}),
                  ('query_parameters', 'GetQueryParameters', {'siteUrl': selected_site}),
                  ('country_region', 'GetCountryRegionSettings', {'siteUrl': selected_site}),
                  ('crawl_settings', 'GetCrawlSettings', {'siteUrl': selected_site}),
                  ('fetched_urls', 'GetFetchedUrls', {'siteUrl': selected_site}),
                  ('connected_pages', 'GetConnectedPages', {'siteUrl': selected_site}),
              ]
              for key, method, params in diagnostics:
                  res = api_get(method, params)
                  if isinstance(res.get('data'), list) and len(res['data']) > 100:
                      res['total_items'] = len(res['data'])
                      res['data'] = res['data'][:100]
                  report['diagnostics'][key] = res

              important_urls = [homepage] + [u for u in urls_to_submit if u != homepage][:9]
              url_checks = []
              for u in important_urls:
                  url_checks.append({
                      'url': u,
                      'index_info': api_get('GetUrlInfo', {'siteUrl': selected_site, 'url': u}),
                      'traffic_info': api_get('GetUrlTrafficInfo', {'siteUrl': selected_site, 'url': u}),
                  })
              report['diagnostics']['url_checks'] = url_checks

          report = scrub(report)
          report_json = json.dumps(report, ensure_ascii=False, separators=(',', ':')).encode('utf-8')
          compressed = gzip.compress(report_json, compresslevel=9)
          Path('/tmp/report.json.gz').write_bytes(compressed)
          env = os.environ.copy()
          env['REPORT_SECRET'] = REPORT_SECRET
          subprocess.run([
              'openssl', 'enc', '-aes-256-cbc', '-pbkdf2', '-iter', '200000', '-salt',
              '-in', '/tmp/report.json.gz', '-out', '/tmp/report.enc', '-pass', 'env:REPORT_SECRET'
          ], check=True, env=env, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          encrypted = Path('/tmp/report.enc').read_bytes()
          mac = hmac.new(REPORT_SECRET.encode('utf-8'), encrypted, hashlib.sha256).hexdigest()
          report_b64 = base64.b64encode(encrypted).decode('ascii')

          selected = report.get('selected_site', 'none')
          feed_count = sum(1 for x in report.get('actions', {}).get('submit_feeds', []) if x.get('result', {}).get('ok'))
          url_action = report.get('actions', {}).get('submit_urls', {})
          url_count = int(url_action.get('available_quota_used') or 0)
          crawl_data = report.get('diagnostics', {}).get('crawl_issues', {}).get('data')
          crawl_count = len(crawl_data) if isinstance(crawl_data, list) else 0
          summary = (
              'BING_RESULT_READY\n'
              f'Site: {selected}\n'
              f'Verified: {bool(report.get("site_verified"))}\n'
              f'Sitemaps submitted successfully: {feed_count}\n'
              f'URLs submitted: {url_count}\n'
              f'Crawl issues returned: {crawl_count}\n'
              f'BING_REPORT_HMAC:{mac}\n'
              f'BING_REPORT:{report_b64}'
          )
          Path('/tmp/result_comment.txt').write_text(summary, encoding='utf-8')
          PY

      - name: Return encrypted report
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -f body="$(cat /tmp/result_comment.txt)" >/dev/null
          rm -f /tmp/private.pem /tmp/public.pem /tmp/payload.bin /tmp/payload.json /tmp/report.json.gz /tmp/report.enc /tmp/result_comment.txt
