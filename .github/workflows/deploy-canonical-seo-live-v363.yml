name: Deploy canonical SEO live v363

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "robots.txt"
      - "CNAME"
      - "sitemap*.xml"
      - "scripts/fix_healthrenewal_seo.py"
      - "scripts/validate_sitemap_discovery_contract.py"
      - ".github/workflows/deploy-canonical-seo-live-v363.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: canonical-seo-live-v363
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate source SEO contracts
        run: |
          set -euxo pipefail
          python scripts/validate_sitemap_discovery_contract.py
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.stack=[]
                  self.headings=[]
                  self.missing_alt=[]
                  self.external_links=0
              def handle_starttag(self,tag,attrs):
                  values=dict(attrs)
                  if tag in {'h1','h2','h3','h4','h5','h6'}:
                      self.stack.append([tag,[]])
                  if tag == 'img' and not values.get('alt','').strip():
                      self.missing_alt.append(values.get('src','<unknown>'))
                  if tag == 'a' and values.get('href','').startswith(('https://','http://')):
                      self.external_links += 1
              def handle_data(self,data):
                  if self.stack:
                      self.stack[-1][1].append(data)
              def handle_endtag(self,tag):
                  if self.stack and self.stack[-1][0] == tag:
                      _,parts=self.stack.pop()
                      text=' '.join(''.join(parts).split())
                      if text:
                          self.headings.append(text)

          html=Path('index.html').read_text(encoding='utf-8')
          required=(
              '<link rel="canonical" href="https://healthrenewal.org/">',
              '<link rel="alternate" hreflang="ar" href="https://healthrenewal.org/">',
              '<h1>منصة الصحة النفسية وذوي الاحتياجات الخاصة<br>',
              'data-seo-external-sources="v1"',
              'alt="شعار منصة الصحة النفسية وذوي الاحتياجات الخاصة"',
          )
          for fragment in required:
              assert fragment in html, fragment
          assert 'https://khaledaltheeb.github.io/pterminology-site' not in html
          parser=Parser(); parser.feed(html)
          assert len(parser.headings) <= 20, parser.headings
          assert len(parser.headings) == len(set(parser.headings)), parser.headings
          assert not parser.missing_alt, parser.missing_alt
          assert parser.external_links >= 3, parser.external_links
          print({'headings':len(parser.headings),'missing_alt':0,'external_links':parser.external_links})
          PY

      - name: Discover latest validated production artifact
        id: artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsS \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=validated-production-site&per_page=100" \
            -o /tmp/artifacts.json
          python - <<'PY'
          import json, os
          data=json.load(open('/tmp/artifacts.json',encoding='utf-8'))
          items=[item for item in data.get('artifacts',[]) if not item.get('expired') and item.get('workflow_run',{}).get('id')]
          if not items:
              raise SystemExit('No active validated-production-site artifact found')
          item=sorted(items,key=lambda value:value.get('created_at',''),reverse=True)[0]
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as output:
              output.write(f"run_id={item['workflow_run']['id']}\n")
              output.write(f"artifact_id={item['id']}\n")
          print({'run_id':item['workflow_run']['id'],'artifact_id':item['id'],'created_at':item.get('created_at')})
          PY

      - name: Download validated production artifact
        uses: actions/download-artifact@v4
        with:
          name: validated-production-site
          path: _site
          repository: khaledaltheeb/healthrenewal.org
          run-id: ${{ steps.artifact.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Overlay current canonical public surface
        run: |
          set -euxo pipefail
          test -f _site/index.html
          test -f _site/deployment.json
          python - <<'PY'
          from __future__ import annotations

          import shutil
          from html.parser import HTMLParser
          from pathlib import Path

          root=Path('.')
          site=Path('_site')
          old='https://khaledaltheeb.github.io/pterminology-site'
          new='https://healthrenewal.org'
          text_suffixes={'.html','.htm','.xml','.json','.webmanifest','.txt','.js','.mjs','.css','.svg'}
          copy_suffixes=set(text_suffixes)
          skip_top={'.git','.github','node_modules','.venv','venv','dist','build','scripts','tests','docs','reports','content','.v10bundle','.generator-v6','_site'}
          skip_parts={'account-backend','backend','migrations'}
          copied=[]

          for source in root.rglob('*'):
              if not source.is_file():
                  continue
              relative=source.relative_to(root)
              if not relative.parts or relative.parts[0] in skip_top:
                  continue
              if any(part in skip_parts for part in relative.parts):
                  continue
              if relative.as_posix() == 'deployment.json':
                  continue
              if source.suffix.lower() not in copy_suffixes and source.name != 'CNAME':
                  continue
              destination=site/relative
              destination.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(source,destination)
              copied.append(relative.as_posix())

          normalized=[]
          legacy=[]
          for path in site.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in text_suffixes:
                  continue
              try:
                  text=path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              updated=text.replace(old,new)
              if updated != text:
                  path.write_text(updated,encoding='utf-8')
                  normalized.append(path.relative_to(site).as_posix())
              if old in updated:
                  legacy.append(path.relative_to(site).as_posix())

          if legacy:
              raise SystemExit('Legacy production origins remain: '+', '.join(legacy[:30]))
          if len(copied) < 100:
              raise SystemExit(f'Unexpectedly small canonical overlay: {len(copied)} files')

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__(); self.stack=[]; self.headings=[]; self.missing=[]; self.external=0
              def handle_starttag(self,tag,attrs):
                  values=dict(attrs)
                  if tag in {'h1','h2','h3','h4','h5','h6'}: self.stack.append([tag,[]])
                  if tag == 'img' and not values.get('alt','').strip(): self.missing.append(values.get('src','<unknown>'))
                  if tag == 'a' and values.get('href','').startswith(('https://','http://')): self.external += 1
              def handle_data(self,data):
                  if self.stack: self.stack[-1][1].append(data)
              def handle_endtag(self,tag):
                  if self.stack and self.stack[-1][0] == tag:
                      _,parts=self.stack.pop(); text=' '.join(''.join(parts).split())
                      if text: self.headings.append(text)

          home=(site/'index.html').read_text(encoding='utf-8')
          for fragment in (
              '<link rel="canonical" href="https://healthrenewal.org/">',
              '<link rel="alternate" hreflang="ar" href="https://healthrenewal.org/">',
              '<h1>منصة الصحة النفسية وذوي الاحتياجات الخاصة<br>',
              'data-seo-external-sources="v1"',
          ):
              assert fragment in home, fragment
          parser=Parser(); parser.feed(home)
          assert len(parser.headings) <= 20, parser.headings
          assert len(parser.headings) == len(set(parser.headings)), parser.headings
          assert not parser.missing, parser.missing
          assert parser.external >= 3, parser.external

          robots=(site/'robots.txt').read_text(encoding='utf-8')
          assert robots.count('Sitemap: https://healthrenewal.org/sitemap.xml') == 1, robots
          assert robots.count('Sitemap: https://healthrenewal.org/sitemap-index.xml') == 1, robots
          sitemap=(site/'sitemap-index.xml').read_text(encoding='utf-8')
          assert '<loc>https://healthrenewal.org/' in sitemap
          assert old not in sitemap
          print({'copied':len(copied),'normalized':len(normalized),'headings':len(parser.headings),'external_links':parser.external})
          PY
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload canonical Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy canonical Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify canonical SEO on live domain
        env:
          SOURCE_RUN_ID: ${{ steps.artifact.outputs.run_id }}
        run: |
          set -euo pipefail
          ready=false
          for attempt in {1..60}; do
            nonce="${GITHUB_RUN_ID}-${attempt}-$(date +%s%N)"
            home_code="$(curl -sS -L -o /tmp/home.html -w '%{http_code}' "https://healthrenewal.org/?seo_probe=${nonce}" || true)"
            robots_code="$(curl -sS -L -o /tmp/robots.txt -w '%{http_code}' "https://healthrenewal.org/robots.txt?seo_probe=${nonce}" || true)"
            sitemap_code="$(curl -sS -L -o /tmp/sitemap-index.xml -w '%{http_code}' "https://healthrenewal.org/sitemap-index.xml?seo_probe=${nonce}" || true)"
            if [[ "${home_code}" == "200" && "${robots_code}" == "200" && "${sitemap_code}" == "200" ]] \
              && grep -q '<link rel="canonical" href="https://healthrenewal.org/">' /tmp/home.html \
              && grep -q '<link rel="alternate" hreflang="ar" href="https://healthrenewal.org/">' /tmp/home.html \
              && grep -q '<h1>منصة الصحة النفسية وذوي الاحتياجات الخاصة<br>' /tmp/home.html \
              && grep -q 'data-seo-external-sources="v1"' /tmp/home.html \
              && ! grep -q 'https://khaledaltheeb.github.io/pterminology-site' /tmp/home.html \
              && grep -q 'Sitemap: https://healthrenewal.org/sitemap.xml' /tmp/robots.txt \
              && grep -q 'Sitemap: https://healthrenewal.org/sitemap-index.xml' /tmp/robots.txt \
              && grep -q '<loc>https://healthrenewal.org/' /tmp/sitemap-index.xml \
              && ! grep -q 'khaledaltheeb.github.io/pterminology-site' /tmp/sitemap-index.xml; then
              if python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__(); self.stack=[]; self.headings=[]; self.missing=[]; self.external=0
              def handle_starttag(self,tag,attrs):
                  values=dict(attrs)
                  if tag in {'h1','h2','h3','h4','h5','h6'}: self.stack.append([tag,[]])
                  if tag == 'img' and not values.get('alt','').strip(): self.missing.append(values.get('src','<unknown>'))
                  if tag == 'a' and values.get('href','').startswith(('https://','http://')): self.external += 1
              def handle_data(self,data):
                  if self.stack: self.stack[-1][1].append(data)
              def handle_endtag(self,tag):
                  if self.stack and self.stack[-1][0] == tag:
                      _,parts=self.stack.pop(); text=' '.join(''.join(parts).split())
                      if text: self.headings.append(text)

          parser=Parser(); parser.feed(Path('/tmp/home.html').read_text(encoding='utf-8'))
          assert len(parser.headings) <= 20, parser.headings
          assert len(parser.headings) == len(set(parser.headings)), parser.headings
          assert not parser.missing, parser.missing
          assert parser.external >= 3, parser.external
          print({'live_headings':len(parser.headings),'duplicate_headings':0,'missing_alt':0,'external_links':parser.external})
          PY
              then ready=true; break; fi
            fi
            sleep 5
          done
          [[ "${ready}" == "true" ]] || { echo "::error::Canonical SEO surface did not become live"; exit 1; }

          mkdir -p reports
          python - <<'PY'
          import hashlib, json, os
          from datetime import datetime, timezone
          files={'homepage':'/tmp/home.html','robots':'/tmp/robots.txt','sitemap_index':'/tmp/sitemap-index.xml'}
          report={
            'schema_version':1,
            'checked_at':datetime.now(timezone.utc).isoformat(),
            'release':'canonical-seo-v363',
            'workflow_run_id':os.environ['GITHUB_RUN_ID'],
            'source_artifact_run_id':os.environ.get('SOURCE_RUN_ID'),
            'canonical_domain':'https://healthrenewal.org/',
            'self_referential_hreflang':True,
            'homepage_heading_count_at_most_20':True,
            'duplicate_homepage_headings':0,
            'homepage_images_without_alt':0,
            'authoritative_external_links_at_least_3':True,
            'legacy_project_origin_present':False,
            'robots_open':True,
            'canonical_sitemaps_registered':True,
            'files':{name:{'http_status':200,'sha256':hashlib.sha256(open(path,'rb').read()).hexdigest()} for name,path in files.items()},
            'passed':True,
          }
          open('reports/canonical-seo-pages-v363.json','w',encoding='utf-8').write(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY

      - name: Commit live verification receipt
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/canonical-seo-pages-v363.json
          git commit -m "chore: record canonical SEO live verification [skip ci]" || exit 0
          for attempt in {1..5}; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            sleep $((attempt*3))
          done
          echo "::error::Could not publish canonical SEO verification receipt"
          exit 1
