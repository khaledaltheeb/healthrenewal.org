name: Patch v31 production concurrency once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-v31-concurrency-once.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Cancel stale v31 runs
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          current = int(os.environ['GITHUB_RUN_ID'])
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'v31-concurrency-repair',
          }

          url = f'https://api.github.com/repos/{repo}/actions/workflows/validate-all-labs-v22.yml/runs?branch=main&per_page=100'
          request = urllib.request.Request(url, headers=headers)
          with urllib.request.urlopen(request, timeout=30) as response:
              runs = json.loads(response.read().decode('utf-8')).get('workflow_runs', [])

          cancelled = []
          for run in runs:
              if run.get('status') not in {'queued', 'in_progress', 'waiting', 'requested', 'pending'}:
                  continue
              run_id = int(run['id'])
              if run_id == current:
                  continue
              cancel = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/actions/runs/{run_id}/cancel',
                  headers=headers,
                  method='POST',
              )
              try:
                  with urllib.request.urlopen(cancel, timeout=30) as response:
                      response.read()
                  cancelled.append(run_id)
              except Exception as exc:
                  print({'run_id': run_id, 'cancel_error': str(exc)})
          print({'cancelled_v31_runs': cancelled, 'count': len(cancelled)})
          PY

      - name: Add concurrency and remove one-time workflow
        run: |
          python - <<'PY'
          from pathlib import Path

          target = Path('.github/workflows/validate-all-labs-v22.yml')
          text = target.read_text(encoding='utf-8')
          marker = 'concurrency:\n  group: validate-all-labs-v31-${{ github.ref }}\n  cancel-in-progress: true\n'
          if marker not in text:
              anchor = 'env:\n  SITE_BASE: https://healthrenewal.org/\n\njobs:\n'
              replacement = 'env:\n  SITE_BASE: https://healthrenewal.org/\n\n' + marker + '\njobs:\n'
              if anchor not in text:
                  raise SystemExit('v31 workflow anchor is missing')
              text = text.replace(anchor, replacement, 1)
              target.write_text(text, encoding='utf-8')

          Path('.github/workflows/patch-v31-concurrency-once.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/validate-all-labs-v22.yml .github/workflows/patch-v31-concurrency-once.yml
          git commit -m "ci: serialize validated production builds v31"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
