name: Validate institutional tips section v234

on:
  pull_request:
    branches: [main]
    paths:
      - "content/v234/**"
      - "scripts/publish_tips_hub_v234.py"
      - "scripts/verify_tips_v234.py"
      - "scripts/enforce_platform_identity_v201.py"
      - "tests/test_tips_v234.py"
      - ".github/workflows/validate-tips-v234.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tips-v234-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate source files
        run: |
          set -euxo pipefail
          python -m py_compile \
            scripts/publish_tips_hub_v234.py \
            scripts/verify_tips_v234.py \
            scripts/enforce_platform_identity_v201.py \
            tests/test_tips_v234.py
          python -m json.tool content/v234/tips-guides-supplement-ar.json >/dev/null
          python -m json.tool content/v234/sources-ar.json >/dev/null

      - name: Capture related platform contracts
        shell: bash
        run: |
          {
            echo '=== WORKFLOW STEP ==='
            grep -R -n -B 14 -A 14 'Test partners transparency hub' .github/workflows || true
            echo '=== PARTNERS TEST REFERENCES ==='
            grep -R -n -E 'partners|الشركاء' tests scripts | head -n 400 || true
            echo '=== CORE BUILD MARKERS ==='
            grep -R -n -E 'core-sections-v15|complete_core_sections_v15|enforce_platform_identity_v201' .github/workflows scripts tests | head -n 400 || true
          } > tips-v234-platform-contracts.log
          cat tips-v234-platform-contracts.log

      - name: Build and audit all tips pages twice
        id: tips_tests
        shell: bash
        run: |
          set +e
          python -m unittest -v tests.test_tips_v234 > tips-v234-test.log 2>&1
          status=$?
          cat tips-v234-test.log
          if [ "$status" -ne 0 ]; then
            echo "::group::Failure tail"
            tail -n 160 tips-v234-test.log
            echo "::endgroup::"
          fi
          exit "$status"

      - name: Upload tips diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tips-v234-diagnostics
          path: |
            tips-v234-test.log
            tips-v234-platform-contracts.log
          if-no-files-found: error
          retention-days: 7

      - name: Verify production integration marker
        run: |
          grep -q 'publish_tips_hub_v234.py' scripts/enforce_platform_identity_v201.py
          grep -q 'verify_tips_v234.py' scripts/enforce_platform_identity_v201.py
          grep -q 'tips_v234_verification' scripts/enforce_platform_identity_v201.py
