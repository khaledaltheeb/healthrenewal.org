name: Validate institutional tips section v234

on:
  pull_request:
    branches: [main]
    paths:
      - "content/v234/**"
      - "content/v15/tips-details-v15.json"
      - "scripts/publish_tips_hub_v234.py"
      - "scripts/verify_tips_v234.py"
      - "scripts/publish_content_catalog_v219.py"
      - "scripts/enforce_platform_identity_v201.py"
      - "tests/test_tips_v234.py"
      - "tests/test_tips_catalog_hook_v234.py"
      - ".github/workflows/validate-tips-v234.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tips-v234-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate source files
        run: |
          set -euxo pipefail
          python -m py_compile \
            scripts/publish_tips_hub_v234.py \
            scripts/verify_tips_v234.py \
            scripts/publish_content_catalog_v219.py \
            scripts/enforce_platform_identity_v201.py \
            tests/test_tips_v234.py \
            tests/test_tips_catalog_hook_v234.py
          python -m json.tool content/v234/tips-guides-supplement-ar.json >/dev/null
          python -m json.tool content/v234/sources-ar.json >/dev/null
          python -m json.tool content/v15/tips-details-v15.json >/dev/null

      - name: Capture related platform contracts
        shell: bash
        run: |
          {
            echo '=== PRODUCTION CATALOG HOOK ==='
            grep -R -n -E 'publish_tips_hub_v234|verify_tips_v234|core-sections-v15|homepage-v20' \
              scripts/publish_content_catalog_v219.py \
              scripts/enforce_platform_identity_v201.py \
              tests/test_tips_v234.py \
              tests/test_tips_catalog_hook_v234.py || true
            echo '=== KNOWN PARTNERS BASELINE ==='
            grep -R -n -E 'partners|الشركاء' tests/test_partners_v201.py scripts/publish_partners_v201.py || true
          } > tips-v234-platform-contracts.log
          cat tips-v234-platform-contracts.log

      - name: Run identity regression fixture
        shell: bash
        run: |
          python -m unittest -v tests.test_platform_identity_v201 \
            > tips-v234-identity-test.log 2>&1
          cat tips-v234-identity-test.log

      - name: Capture known baseline partners fixture
        continue-on-error: true
        shell: bash
        run: |
          python -m unittest -v tests.test_partners_v201 \
            > tips-v234-partners-baseline.log 2>&1
          status=$?
          cat tips-v234-partners-baseline.log
          exit "$status"

      - name: Build, hook, and audit all tips pages
        id: tips_tests
        shell: bash
        run: |
          set +e
          python -m unittest -v \
            tests.test_tips_v234 \
            tests.test_tips_catalog_hook_v234 > tips-v234-test.log 2>&1
          status=$?
          cat tips-v234-test.log
          if [ "$status" -ne 0 ]; then
            echo "::group::Failure tail"
            tail -n 200 tips-v234-test.log
            echo "::endgroup::"
          fi
          exit "$status"

      - name: Upload tips diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tips-v234-diagnostics
          path: |
            tips-v234-test.log
            tips-v234-identity-test.log
            tips-v234-partners-baseline.log
            tips-v234-platform-contracts.log
          if-no-files-found: error
          retention-days: 7

      - name: Verify production integration marker
        run: |
          grep -q 'publish_tips_hub_v234.py' scripts/publish_content_catalog_v219.py
          grep -q 'verify_tips_v234.py' scripts/publish_content_catalog_v219.py
          grep -q 'core-sections-v15.json' scripts/publish_content_catalog_v219.py
          grep -q 'homepage-v20.json' scripts/publish_content_catalog_v219.py
          grep -q 'tips_v234_verification' scripts/publish_content_catalog_v219.py
