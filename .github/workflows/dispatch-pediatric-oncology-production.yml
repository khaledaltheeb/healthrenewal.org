name: Dispatch pediatric oncology production

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  dispatch:
    if: github.actor == 'khaledaltheeb' && github.event.issue.pull_request && github.event.comment.body == '/deploy-pediatric-oncology'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch validated production workflow on main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          gh workflow run deploy-production-v3.yml --repo "$GH_REPO" --ref main
          gh issue comment "$ISSUE_NUMBER" --repo "$GH_REPO" --body "deploy-dispatch: accepted on main at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
