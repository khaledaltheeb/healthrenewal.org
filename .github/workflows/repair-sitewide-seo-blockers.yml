name: Repair sitewide SEO blockers

on:
  push:
    branches:
      - agent/fix-sitewide-seo-blockers
    paths:
      - scripts/repair_sitewide_seo_blockers.py
      - scripts/enforce_sitewide_heading_intent_v2.py
      - tests/test_heading_intent_non_html_assets.py
      - .github/workflows/repair-sitewide-seo-blockers.yml

permissions:
  contents: write

jobs:
  repair-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Patch heading auditor for image-only sitemap entries
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/enforce_sitewide_heading_intent_v2.py')
          source = path.read_text(encoding='utf-8')
          old = '''        if resolved is None:
              unsupported.append(url)
              continue
          path, route = resolved
          '''
          new = '''        if resolved is None:
              suffix = Path(urlparse(url).path).suffix.lower()
              if suffix in {".png", ".jpg", ".jpeg", ".webp", ".gif", ".svg", ".avif", ".ico"}:
                  continue
              unsupported.append(url)
              continue
          path, route = resolved
          '''
          if old in source:
              source = source.replace(old, new, 1)
              path.write_text(source, encoding='utf-8')
          elif new not in source:
              raise SystemExit('Heading auditor target block changed unexpectedly; refusing blind patch')
          PY

      - name: Compile deterministic repair and regression test
        run: |
          python -m py_compile \
            scripts/repair_sitewide_seo_blockers.py \
            scripts/audit_seo_intent_v1.py \
            scripts/publish_care_guides_v246.py \
            scripts/enforce_sitewide_heading_intent_v2.py \
            tests/test_heading_intent_non_html_assets.py
          python -m unittest tests.test_heading_intent_non_html_assets -v

      - name: Materialize missing guide and repair SEO contracts
        run: python scripts/repair_sitewide_seo_blockers.py

      - name: Prove full search-intent and heading contracts
        run: |
          set -euo pipefail
          python scripts/audit_seo_intent_v1.py --scope all --strict --report /tmp/seo-intent-all-after-repair.json
          python scripts/enforce_sitewide_heading_intent_v2.py --check --report /tmp/sitewide-heading-intent-v2-after-repair.json
          python - <<'PY'
          import json
          from pathlib import Path
          seo=json.loads(Path('/tmp/seo-intent-all-after-repair.json').read_text(encoding='utf-8'))
          heading=json.loads(Path('/tmp/sitewide-heading-intent-v2-after-repair.json').read_text(encoding='utf-8'))
          summary=seo['summary']
          assert summary['errors']==0, summary
          assert summary['failed']==0, summary
          assert heading['summary']['changed']==0, heading['summary']
          assert heading['summary']['failed']==0, heading['summary']
          assert heading['summary']['indexable']==813, heading['summary']
          assert heading.get('unsupported_urls') == [], heading.get('unsupported_urls')
          print({'seo':summary,'heading':heading['summary']})
          PY

      - name: Commit only validated source repairs
        run: |
          set -euo pipefail
          git config user.name "Rawafid SEO Repair"
          git config user.email "actions@users.noreply.github.com"
          git add \
            scripts/enforce_sitewide_heading_intent_v2.py \
            care-guides/adhd-family-practical-guide/index.html \
            learning-paths/all-pages/index.html \
            sectors/all-pages/index.html \
            special-needs/all-pages/index.html \
            evidence-guides/aac-home-school-guide/index.html \
            evidence-guides/inclusive-digital-safety-and-exploitation-prevention-guide/index.html \
            evidence-guides/inclusive-toileting-personal-care-guide/index.html \
            evidence-guides/puberty-body-safety-inclusive-guide/index.html \
            guides/accessible-travel-planning/index.html \
            special-needs/guides/communication/index.html
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "fix(seo): satisfy sitewide search and heading intent contracts"
          git push origin HEAD:agent/fix-sitewide-seo-blockers

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sitewide-seo-blocker-repair-${{ github.run_id }}
          path: |
            /tmp/seo-intent-all-after-repair.json
            /tmp/sitewide-heading-intent-v2-after-repair.json
          if-no-files-found: ignore
          retention-days: 30
