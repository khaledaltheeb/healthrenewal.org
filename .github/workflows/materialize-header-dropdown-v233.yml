name: Materialize header dropdown v233

on:
  push:
    branches: ["agent/header-dropdown-v233-clean"]
    paths:
      - "scripts/publish_institutional_header_v233.py"
      - "tests/test_institutional_header_v233.py"
      - ".github/workflows/materialize-header-dropdown-v233.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-header-dropdown-v233
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/header-dropdown-v233-clean
          fetch-depth: 0

      - name: Test deterministic publisher
        run: |
          set -euxo pipefail
          python -m py_compile scripts/publish_institutional_header_v233.py tests/test_institutional_header_v233.py
          python -m unittest -v tests/test_institutional_header_v233.py

      - name: Materialize header and preserve discovery contracts
        run: |
          set -euxo pipefail
          python scripts/publish_institutional_header_v233.py .
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = '<li data-daily-tools-journey-v219><strong>لأداة تفاعلية محلية:</strong> استخدم الأدوات اليومية أو مسار التعلم المناسب.</li>'
          new = '<li data-daily-tools-journey-v219><strong>لأداة تفاعلية محلية:</strong> استخدم <a href="daily-tools/">الأدوات اليومية</a> أو <a href="learning-paths/">مسار التعلم المناسب</a>.</li>'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Daily-tools journey anchor is missing or ambiguous')
          path.write_text(text, encoding='utf-8')
          PY
          python scripts/verify_homepage_v19.py
          python scripts/verify_homepage_release_contract_v230.py index.html --report /tmp/homepage-release-v230.json
          python - <<'PY'
          import json
          from pathlib import Path

          page = Path('index.html').read_text(encoding='utf-8')
          report = json.loads(Path('api/institutional-header-v233.json').read_text(encoding='utf-8'))
          assert report['status'] == 'passed', report
          assert report['section_links'] == 12, report
          assert report['language_links'] == 3, report
          assert report['dropdowns'] == 2, report
          assert page.count('data-institutional-header-v233') == 1
          assert page.count('data-i18n-switcher-v72') == 1
          assert page.count('id="institutional-header-v233-styles"') == 1
          assert page.count('<details') == 2
          assert page.count('<summary') == 2
          assert page.count('href="daily-tools/"') >= 3
          assert page.count('href="learning-paths/"') >= 3
          assert '<nav class="nav"' not in page
          print(report)
          PY
          rm -f api/institutional-header-v233.json

      - name: Commit materialized source
        run: |
          set -euxo pipefail
          if git diff --quiet -- index.html; then
            echo "Homepage source already contains header v233"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "تطبيق قوائم الهيدر المؤسسية على الصفحة الرئيسية v233"
          git push origin HEAD:agent/header-dropdown-v233-clean
