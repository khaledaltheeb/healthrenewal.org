name: Temporary failed job log extractor

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  extract:
    if: github.event.issue.title == '[diagnostic] extract failed production job 2026-07-31'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      JOB_ID: '91227832598'
    steps:
      - name: Download and filter failed job log
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-delay 2 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/${JOB_ID}/logs" \
            -o /tmp/job-log-download

          file /tmp/job-log-download | tee /tmp/file-type.txt
          if unzip -t /tmp/job-log-download >/dev/null 2>&1; then
            mkdir -p /tmp/job-unpacked
            unzip -q /tmp/job-log-download -d /tmp/job-unpacked
            find /tmp/job-unpacked -type f -print0 | sort -z | xargs -0 cat > /tmp/job.log
          else
            cp /tmp/job-log-download /tmp/job.log
          fi

          python3 - <<'PY' > /tmp/report.txt
          from pathlib import Path
          import re

          path=Path('/tmp/job.log')
          raw=path.read_text(encoding='utf-8',errors='replace')
          lines=raw.splitlines()
          patterns=(
              r'##\[error\]', r'Traceback \(most recent call last\)', r'AssertionError',
              r'SystemExit', r'ValueError', r'FileNotFoundError', r'RuntimeError',
              r'ERROR', r'Error:', r'FAILED', r'failed', r'Process completed with exit code',
              r'Finish exact production output', r'publish_', r'audit_', r'verify_',
          )
          rx=re.compile('|'.join(patterns),re.I)
          hits=[]
          for i,line in enumerate(lines):
              if rx.search(line):
                  start=max(0,i-5); end=min(len(lines),i+12)
                  block='\n'.join(f'{j+1}: {lines[j]}' for j in range(start,end))
                  hits.append(block)
          dedup=[]; seen=set()
          for block in hits:
              key=block[:500]
              if key not in seen:
                  seen.add(key); dedup.append(block)
          print(f'log_bytes={path.stat().st_size}')
          print(f'log_lines={len(lines)}')
          print(f'matched_blocks={len(dedup)}')
          print('\n=== MATCHED FAILURE CONTEXT ===')
          for block in dedup[-40:]:
              print(block)
              print('---')
          print('\n=== LAST 350 LINES ===')
          start=max(0,len(lines)-350)
          for j in range(start,len(lines)):
              print(f'{j+1}: {lines[j]}')
          PY

      - name: Publish extracted failure
        if: always()
        shell: bash
        run: |
          python3 - <<'PY' > /tmp/body.json
          import json
          from pathlib import Path
          report=Path('/tmp/report.txt').read_text(errors='replace') if Path('/tmp/report.txt').exists() else 'No extracted report.'
          ftype=Path('/tmp/file-type.txt').read_text(errors='replace') if Path('/tmp/file-type.txt').exists() else ''
          body='## Extracted failed production job log\n\n```text\n'+ftype+'\n'+report[-60000:]+'\n```'
          print(json.dumps({'body':body}))
          PY
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            --data-binary @/tmp/body.json
