name: Deploy specialist identity v10 production

on:
  push:
    branches: ["main"]
    paths:
      - "specialists-partners/account-backend/src/index.js"
      - "specialists-partners/account-backend/src/index-v8.js"
      - "specialists-partners/account-backend/src/index-v10.js"
      - "specialists-partners/account-backend/src/index-v10-final.js"
      - "specialists-partners/account-backend/src/index-v10-production.js"
      - "specialists-partners/account/**"
      - "specialists-partners/admin/**"
      - "specialists-partners/recover/**"
      - "specialists-partners/password-reset/**"
      - "specialists-partners/assets/runtime-config.js"
      - "specialists-partners/backend/migrations/**"
      - "scripts/verify_specialist_identity_v10_production.py"
      - "tests/test_specialist_accounts_v5.py"
      - "tests/test_specialist_identity_v6.py"
      - "tests/test_specialist_identity_v10.py"
      - "tests/test_specialist_turnstile_persistence.py"
      - ".github/workflows/deploy-specialist-identity-v10-production.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: specialist-identity-v10-production
  cancel-in-progress: false

env:
  ACCOUNT_API_BASE: https://pterminology-specialist-accounts.pterminology-826ac349.workers.dev
  CORE_API_BASE: https://pterminology-specialists.pterminology-826ac349.workers.dev
  DATABASE_NAME: pterminology-specialists
  IDENTITY_WORKER_NAME: pterminology-specialist-accounts

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '826ac34927c1e045c06145a327c2ac52' }}
      PREFERRED_D1_DATABASE_ID: ${{ secrets.SPECIALISTS_D1_DATABASE_ID }}
      ADMIN_API_KEY: ${{ secrets.SPECIALISTS_ADMIN_API_KEY }}
      FROM_EMAIL: "PTerminology <no-reply@healthrenewal.org>"
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RATE_LIMIT_SALT: ${{ secrets.SPECIALISTS_RATE_LIMIT_SALT }}
      PASSWORD_PEPPER: ${{ secrets.SPECIALISTS_PASSWORD_PEPPER }}
      REVIEWER_API_KEY: ${{ secrets.SPECIALISTS_REVIEWER_API_KEY }}
      MODERATOR_API_KEY: ${{ secrets.SPECIALISTS_MODERATOR_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Revalidate release source
        run: |
          set -euo pipefail
          node --check specialists-partners/account-backend/src/index.js
          node --check specialists-partners/account-backend/src/index-v8.js
          node --check specialists-partners/account-backend/src/index-v10.js
          node --check specialists-partners/account-backend/src/index-v10-final.js
          node --check specialists-partners/account-backend/src/index-v10-production.js
          node --check specialists-partners/admin/admin.js
          node --check specialists-partners/admin/admin-recovery-v10-final.js
          node --check specialists-partners/admin/admin-provider-status-v10.js
          node --check specialists-partners/recover/recover.js
          node --check specialists-partners/password-reset/reset-v10.js
          python -m py_compile scripts/verify_specialist_identity_v10_production.py
          python -m unittest -v \
            tests.test_specialist_accounts_v5 \
            tests.test_specialist_identity_v6 \
            tests.test_specialist_recovery_v8 \
            tests.test_specialist_identity_v10 \
            tests.test_specialist_turnstile_persistence

      - name: Validate Cloudflare access, required Worker secrets, and D1
        id: resources
        shell: bash
        run: |
          set -euo pipefail
          required=(CLOUDFLARE_API_TOKEN ADMIN_API_KEY FROM_EMAIL)
          for name in "${required[@]}"; do
            [[ -n "${!name:-}" ]] || { echo "::error::$name is required"; exit 1; }
          done
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/tokens/verify" \
            | python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("success") and d.get("result",{}).get("status")=="active", d'

          curl -fsS "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${IDENTITY_WORKER_NAME}/secrets" \
            -o /tmp/identity-worker-secrets.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/identity-worker-secrets.json',encoding='utf-8'))
          assert data.get('success') is True, data
          names={str(item.get('name') or '') for item in (data.get('result') or [])}
          required={'TURNSTILE_SECRET','RESEND_API_KEY','ADMIN_API_KEY','RATE_LIMIT_SALT'}
          missing=sorted(required-names)
          if missing:
              raise SystemExit('Missing required Worker secret names: '+', '.join(missing))
          print({'required_secret_names_verified':sorted(required)})
          PY

          if [[ -n "${PREFERRED_D1_DATABASE_ID:-}" ]]; then
            database_id="${PREFERRED_D1_DATABASE_ID}"
          else
            curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database?per_page=100" -o /tmp/d1.json
            database_id="$(python - <<'PY'
          import json, os
          data=json.load(open('/tmp/d1.json',encoding='utf-8'))
          matches=[item for item in data.get('result',[]) if item.get('name')==os.environ['DATABASE_NAME']]
          if not matches or not matches[0].get('uuid'):
              raise SystemExit('D1 database not found')
          print(matches[0]['uuid'])
          PY
          )"
          fi
          [[ -n "${database_id}" ]] || { echo "::error::D1 database id missing"; exit 1; }
          echo "database_id=${database_id}" >> "$GITHUB_OUTPUT"

      - name: Generate production Worker configuration
        working-directory: specialists-partners/account-backend
        env:
          D1_DATABASE_ID: ${{ steps.resources.outputs.database_id }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          def q(value): return '"' + str(value).replace('\\','\\\\').replace('"','\\"') + '"'
          content=f'''name = "pterminology-specialist-accounts"
          main = "src/index-v10-production.js"
          compatibility_date = "2026-07-01"
          workers_dev = true

          [vars]
          ALLOWED_ORIGINS = "https://healthrenewal.org,https://healthrenewal.org,https://www.healthrenewal.org"
          ACCOUNT_BASE_URL = "https://healthrenewal.org/specialists-partners/account/"
          ADMIN_BASE_URL = "https://healthrenewal.org/specialists-partners/admin/"
          PASSWORD_RESET_BASE_URL = "https://healthrenewal.org/specialists-partners/password-reset/"
          PORTAL_BASE_URL = "https://healthrenewal.org/specialists-partners/portal/"
          CORE_API_BASE = "{os.environ['CORE_API_BASE']}"
          TURNSTILE_EXPECTED_HOSTNAMES = "khaledaltheeb.github.io,healthrenewal.org,www.healthrenewal.org"
          IDENTITY_SESSION_HOURS = "12"
          SESSION_BIND_IP = "off"
          OWNER_EMAIL = "pterminology@gmail.com"
          OWNER_PHONE = "+962795945817"
          OWNER_DISPLAY_NAME_AR = "خالد الذيب"
          OWNER_DISPLAY_NAME_EN = "Khaled Altheeb"
          FROM_EMAIL = {q(os.environ['FROM_EMAIL'])}

          [[d1_databases]]
          binding = "DB"
          database_name = "pterminology-specialists"
          database_id = {q(os.environ['D1_DATABASE_ID'])}
          migrations_dir = "../backend/migrations"

          [triggers]
          crons = ["31 2 * * *"]
          '''
          Path('wrangler-v10-production.toml').write_text(content,encoding='utf-8')
          PY
          chmod 600 wrangler-v10-production.toml

      - name: Apply D1 migrations
        working-directory: specialists-partners/account-backend
        run: npx --yes wrangler@4 d1 migrations apply pterminology-specialists --remote --config wrangler-v10-production.toml

      - name: Deploy identity Worker without replacing existing secrets
        working-directory: specialists-partners/account-backend
        run: npx --yes wrangler@4 deploy --config wrangler-v10-production.toml --minify --keep-vars

      - name: Persist verified sender as Worker secret
        working-directory: specialists-partners/account-backend
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "${FROM_EMAIL}" | npx --yes wrangler@4 secret put FROM_EMAIL --name "${IDENTITY_WORKER_NAME}"

      - name: Ensure the production workers.dev route is enabled
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS \
            -X POST \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"enabled":true,"previews_enabled":true}' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/pterminology-specialist-accounts/subdomain" \
            -o /tmp/identity-worker-subdomain.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/identity-worker-subdomain.json',encoding='utf-8'))
          assert data.get('success') is True, data
          result=data.get('result') or {}
          assert result.get('enabled') is True, result
          PY

      - name: Verify stable production propagation and protected deep health
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          echo "Deep health must not be public; all three contracts must pass in the same cycle."
          python scripts/verify_specialist_identity_v10_production.py

      - name: Record safe production report
        env:
          DEEP_STATUS: ${{ steps.verify.outputs.deep_status }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          normal=json.load(open('/tmp/identity-health.json',encoding='utf-8'))
          deep=json.load(open('/tmp/identity-deep-health.json',encoding='utf-8'))
          provider=deep.get('emailProvider') or {}
          capabilities=deep.get('capabilities') or normal.get('capabilities') or {}
          sender_ready=provider.get('senderReady') is True
          recovery_email_ready=capabilities.get('passwordRecoveryEmail') is True
          fully_operational=(
              normal.get('ok') is True
              and provider.get('authValid') is True
              and sender_ready
              and recovery_email_ready
          )
          report={
            'schema_version':1,
            'checked_at':datetime.now(timezone.utc).isoformat(),
            'workflow_run_id':os.environ['GITHUB_RUN_ID'],
            'worker':{'http_status':200,'ok':normal.get('ok') is True,'version':normal.get('version'),'checks':normal.get('checks') or {}},
            'email_provider':{'http_status':int(os.environ.get('DEEP_STATUS') or 0),'configured':provider.get('configured'),'auth_valid':provider.get('authValid'),'access':provider.get('access'),'code':provider.get('code'),'sender_ready':sender_ready,'sender_code':provider.get('senderCode'),'sender_domain':provider.get('senderDomain')},
            'deep_health_public':False,
            'stable_contract_cycles':3,
            'required_secret_names_verified':True,
            'deployment_replaced_secrets':False,
            'manual_recovery_available':bool((normal.get('capabilities') or {}).get('manualRecovery')),
            'password_recovery_email_ready':recovery_email_ready,
            'operational_mode':'full' if fully_operational else 'manual_recovery',
            'fully_operational':fully_operational,
          }
          open('reports/specialist-identity-v10-production.json','w',encoding='utf-8').write(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/specialist-identity-v10-production.json
          git commit -m "chore: record specialist identity v10 production [skip ci]" || exit 0
          for attempt in {1..5}; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            sleep $((attempt*3))
          done
          echo "::error::Could not publish safe production report"
          exit 1

      - name: Remove ephemeral deployment files
        if: always()
        working-directory: specialists-partners/account-backend
        run: rm -f wrangler-v10-production.toml
