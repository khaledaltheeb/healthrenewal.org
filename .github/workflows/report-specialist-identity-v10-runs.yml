name: Report specialist identity v10 workflow states

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/report-specialist-identity-v10-runs.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Read production and Pages workflow states
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports /tmp/specialist-v10-runs
          for workflow in \
            deploy-specialist-identity-v10-production.yml \
            deploy-specialist-recovery-pages-v8.yml; do
            curl -fsS \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?branch=main&per_page=5" \
              -o "/tmp/specialist-v10-runs/${workflow}.json"
          done
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          names=['deploy-specialist-identity-v10-production.yml','deploy-specialist-recovery-pages-v8.yml']
          workflows={}
          for name in names:
              data=json.loads((Path('/tmp/specialist-v10-runs')/(name+'.json')).read_text(encoding='utf-8'))
              workflows[name]=[
                  {
                    'id':run.get('id'),
                    'name':run.get('name'),
                    'status':run.get('status'),
                    'conclusion':run.get('conclusion'),
                    'event':run.get('event'),
                    'head_sha':run.get('head_sha'),
                    'created_at':run.get('created_at'),
                    'updated_at':run.get('updated_at'),
                    'html_url':run.get('html_url'),
                  }
                  for run in (data.get('workflow_runs') or [])
              ]
          report={'schema_version':1,'checked_at':datetime.now(timezone.utc).isoformat(),'workflows':workflows}
          Path('reports/specialist-identity-v10-runs.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - name: Commit safe workflow report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/specialist-identity-v10-runs.json
          git commit -m "chore: record specialist identity v10 workflow states [skip ci]" || exit 0
          for attempt in {1..5}; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            sleep $((attempt*3))
          done
          exit 1
