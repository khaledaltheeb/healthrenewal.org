name: Update specialist Turnstile domains

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/update-specialist-turnstile-domains.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-specialist-turnstile-domains
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '826ac34927c1e045c06145a327c2ac52' }}
  TURNSTILE_SITEKEY: 0x4AAAAAAD_r2o__Ao1RmBTO
  REQUIRED_HOSTNAME: healthrenewal.org

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read, merge, and update widget safely
        id: update
        shell: bash
        run: |
          set -u
          mkdir -p reports
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/challenges/widgets/${TURNSTILE_SITEKEY}"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")

          get_status="$(curl -sS -o /tmp/turnstile-widget-current.json -w '%{http_code}' "${auth[@]}" "$endpoint" || true)"
          export GET_STATUS="$get_status"

          python - <<'PY'
          import json, os
          from pathlib import Path

          source=Path('/tmp/turnstile-widget-current.json')
          try:
              data=json.loads(source.read_text(encoding='utf-8'))
          except Exception:
              data={}
          result=data.get('result') or {}
          existing=[str(item).strip().lower() for item in (result.get('domains') or []) if str(item).strip()]
          required=os.environ['REQUIRED_HOSTNAME'].strip().lower()
          domains=[]
          for item in [*existing, required]:
              if item and item not in domains:
                  domains.append(item)
          payload={
              'name':str(result.get('name') or 'Pterminology specialist identity'),
              'mode':str(result.get('mode') or 'managed'),
              'domains':domains,
          }
          for key in ('bot_fight_mode','offlabel','ephemeral_id'):
              if isinstance(result.get(key), bool):
                  payload[key]=result[key]
          clearance=result.get('clearance_level')
          if clearance in {'no_clearance','jschallenge','managed','interactive'}:
              payload['clearance_level']=clearance
          Path('/tmp/turnstile-widget-payload.json').write_text(json.dumps(payload),encoding='utf-8')
          Path('/tmp/turnstile-widget-payload.json').chmod(0o600)
          PY

          put_status="000"
          if [[ "$get_status" == "200" ]]; then
            put_status="$(curl -sS -o /tmp/turnstile-widget-updated.json -w '%{http_code}' \
              -X PUT "${auth[@]}" \
              --data-binary @/tmp/turnstile-widget-payload.json \
              "$endpoint" || true)"
          else
            printf '%s' '{}' > /tmp/turnstile-widget-updated.json
          fi
          export PUT_STATUS="$put_status"

          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          def load(path):
              try:
                  return json.loads(Path(path).read_text(encoding='utf-8'))
              except Exception:
                  return {}

          current=load('/tmp/turnstile-widget-current.json')
          updated=load('/tmp/turnstile-widget-updated.json')
          source=(updated.get('result') or {}) if updated.get('success') is True else (current.get('result') or {})
          domains=[str(item).strip().lower() for item in (source.get('domains') or []) if str(item).strip()]
          required=os.environ['REQUIRED_HOSTNAME'].strip().lower()
          passed=(
              os.environ.get('GET_STATUS')=='200'
              and os.environ.get('PUT_STATUS')=='200'
              and updated.get('success') is True
              and required in domains
          )
          errors=updated.get('errors') or current.get('errors') or []
          safe_errors=[
              {'code':item.get('code'),'message':str(item.get('message') or '')[:180]}
              for item in errors if isinstance(item,dict)
          ]
          report={
              'schema_version':1,
              'checked_at':datetime.now(timezone.utc).isoformat(),
              'workflow_run_id':os.environ['GITHUB_RUN_ID'],
              'status':'passed' if passed else 'blocked',
              'get_http_status':int(os.environ.get('GET_STATUS') or 0),
              'update_http_status':int(os.environ.get('PUT_STATUS') or 0),
              'required_hostname':required,
              'required_hostname_present':required in domains,
              'domains':domains,
              'mode':source.get('mode'),
              'widget_name':source.get('name'),
              'api_errors':safe_errors,
              'secret_rotated':False,
              'contains_secret_values':False,
          }
          Path('reports/specialist-turnstile-domains.json').write_text(
              json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8'
          )
          Path('/tmp/turnstile-update-passed').write_text('1' if passed else '0',encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False))
          PY

      - name: Publish safe domain report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/specialist-turnstile-domains.json
          git commit -m "chore: record specialist Turnstile domains [skip ci]" || true
          for attempt in {1..5}; do
            git pull --rebase origin main && git push origin HEAD:main && break
            git rebase --abort || true
            sleep $((attempt*3))
          done
          [[ "$(cat /tmp/turnstile-update-passed)" == "1" ]] || {
            echo "::error::Turnstile hostname update did not pass; inspect the safe report."
            exit 1
          }

      - name: Remove sensitive temporary responses
        if: always()
        run: |
          rm -f \
            /tmp/turnstile-widget-current.json \
            /tmp/turnstile-widget-updated.json \
            /tmp/turnstile-widget-payload.json \
            /tmp/turnstile-update-passed
