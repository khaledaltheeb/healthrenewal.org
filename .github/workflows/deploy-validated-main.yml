name: Deploy validated main to GitHub Pages

on:
  workflow_run:
    workflows: ["Audit production discovery contract v220"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: validated-github-pages-v242
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download discovery-audited production artifact
        uses: actions/download-artifact@v4
        with:
          name: validated-production-site
          path: validated-site
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify artifact integrity and export its authoritative SHA
        id: artifact
        env:
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
          TRIGGER_REPORTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euxo pipefail
          test -f validated-site/deployment.json
          python - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path

          root = Path('validated-site')
          data = json.loads((root / 'deployment.json').read_text(encoding='utf-8'))
          candidate = data.get('commit')
          assert data.get('schema_version') == 30, data
          assert isinstance(candidate, str) and re.fullmatch(r'[0-9a-f]{40}', candidate), data
          assert int(data.get('pwa_pages', 0)) > 0, data

          required = ('index.html', 'sitemap.xml', 'manifest.webmanifest', 'sw.js')
          assert set(data.get('artifacts', {})) == set(required), data
          for name in required:
              path = root / name
              assert path.is_file(), name
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              evidence = data['artifacts'][name]
              assert digest == evidence['sha256'], (name, digest, evidence)
              assert path.stat().st_size == evidence['bytes'], (name, path.stat().st_size, evidence)

          manifest = json.loads((root / 'manifest.webmanifest').read_text(encoding='utf-8'))
          assert manifest.get('scope') == '/', manifest
          assert manifest.get('start_url') == '/', manifest
          sw = (root / 'sw.js').read_text(encoding='utf-8')
          assert 'pterminology-v23-resilient-core' in sw
          assert 'Promise.allSettled' in sw and 'cached===0' in sw and 'cache.addAll' not in sw

          discovery = json.loads((root / 'api/orphan-page-audit-v197.json').read_text(encoding='utf-8'))
          assert discovery.get('version') == 220, discovery
          assert discovery.get('status') == 'passed', discovery
          for key in ('critical_orphans', 'critical_unmapped', 'missing_gateways', 'gateway_orphans', 'gateway_unmapped'):
              assert discovery.get(key) == [], (key, discovery.get(key))

          stroop = (root / 'cognitive-lab/stroop-basic/index.html').read_text(encoding='utf-8')
          runtime = (root / 'assets/js/lab-v12.js').read_text(encoding='utf-8')
          assert stroop.count('assets/js/lab-v12.js?v=213') == 1
          assert not re.search(r'assets/js/lab-v12\.js(?:["\'])', stroop)
          assert '"mode":"stroop_basic"' in stroop
          assert "mode==='stroop_basic'||mode==='stroop_advanced'" in runtime
          assert 'stimulusInk' in runtime and 'stimulusWord' in runtime
          palette = ('#b42318', '#175cd3', '#067647', '#b54708', '#6941c6', '#087e8b')
          assert all(color in runtime for color in palette)

          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as handle:
              handle.write(f'CANDIDATE_SHA={candidate}\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f'candidate_sha={candidate}\n')
          print({
              'artifact_commit': candidate,
              'trigger_run_id': os.environ.get('TRIGGER_RUN_ID'),
              'trigger_reported_head_sha': os.environ.get('TRIGGER_REPORTED_SHA'),
              'digests': len(required),
              'discovery': discovery['status'],
              'stroop_runtime': 'v213',
              'status': 'artifact-is-authoritative',
          })
          PY

      - name: Accept a validated main ancestor and prevent rollback
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIVE_URL: https://healthrenewal.org/deployment.json
        run: |
          set -euxo pipefail
          token="$(date +%s)"
          curl --retry 4 --retry-delay 3 -H 'Cache-Control: no-cache' -fsSL "${LIVE_URL}?v=${token}" -o /tmp/live-before.json || printf '{}\n' > /tmp/live-before.json
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path

          repo = os.environ['GITHUB_REPOSITORY']
          candidate = os.environ['CANDIDATE_SHA']
          token = os.environ['GH_TOKEN']
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'validated-pages-v242',
          }

          def api(path):
              request = urllib.request.Request(f'https://api.github.com/repos/{repo}{path}', headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.loads(response.read().decode('utf-8'))

          def compare(base, head):
              if base == head:
                  return 'identical'
              return api(f'/compare/{base}...{head}').get('status')

          current = api('/git/ref/heads/main')['object']['sha']
          candidate_to_current = compare(candidate, current)
          assert candidate_to_current in {'ahead', 'identical'}, {
              'reason': 'artifact commit must be current main or an ancestor of current main',
              'candidate_sha': candidate,
              'current_main_sha': current,
              'compare_status': candidate_to_current,
          }

          try:
              live = json.loads(Path('/tmp/live-before.json').read_text(encoding='utf-8')).get('commit')
          except Exception:
              live = None

          live_to_candidate = None
          if live:
              live_to_candidate = compare(live, candidate)
              assert live_to_candidate in {'ahead', 'identical'}, {
                  'reason': 'artifact commit must not roll production back',
                  'live_sha': live,
                  'candidate_sha': candidate,
                  'compare_status': live_to_candidate,
              }

          print({
              'candidate_sha': candidate,
              'current_main_sha': current,
              'candidate_to_current': candidate_to_current,
              'live_sha': live,
              'live_to_candidate': live_to_candidate,
              'status': 'safe-artifact-ancestor',
          })
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: validated-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live SHA exact digests discovery and Stroop v213
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          TRIGGER_REPORTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euxo pipefail
          BASE="${PAGE_URL%/}/"
          TOKEN="${CANDIDATE_SHA}"
          matched=0
          for i in $(seq 1 30); do
            if curl --retry 2 --retry-delay 2 -H 'Cache-Control: no-cache' -fsS "${BASE}deployment.json?v=${TOKEN}-${i}" -o /tmp/deployment.json; then
              if EXPECTED_SHA="${CANDIDATE_SHA}" python -c "import json,os; d=json.load(open('/tmp/deployment.json',encoding='utf-8')); raise SystemExit(0 if d.get('commit')==os.environ['EXPECTED_SHA'] else 1)"; then
                matched=1
                break
              fi
            fi
            sleep 10
          done
          test "${matched}" -eq 1

          curl --retry 3 --retry-delay 3 -H 'Cache-Control: no-cache' -fsS "${BASE}?v=${TOKEN}" -o /tmp/live-index.html
          curl --retry 3 --retry-delay 3 -H 'Cache-Control: no-cache' -fsS "${BASE}sitemap.xml?v=${TOKEN}" -o /tmp/live-sitemap.xml
          curl --retry 3 --retry-delay 3 -H 'Cache-Control: no-cache' -fsS "${BASE}manifest.webmanifest?v=${TOKEN}" -o /tmp/live-manifest.json
          curl --retry 3 --retry-delay 3 -H 'Cache-Control: no-cache' -fsS "${BASE}sw.js?v=${TOKEN}" -o /tmp/live-sw.js
          curl --retry 3 --retry-delay 3 -H 'Cache-Control: no-cache' -fsS "${BASE}api/orphan-page-audit-v197.json?v=${TOKEN}" -o /tmp/live-discovery.json
          curl --retry 3 --retry-delay 3 -H 'Cache-Control: no-cache' -fsS "${BASE}comparisons/?v=${TOKEN}" -o /tmp/live-comparisons.html
          curl --retry 3 --retry-delay 3 -H 'Cache-Control: no-cache' -fsS "${BASE}library/?v=${TOKEN}" -o /tmp/live-library.html
          curl --retry 3 --retry-delay 3 -H 'Cache-Control: no-cache' -fsS "${BASE}cognitive-lab/stroop-basic/?v=${TOKEN}" -o /tmp/live-stroop.html
          curl --retry 3 --retry-delay 3 -H 'Cache-Control: no-cache' -fsS "${BASE}assets/js/lab-v12.js?v=213&probe=${TOKEN}" -o /tmp/live-lab-v12.js

          python - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path

          data = json.loads(Path('/tmp/deployment.json').read_text(encoding='utf-8'))
          expected_sha = os.environ['CANDIDATE_SHA']
          assert data.get('schema_version') == 30, data
          assert data.get('commit') == expected_sha, (data, expected_sha)
          assert int(data.get('pwa_pages', 0)) > 0, data

          files = {
              'index.html': Path('/tmp/live-index.html'),
              'sitemap.xml': Path('/tmp/live-sitemap.xml'),
              'manifest.webmanifest': Path('/tmp/live-manifest.json'),
              'sw.js': Path('/tmp/live-sw.js'),
          }
          for name, path in files.items():
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              evidence = data['artifacts'][name]
              assert digest == evidence['sha256'], (name, digest, evidence)
              assert path.stat().st_size == evidence['bytes'], (name, path.stat().st_size, evidence)

          manifest = json.loads(files['manifest.webmanifest'].read_text(encoding='utf-8'))
          assert manifest.get('scope') == '/', manifest
          assert manifest.get('start_url') == '/', manifest
          index = files['index.html'].read_text(encoding='utf-8')
          sw = files['sw.js'].read_text(encoding='utf-8')
          assert 'navigator.serviceWorker.register' in index and 'sw.js' in index
          assert 'href="comparisons/"' in index and 'href="library/"' in index
          assert 'pterminology-v23-resilient-core' in sw
          assert 'Promise.allSettled' in sw and 'cached===0' in sw and 'cache.addAll' not in sw

          discovery = json.loads(Path('/tmp/live-discovery.json').read_text(encoding='utf-8'))
          assert discovery.get('version') == 220 and discovery.get('status') == 'passed', discovery
          comparisons = Path('/tmp/live-comparisons.html').read_text(encoding='utf-8')
          library = Path('/tmp/live-library.html').read_text(encoding='utf-8')
          assert '<h1' in comparisons and '<h1' in library
          assert 'noindex' not in comparisons.lower() and 'noindex' not in library.lower()

          stroop = Path('/tmp/live-stroop.html').read_text(encoding='utf-8')
          runtime = Path('/tmp/live-lab-v12.js').read_text(encoding='utf-8')
          assert stroop.count('assets/js/lab-v12.js?v=213') == 1
          assert not re.search(r'assets/js/lab-v12\.js(?:["\'])', stroop)
          assert '"mode":"stroop_basic"' in stroop
          palette = ('#b42318', '#175cd3', '#067647', '#b54708', '#6941c6', '#087e8b')
          assert all(color in runtime for color in palette)
          assert 'stimulusInk' in runtime and 'stimulusWord' in runtime
          print({
              'live_commit': data['commit'],
              'trigger_reported_sha': os.environ.get('TRIGGER_REPORTED_SHA'),
              'live_digests_verified': len(files),
              'discovery': discovery['status'],
              'comparisons': 'live',
              'library': 'live',
              'status': 'byte-exact-artifact-current-and-discoverable',
          })
          PY

      - name: Upload deployment provenance
        if: always()
        run: |
          mkdir -p deployment-evidence
          cp validated-site/deployment.json deployment-evidence/deployment.json
          printf '{"trigger_run_id":"%s","trigger_reported_sha":"%s","artifact_candidate_sha":"%s"}\n' \
            '${{ github.event.workflow_run.id }}' \
            '${{ github.event.workflow_run.head_sha }}' \
            "${CANDIDATE_SHA:-unknown}" \
            > deployment-evidence/pages-provenance-v242.json

      - name: Retain deployment provenance artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-provenance-v242
          path: deployment-evidence
          if-no-files-found: error
          retention-days: 30
