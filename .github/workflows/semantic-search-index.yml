name: Semantic search index

on:
  pull_request:
    paths:
      - 'ai-search/**'
      - 'scripts/build_semantic_search_index.py'
      - 'scripts/semantic-search-requirements.txt'
      - '.github/workflows/semantic-search-index.yml'
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'scripts/build_semantic_search_index.py'
      - 'scripts/semantic-search-requirements.txt'
      - '.github/workflows/semantic-search-index.yml'
      - '!ai-search/data/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: semantic-search-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source files
        run: |
          python -m py_compile scripts/build_semantic_search_index.py
          node --check ai-search/assets/app.js
          node --check ai-search/assets/search-worker.js
          python - <<'PY'
          import json
          from pathlib import Path
          json.loads(Path('ai-search/data/manifest.json').read_text(encoding='utf-8'))
          print('Manifest JSON is valid')
          PY

  build:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/semantic-search-requirements.txt

      - name: Cache Hugging Face model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-multilingual-e5-small-v1

      - name: Install index dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/semantic-search-requirements.txt

      - name: Build semantic index
        env:
          TOKENIZERS_PARALLELISM: 'false'
        run: python scripts/build_semantic_search_index.py --root . --output ai-search/data

      - name: Commit generated index
        run: |
          if git diff --quiet -- ai-search/data; then
            echo 'Semantic index is unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai-search/data
          git commit -m 'build semantic search index [skip ci]'
          git push
