name: Semantic search index

on:
  pull_request:
    paths:
      - 'ai-search/**'
      - 'tests/test_ai_search_browser_index_v2.py'
      - 'scripts/build_semantic_search_index.py'
      - 'scripts/build_remote_semantic_search_index.py'
      - 'scripts/semantic-search-requirements.txt'
      - '.github/workflows/semantic-search-index.yml'
  push:
    branches: [main]
    paths:
      - 'ai-search/**'
      - 'tests/test_ai_search_browser_index_v2.py'
      - 'scripts/build_semantic_search_index.py'
      - 'scripts/build_remote_semantic_search_index.py'
      - 'scripts/semantic-search-requirements.txt'
      - '.github/workflows/semantic-search-index.yml'
      - '!ai-search/data/**'
  schedule:
    - cron: '35 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: semantic-search-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source files and bounded fallback contract
        run: |
          set -euxo pipefail
          python -m py_compile scripts/build_semantic_search_index.py scripts/build_remote_semantic_search_index.py tests/test_ai_search_browser_index_v2.py
          node --check ai-search/assets/app.js
          node --check ai-search/assets/search-core.js
          node --check ai-search/assets/search-worker.js
          python -m unittest -v tests.test_ai_search_browser_index_v2
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('ai-search/data/manifest.json').read_text(encoding='utf-8'))
          assert manifest['dimensions']==384,manifest
          print('Manifest JSON and dimensions are valid')
          PY

  smoke:
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/semantic-search-requirements.txt

      - name: Cache Hugging Face model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-multilingual-e5-small-v1

      - name: Install index dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/semantic-search-requirements.txt

      - name: Build a published-corpus sample end to end
        env:
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          python scripts/build_remote_semantic_search_index.py \
            --sitemap-url https://khaledaltheeb.github.io/pterminology-site/sitemap-index.xml \
            --base-url https://khaledaltheeb.github.io/pterminology-site/ \
            --output /tmp/semantic-search-smoke \
            --max-pages 12 \
            --workers 2 \
            --batch-size 8 \
            --minimum-success-ratio 0.80

      - name: Verify generated vector artifacts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('/tmp/semantic-search-smoke')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          assert manifest['ready'] is True
          assert manifest['documentCount'] >= 1
          assert manifest['chunkCount'] >= manifest['documentCount']
          assert manifest['dimensions'] == 384
          assert manifest['model'] == 'intfloat/multilingual-e5-small'
          assert manifest['shards']
          for shard in manifest['shards']:
              metadata = root / shard['metadata']
              vectors = root / shard['embeddings']
              assert metadata.is_file() and metadata.stat().st_size > 0
              assert vectors.is_file() and vectors.stat().st_size > 0
              assert vectors.stat().st_size == shard['count'] * manifest['dimensions'] * 2
          print(
              f"Verified {manifest['documentCount']} pages, "
              f"{manifest['chunkCount']} chunks and {len(manifest['shards'])} vector shards"
          )
          PY

  build:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/semantic-search-requirements.txt

      - name: Cache Hugging Face model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-multilingual-e5-small-v1

      - name: Install index dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/semantic-search-requirements.txt

      - name: Preserve previous manifest
        run: |
          if [ -f ai-search/data/manifest.json ]; then
            cp ai-search/data/manifest.json /tmp/semantic-manifest-before.json
          fi

      - name: Build index from all published sitemap pages
        env:
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          python scripts/build_remote_semantic_search_index.py \
            --sitemap-url https://khaledaltheeb.github.io/pterminology-site/sitemap-index.xml \
            --base-url https://khaledaltheeb.github.io/pterminology-site/ \
            --output ai-search/data \
            --max-pages 6000 \
            --workers 8

      - name: Avoid timestamp-only commits
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          old_path = Path('/tmp/semantic-manifest-before.json')
          new_path = Path('ai-search/data/manifest.json')
          if not old_path.exists() or not new_path.exists():
              raise SystemExit(0)

          old = json.loads(old_path.read_text(encoding='utf-8'))
          new = json.loads(new_path.read_text(encoding='utf-8'))
          old_compare = {key: value for key, value in old.items() if key != 'generatedAt'}
          new_compare = {key: value for key, value in new.items() if key != 'generatedAt'}
          if old_compare == new_compare:
              new['generatedAt'] = old.get('generatedAt')
              new_path.write_text(
                  json.dumps(new, ensure_ascii=False, separators=(',', ':')),
                  encoding='utf-8',
              )
              print('Only generatedAt changed; preserved the previous timestamp.')
          PY

      - name: Commit generated index
        run: |
          if git diff --quiet -- ai-search/data; then
            echo 'Semantic index is unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai-search/data
          git commit -m 'build semantic search index [skip ci]'
          git push
