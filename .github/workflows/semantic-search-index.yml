name: Semantic search index

on:
  pull_request:
    paths:
      - 'ai-search/**'
      - 'tests/test_ai_search_browser_index_v2.py'
      - 'tests/test_multilingual_e5_production_v3.py'
      - 'scripts/build_semantic_search_index.py'
      - 'scripts/build_remote_semantic_search_index.py'
      - 'scripts/semantic-search-requirements.txt'
      - '.github/workflows/semantic-search-index.yml'
  push:
    branches: [main]
    paths:
      - 'ai-search/**'
      - 'tests/test_ai_search_browser_index_v2.py'
      - 'tests/test_multilingual_e5_production_v3.py'
      - 'scripts/build_semantic_search_index.py'
      - 'scripts/build_remote_semantic_search_index.py'
      - 'scripts/semantic-search-requirements.txt'
      - '.github/workflows/semantic-search-index.yml'
      - '!ai-search/data/**'
  schedule:
    - cron: '35 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: semantic-search-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate source files and bounded fallback contract
        run: |
          set -euxo pipefail
          python -m py_compile scripts/build_semantic_search_index.py scripts/build_remote_semantic_search_index.py tests/test_ai_search_browser_index_v2.py tests/test_multilingual_e5_production_v3.py
          node --check ai-search/assets/app.js
          node --check ai-search/assets/search-core.js
          node --check ai-search/assets/search-worker.js
          python -m unittest -v tests.test_ai_search_browser_index_v2 tests.test_multilingual_e5_production_v3
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('ai-search/data/manifest.json').read_text(encoding='utf-8'))
          assert manifest['dimensions']==384,manifest
          print('Manifest JSON and dimensions are valid')
          PY

  smoke:
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Cache Hugging Face model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-multilingual-e5-small-v2-pinned

      - name: Cache Node E5 model
        uses: actions/cache@v4
        with:
          path: ~/.cache/transformers-js
          key: transformers-js-e5-small-4.2.0-761b726d

      - name: Install CPU-only index dependencies
        run: |
          python -m pip install --no-cache-dir --disable-pip-version-check --only-binary=:all: \
            --index-url https://download.pytorch.org/whl/cpu \
            torch==2.13.0+cpu
          python -m pip install --no-cache-dir --disable-pip-version-check -r scripts/semantic-search-requirements.txt
          python - <<'PY'
          import torch
          assert torch.__version__ == '2.13.0+cpu', torch.__version__
          assert torch.version.cuda is None, torch.version.cuda
          assert torch.cuda.is_available() is False
          print(f'Using CPU-only PyTorch {torch.__version__}')
          PY

      - name: Build a published-corpus sample end to end
        env:
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          python scripts/build_remote_semantic_search_index.py \
            --sitemap-url https://healthrenewal.org/sitemap-index.xml \
            --base-url https://healthrenewal.org/ \
            --output /tmp/semantic-search-smoke \
            --max-pages 12 \
            --workers 2 \
            --batch-size 8 \
            --minimum-success-ratio 0.80

      - name: Verify generated vector artifacts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('/tmp/semantic-search-smoke')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          assert manifest['ready'] is True
          assert manifest['documentCount'] >= 1
          assert manifest['chunkCount'] >= manifest['documentCount']
          assert manifest['dimensions'] == 384
          assert manifest['model'] == 'intfloat/multilingual-e5-small'
          assert manifest['modelRevision'] == 'fd1525a9fd15316a2d503bf26ab031a61d056e98'
          assert manifest['browserModelRevision'] == '761b726dd34fb83930e26aab4e9ac3899aa1fa78'
          assert manifest['corpusBaseUrl'] == 'https://healthrenewal.org/'
          assert manifest['shards']
          for shard in manifest['shards']:
              metadata = root / shard['metadata']
              vectors = root / shard['embeddings']
              assert metadata.is_file() and metadata.stat().st_size > 0
              assert vectors.is_file() and vectors.stat().st_size > 0
              assert vectors.stat().st_size == shard['count'] * manifest['dimensions'] * 2
          print(
              f"Verified {manifest['documentCount']} pages, "
              f"{manifest['chunkCount']} chunks and {len(manifest['shards'])} vector shards"
          )
          PY

      - name: Verify Node ONNX query embeddings
        run: |
          set -euxo pipefail
          work=/tmp/e5-node-smoke
          rm -rf "$work"
          mkdir -p "$work"
          cd "$work"
          npm init -y >/dev/null
          npm install --no-save --no-package-lock @huggingface/transformers@4.2.0
          cat > smoke.mjs <<'JS'
          import { env, pipeline } from '@huggingface/transformers';

          env.allowLocalModels = false;
          env.cacheDir = `${process.env.HOME}/.cache/transformers-js`;

          const model = 'Xenova/multilingual-e5-small';
          const revision = '761b726dd34fb83930e26aab4e9ac3899aa1fa78';
          const extractor = await pipeline('feature-extraction', model, {
            revision,
            dtype: 'q8',
            device: 'cpu',
          });
          const output = await extractor([
            'query: طرق دعم اضطراب طيف التوحد',
            'passage: تشمل خطط دعم اضطراب طيف التوحد التواصل الواضح والتدخل المبكر ودعم الأسرة.',
            'passage: تتغير درجات الحرارة بين الفصول وتختلف كميات الأمطار من منطقة إلى أخرى.',
          ], { pooling: 'mean', normalize: true });
          const rows = output.tolist();
          if (rows.length !== 3 || rows.some((row) => row.length !== 384)) {
            throw new Error(`Unexpected Node embedding shape: ${JSON.stringify(output.dims)}`);
          }
          const dot = (left, right) => left.reduce((sum, value, index) => sum + value * right[index], 0);
          const norm = (row) => Math.sqrt(dot(row, row));
          for (const row of rows) {
            const value = norm(row);
            if (Math.abs(value - 1) > 0.015) throw new Error(`Embedding is not normalized: ${value}`);
          }
          const relevant = dot(rows[0], rows[1]);
          const unrelated = dot(rows[0], rows[2]);
          if (!(relevant > unrelated)) {
            throw new Error(`Semantic ordering failed: relevant=${relevant}, unrelated=${unrelated}`);
          }
          console.log(JSON.stringify({ runtime: 'node-cpu', model, revision, dimensions: rows[0].length, relevant, unrelated }));
          JS
          node smoke.mjs

      - name: Verify browser WASM query embeddings
        run: |
          set -euxo pipefail
          work=/tmp/e5-browser-wasm
          rm -rf "$work"
          mkdir -p "$work"
          cd "$work"
          npm init -y >/dev/null
          npm install --no-save --no-package-lock playwright-core@1.61.1
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          export CHROME_BIN

          cat > index.html <<'HTML'
          <!doctype html>
          <html lang="ar" dir="rtl">
          <meta charset="utf-8">
          <title>E5 browser WASM smoke</title>
          <body>
          <pre id="status">starting</pre>
          <script type="module">
          const status = document.querySelector('#status');
          try {
            const { env, pipeline } = await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.2.0');
            env.allowLocalModels = false;
            const model = 'Xenova/multilingual-e5-small';
            const revision = '761b726dd34fb83930e26aab4e9ac3899aa1fa78';
            const extractor = await pipeline('feature-extraction', model, {
              revision,
              dtype: 'q8',
            });
            const output = await extractor([
              'query: طرق دعم اضطراب طيف التوحد',
              'passage: تشمل خطط دعم اضطراب طيف التوحد التواصل الواضح والتدخل المبكر ودعم الأسرة.',
              'passage: تتغير درجات الحرارة بين الفصول وتختلف كميات الأمطار من منطقة إلى أخرى.',
            ], { pooling: 'mean', normalize: true });
            const rows = output.tolist();
            const dot = (left, right) => left.reduce((sum, value, index) => sum + value * right[index], 0);
            const norm = (row) => Math.sqrt(dot(row, row));
            if (rows.length !== 3 || rows.some((row) => row.length !== 384)) {
              throw new Error(`Unexpected browser embedding shape: ${JSON.stringify(output.dims)}`);
            }
            for (const row of rows) {
              const value = norm(row);
              if (Math.abs(value - 1) > 0.015) throw new Error(`Embedding is not normalized: ${value}`);
            }
            const relevant = dot(rows[0], rows[1]);
            const unrelated = dot(rows[0], rows[2]);
            if (!(relevant > unrelated)) {
              throw new Error(`Semantic ordering failed: relevant=${relevant}, unrelated=${unrelated}`);
            }
            window.__e5Smoke = {
              done: true,
              ok: true,
              model,
              revision,
              dimensions: rows[0].length,
              relevant,
              unrelated,
            };
            status.textContent = JSON.stringify(window.__e5Smoke);
          } catch (error) {
            window.__e5Smoke = {
              done: true,
              ok: false,
              error: String(error?.stack || error),
            };
            status.textContent = JSON.stringify(window.__e5Smoke);
          }
          </script>
          </body>
          </html>
          HTML

          python -m http.server 8765 --bind 127.0.0.1 >/tmp/e5-browser-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          cat > browser-smoke.mjs <<'JS'
          import { chromium } from 'playwright-core';

          const wasmRequests = [];
          const browser = await chromium.launch({
            executablePath: process.env.CHROME_BIN,
            headless: true,
            args: ['--no-sandbox', '--disable-dev-shm-usage'],
          });
          try {
            const page = await browser.newPage();
            page.on('console', (message) => console.log(`[browser:${message.type()}] ${message.text()}`));
            page.on('pageerror', (error) => console.error(`[browser:error] ${error.stack || error}`));
            page.on('request', (request) => {
              if (/\.wasm(?:\?|$)/i.test(request.url())) wasmRequests.push(request.url());
            });
            await page.goto('http://127.0.0.1:8765/', { waitUntil: 'domcontentloaded' });
            await page.waitForFunction(() => globalThis.__e5Smoke?.done === true, null, { timeout: 300000 });
            const report = await page.evaluate(() => globalThis.__e5Smoke);
            if (!report?.ok) throw new Error(`Browser E5 failed: ${report?.error || 'unknown error'}`);
            if (report.dimensions !== 384) throw new Error(`Unexpected browser dimensions: ${report.dimensions}`);
            if (!(report.relevant > report.unrelated)) {
              throw new Error(`Browser semantic ordering failed: ${JSON.stringify(report)}`);
            }
            if (wasmRequests.length === 0) {
              throw new Error('No WASM runtime request was observed in Chromium');
            }
            console.log(JSON.stringify({
              runtime: 'chromium-wasm',
              ...report,
              wasmRequestCount: wasmRequests.length,
              wasmRequest: wasmRequests[0],
            }));
          } finally {
            await browser.close();
          }
          JS
          node browser-smoke.mjs

  build:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Hugging Face model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-multilingual-e5-small-v2-pinned

      - name: Install CPU-only index dependencies
        run: |
          python -m pip install --no-cache-dir --disable-pip-version-check --only-binary=:all: \
            --index-url https://download.pytorch.org/whl/cpu \
            torch==2.13.0+cpu
          python -m pip install --no-cache-dir --disable-pip-version-check -r scripts/semantic-search-requirements.txt
          python - <<'PY'
          import torch
          assert torch.__version__ == '2.13.0+cpu', torch.__version__
          assert torch.version.cuda is None, torch.version.cuda
          assert torch.cuda.is_available() is False
          print(f'Using CPU-only PyTorch {torch.__version__}')
          PY

      - name: Preserve previous manifest
        run: |
          if [ -f ai-search/data/manifest.json ]; then
            cp ai-search/data/manifest.json /tmp/semantic-manifest-before.json
          fi

      - name: Build index from all published sitemap pages
        env:
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          python scripts/build_remote_semantic_search_index.py \
            --sitemap-url https://healthrenewal.org/sitemap-index.xml \
            --base-url https://healthrenewal.org/ \
            --output ai-search/data \
            --max-pages 10000 \
            --workers 8

      - name: Avoid timestamp-only commits
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          old_path = Path('/tmp/semantic-manifest-before.json')
          new_path = Path('ai-search/data/manifest.json')
          if not old_path.exists() or not new_path.exists():
              raise SystemExit(0)

          old = json.loads(old_path.read_text(encoding='utf-8'))
          new = json.loads(new_path.read_text(encoding='utf-8'))
          old_compare = {key: value for key, value in old.items() if key != 'generatedAt'}
          new_compare = {key: value for key, value in new.items() if key != 'generatedAt'}
          if old_compare == new_compare:
              new['generatedAt'] = old.get('generatedAt')
              new_path.write_text(
                  json.dumps(new, ensure_ascii=False, separators=(',', ':')),
                  encoding='utf-8',
              )
              print('Only generatedAt changed; preserved the previous timestamp.')
          PY

      - name: Commit generated index
        run: |
          if git diff --quiet -- ai-search/data; then
            echo 'Semantic index is unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai-search/data
          git commit -m 'build semantic search index [skip ci]'
          for attempt in {1..5}; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            sleep $((attempt*3))
          done
          exit 1
