name: Semantic search index

on:
  pull_request:
    paths:
      - '**/*.html'
      - 'content/**'
      - '.generator-v6/**'
      - '.v10bundle/**'
      - 'assets/platform/platform-core.js'
      - 'ai-search/**'
      - 'tests/e5_*_smoke.mjs'
      - 'tests/test_ai_search_browser_index_v2.py'
      - 'tests/test_multilingual_e5_production_v3.py'
      - 'tests/test_e5_full_site_home_integration_v4.py'
      - 'scripts/build_semantic_search_index.py'
      - 'scripts/build_remote_semantic_search_index.py'
      - 'scripts/semantic-search-requirements.txt'
      - '.github/workflows/semantic-search-index.yml'
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'content/**'
      - '.generator-v6/**'
      - '.v10bundle/**'
      - 'assets/platform/platform-core.js'
      - 'ai-search/**'
      - 'tests/e5_*_smoke.mjs'
      - 'tests/test_ai_search_browser_index_v2.py'
      - 'tests/test_multilingual_e5_production_v3.py'
      - 'tests/test_e5_full_site_home_integration_v4.py'
      - 'scripts/build_semantic_search_index.py'
      - 'scripts/build_remote_semantic_search_index.py'
      - 'scripts/semantic-search-requirements.txt'
      - '.github/workflows/semantic-search-index.yml'
      - '!ai-search/data/**'
  schedule:
    - cron: '35 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: semantic-search-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate source and model contracts
        run: |
          set -euxo pipefail
          python -m py_compile \
            scripts/build_semantic_search_index.py \
            scripts/build_remote_semantic_search_index.py \
            tests/test_ai_search_browser_index_v2.py \
            tests/test_multilingual_e5_production_v3.py \
            tests/test_e5_full_site_home_integration_v4.py
          node --check assets/platform/platform-core.js
          node --check ai-search/assets/app.js
          node --check ai-search/assets/search-core.js
          node --check ai-search/assets/search-worker.js
          node --check tests/e5_node_smoke.mjs
          node --check tests/e5_browser_smoke.mjs
          python -m unittest -v \
            tests.test_ai_search_browser_index_v2 \
            tests.test_multilingual_e5_production_v3 \
            tests.test_e5_full_site_home_integration_v4
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('ai-search/data/manifest.json').read_text(encoding='utf-8'))
          assert manifest['version'] == 2, manifest
          assert manifest['dimensions'] == 384, manifest
          assert manifest['model'] == 'intfloat/multilingual-e5-small', manifest
          assert manifest['browserModel'] == 'Xenova/multilingual-e5-small', manifest
          print('Manifest and source contracts are valid.')
          PY

  smoke:
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Cache pinned Python E5 model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-multilingual-e5-small-v2-pinned

      - name: Cache pinned Transformers.js E5 model
        uses: actions/cache@v4
        with:
          path: ~/.cache/transformers-js
          key: transformers-js-e5-small-4.2.0-761b726d

      - name: Install CPU-only index dependencies
        run: |
          python -m pip install --no-cache-dir --disable-pip-version-check --only-binary=:all: \
            --index-url https://download.pytorch.org/whl/cpu \
            torch==2.13.0+cpu
          python -m pip install --no-cache-dir --disable-pip-version-check \
            -r scripts/semantic-search-requirements.txt
          python - <<'PY'
          import torch
          assert torch.__version__ == '2.13.0+cpu', torch.__version__
          assert torch.version.cuda is None, torch.version.cuda
          assert torch.cuda.is_available() is False
          print(f'Using CPU-only PyTorch {torch.__version__}')
          PY

      - name: Build a live corpus sample
        env:
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          python scripts/build_remote_semantic_search_index.py \
            --sitemap-url https://healthrenewal.org/sitemap-index.xml \
            --base-url https://healthrenewal.org/ \
            --output /tmp/semantic-search-smoke \
            --max-pages 12 \
            --workers 2 \
            --batch-size 8 \
            --minimum-success-ratio 0.80 \
            --minimum-indexed-ratio 0.80

      - name: Verify generated vector artifacts and coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/semantic-search-smoke')
          manifest=json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          coverage=json.loads((root/'coverage.json').read_text(encoding='utf-8'))
          assert manifest['ready'] is True
          assert manifest['documentCount'] >= 1
          assert manifest['chunkCount'] >= manifest['documentCount']
          assert manifest['dimensions'] == 384
          assert manifest['dtype'] == 'float16'
          assert manifest['normalized'] is True
          assert manifest['modelRevision'] == 'fd1525a9fd15316a2d503bf26ab031a61d056e98'
          assert manifest['browserModelRevision'] == '761b726dd34fb83930e26aab4e9ac3899aa1fa78'
          assert manifest['corpusBaseUrl'] == 'https://healthrenewal.org/'
          assert manifest['coverage']['passed'] is True
          assert coverage['passed'] is True
          assert coverage['indexCoverageRatio'] >= 0.80
          assert coverage['downloadSuccessRatio'] >= 0.80
          assert manifest['shards']
          for shard in manifest['shards']:
              metadata=root/shard['metadata']
              vectors=root/shard['embeddings']
              assert metadata.is_file() and metadata.stat().st_size > 0
              assert vectors.is_file() and vectors.stat().st_size == shard['count'] * 384 * 2
          print(
              f"Verified {manifest['documentCount']} pages, {manifest['chunkCount']} chunks, "
              f"{len(manifest['shards'])} shards and {coverage['indexCoverageRatio']:.2%} coverage"
          )
          PY

      - name: Install browser runtime test dependencies
        run: npm install --no-save --no-package-lock @huggingface/transformers@4.2.0 playwright-core@1.61.1

      - name: Verify Node CPU query embeddings
        run: node tests/e5_node_smoke.mjs

      - name: Verify Chromium WASM query embeddings
        run: |
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          export CHROME_BIN
          node tests/e5_browser_smoke.mjs

  build:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pinned Python E5 model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-multilingual-e5-small-v2-pinned

      - name: Install CPU-only index dependencies
        run: |
          python -m pip install --no-cache-dir --disable-pip-version-check --only-binary=:all: \
            --index-url https://download.pytorch.org/whl/cpu \
            torch==2.13.0+cpu
          python -m pip install --no-cache-dir --disable-pip-version-check \
            -r scripts/semantic-search-requirements.txt
          python - <<'PY'
          import torch
          assert torch.__version__ == '2.13.0+cpu', torch.__version__
          assert torch.version.cuda is None
          assert torch.cuda.is_available() is False
          PY

      - name: Preserve previous coverage metadata
        run: |
          if [ -f ai-search/data/manifest.json ]; then
            cp ai-search/data/manifest.json /tmp/semantic-manifest-before.json
          fi
          if [ -f ai-search/data/coverage.json ]; then
            cp ai-search/data/coverage.json /tmp/semantic-coverage-before.json
          fi

      - name: Build index from every published sitemap page
        env:
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          python scripts/build_remote_semantic_search_index.py \
            --sitemap-url https://healthrenewal.org/sitemap-index.xml \
            --base-url https://healthrenewal.org/ \
            --output ai-search/data \
            --max-pages 10000 \
            --workers 8 \
            --minimum-success-ratio 1.0 \
            --minimum-indexed-ratio 1.0

      - name: Verify complete production corpus coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('ai-search/data')
          manifest=json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          coverage=json.loads((root/'coverage.json').read_text(encoding='utf-8'))
          assert manifest['coverage']['passed'] is True
          assert coverage['passed'] is True
          assert coverage['downloadSuccessRatio'] == 1.0
          assert coverage['indexCoverageRatio'] == 1.0
          assert coverage['failedDownloadCount'] == 0
          assert coverage['unindexedUrls'] == []
          assert coverage['destinationCollisions'] == {}
          assert coverage['unexpectedIndexedPaths'] == []
          assert coverage['discoveredUrlCount'] == coverage['downloadedPageCount']
          assert coverage['discoveredUrlCount'] == coverage['indexedUrlCount']
          assert coverage['indexedUrlCount'] == manifest['documentCount']
          print({
              'passed': True,
              'documents': manifest['documentCount'],
              'chunks': manifest['chunkCount'],
              'coverage': coverage['indexCoverageRatio'],
          })
          PY

      - name: Avoid timestamp-only commits
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          old_manifest_path=Path('/tmp/semantic-manifest-before.json')
          new_manifest_path=Path('ai-search/data/manifest.json')
          old_coverage_path=Path('/tmp/semantic-coverage-before.json')
          new_coverage_path=Path('ai-search/data/coverage.json')

          if not old_manifest_path.exists() or not new_manifest_path.exists():
              raise SystemExit(0)

          old_manifest=json.loads(old_manifest_path.read_text(encoding='utf-8'))
          new_manifest=json.loads(new_manifest_path.read_text(encoding='utf-8'))
          strip_generated=lambda data: {key:value for key,value in data.items() if key != 'generatedAt'}

          if strip_generated(old_manifest) != strip_generated(new_manifest):
              raise SystemExit(0)

          generated_at=old_manifest.get('generatedAt')
          new_manifest['generatedAt']=generated_at
          new_manifest_path.write_text(
              json.dumps(new_manifest, ensure_ascii=False, separators=(',', ':')),
              encoding='utf-8',
          )

          if old_coverage_path.exists() and new_coverage_path.exists():
              old_coverage=json.loads(old_coverage_path.read_text(encoding='utf-8'))
              new_coverage=json.loads(new_coverage_path.read_text(encoding='utf-8'))
              if strip_generated(old_coverage) == strip_generated(new_coverage):
                  new_coverage['generatedAt']=old_coverage.get('generatedAt', generated_at)
                  new_coverage_path.write_text(
                      json.dumps(new_coverage, ensure_ascii=False, separators=(',', ':')),
                      encoding='utf-8',
                  )
          print('Only generation timestamps changed; preserved previous timestamps.')
          PY

      - name: Commit generated index
        run: |
          if git diff --quiet -- ai-search/data; then
            echo 'Semantic index is unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai-search/data
          git commit -m 'build semantic search index [skip ci]'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            sleep $((attempt*3))
          done
          exit 1
