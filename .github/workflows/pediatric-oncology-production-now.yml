name: Pediatric oncology production now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pediatric-oncology-production-now.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Dispatch validated production workflow
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh workflow run deploy-production-v3.yml --repo "$GH_REPO" --ref main
          mkdir -p api
          printf '{"status":"accepted","workflow":"deploy-production-v3.yml","ref":"main","source_run":"%s"}\n' "$GITHUB_RUN_ID" > api/pediatric-oncology-production-dispatch-v1.json
          git config user.name 'Rawafid Publisher'
          git config user.email 'actions@users.noreply.github.com'
          git add api/pediatric-oncology-production-dispatch-v1.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: record pediatric oncology production dispatch'
            git push origin HEAD:main
          fi
