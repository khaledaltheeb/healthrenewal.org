name: Audit Hostinger domain API

on:
  push:
    branches: [main]
    paths:
      - ".github/hostinger-domain-audit-trigger"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  DOMAIN: healthrenewal.org

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Inspect Hostinger portfolio and DNS zone
        id: attempt
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
          HOSTINGER_API_KEY: ${{ secrets.HOSTINGER_API_KEY }}
          HOSTINGER_TOKEN: ${{ secrets.HOSTINGER_TOKEN }}
        run: |
          set +e
          python - <<'PY' > hostinger-domain-audit.log 2>&1
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          domain = os.environ["DOMAIN"]
          token = (
              os.environ.get("HOSTINGER_API_TOKEN")
              or os.environ.get("HOSTINGER_API_KEY")
              or os.environ.get("HOSTINGER_TOKEN")
              or ""
          )
          if not token:
              raise SystemExit("No Hostinger token was found in HOSTINGER_API_TOKEN, HOSTINGER_API_KEY, or HOSTINGER_TOKEN")

          def get(path):
              request = urllib.request.Request(
                  "https://developers.hostinger.com" + path,
                  headers={
                      "Authorization": "Bearer " + token,
                      "Accept": "application/json",
                      "Content-Type": "application/json",
                      "User-Agent": "healthrenewal-hostinger-domain-audit/1.0",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=45) as response:
                      return response.status, json.load(response)
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode(errors="replace")
                  raise RuntimeError(f"GET {path}: HTTP {exc.code}: {body[:1200]}")

          portfolio_status, portfolio = get("/api/domains/v1/portfolio/" + urllib.parse.quote(domain))
          zone_status, zone = get("/api/dns/v1/zones/" + urllib.parse.quote(domain))
          Path("hostinger-portfolio.json").write_text(json.dumps(portfolio, ensure_ascii=False, indent=2) + "\n")
          Path("hostinger-dns-zone.json").write_text(json.dumps(zone, ensure_ascii=False, indent=2) + "\n")

          records = zone.get("data", zone)
          if isinstance(records, dict):
              records = records.get("records", records.get("zone", records))
          count = len(records) if isinstance(records, list) else None
          result = {
              "ok": True,
              "domain": domain,
              "portfolio_http": portfolio_status,
              "zone_http": zone_status,
              "record_count": count,
          }
          Path("hostinger-domain-audit-result.json").write_text(json.dumps(result, indent=2) + "\n")
          print(json.dumps(result))
          PY
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat hostinger-domain-audit.log
          exit 0

      - name: Publish Hostinger API audit receipt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          EXIT_CODE: ${{ steps.attempt.outputs.exit_code }}
        run: |
          set -euo pipefail
          title="Hostinger domain API audit: healthrenewal.org"
          if [ "${EXIT_CODE:-1}" = "0" ] && [ -f hostinger-domain-audit-result.json ]; then
            outcome="success"
            detail=$(jq -c . hostinger-domain-audit-result.json)
          else
            outcome="failure"
            detail=$(tail -n 14 hostinger-domain-audit.log | sed 's/`/\\`/g' | head -c 3500)
          fi
          body=$(cat <<EOF
          ## Hostinger domain API audit

          - **Outcome:** ${outcome}
          - **Run:** https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - **Checked:** $(date -u +'%Y-%m-%dT%H:%M:%SZ')

          ${detail}
          EOF
          )
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state all --limit 100 --json number,title --jq ".[] | select(.title == \"${title}\") | .number" | head -n 1)
          if [ -z "$number" ]; then
            number=$(gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body" | sed -n 's#.*/##p')
          else
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          fi
          if [ "$outcome" = "success" ]; then
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" --reason completed --comment "Hostinger domain and DNS API access is available." || true
          else
            gh issue reopen "$number" --repo "$GITHUB_REPOSITORY" || true
          fi

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hostinger-domain-api-audit-${{ github.run_id }}
          path: |
            hostinger-domain-audit.log
            hostinger-domain-audit-result.json
            hostinger-portfolio.json
            hostinger-dns-zone.json
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce audit result
        if: always()
        env:
          EXIT_CODE: ${{ steps.attempt.outputs.exit_code }}
        run: test "${EXIT_CODE:-1}" = "0"
