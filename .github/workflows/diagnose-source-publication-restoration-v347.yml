name: Diagnose source-publication restoration v347

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-source-publication-restoration-v347.yml"

permissions:
  actions: read
  contents: write

concurrency:
  group: diagnose-source-publication-restoration-v347
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Wait for and inspect the latest restoration run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          workflow_path="restore-source-published-pages-v342.yml"
          completed=false
          for attempt in $(seq 1 60); do
            gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_path}/runs?branch=main&per_page=10" > /tmp/restoration-runs.json
            run_id="$(jq -r '.workflow_runs[0].id // empty' /tmp/restoration-runs.json)"
            status="$(jq -r '.workflow_runs[0].status // empty' /tmp/restoration-runs.json)"
            if [[ -n "${run_id}" && "${status}" == "completed" ]]; then
              completed=true
              break
            fi
            sleep 10
          done
          test "${completed}" = true
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" > /tmp/restoration-jobs.json
          RUN_ID="${run_id}" python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          runs = json.loads(Path('/tmp/restoration-runs.json').read_text(encoding='utf-8'))
          jobs = json.loads(Path('/tmp/restoration-jobs.json').read_text(encoding='utf-8'))
          run = next(item for item in runs['workflow_runs'] if str(item['id']) == os.environ['RUN_ID'])
          normalized_jobs = []
          for job in jobs.get('jobs', []):
              normalized_jobs.append({
                  'id': job['id'],
                  'name': job['name'],
                  'status': job['status'],
                  'conclusion': job.get('conclusion'),
                  'started_at': job.get('started_at'),
                  'completed_at': job.get('completed_at'),
                  'steps': [
                      {
                          'number': step['number'],
                          'name': step['name'],
                          'status': step['status'],
                          'conclusion': step.get('conclusion'),
                      }
                      for step in job.get('steps', [])
                  ],
              })
          diagnostic = {
              'schema_version': 347,
              'checked_at': datetime.now(timezone.utc).isoformat(),
              'workflow_name': run['name'],
              'workflow_run_id': run['id'],
              'run_number': run['run_number'],
              'event': run['event'],
              'head_branch': run['head_branch'],
              'head_sha': run['head_sha'],
              'status': run['status'],
              'conclusion': run.get('conclusion'),
              'created_at': run.get('created_at'),
              'updated_at': run.get('updated_at'),
              'jobs': normalized_jobs,
          }
          Path('/tmp/source-publication-restoration-diagnostic-v347.json').write_text(
              json.dumps(diagnostic, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(diagnostic, ensure_ascii=False, indent=2))
          PY

      - name: Commit diagnostic ledger
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = 'source-publication-restoration-diagnostic-v347.json';
            const content = fs.readFileSync('/tmp/source-publication-restoration-diagnostic-v347.json').toString('base64');
            for (let attempt = 1; attempt <= 4; attempt++) {
              let sha;
              try {
                const existing = await github.rest.repos.getContent({ owner, repo, path, ref: 'main' });
                sha = existing.data.sha;
              } catch (error) {
                if (error.status !== 404) throw error;
              }
              try {
                await github.rest.repos.createOrUpdateFileContents({
                  owner,
                  repo,
                  path,
                  branch: 'main',
                  message: 'ci: record source-publication restoration diagnostic v347 [skip ci]',
                  content,
                  ...(sha ? { sha } : {}),
                });
                return;
              } catch (error) {
                if (attempt === 4 || ![409, 422].includes(error.status)) throw error;
                await new Promise(resolve => setTimeout(resolve, attempt * 1500));
              }
            }
