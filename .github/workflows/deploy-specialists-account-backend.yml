name: Validate and deploy specialist accounts v5

on:
  pull_request:
    branches: ["main"]
    paths:
      - "specialists-partners/account/**"
      - "specialists-partners/account-backend/**"
      - "specialists-partners/backend/migrations/0004_specialist_accounts.sql"
      - "specialists-partners/assets/runtime-config.js"
      - "specialists-partners/portal/index.html"
      - "specialists-partners/index.html"
      - "robots.txt"
      - "tests/test_specialist_accounts_v5.py"
      - ".github/workflows/deploy-specialists-account-backend.yml"
  push:
    branches: ["main"]
    paths:
      - "specialists-partners/account/**"
      - "specialists-partners/account-backend/**"
      - "specialists-partners/backend/migrations/0004_specialist_accounts.sql"
      - "tests/test_specialist_accounts_v5.py"
      - ".github/workflows/deploy-specialists-account-backend.yml"
  workflow_dispatch:
    inputs:
      account_api_base:
        description: "Public specialist account Worker URL"
        required: true
        default: "https://pterminology-specialist-accounts.pterminology-826ac349.workers.dev"
        type: string
      apply_migrations:
        description: "Apply pending D1 migrations before deployment"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: specialist-accounts-v5-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate JavaScript and data contracts
        run: |
          set -euo pipefail
          node --check specialists-partners/account-backend/src/index.js
          node --check specialists-partners/account/account.js
          python -m unittest -v tests.test_specialist_accounts_v5

  deploy:
    if: ${{ github.event_name != 'pull_request' }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.SPECIALISTS_D1_DATABASE_ID }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
      RATE_LIMIT_SALT: ${{ secrets.SPECIALISTS_RATE_LIMIT_SALT }}
      FROM_EMAIL: ${{ secrets.SPECIALISTS_FROM_EMAIL }}
      ACCOUNT_API_BASE: ${{ inputs.account_api_base || 'https://pterminology-specialist-accounts.pterminology-826ac349.workers.dev' }}
      APPLY_MIGRATIONS: ${{ inputs.apply_migrations || 'true' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          required=(
            CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID D1_DATABASE_ID
            RESEND_API_KEY TURNSTILE_SECRET RATE_LIMIT_SALT FROM_EMAIL ACCOUNT_API_BASE
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is required"
              exit 1
            fi
          done
          python - <<'PY'
          import os, re
          from urllib.parse import urlparse

          if not re.fullmatch(r"[0-9a-f]{32}", os.environ["CLOUDFLARE_ACCOUNT_ID"]):
              raise SystemExit("CLOUDFLARE_ACCOUNT_ID must be a 32-character hexadecimal value")
          if len(os.environ["RATE_LIMIT_SALT"]) < 32:
              raise SystemExit("SPECIALISTS_RATE_LIMIT_SALT must contain at least 32 characters")
          parsed = urlparse(os.environ["ACCOUNT_API_BASE"])
          if parsed.scheme != "https" or not parsed.netloc or parsed.query or parsed.fragment:
              raise SystemExit("ACCOUNT_API_BASE must be an absolute HTTPS origin")
          PY

      - name: Generate ephemeral Wrangler configuration
        working-directory: specialists-partners/account-backend
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path

          def toml(value: str) -> str:
              return '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"'

          content = f'''name = "pterminology-specialist-accounts"
          main = "src/index.js"
          compatibility_date = "2026-07-01"
          workers_dev = true

          [vars]
          ALLOWED_ORIGINS = "https://khaledaltheeb.github.io"
          ACCOUNT_BASE_URL = "https://khaledaltheeb.github.io/pterminology-site/specialists-partners/account/"
          PORTAL_BASE_URL = "https://khaledaltheeb.github.io/pterminology-site/specialists-partners/portal/"
          TURNSTILE_EXPECTED_HOSTNAMES = "khaledaltheeb.github.io"
          SPECIALIST_SESSION_HOURS = "12"
          FROM_EMAIL = {toml(os.environ["FROM_EMAIL"])}

          [[d1_databases]]
          binding = "DB"
          database_name = "pterminology-specialists"
          database_id = {toml(os.environ["D1_DATABASE_ID"])}
          migrations_dir = "../backend/migrations"

          [triggers]
          crons = ["31 2 * * *"]
          '''
          Path("wrangler.toml").write_text(content, encoding="utf-8")
          PY

      - name: Create encrypted Worker secrets payload
        working-directory: specialists-partners/account-backend
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          payload = {
              "RESEND_API_KEY": os.environ["RESEND_API_KEY"],
              "TURNSTILE_SECRET": os.environ["TURNSTILE_SECRET"],
              "RATE_LIMIT_SALT": os.environ["RATE_LIMIT_SALT"],
          }
          Path("worker-secrets.json").write_text(json.dumps(payload), encoding="utf-8")
          PY
          chmod 600 wrangler.toml worker-secrets.json

      - name: Apply D1 migrations
        if: ${{ env.APPLY_MIGRATIONS != 'false' }}
        working-directory: specialists-partners/account-backend
        run: npx --yes wrangler@4 d1 migrations apply pterminology-specialists --remote --config wrangler.toml

      - name: Deploy specialist account Worker
        working-directory: specialists-partners/account-backend
        run: npx --yes wrangler@4 deploy --config wrangler.toml --secrets-file worker-secrets.json --minify --keep-vars

      - name: Verify production health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..18}; do
            code="$(curl -sS -o /tmp/account-health.json -w '%{http_code}' "${ACCOUNT_API_BASE%/}/health" || true)"
            if [[ "$code" == "200" ]]; then
              python - <<'PY'
              import json
              data = json.load(open('/tmp/account-health.json', encoding='utf-8'))
              assert data.get('ok') is True, data
              assert data.get('service') == 'pterminology-specialist-accounts', data
              print(json.dumps(data, ensure_ascii=False, indent=2))
              PY
              exit 0
            fi
            sleep 5
          done
          cat /tmp/account-health.json || true
          exit 1

      - name: Remove ephemeral deployment files
        if: always()
        working-directory: specialists-partners/account-backend
        run: rm -f wrangler.toml worker-secrets.json
