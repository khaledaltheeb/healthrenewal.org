name: Validate and deploy specialist identity v6

on:
  pull_request:
    branches: ["main"]
    paths:
      - "specialists-partners/account/**"
      - "specialists-partners/admin/**"
      - "specialists-partners/account-backend/**"
      - "specialists-partners/backend/src/index-v2.js"
      - "specialists-partners/backend/migrations/0005_identity_password_admin.sql"
      - "specialists-partners/assets/runtime-config.js"
      - "tests/test_specialist_identity_v6.py"
      - ".github/workflows/deploy-specialists-account-backend.yml"
  push:
    branches: ["main"]
    paths:
      - "specialists-partners/account/**"
      - "specialists-partners/admin/**"
      - "specialists-partners/account-backend/**"
      - "specialists-partners/backend/src/index-v2.js"
      - "specialists-partners/backend/migrations/0005_identity_password_admin.sql"
      - "specialists-partners/assets/runtime-config.js"
      - "tests/test_specialist_identity_v6.py"
      - ".github/workflows/deploy-specialists-account-backend.yml"
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: "Apply pending D1 migrations"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: specialist-identity-v6-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate implementation and prevent committed secrets
        run: |
          set -euo pipefail
          node --check specialists-partners/account-backend/src/index.js
          node --check specialists-partners/account/account.js
          node --check specialists-partners/admin/admin.js
          python -m unittest -v tests.test_specialist_accounts_v5 tests.test_specialist_identity_v6
          if git grep -nE '(CLOUDFLARE_API_TOKEN|RESEND_API_KEY|TURNSTILE_SECRET)[[:space:]]*[:=][[:space:]]*[^$<{[:space:]]' -- '*.md' '*.txt'; then
            echo "::error::A secret-like value is committed in a documentation file. Move it to GitHub Actions secrets and rotate it."
            exit 1
          fi

  deploy:
    if: ${{ github.event_name != 'pull_request' }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '826ac34927c1e045c06145a327c2ac52' }}
      PREFERRED_D1_DATABASE_ID: ${{ secrets.SPECIALISTS_D1_DATABASE_ID }}
      PREFERRED_TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      ADMIN_API_KEY: ${{ secrets.SPECIALISTS_ADMIN_API_KEY }}
      REVIEWER_API_KEY: ${{ secrets.SPECIALISTS_REVIEWER_API_KEY }}
      MODERATOR_API_KEY: ${{ secrets.SPECIALISTS_MODERATOR_API_KEY }}
      RATE_LIMIT_SALT: ${{ secrets.SPECIALISTS_RATE_LIMIT_SALT }}
      PASSWORD_PEPPER: ${{ secrets.SPECIALISTS_PASSWORD_PEPPER }}
      FROM_EMAIL: ${{ secrets.SPECIALISTS_FROM_EMAIL }}
      DATABASE_NAME: pterminology-specialists
      TURNSTILE_WIDGET_NAME: pterminology-specialists-forms
      ALLOWED_HOSTNAME: khaledaltheeb.github.io
      ACCOUNT_API_BASE: https://pterminology-specialist-accounts.pterminology-826ac349.workers.dev
      CORE_API_BASE: https://pterminology-specialists.pterminology-826ac349.workers.dev
      APPLY_MIGRATIONS: ${{ inputs.apply_migrations || 'true' }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate application secrets and Cloudflare token permissions
        shell: bash
        run: |
          set -euo pipefail
          required=(CLOUDFLARE_API_TOKEN RESEND_API_KEY ADMIN_API_KEY RATE_LIMIT_SALT FROM_EMAIL)
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then echo "::error::$name is required"; exit 1; fi
          done
          python - <<'PY'
          import os, re
          assert re.fullmatch(r"[0-9a-f]{32}", os.environ["CLOUDFLARE_ACCOUNT_ID"]), "invalid account id"
          assert len(os.environ["ADMIN_API_KEY"]) >= 32
          assert len(os.environ["RATE_LIMIT_SALT"]) >= 32
          PY
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/tokens/verify" | python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("success") and d.get("result",{}).get("status")=="active", d'
          curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts" >/dev/null
          curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database" >/dev/null
          curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/challenges/widgets" >/dev/null
          echo "Cloudflare token is active and can access Workers, D1, and Turnstile resources."

      - name: Discover or create D1 and Turnstile resources
        id: resources
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.parse, urllib.request

          account_id=os.environ['CLOUDFLARE_ACCOUNT_ID']
          token=os.environ['CLOUDFLARE_API_TOKEN']
          database_name=os.environ['DATABASE_NAME']
          widget_name=os.environ['TURNSTILE_WIDGET_NAME']
          hostname=os.environ['ALLOWED_HOSTNAME']
          headers={'Authorization':f'Bearer {token}','Content-Type':'application/json'}

          def call(url,method='GET',payload=None):
              data=None if payload is None else json.dumps(payload).encode()
              request=urllib.request.Request(url,method=method,headers=headers,data=data)
              with urllib.request.urlopen(request,timeout=60) as response:
                  result=json.load(response)
              if result.get('success') is not True:
                  raise SystemExit(result)
              return result

          d1_base=f'https://api.cloudflare.com/client/v4/accounts/{account_id}/d1/database'
          databases=call(d1_base+'?per_page=100').get('result',[])
          matches=[item for item in databases if item.get('name')==database_name]
          if matches:
              database_id=matches[0].get('uuid')
              database_created=False
          else:
              created=call(d1_base,'POST',{'name':database_name}).get('result',{})
              database_id=created.get('uuid')
              database_created=True
          if not database_id:
              raise SystemExit('Cloudflare did not return a D1 database UUID')

          widget_base=f'https://api.cloudflare.com/client/v4/accounts/{account_id}/challenges/widgets'
          query=urllib.parse.urlencode({'filter':f'name:{widget_name}','per_page':100})
          widgets=call(widget_base+'?'+query).get('result',[])
          matches=[item for item in widgets if item.get('name')==widget_name]
          preferred_secret=os.environ.get('PREFERRED_TURNSTILE_SECRET','').strip()
          if matches:
              sitekey=matches[0].get('sitekey')
              if preferred_secret:
                  turnstile_secret=preferred_secret
                  widget_created=False
                  secret_rotated=False
              else:
                  rotated=call(f"{widget_base}/{urllib.parse.quote(sitekey,safe='')}/rotate_secret",'POST',{'invalidate_immediately':False}).get('result',{})
                  turnstile_secret=rotated.get('secret')
                  sitekey=rotated.get('sitekey') or sitekey
                  widget_created=False
                  secret_rotated=True
          else:
              widget=call(widget_base,'POST',{'domains':[hostname],'mode':'managed','name':widget_name,'clearance_level':'no_clearance','region':'world'}).get('result',{})
              sitekey=widget.get('sitekey')
              turnstile_secret=widget.get('secret')
              widget_created=True
              secret_rotated=False
          if not sitekey or not turnstile_secret:
              raise SystemExit('Cloudflare did not return Turnstile credentials')

          print(f'::add-mask::{turnstile_secret}')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as output:
              output.write(f'database_id={database_id}\n')
              output.write(f'database_created={str(database_created).lower()}\n')
              output.write(f'turnstile_sitekey={sitekey}\n')
              output.write(f'turnstile_secret={turnstile_secret}\n')
              output.write(f'widget_created={str(widget_created).lower()}\n')
              output.write(f'secret_rotated={str(secret_rotated).lower()}\n')
          print(f'D1 ready: {database_name} ({database_id})')
          print(f'Turnstile ready: {widget_name} ({sitekey})')
          PY

      - name: Generate account Worker configuration and secrets
        working-directory: specialists-partners/account-backend
        shell: bash
        env:
          D1_DATABASE_ID: ${{ steps.resources.outputs.database_id }}
          TURNSTILE_SECRET: ${{ steps.resources.outputs.turnstile_secret }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          def q(v): return '"' + v.replace('\\','\\\\').replace('"','\\"') + '"'
          content=f'''name = "pterminology-specialist-accounts"
          main = "src/index.js"
          compatibility_date = "2026-07-01"
          workers_dev = true

          [vars]
          ALLOWED_ORIGINS = "https://khaledaltheeb.github.io"
          ACCOUNT_BASE_URL = "https://khaledaltheeb.github.io/pterminology-site/specialists-partners/account/"
          ADMIN_BASE_URL = "https://khaledaltheeb.github.io/pterminology-site/specialists-partners/admin/"
          PORTAL_BASE_URL = "https://khaledaltheeb.github.io/pterminology-site/specialists-partners/portal/"
          CORE_API_BASE = "{os.environ['CORE_API_BASE']}"
          TURNSTILE_EXPECTED_HOSTNAMES = "khaledaltheeb.github.io"
          IDENTITY_SESSION_HOURS = "12"
          OWNER_EMAIL = "pterminology@gmail.com"
          OWNER_PHONE = "+962795945817"
          OWNER_DISPLAY_NAME_AR = "خالد الذيب"
          OWNER_DISPLAY_NAME_EN = "Khaled Altheeb"
          FROM_EMAIL = {q(os.environ['FROM_EMAIL'])}

          [[d1_databases]]
          binding = "DB"
          database_name = "pterminology-specialists"
          database_id = {q(os.environ['D1_DATABASE_ID'])}
          migrations_dir = "../backend/migrations"

          [triggers]
          crons = ["31 2 * * *"]
          '''
          Path('wrangler.toml').write_text(content,encoding='utf-8')
          secrets={'RESEND_API_KEY':os.environ['RESEND_API_KEY'],'TURNSTILE_SECRET':os.environ['TURNSTILE_SECRET'],'ADMIN_API_KEY':os.environ['ADMIN_API_KEY'],'RATE_LIMIT_SALT':os.environ['RATE_LIMIT_SALT']}
          if os.environ.get('PASSWORD_PEPPER'): secrets['PASSWORD_PEPPER']=os.environ['PASSWORD_PEPPER']
          if os.environ.get('REVIEWER_API_KEY'): secrets['REVIEWER_API_KEY']=os.environ['REVIEWER_API_KEY']
          if os.environ.get('MODERATOR_API_KEY'): secrets['MODERATOR_API_KEY']=os.environ['MODERATOR_API_KEY']
          Path('worker-secrets.json').write_text(json.dumps(secrets),encoding='utf-8')
          PY
          chmod 600 wrangler.toml worker-secrets.json

      - name: Apply D1 migrations
        if: ${{ env.APPLY_MIGRATIONS != 'false' }}
        working-directory: specialists-partners/account-backend
        run: npx --yes wrangler@4 d1 migrations apply pterminology-specialists --remote --config wrangler.toml

      - name: Deploy identity Worker
        working-directory: specialists-partners/account-backend
        run: npx --yes wrangler@4 deploy --config wrangler.toml --secrets-file worker-secrets.json --minify --keep-vars

      - name: Bootstrap owner account and verify identity health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..24}; do
            code="$(curl -sS -o /tmp/identity-health.json -w '%{http_code}' "${ACCOUNT_API_BASE}/health" || true)"
            [[ "$code" == "200" ]] && break
            sleep 5
          done
          python - <<'PY'
          import json
          d=json.load(open('/tmp/identity-health.json',encoding='utf-8'))
          assert d.get('ok') is True, d
          assert d.get('service') == 'pterminology-specialist-identity', d
          assert d.get('version') == '6.0.0', d
          PY
          curl -fsS -X POST -H "x-bootstrap-key: ${ADMIN_API_KEY}" -H "content-type: application/json" --data '{}' "${ACCOUNT_API_BASE}/v1/internal/bootstrap-owner" >/tmp/owner-bootstrap.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/owner-bootstrap.json',encoding='utf-8'))
          assert d.get('ok') is True, d
          u=d['user']
          assert u['email']=='pterminology@gmail.com' and u['role']=='owner'
          assert u['phone']=='+962795945817'
          print('Owner account verified and setup email queued when required.')
          PY

      - name: Generate and deploy core messaging Worker
        working-directory: specialists-partners/backend
        shell: bash
        env:
          D1_DATABASE_ID: ${{ steps.resources.outputs.database_id }}
          TURNSTILE_SECRET: ${{ steps.resources.outputs.turnstile_secret }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          def q(v): return '"' + v.replace('\\','\\\\').replace('"','\\"') + '"'
          Path('wrangler.toml').write_text(f'''name = "pterminology-specialists"
          main = "src/index-v2.js"
          compatibility_date = "2026-07-01"
          workers_dev = true
          [vars]
          ALLOWED_ORIGINS = "https://khaledaltheeb.github.io"
          OWNER_EMAIL = "pterminology@gmail.com"
          PORTAL_BASE_URL = "https://khaledaltheeb.github.io/pterminology-site/specialists-partners/portal/"
          TURNSTILE_EXPECTED_HOSTNAMES = "khaledaltheeb.github.io"
          FROM_EMAIL = {q(os.environ['FROM_EMAIL'])}
          ADMIN_SESSION_MINUTES = "20"
          [[d1_databases]]
          binding = "DB"
          database_name = "pterminology-specialists"
          database_id = {q(os.environ['D1_DATABASE_ID'])}
          migrations_dir = "migrations"
          [triggers]
          crons = ["17 2 * * *"]
          ''',encoding='utf-8')
          secrets={'RESEND_API_KEY':os.environ['RESEND_API_KEY'],'TURNSTILE_SECRET':os.environ['TURNSTILE_SECRET'],'ADMIN_API_KEY':os.environ['ADMIN_API_KEY'],'RATE_LIMIT_SALT':os.environ['RATE_LIMIT_SALT']}
          if os.environ.get('REVIEWER_API_KEY'): secrets['REVIEWER_API_KEY']=os.environ['REVIEWER_API_KEY']
          if os.environ.get('MODERATOR_API_KEY'): secrets['MODERATOR_API_KEY']=os.environ['MODERATOR_API_KEY']
          Path('worker-secrets.json').write_text(json.dumps(secrets),encoding='utf-8')
          PY
          chmod 600 wrangler.toml worker-secrets.json
          npx --yes wrangler@4 deploy --config wrangler.toml --secrets-file worker-secrets.json --minify --keep-vars

      - name: Verify core messaging route contract
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..24}; do
            code="$(curl -sS -o /tmp/core-health.json -w '%{http_code}' "${CORE_API_BASE}/health" || true)"
            [[ "$code" == "200" ]] && break
            sleep 5
          done
          python - <<'PY'
          import json
          d=json.load(open('/tmp/core-health.json',encoding='utf-8'))
          assert d.get('ok') is True, d
          PY
          route_code="$(curl -sS -o /tmp/application-contract.json -w '%{http_code}' -X POST -H 'content-type: application/json' --data '{}' "${CORE_API_BASE}/v1/applications")"
          if [[ "$route_code" == "404" ]]; then
            cat /tmp/application-contract.json
            echo "::error::The live Worker does not expose /v1/applications"
            exit 1
          fi
          echo "Application route is present (expected validation response HTTP ${route_code})."

      - name: Remove ephemeral deployment files
        if: always()
        run: |
          rm -f specialists-partners/account-backend/wrangler.toml specialists-partners/account-backend/worker-secrets.json
          rm -f specialists-partners/backend/wrangler.toml specialists-partners/backend/worker-secrets.json
