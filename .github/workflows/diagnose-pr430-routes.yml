name: Diagnose PR430 magazine and assessment routes

on:
  push:
    branches: ["agent/platform-architecture-v1"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run isolated route tests and preserve exact output
        shell: bash
        run: |
          set +e
          python -m unittest -v tests.test_magazine_routes_v201 > /tmp/magazine-routes.log 2>&1
          echo $? > /tmp/magazine-routes.status
          find tests -maxdepth 1 -type f -name 'test_*.py' | sort | grep -E 'assessment|magazine' > /tmp/route-test-files.txt || true
          : > /tmp/assessment-routes.log
          : > /tmp/assessment-routes.status
          while IFS= read -r file; do
            case "$file" in
              *magazine*) continue ;;
            esac
            module="${file%.py}"
            module="${module//\//.}"
            printf '\n===== %s =====\n' "$module" >> /tmp/assessment-routes.log
            python -m unittest -v "$module" >> /tmp/assessment-routes.log 2>&1
            printf '%s=%s\n' "$module" "$?" >> /tmp/assessment-routes.status
          done < /tmp/route-test-files.txt
          cat /tmp/magazine-routes.log
          cat /tmp/assessment-routes.log
          exit 0
      - name: Upload route diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: pr430-route-diagnostics
          path: |
            /tmp/magazine-routes.log
            /tmp/magazine-routes.status
            /tmp/assessment-routes.log
            /tmp/assessment-routes.status
            /tmp/route-test-files.txt
          if-no-files-found: error
          retention-days: 3
