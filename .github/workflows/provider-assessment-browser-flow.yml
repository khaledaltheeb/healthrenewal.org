name: Validate Provider Assessment Browser Flow

on:
  push:
    branches: [main]
    paths:
      - "provider-assessment-demo/index.html"
      - "provider-assessment-demo/professional-console.html"
      - "provider-assessment-demo/training/**"
      - "provider-assessment-demo/app.js"
      - "provider-assessment-demo/activation.js"
      - "provider-assessment-demo/activation-guard.js"
      - "provider-assessment-demo/professional-record-lifecycle.js"
      - "provider-assessment-demo/professional-record-integrity.js"
      - "provider-assessment-demo/backup-integrity.js"
      - "provider-assessment-demo/backup-large-file-patch.js"
      - "provider-assessment-demo/condition-entry-v1.js"
      - "provider-assessment-demo/case-report-v1.js"
      - "provider-assessment-demo/case-report-interpretation-v2.js"
      - "provider-assessment-demo/case-report-export-v2.js"
      - "provider-assessment-demo/original-tools-progress-v1.js"
      - "provider-assessment-demo/institutional-live-v2.js"
      - "provider-assessment-demo/tests/**"
      - ".github/workflows/provider-assessment-browser-flow.yml"
  pull_request:
    branches: [main]
    paths:
      - "provider-assessment-demo/index.html"
      - "provider-assessment-demo/professional-console.html"
      - "provider-assessment-demo/training/**"
      - "provider-assessment-demo/app.js"
      - "provider-assessment-demo/activation.js"
      - "provider-assessment-demo/activation-guard.js"
      - "provider-assessment-demo/professional-record-lifecycle.js"
      - "provider-assessment-demo/professional-record-integrity.js"
      - "provider-assessment-demo/backup-integrity.js"
      - "provider-assessment-demo/backup-large-file-patch.js"
      - "provider-assessment-demo/condition-entry-v1.js"
      - "provider-assessment-demo/case-report-v1.js"
      - "provider-assessment-demo/case-report-interpretation-v2.js"
      - "provider-assessment-demo/case-report-export-v2.js"
      - "provider-assessment-demo/original-tools-progress-v1.js"
      - "provider-assessment-demo/institutional-live-v2.js"
      - "provider-assessment-demo/tests/**"
      - ".github/workflows/provider-assessment-browser-flow.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: provider-assessment-browser-flow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provider-assessment-browser-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check browser tests and release routes
        run: |
          node --check provider-assessment-demo/tests/playwright.config.cjs
          node --check provider-assessment-demo/tests/report-flow.spec.cjs
          node --check provider-assessment-demo/tests/professional-record-backup-flow.spec.cjs
          node --check provider-assessment-demo/tests/original-tools-progress.spec.cjs
          node --check provider-assessment-demo/original-tools-progress-v1.js
          grep -q 'href="../?release=2026.07.24-live.7"' provider-assessment-demo/training/index.html
          ! grep -q 'release=2026.07.24-live.6' provider-assessment-demo/training/index.html
          grep -q 'loadOriginalProgress' provider-assessment-demo/institutional-live-v2.js
          grep -q 'descriptive-longitudinal-comparison-not-diagnostic-not-norm-referenced' provider-assessment-demo/original-tools-progress-v1.js

      - name: Install Playwright test runner and Chromium
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.61.0
          npx playwright install --with-deps chromium

      - name: Run complete professional workflows in Chromium
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory . >/tmp/provider-assessment-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/provider-assessment-demo/ >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/provider-assessment-http.log
              exit 1
            fi
            sleep 1
          done
          npx playwright test provider-assessment-demo/tests/*.spec.cjs \
            --config=provider-assessment-demo/tests/playwright.config.cjs

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: provider-assessment-browser-diagnostics
          path: |
            test-results/
            /tmp/provider-assessment-http.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish successful browser-flow status
        if: success() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          sha = os.environ['GITHUB_SHA']
          run_url = f"{os.environ['GITHUB_SERVER_URL']}/{repo}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          payload = json.dumps({
              'state': 'success',
              'context': 'provider-assessment/browser-flows',
              'description': 'Chromium report, record, progress, encrypted restore and rollback flows passed',
              'target_url': run_url,
          }).encode()
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/statuses/{sha}",
              data=payload,
              method='POST',
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
              },
          )
          with urllib.request.urlopen(request) as response:
              if response.status != 201:
                  raise SystemExit(f'unexpected status API response: {response.status}')
          PY

      - name: Publish failed browser-flow status
        if: failure() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          sha = os.environ['GITHUB_SHA']
          run_url = f"{os.environ['GITHUB_SERVER_URL']}/{repo}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          payload = json.dumps({
              'state': 'failure',
              'context': 'provider-assessment/browser-flows',
              'description': 'Chromium professional or original-tool workflow regression detected',
              'target_url': run_url,
          }).encode()
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/statuses/{sha}",
              data=payload,
              method='POST',
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
              },
          )
          with urllib.request.urlopen(request) as response:
              if response.status != 201:
                  raise SystemExit(f'unexpected status API response: {response.status}')
          PY
