name: Temporary final publication verification

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  verify:
    if: github.event.issue.title == '[diagnostic] final publication verification 2026-08-01'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify every deployed HTML page and live sitemap
        env:
          AUDIT_NONCE: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import concurrent.futures, hashlib, json, os, re, subprocess
          import urllib.error, urllib.parse, urllib.request
          import xml.etree.ElementTree as ET
          from html.parser import HTMLParser
          from pathlib import Path

          root=Path('.').resolve(); base='https://healthrenewal.org/'
          old='https://khaledaltheeb.github.io/pterminology-site'; new='https://healthrenewal.org'
          nonce=os.environ.get('AUDIT_NONCE','final')
          skip_top={'.git','.github','node_modules','.venv','venv','dist','build','scripts','tests','docs','reports','content','.v10bundle','.generator-v6','_site'}
          skip_parts={'account-backend','backend','migrations'}
          verify_name=re.compile(r'^(?:google[a-z0-9_-]+|bing[a-z0-9_-]+|yandex_[a-z0-9_-]+)\.html$',re.I)

          class P(HTMLParser):
            def __init__(self):
              super().__init__(convert_charrefs=True); self.robots=[]; self.canonical=[]
            def handle_starttag(self,tag,attrs):
              a={str(k).lower():(v or '') for k,v in attrs}
              if tag.lower()=='meta' and a.get('name','').lower() in {'robots','googlebot','bingbot'}: self.robots.append(a.get('content',''))
              if tag.lower()=='link' and 'canonical' in a.get('rel','').lower().split() and a.get('href'): self.canonical.append(a['href'])

          def meta(data):
            p=P(); p.feed(data.decode('utf-8',errors='replace')); return p
          def public(p):
            rel=p.relative_to(root)
            return bool(rel.parts) and rel.parts[0] not in skip_top and not any(x in skip_parts for x in rel.parts)
          def url_for(p):
            rel=p.relative_to(root).as_posix()
            if rel=='index.html': return base
            if rel.endswith('/index.html'): return base+rel[:-10]
            return base+rel
          def norm(u):
            x=urllib.parse.urlsplit(u); path=x.path or '/'
            if path.endswith('/index.html'): path=path[:-10]
            return urllib.parse.urlunsplit((x.scheme.lower(),x.netloc.lower(),path,'',''))
          def transformed(data):
            try: return data.decode('utf-8').replace(old,new).encode('utf-8')
            except UnicodeDecodeError: return data
          def fetch(u):
            x=urllib.parse.urlsplit(u); q=urllib.parse.parse_qsl(x.query,keep_blank_values=True); q.append(('final_audit',nonce))
            target=urllib.parse.urlunsplit((x.scheme,x.netloc,x.path,urllib.parse.urlencode(q),x.fragment))
            req=urllib.request.Request(target,headers={'User-Agent':'healthrenewal-final-audit/2.0','Cache-Control':'no-cache, no-store','Pragma':'no-cache'})
            try:
              with urllib.request.urlopen(req,timeout=35) as r: return int(r.status),r.read(),r.geturl(),None
            except urllib.error.HTTPError as e:
              try: body=e.read()
              except Exception: body=b''
              return int(e.code),body,e.geturl(),f'HTTP {e.code}'
            except Exception as e: return 0,b'',target,repr(e)
          def sitemap_urls():
            pending=[base+'sitemap.xml',base+'sitemap-index.xml']; seen=set(); urls=set(); docs=[]
            while pending:
              u=pending.pop(0)
              if u in seen: continue
              seen.add(u); status,body,_,err=fetch(u); docs.append({'url':u,'status':status,'error':err})
              if status!=200: continue
              try: doc=ET.fromstring(body)
              except Exception as e: docs[-1]['parse_error']=repr(e); continue
              kind=doc.tag.split('}',1)[-1]
              locs=[n.text.strip() for n in doc.iter() if n.tag.split('}',1)[-1]=='loc' and n.text]
              if kind=='urlset': urls.update(norm(x) for x in locs)
              elif kind=='sitemapindex': pending.extend(x for x in locs if x.startswith(base))
            return urls,docs

          html=sorted(p for p in root.rglob('*.html') if p.is_file() and public(p))
          records=[]
          for p in html:
            data=p.read_bytes(); m=meta(data); rel=p.relative_to(root).as_posix(); robots=' '.join(m.robots).lower()
            if rel=='404.html': kind='error'
            elif len(p.relative_to(root).parts)==1 and verify_name.fullmatch(p.name): kind='verification'
            else: kind='page'
            records.append({'path':rel,'url':url_for(p),'kind':kind,'noindex':'noindex' in robots,'expected':transformed(data)})

          sm,sm_docs=sitemap_urls()
          with concurrent.futures.ThreadPoolExecutor(max_workers=16) as ex: live=list(ex.map(lambda r: fetch(r['url']),records))

          problems={k:[] for k in ['unreachable','content_mismatch','missing_from_sitemap','noindex_in_sitemap','live_noindex_conflict','canonical_problem','legacy_canonical']}
          indexable=0; noindex=0; exact=0; reachable=0
          for rec,(status,body,final,err) in zip(records,live):
            url=norm(rec['url']); accepted={200,404} if rec['kind']=='error' else {200}
            if status in accepted: reachable+=1
            else: problems['unreachable'].append({'path':rec['path'],'url':rec['url'],'status':status,'accepted':sorted(accepted),'error':err,'final':final})
            if hashlib.sha256(rec['expected']).hexdigest()==hashlib.sha256(body).hexdigest(): exact+=1
            else: problems['content_mismatch'].append({'path':rec['path'],'url':rec['url'],'status':status,'expected_bytes':len(rec['expected']),'live_bytes':len(body)})
            lm=meta(body); live_robots=' '.join(lm.robots).lower(); canonical=lm.canonical[0].strip() if lm.canonical else ''
            if rec['kind']=='page':
              if rec['noindex']:
                noindex+=1
                if url in sm: problems['noindex_in_sitemap'].append({'path':rec['path'],'url':rec['url']})
              else:
                indexable+=1
                if url not in sm: problems['missing_from_sitemap'].append({'path':rec['path'],'url':rec['url']})
                if 'noindex' in live_robots: problems['live_noindex_conflict'].append({'path':rec['path'],'url':rec['url'],'robots':lm.robots})
                if canonical and norm(canonical)!=url: problems['canonical_problem'].append({'path':rec['path'],'url':rec['url'],'canonical':canonical})
            if canonical and 'khaledaltheeb.github.io/pterminology-site' in canonical: problems['legacy_canonical'].append({'path':rec['path'],'url':rec['url'],'canonical':canonical})

          critical=sum(len(v) for v in problems.values())
          report={
            'status':'passed' if critical==0 else 'failed',
            'head_sha':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
            'public_html_files':len(html),'user_pages':sum(r['kind']=='page' for r in records),
            'indexable_pages':indexable,'noindex_pages':noindex,
            'verification_files':sum(r['kind']=='verification' for r in records),
            'error_pages':sum(r['kind']=='error' for r in records),
            'reachable':reachable,'exact_content_matches':exact,
            'live_sitemap_urls':len(sm),'sitemap_documents':sm_docs,
            'critical_problem_count':critical,
            'problem_counts':{k:len(v) for k,v in problems.items()},
            'problems':{k:v[:80] for k,v in problems.items()},
          }
          lines=['## Final publication verification','',f"Status: **{report['status']}**",'',
            f"- Main commit: `{report['head_sha']}`",f"- Public HTML files: **{len(html)}**",f"- User-facing pages: **{report['user_pages']}**",
            f"- Indexable pages: **{indexable}**",f"- Noindex pages: **{noindex}**",f"- Technical verification files: **{report['verification_files']}**",
            f"- Error pages: **{report['error_pages']}**",f"- Reachable with accepted HTTP status: **{reachable}/{len(html)}**",
            f"- Exact repository-to-live matches: **{exact}/{len(html)}**",f"- Live sitemap URLs: **{len(sm)}**",f"- Critical problems: **{critical}**",'', '### Problem counts','']
          lines += [f'- `{k}`: **{len(v)}**' for k,v in problems.items()]
          for k,v in problems.items():
            if v: lines += ['',f'### {k}','','```json',json.dumps(v[:40],ensure_ascii=False,indent=2)[:12000],'```']
          Path('/tmp/final-report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          Path('/tmp/final-body.json').write_text(json.dumps({'body':'\n'.join(lines)}),encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          if critical: raise SystemExit(1)
          PY

      - name: Publish final verification
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          if [ ! -f /tmp/final-body.json ]; then printf '%s' '{"body":"## Final publication verification\n\nVerification failed before producing a report."}' >/tmp/final-body.json; fi
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            --data-binary @/tmp/final-body.json
