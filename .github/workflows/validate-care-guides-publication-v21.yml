name: Validate published care guides v21

on:
  pull_request:
    branches: ["main"]
    paths:
      - "care-guides/**"
      - "content/**/care-guide*.json"
      - "content/**/care-guides/**"
      - "scripts/*care_guides*.py"
      - "scripts/*care-guide*.py"
      - "assets/js/care-guides-v234.js"
      - "tests/test_care_guides_v234.py"
      - ".github/workflows/validate-care-guides-publication-v21.yml"
  push:
    branches: ["main"]
    paths:
      - "care-guides/**"
      - "content/**/care-guide*.json"
      - "content/**/care-guides/**"
      - "scripts/*care_guides*.py"
      - "scripts/*care-guide*.py"
      - "assets/js/care-guides-v234.js"
      - "tests/test_care_guides_v234.py"
      - ".github/workflows/validate-care-guides-publication-v21.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-care-guides-publication:
    runs-on: ubuntu-latest
    env:
      SITE_BASE: https://healthrenewal.org/
    steps:
      - uses: actions/checkout@v4
      - name: Restore and compile production sources
        run: |
          set -euxo pipefail
          mkdir -p /tmp/v10-content
          cp content/sectors-v10/*.json /tmp/v10-content/
          cat .v10bundle/part00 .v10bundle/part01 .v10bundle/part02 .v10bundle/part03 .v10bundle/part04 | base64 --decode > /tmp/v10.tar.gz
          tar -xzf /tmp/v10.tar.gz
          cp /tmp/v10-content/*.json content/sectors-v10/
          cat .generator-v6/part00 .generator-v6/part01 .generator-v6/part02 .generator-v6/part03 > build_site.py
          python scripts/verify_enricher_v7.py
          python scripts/verify_expander_v9.py
          python -m py_compile build_site.py expand_site_v9.py scripts/scale_site_v8.py scripts/design_content_v10.py scripts/apply_contrast_v11.py scripts/expand_v12_direct.py scripts/rebuild_encyclopedia_v13.py scripts/run_encyclopedia_v13.py scripts/performance_hotfix_v14.py scripts/optimize_site_performance_v14.py scripts/strip_nonlab_runtime_v14.py scripts/finalize_pwa_v14.py scripts/audit_site_integrity_v13.py scripts/verify_performance_v14.py scripts/complete_core_sections_v15.py scripts/verify_core_sections_v15.py scripts/polish_site_v16.py scripts/audit_full_site_v16.py scripts/audit_full_site_i18n_v72.py scripts/apply_homepage_v20.py scripts/publish_homepage_i18n_v72.py scripts/publish_care_guides_v21.py scripts/enhance_care_guides_v234.py scripts/verify_care_guides_publication_v234.py scripts/link_care_guides_v21.py scripts/publish_special_needs_hub_v201.py scripts/audit_content_targets_v201.py scripts/enforce_platform_identity_v201.py tests/test_care_guides_v234.py
          node --check assets/js/care-guides-v234.js
      - name: Build exact production output
        run: |
          set +e
          set -o pipefail
          {
            set -eux
            python build_site.py
            python enrich_site_v7.py
            cp google644f1f7a8b7aaa2b.html _site/google644f1f7a8b7aaa2b.html
            python scripts/scale_site_v8.py
            python expand_site_v9.py
            python scripts/design_content_v10.py
            python scripts/apply_contrast_v11.py _site
            python scripts/expand_v12_direct.py _site
            python scripts/run_encyclopedia_v13.py _site
            python scripts/performance_hotfix_v14.py _site
            python scripts/optimize_site_performance_v14.py _site
            python scripts/strip_nonlab_runtime_v14.py _site
            python scripts/finalize_pwa_v14.py _site
            python scripts/complete_core_sections_v15.py _site
            python scripts/apply_homepage_v20.py _site
            python scripts/publish_care_guides_v21.py _site
            python scripts/link_care_guides_v21.py _site
            python scripts/polish_site_v16.py _site
            python scripts/enforce_platform_identity_v201.py _site
            python scripts/audit_site_integrity_v13.py _site
          } 2>&1 | tee /tmp/care-guides-build-v201.log
          status=${PIPESTATUS[0]}
          exit $status
      - name: Verify guides discovery SEO safety and integration
        run: |
          set +e
          set -o pipefail
          {
            set -eux
            python scripts/verify_care_guides_v18.py
            python -m unittest -v tests.test_care_guides_v234
            python scripts/verify_care_guides_publication_v234.py _site
            python scripts/verify_performance_v14.py _site
            python scripts/verify_core_sections_v15.py _site
            python scripts/audit_full_site_i18n_v72.py _site
          } 2>&1 | tee /tmp/care-guides-verify-v234.log
          status=${PIPESTATUS[0]}
          exit $status
      - name: Upload care-guide publication reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: care-guides-v21-audit
          path: |
            _site/api/care-guides-v21.json
            _site/api/care-guides-v234.json
            _site/api/care-guides-publication-verification-v234.json
            _site/api/care-guides-homepage-v21.json
            _site/api/site-integrity-v13.json
            _site/api/full-site-audit-v16.json
            _site/api/platform-identity-v201.json
            _site/api/content-targets-v201.json
            _site/api/special-needs-hub-v201.json
            _site/care-guides/
            /tmp/care-guides-build-v201.log
            /tmp/care-guides-verify-v234.log
          if-no-files-found: warn
          retention-days: 14
