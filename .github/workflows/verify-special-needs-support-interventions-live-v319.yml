name: Verify special-needs support intervention guides live v319

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/verify-special-needs-support-interventions-live-v319.yml"
  workflow_run:
    workflows: ["Deploy validated main to GitHub Pages"]
    types: [completed]
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: special-needs-support-interventions-live-v319-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  static-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate v319 live workflow contract
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/verify-special-needs-support-interventions-live-v319.yml')
          text = path.read_text(encoding='utf-8')
          required = (
              'Deploy validated main to GitHub Pages',
              'MINIMUM_SHA: f728bbbd9758cbfe8eee70bc92511180df7f140e',
              'special-needs/autism-evidence-based-support-plan/',
              'special-needs/down-syndrome-development-communication-independence/',
              'special-needs-support-interventions-v318.json',
              'support_intervention_guides_contract',
              'data-support-guide="autism-evidence-based-support-plan"',
              'data-support-guide="down-syndrome-development-communication-independence"',
              'لا توجد متطلبات مسبقة لاستخدام AAC',
              'لا تستخدم الخلب أو الأكسجين عالي الضغط أو السيكريتين',
              'الاستقلال ليس غياب الدعم',
              'sitemap-special-needs.xml',
          )
          missing = [marker for marker in required if marker not in text]
          assert not missing, missing
          print({'workflow': path.name, 'required_markers': len(required), 'status': 'static-contract-passed'})
          PY

  live-publication:
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: https://healthrenewal.org/
      MINIMUM_SHA: f728bbbd9758cbfe8eee70bc92511180df7f140e
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Wait for a non-rollback deployment containing v318
        run: |
          set -euo pipefail
          matched=0
          for i in $(seq 1 90); do
            token="${MINIMUM_SHA}-${i}-$(date +%s)"
            if curl --retry 2 --retry-delay 2 -H 'Cache-Control: no-cache' -fsSL "${BASE_URL}deployment.json?v=${token}" -o /tmp/deployment.json; then
              if python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path

          deployment = json.loads(Path('/tmp/deployment.json').read_text(encoding='utf-8'))
          live = deployment.get('commit')
          minimum = os.environ['MINIMUM_SHA']
          assert isinstance(live, str) and len(live) == 40, deployment
          if live == minimum:
              raise SystemExit(0)
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/compare/{minimum}...{live}",
              headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'special-needs-support-interventions-live-v319',
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  status = json.loads(response.read().decode('utf-8')).get('status')
          except urllib.error.HTTPError:
              raise SystemExit(1)
          raise SystemExit(0 if status in {'ahead', 'identical'} else 1)
          PY
              then
                matched=1
                break
              fi
            fi
            sleep 10
          done
          test "${matched}" -eq 1

      - name: Download live support pages parent pages reports and sitemap
        run: |
          set -euxo pipefail
          token="${MINIMUM_SHA}-live-$(date +%s)"
          curl --retry 6 --retry-delay 4 -H 'Cache-Control: no-cache' -fsSL "${BASE_URL}special-needs/autism-evidence-based-support-plan/?v=${token}" -o /tmp/autism-support.html
          curl --retry 6 --retry-delay 4 -H 'Cache-Control: no-cache' -fsSL "${BASE_URL}special-needs/down-syndrome-development-communication-independence/?v=${token}" -o /tmp/down-support.html
          curl --retry 6 --retry-delay 4 -H 'Cache-Control: no-cache' -fsSL "${BASE_URL}special-needs/autism/?v=${token}" -o /tmp/autism-parent.html
          curl --retry 6 --retry-delay 4 -H 'Cache-Control: no-cache' -fsSL "${BASE_URL}special-needs/down-syndrome/?v=${token}" -o /tmp/down-parent.html
          curl --retry 6 --retry-delay 4 -H 'Cache-Control: no-cache' -fsSL "${BASE_URL}api/special-needs-support-interventions-v318.json?v=${token}" -o /tmp/support.json
          curl --retry 6 --retry-delay 4 -H 'Cache-Control: no-cache' -fsSL "${BASE_URL}api/special-needs-guides-v221.json?v=${token}" -o /tmp/central.json
          curl --retry 6 --retry-delay 4 -H 'Cache-Control: no-cache' -fsSL "${BASE_URL}sitemap-special-needs.xml?v=${token}" -o /tmp/sitemap.xml

      - name: Enforce live support evidence safety discovery and review contracts
        run: |
          set -euxo pipefail
          python - <<'PY'
          import json
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          base = 'https://healthrenewal.org/'
          report = json.loads(Path('/tmp/support.json').read_text(encoding='utf-8'))
          central = json.loads(Path('/tmp/central.json').read_text(encoding='utf-8'))
          pages = {
              'autism-evidence-based-support-plan': Path('/tmp/autism-support.html').read_text(encoding='utf-8'),
              'down-syndrome-development-communication-independence': Path('/tmp/down-support.html').read_text(encoding='utf-8'),
          }
          parents = {
              'autism-evidence-based-support-plan': Path('/tmp/autism-parent.html').read_text(encoding='utf-8'),
              'down-syndrome-development-communication-independence': Path('/tmp/down-parent.html').read_text(encoding='utf-8'),
          }

          assert report['version'] == 318 and report['status'] == 'passed', report
          assert report['review_status'] == 'internally-reviewed-external-clinical-review-required'
          assert report['external_clinical_review_completed'] is False
          assert report['guide_count'] == 2
          assert report['section_count'] == 10
          assert report['source_count'] == 9
          assert report['plan_step_count'] == 10
          assert report['urgent_item_count'] == 6
          assert report['parent_links_added'] == 2
          assert report['sitemap_registered'] is True
          assert report['next_review_due'] == '2027-01-27'

          assert central['status'] == 'passed'
          assert central['support_intervention_guides_contract'] == 318
          embedded = central['condition_hubs']['support_interventions']
          for key in ('guide_count', 'guide_slugs', 'section_count', 'source_count', 'plan_step_count', 'urgent_item_count', 'parent_links_added', 'next_review_due'):
              assert embedded[key] == report[key], (key, embedded.get(key), report.get(key))
          assert embedded['external_clinical_review_completed'] is False

          expected_sources = {
              'autism-evidence-based-support-plan': ('source-AI1', 'source-AI2', 'source-AI3', 'source-AI4'),
              'down-syndrome-development-communication-independence': ('source-DI1', 'source-DI2', 'source-DI3', 'source-DI4', 'source-DI5'),
          }
          for slug, text in pages.items():
              assert text.count('<h1') == 1, slug
              assert text.count('class="section-card"') == 5, slug
              assert 'MedicalWebPage' in text and 'BreadcrumbList' in text, slug
              assert 'لم تكتمل مراجعة سريرية خارجية مستقلة' in text, slug
              assert '2027-01-27' in text, slug
              ids = re.findall(r'\bid="([^"]+)"', text)
              assert len(ids) == len(set(ids)), (slug, ids)
              for source_id in expected_sources[slug]:
                  assert f'id="{source_id}"' in text, (slug, source_id)
              parent = parents[slug]
              assert parent.count(f'data-support-guide="{slug}"') == 1, slug
              assert parent.count(f'/special-needs/{slug}/') == 1, slug

          autism = pages['autism-evidence-based-support-plan']
          assert 'لا توجد متطلبات مسبقة لاستخدام AAC' in autism
          assert 'لا تستخدم الخلب أو الأكسجين عالي الضغط أو السيكريتين' in autism
          assert 'لا تنطبق مخاوف وقت الشاشة المعتادة' in autism
          down = pages['down-syndrome-development-communication-independence']
          assert 'لا يوجد علاج موحد لمتلازمة داون' in down
          assert 'الاستقلال ليس غياب الدعم' in down
          assert 'لا تفترض أنه جزء طبيعي من متلازمة داون' in down

          sitemap_urls = [
              (node.text or '').strip()
              for node in ET.parse('/tmp/sitemap.xml').getroot().findall('{*}url/{*}loc')
              if node.text
          ]
          for slug in pages:
              assert sitemap_urls.count(base + f'special-needs/{slug}/') == 1, slug
          assert len(sitemap_urls) == len(set(sitemap_urls))

          deployment = json.loads(Path('/tmp/deployment.json').read_text(encoding='utf-8'))
          print({
              'live_commit': deployment.get('commit'),
              'support_guides': report['guide_count'],
              'sections': report['section_count'],
              'sources': report['source_count'],
              'parent_links': report['parent_links_added'],
              'status': 'special-needs-support-interventions-live-v319-verified',
          })
          PY
