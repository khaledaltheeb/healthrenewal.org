name: Patch production daily-tools contract v100

on:
  push:
    branches: ["fix/production-daily-tools-v100"]
    paths:
      - ".github/workflows/patch-production-daily-tools-v100.yml"

permissions:
  contents: write

concurrency:
  group: patch-production-daily-tools-v100
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace stale production counts with catalog contract
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/validate-all-labs-v22.yml')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'test "$(find _site/daily-tools -name index.html | wc -l)" -eq 9': 'test "$(find _site/daily-tools -name index.html | wc -l)" -eq 101',
              'test "$(find _site/learning-paths -name index.html | wc -l)" -eq 5': 'test "$(find _site/learning-paths -name index.html | wc -l)" -eq 11',
              'test "$(grep -o \'<url>\' _site/sitemap-tools-paths.xml | wc -l)" -eq 14': 'test "$(grep -o \'<url>\' _site/sitemap-tools-paths.xml | wc -l)" -eq 112',
              "assert daily['tools']==8 and daily['paths']==4 and daily['pages']==14 and daily['local_only'] is True,daily": "assert daily['catalog_contract']==100 and daily['tools']>=100 and daily['categories']>=10 and daily['paths']>=10 and daily['pages']==daily['tools']+daily['paths']+2 and daily['local_only'] is True and daily['search_and_filters'] is True and daily['per_tool_sources'] is True,daily",
              "print({'site':'passed','cognitive':'53/53','assessments':'40/40','browser':'186/186','daily_tools':'8/8','learning_paths':'4/4','quality_pages':quality['pages_scanned'],'thin_candidates':quality['thin_page_candidates'],'pwa_pages':pwa['pages_scanned'],'identity_pages':identity['pages'],'homepage_lab_tools':homepage['lab_tool_count']})": "print({'site':'passed','cognitive':'53/53','assessments':'40/40','browser':'186/186','daily_tools':daily['tools'],'daily_categories':daily['categories'],'learning_paths':daily['paths'],'daily_pages':daily['pages'],'quality_pages':quality['pages_scanned'],'thin_candidates':quality['thin_page_candidates'],'pwa_pages':pwa['pages_scanned'],'identity_pages':identity['pages'],'homepage_lab_tools':homepage['lab_tool_count']})",
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one production marker, found {count}: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          rm -f .github/workflows/patch-production-daily-tools-v100.yml
          git diff --check

      - name: Commit production contract repair
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "إصلاح عقد الإنتاج لكتالوج الأدوات المئة"
          git push origin HEAD:fix/production-daily-tools-v100
