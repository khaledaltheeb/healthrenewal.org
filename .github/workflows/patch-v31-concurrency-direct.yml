# Triggered through a merged PR so GitHub emits a trusted push event.
name: Apply v31 concurrency directly

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-v31-concurrency-direct.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch validated production workflow
        run: |
          python - <<'PY'
          from pathlib import Path

          target = Path('.github/workflows/validate-all-labs-v22.yml')
          text = target.read_text(encoding='utf-8')
          marker = 'concurrency:\n  group: validate-all-labs-v31-main\n  cancel-in-progress: true\n'
          if marker not in text:
              anchor = 'env:\n  SITE_BASE: https://healthrenewal.org/\n\njobs:\n'
              replacement = 'env:\n  SITE_BASE: https://healthrenewal.org/\n\n' + marker + '\njobs:\n'
              if anchor not in text:
                  raise SystemExit('v31 workflow anchor is missing')
              target.write_text(text.replace(anchor, replacement, 1), encoding='utf-8')

          for relative in (
              '.github/workflows/patch-v31-concurrency-once.yml',
              '.github/workflows/patch-v31-concurrency-direct.yml',
          ):
              path = Path(relative)
              if path.exists():
                  path.unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows
          git commit -m "ci: serialize validated production builds v31"
          git pull --rebase origin main
          git push origin HEAD:main
