name: Inspect observable Pages deploy v324

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/inspect-observable-deploy-v324.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: List default-branch deploy runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          repo=os.environ['GITHUB_REPOSITORY']
          request=urllib.request.Request(
              f'https://api.github.com/repos/{repo}/actions/workflows/deploy-observable-pages-v324.yml/runs?per_page=20',
              headers={
                  'Authorization':f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept':'application/vnd.github+json',
                  'X-GitHub-Api-Version':'2022-11-28',
                  'User-Agent':'observable-deploy-inspector-v324',
              },
          )
          with urllib.request.urlopen(request,timeout=30) as response:
              runs=json.loads(response.read().decode('utf-8')).get('workflow_runs',[])
          compact=[{
              'id':run.get('id'),
              'event':run.get('event'),
              'status':run.get('status'),
              'conclusion':run.get('conclusion'),
              'head_sha':run.get('head_sha'),
              'run_number':run.get('run_number'),
              'created_at':run.get('created_at'),
              'updated_at':run.get('updated_at'),
          } for run in runs]
          print(json.dumps({'count':len(compact),'runs':compact},ensure_ascii=False,indent=2))
          if not compact:
              raise SystemExit('No deploy-observable-pages-v324 workflow_run executions found')
          PY
