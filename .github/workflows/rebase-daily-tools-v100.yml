name: Rebase daily tools v100 onto current main

on:
  push:
    branches: ["agent/daily-tools-v100-current-main"]
    paths:
      - ".github/workflows/rebase-daily-tools-v100.yml"

permissions:
  contents: write

concurrency:
  group: rebase-daily-tools-v100-current-main
  cancel-in-progress: true

jobs:
  copy-tested-files:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy validated daily-tools files
        run: |
          set -euxo pipefail
          git fetch origin agent/daily-tools-v100
          git checkout origin/agent/daily-tools-v100 -- \
            .github/workflows/expose-hidden-collections-v216.yml \
            .github/workflows/validate-daily-tools-v24.yml \
            .github/workflows/validate-tool-trust-v63.yml \
            content/v24/daily-tools-sources-v100.json \
            content/v24/daily-tools-v100/01-stress.json \
            content/v24/daily-tools-v100/02-thoughts.json \
            content/v24/daily-tools-v100/03-sleep.json \
            content/v24/daily-tools-v100/04-focus.json \
            content/v24/daily-tools-v100/05-relationships.json \
            content/v24/daily-tools-v100/06-family.json \
            content/v24/daily-tools-v100/07-caregiver.json \
            content/v24/daily-tools-v100/08-inclusive.json \
            content/v24/daily-tools-v100/09-change.json \
            content/v24/daily-tools-v100/10-safety.json \
            scripts/audit_daily_tools_quality_v100.py \
            scripts/daily_tools_v100.py \
            scripts/expose_daily_tools_home_v219.py \
            scripts/publish_daily_tools_v24.py \
            scripts/verify_daily_tools_v24.py
          rm -f .github/workflows/rebase-daily-tools-v100.yml
          git diff --check

      - name: Commit rebased daily-tools files
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "إعادة تطبيق مكتبة الأدوات المئة فوق أحدث main"
          git push origin HEAD:agent/daily-tools-v100-current-main
