name: Synchronize magazine v320 with current main temporary

on:
  push:
    branches: ["agent/magazine-aspen-v320"]
    paths:
      - ".github/workflows/sync-magazine-v320-temporary.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/magazine-aspen-v320
          fetch-depth: 0
      - name: Merge latest main without automatic conflict resolution
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git merge --no-edit origin/main
          python -m py_compile scripts/publish_magazine_v201.py tests/test_magazine_research_v234.py tests/test_magazine_routes_v201.py tests/test_platform_identity_v201.py
          git push origin HEAD:agent/magazine-aspen-v320
