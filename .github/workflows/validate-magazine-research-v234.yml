name: Validate magazine continuous research v322

on:
  pull_request:
    paths:
      - 'magazine/**'
      - 'scripts/publish_magazine_v201.py'
      - 'scripts/enforce_platform_identity_v201.py'
      - 'tests/test_magazine_research_v234.py'
      - 'tests/test_platform_identity_v201.py'
      - '.github/workflows/validate-magazine-research-v234.yml'
      - '.github/workflows/verify-magazine-live-v314.yml'
  push:
    branches: [main]
    paths:
      - 'magazine/**'
      - 'scripts/publish_magazine_v201.py'
      - 'scripts/enforce_platform_identity_v201.py'
      - 'tests/test_magazine_research_v234.py'
      - 'tests/test_platform_identity_v201.py'
      - '.github/workflows/validate-magazine-research-v234.yml'
      - '.github/workflows/verify-magazine-live-v314.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile publisher and tests
        run: python -m py_compile scripts/publish_magazine_v201.py scripts/enforce_platform_identity_v201.py tests/test_magazine_research_v234.py tests/test_platform_identity_v201.py
      - name: Verify automatic inventory chronological index and RSS
        run: |
          python - <<'PY'
          import importlib.util
          import sys
          import xml.etree.ElementTree as ET
          from email.utils import parsedate_to_datetime
          from pathlib import Path

          path = Path('scripts/publish_magazine_v201.py')
          spec = importlib.util.spec_from_file_location('magazine_v322_inventory', path)
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          pages = module.article_files()
          assert module.CONTRACT == 315
          assert module.TARGET_ARTICLES == 100
          assert len(pages) == 73, [page.name for page in pages]
          dates = [module.article_date(page) for page in pages]
          assert dates == sorted(dates, reverse=True), dates
          index = module.render_index(pages)
          feed = module.render_feed(pages)
          root = ET.fromstring(feed)
          items = root.findall('./channel/item')
          assert index.count('class="card"') == 73
          assert index.count('"@type":"ScholarlyArticle"') == 73
          assert index.count('"datePublished"') == 73
          assert '"numberOfItems":73' in index
          assert 'الهدف المرحلي 100 قراءة' in index
          assert 'المتبقي 27' in index
          assert index.count('type="application/rss+xml"') == 1
          assert len(items) == 20
          links = [item.findtext('link') for item in items]
          assert links == [module.URL + page.name for page in pages[:20]], links
          feed_dates = [parsedate_to_datetime(item.findtext('pubDate')) for item in items]
          assert feed_dates == sorted(feed_dates, reverse=True), feed_dates
          assert parsedate_to_datetime(root.findtext('./channel/lastBuildDate')) == feed_dates[0]
          for page in pages:
              assert index.count(f'href="{page.name}"') >= 2, page.name
              assert module.URL + page.name in index, page.name
          print({'articles': len(pages), 'generated_cards': 73, 'rss_items': 20, 'target': 100, 'remaining': 27, 'chronological': True, 'unwired': 0})
          PY
      - name: Run deterministic magazine tests
        run: python -m unittest tests.test_magazine_research_v234 -v
      - name: Run production integration tests
        run: python -m unittest tests.test_platform_identity_v201 -v
      - name: Verify scientific source contracts for new readings
        run: |
          set -euxo pipefail
          test "$(find magazine -maxdepth 1 -name '*-2025.html' | wc -l)" -eq 10
          test "$(find magazine -maxdepth 1 -name '*-2026.html' | wc -l)" -eq 63
          test "$(find magazine -maxdepth 1 -name '*-20*.html' | wc -l)" -eq 73
          grep -q '10.3389/fpubh.2026.1808386' magazine/adhd-rhythmic-music-game-rct-2026.html
          grep -q '42145502' magazine/adhd-rhythmic-music-game-rct-2026.html
          grep -q '−46.1' magazine/adhd-rhythmic-music-game-rct-2026.html
          grep -q 'لا تثبت أن الألعاب الموسيقية تشفي ADHD' magazine/adhd-rhythmic-music-game-rct-2026.html
          grep -q '10.1080/07434618.2025.2479768' magazine/autism-speech-generating-devices-systematic-review-2025.html
          grep -q '40164143' magazine/autism-speech-generating-devices-systematic-review-2025.html
          grep -q '20 دراسة' magazine/autism-speech-generating-devices-systematic-review-2025.html
          grep -q '14 دراسة استهدفت الطلب' magazine/autism-speech-generating-devices-systematic-review-2025.html
          grep -q 'لا تثبت أن جهازًا أو تطبيقًا تجاريًا محددًا هو الأفضل' magazine/autism-speech-generating-devices-systematic-review-2025.html
          grep -q '10.1111/dmcn.70066' magazine/down-syndrome-secondary-school-placement-systematic-review-2026.html
          grep -q '41189050' magazine/down-syndrome-secondary-school-placement-systematic-review-2026.html
          grep -q '4,458' magazine/down-syndrome-secondary-school-placement-systematic-review-2026.html
          grep -q '246 يافعًا' magazine/down-syndrome-secondary-school-placement-systematic-review-2026.html
          grep -q 'لا تثبت المراجعة أن نوعًا واحدًا من المدارس هو الأفضل' magazine/down-syndrome-secondary-school-placement-systematic-review-2026.html
          grep -q 'TARGET_ARTICLES = 100' scripts/publish_magazine_v201.py
          grep -q 'continuous_publication_policy' scripts/publish_magazine_v201.py
          grep -q 'latest-twenty-sorted-by-datePublished' scripts/publish_magazine_v201.py
          grep -q 'article_dates' scripts/publish_magazine_v201.py
          grep -q 'SOURCE_LINK_PATTERN' scripts/publish_magazine_v201.py
          grep -q 'published = report.get("research_summaries_published")' scripts/enforce_platform_identity_v201.py
          grep -q 'Magazine production index contract failed for' scripts/enforce_platform_identity_v201.py
          ! grep -R -E 'علاج مضمون|يشخّص|نتائج مؤكدة للجميع' magazine
