name: Validate magazine and research v234

on:
  pull_request:
    paths:
      - 'magazine/**'
      - 'scripts/publish_magazine_v201.py'
      - 'tests/test_magazine_research_v234.py'
      - '.github/workflows/validate-magazine-research-v234.yml'
  push:
    branches: [main]
    paths:
      - 'magazine/**'
      - 'scripts/publish_magazine_v201.py'
      - 'tests/test_magazine_research_v234.py'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile publisher and tests
        run: python -m py_compile scripts/publish_magazine_v201.py tests/test_magazine_research_v234.py
      - name: Verify automatic source inventory
        run: |
          python - <<'PY'
          import importlib.util
          import sys
          from pathlib import Path
          path = Path('scripts/publish_magazine_v201.py')
          spec = importlib.util.spec_from_file_location('magazine_v234_inventory', path)
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          pages = module.article_files()
          assert len(pages) == 40, [page.name for page in pages]
          index = Path('magazine/index.html').read_text(encoding='utf-8')
          assert index.count('class="card"') == 40
          assert '"numberOfItems":40' in index
          for page in pages:
              assert index.count(f'href="{page.name}"') >= 2, page.name
              assert module.URL + page.name in index, page.name
          print({'articles': len(pages), 'unwired': 0})
          PY
      - name: Run deterministic magazine tests
        run: python -m unittest tests.test_magazine_research_v234 -v
      - name: Verify source contracts
        run: |
          set -euo pipefail
          test "$(find magazine -maxdepth 1 -name '*-2025.html' | wc -l)" -eq 9
          test "$(find magazine -maxdepth 1 -name '*-2026.html' | wc -l)" -eq 31
          test "$(find magazine -maxdepth 1 -name '*-20*.html' | wc -l)" -eq 40
          test "$(grep -o 'class="card"' magazine/index.html | wc -l)" -eq 40
          grep -q '"numberOfItems":40' magazine/index.html
          grep -q '10.1038/s41746-026-02719-x' magazine/aya-cancer-digital-mental-health-meta-analysis-2026.html
          grep -q '10.1038/s41746-026-02706-2' magazine/adolescent-passive-smartphone-sensing-meta-analysis-2026.html
          grep -q '10.1038/s41746-026-02341-x' magazine/youth-transdiagnostic-internet-rct-2026.html
          grep -q '10.1186/s12913-026-14374-9' magazine/down-syndrome-telehealth-systematic-review-2026.html
          grep -q '10.1038/s44220-026-00616-6' magazine/homeless-youth-mental-disorders-meta-analysis-2026.html
          grep -q '10.1177/10870547251364578' magazine/adhd-school-social-skills-meta-analysis-2026.html
          grep -q '10.1186/s13034-026-01132-2' magazine/autism-behavioral-domains-network-meta-analysis-2026.html
          grep -q '10.1038/s44184-026-00196-4' magazine/neurodivergent-university-mental-health-interventions-2026.html
          grep -q '10.1038/s41562-025-02162-0' magazine/mobile-stress-interventions-2025.html
          grep -q 'لم يجد التحليل التلوي آثارًا دالة' magazine/peer-led-adolescent-mental-health-2025.html
          grep -q 'unwired_research_pages' scripts/publish_magazine_v201.py
          grep -q 'SOURCE_LINK_PATTERN' scripts/publish_magazine_v201.py
          ! grep -R -E 'علاج مضمون|يشخّص|نتائج مؤكدة للجميع' magazine
