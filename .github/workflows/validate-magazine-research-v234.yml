name: Validate magazine continuous research v338

on:
  pull_request:
    paths:
      - 'magazine/**'
      - 'scripts/publish_magazine_v201.py'
      - 'scripts/enforce_platform_identity_v201.py'
      - 'tests/test_magazine_research_v234.py'
      - 'tests/test_platform_identity_v201.py'
      - '.github/workflows/validate-magazine-research-v234.yml'
      - '.github/workflows/verify-magazine-live-v314.yml'
  push:
    branches: [main]
    paths:
      - 'magazine/**'
      - 'scripts/publish_magazine_v201.py'
      - 'scripts/enforce_platform_identity_v201.py'
      - 'tests/test_magazine_research_v234.py'
      - 'tests/test_platform_identity_v201.py'
      - '.github/workflows/validate-magazine-research-v234.yml'
      - '.github/workflows/verify-magazine-live-v314.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile publisher and tests
        run: python -m py_compile scripts/publish_magazine_v201.py scripts/enforce_platform_identity_v201.py tests/test_magazine_research_v234.py tests/test_platform_identity_v201.py
      - name: Verify inventory and chronology smoke contract
        run: |
          python - <<'PY'
          import importlib.util
          import sys
          from pathlib import Path

          path = Path('scripts/publish_magazine_v201.py')
          spec = importlib.util.spec_from_file_location('magazine_v338_inventory', path)
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          pages = module.article_files()
          count = len(pages)
          dates = [module.article_date(page) for page in pages]
          assert module.CONTRACT >= 315, module.CONTRACT
          assert module.TARGET_ARTICLES == 100, module.TARGET_ARTICLES
          assert count >= 80, [page.name for page in pages]
          assert 'universal-digital-mental-health-youth-systematic-review-2026.html' in {page.name for page in pages}
          assert dates == sorted(dates, reverse=True), dates
          print({'contract': module.CONTRACT, 'articles': count, 'target': module.TARGET_ARTICLES, 'chronological': True})
          PY
      - name: Run deterministic inventory, index, RSS and sitemap tests
        run: python -m unittest tests.test_magazine_research_v234 -v
      - name: Run production integration tests
        run: python -m unittest tests.test_platform_identity_v201 -v
      - name: Verify new primary-study contract
        run: |
          set -euxo pipefail
          page=magazine/universal-digital-mental-health-youth-systematic-review-2026.html
          grep -q '10.1038/s41746-026-03044-z' "$page"
          grep -q 'INPLASY202490026' "$page"
          grep -q '57 دراسة' "$page"
          grep -q '43973' "$page"
          grep -q '9 من أصل 16' "$page"
          grep -q 'https://healthrenewal.org/magazine/' "$page"
          ! grep -q 'khaledaltheeb.github.io' "$page"
          ! grep -R -E 'علاج مضمون|يشخّص|نتائج مؤكدة للجميع' magazine
