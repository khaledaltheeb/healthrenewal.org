# Recursive evidence-first validation for Rawafid magazine research.
name: Validate magazine continuous research v202

on:
  pull_request:
    paths:
      - 'magazine/**'
      - 'data/magazine-*.json'
      - 'scripts/publish_magazine_v201.py'
      - 'scripts/publish_magazine_v202.py'
      - 'scripts/publish_magazine_bundle_v202.py'
      - 'scripts/audit_magazine_sources_v202.py'
      - 'scripts/verify_magazine_bibliography_v202.py'
      - 'scripts/apply_magazine_repository_overrides_v202.py'
      - 'scripts/repair_magazine_citation_integrity_v202.py'
      - 'scripts/apply_magazine_enrichments_v202.py'
      - 'scripts/enforce_platform_identity_v201.py'
      - 'tests/test_magazine_*.py'
      - 'tests/test_platform_identity_v201.py'
      - '.github/workflows/validate-magazine-research-v234.yml'
      - '.github/workflows/verify-magazine-live-v314.yml'
  push:
    branches: [main]
    paths:
      - 'magazine/**'
      - 'data/magazine-*.json'
      - 'scripts/publish_magazine_v201.py'
      - 'scripts/publish_magazine_v202.py'
      - 'scripts/publish_magazine_bundle_v202.py'
      - 'scripts/audit_magazine_sources_v202.py'
      - 'scripts/verify_magazine_bibliography_v202.py'
      - 'scripts/apply_magazine_repository_overrides_v202.py'
      - 'scripts/repair_magazine_citation_integrity_v202.py'
      - 'scripts/apply_magazine_enrichments_v202.py'
      - 'scripts/enforce_platform_identity_v201.py'
      - 'tests/test_magazine_*.py'
      - 'tests/test_platform_identity_v201.py'
      - '.github/workflows/validate-magazine-research-v234.yml'
      - '.github/workflows/verify-magazine-live-v314.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile v202 magazine contracts
        run: |
          python -m py_compile \
            scripts/publish_magazine_v201.py \
            scripts/publish_magazine_v202.py \
            scripts/publish_magazine_bundle_v202.py \
            scripts/audit_magazine_sources_v202.py \
            scripts/verify_magazine_bibliography_v202.py \
            scripts/apply_magazine_repository_overrides_v202.py \
            scripts/repair_magazine_citation_integrity_v202.py \
            scripts/apply_magazine_enrichments_v202.py \
            scripts/enforce_platform_identity_v201.py \
            tests/test_magazine_research_v234.py \
            tests/test_platform_identity_v201.py

      - name: Validate evidence registries
        run: |
          python -m json.tool data/magazine-source-overrides-v202.json >/dev/null
          python -m json.tool data/magazine-enrichments-v202-batch1.json >/dev/null
          python -m json.tool data/magazine-enrichments-v202-batch1-depth.json >/dev/null
          python -m json.tool data/magazine-enrichments-v202-batch2.json >/dev/null

      - name: Verify recursive inventory contract
        run: |
          python - <<'PY'
          import importlib.util, sys
          from pathlib import Path
          path = Path('scripts/audit_magazine_sources_v202.py')
          spec = importlib.util.spec_from_file_location('audit_magazine_ci_v202', path)
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          manifest = module.build_manifest()
          summary = manifest['summary']
          assert summary['study_pages'] >= 193, summary
          assert summary['missing_source'] == 0, summary
          assert summary['noindex_pages'] == 0, summary
          assert summary['unclassified_nested_indexes'] == 0, summary
          paths = {page['path'] for page in manifest['pages']}
          assert 'magazine/pediatric-oncology/theses/bridging-gap-hct-success-troullioud-lucas-2026/index.html' in paths
          print(summary)
          PY

      - name: Run source and citation integrity tests
        run: |
          python -m unittest -v \
            tests.test_magazine_source_contract_v202 \
            tests.test_magazine_repository_overrides_v202 \
            tests.test_magazine_citation_integrity_v202 \
            tests.test_magazine_enrichments_v202

      - name: Run recursive publisher tests
        run: |
          python -m unittest -v \
            tests.test_magazine_routes_v202 \
            tests.test_magazine_research_v234

      - name: Run production compatibility integration
        run: python -m unittest -v tests.test_platform_identity_v201

      - name: Guard public scientific language
        run: |
          set -euxo pipefail
          ! grep -R -E 'علاج مضمون|يشخّص|نتائج مؤكدة للجميع' magazine
          grep -q 'publisher_contract' scripts/publish_magazine_v201.py
          grep -q 'publish_magazine_bundle_v202' scripts/publish_magazine_v201.py
          grep -q 'recursive-study-tree-path-aware' scripts/publish_magazine_v202.py
          grep -q 'research.css' scripts/publish_magazine_v202.py
