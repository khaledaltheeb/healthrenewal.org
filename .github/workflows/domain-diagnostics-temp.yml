name: Temporary domain diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dnsutils jq

      - name: Audit healthrenewal.org
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          fail=0
          expected=$'185.199.108.153\n185.199.109.153\n185.199.110.153\n185.199.111.153'

          echo '=== DNS A (apex) ==='
          actual_a="$(dig +short A healthrenewal.org | sort -u)"
          printf '%s\n' "$actual_a"
          if [[ "$actual_a" != "$expected" ]]; then
            echo 'ERROR: apex A records do not exactly match GitHub Pages.'
            fail=1
          fi

          echo '=== DNS AAAA (apex) ==='
          dig +short AAAA healthrenewal.org | sort -u

          echo '=== DNS CNAME (www) ==='
          actual_cname="$(dig +short CNAME www.healthrenewal.org | sed 's/\.$//' | sort -u)"
          printf '%s\n' "$actual_cname"
          if [[ "$actual_cname" != 'khaledaltheeb.github.io' ]]; then
            echo 'ERROR: www CNAME is missing or incorrect.'
            fail=1
          fi

          echo '=== Authoritative nameservers ==='
          dig +short NS healthrenewal.org | sort -u

          echo '=== HTTP and HTTPS ==='
          for url in \
            http://healthrenewal.org \
            https://healthrenewal.org \
            http://www.healthrenewal.org \
            https://www.healthrenewal.org \
            https://khaledaltheeb.github.io/pterminology-site/; do
            result="$(curl -sS -L --max-time 30 -o /dev/null -w 'status=%{http_code} final=%{url_effective} remote_ip=%{remote_ip}' "$url" 2>&1)"
            rc=$?
            echo "$url -> $result"
            if [[ "$url" == https://healthrenewal.org || "$url" == https://www.healthrenewal.org ]]; then
              code="$(sed -n 's/.*status=\([0-9][0-9][0-9]\).*/\1/p' <<<"$result")"
              if [[ $rc -ne 0 || -z "$code" || "$code" -lt 200 || "$code" -ge 400 ]]; then
                echo "ERROR: $url is not healthy."
                fail=1
              fi
            fi
          done

          echo '=== TLS apex ==='
          apex_tls="$(timeout 30 openssl s_client -connect healthrenewal.org:443 -servername healthrenewal.org </dev/null 2>/dev/null | openssl x509 -noout -subject -issuer -dates -ext subjectAltName 2>&1)"
          echo "$apex_tls"
          grep -q 'DNS:healthrenewal.org' <<<"$apex_tls" || { echo 'ERROR: apex certificate does not cover healthrenewal.org.'; fail=1; }

          echo '=== TLS www ==='
          www_tls="$(timeout 30 openssl s_client -connect www.healthrenewal.org:443 -servername www.healthrenewal.org </dev/null 2>/dev/null | openssl x509 -noout -subject -issuer -dates -ext subjectAltName 2>&1)"
          echo "$www_tls"
          grep -q 'DNS:www.healthrenewal.org' <<<"$www_tls" || { echo 'ERROR: certificate does not cover www.healthrenewal.org.'; fail=1; }

          echo '=== GitHub Pages API ==='
          pages_json="$(curl -sS --max-time 30 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/khaledaltheeb/pterminology-site/pages)"
          echo "$pages_json" | jq '{url,status,cname,build_type,source,public,https_certificate,https_enforced}'

          pages_cname="$(jq -r '.cname // empty' <<<"$pages_json")"
          pages_status="$(jq -r '.status // empty' <<<"$pages_json")"
          pages_https="$(jq -r '.https_enforced // false' <<<"$pages_json")"
          [[ "$pages_cname" == 'healthrenewal.org' ]] || { echo "ERROR: GitHub Pages custom domain is '$pages_cname'."; fail=1; }
          [[ "$pages_status" == 'built' || "$pages_status" == 'building' ]] || { echo "ERROR: GitHub Pages status is '$pages_status'."; fail=1; }
          [[ "$pages_https" == 'true' ]] || { echo 'ERROR: GitHub Pages HTTPS enforcement is disabled.'; fail=1; }

          echo '=== RESULT ==='
          if [[ $fail -eq 0 ]]; then
            echo 'PASS: domain, DNS, HTTPS, certificate, and GitHub Pages configuration are ready.'
          else
            echo 'FAIL: one or more required checks failed.'
          fi
          exit "$fail"
