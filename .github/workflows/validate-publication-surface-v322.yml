name: Validate publication surface v322

on:
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "scripts/publish_section_directory_v322.py"
      - "scripts/audit_publication_surface_v322.py"
      - "scripts/publish_content_catalog_v219.py"
      - "tests/test_publication_surface_v322.py"
      - ".github/workflows/validate-publication-surface-v322.yml"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "scripts/publish_section_directory_v322.py"
      - "scripts/audit_publication_surface_v322.py"
      - "scripts/publish_content_catalog_v219.py"
      - "tests/test_publication_surface_v322.py"
      - ".github/workflows/validate-publication-surface-v322.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publication-surface-v322-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile publication surface components
        run: |
          set -euxo pipefail
          python -m py_compile \
            scripts/publish_section_directory_v322.py \
            scripts/audit_publication_surface_v322.py \
            scripts/publish_content_catalog_v219.py \
            tests/test_publication_surface_v322.py
      - name: Run discoverability regression tests
        run: python -m unittest -v tests.test_publication_surface_v322
      - name: Verify production integration and homepage contract
        run: |
          python - <<'PY'
          from pathlib import Path
          home=Path('index.html').read_text(encoding='utf-8')
          orchestrator=Path('scripts/publish_content_catalog_v219.py').read_text(encoding='utf-8')
          publisher=Path('scripts/publish_section_directory_v322.py').read_text(encoding='utf-8')
          assert 'data-publication-surface="v322"' in home
          assert home.count('<h1') == 1
          assert 'specialists-partners/' in home
          assert 'sections/' in home
          assert 'publish_section_directory_v322' in orchestrator
          assert 'audit_publication_surface' in orchestrator
          assert 'specialists-partners/' in publisher
          assert 'outside-the-box/' in publisher
          print({'homepage':'v322','directory':'v322','audit':'integrated'})
          PY
