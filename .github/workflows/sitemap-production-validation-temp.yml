name: Temporary production sitemap validation

on:
  issues:
    types: [opened]

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  validate:
    if: github.event.issue.title == '[diagnostic] production sitemap validation 2026-07-31'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TARGET_SHA: ${{ github.event.issue.body }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Wait for a deployment containing the target commit
        shell: bash
        run: |
          set +e
          exec > >(tee /tmp/production-sitemap.log) 2>&1
          target="$(printf '%s' "$TARGET_SHA" | grep -Eo '[0-9a-f]{40}' | head -1)"
          if [[ ! "$target" =~ ^[0-9a-f]{40}$ ]]; then
            echo "INVALID_TARGET_SHA=$TARGET_SHA"
            echo FAILED > /tmp/production-sitemap-result
            exit 0
          fi
          echo "TARGET_SHA=$target"
          matched=0
          for attempt in $(seq 1 105); do
            token="${target}-${attempt}-$(date +%s)"
            if curl -fsSL --max-time 30 -H 'Cache-Control: no-cache' "https://healthrenewal.org/deployment.json?v=${token}" -o /tmp/deployment.json; then
              live="$(python3 -c "import json; print(json.load(open('/tmp/deployment.json')).get('commit',''))" 2>/dev/null)"
              echo "attempt=$attempt live_sha=$live"
              if [[ "$live" == "$target" ]]; then
                matched=1
                break
              fi
              if [[ "$live" =~ ^[0-9a-f]{40}$ ]]; then
                compare="$(curl -fsSL --max-time 30 \
                  -H "Authorization: Bearer ${GH_TOKEN}" \
                  -H 'Accept: application/vnd.github+json' \
                  -H 'X-GitHub-Api-Version: 2022-11-28' \
                  "https://api.github.com/repos/${GITHUB_REPOSITORY}/compare/${target}...${live}" \
                  | python3 -c "import json,sys; print(json.load(sys.stdin).get('status',''))" 2>/dev/null)"
                echo "target_to_live=$compare"
                if [[ "$compare" == "ahead" || "$compare" == "identical" ]]; then
                  matched=1
                  break
                fi
              fi
            fi
            sleep 20
          done
          if [[ "$matched" -ne 1 ]]; then
            echo 'ERROR: a deployment containing the target commit did not appear before timeout.'
            echo 'Recent workflow runs:'
            curl -fsSL --max-time 30 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?branch=main&per_page=30" \
              | python3 -c "import json,sys; d=json.load(sys.stdin); [print(r.get('name'),r.get('head_sha'),r.get('status'),r.get('conclusion'),r.get('html_url')) for r in d.get('workflow_runs',[])]" || true
            echo FAILED > /tmp/production-sitemap-result
            exit 0
          fi

          echo 'Deployment containing target commit is live.'
          curl -fsSL --max-time 60 -H 'Cache-Control: no-cache' "https://healthrenewal.org/robots.txt?v=${target}" -o /tmp/robots.txt
          curl -fsSL --max-time 60 -H 'Cache-Control: no-cache' "https://healthrenewal.org/sitemap.xml?v=${target}" -o /tmp/sitemap.xml
          curl -fsSL --max-time 60 -H 'Cache-Control: no-cache' "https://healthrenewal.org/sitemap-index.xml?v=${target}" -o /tmp/sitemap-index.xml
          curl -fsSL --max-time 60 -H 'Cache-Control: no-cache' "https://healthrenewal.org/api/indexing-coverage-audit-v303.json?v=${target}" -o /tmp/indexing.json
          curl -fsSL --max-time 60 -H 'Cache-Control: no-cache' "https://healthrenewal.org/api/sitemap-index-v305.json?v=${target}" -o /tmp/sitemap-report.json

          python3 - <<'PY' | tee /tmp/validation-result.json
          from __future__ import annotations
          import concurrent.futures
          import json
          import re
          import urllib.request
          import xml.etree.ElementTree as ET
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlparse

          BASE='https://healthrenewal.org/'
          failures=[]
          warnings=[]

          deployment=json.loads(Path('/tmp/deployment.json').read_text())
          indexing=json.loads(Path('/tmp/indexing.json').read_text())
          generator=json.loads(Path('/tmp/sitemap-report.json').read_text())
          robots=Path('/tmp/robots.txt').read_text()

          def locs(path):
              tree=ET.parse(path)
              return [(x.text or '').strip() for x in tree.findall('.//{*}loc') if (x.text or '').strip()]

          primary=locs('/tmp/sitemap.xml')
          child_maps=locs('/tmp/sitemap-index.xml')
          expected=int(indexing.get('expected_indexable_pages',0))
          reported=int(indexing.get('sitemap_urls',-1))

          if indexing.get('version') != 305: failures.append(f"indexing report version={indexing.get('version')!r}")
          if indexing.get('status') != 'passed': failures.append(f"indexing status={indexing.get('status')!r}")
          if indexing.get('local_route_contract') != 'passed': failures.append('local route contract failed')
          if indexing.get('metadata_contract') != 'passed': failures.append('metadata contract failed')
          if expected < 3000: failures.append(f'expected indexable pages too low: {expected}')
          if reported != expected: failures.append(f'report sitemap URLs {reported} != expected {expected}')
          if float(indexing.get('sitemap_coverage_ratio',0)) != 1.0: failures.append(f"coverage ratio={indexing.get('sitemap_coverage_ratio')}")
          if len(primary) != expected: failures.append(f'primary sitemap URLs {len(primary)} != expected {expected}')
          if len(primary) != len(set(primary)): failures.append(f'primary sitemap duplicates={len(primary)-len(set(primary))}')
          if BASE not in primary: failures.append('homepage is missing from sitemap.xml')

          bad_domain=[]; legacy=[]; query_fragment=[]
          for url in primary:
              p=urlparse(url)
              if p.scheme!='https' or p.netloc!='healthrenewal.org': bad_domain.append(url)
              if '/pterminology-site/' in url or 'khaledaltheeb.github.io' in url: legacy.append(url)
              if p.query or p.fragment: query_fragment.append(url)
          if bad_domain: failures.append(f'bad-domain URLs={len(bad_domain)} sample={bad_domain[:5]}')
          if legacy: failures.append(f'legacy URLs={len(legacy)} sample={legacy[:5]}')
          if query_fragment: failures.append(f'query/fragment URLs={len(query_fragment)} sample={query_fragment[:5]}')

          if 'User-agent: *' not in robots or 'Allow: /' not in robots: failures.append('robots.txt does not allow all crawlers')
          disallow=[line for line in robots.splitlines() if line.strip().lower().startswith('disallow:')]
          if disallow: failures.append(f'robots.txt contains blocking directives: {disallow}')
          for directive in ('Sitemap: https://healthrenewal.org/sitemap.xml','Sitemap: https://healthrenewal.org/sitemap-index.xml'):
              if robots.count(directive)!=1: failures.append(f'robots directive count invalid: {directive} -> {robots.count(directive)}')

          if not child_maps: failures.append('sitemap-index.xml contains no child sitemaps')
          for url in child_maps:
              p=urlparse(url)
              if p.scheme!='https' or p.netloc!='healthrenewal.org' or not p.path.startswith('/sitemap-family-'):
                  failures.append(f'invalid child sitemap URL: {url}')

          union=set()
          child_counts={}
          for map_url in child_maps:
              req=urllib.request.Request(map_url+'?audit=production',headers={'User-Agent':'HealthRenewalSitemapValidator/1.0','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=60) as response:
                  data=response.read()
              root=ET.fromstring(data)
              urls=[(x.text or '').strip() for x in root.findall('.//{*}loc') if (x.text or '').strip()]
              child_counts[map_url.rsplit('/',1)[-1]]=len(urls)
              if len(urls)!=len(set(urls)): failures.append(f'duplicates in {map_url}')
              overlap=union.intersection(urls)
              if overlap: failures.append(f'cross-sitemap duplicates in {map_url}: {list(overlap)[:3]}')
              union.update(urls)
          if union != set(primary):
              failures.append(f'primary/family mismatch missing={len(set(primary)-union)} extra={len(union-set(primary))}')

          class CanonicalParser(HTMLParser):
              def __init__(self): super().__init__(); self.values=[]
              def handle_starttag(self,tag,attrs):
                  if tag.lower()!='link': return
                  d={str(k).lower():v or '' for k,v in attrs}
                  if 'canonical' in d.get('rel','').lower().split() and d.get('href'): self.values.append(d['href'])

          ordered=sorted(primary)
          indexes={0,len(ordered)-1}
          if ordered:
              for i in range(0,len(ordered),max(1,len(ordered)//60)): indexes.add(i)
          sample=[ordered[i] for i in sorted(indexes) if 0<=i<len(ordered)]

          def check_page(url):
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'HealthRenewalSitemapValidator/1.0','Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req,timeout=30) as response:
                      final=response.geturl(); code=response.status; ctype=response.headers.get('Content-Type',''); data=response.read(2_000_000)
                  if not (200<=code<300): return url,f'HTTP {code}'
                  if 'text/html' not in ctype: return url,f'content-type {ctype}'
                  parser=CanonicalParser(); parser.feed(data.decode('utf-8','ignore'))
                  expected_url=url
                  if len(parser.values)!=1: return url,f'canonical count={len(parser.values)} values={parser.values[:3]}'
                  if parser.values[0].rstrip('/') != expected_url.rstrip('/'): return url,f'canonical={parser.values[0]}'
                  if final.rstrip('/') != url.rstrip('/'): return url,f'final URL={final}'
                  return url,None
              except Exception as exc:
                  return url,repr(exc)

          sample_errors=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=12) as pool:
              for url,error in pool.map(check_page,sample):
                  if error: sample_errors.append((url,error))
          if sample_errors: failures.append(f'live page sample failures={len(sample_errors)} sample={sample_errors[:8]}')

          if int(generator.get('indexable_pages',-1)) != expected: failures.append(f"generator indexable_pages={generator.get('indexable_pages')} expected={expected}")
          if generator.get('base_url') != BASE: failures.append(f"generator base_url={generator.get('base_url')!r}")
          if generator.get('primary_sitemap') != 'sitemap.xml': failures.append('generator primary sitemap contract missing')

          result={
              'status':'passed' if not failures else 'failed',
              'live_commit':deployment.get('commit'),
              'homepage_included':BASE in primary,
              'indexable_pages':expected,
              'primary_sitemap_urls':len(primary),
              'unique_primary_urls':len(set(primary)),
              'family_sitemaps':len(child_maps),
              'family_union_urls':len(union),
              'family_counts':child_counts,
              'coverage_ratio':indexing.get('sitemap_coverage_ratio'),
              'metadata_contract':indexing.get('metadata_contract'),
              'local_route_contract':indexing.get('local_route_contract'),
              'robots_allow_all':not disallow and 'Allow: /' in robots,
              'legacy_urls':len(legacy),
              'bad_domain_urls':len(bad_domain),
              'sample_pages_checked':len(sample),
              'sample_page_failures':sample_errors,
              'failures':failures,
              'warnings':warnings,
          }
          print(json.dumps(result,ensure_ascii=False,indent=2))
          Path('/tmp/production-sitemap-result').write_text('PASSED' if not failures else 'FAILED')
          PY

      - name: Publish production validation report
        if: always()
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python3 - <<'PY' >/tmp/comment.json
          import json
          from pathlib import Path
          result=Path('/tmp/production-sitemap-result').read_text().strip() if Path('/tmp/production-sitemap-result').exists() else 'UNKNOWN'
          if Path('/tmp/validation-result.json').exists():
              report=Path('/tmp/validation-result.json').read_text(errors='replace')
          elif Path('/tmp/production-sitemap.log').exists():
              report=Path('/tmp/production-sitemap.log').read_text(errors='replace')[-55000:]
          else:
              report='No validation output was produced.'
          body=f'## Production sitemap validation: {result}\n\n```json\n{report}\n```'
          print(json.dumps({'body':body}))
          PY
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            --data-binary @/tmp/comment.json
