name: Publish autism clinical pathways v324

on:
  pull_request:
    branches: ["main"]
    paths:
      - "content/v324/**"
      - "scripts/publish_autism_clinical_pathways_v324*.py"
      - "tests/test_autism_clinical_pathways_v324.py"
      - ".github/workflows/publish-autism-clinical-pathways-v324.yml"
      - ".github/workflows/deploy-autism-clinical-pathways-v324.yml"
  workflow_run:
    workflows: ["Publish special-needs expansion v322"]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: publish-autism-clinical-v324-${{ github.event.pull_request.number || github.event.workflow_run.id || github.ref }}
  cancel-in-progress: true

jobs:
  static-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Validate publication and deployment contract
        run: |
          python - <<'PY'
          from pathlib import Path

          publish_path = Path('.github/workflows/publish-autism-clinical-pathways-v324.yml')
          deploy_path = Path('.github/workflows/deploy-autism-clinical-pathways-v324.yml')
          if not publish_path.is_file() or not deploy_path.is_file():
              raise SystemExit({'missing_files': [str(path) for path in (publish_path, deploy_path) if not path.is_file()]})

          publish = publish_path.read_text(encoding='utf-8')
          deploy = deploy_path.read_text(encoding='utf-8')
          required = {
              'publish': (
                  'Publish special-needs expansion v322',
                  'validated-production-site',
                  'publish_autism_clinical_pathways_v324.py validated-site',
                  'autism-clinical-pathways-v324.json',
                  'audit_orphan_pages_v197.py',
                  'audit_content_quality_v32.py',
              ),
              'deploy': (
                  'Publish autism clinical pathways v324',
                  'actions/deploy-pages@v4',
                  'autism-clinical-pathways-v324.json',
                  'CANDIDATE_SHA',
              ),
          }
          texts = {'publish': publish, 'deploy': deploy}
          missing = {
              name: [marker for marker in markers if marker not in texts[name]]
              for name, markers in required.items()
          }
          missing = {name: markers for name, markers in missing.items() if markers}
          forbidden = []
          manual_trigger = 'workflow_' + 'dispatch'
          if manual_trigger in publish:
              forbidden.append('publish:manual-trigger')
          report = {
              'status': 'passed' if not missing and not forbidden else 'failed',
              'missing': missing,
              'forbidden': forbidden,
              'publish_bytes': len(publish.encode('utf-8')),
              'deploy_bytes': len(deploy.encode('utf-8')),
          }
          print(report)
          if missing or forbidden:
              raise SystemExit(1)
          PY

  publish-artifact:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download v322 validated production artifact
        uses: actions/download-artifact@v4
        with:
          name: validated-production-site
          path: validated-site
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Compile and test v324 source
        run: |
          set -euxo pipefail
          python -m py_compile \
            scripts/publish_autism_clinical_pathways_v324.py \
            scripts/publish_autism_clinical_pathways_v324_core.py \
            tests/test_autism_clinical_pathways_v324.py
          python -m unittest -v tests.test_autism_clinical_pathways_v324
      - name: Publish four autism clinical pathways
        run: |
          set -euxo pipefail
          python scripts/publish_autism_clinical_pathways_v324.py validated-site
          python - <<'PY'
          import json,xml.etree.ElementTree as ET
          from pathlib import Path
          root=Path('validated-site')
          report=json.loads((root/'api/autism-clinical-pathways-v324.json').read_text(encoding='utf-8'))
          assert report['version']==324 and report['status']=='passed',report
          assert (report['guide_count'],report['section_count'],report['source_count'])==(4,28,26),report
          assert report['minimum_guide_words']>=1250,report
          assert report['action_step_count']==24 and report['urgent_item_count']==12,report
          assert report['parent_links_added']==4 and report['sitemap_registered'] is True,report
          assert report['platform_shell_normalized'] is True,report
          assert report['external_clinical_review_completed'] is False,report
          parent=(root/'special-needs/autism/index.html').read_text(encoding='utf-8')
          assert parent.count('data-autism-clinical-pathways-v324')==1
          urls=[(n.text or '').strip() for n in ET.parse(root/'sitemap-special-needs.xml').getroot().findall('{*}url/{*}loc')]
          for slug in report['guide_slugs']:
              page=root/'special-needs'/slug/'index.html'
              source=page.read_text(encoding='utf-8')
              assert source.count('<h1')==1 and source.count('class="section-card"')==7,slug
              assert '<!-- pt-platform-shell:v1 -->' in source and 'data-pt-normalized="1.1.0"' in source,slug
              assert 'MedicalWebPage' in source and 'لم تكتمل مراجعة سريرية خارجية مستقلة' in source,slug
              assert urls.count(f'https://healthrenewal.org/special-needs/{slug}/')==1,slug
          print({'status':'passed','guides':4,'sections':28,'sources':26,'minimum_words':report['minimum_guide_words']})
          PY
      - name: Re-audit discovery and content quality
        run: |
          set -euxo pipefail
          python scripts/audit_orphan_pages_v197.py validated-site --fail-on-critical --require-gateways
          python scripts/audit_content_quality_v32.py validated-site
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('validated-site')
          discovery=json.loads((root/'api/orphan-page-audit-v197.json').read_text(encoding='utf-8'))
          quality=json.loads((root/'api/content-quality-v32.json').read_text(encoding='utf-8'))
          assert discovery['status']=='passed',discovery
          for key in ('critical_orphans','critical_unmapped','missing_gateways','gateway_orphans','gateway_unmapped'):
              assert discovery[key]==[],(key,discovery[key])
          assert quality['critical_error_count']==0 and quality['thin_page_candidates']==0,quality
          PY
      - name: Upload v324 validated production site
        uses: actions/upload-artifact@v4
        with:
          name: validated-production-site
          path: validated-site
          if-no-files-found: error
          retention-days: 7
      - name: Upload v324 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autism-clinical-pathways-v324
          path: |
            validated-site/api/autism-clinical-pathways-v324.json
            validated-site/api/orphan-page-audit-v197.json
            validated-site/api/content-quality-v32.json
          if-no-files-found: warn
          retention-days: 14
