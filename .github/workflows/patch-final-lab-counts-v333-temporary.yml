name: Patch final lab inventory counts v333 temporary

on:
  push:
    branches: ["agent/legacy-alias-release-gates-v333"]
    paths:
      - ".github/workflows/patch-final-lab-counts-v333-temporary.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/legacy-alias-release-gates-v333
          fetch-depth: 0
      - name: Replace stale final inventory assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/validate-all-labs-v22.yml')
          text = path.read_text(encoding='utf-8')
          old_assert = "          assert daily['tools']==8 and daily['paths']==4 and daily['pages']==14 and daily['local_only'] is True,daily\n"
          new_assert = "          assert daily['version']==100 and daily['catalog_contract']==100 and daily['tools']==100 and daily['paths']==10 and daily['pages']==112 and daily['local_only'] is True,daily\n"
          old_print = "          print({'site':'passed','cognitive':'53/53','assessments':'40/40','browser':'186/186','daily_tools':'8/8','learning_paths':'4/4','quality_pages':quality['pages_scanned'],'thin_candidates':quality['thin_page_candidates'],'pwa_pages':pwa['pages_scanned'],'identity_pages':identity['pages'],'homepage_lab_tools':homepage['lab_tool_count']})\n"
          new_print = "          print({'site':'passed','cognitive':'53/53','assessments':'40/40','browser':'186/186','daily_tools':'100/100','learning_paths':'10/10','discovery_pages':112,'quality_pages':quality['pages_scanned'],'thin_candidates':quality['thin_page_candidates'],'pwa_pages':pwa['pages_scanned'],'identity_pages':identity['pages'],'homepage_lab_tools':homepage['lab_tool_count']})\n"
          if text.count(old_assert) != 1 or text.count(old_print) != 1:
              raise SystemExit('stale final inventory anchors missing or ambiguous')
          text = text.replace(old_assert, new_assert, 1).replace(old_print, new_print, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/validate-all-labs-v22.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: align final lab counts with daily-tools v100"
          git push origin HEAD:agent/legacy-alias-release-gates-v333
