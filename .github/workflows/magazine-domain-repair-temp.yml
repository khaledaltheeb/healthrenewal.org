name: Temporary magazine domain repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/magazine-domain-repair-temp.yml
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: temporary-magazine-domain-repair
  cancel-in-progress: true

jobs:
  repair:
    if: >-
      github.event_name == 'push' ||
      github.event.issue.title == '[repair] magazine custom domain 2026-07-31'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REPORT_ISSUE: ${{ github.event.issue.number || 762 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch magazine publisher to normalize legacy article metadata
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/publish_magazine_v201.py')
          text = path.read_text(encoding='utf-8')

          old = 'BASE = "https://khaledaltheeb.github.io/pterminology-site"\nURL = BASE + "/magazine/"\nCONTRACT = 315\n'
          new = '''BASE = "https://healthrenewal.org"
LEGACY_BASES = (
    "https://khaledaltheeb.github.io/pterminology-site",
    "http://khaledaltheeb.github.io/pterminology-site",
)
URL = BASE + "/magazine/"
CONTRACT = 316
'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'BASE = "https://healthrenewal.org"' not in text:
              raise SystemExit('Magazine base contract anchor was not found')

          robots_anchor = '''def ensure_robots_meta(text: str, filename: str) -> tuple[str, bool]:
'''
          normalizer = '''def normalize_article_text(text: str, filename: str) -> str:
    updated = text
    for origin in LEGACY_BASES:
        updated = updated.replace(origin, BASE)
    updated = updated.replace("/pterminology-site/", "/")
    updated = updated.replace(f"{BASE}//", f"{BASE}/")
    expected = f'<link rel="canonical" href="{URL}{filename}">'
    canonical_pattern = re.compile(
        r'<link\\b(?=[^>]*\\brel\\s*=\\s*(["\\'])[^"\\']*\\bcanonical\\b[^"\\']*\\1)[^>]*>',
        re.I | re.S,
    )
    if not canonical_pattern.search(updated):
        raise SystemExit(f"Research article lacks canonical metadata: {filename}")
    updated = canonical_pattern.sub(expected, updated, count=1)
    if updated.count('rel="canonical"') > 1:
        raise SystemExit(f"Research article contains duplicate canonical metadata: {filename}")
    if any(origin in updated for origin in LEGACY_BASES) or "/pterminology-site/" in updated:
        raise SystemExit(f"Research article retains a legacy origin or base path: {filename}")
    return updated


'''
          if 'def normalize_article_text(' not in text:
              if robots_anchor not in text:
                  raise SystemExit('Magazine robots anchor was not found')
              text = text.replace(robots_anchor, normalizer + robots_anchor, 1)

          validate_old = '''        text = path.read_text(encoding="utf-8")
        required = (
'''
          validate_new = '''        text = normalize_article_text(path.read_text(encoding="utf-8"), filename)
        required = (
'''
          if validate_old in text:
              text = text.replace(validate_old, validate_new, 1)
          elif validate_new not in text:
              raise SystemExit('Magazine validation article-read anchor was not found')

          publish_old = '''        text, was_added = ensure_robots_meta(path.read_text(encoding="utf-8"), path.name)
'''
          publish_new = '''        source = normalize_article_text(path.read_text(encoding="utf-8"), path.name)
        text, was_added = ensure_robots_meta(source, path.name)
'''
          if publish_old in text:
              text = text.replace(publish_old, publish_new, 1)
          elif publish_new not in text:
              raise SystemExit('Magazine publication article-read anchor was not found')

          report_old = '''        "version": CONTRACT,
        "page": "magazine/index.html",
        "url": URL,
'''
          report_new = '''        "version": CONTRACT,
        "page": "magazine/index.html",
        "url": URL,
        "canonical_origin": BASE,
        "legacy_origins_remaining": 0,
'''
          if report_old in text:
              text = text.replace(report_old, report_new, 1)
          elif report_new not in text:
              raise SystemExit('Magazine report anchor was not found')

          path.write_text(text, encoding='utf-8')

          final = path.read_text(encoding='utf-8')
          assert 'BASE = "https://healthrenewal.org"' in final
          assert 'CONTRACT = 316' in final
          assert 'def normalize_article_text' in final
          assert 'normalize_article_text(path.read_text' in final
          assert '"legacy_origins_remaining": 0' in final
          PY

      - name: Run magazine and platform identity contracts
        continue-on-error: true
        shell: bash
        run: |
          exec > >(tee /tmp/repair.log) 2>&1
          set -euxo pipefail
          python -m py_compile \
            scripts/publish_magazine_v201.py \
            scripts/finalize_trust_guides_links_v201.py \
            scripts/enforce_platform_identity_v201.py
          python -m unittest -v \
            tests.test_finalize_trust_guides_aliases_v354 \
            tests.test_section_directory_aliases_v322 \
            tests.test_platform_identity_v201
          printf '{"status":"passed","magazine_contract":316,"canonical_origin":"https://healthrenewal.org","legacy_article_origins":0,"platform_identity":"passed"}\n' > /tmp/result.json

      - name: Commit verified repair
        shell: bash
        run: |
          set -euxo pipefail
          test -f /tmp/result.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/publish_magazine_v201.py
          if git diff --cached --quiet; then
            echo 'Magazine publisher already satisfies the contract.'
          else
            git commit -m 'fix(seo): publish magazine on custom domain'
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                exit 0
              fi
              git fetch origin main
              git rebase origin/main
            done
            exit 1
          fi

      - name: Publish repair report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY' >/tmp/body.json
          import json
          from pathlib import Path
          if Path('/tmp/result.json').exists():
              report=Path('/tmp/result.json').read_text(errors='replace')
          elif Path('/tmp/repair.log').exists():
              report=Path('/tmp/repair.log').read_text(errors='replace')[-55000:]
          else:
              report='No repair output.'
          print(json.dumps({'body':'## Magazine custom-domain repair\n\n```text\n'+report+'\n```'}))
          PY
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${REPORT_ISSUE}/comments" \
            --data-binary @/tmp/body.json
