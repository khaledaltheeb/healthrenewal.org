name: Probe specialist Turnstile secret

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/probe-specialist-turnstile-secret.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SPECIALISTS_TURNSTILE_SECRET: ${{ secrets.SPECIALISTS_TURNSTILE_SECRET }}
      TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Record secret-name presence only
        run: |
          set -euo pipefail
          mkdir -p reports
          python - <<'PY'
          import json,os
          from datetime import datetime,timezone
          from pathlib import Path
          report={
              'schema_version':1,
              'checked_at':datetime.now(timezone.utc).isoformat(),
              'specialists_turnstile_secret_present':bool(os.environ.get('SPECIALISTS_TURNSTILE_SECRET')),
              'turnstile_secret_present':bool(os.environ.get('TURNSTILE_SECRET')),
              'contains_secret_values':False,
          }
          Path('reports/specialist-turnstile-secret-presence.json').write_text(json.dumps(report,indent=2)+'\n',encoding='utf-8')
          print(report)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/specialist-turnstile-secret-presence.json
          git commit -m "chore: record Turnstile secret-name presence [skip ci]" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
