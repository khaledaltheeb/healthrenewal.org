name: Apply multilingual E5 production patch

on:
  push:
    branches:
      - agent/multilingual-e5-production-v3
    paths:
      - .github/workflows/e5-v3-patch-temp.yml

permissions:
  contents: write

concurrency:
  group: multilingual-e5-production-v3-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/multilingual-e5-production-v3
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply deterministic E5 v3 changes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          ROOT = Path('.')
          OLD_BASE = 'https://khaledaltheeb.github.io/pterminology-site/'
          NEW_BASE = 'https://healthrenewal.org/'
          MODEL_REVISION = 'fd1525a9fd15316a2d503bf26ab031a61d056e98'
          BROWSER_REVISION = '761b726dd34fb83930e26aab4e9ac3899aa1fa78'

          def replace_once(path: str, old: str, new: str) -> None:
              file = ROOT / path
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one occurrence, found {count}: {old[:100]!r}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          def replace_all(path: str, old: str, new: str, minimum: int = 1) -> None:
              file = ROOT / path
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count < minimum:
                  raise SystemExit(f'{path}: expected at least {minimum} occurrences, found {count}: {old!r}')
              file.write_text(text.replace(old, new), encoding='utf-8')

          # Offline corpus builder: custom domain, pinned model revisions, canonical normalization.
          replace_once(
              'scripts/build_semantic_search_index.py',
              'from urllib.parse import urljoin\n',
              'from urllib.parse import urljoin, urlparse\n',
          )
          replace_once(
              'scripts/build_semantic_search_index.py',
              'MODEL_ID = "intfloat/multilingual-e5-small"\nBASE_URL = "https://khaledaltheeb.github.io/pterminology-site/"\nDIMENSIONS = 384\n',
              f'MODEL_ID = "intfloat/multilingual-e5-small"\nMODEL_REVISION = "{MODEL_REVISION}"\nBROWSER_MODEL_ID = "Xenova/multilingual-e5-small"\nBROWSER_MODEL_REVISION = "{BROWSER_REVISION}"\nBASE_URL = "{NEW_BASE}"\nLEGACY_BASE_URL = "{OLD_BASE}"\nDIMENSIONS = 384\n',
          )
          replace_once(
              'scripts/build_semantic_search_index.py',
              '''def canonical_url(soup: BeautifulSoup, relative_path: Path) -> str:\n    canonical = soup.find("link", rel=lambda value: value and "canonical" in value)\n    href = canonical.get("href") if canonical else None\n    if href:\n        return str(href)\n    clean_path = relative_path.as_posix()\n    if clean_path.endswith("index.html"):\n        clean_path = clean_path[: -len("index.html")]\n    return urljoin(BASE_URL, clean_path)\n''',
              '''def canonical_url(soup: BeautifulSoup, relative_path: Path) -> str:\n    clean_path = relative_path.as_posix()\n    if clean_path.endswith("index.html"):\n        clean_path = clean_path[: -len("index.html")]\n\n    canonical = soup.find("link", rel=lambda value: value and "canonical" in value)\n    href = str(canonical.get("href") or "").strip() if canonical else ""\n    candidate = urljoin(BASE_URL, href or clean_path)\n\n    if candidate.startswith(LEGACY_BASE_URL):\n        candidate = urljoin(BASE_URL, candidate[len(LEGACY_BASE_URL):])\n\n    parsed = urlparse(candidate)\n    if parsed.netloc == "www.healthrenewal.org":\n        candidate = parsed._replace(netloc="healthrenewal.org").geturl()\n        parsed = urlparse(candidate)\n\n    if parsed.scheme != "https" or parsed.netloc != "healthrenewal.org":\n        candidate = urljoin(BASE_URL, clean_path)\n\n    parsed = urlparse(candidate)\n    return parsed._replace(query="", fragment="").geturl()\n''',
          )
          replace_once(
              'scripts/build_semantic_search_index.py',
              '    main = soup.find("main") or soup.find("article") or soup.body or soup\n    for element in main.find_all(list(TEXT_TAGS)):\n',
              '    main = soup.find("main") or soup.find("article") or soup.body or soup\n    visible_text = clean_text(main.get_text(" ", strip=True))\n    for element in main.find_all(list(TEXT_TAGS)):\n',
          )
          replace_once(
              'scripts/build_semantic_search_index.py',
              '    return title, url, raw, blocks\n',
              '    return title, url, visible_text, blocks\n',
          )
          replace_once(
              'scripts/build_semantic_search_index.py',
              '        title, url, raw, blocks = extract_page_blocks(path, root)\n',
              '        title, url, page_text, blocks = extract_page_blocks(path, root)\n',
          )
          replace_once(
              'scripts/build_semantic_search_index.py',
              '        audience = infer_audience(relative_path, raw)\n',
              '        audience = infer_audience(relative_path, page_text)\n',
          )
          replace_once(
              'scripts/build_semantic_search_index.py',
              '    model = SentenceTransformer(MODEL_ID)\n',
              '    model = SentenceTransformer(MODEL_ID, revision=MODEL_REVISION)\n',
          )
          replace_once(
              'scripts/build_semantic_search_index.py',
              '''        "version": 1,\n        "ready": True,\n        "generatedAt": datetime.now(UTC).isoformat(),\n        "model": MODEL_ID,\n        "browserModel": "Xenova/multilingual-e5-small",\n        "dimensions": DIMENSIONS,\n''',
              '''        "version": 2,\n        "ready": True,\n        "generatedAt": datetime.now(UTC).isoformat(),\n        "model": MODEL_ID,\n        "modelRevision": MODEL_REVISION,\n        "browserModel": BROWSER_MODEL_ID,\n        "browserModelRevision": BROWSER_MODEL_REVISION,\n        "corpusBaseUrl": BASE_URL,\n        "dimensions": DIMENSIONS,\n''',
          )

          # Remote crawler: normalize legacy sitemap URLs onto the custom domain.
          replace_once(
              'scripts/build_remote_semantic_search_index.py',
              'DEFAULT_SITEMAP = "https://khaledaltheeb.github.io/pterminology-site/sitemap-index.xml"\nDEFAULT_BASE_URL = "https://khaledaltheeb.github.io/pterminology-site/"\nUSER_AGENT = "PterminologySemanticIndexer/1.0 (+https://khaledaltheeb.github.io/pterminology-site/ai-search/)"\n',
              f'DEFAULT_SITEMAP = "{NEW_BASE}sitemap-index.xml"\nDEFAULT_BASE_URL = "{NEW_BASE}"\nLEGACY_BASE_URL = "{OLD_BASE}"\nUSER_AGENT = "HealthRenewalSemanticIndexer/2.0 (+{NEW_BASE}ai-search/)"\n',
          )
          replace_once(
              'scripts/build_remote_semantic_search_index.py',
              '''def same_site(url: str, base_url: str) -> bool:\n    candidate = urlparse(url)\n    base = urlparse(base_url)\n    return (\n        candidate.scheme in {"http", "https"}\n        and candidate.netloc == base.netloc\n        and candidate.path.startswith(base.path)\n    )\n''',
              '''def normalize_site_url(url: str, base_url: str) -> str:\n    candidate = urlparse(url)\n    base = urlparse(base_url)\n    legacy = urlparse(LEGACY_BASE_URL)\n\n    if candidate.netloc == legacy.netloc and candidate.path.startswith(legacy.path):\n        suffix = candidate.path[len(legacy.path):]\n        target_path = f"{base.path.rstrip('/')}/{suffix.lstrip('/')}"\n        candidate = candidate._replace(\n            scheme=base.scheme,\n            netloc=base.netloc,\n            path=target_path,\n            query="",\n            fragment="",\n        )\n    elif candidate.netloc == "www.healthrenewal.org":\n        candidate = candidate._replace(\n            scheme="https",\n            netloc="healthrenewal.org",\n            query="",\n            fragment="",\n        )\n    else:\n        candidate = candidate._replace(fragment="")\n    return candidate.geturl()\n\n\ndef same_site(url: str, base_url: str) -> bool:\n    candidate = urlparse(normalize_site_url(url, base_url))\n    base = urlparse(base_url)\n    return (\n        candidate.scheme in {"http", "https"}\n        and candidate.netloc == base.netloc\n        and candidate.path.startswith(base.path)\n    )\n''',
          )
          replace_once(
              'scripts/build_remote_semantic_search_index.py',
              '''        if root_type == "sitemapindex":\n            for location in locations:\n                if same_site(location, base_url) and location not in seen_sitemaps:\n                    queue.append(location)\n            continue\n''',
              '''        if root_type == "sitemapindex":\n            for raw_location in locations:\n                location = normalize_site_url(raw_location, base_url)\n                if same_site(location, base_url) and location not in seen_sitemaps:\n                    queue.append(location)\n            continue\n''',
          )
          replace_once(
              'scripts/build_remote_semantic_search_index.py',
              '''        for location in locations:\n            if not is_indexable_page_url(location, base_url) or location in seen_pages:\n                continue\n            seen_pages.add(location)\n            pages.append(location)\n''',
              '''        for raw_location in locations:\n            location = normalize_site_url(raw_location, base_url)\n            if not is_indexable_page_url(location, base_url) or location in seen_pages:\n                continue\n            seen_pages.add(location)\n            pages.append(location)\n''',
          )
          replace_once(
              'scripts/build_remote_semantic_search_index.py',
              'def destination_for_url(root: Path, url: str, base_url: str) -> Path:\n    parsed = urlparse(url)\n',
              'def destination_for_url(root: Path, url: str, base_url: str) -> Path:\n    parsed = urlparse(normalize_site_url(url, base_url))\n',
          )

          # Browser worker: pinned ONNX revision, strict manifest contract and one result per page.
          replace_once(
              'ai-search/assets/search-worker.js',
              "const MODEL_ID = 'Xenova/multilingual-e5-small';\nconst DTYPE = 'q8';\n",
              f"const MODEL_ID = 'Xenova/multilingual-e5-small';\nconst MODEL_REVISION = '{BROWSER_REVISION}';\nconst BUILDER_MODEL_ID = 'intfloat/multilingual-e5-small';\nconst DTYPE = 'q8';\n",
          )
          replace_once(
              'ai-search/assets/search-worker.js',
              '''  if (!manifest?.ready || !Array.isArray(manifest.shards) || !manifest.shards.length) return false;\n  if (manifest.dimensions !== DIMENSIONS) throw new Error('أبعاد الفهرس المسبق غير متوافقة.');\n''',
              '''  if (!manifest?.ready || !Array.isArray(manifest.shards) || !manifest.shards.length) return false;\n  if (manifest.version < 2) throw new Error('نسخة الفهرس المسبق قديمة.');\n  if (manifest.dimensions !== DIMENSIONS) throw new Error('أبعاد الفهرس المسبق غير متوافقة.');\n  if (manifest.model !== BUILDER_MODEL_ID) throw new Error('نموذج بناء الفهرس غير متوافق.');\n  if (manifest.browserModel !== MODEL_ID) throw new Error('نموذج المتصفح غير متوافق.');\n  if (manifest.browserModelRevision !== MODEL_REVISION) throw new Error('مراجعة نموذج المتصفح غير متوافقة.');\n  if (manifest.queryPrefix !== QUERY_PREFIX || manifest.passagePrefix !== PASSAGE_PREFIX) {\n    throw new Error('بادئات E5 في الفهرس غير متوافقة.');\n  }\n  if (manifest.normalized !== true || manifest.dtype !== 'float16') {\n    throw new Error('تنسيق متجهات الفهرس غير متوافق.');\n  }\n''',
          )
          replace_all(
              'ai-search/assets/search-worker.js',
              "        device: 'webgpu',\n        progress_callback: progressCallback,\n",
              "        device: 'webgpu',\n        revision: MODEL_REVISION,\n        progress_callback: progressCallback,\n",
              minimum=1,
          )
          replace_once(
              'ai-search/assets/search-worker.js',
              "    device: 'wasm',\n    progress_callback: progressCallback,\n",
              "    device: 'wasm',\n    revision: MODEL_REVISION,\n    progress_callback: progressCallback,\n",
          )
          replace_once(
              'ai-search/assets/search-worker.js',
              '''function compactResult(item) {\n''',
              '''function dedupeRankedByUrl(ranked) {\n  const bestByUrl = new Map();\n  for (const item of ranked) {\n    const url = item?.document?.url;\n    if (!url) continue;\n    const previous = bestByUrl.get(url);\n    if (!previous || item.score > previous.score) bestByUrl.set(url, item);\n  }\n  return [...bestByUrl.values()].sort((left, right) => right.score - left.score);\n}\n\nfunction compactResult(item) {\n''',
          )
          replace_once(
              'ai-search/assets/search-worker.js',
              '''    excerpt: document.excerpt || String(document.text || '').slice(0, 360),\n    audience: document.audience,\n''',
              '''    heading: document.heading,\n    excerpt: document.excerpt || String(document.text || '').slice(0, 360),\n    audience: document.audience,\n''',
          )
          replace_once(
              'ai-search/assets/search-worker.js',
              '''  const limit = Math.max(1, Math.min(30, Number(message.limit) || 12));\n  self.postMessage({\n    type: 'results',\n    requestId: message.requestId,\n    mode: outcome.resultMode,\n    results: outcome.ranked.filter((item) => item.score > 0.01).slice(0, limit).map(compactResult),\n  });\n''',
              '''  const limit = Math.max(1, Math.min(30, Number(message.limit) || 12));\n  const uniqueRanked = dedupeRankedByUrl(outcome.ranked.filter((item) => item.score > 0.01));\n  self.postMessage({\n    type: 'results',\n    requestId: message.requestId,\n    mode: outcome.resultMode,\n    results: uniqueRanked.slice(0, limit).map(compactResult),\n  });\n''',
          )

          # Search page SEO and documentation now point to the active custom domain.
          for path in ('ai-search/index.html', 'ai-search/README.md'):
              if (ROOT / path).exists():
                  replace_all(path, OLD_BASE, NEW_BASE, minimum=1)

          # Placeholder manifest carries the same versioned contract as generated manifests.
          manifest_path = ROOT / 'ai-search/data/manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest.update({
              'version': 2,
              'ready': False,
              'model': 'intfloat/multilingual-e5-small',
              'modelRevision': MODEL_REVISION,
              'browserModel': 'Xenova/multilingual-e5-small',
              'browserModelRevision': BROWSER_REVISION,
              'corpusBaseUrl': NEW_BASE,
              'dimensions': 384,
              'dtype': 'float16',
              'normalized': True,
              'queryPrefix': 'query: ',
              'passagePrefix': 'passage: ',
          })
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Workflow builds and smoke-tests the actual custom-domain corpus.
          workflow_path = ROOT / '.github/workflows/semantic-search-index.yml'
          workflow = workflow_path.read_text(encoding='utf-8')
          workflow = workflow.replace(OLD_BASE, NEW_BASE)
          workflow = workflow.replace('key: hf-multilingual-e5-small-v1', 'key: hf-multilingual-e5-small-v2-pinned')
          workflow = workflow.replace('timeout-minutes: 180', 'timeout-minutes: 240')
          workflow = workflow.replace('            --max-pages 6000 \\\n', '            --max-pages 10000 \\\n')
          workflow = workflow.replace(
              "          assert manifest['model'] == 'intfloat/multilingual-e5-small'\n",
              "          assert manifest['model'] == 'intfloat/multilingual-e5-small'\n"
              f"          assert manifest['modelRevision'] == '{MODEL_REVISION}'\n"
              f"          assert manifest['browserModelRevision'] == '{BROWSER_REVISION}'\n"
              "          assert manifest['corpusBaseUrl'] == 'https://healthrenewal.org/'\n",
          )
          workflow = workflow.replace(
              "          git commit -m 'build semantic search index [skip ci]'\n          git push\n",
              "          git commit -m 'build semantic search index [skip ci]'\n"
              "          for attempt in {1..5}; do\n"
              "            git pull --rebase origin main && git push origin HEAD:main && exit 0\n"
              "            git rebase --abort || true\n"
              "            sleep $((attempt*3))\n"
              "          done\n"
              "          exit 1\n",
          )
          workflow_path.write_text(workflow, encoding='utf-8')

          # Extend the existing regression contract without requiring model downloads.
          test_path = ROOT / 'tests/test_ai_search_browser_index_v2.py'
          test = test_path.read_text(encoding='utf-8')
          test = test.replace(
              '        self.assertIn("Xenova/multilingual-e5-small", worker)\n',
              '        self.assertIn("Xenova/multilingual-e5-small", worker)\n'
              f'        self.assertIn("{BROWSER_REVISION}", worker)\n'
              '        self.assertIn("dedupeRankedByUrl", worker)\n'
              '        self.assertIn("revision: MODEL_REVISION", worker)\n',
          )
          test = test.replace(
              '        self.assertEqual(manifest["dimensions"], 384)\n',
              '        self.assertEqual(manifest["version"], 2)\n'
              '        self.assertEqual(manifest["dimensions"], 384)\n'
              '        self.assertEqual(manifest["corpusBaseUrl"], "https://healthrenewal.org/")\n'
              '        self.assertTrue(manifest["normalized"])\n',
          )
          test_path.write_text(test, encoding='utf-8')

          extra_test = ROOT / 'tests/test_multilingual_e5_production_v3.py'
          extra_test.write_text('''from __future__ import annotations\n\nimport json\nimport unittest\nfrom pathlib import Path\n\nROOT = Path(__file__).resolve().parents[1]\n\n\nclass MultilingualE5ProductionV3Tests(unittest.TestCase):\n    def test_custom_domain_is_the_corpus_source(self) -> None:\n        local = (ROOT / "scripts/build_semantic_search_index.py").read_text(encoding="utf-8")\n        remote = (ROOT / "scripts/build_remote_semantic_search_index.py").read_text(encoding="utf-8")\n        workflow = (ROOT / ".github/workflows/semantic-search-index.yml").read_text(encoding="utf-8")\n        self.assertIn('BASE_URL = "https://healthrenewal.org/"', local)\n        self.assertIn('DEFAULT_BASE_URL = "https://healthrenewal.org/"', remote)\n        self.assertIn("normalize_site_url", remote)\n        self.assertIn("https://healthrenewal.org/sitemap-index.xml", workflow)\n        self.assertNotIn("--base-url https://khaledaltheeb.github.io/pterminology-site/", workflow)\n\n    def test_model_contract_is_pinned_and_consistent(self) -> None:\n        manifest = json.loads((ROOT / "ai-search/data/manifest.json").read_text(encoding="utf-8"))\n        worker = (ROOT / "ai-search/assets/search-worker.js").read_text(encoding="utf-8")\n        builder = (ROOT / "scripts/build_semantic_search_index.py").read_text(encoding="utf-8")\n        self.assertEqual(manifest["model"], "intfloat/multilingual-e5-small")\n        self.assertEqual(manifest["browserModel"], "Xenova/multilingual-e5-small")\n        self.assertEqual(manifest["dimensions"], 384)\n        self.assertEqual(manifest["queryPrefix"], "query: ")\n        self.assertEqual(manifest["passagePrefix"], "passage: ")\n        self.assertIn(manifest["modelRevision"], builder)\n        self.assertIn(manifest["browserModelRevision"], worker)\n        self.assertIn("normalize_embeddings=True", builder)\n        self.assertIn("pooling: 'mean', normalize: true", worker)\n\n    def test_generated_results_are_unique_per_page(self) -> None:\n        worker = (ROOT / "ai-search/assets/search-worker.js").read_text(encoding="utf-8")\n        self.assertIn("function dedupeRankedByUrl", worker)\n        self.assertIn("const uniqueRanked = dedupeRankedByUrl", worker)\n\n    def test_search_page_uses_active_canonical(self) -> None:\n        page = (ROOT / "ai-search/index.html").read_text(encoding="utf-8")\n        self.assertIn('rel="canonical" href="https://healthrenewal.org/ai-search/"', page)\n        self.assertNotIn("khaledaltheeb.github.io/pterminology-site/ai-search/", page)\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding='utf-8')

          # Include the new contract test in the focused workflow.
          workflow = workflow_path.read_text(encoding='utf-8')
          workflow = workflow.replace(
              "      - 'tests/test_ai_search_browser_index_v2.py'\n",
              "      - 'tests/test_ai_search_browser_index_v2.py'\n      - 'tests/test_multilingual_e5_production_v3.py'\n",
          )
          workflow = workflow.replace(
              'tests/test_ai_search_browser_index_v2.py\n          node --check',
              'tests/test_ai_search_browser_index_v2.py tests/test_multilingual_e5_production_v3.py\n          node --check',
          )
          workflow = workflow.replace(
              'python -m unittest -v tests.test_ai_search_browser_index_v2\n',
              'python -m unittest -v tests.test_ai_search_browser_index_v2 tests.test_multilingual_e5_production_v3\n',
          )
          workflow_path.write_text(workflow, encoding='utf-8')

          # Contract checks before committing.
          for path in (
              'scripts/build_semantic_search_index.py',
              'scripts/build_remote_semantic_search_index.py',
              'ai-search/assets/search-worker.js',
              '.github/workflows/semantic-search-index.yml',
              'tests/test_multilingual_e5_production_v3.py',
          ):
              if OLD_BASE in (ROOT / path).read_text(encoding='utf-8') and path != 'scripts/build_semantic_search_index.py' and path != 'scripts/build_remote_semantic_search_index.py':
                  raise SystemExit(f'Unexpected legacy base remains in {path}')
          PY

      - name: Validate patched contracts
        shell: bash
        run: |
          set -euxo pipefail
          python -m py_compile \
            scripts/build_semantic_search_index.py \
            scripts/build_remote_semantic_search_index.py \
            tests/test_ai_search_browser_index_v2.py \
            tests/test_multilingual_e5_production_v3.py
          node --check ai-search/assets/app.js
          node --check ai-search/assets/search-core.js
          node --check ai-search/assets/search-worker.js
          python -m unittest -v \
            tests.test_ai_search_browser_index_v2 \
            tests.test_multilingual_e5_production_v3
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('ai-search/data/manifest.json').read_text(encoding='utf-8'))
          assert manifest['version']==2
          assert manifest['dimensions']==384
          assert manifest['corpusBaseUrl']=='https://healthrenewal.org/'
          assert manifest['normalized'] is True
          print(manifest)
          PY
          git diff --check

      - name: Commit production patch and remove temporary workflow
        shell: bash
        run: |
          set -euxo pipefail
          rm .github/workflows/e5-v3-patch-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: productionize multilingual E5 search'
          git push origin HEAD:agent/multilingual-e5-production-v3
