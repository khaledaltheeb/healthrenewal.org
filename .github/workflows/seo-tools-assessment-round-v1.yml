name: Tools assessment SEO round v1

on:
  pull_request:
    paths:
      - "scripts/enforce_tools_assessment_seo_v1.py"
      - ".github/workflows/seo-tools-assessment-round-v1.yml"
  workflow_run:
    workflows: ["Build complete institutional site v6 and deploy"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: tools-assessment-seo-postbuild
  cancel-in-progress: false

jobs:
  audit:
    if: github.event_name == 'pull_request' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      status: ${{ steps.verify.outputs.status }}
      success: ${{ steps.verify.outputs.success }}
      reused: ${{ steps.gate.outputs.reused }}

    steps:
      - name: Checkout scoped SEO implementation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve validated production artifact
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "workflow_run" ]; then
            echo "run_id=${SOURCE_RUN_ID}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=validated-production-site&per_page=100" \
            -o /tmp/baselines.json
          python - <<'PY'
          import json
          import os

          payload = json.load(open('/tmp/baselines.json', encoding='utf-8'))
          candidates = [
              item for item in payload.get('artifacts', [])
              if not item.get('expired')
              and item.get('workflow_run', {}).get('head_branch') == 'main'
              and item.get('workflow_run', {}).get('id')
          ]
          if not candidates:
              raise SystemExit('No active validated-production-site artifact from main')
          item = max(candidates, key=lambda value: value.get('created_at', ''))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"run_id={item['workflow_run']['id']}\n")
          print({'baselineRunId': item['workflow_run']['id'], 'createdAt': item.get('created_at')})
          PY

      - name: Download exact validated site
        uses: actions/download-artifact@v4
        with:
          name: validated-production-site
          path: _site
          repository: khaledaltheeb/healthrenewal.org
          run-id: ${{ steps.baseline.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Compile scoped gate
        run: |
          set -euo pipefail
          test -f _site/index.html
          python -m py_compile scripts/enforce_tools_assessment_seo_v1.py

      - name: Run 50-page material SEO round
        id: gate
        run: |
          set -euo pipefail
          mkdir -p _seo_private
          if [ "${{ github.event_name }}" = "workflow_run" ] && python - <<'PY'
          import json
          from pathlib import Path
          path = Path('_site/api/tools-assessment-seo-v1.json')
          if not path.is_file():
              raise SystemExit(1)
          data = json.loads(path.read_text(encoding='utf-8'))
          if data.get('status') != 'passed' or int(data.get('success', 0)) < 50:
              raise SystemExit(1)
          PY
          then
            echo "reused=true" >> "${GITHUB_OUTPUT}"
            echo "Existing completed round is current in the validated baseline."
          else
            python scripts/enforce_tools_assessment_seo_v1.py \
              _site \
              --target 50 \
              --manifest _seo_private/tools-assessment-search-map-v1.json \
              --report _site/api/tools-assessment-seo-v1.json
            echo "reused=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Verify material-success contract
        id: verify
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path('_site/api/tools-assessment-seo-v1.json').read_text(encoding='utf-8'))
          assert report['status'] == 'passed', report
          assert report['target'] == 50, report
          assert report['success'] >= 50, report
          assert report['manifestPages'] >= 50, report
          assert report['manifestMinimumQueryCount'] >= 500, report
          assert report['sitemapVerifiedSuccesses'] is True, report
          assert report['scopePagesDiscovered'] >= 50, report
          assert report['indexableOwnedPages'] >= 50, report
          assert report['scopePolicy'].startswith('head-only'), report
          successes = [row for row in report['results'] if row['status'] == 'success']
          assert len(successes) >= 50, len(successes)
          assert all(row['changes'] for row in successes), successes[:2]
          assert all(row['query_count'] >= 500 for row in successes), successes[:2]
          output = os.environ['GITHUB_OUTPUT']
          with open(output, 'a', encoding='utf-8') as target:
              target.write('status=passed\n')
              target.write(f"success={report['success']}\n")
          print(json.dumps({
              'status': report['status'],
              'target': report['target'],
              'success': report['success'],
              'failed': report['failed'],
              'noOpAlreadyOptimal': report['noOpAlreadyOptimal'],
              'remainingEligible': report['remainingEligible'],
              'manifestPages': report['manifestPages'],
              'manifestMinimumQueryCount': report['manifestMinimumQueryCount'],
              'changesSummary': report['changesSummary'],
          }, ensure_ascii=False, indent=2))
          PY

      - name: Preserve private semantic manifest
        if: steps.gate.outputs.reused != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tools-assessment-seo-private-manifest
          path: _seo_private/tools-assessment-search-map-v1.json
          retention-days: 90
          compression-level: 9

      - name: Preserve scoped SEO site for deployment
        uses: actions/upload-artifact@v4
        with:
          name: tools-assessment-seo-site
          path: _site
          include-hidden-files: true
          retention-days: 7
          compression-level: 6

  deploy:
    if: github.event_name == 'workflow_run' && needs.audit.outputs.status == 'passed' && needs.audit.outputs.reused != 'true'
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download verified scoped SEO site
        uses: actions/download-artifact@v4
        with:
          name: tools-assessment-seo-site
          path: _site

      - name: Promote SEO-hardened site as next validated baseline
        uses: actions/upload-artifact@v4
        with:
          name: validated-production-site
          path: _site
          include-hidden-files: true
          retention-days: 90
          compression-level: 6

      - uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy scoped post-build SEO publication
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify all successful pages live
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 60); do
            nonce="${GITHUB_RUN_ID}-${attempt}-$(date +%s)"
            if curl -fsSL --retry 2 -H 'Cache-Control: no-cache' \
              "https://healthrenewal.org/api/tools-assessment-seo-v1.json?release=${nonce}" \
              -o /tmp/tools-seo.json; then
              if python - <<'PY'
          import concurrent.futures
          import json
          import re
          import time
          import urllib.request

          report = json.load(open('/tmp/tools-seo.json', encoding='utf-8'))
          assert report['status'] == 'passed', report
          assert report['success'] >= 50, report
          assert report['manifestMinimumQueryCount'] >= 500, report
          assert report['sitemapVerifiedSuccesses'] is True, report
          rows = [row for row in report['results'] if row['status'] == 'success']
          assert len(rows) >= 50, len(rows)

          def check(row):
              url = row['url'] + ('&' if '?' in row['url'] else '?') + 'seo_verify=' + str(time.time_ns())
              request = urllib.request.Request(url, headers={'Cache-Control': 'no-cache', 'User-Agent': 'Rawafid-SEO-Release-Gate/1.0'})
              with urllib.request.urlopen(request, timeout=20) as response:
                  source = response.read().decode('utf-8', 'replace')
              canonical = row['url']
              fingerprint = row['fingerprint']
              assert f'fingerprint={fingerprint}' in source, row
              assert f'rel="canonical" href="{canonical}"' in source or f'href="{canonical}" rel="canonical"' in source, row
              assert f'property="og:url" content="{canonical}"' in source, row
              assert 'data-rawafid-seo="tools-assessment-seo-v1"' in source, row
              assert '<meta name="robots" content="index,follow,max-snippet:-1,max-image-preview:large,max-video-preview:-1">' in source, row
              return canonical

          with concurrent.futures.ThreadPoolExecutor(max_workers=10) as pool:
              checked = list(pool.map(check, rows[:report['success']]))
          assert len(checked) >= 50, len(checked)
          print({'liveVerifiedPages': len(checked), 'success': report['success'], 'failed': report['failed']})
          PY
              then
                ready=1
                break
              fi
            fi
            sleep 5
          done
          test "$ready" = 1
