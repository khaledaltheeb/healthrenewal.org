name: Validate home and daily-environment sector v330
on:
  pull_request:
    branches: [main]
    paths: ["sectors/home/**","sectors/index.html","scripts/verify_home_sector_v330.py","tests/test_home_sector_v330.py",".github/workflows/validate-home-sector-v330.yml"]
  push:
    branches: [main]
    paths: ["sectors/home/**","sectors/index.html","scripts/verify_home_sector_v330.py","tests/test_home_sector_v330.py",".github/workflows/validate-home-sector-v330.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: home-sector-v330-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile verifier and tests
        run: python3 -m py_compile scripts/verify_home_sector_v330.py tests/test_home_sector_v330.py
      - name: Run contract
        id: contract
        shell: bash
        run: |
          set +e
          python3 scripts/verify_home_sector_v330.py --json > /tmp/home-sector-v330-report.json 2>&1
          code=$?
          cat /tmp/home-sector-v330-report.json
          printf 'exit_code=%s\n' "$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-sector-v330-report
          path: /tmp/home-sector-v330-report.json
          retention-days: 7
      - name: Enforce contract
        if: steps.contract.outputs.exit_code != '0'
        run: exit 1
      - name: Run regression tests
        run: python3 -m unittest -v tests.test_home_sector_v330
      - name: Verify publication wiring
        run: |
          set -euxo pipefail
          test -s sectors/home/index.html
          test -s sectors/home/library/index.html
          test -s sectors/home/assessment/index.html
          test -s sectors/home/interventions/index.html
          test -s sectors/home/assets/home-sector.css
          grep -q 'href="home/"' sectors/index.html
          grep -q 'MedicalWebPage' sectors/home/index.html
          grep -q 'FAQPage' sectors/home/index.html
          grep -q 'home-sector-a11y-scroll-v330' sectors/home/assets/home-sector.css
          ! grep -R -n 'noindex' sectors/home
          ! grep -R -n 'href="#"' sectors/home