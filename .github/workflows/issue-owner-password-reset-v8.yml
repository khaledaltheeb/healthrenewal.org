name: Issue owner password reset v8

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/issue-owner-password-reset-v8.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: issue-owner-password-reset-v8
  cancel-in-progress: false

jobs:
  issue:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '826ac34927c1e045c06145a327c2ac52' }}
      OWNER_EMAIL: pterminology@gmail.com
      DATABASE_NAME: pterminology-specialists
      RESET_PAGE: https://healthrenewal.org/specialists-partners/password-reset/
      IDENTITY_API: https://pterminology-specialist-accounts.pterminology-826ac349.workers.dev
      ISSUANCE_TRIGGER: "2026-07-31T01:13:00+03:00"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Wait for isolated v9 page and live reset route
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          for attempt in {1..60}; do
            stamp="$(date +%s)"
            page="$(curl -fsS --max-time 15 "${RESET_PAGE}?v=9&probe=${stamp}" || true)"
            script="$(curl -fsS --max-time 15 "${RESET_PAGE}reset-v9.js?v=9.0.0&probe=${stamp}" || true)"
            if grep -q 'هذه صفحة مستقلة وآمنة' <<<"${page}" \
              && grep -q 'pterminology-password-reset-v9' <<<"${script}" \
              && grep -q '/v1/auth/password/reset' <<<"${script}" \
              && ! grep -q 'PT_SPECIALIST_CONFIG' <<<"${script}"; then
              ready=true
              break
            fi
            sleep 5
          done
          [[ "${ready}" == "true" ]] || { echo "::error::The isolated v9 password reset page is not live"; exit 1; }
          code="$(curl -sS -o /tmp/reset-route.json -w '%{http_code}' -X POST \
            -H 'Origin: https://healthrenewal.org' \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json;charset=UTF-8' \
            -H 'x-requested-with: pterminology-password-reset-v9' \
            --data '{}' "${IDENTITY_API}/v1/auth/password/reset" || true)"
          [[ "${code}" == "400" ]] || { cat /tmp/reset-route.json || true; echo "::error::Reset route returned HTTP ${code}"; exit 1; }
          python - <<'PY'
          import json
          data=json.load(open('/tmp/reset-route.json',encoding='utf-8'))
          assert data.get('error') == 'missing_field', data
          PY
          echo "Isolated v9 page and identity reset route are live."

      - name: Discover D1 database and issue one-time token
        id: issue
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]] || { echo "::error::CLOUDFLARE_API_TOKEN missing"; exit 1; }
          mkdir -p reports /tmp/reset-artifact
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database?per_page=100" -o /tmp/d1.json
          DATABASE_ID="$(python - <<'PY'
          import json, os
          data=json.load(open('/tmp/d1.json',encoding='utf-8'))
          matches=[x for x in data.get('result',[]) if x.get('name')==os.environ['DATABASE_NAME']]
          if not matches or not matches[0].get('uuid'):
              raise SystemExit('D1 database not found')
          print(matches[0]['uuid'])
          PY
          )"
          export DATABASE_ID
          cat > /tmp/wrangler.toml <<EOF
          name = "pterminology-reset-helper"
          main = "noop.js"
          compatibility_date = "2026-07-01"
          [[d1_databases]]
          binding = "DB"
          database_name = "${DATABASE_NAME}"
          database_id = "${DATABASE_ID}"
          EOF
          printf 'export default {fetch(){return new Response("ok")}};' > /tmp/noop.js
          python - <<'PY'
          import hashlib, json, os, secrets, uuid
          from datetime import datetime, timedelta, timezone
          raw=secrets.token_urlsafe(32)
          print(f'::add-mask::{raw}')
          now=datetime.now(timezone.utc)
          expires=now+timedelta(minutes=30)
          token_id=str(uuid.uuid4())
          token_hash=hashlib.sha256(raw.encode()).hexdigest()
          email=os.environ['OWNER_EMAIL'].replace("'","''")
          sql=f"""
          DELETE FROM password_reset_tokens
          WHERE user_id=(SELECT id FROM identity_users WHERE lower(email)=lower('{email}') LIMIT 1)
            AND (used_at IS NOT NULL OR expires_at <= '{now.isoformat()}');
          INSERT INTO password_reset_tokens
            (id,user_id,token_hash,purpose,expires_at,requested_by_user_id,created_at)
          SELECT '{token_id}',id,'{token_hash}','reset','{expires.isoformat()}',NULL,'{now.isoformat()}'
          FROM identity_users WHERE lower(email)=lower('{email}') AND status IN ('active','invited') LIMIT 1;
          """
          open('/tmp/reset.sql','w',encoding='utf-8').write(sql)
          link=os.environ['RESET_PAGE']+'?v=9#resetToken='+raw
          open('/tmp/reset-artifact/reset-link.txt','w',encoding='utf-8').write(link+'\n')
          open('/tmp/reset-meta.json','w',encoding='utf-8').write(json.dumps({'expires_at':expires.isoformat(),'token_id':token_id},indent=2))
          PY
          (cd /tmp && npx --yes wrangler@4 d1 execute "${DATABASE_NAME}" --remote --config /tmp/wrangler.toml --file /tmp/reset.sql)
          CHECK="$(cd /tmp && npx --yes wrangler@4 d1 execute "${DATABASE_NAME}" --remote --config /tmp/wrangler.toml --command "SELECT COUNT(*) AS count FROM password_reset_tokens t JOIN identity_users u ON u.id=t.user_id WHERE lower(u.email)=lower('${OWNER_EMAIL}') AND t.used_at IS NULL AND t.expires_at > datetime('now');" --json)"
          export CHECK
          python - <<'PY'
          import json, os
          data=json.loads(os.environ['CHECK'])
          rows=[]
          for block in data:
              rows.extend(block.get('results') or [])
          count=max([int(r.get('count',0)) for r in rows] or [0])
          if count < 1:
              raise SystemExit('reset token was not inserted')
          meta=json.load(open('/tmp/reset-meta.json',encoding='utf-8'))
          report={'schema_version':2,'issued':True,'page_verified':True,'route_verified':True,'owner_email':'pterminology@gmail.com','expires_at':meta['expires_at'],'artifact_name':'owner-password-reset-link-v8','run_id':os.environ['GITHUB_RUN_ID']}
          open('reports/owner-password-reset-v8.json','w',encoding='utf-8').write(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          PY

      - name: Upload private reset link artifact
        uses: actions/upload-artifact@v4
        with:
          name: owner-password-reset-link-v8
          path: /tmp/reset-artifact/reset-link.txt
          retention-days: 1
          if-no-files-found: error

      - name: Commit safe issuance report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/owner-password-reset-v8.json
          git commit -m "chore: record verified isolated owner reset issuance v9"
          git pull --rebase origin main
          git push origin HEAD:main
