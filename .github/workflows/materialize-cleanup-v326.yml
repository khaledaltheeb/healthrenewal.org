name: Materialize final cleanup v326

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/materialize-cleanup-v326.yml"

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Verify successful deployment receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          status=json.loads(Path('pages-deployment-status.json').read_text(encoding='utf-8'))
          expected={
              'schema_version':324,
              'status':'deployed',
              'deployment_outcome':'success',
              'live_routes_verified':6,
          }
          for key,value in expected.items():
              assert status.get(key)==value,(key,value,status.get(key),status)
          print(status)
          PY

      - name: Patch v31 and delete temporary files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          v31=Path('.github/workflows/validate-all-labs-v22.yml')
          text=v31.read_text(encoding='utf-8')
          marker='concurrency:\n  group: validate-all-labs-v31-main\n  cancel-in-progress: true\n'
          if marker not in text:
              anchor='env:\n  SITE_BASE: https://khaledaltheeb.github.io/pterminology-site/\n\njobs:\n'
              assert anchor in text,'v31 insertion anchor missing'
              replacement='env:\n  SITE_BASE: https://khaledaltheeb.github.io/pterminology-site/\n\n'+marker+'\njobs:\n'
              v31.write_text(text.replace(anchor,replacement,1),encoding='utf-8')
          assert marker in v31.read_text(encoding='utf-8')

          paths=(
              '.github/workflows/patch-v31-concurrency-once.yml',
              '.github/workflows/patch-v31-concurrency-direct.yml',
              '.github/workflows/one-shot-validated-pages-v323.yml',
              '.github/workflows/dispatch-one-shot-v323-on-issue.yml',
              '.github/workflows/deploy-observable-pages-v324.yml',
              '.github/workflows/finalize-publication-cleanup-v324.yml',
              '.github/workflows/final-cleanup-v325.yml',
              '.github/workflows/inspect-cleanup-v325-on-issue.yml',
              '.github/workflows/materialize-cleanup-v326.yml',
              'release-v323-issue-trigger.txt',
              'production-rebuild-trigger-v322.json',
              'production-rebuild-trigger-v322.md',
              'production-rebuild-trigger-v322.txt',
              'production-rebuild-trigger-v322.lock',
              'production-rebuild-trigger-v322.ready',
              'production-rebuild-trigger-v322.final',
              'production-rebuild-trigger-v322.complete',
              'production-rebuild-trigger-v322.go',
              'production-rebuild-trigger-v322.merge',
              'production-rebuild-trigger-v322.pr',
              'production-rebuild-trigger-v322.open',
          )
          removed=[]
          for relative in paths:
              path=Path(relative)
              if path.is_file():
                  path.unlink()
                  removed.append(relative)

          trigger=Path('deployment.json')
          if trigger.is_file():
              try:
                  payload=json.loads(trigger.read_text(encoding='utf-8'))
              except Exception:
                  payload={}
              if payload.get('status')=='publication-surface-ready':
                  trigger.unlink()
                  removed.append('deployment.json')

          print({'v31_concurrency':'enabled','removed':removed})
          PY

      - name: Commit cleanup to pull request branch
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          test -n "$(git diff --cached --name-only)"
          git commit -m "ci: materialize final cleanup v326 [skip ci]"
          git push origin "HEAD:${HEAD_REF}"
