name: Bootstrap platform experience v333

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["agent/sitewide-structured-data-v332"]
    paths:
      - ".bootstrap-v333/**"
      - ".github/workflows/bootstrap-platform-experience-v333.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-platform-experience-v333
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sitewide-structured-data-v332
          fetch-depth: 0

      - name: Reassemble and verify reviewed source
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import shutil
          import zlib

          parts = [Path(f'.bootstrap-v333/source.part{index:02d}').read_text(encoding='utf-8').strip() for index in range(5)]
          source_payload = ''.join(parts)
          tests_payload = Path('.bootstrap-v333/tests.b64').read_text(encoding='utf-8').strip()

          expected = {
              'source': '9956bab7b5700520a36694027e5831cfeff65862c75cd65cc4db92618e459d59',
              'tests': 'ed3f81001149317155097992144b6cad71c16461990c70312b1329549ab50e3c',
          }
          actual = {
              'source': hashlib.sha256(source_payload.encode('ascii')).hexdigest(),
              'tests': hashlib.sha256(tests_payload.encode('ascii')).hexdigest(),
          }
          assert actual == expected, {'expected': expected, 'actual': actual}

          mapping = {
              'scripts/enhance_platform_experience_v333.py': source_payload,
              'tests/test_platform_experience_v333.py': tests_payload,
          }
          for target, payload in mapping.items():
              data = zlib.decompress(base64.b64decode(payload, validate=True))
              output = Path(target)
              output.parent.mkdir(parents=True, exist_ok=True)
              output.write_bytes(data)

          shutil.rmtree('.bootstrap-v333')
          Path('.github/workflows/bootstrap-platform-experience-v333.yml').unlink()
          print({'source_sha256': actual['source'], 'tests_sha256': actual['tests']})
          PY

      - name: Validate Python and browser source
        run: |
          set -euxo pipefail
          python -m py_compile scripts/enhance_platform_experience_v333.py tests/test_platform_experience_v333.py
          python -m unittest -v tests/test_platform_experience_v333.py
          python - <<'PY'
          import importlib.util
          import sys
          from pathlib import Path
          source=Path('scripts/enhance_platform_experience_v333.py')
          spec=importlib.util.spec_from_file_location('platform_experience_v333', source)
          module=importlib.util.module_from_spec(spec)
          sys.modules[spec.name]=module
          spec.loader.exec_module(module)
          Path('/tmp/platform-experience-v333.js').write_text(module.JS, encoding='utf-8')
          assert 'pterminology.library.v333' in module.JS
          assert 'pterminology.results.v333' in module.JS
          assert 'pterminology:assessment-result' in module.JS
          assert module.VERSION == 333
          PY
          node --check /tmp/platform-experience-v333.js

      - name: Commit materialized implementation
        run: |
          set -euxo pipefail
          find scripts tests -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "إضافة البحث الشامل والمكتبة المحلية ومسار التوصيات v333"
          git push origin HEAD:agent/sitewide-structured-data-v332
