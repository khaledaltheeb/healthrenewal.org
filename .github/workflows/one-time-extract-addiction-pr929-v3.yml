name: One-time extract addiction PR 929 v3

on:
  pull_request_target:
    types: [synchronize]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: one-time-extract-addiction-pr929-v3
  cancel-in-progress: false

jobs:
  extract-visible-files:
    if: >-
      github.event.pull_request.number == 929 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/addiction-condition-guides-v2-20260803'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Extract and commit visible publication files
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -uo pipefail
          rm -f /tmp/addiction-pr929-v3.log
          set +e
          python scripts/materialize_addiction_condition_guides_v2.py . > /tmp/addiction-pr929-v3.log 2>&1
          status=$?
          set -e
          cat /tmp/addiction-pr929-v3.log
          git config user.name "healthrenewal-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ "$status" -ne 0 ]; then
            mkdir -p diagnostics
            cp /tmp/addiction-pr929-v3.log diagnostics/addiction-pr929-materializer-v3.log
            git add diagnostics/addiction-pr929-materializer-v3.log
            git commit -m "diagnostic(addiction): capture PR 929 extraction failure"
            git push origin HEAD:"${HEAD_BRANCH}"
            exit "$status"
          fi
          test -f addiction/cannabis-use-disorder/index.html
          test -f addiction/nicotine-tobacco-dependence/index.html
          test -f addiction/sedative-benzodiazepine-use-disorder/index.html
          test -f addiction/gambling-related-harms/index.html
          test -f addiction/gaming-disorder/index.html
          test -f addiction/inhalant-use-disorder/index.html
          test -f addiction/polysubstance-use-and-overdose-risk/index.html
          test -f addiction/editorial-manifest.json
          test -f api/addiction-condition-guides-v2.json
          git add addiction api assets/addiction sitemap.xml sitemap-addiction.xml sitemap-index.xml
          git status --short
          git commit -m "content(addiction): materialize all ten visible condition guides"
          git push origin HEAD:"${HEAD_BRANCH}"
      - name: Remove one-time workflow from main
        if: always()
        run: |
          set -euxo pipefail
          git fetch origin main
          git checkout -B main origin/main
          if [ -f .github/workflows/one-time-extract-addiction-pr929-v3.yml ]; then
            git rm .github/workflows/one-time-extract-addiction-pr929-v3.yml
            git config user.name "healthrenewal-bot"
            git config user.email "actions@users.noreply.github.com"
            git commit -m "ci(addiction): remove one-time extraction gate v3"
            git push origin main
          fi
