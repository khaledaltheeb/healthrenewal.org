name: Build quick info 150

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]
    paths:
      - ".github/quick-info-payload/**"
      - ".github/workflows/build-quick-info-150.yml"
      - "scripts/build_quick_info.py"
      - "quick-info/**"
      - "assets/quick-info/**"
      - "api/v1/quick-info.json"
      - "sitemap-quick-info.xml"
      - "sitemap-index.xml"
      - "index.html"
      - "tests/test_quick_info_section.py"
      - "reports/quick-info-build.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quick-info-150-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/quick-info-150')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout quick-info branch
        uses: actions/checkout@v4
        with:
          ref: agent/quick-info-150
          fetch-depth: 0

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image renderer
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow

      - name: Restore and compile generator
        run: |
          if [ ! -f scripts/build_quick_info.py ]; then
            mkdir -p scripts
            cat .github/quick-info-payload/part-* | base64 --decode | gzip --decompress > scripts/build_quick_info.py
          fi
          python -m py_compile scripts/build_quick_info.py

      - name: Generate 150-page section
        run: python scripts/build_quick_info.py

      - name: Validate content, metadata, images, and discovery files
        run: |
          python - <<'PY'
          import runpy
          namespace = runpy.run_path("tests/test_quick_info_section.py")
          tests = [
              value
              for name, value in sorted(namespace.items())
              if name.startswith("test_") and callable(value)
          ]
          if not tests:
              raise SystemExit("No quick-info tests were discovered")
          for test in tests:
              test()
              print(f"PASS {test.__name__}")
          PY

      - name: Remove bootstrap payload
        run: rm -rf .github/quick-info-payload

      - name: Commit generated section
        run: |
          git config user.name "Quick Info Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "feat(content): publish 150 quick info pages"
          git push origin HEAD:agent/quick-info-150
