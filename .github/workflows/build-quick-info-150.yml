name: Build quick info 250

on:
  push:
    branches:
      - agent/quick-info-250
    paths:
      - ".github/workflows/build-quick-info-150.yml"
      - "content/quick-info-extension-v250.tsv"
      - "scripts/build_quick_info.py"
      - "scripts/extend_quick_info_200.py"
      - "scripts/extend_quick_info_250.py"
      - "scripts/enhance_quick_info_discover.py"
      - "scripts/enhance_quick_info_discover_250.py"
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/build-quick-info-150.yml"
      - "content/quick-info-extension-v250.tsv"
      - "scripts/build_quick_info.py"
      - "scripts/extend_quick_info_200.py"
      - "scripts/extend_quick_info_250.py"
      - "scripts/enhance_quick_info_discover.py"
      - "scripts/enhance_quick_info_discover_250.py"
      - "quick-info/**"
      - "assets/quick-info/**"
      - "api/v1/quick-info.json"
      - "sitemap-quick-info.xml"
      - "sitemap-index.xml"
      - "index.html"
      - "tests/test_quick_info_section.py"
      - "reports/quick-info-build.json"
      - "reports/quick-info-discover-observability.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quick-info-250-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/quick-info-250')
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Resolve source branch
        id: source
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "branch=${{ github.event.pull_request.head.ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "branch=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.branch }}
          fetch-depth: 0

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow

      - name: Compile generators
        run: |
          python -m py_compile \
            scripts/build_quick_info.py \
            scripts/extend_quick_info_200.py \
            scripts/extend_quick_info_250.py \
            scripts/enhance_quick_info_discover.py \
            scripts/enhance_quick_info_discover_250.py

      - name: Build and enhance 250 pages
        run: |
          python scripts/extend_quick_info_250.py
          python scripts/enhance_quick_info_discover_250.py

      - name: Validate section contracts
        run: |
          python - <<'PY'
          import runpy
          namespace = runpy.run_path("tests/test_quick_info_section.py")
          tests = [
              value
              for name, value in sorted(namespace.items())
              if name.startswith("test_") and callable(value)
          ]
          if not tests:
              raise SystemExit("No quick-info tests were discovered")
          for test in tests:
              test()
              print(f"PASS {test.__name__}")
          PY

          python - <<'PY'
          import json
          from pathlib import Path

          build = json.loads(Path("reports/quick-info-build.json").read_text(encoding="utf-8"))
          discover = json.loads(Path("reports/quick-info-discover-observability.json").read_text(encoding="utf-8"))
          assert build["pages"] == 250, build
          assert build["newPages"] == 50, build
          assert build["images"] == 251, build
          assert build["errors"] == [], build
          assert discover["pages"] == 250, discover
          assert discover["analyticsPages"] == 251, discover
          assert discover["articleMetadataPages"] == 250, discover
          assert discover["prioritizedCoverImages"] == 250, discover
          assert discover["rssItems"] == 250, discover
          assert discover["canonicalUrlsPreserved"] is True, discover
          assert discover["titlesPreserved"] is True, discover
          assert discover["failures"] == [], discover
          print(build)
          print(discover)
          PY

          test "$(find quick-info -mindepth 2 -maxdepth 2 -name index.html | wc -l)" -eq 250
          test "$(find assets/quick-info/cards -maxdepth 1 -name '*.png' | wc -l)" -eq 250
          test "$(grep -rl 'G-VLZMV8Y4JP' quick-info/index.html quick-info/*/index.html | wc -l)" -eq 251
          test "$(grep -rl 'fetchpriority="high"' quick-info/*/index.html | wc -l)" -eq 250
          test "$(grep -o '<item>' quick-info/feed.xml | wc -l)" -eq 250
          test "$(grep -o '<url>' sitemap-quick-info.xml | wc -l)" -eq 251
          grep -q '250 صفحة' quick-info/index.html
          grep -q 'مسامحة أم مصالحة' quick-info/forgiveness-vs-reconciliation/index.html
          grep -q 'كيف تستعد لأول جلسة علاج نفسي' quick-info/prepare-first-therapy-session/index.html
          python scripts/verify_homepage_v19.py

      - name: Commit generated section
        env:
          SOURCE_BRANCH: ${{ steps.source.outputs.branch }}
        run: |
          set -euo pipefail
          git config user.name "Quick Info Automation"
          git config user.email "actions@users.noreply.github.com"
          git add \
            quick-info \
            assets/quick-info \
            api/v1/quick-info.json \
            sitemap-quick-info.xml \
            sitemap-index.xml \
            index.html \
            tests/test_quick_info_section.py \
            reports/quick-info-build.json \
            reports/quick-info-discover-observability.json
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "feat(quick-info): publish 250-page section"
          git push origin "HEAD:${SOURCE_BRANCH}"
