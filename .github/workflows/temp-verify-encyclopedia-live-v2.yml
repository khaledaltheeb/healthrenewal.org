name: Temporary verify encyclopedia production release v2

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  verify-production-run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Wait for final non-cancelled encyclopedia deployment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euxo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess
          import time
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          pr_number = os.environ['PR_NUMBER']
          minimum_run_id = 30701221133
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'encyclopedia-production-verifier-v4',
          }

          def get_json(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          list_url = f'https://api.github.com/repos/{repo}/actions/workflows/deploy-encyclopedia-seo-search-intent-v1.yml/runs?event=workflow_dispatch&branch=main&per_page=100'
          run = None
          for attempt in range(90):
              data = get_json(list_url)
              candidates = [
                  item for item in data.get('workflow_runs', [])
                  if int(item.get('id', 0)) > minimum_run_id
                  and item.get('name') == 'Deploy encyclopedia SEO and search intent v1'
                  and item.get('conclusion') != 'cancelled'
              ]
              if candidates:
                  run = max(candidates, key=lambda item: int(item['id']))
                  break
              print({'attempt': attempt + 1, 'status': 'waiting_for_final_run'})
              time.sleep(5)
          if not run:
              raise SystemExit('No final non-cancelled deployment run found')

          run_id = int(run['id'])
          head_sha = str(run.get('head_sha') or '')
          run_url = f'https://api.github.com/repos/{repo}/actions/runs/{run_id}'
          subprocess.run([
              'gh', 'api', f'repos/{repo}/issues/{pr_number}/comments',
              '-f', f'body=ENCYCLOPEDIA_FINAL_RUN run_id={run_id} sha={head_sha} status={run.get("status")}'
          ], check=True)

          for attempt in range(180):
              current = get_json(run_url)
              status = current.get('status')
              conclusion = current.get('conclusion')
              print({'attempt': attempt + 1, 'run_id': run_id, 'status': status, 'conclusion': conclusion})
              if status == 'completed':
                  body = f'ENCYCLOPEDIA_FINAL_RESULT run_id={run_id} sha={head_sha} conclusion={conclusion}'
                  subprocess.run(['gh', 'api', f'repos/{repo}/issues/{pr_number}/comments', '-f', f'body={body}'], check=True)
                  if conclusion != 'success':
                      raise SystemExit(f'Final deployment failed: {conclusion}; run_id={run_id}')
                  raise SystemExit(0)
              time.sleep(10)
          raise SystemExit(f'Timed out waiting for final deployment run_id={run_id}')
          PY
