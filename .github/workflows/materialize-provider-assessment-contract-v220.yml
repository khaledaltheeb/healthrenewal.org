name: Materialize provider assessment contract v220

on:
  push:
    branches:
      - agent/provider-assessment-contract-v220
    paths:
      - "scripts/.v220-js-part1.txt"
      - "scripts/.v220-js-part2.txt"
      - "scripts/materialize_provider_assessment_contract_v220.py"
      - ".github/workflows/materialize-provider-assessment-contract-v220.yml"
  pull_request:
    branches:
      - main
    paths:
      - "scripts/.v220-js-part1.txt"
      - "scripts/.v220-js-part2.txt"
      - "scripts/materialize_provider_assessment_contract_v220.py"
      - ".github/workflows/materialize-provider-assessment-contract-v220.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: materialize-provider-assessment-contract-v220
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/provider-assessment-contract-v220
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Materialize and validate the institutional contract
        run: |
          set -euxo pipefail
          # The two .txt files are Base85 payload segments, not disposable corruption.
          python scripts/materialize_provider_assessment_contract_v220.py
          node --check provider-assessment-demo/institutional-contract-v220.js
          python -m json.tool provider-assessment-demo/institutional-contract-v220.json >/dev/null
          python -m unittest -v tests/test_provider_assessment_contract_v220.py
          sha256sum \
            provider-assessment-demo/index.html \
            provider-assessment-demo/institutional-contract-v220.js \
            provider-assessment-demo/institutional-contract-v220.json \
            tests/test_provider_assessment_contract_v220.py \
            .github/workflows/validate-provider-assessment-contract-v220.yml \
            > provider-assessment-contract-v220.sha256
      - name: Upload validated generated contract
        uses: actions/upload-artifact@v4
        with:
          name: provider-assessment-contract-v220-generated
          if-no-files-found: error
          retention-days: 7
          path: |
            provider-assessment-demo/index.html
            provider-assessment-demo/institutional-contract-v220.js
            provider-assessment-demo/institutional-contract-v220.json
            tests/test_provider_assessment_contract_v220.py
            .github/workflows/validate-provider-assessment-contract-v220.yml
            provider-assessment-contract-v220.sha256
