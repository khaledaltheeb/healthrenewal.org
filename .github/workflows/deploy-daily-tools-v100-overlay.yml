name: Build and deploy daily tools v100 overlay

on:
  pull_request:
    branches: ["main"]
    paths:
      - "content/v24/daily-tools-v100/**"
      - "content/v24/daily-tools-sources-v100.json"
      - "content/v24/daily-tools-learning-paths-ar.json"
      - "scripts/daily_tools_v100.py"
      - "scripts/publish_daily_tools_v24.py"
      - "scripts/verify_daily_tools_v24.py"
      - "scripts/publish_sleep_log_v49.py"
      - "scripts/verify_sleep_log_v49.py"
      - "scripts/finalize_pwa_v14.py"
      - "assets/sleep-log-v49.js"
      - "tests/test_sleep_log_v49.mjs"
      - ".github/workflows/deploy-daily-tools-v100-overlay.yml"
  push:
    branches: ["main"]
    paths:
      - "content/v24/daily-tools-v100/**"
      - "content/v24/daily-tools-sources-v100.json"
      - "content/v24/daily-tools-learning-paths-ar.json"
      - "scripts/daily_tools_v100.py"
      - "scripts/publish_daily_tools_v24.py"
      - "scripts/verify_daily_tools_v24.py"
      - "scripts/publish_sleep_log_v49.py"
      - "scripts/verify_sleep_log_v49.py"
      - "scripts/finalize_pwa_v14.py"
      - "assets/sleep-log-v49.js"
      - "tests/test_sleep_log_v49.mjs"
      - ".github/workflows/deploy-daily-tools-v100-overlay.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: daily-tools-pages-overlay-v100-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-overlay:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Resolve currently deployed validated production artifact
        id: base
        run: |
          set -euxo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = json.loads(Path('pages-deployment-status-v329.json').read_text(encoding='utf-8'))
          assert receipt['status'] == 'deployed', receipt
          assert receipt['deployment_outcome'] == 'success', receipt
          assert receipt['artifact'] == 'validated-production-site', receipt
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"run_id={receipt['source_workflow_run_id']}\n")
              output.write(f"source_commit={receipt['source_commit']}\n")
          print({
              'base_run_id': receipt['source_workflow_run_id'],
              'base_source_commit': receipt['source_commit'],
          })
          PY

      - name: Download exact currently deployed production site
        uses: actions/download-artifact@v4
        with:
          name: validated-production-site
          path: _site
          repository: ${{ github.repository }}
          run-id: ${{ steps.base.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify base artifact provenance
        env:
          EXPECTED_RUN_ID: ${{ steps.base.outputs.run_id }}
          EXPECTED_SOURCE_COMMIT: ${{ steps.base.outputs.source_commit }}
        run: |
          set -euxo pipefail
          test -f _site/index.html
          test -f _site/deployment.json
          test -f _site/library/index.html
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          deployment = json.loads(Path('_site/deployment.json').read_text(encoding='utf-8'))
          assert str(deployment['workflow_run']) == os.environ['EXPECTED_RUN_ID'], deployment
          assert deployment['commit'] == os.environ['EXPECTED_SOURCE_COMMIT'], deployment
          print({'validated_base': True, 'deployment': deployment})
          PY

      - name: Build the 100-tool overlay
        run: |
          set -euxo pipefail
          python -m py_compile \
            scripts/daily_tools_v100.py \
            scripts/publish_daily_tools_v24.py \
            scripts/verify_daily_tools_v24.py \
            scripts/publish_sleep_log_v49.py \
            scripts/verify_sleep_log_v49.py \
            scripts/finalize_pwa_v14.py
          node --check assets/sleep-log-v49.js
          node --check tests/test_sleep_log_v49.mjs

          python scripts/publish_daily_tools_v24.py _site
          python scripts/publish_sleep_log_v49.py _site
          python - <<'PY'
          from pathlib import Path

          page = Path('_site/daily-tools/sleep-wind-down-plan/index.html')
          text = page.read_text(encoding='utf-8')
          old = '<svg data-sleep-chart viewBox="0 0 720 300" role="img" aria-labelledby="sleep-chart-title sleep-chart-desc"><title id="sleep-chart-title">اتجاهات النوم والجودة والطاقة</title><desc id="sleep-chart-desc">رسم خطي لآخر أربعة عشر سجلًا محفوظًا. الوصف النصي المتجدد يظهر قبل الرسم.</desc>'
          new = '<svg data-sleep-chart viewBox="0 0 720 300" role="img" aria-label="اتجاهات النوم والجودة والطاقة. الوصف النصي المتجدد يظهر قبل الرسم.">'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Expected sleep chart accessibility markup was not found')
          page.write_text(text, encoding='utf-8')
          PY

          python scripts/verify_sleep_log_v49.py
          node tests/test_sleep_log_v49.mjs
          python scripts/finalize_pwa_v14.py _site
          python scripts/verify_daily_tools_v24.py _site

      - name: Validate counts discovery privacy and evidence
        env:
          BASE_RUN_ID: ${{ steps.base.outputs.run_id }}
          BASE_SOURCE_COMMIT: ${{ steps.base.outputs.source_commit }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone
          from pathlib import Path

          site = Path('_site')
          errors = []
          daily = json.loads((site / 'api/daily-tools-v24.json').read_text(encoding='utf-8'))
          expected = {
              'catalog_contract': 100,
              'tools': 100,
              'categories': 10,
              'paths': 10,
              'pages': 112,
              'local_only': True,
              'search_and_filters': True,
              'per_tool_sources': True,
              'homepage_linked': True,
          }
          for key, value in expected.items():
              if daily.get(key) != value:
                  errors.append({'check': f'report.{key}', 'expected': value, 'actual': daily.get(key)})

          tool_pages = list((site / 'daily-tools').rglob('index.html'))
          path_pages = list((site / 'learning-paths').rglob('index.html'))
          if len(tool_pages) != 101:
              errors.append({'check': 'daily_tool_html_pages', 'expected': 101, 'actual': len(tool_pages)})
          if len(path_pages) != 11:
              errors.append({'check': 'learning_path_html_pages', 'expected': 11, 'actual': len(path_pages)})

          child_sitemap = ET.parse(site / 'sitemap-tools-paths.xml').getroot()
          child_urls = len(list(child_sitemap))
          if child_urls != 112:
              errors.append({'check': 'tool_path_sitemap_urls', 'expected': 112, 'actual': child_urls})

          master_sitemap = (site / 'sitemap.xml').read_text(encoding='utf-8')
          master_refs = master_sitemap.count('sitemap-tools-paths.xml')
          if master_refs != 1:
              errors.append({'check': 'master_sitemap_reference', 'expected': 1, 'actual': master_refs})

          index = (site / 'daily-tools/index.html').read_text(encoding='utf-8')
          cards = index.count('<article data-tool-card ')
          if cards != 100:
              errors.append({'check': 'tool_cards', 'expected': 100, 'actual': cards})
          for marker in ('data-tool-search', 'data-category-select', '100 أداة نفسية وتربوية يومية'):
              if marker not in index:
                  errors.append({'check': 'daily_tools_index_marker', 'missing': marker})

          homepage = (site / 'index.html').read_text(encoding='utf-8')
          if '100 أداة عربية عملية' not in homepage:
              errors.append({'check': 'homepage_count_copy', 'missing': '100 أداة عربية عملية'})
          homepage_cards = homepage.count('data-daily-tools-v219')
          if homepage_cards != 1:
              errors.append({'check': 'homepage_tool_card_uniqueness', 'expected': 1, 'actual': homepage_cards})

          privacy_copy_pages = 0
          prohibited = re.compile(
              r'fetch\(|XMLHttpRequest|navigator\.sendBeacon|تشخيصك|يعالج نهائيًا|بديل عن الطبيب',
              re.IGNORECASE,
          )
          prohibited_matches = []
          for directory in (site / 'daily-tools', site / 'learning-paths'):
              for page in directory.rglob('*.html'):
                  text = page.read_text(encoding='utf-8')
                  if 'لا تُرسل البيانات إلى خادم' in text:
                      privacy_copy_pages += 1
                  match = prohibited.search(text)
                  if match:
                      prohibited_matches.append({
                          'page': str(page.relative_to(site)),
                          'match': match.group(0),
                      })
          if privacy_copy_pages < 100:
              errors.append({'check': 'privacy_copy_coverage', 'minimum': 100, 'actual': privacy_copy_pages})
          if prohibited_matches:
              errors.append({'check': 'prohibited_network_or_claim_copy', 'matches': prohibited_matches[:25]})

          sleep_page = (site / 'daily-tools/sleep-wind-down-plan/index.html').read_text(encoding='utf-8')
          for marker in ('data-sleep-log', 'sleep-log-v49.js', 'غير تشخيص', 'لا تُرسل البيانات إلى خادم'):
              if marker not in sleep_page:
                  errors.append({'check': 'sleep_log_marker', 'missing': marker})

          report = {
              'status': 'passed' if not errors else 'failed',
              'contract': 'daily-tools-pages-overlay-v100',
              'base_validated_run': os.environ['BASE_RUN_ID'],
              'base_source_commit': os.environ['BASE_SOURCE_COMMIT'],
              'overlay_commit': os.environ['GITHUB_SHA'],
              'tools': daily.get('tools'),
              'categories': daily.get('categories'),
              'paths': daily.get('paths'),
              'pages': daily.get('pages'),
              'tool_html_pages': len(tool_pages),
              'learning_path_html_pages': len(path_pages),
              'tool_cards': cards,
              'sitemap_urls': child_urls,
              'master_sitemap_references': master_refs,
              'privacy_copy_pages': privacy_copy_pages,
              'prohibited_matches': prohibited_matches,
              'errors': errors,
              'generated_at': datetime.now(timezone.utc).isoformat(),
          }
          (site / 'api/daily-tools-overlay-v100.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2),
              encoding='utf-8',
          )
          print(json.dumps(report, ensure_ascii=False, indent=2))
          if errors:
              raise SystemExit(f'Daily-tools overlay validation failed with {len(errors)} error(s)')
          PY
          touch _site/.nojekyll

      - name: Upload validated overlay site
        uses: actions/upload-artifact@v4
        with:
          name: daily-tools-pages-overlay-site-v100
          path: _site
          if-no-files-found: error
          retention-days: 2

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-tools-pages-overlay-v100-build-evidence
          path: |
            _site/api/daily-tools-v24.json
            _site/api/daily-tools-overlay-v100.json
            _site/sitemap-tools-paths.xml
            _site/sitemap.xml
            _site/index.html
            _site/daily-tools/index.html
          if-no-files-found: warn
          retention-days: 14

  deploy-overlay:
    if: github.event_name != 'pull_request'
    needs: build-overlay
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: github-pages-production
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download validated overlay from this run
        uses: actions/download-artifact@v4
        with:
          name: daily-tools-pages-overlay-site-v100
          path: _site

      - name: Verify deploy input
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('_site/api/daily-tools-overlay-v100.json').read_text(encoding='utf-8'))
          assert report['status'] == 'passed', report
          assert report['tools'] == 100, report
          assert report['categories'] == 10, report
          assert report['paths'] == 10, report
          assert report['pages'] == 112, report
          assert report['tool_cards'] == 100, report
          print(report)
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload overlay Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy validated overlay
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live 100-tool publication
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euxo pipefail
          for attempt in $(seq 1 30); do
            if curl -fsSL "${PAGE_URL}daily-tools/?sha=${GITHUB_SHA}-${attempt}" -o /tmp/daily-tools-live.html \
              && grep -q '100 أداة نفسية وتربوية يومية' /tmp/daily-tools-live.html \
              && test "$(grep -o '<article data-tool-card ' /tmp/daily-tools-live.html | wc -l)" -eq 100; then
              break
            fi
            sleep 5
          done
          grep -q '100 أداة نفسية وتربوية يومية' /tmp/daily-tools-live.html
          test "$(grep -o '<article data-tool-card ' /tmp/daily-tools-live.html | wc -l)" -eq 100
          grep -q 'data-tool-search' /tmp/daily-tools-live.html
          curl -fsSL "${PAGE_URL}daily-tools/sleep-wind-down-plan/?sha=${GITHUB_SHA}" -o /tmp/sleep-log-live.html
          grep -q 'data-sleep-log' /tmp/sleep-log-live.html
          grep -q 'لا تُرسل البيانات إلى خادم' /tmp/sleep-log-live.html

      - name: Upload live deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-tools-pages-overlay-v100-live-evidence
          path: |
            _site/api/daily-tools-overlay-v100.json
            /tmp/daily-tools-live.html
            /tmp/sleep-log-live.html
          if-no-files-found: warn
          retention-days: 14
