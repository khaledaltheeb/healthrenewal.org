name: Probe specialist password request CORS now

on:
  push:
    branches:
      - agent/inspect-cloudflare-specialists-now
    paths:
      - reports/probe-specialist-password-request-cors-trigger.txt

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/inspect-cloudflare-specialists-now
      - name: Probe live identity endpoint without sending email
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.error, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path
          base='https://pterminology-specialist-accounts.pterminology-826ac349.workers.dev'
          origin='https://khaledaltheeb.github.io'
          def call(path,method='GET',body=None,headers=None):
              merged={'Accept':'application/json','User-Agent':'pterminology-browser-cors-probe/1.0','Cache-Control':'no-cache'}
              if headers: merged.update(headers)
              data=None if body is None else body.encode('utf-8')
              req=urllib.request.Request(base+path,data=data,method=method,headers=merged)
              try:
                  with urllib.request.urlopen(req,timeout=25) as r:
                      raw=r.read().decode('utf-8','replace'); status=r.status; hs={k.lower():v for k,v in r.headers.items()}
              except urllib.error.HTTPError as e:
                  raw=e.read().decode('utf-8','replace'); status=e.code; hs={k.lower():v for k,v in (e.headers.items() if e.headers else [])}
              except Exception as e:
                  return {'http_status':None,'transport_error':type(e).__name__}
              try: payload=json.loads(raw) if raw else None
              except Exception: payload=None
              return {'http_status':status,'content_type':hs.get('content-type'),'allow_origin':hs.get('access-control-allow-origin'),'allow_methods':hs.get('access-control-allow-methods'),'allow_headers':hs.get('access-control-allow-headers'),'service':payload.get('service') if isinstance(payload,dict) else None,'version':payload.get('version') if isinstance(payload,dict) else None,'error':payload.get('error') if isinstance(payload,dict) else None,'message':payload.get('message') if isinstance(payload,dict) else None,'body_prefix':' '.join(raw[:300].split())}
          report={
            'schema_version':1,
            'checked_at':datetime.now(timezone.utc).isoformat(),
            'no_email_sent':True,
            'health':call('/health'),
            'preflight':call('/v1/auth/password/request','OPTIONS',headers={'Origin':origin,'Access-Control-Request-Method':'POST','Access-Control-Request-Headers':'content-type,x-requested-with'}),
            'post_without_credentials':call('/v1/auth/password/request','POST','{}',{'Origin':origin,'Content-Type':'application/json;charset=UTF-8','X-Requested-With':'pterminology-admin-v6'}),
          }
          report['summary']={
            'health_is_identity':report['health'].get('service')=='pterminology-specialist-identity',
            'cors_preflight_ok':report['preflight'].get('http_status')==204 and report['preflight'].get('allow_origin')==origin,
            'post_cors_visible':report['post_without_credentials'].get('allow_origin')==origin and report['post_without_credentials'].get('http_status') is not None,
            'browser_fetch_should_resolve':report['preflight'].get('http_status')==204 and report['preflight'].get('allow_origin')==origin and report['post_without_credentials'].get('allow_origin')==origin,
          }
          Path('reports/specialist-password-request-cors-now.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report['summary'],ensure_ascii=False))
          PY
      - name: Commit safe report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/specialist-password-request-cors-now.json
          git commit -m "chore: record specialist password request CORS probe [skip ci]"
          git push origin HEAD:agent/inspect-cloudflare-specialists-now
