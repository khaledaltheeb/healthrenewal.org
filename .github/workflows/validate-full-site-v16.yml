name: Validate full site audit v16

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      SITE_BASE: https://khaledaltheeb.github.io/pterminology-site/
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - name: Restore and compile all sources
        run: |
          set -euxo pipefail
          mkdir -p /tmp/v10-content
          cp content/sectors-v10/*.json /tmp/v10-content/
          cat .v10bundle/part00 .v10bundle/part01 .v10bundle/part02 .v10bundle/part03 .v10bundle/part04 | base64 --decode > /tmp/v10.tar.gz
          tar -xzf /tmp/v10.tar.gz
          cp /tmp/v10-content/*.json content/sectors-v10/
          cat .generator-v6/part00 .generator-v6/part01 .generator-v6/part02 .generator-v6/part03 > build_site.py
          python scripts/verify_enricher_v7.py
          python scripts/verify_expander_v9.py
          python -m py_compile build_site.py expand_site_v9.py scripts/scale_site_v8.py scripts/design_content_v10.py scripts/apply_contrast_v11.py scripts/expand_v12_direct.py scripts/rebuild_encyclopedia_v13.py scripts/run_encyclopedia_v13.py scripts/performance_hotfix_v14.py scripts/optimize_site_performance_v14.py scripts/strip_nonlab_runtime_v14.py scripts/finalize_pwa_v14.py scripts/audit_site_integrity_v13.py scripts/verify_performance_v14.py scripts/complete_core_sections_v15.py scripts/verify_core_sections_v15.py scripts/polish_site_v16.py scripts/audit_full_site_v16.py scripts/audit_full_site_i18n_v72.py scripts/apply_homepage_v20.py scripts/diagnose_apply_homepage_v221.py scripts/diagnose_special_needs_guides_v221.py scripts/publish_homepage_i18n_v72.py
          node --check content/v15/lab-v15.js
          node --check content/accessibility/hero-header-contrast-v283.js
          node --check scripts/test_lab_v15.js
          node --check scripts/browser_audit_v16.mjs
          node --check scripts/audit_adaptive_surfaces_v284.mjs
      - name: Build base site and content layers
        run: |
          set -euxo pipefail
          python build_site.py
          python enrich_site_v7.py
          cp google644f1f7a8b7aaa2b.html _site/google644f1f7a8b7aaa2b.html
          python scripts/scale_site_v8.py
          python expand_site_v9.py
      - name: Apply design encyclopedia performance and core sections
        run: |
          set -euxo pipefail
          python scripts/design_content_v10.py
          python scripts/apply_contrast_v11.py _site
          python scripts/expand_v12_direct.py _site
          python scripts/run_encyclopedia_v13.py _site
          python scripts/performance_hotfix_v14.py _site
          python scripts/optimize_site_performance_v14.py _site
          python scripts/strip_nonlab_runtime_v14.py _site
          python scripts/finalize_pwa_v14.py _site
          python scripts/complete_core_sections_v15.py _site
      - name: Publish institutional homepage and dependent sections
        run: |
          set -euxo pipefail
          python scripts/diagnose_apply_homepage_v221.py _site
      - name: Finalize adaptive contrast and audit generated HTML
        run: |
          set -euxo pipefail
          python scripts/polish_site_v16.py _site
          python scripts/apply_contrast_v11.py _site
          python scripts/audit_site_integrity_v13.py _site
      - name: Verify laboratories performance and core sections
        run: |
          set -euxo pipefail
          node scripts/test_lab_v15.js _site
          python scripts/verify_performance_v14.py _site
          python scripts/verify_core_sections_v15.py _site
      - name: Run comprehensive multilingual static audit
        run: |
          set -euxo pipefail
          python scripts/audit_full_site_i18n_v72.py _site
      - name: Preserve pre-browser audit evidence
        run: |
          set -euxo pipefail
          mkdir -p /tmp/full-site-audit-evidence
          find _site/api -maxdepth 1 -type f -name '*.json' -exec cp -f {} /tmp/full-site-audit-evidence/ \;
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          out = Path('/tmp/full-site-audit-evidence/browser-audit-progress.json')
          out.write_text(json.dumps({
              'stage': 'pre-browser',
              'generatedAt': datetime.now(timezone.utc).isoformat(),
              'status': 'static audits completed; browser audits not started',
          }, ensure_ascii=False, indent=2), encoding='utf-8')
          PY
      - name: Install browser audit runtime
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run real browser mobile and adaptive surface audit
        run: |
          set -euxo pipefail
          mkdir -p preview /tmp/full-site-audit-evidence
          ln -s "$PWD/_site" preview/pterminology-site
          VERIFY_FILE="$PWD/_site/google644f1f7a8b7aaa2b.html"
          VERIFY_HOLD="/tmp/google644f1f7a8b7aaa2b.html"
          mv "$VERIFY_FILE" "$VERIFY_HOLD"
          python -m http.server 8000 --directory preview >/tmp/pterminology-http.log 2>&1 &
          SERVER_PID=$!
          trap 'mv "$VERIFY_HOLD" "$VERIFY_FILE" 2>/dev/null || true; kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/pterminology-site/ >/dev/null && break; sleep 1; done

          AUDIT_BASE_URL=http://127.0.0.1:8000/pterminology-site/ AUDIT_OUT_DIR=_site/api node scripts/browser_audit_v16.mjs
          cp -f _site/api/browser-audit-v16.json /tmp/full-site-audit-evidence/

          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          out = Path('/tmp/full-site-audit-evidence/browser-audit-progress.json')
          out.write_text(json.dumps({
              'stage': 'adaptive-browser-audit',
              'generatedAt': datetime.now(timezone.utc).isoformat(),
              'status': 'representative browser audit completed; full adaptive audit running',
              'adaptiveConcurrency': 2,
              'nodeOptions': '--max-old-space-size=6144',
          }, ensure_ascii=False, indent=2), encoding='utf-8')
          PY

          AUDIT_BASE_URL=http://127.0.0.1:8000/pterminology-site/ AUDIT_OUT_DIR=_site/api HERO_AUDIT_CONCURRENCY=2 node scripts/audit_adaptive_surfaces_v284.mjs _site
          cp -f _site/api/hero-header-contrast-audit-v283.json /tmp/full-site-audit-evidence/
          cp -f _site/api/hero-header-contrast-audit-v284.json /tmp/full-site-audit-evidence/
          cp -f _site/api/hero-header-contrast-audit-v290.json /tmp/full-site-audit-evidence/
      - name: Upload complete audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-site-audit-v16
          path: |
            _site/api/homepage-publisher-progress-v221.json
            _site/api/special-needs-guides-progress-v221.json
            _site/api/polish-v16.json
            _site/api/full-site-audit-v16.json
            _site/api/browser-audit-v16.json
            _site/api/hero-header-contrast-audit-v283.json
            _site/api/hero-header-contrast-audit-v284.json
            _site/api/hero-header-contrast-audit-v290.json
            _site/api/site-integrity-v13.json
            _site/api/core-sections-audit-v15.json
            _site/api/performance-verification-v14.json
            /tmp/full-site-audit-evidence
            /tmp/pterminology-http.log
          if-no-files-found: warn
          retention-days: 14
