# one-shot trigger after PR creation
name: One-shot finalize section directory v217

on:
  push:
    branches: ["agent/institutional-section-directory-v217-clean"]
    paths:
      - ".github/workflows/one-shot-finalize-section-directory-v217.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/institutional-section-directory-v217-clean
          fetch-depth: 0
      - name: Align API resource and wire publisher before SEO
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path

          publisher = Path('scripts/publish_section_directory_v217.py')
          text = publisher.read_text(encoding='utf-8')
          old = '''        if isinstance(resources, list) and not any(
              (isinstance(item, dict) and (item.get("url") == route or item.get("href") == route))
              or item == route for item in resources
          ):
              resources.append({"name": "دليل الأقسام", "url": route})
          platform_path.write_text(json.dumps(platform, ensure_ascii=False, indent=2) + "\\n", encoding="utf-8")'''.replace('          ', '')
          new = '''        if isinstance(resources, list) and not any(
              (isinstance(item, dict) and (item.get("url") == route or item.get("href") == route))
              or item == route for item in resources
          ):
              resources.append({
                  "id": "sections",
                  "type": "collection",
                  "title": "دليل أقسام المنصة",
                  "url": route,
                  "tags": ["الأقسام", "التصفح", "واجهة API"],
              })
          endpoints = platform.setdefault("endpoints", {})
          if isinstance(endpoints, dict):
              endpoints["sections"] = route
          platform_path.write_text(json.dumps(platform, ensure_ascii=False, indent=2) + "\\n", encoding="utf-8")'''.replace('          ', '')
          if old in text:
              text = text.replace(old, new, 1)
          elif '"id": "sections"' not in text:
              raise SystemExit('Platform resource patch point not found')
          publisher.write_text(text, encoding='utf-8')

          orchestrator = Path('scripts/apply_homepage_v20.py')
          text = orchestrator.read_text(encoding='utf-8')
          report_marker = '        "sitewide_seo_publisher": 216,\n'
          if '"section_directory_publisher": 217' not in text:
              if report_marker not in text:
                  raise SystemExit('SEO report marker not found')
              text = text.replace(
                  report_marker,
                  report_marker + '        "section_directory_publisher": 217,\n',
                  1,
              )
          call_marker = '    publish_api_sitemap()\n    run_publisher("enhance_sitewide_seo_v216.py")\n'
          if 'run_publisher("publish_section_directory_v217.py")' not in text:
              if call_marker not in text:
                  raise SystemExit('SEO publisher call marker not found')
              text = text.replace(
                  call_marker,
                  '    publish_api_sitemap()\n'
                  '    run_publisher("publish_section_directory_v217.py")\n'
                  '    run_publisher("enhance_sitewide_seo_v216.py")\n',
                  1,
              )
          orchestrator.write_text(text, encoding='utf-8')
          PY
          python -m py_compile scripts/publish_section_directory_v217.py scripts/apply_homepage_v20.py tests/test_section_directory_v217.py
          python -m unittest -v tests/test_section_directory_v217.py
          rm .github/workflows/one-shot-finalize-section-directory-v217.yml
      - name: Commit durable files and remove temporary workflow
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/publish_section_directory_v217.py scripts/apply_homepage_v20.py tests/test_section_directory_v217.py .github/workflows/one-shot-finalize-section-directory-v217.yml
          git commit -m "ربط دليل الأقسام قبل SEO وتوحيد سجل API"
          git push origin HEAD:agent/institutional-section-directory-v217-clean
