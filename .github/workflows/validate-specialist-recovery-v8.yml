name: Validate specialist recovery v8

on:
  pull_request:
    branches: ["main"]
    paths:
      - "specialists-partners/admin/**"
      - "specialists-partners/account-backend/src/index-v8.js"
      - "tests/test_specialist_recovery_v8.py"
      - ".github/workflows/validate-specialist-recovery-v8.yml"
      - ".github/workflows/deploy-specialist-recovery-overlay-v8.yml"
      - ".github/workflows/deploy-specialist-recovery-pages-v8.yml"
      - ".github/workflows/verify-specialist-recovery-v8.yml"
  push:
    branches: ["main"]
    paths:
      - "specialists-partners/admin/**"
      - "specialists-partners/account-backend/src/index-v8.js"
      - "tests/test_specialist_recovery_v8.py"
      - ".github/workflows/validate-specialist-recovery-v8.yml"
      - ".github/workflows/deploy-specialist-recovery-overlay-v8.yml"
      - ".github/workflows/deploy-specialist-recovery-pages-v8.yml"
      - ".github/workflows/verify-specialist-recovery-v8.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate JavaScript, recovery contracts, and workflow syntax
        run: |
          set -euo pipefail
          node --check specialists-partners/account-backend/src/index-v8.js
          node --check specialists-partners/admin/admin.js
          node --check specialists-partners/recover/recover.js
          python -m unittest -v tests.test_specialist_recovery_v8
          python - <<'PY'
          from pathlib import Path
          import yaml
          for path in [
              '.github/workflows/validate-specialist-recovery-v8.yml',
              '.github/workflows/deploy-specialist-recovery-overlay-v8.yml',
              '.github/workflows/deploy-specialist-recovery-pages-v8.yml',
              '.github/workflows/verify-specialist-recovery-v8.yml',
          ]:
              yaml.safe_load(Path(path).read_text(encoding='utf-8'))
          print('specialist recovery v8 workflows parsed')
          PY
