name: Apply homepage compatibility v323

on:
  push:
    branches: [agent/publication-surface-home-v322]
    paths:
      - ".github/workflows/apply-homepage-compat-v323.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/publication-surface-home-v322
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preserve v19 contracts inside the v322 homepage
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          path=Path('index.html')
          source=path.read_text(encoding='utf-8')
          if 'data-homepage-compat="v323"' in source:
              raise SystemExit(0)

          old='<meta name="keywords" content="الصحة النفسية,علم النفس,مصطلحات علم النفس,ذوو الاحتياجات الخاصة,اضطراب طيف التوحد,متلازمة داون,التربية الدامجة,الموسوعة النفسية,المكتبة النفسية,الأبحاث النفسية,المقاييس النفسية,أدلة الأسرة,الصحة النفسية للطفل,التقييم النفسي,الدعم النفسي">'
          new='<meta name="keywords" content="الصحة النفسية,علم النفس,مصطلحات علم النفس,الموسوعة النفسية,المكتبة النفسية,المكتبة الأكاديمية,مقارنات نفسية,الفرق بين الاضطرابات النفسية,الأشخاص ذوو الاحتياجات الخاصة,ذوو الاحتياجات الخاصة,التربية الدامجة,التربية الخاصة,الصحة النفسية للطفل,الصحة النفسية للأسرة,التقييم النفسي,التقييم النفسي للأطفال,المقاييس النفسية,الاختبارات النفسية,القدرات المعرفية,العلاج النفسي,العلاج السلوكي المعرفي,الدعم النفسي,الدعم الأسري,التدخل المبكر,التأهيل النفسي,التوحد,اضطراب طيف التوحد,فرط الحركة وتشتت الانتباه,متلازمة داون,صعوبات التعلم,التواصل المعزز والبديل,جودة خدمات التربية الخاصة,أدوات نفسية تفاعلية,أدوات تنظيم التوتر,أدوات متابعة النوم,مسارات تعلم الصحة النفسية"><meta name="subject" content="الصحة النفسية وعلم النفس والتربية الدامجة وذوو الاحتياجات الخاصة"><meta name="audience" content="الأفراد والأسر والمعلمون والمرشدون والمختصون ومقدمو الخدمات">'
          if old not in source:
              raise SystemExit('keywords anchor missing')
          source=source.replace(old,new,1)
          source=source.replace('<body class="pt-platform"', '<body data-homepage-compat="v323" class="pt-platform"',1)
          source=source.replace('"url":"https://khaledaltheeb.github.io/pterminology-site/",\n      "logo"', '"url":"https://khaledaltheeb.github.io/pterminology-site/",\n      "slogan":"معرفة تحترم الإنسان. دعم يوسّع الإمكانات.",\n      "logo"',1)

          old_collection='"about":[{"@type":"Thing","name":"الصحة النفسية"},{"@type":"Thing","name":"علم النفس"},{"@type":"Thing","name":"الأشخاص ذوو الاحتياجات الخاصة"},{"@type":"Thing","name":"التربية الدامجة"}],\n      "mainEntity"'
          new_collection='"about":[{"@type":"Thing","name":"الصحة النفسية"},{"@type":"Thing","name":"علم النفس"},{"@type":"Thing","name":"الأشخاص ذوو الاحتياجات الخاصة"},{"@type":"Thing","name":"التربية الدامجة"}],\n      "hasPart":[{"@type":"CollectionPage","name":"مكتبة المقارنات النفسية","url":"https://khaledaltheeb.github.io/pterminology-site/comparisons/"},{"@type":"CollectionPage","name":"المكتبة الأكاديمية العربية","url":"https://khaledaltheeb.github.io/pterminology-site/library/"},{"@type":"CollectionPage","name":"الأسئلة الموجهة","url":"https://khaledaltheeb.github.io/pterminology-site/guided-assessment/"},{"@type":"CollectionPage","name":"الأدوات النفسية التفاعلية","url":"https://khaledaltheeb.github.io/pterminology-site/daily-tools/"},{"@type":"CollectionPage","name":"مسارات التعلم القصيرة","url":"https://khaledaltheeb.github.io/pterminology-site/learning-paths/"},{"@type":"WebAPI","name":"واجهة بيانات المنصة","url":"https://khaledaltheeb.github.io/pterminology-site/api/"}],\n      "mainEntity"'
          if old_collection not in source:
              raise SystemExit('collection JSON-LD anchor missing')
          source=source.replace(old_collection,new_collection,1)

          source=source.replace('.button{display:inline-flex', '.button,.btn{display:inline-flex',1)
          source=source.replace('.button.secondary{', '.button.secondary,.btn.secondary{',1)
          source=source.replace('.card h4{', '.card h3{',1)
          source=source.replace('<a href="daily-tools/">الأدوات</a><a href="specialists-partners/">', '<a href="daily-tools/">الأدوات</a><a href="learning-paths/">مسارات التعلم</a><a href="specialists-partners/">',1)
          source=source.replace('<a class="button secondary" href="sections/">استعرض جميع الأقسام</a>', '<a class="button secondary" href="sections/">استعرض جميع الأقسام</a><a class="btn secondary" href="care-guides/">أدلة التعامل مع الحالات</a>',1)
          source=source.replace('<li><strong>للاستكشاف المنظم:</strong>', '<li data-daily-tools-journey-v219><strong>للاستكشاف المنظم:</strong>',1)

          old_metrics='<article class="metric"><strong data-surface-page-count>3,200+</strong><span>صفحة قابلة للفهرسة ضمن حزمة الإنتاج</span></article>\n      <article class="metric"><strong data-surface-section-count>39</strong><span>قسمًا عامًا في دليل الوصول المؤسسي</span></article>\n      <article class="metric"><strong>100</strong><span>مركز موضوعي رئيسي يربط المعرفة بالأدلة</span></article>\n      <article class="metric"><strong>محلي وآمن</strong><span>أدوات يومية تعمل في المتصفح بحدود مهنية</span></article>'
          new_metrics='<article class="metric"><strong data-surface-page-count>3,200+</strong><span>صفحة قابلة للفهرسة، بينها 2,000+ صفحة موسوعية مستقلة</span></article>\n      <article class="metric"><strong data-surface-section-count>39</strong><span>قسمًا عامًا منظمًا ضمن 16 مسارًا رئيسيًا</span></article>\n      <article class="metric"><strong>200</strong><span>مركز وموضوع ومسار يربط المعرفة بالأدلة</span></article>\n      <article class="metric"><strong>93</strong><span>مقياسًا ومهمة وأداة معرفية ضمن المختبرات</span></article>'
          if old_metrics not in source:
              raise SystemExit('metrics anchor missing')
          source=source.replace(old_metrics,new_metrics,1)

          source=source.replace('<article class="card"><span class="tag">مركز متخصص</span><h4>ذوو الاحتياجات الخاصة والتربية الدامجة</h4>', '<article class="card" data-special-needs-v73><span class="tag">مركز متخصص</span><h3>ذوو الاحتياجات الخاصة والتربية الدامجة</h3>',1)
          source=source.replace('<article class="card"><span class="tag">تعلم متعمق</span><h4>المكتبة الأكاديمية</h4>', '<article class="card"><span class="tag">تعلم متعمق</span><h3>المكتبة الأكاديمية العربية</h3>',1)
          source=source.replace('<article class="card"><span class="tag">خصوصية محلية</span><h4>الأدوات النفسية التفاعلية</h4>', '<article class="card" data-daily-tools-v219><span class="tag">خصوصية محلية</span><h3>الأدوات النفسية التفاعلية</h3>',1)
          source=source.replace('<article class="card"><span class="tag">تعلم منظم</span><h4>مسارات التعلم القصيرة</h4>', '<article class="card" data-learning-paths-v219><span class="tag">تعلم منظم</span><h3>مسارات التعلم القصيرة</h3>',1)
          source=source.replace('<h4>','<h3>').replace('</h4>','</h3>')
          source=source.replace('<a href="magazine/">المجلة والأبحاث</a><a href="specialists-partners/">', '<a href="magazine/">المجلة والأبحاث</a><a href="daily-tools/">الأدوات التفاعلية</a><a href="learning-paths/">مسارات التعلم</a><a href="specialists-partners/">',1)

          payload=json.loads(re.search(r'<script type="application/ld\+json">(.*?)</script>',source,re.S).group(1))
          graph=payload['@graph']
          organization=next(node for node in graph if node.get('@type')=='Organization')
          collection=next(node for node in graph if node.get('@type')=='CollectionPage')
          assert organization.get('slogan')=='معرفة تحترم الإنسان. دعم يوسّع الإمكانات.'
          assert any(part.get('@type')=='WebAPI' for part in collection.get('hasPart',[]))
          assert source.count('data-special-needs-v73')==1
          assert source.count('data-daily-tools-v219')==1
          assert source.count('data-learning-paths-v219')==1
          assert source.count('data-daily-tools-journey-v219')==1
          assert source.count('href="daily-tools/"')>=3
          assert source.count('href="learning-paths/"')>=3
          assert len(re.findall(r'<h3\b',source))>=24
          path.write_text(source,encoding='utf-8')
          PY
      - name: Validate old and new homepage contracts
        run: |
          python scripts/verify_homepage_v19.py
          python - <<'PY'
          from pathlib import Path
          source=Path('index.html').read_text(encoding='utf-8')
          assert 'data-publication-surface="v322"' in source
          assert 'data-homepage-compat="v323"' in source
          assert 'specialists-partners/' in source
          assert 'sections/' in source
          PY
      - name: Commit compatibility layer
        run: |
          if git diff --quiet -- index.html; then
            echo "Homepage already compatible"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: preserve homepage discovery contracts v323"
          git push origin HEAD:agent/publication-surface-home-v322
