name: Bootstrap specialists Cloudflare

on:
  workflow_dispatch:
    inputs:
      account_id:
        description: "Cloudflare account ID"
        required: true
        default: "826ac34927c1e045c06145a327c2ac52"
        type: string
      worker_name:
        description: "Worker script name"
        required: true
        default: "pterminology-specialists"
        type: string
      database_name:
        description: "D1 database name"
        required: true
        default: "pterminology-specialists"
        type: string
      widget_name:
        description: "Turnstile widget name"
        required: true
        default: "pterminology-specialists-forms"
        type: string
      hostname:
        description: "Allowed website hostname"
        required: true
        default: "khaledaltheeb.github.io"
        type: string

permissions:
  contents: write

concurrency:
  group: bootstrap-specialists-cloudflare
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ACCOUNT_ID: ${{ inputs.account_id }}
      WORKER_NAME: ${{ inputs.worker_name }}
      DATABASE_NAME: ${{ inputs.database_name }}
      WIDGET_NAME: ${{ inputs.widget_name }}
      ALLOWED_HOSTNAME: ${{ inputs.hostname }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      ADMIN_API_KEY: ${{ secrets.SPECIALISTS_ADMIN_API_KEY }}
      REVIEWER_API_KEY: ${{ secrets.SPECIALISTS_REVIEWER_API_KEY }}
      MODERATOR_API_KEY: ${{ secrets.SPECIALISTS_MODERATOR_API_KEY }}
      RATE_LIMIT_SALT: ${{ secrets.SPECIALISTS_RATE_LIMIT_SALT }}
      FROM_EMAIL: ${{ secrets.SPECIALISTS_FROM_EMAIL }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          required=(
            CLOUDFLARE_API_TOKEN
            RESEND_API_KEY
            ADMIN_API_KEY
            RATE_LIMIT_SALT
            FROM_EMAIL
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is required"
              exit 1
            fi
          done
          python - <<'PY'
          import os, re
          account_id = os.environ["ACCOUNT_ID"]
          if not re.fullmatch(r"[0-9a-f]{32}", account_id):
              raise SystemExit("ACCOUNT_ID must be a 32-character hexadecimal Cloudflare account ID")
          if len(os.environ["ADMIN_API_KEY"]) < 32:
              raise SystemExit("SPECIALISTS_ADMIN_API_KEY must contain at least 32 characters")
          if len(os.environ["RATE_LIMIT_SALT"]) < 32:
              raise SystemExit("SPECIALISTS_RATE_LIMIT_SALT must contain at least 32 characters")
          PY

      - name: Verify Cloudflare token
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/tokens/verify" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -o /tmp/token.json
          python - <<'PY'
          import json
          data = json.load(open("/tmp/token.json", encoding="utf-8"))
          if data.get("success") is not True or data.get("result", {}).get("status") != "active":
              raise SystemExit(f"Cloudflare token is not active: {data}")
          print("Cloudflare token verified.")
          PY

      - name: Discover or create D1 database
        id: d1
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request

          account_id = os.environ["ACCOUNT_ID"]
          token = os.environ["CLOUDFLARE_API_TOKEN"]
          name = os.environ["DATABASE_NAME"]
          base = f"https://api.cloudflare.com/client/v4/accounts/{account_id}/d1/database"
          headers = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}

          def call(url, method="GET", payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              request = urllib.request.Request(url, method=method, headers=headers, data=data)
              with urllib.request.urlopen(request, timeout=60) as response:
                  result = json.load(response)
              if result.get("success") is not True:
                  raise SystemExit(result)
              return result

          listed = call(base + "?per_page=100")
          matches = [item for item in listed.get("result", []) if item.get("name") == name]
          if matches:
              database_id = matches[0].get("uuid")
              created = False
          else:
              created_payload = call(base, "POST", {"name": name})
              database_id = created_payload.get("result", {}).get("uuid")
              created = True

          if not database_id:
              raise SystemExit("Cloudflare did not return a D1 database UUID")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"database_id={database_id}\n")
              output.write(f"created={str(created).lower()}\n")
          print(f"D1 database ready: {name} ({database_id})")
          PY

      - name: Discover or create Turnstile widget
        id: turnstile
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.parse, urllib.request

          account_id = os.environ["ACCOUNT_ID"]
          token = os.environ["CLOUDFLARE_API_TOKEN"]
          name = os.environ["WIDGET_NAME"]
          hostname = os.environ["ALLOWED_HOSTNAME"]
          base = f"https://api.cloudflare.com/client/v4/accounts/{account_id}/challenges/widgets"
          headers = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}

          def call(url, method="GET", payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              request = urllib.request.Request(url, method=method, headers=headers, data=data)
              with urllib.request.urlopen(request, timeout=60) as response:
                  result = json.load(response)
              if result.get("success") is not True:
                  raise SystemExit(result)
              return result

          query = urllib.parse.urlencode({"filter": f"name:{name}", "per_page": 100})
          listed = call(base + "?" + query)
          matches = [item for item in listed.get("result", []) if item.get("name") == name]

          if matches:
              sitekey = matches[0].get("sitekey")
              rotated = call(
                  f"{base}/{urllib.parse.quote(sitekey, safe='')}/rotate_secret",
                  "POST",
                  {"invalidate_immediately": False},
              )
              widget = rotated.get("result", {})
              secret = widget.get("secret")
              sitekey = widget.get("sitekey") or sitekey
              created = False
          else:
              created_payload = call(
                  base,
                  "POST",
                  {
                      "domains": [hostname],
                      "mode": "managed",
                      "name": name,
                      "clearance_level": "no_clearance",
                      "region": "world",
                  },
              )
              widget = created_payload.get("result", {})
              sitekey = widget.get("sitekey")
              secret = widget.get("secret")
              created = True

          if not sitekey or not secret:
              raise SystemExit("Cloudflare did not return a Turnstile sitekey and secret")

          print(f"::add-mask::{secret}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"sitekey={sitekey}\n")
              output.write(f"secret={secret}\n")
              output.write(f"created={str(created).lower()}\n")
          print(f"Turnstile widget ready: {name} ({sitekey})")
          PY

      - name: Ensure Workers subdomain
        id: subdomain
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.error, urllib.request

          account_id = os.environ["ACCOUNT_ID"]
          token = os.environ["CLOUDFLARE_API_TOKEN"]
          worker_name = os.environ["WORKER_NAME"]
          url = f"https://api.cloudflare.com/client/v4/accounts/{account_id}/workers/subdomain"
          headers = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}

          def call(method="GET", payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              request = urllib.request.Request(url, method=method, headers=headers, data=data)
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      result = json.load(response)
              except urllib.error.HTTPError as error:
                  body = error.read().decode("utf-8", errors="replace")
                  return {"success": False, "http_status": error.code, "body": body}
              return result

          current = call()
          subdomain = current.get("result", {}).get("subdomain") if current.get("success") else None
          if not subdomain:
              proposed = f"pterminology-{account_id[:8]}"
              created = call("PUT", {"subdomain": proposed})
              if created.get("success") is not True:
                  raise SystemExit(f"Unable to create Workers subdomain: {created}")
              subdomain = created.get("result", {}).get("subdomain")

          if not subdomain:
              raise SystemExit("Cloudflare did not return a Workers subdomain")

          api_base = f"https://{worker_name}.{subdomain}.workers.dev"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"workers_subdomain={subdomain}\n")
              output.write(f"api_base={api_base}\n")
          print(f"Worker public URL will be: {api_base}")
          PY

      - name: Generate production Wrangler configuration
        working-directory: specialists-partners/backend
        shell: bash
        env:
          DATABASE_ID: ${{ steps.d1.outputs.database_id }}
          TURNSTILE_SECRET: ${{ steps.turnstile.outputs.secret }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          def toml(value: str) -> str:
              return '"' + value.replace("\\", "\\\\").replace('"', '\\"') + '"'

          lines = [
              f"name = {toml(os.environ['WORKER_NAME'])}",
              'main = "src/index-v2.js"',
              'compatibility_date = "2026-07-01"',
              'workers_dev = true',
              '',
              '[vars]',
              'ALLOWED_ORIGINS = "https://healthrenewal.org"',
              'OWNER_EMAIL = "pterminology@gmail.com"',
              'PORTAL_BASE_URL = "https://healthrenewal.org/specialists-partners/portal/"',
              f"TURNSTILE_EXPECTED_HOSTNAMES = {toml(os.environ['ALLOWED_HOSTNAME'])}",
              f"FROM_EMAIL = {toml(os.environ['FROM_EMAIL'])}",
              'ADMIN_SESSION_MINUTES = "20"',
              '',
              '[[d1_databases]]',
              'binding = "DB"',
              f"database_name = {toml(os.environ['DATABASE_NAME'])}",
              f"database_id = {toml(os.environ['DATABASE_ID'])}",
              'migrations_dir = "migrations"',
              '',
              '[triggers]',
              'crons = ["17 2 * * *"]',
              '',
          ]
          Path("wrangler.toml").write_text("\n".join(lines), encoding="utf-8")

          secrets = {
              "RESEND_API_KEY": os.environ["RESEND_API_KEY"],
              "TURNSTILE_SECRET": os.environ["TURNSTILE_SECRET"],
              "ADMIN_API_KEY": os.environ["ADMIN_API_KEY"],
              "RATE_LIMIT_SALT": os.environ["RATE_LIMIT_SALT"],
          }
          for optional_name in ("REVIEWER_API_KEY", "MODERATOR_API_KEY"):
              if os.environ.get(optional_name):
                  secrets[optional_name] = os.environ[optional_name]
          Path("worker-secrets.json").write_text(json.dumps(secrets), encoding="utf-8")
          PY
          chmod 600 wrangler.toml worker-secrets.json

      - name: Apply D1 migrations
        working-directory: specialists-partners/backend
        run: npx --yes wrangler@4 d1 migrations apply "${DATABASE_NAME}" --remote --config wrangler.toml

      - name: Deploy Worker
        working-directory: specialists-partners/backend
        run: npx --yes wrangler@4 deploy --config wrangler.toml --secrets-file worker-secrets.json --minify --keep-vars

      - name: Enable Worker on workers.dev
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/subdomain" \
            -X POST \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"enabled":true,"previews_enabled":false}' \
            -o /tmp/worker-subdomain.json
          python - <<'PY'
          import json
          data = json.load(open("/tmp/worker-subdomain.json", encoding="utf-8"))
          if data.get("success") is not True or data.get("result", {}).get("enabled") is not True:
              raise SystemExit(data)
          print("workers.dev route enabled.")
          PY

      - name: Remove temporary secret files
        if: always()
        working-directory: specialists-partners/backend
        run: rm -f worker-secrets.json wrangler.toml

      - name: Verify Worker health
        shell: bash
        env:
          API_BASE: ${{ steps.subdomain.outputs.api_base }}
        run: |
          set -euo pipefail
          for attempt in {1..18}; do
            code="$(curl -sS -o /tmp/health.json -w '%{http_code}' "${API_BASE%/}/health" || true)"
            if [[ "$code" == "200" ]]; then
              python -c 'import json; data=json.load(open("/tmp/health.json", encoding="utf-8")); assert data.get("ok") is True, data; print(json.dumps(data, ensure_ascii=False, indent=2))'
              exit 0
            fi
            sleep 5
          done
          cat /tmp/health.json || true
          exit 1

      - name: Update public runtime configuration
        shell: bash
        env:
          API_BASE: ${{ steps.subdomain.outputs.api_base }}
          TURNSTILE_SITE_KEY: ${{ steps.turnstile.outputs.sitekey }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          api = os.environ["API_BASE"].rstrip("/")
          key = os.environ["TURNSTILE_SITE_KEY"]
          content = (
              "window.PT_SPECIALIST_CONFIG = Object.freeze({\n"
              f"  apiBase: {json.dumps(api)},\n"
              f"  turnstileSiteKey: {json.dumps(key)},\n"
              '  siteBase: "https://healthrenewal.org/",\n'
              '  sectorBase: "https://healthrenewal.org/specialists-partners",\n'
              '  environment: "production"\n'
              "});\n"
          )
          Path("specialists-partners/assets/runtime-config.js").write_text(content, encoding="utf-8")
          PY

          if git diff --quiet -- specialists-partners/assets/runtime-config.js; then
            echo "Runtime configuration already current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add specialists-partners/assets/runtime-config.js
            git commit -m "ops: bootstrap Cloudflare specialists backend"
            git push origin HEAD:main
          fi

      - name: Publish bootstrap summary
        shell: bash
        env:
          API_BASE: ${{ steps.subdomain.outputs.api_base }}
          DATABASE_ID: ${{ steps.d1.outputs.database_id }}
          TURNSTILE_SITE_KEY: ${{ steps.turnstile.outputs.sitekey }}
        run: |
          {
            echo "## Cloudflare bootstrap completed"
            echo
            echo "- Worker: \`${WORKER_NAME}\`"
            echo "- API base: \`${API_BASE}\`"
            echo "- D1 database: \`${DATABASE_NAME}\`"
            echo "- D1 ID: \`${DATABASE_ID}\`"
            echo "- Turnstile sitekey: \`${TURNSTILE_SITE_KEY}\`"
            echo "- Allowed hostname: \`${ALLOWED_HOSTNAME}\`"
            echo "- Runtime configuration updated on \`main\`."
          } >> "$GITHUB_STEP_SUMMARY"
