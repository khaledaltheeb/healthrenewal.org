name: Recover richest historical content and deploy complete site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-production
  cancel-in-progress: false

jobs:
  build:
    name: Recover and validate complete historical site
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      build_sha: ${{ steps.source.outputs.build_sha }}

    steps:
      - name: Checkout exact current main with full history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Bind build to current main head
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git checkout --detach origin/main
          build_sha="$(git rev-parse HEAD)"
          api_sha="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" \
            | python -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')"
          test "${build_sha}" = "${api_sha}"
          echo "build_sha=${build_sha}" >> "${GITHUB_OUTPUT}"
          echo "Building current main at ${build_sha}."

      - name: Fetch every branch for historical recovery
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*' --prune
          echo "Branches available: $(git for-each-ref --format='%(refname)' refs/remotes/origin | wc -l)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Locate latest validated production baseline
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=validated-production-site&per_page=100" \
            -o /tmp/baselines.json
          python - <<'PY'
          import json, os
          payload = json.load(open('/tmp/baselines.json', encoding='utf-8'))
          candidates = [
              item for item in payload.get('artifacts', [])
              if not item.get('expired')
              and item.get('workflow_run', {}).get('head_branch') == 'main'
              and item.get('workflow_run', {}).get('id')
          ]
          if not candidates:
              raise SystemExit('No active validated-production-site artifact from main')
          item = max(candidates, key=lambda x: x.get('created_at', ''))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"run_id={item['workflow_run']['id']}\n")
              output.write(f"artifact_id={item['id']}\n")
              output.write(f"created_at={item.get('created_at', '')}\n")
          print({'artifactId': item['id'], 'runId': item['workflow_run']['id'], 'createdAt': item.get('created_at')})
          PY

      - name: Download validated production baseline
        uses: actions/download-artifact@v4
        with:
          name: validated-production-site
          path: /tmp/validated-baseline
          repository: khaledaltheeb/healthrenewal.org
          run-id: ${{ steps.baseline.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Recover richest historical versions and consolidate content
        run: |
          set -euo pipefail
          test -f /tmp/validated-baseline/index.html
          test ! -e _baseline
          test ! -e _legacy_baseline
          python -m py_compile \
            scripts/recover_content_v1.py \
            scripts/recover_content_v2.py \
            scripts/recover_content_full_history_v3.py \
            scripts/review_content_aliases_v1.py \
            scripts/consolidate_duplicate_pages_v1.py \
            scripts/finalize_content_quality_v2.py \
            scripts/finalize_canonical_sitemaps_v1.py
          python scripts/recover_content_full_history_v3.py \
            --root . \
            --site _site \
            --baseline /tmp/validated-baseline \
            --days 3650
          python scripts/review_content_aliases_v1.py \
            --site _site \
            --baseline /tmp/validated-baseline \
            --days 3650
          python scripts/finalize_content_quality_v2.py --site _site
          python scripts/finalize_canonical_sitemaps_v1.py --site _site

      - name: Enforce no-loss complete inventory
        env:
          BUILD_SHA: ${{ steps.source.outputs.build_sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          site = Path('_site')
          baseline = Path('/tmp/validated-baseline')
          report = json.loads((site / 'api/content-recovery-report.json').read_text(encoding='utf-8'))
          inventory = json.loads((site / 'api/content-page-inventory.json').read_text(encoding='utf-8'))
          duplicates = json.loads((site / 'api/duplicate-consolidation-v1.json').read_text(encoding='utf-8'))
          self_advocacy = json.loads((site / 'api/self-advocacy-v172.json').read_text(encoding='utf-8'))
          cdls = json.loads((site / 'api/special-needs-cdls-v337.json').read_text(encoding='utf-8'))
          sitemaps = json.loads((site / 'api/sitemap-finalization-v1.json').read_text(encoding='utf-8'))

          baseline_html = sum(
              1 for p in baseline.rglob('*')
              if p.is_file() and p.suffix.lower() in {'.html', '.htm'}
          )
          assert baseline_html >= 3000, baseline_html
          assert report['schemaVersion'] == 3, report.get('schemaVersion')
          assert inventory['schemaVersion'] == 3, inventory.get('schemaVersion')
          assert report['htmlPages'] == len(inventory['pages'])
          assert report['htmlPages'] >= baseline_html, (report['htmlPages'], baseline_html)
          assert not any(page['path'].startswith(('_baseline/', '_legacy_baseline/')) for page in inventory['pages'])
          assert report.get('historySince', '9999') <= '2026-07-14', report.get('historySince')
          assert report.get('aliasReviewStatus') == 'passed', report.get('aliasReviewStatus')
          assert not report.get('unrestoredRejectedAliases'), report.get('unrestoredRejectedAliases')
          assert report.get('remainingThinPages') == 0, report.get('thinPages', [])[:20]
          assert report.get('completenessRatio') == 1.0, report.get('completenessRatio')
          assert report.get('integrityStatus') == 'passed', report.get('integrityStatus')
          assert report.get('integrityMissingInternalPaths') == 0, report.get('integrityMissingInternalPaths')
          assert duplicates.get('status') == 'passed', duplicates
          assert self_advocacy.get('status') == 'passed', self_advocacy
          assert self_advocacy.get('publicContentPackageCount', 0) >= 9, self_advocacy
          assert self_advocacy.get('standalonePagesCreated') == 0, self_advocacy
          assert cdls.get('status') == 'passed', cdls
          assert cdls.get('single_canonical_route') is True, cdls
          assert sitemaps.get('status') == 'passed', sitemaps
          assert sitemaps.get('canonicalRootSitemapUrls') == sitemaps.get('indexableHtmlPages'), sitemaps
          assert not sitemaps.get('staleLegacySitemaps'), sitemaps.get('staleLegacySitemaps')
          assert sitemaps.get('canonicalRootSitemapUrls', 0) >= 4000, sitemaps
          assert (site / 'index.html').is_file()

          deployment = {
              'schemaVersion': 2,
              'release_commit': os.environ['BUILD_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'html_pages': report['htmlPages'],
              'baseline_html_pages': baseline_html,
              'indexable_sitemap_urls': sitemaps['canonicalRootSitemapUrls'],
              'legacy_github_sitemap_urls_removed': sitemaps['legacyGithubUrlsRemoved'],
              'historical_pages_restored': report.get('historicalPagesRestored', 0),
              'completeness_ratio': report['completenessRatio'],
              'duplicate_routes_consolidated': duplicates.get('duplicateRoutesConsolidated', 0),
              'missing_internal_paths': report['integrityMissingInternalPaths'],
          }
          (site / 'deployment.json').write_text(
              json.dumps(deployment, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print({'baselineHtmlPages': baseline_html})
          print({key: report.get(key) for key in (
              'status', 'htmlPages', 'historicalPagesRestored', 'historySince',
              'allGeneratedAliasesReviewed', 'thinAliasesRedirected',
              'falseAliasesRejected', 'remainingThinPages', 'completenessRatio',
              'integrityStatus', 'integrityMissingInternalPaths'
          )})
          print({'sitemaps': sitemaps})
          print({'duplicateRoutesConsolidated': duplicates.get('duplicateRoutesConsolidated', 0)})
          print({'deployment': deployment})
          PY
          touch _site/.nojekyll

      - name: Upload recovery diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-recovery-diagnostics-${{ github.run_id }}
          path: |
            _site/api/content-recovery-report.json
            _site/api/content-page-inventory.json
            _site/api/duplicate-consolidation-v1.json
            _site/api/self-advocacy-v172.json
            _site/api/special-needs-cdls-v337.json
            _site/api/sitemap-finalization-v1.json
            _site/deployment.json
          if-no-files-found: warn
          retention-days: 30

      - name: Preserve validated complete site for 90 days
        uses: actions/upload-artifact@v4
        with:
          name: validated-production-site
          path: _site
          include-hidden-files: true
          retention-days: 90
          compression-level: 6

      - uses: actions/configure-pages@v5

      - name: Upload complete Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy validated recovered site
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Refuse stale deployment if main advanced
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_SHA: ${{ needs.build.outputs.build_sha }}
        run: |
          set -euo pipefail
          current_sha="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" \
            | python -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')"
          test "${current_sha}" = "${BUILD_SHA}"
          echo "Deploying validated current main at ${BUILD_SHA}."

      - name: Deploy complete recovered site
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify exact recovered deployment live
        env:
          EXPECTED_SHA: ${{ needs.build.outputs.build_sha }}
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 120); do
            nonce="${GITHUB_RUN_ID}-${attempt}-$(date +%s%N)"
            if curl -fsSL --retry 2 -H 'Cache-Control: no-cache' \
              "https://healthrenewal.org/deployment.json?release=${nonce}" \
              -o /tmp/live-deployment.json \
              && curl -fsSL --retry 2 -H 'Cache-Control: no-cache' \
              "https://healthrenewal.org/api/content-recovery-report.json?recovery=${nonce}" \
              -o /tmp/live-recovery.json \
              && curl -fsSL --retry 2 -H 'Cache-Control: no-cache' \
              "https://healthrenewal.org/api/duplicate-consolidation-v1.json?duplicates=${nonce}" \
              -o /tmp/live-duplicates.json \
              && curl -fsSL --retry 2 -H 'Cache-Control: no-cache' \
              "https://healthrenewal.org/api/sitemap-finalization-v1.json?sitemap=${nonce}" \
              -o /tmp/live-sitemaps.json; then
              if python - <<'PY'
          import json, os
          deployment = json.load(open('/tmp/live-deployment.json', encoding='utf-8'))
          report = json.load(open('/tmp/live-recovery.json', encoding='utf-8'))
          duplicates = json.load(open('/tmp/live-duplicates.json', encoding='utf-8'))
          sitemaps = json.load(open('/tmp/live-sitemaps.json', encoding='utf-8'))
          assert deployment['schemaVersion'] == 2
          assert deployment['release_commit'] == os.environ['EXPECTED_SHA'], deployment
          assert report['schemaVersion'] == 3
          assert report['htmlPages'] >= deployment['baseline_html_pages']
          assert report.get('aliasReviewStatus') == 'passed'
          assert not report.get('unrestoredRejectedAliases')
          assert report.get('remainingThinPages') == 0
          assert report.get('completenessRatio') == 1.0
          assert report.get('integrityStatus') == 'passed'
          assert report.get('integrityMissingInternalPaths') == 0
          assert duplicates.get('status') == 'passed'
          assert sitemaps.get('status') == 'passed'
          assert sitemaps.get('canonicalRootSitemapUrls') == sitemaps.get('indexableHtmlPages')
          assert not sitemaps.get('staleLegacySitemaps')
          assert sitemaps.get('canonicalRootSitemapUrls', 0) >= 4000
          print({'deployment': deployment})
          print({key: report.get(key) for key in (
              'status', 'htmlPages', 'historicalPagesRestored', 'historySince',
              'allGeneratedAliasesReviewed', 'thinAliasesRedirected',
              'falseAliasesRejected', 'remainingThinPages', 'completenessRatio',
              'integrityStatus', 'integrityMissingInternalPaths'
          )})
          print({'sitemaps': sitemaps})
          PY
              then
                ready=1
                break
              fi
            fi
            sleep 5
          done
          test "$ready" = 1
