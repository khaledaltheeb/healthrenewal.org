name: Recover, consolidate, and deploy complete site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-production
  cancel-in-progress: true

jobs:
  recover-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout current main with full history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch every current branch for content recovery
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*' --prune
          echo "Branches available: $(git for-each-ref --format='%(refname)' refs/remotes/origin | wc -l)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Locate latest validated complete-site baseline
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=validated-production-site&per_page=100" \
            -o /tmp/baselines.json
          python - <<'PY'
          import json, os
          payload = json.load(open('/tmp/baselines.json', encoding='utf-8'))
          candidates = [
              item for item in payload.get('artifacts', [])
              if not item.get('expired')
              and item.get('workflow_run', {}).get('head_branch') == 'main'
              and item.get('workflow_run', {}).get('id')
          ]
          if not candidates:
              raise SystemExit('No active validated-production-site artifact from main')
          item = max(candidates, key=lambda x: x.get('created_at', ''))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"run_id={item['workflow_run']['id']}\n")
              output.write(f"artifact_id={item['id']}\n")
              output.write(f"created_at={item.get('created_at', '')}\n")
          print({'baselineArtifactId': item['id'], 'runId': item['workflow_run']['id'], 'createdAt': item.get('created_at')})
          PY

      - name: Download validated complete-site baseline
        uses: actions/download-artifact@v4
        with:
          name: validated-production-site
          path: _baseline
          repository: khaledaltheeb/healthrenewal.org
          run-id: ${{ steps.baseline.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Download pre-merge validated baseline for false-alias restoration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf _legacy_baseline
          mkdir -p _legacy_baseline
          curl -fsSL -L \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/8802973435/zip" \
            -o /tmp/pre-merge-baseline.zip
          unzip -q /tmp/pre-merge-baseline.zip -d _legacy_baseline
          test -f _legacy_baseline/index.html

      - name: Recover richest versions, review all aliases, and complete thin pages
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/recover_content_v1.py \
            scripts/recover_content_v2.py \
            scripts/review_content_aliases_v1.py \
            scripts/finalize_content_quality_v1.py
          python scripts/recover_content_v2.py \
            --root . \
            --site _site \
            --baseline _baseline \
            --days 10
          python scripts/review_content_aliases_v1.py \
            --site _site \
            --baseline _baseline \
            --legacy-baseline _legacy_baseline \
            --days 10
          python scripts/finalize_content_quality_v1.py --site _site

      - name: Upload recovery diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-recovery-diagnostics-${{ github.run_id }}
          path: |
            _site/api/content-recovery-report.json
            _site/api/content-page-inventory.json
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce complete and semantically valid inventory
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('_site/api/content-recovery-report.json').read_text(encoding='utf-8'))
          inventory = json.loads(Path('_site/api/content-page-inventory.json').read_text(encoding='utf-8'))
          assert report['schemaVersion'] == 2
          assert report['htmlPages'] == len(inventory['pages'])
          assert report['htmlPages'] >= 3000, report['htmlPages']
          assert report.get('aliasReviewStatus') == 'passed', report.get('aliasReviewStatus')
          assert not report.get('unrestoredRejectedAliases'), report.get('unrestoredRejectedAliases')
          assert report.get('allGeneratedAliasesReviewed', 0) >= 100, report.get('allGeneratedAliasesReviewed')
          assert report.get('falseAliasesRejected', 0) >= 100, report.get('falseAliasesRejected')
          assert report.get('thinAliasesRedirected', 999) <= 5, report.get('thinAliasesRedirected')
          assert report['remainingThinPages'] == 0, report['thinPages'][:20]
          assert report['completenessRatio'] == 1.0, report['completenessRatio']
          assert Path('_site/index.html').is_file()
          print({key: report.get(key) for key in (
              'status', 'htmlPages', 'historicalPagesRestored',
              'allGeneratedAliasesReviewed', 'thinAliasesRedirected',
              'falseAliasesRejected', 'thinPagesExpanded',
              'remainingThinPagesExpanded', 'finalQualityExpansions',
              'finalQualityRedirects', 'remainingThinPages',
              'completenessRatio'
          )})
          PY
          touch _site/.nojekyll

      - name: Preserve validated complete site for 90 days
        uses: actions/upload-artifact@v4
        with:
          name: validated-production-site
          path: _site
          include-hidden-files: true
          retention-days: 90
          compression-level: 6

      - uses: actions/configure-pages@v5

      - name: Upload complete Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy complete recovered site
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify complete recovery report live
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 120); do
            nonce="${GITHUB_RUN_ID}-${attempt}-$(date +%s%N)"
            if curl -fsSL --retry 2 -H 'Cache-Control: no-cache' \
              "https://healthrenewal.org/api/content-recovery-report.json?recovery=${nonce}" \
              -o /tmp/live-recovery.json; then
              if python - <<'PY'
          import json
          report = json.load(open('/tmp/live-recovery.json', encoding='utf-8'))
          assert report['schemaVersion'] == 2
          assert report['htmlPages'] >= 3000
          assert report.get('aliasReviewStatus') == 'passed'
          assert not report.get('unrestoredRejectedAliases')
          assert report.get('allGeneratedAliasesReviewed', 0) >= 100
          assert report.get('falseAliasesRejected', 0) >= 100
          assert report.get('thinAliasesRedirected', 999) <= 5
          assert report['remainingThinPages'] == 0
          assert report['completenessRatio'] == 1.0
          print({key: report.get(key) for key in (
              'status', 'htmlPages', 'historicalPagesRestored',
              'allGeneratedAliasesReviewed', 'thinAliasesRedirected',
              'falseAliasesRejected', 'thinPagesExpanded',
              'finalQualityExpansions', 'remainingThinPages',
              'completenessRatio'
          )})
          PY
              then
                ready=1
                break
              fi
            fi
            sleep 5
          done
          test "$ready" = 1
