name: Build clean complete site and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-production
  cancel-in-progress: false

jobs:
  build:
    name: Build clean authoritative site
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      build_sha: ${{ steps.source.outputs.build_sha }}

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Bind build to current main head
        id: source
        run: |
          set -euo pipefail
          build_sha="$(git rev-parse HEAD)"
          echo "build_sha=${build_sha}" >> "${GITHUB_OUTPUT}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Locate latest validated production baseline
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=validated-production-site&per_page=100" \
            -o /tmp/baselines.json
          python - <<'PY'
          import json, os
          payload = json.load(open('/tmp/baselines.json', encoding='utf-8'))
          candidates = [
              item for item in payload.get('artifacts', [])
              if not item.get('expired')
              and item.get('workflow_run', {}).get('head_branch') == 'main'
              and item.get('workflow_run', {}).get('id')
          ]
          if not candidates:
              raise SystemExit('No active validated-production-site artifact from main')
          item = max(candidates, key=lambda x: x.get('created_at', ''))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"run_id={item['workflow_run']['id']}\n")
          print({'baselineRunId': item['workflow_run']['id'], 'createdAt': item.get('created_at')})
          PY

      - name: Download validated baseline
        uses: actions/download-artifact@v4
        with:
          name: validated-production-site
          path: /tmp/validated-baseline
          repository: khaledaltheeb/healthrenewal.org
          run-id: ${{ steps.baseline.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Build, expand scientific content, finalize sitemap, and validate
        env:
          BUILD_SHA: ${{ steps.source.outputs.build_sha }}
        run: |
          set -euo pipefail
          test -f /tmp/validated-baseline/index.html
          python -m py_compile \
            scripts/normalize_platform_shell.py \
            scripts/build_clean_site_v1.py \
            scripts/ensure_special_needs_publication_v1.py \
            scripts/publish_scientific_special_needs_library_v1.py \
            scripts/publish_complete_sitemap_v360.py
          python scripts/build_clean_site_v1.py --root . --site _site --baseline /tmp/validated-baseline

          # Phase 1: materialize generated production families without requiring
          # their routes to exist in the pre-generation sitemap.
          python - <<'PY'
          from pathlib import Path
          from scripts.ensure_special_needs_publication_v1 import repair_missing_generated_families
          print(repair_missing_generated_families(Path('_site'), Path.cwd()))
          PY

          # Expand the authoritative artifact with reviewed, source-linked science pages.
          python scripts/publish_scientific_special_needs_library_v1.py _site

          # Phase 2: discover every real indexable page after all publishers ran.
          python scripts/publish_complete_sitemap_v360.py _site --minimum-urls 3000

          # Phase 3: validate generated families against the final sitemap.
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.ensure_special_needs_publication_v1 import validate_publication_inventory
          site = Path('_site')
          special = validate_publication_inventory(site, repair={'actions':['generated-before-final-sitemap']})
          report = json.loads((site / 'api/clean-site-build-v1.json').read_text(encoding='utf-8'))
          sitemap = json.loads((site / 'api/sitemap-completeness-v360.json').read_text(encoding='utf-8'))
          science = json.loads((site / 'api/scientific-special-needs-library-v1.json').read_text(encoding='utf-8'))
          assert report['status'] == 'passed', report
          assert report['htmlPages'] >= 3000, report['htmlPages']
          assert special['status'] == 'passed', special
          assert sitemap['status'] == 'passed', sitemap
          assert science['status'] == 'passed' and science['topicPages'] >= 12, science
          assert (site / 'special-needs/science/index.html').is_file()
          assert (site / 'special-needs/science/cerebral-palsy-hip-surveillance/index.html').is_file()
          assert (site / 'sitemap.xml').is_file()
          assert (site / 'sitemap-index.xml').is_file()
          assert (site / 'robots.txt').is_file()
          assert (site / 'assets/platform/sitewide-polish.css').is_file()
          print({'cleanBuild': report, 'specialNeeds': special['counts'], 'science': science, 'sitemap': sitemap})
          PY
          cat > _site/deployment.json <<EOF
          {
            "schemaVersion": 5,
            "release_commit": "${BUILD_SHA}",
            "build_mode": "clean-main-generated-contracts-science-final-sitemap"
          }
          EOF
          touch _site/.nojekyll

      - name: Preserve clean validated site
        uses: actions/upload-artifact@v4
        with:
          name: validated-production-site
          path: _site
          include-hidden-files: true
          retention-days: 90
          compression-level: 6

      - uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy clean site
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify clean deployment live
        env:
          EXPECTED_SHA: ${{ needs.build.outputs.build_sha }}
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 60); do
            nonce="${GITHUB_RUN_ID}-${attempt}-$(date +%s)"
            if curl -fsSL --retry 2 -H 'Cache-Control: no-cache' \
              "https://healthrenewal.org/deployment.json?release=${nonce}" -o /tmp/deployment.json \
              && curl -fsSL --retry 2 -H 'Cache-Control: no-cache' \
              "https://healthrenewal.org/api/clean-site-build-v1.json?release=${nonce}" -o /tmp/report.json \
              && curl -fsSL --retry 2 -H 'Cache-Control: no-cache' \
              "https://healthrenewal.org/api/special-needs-publication-inventory-v1.json?release=${nonce}" -o /tmp/special.json \
              && curl -fsSL --retry 2 -H 'Cache-Control: no-cache' \
              "https://healthrenewal.org/api/scientific-special-needs-library-v1.json?release=${nonce}" -o /tmp/science.json \
              && curl -fsSL --retry 2 -H 'Cache-Control: no-cache' \
              "https://healthrenewal.org/api/sitemap-completeness-v360.json?release=${nonce}" -o /tmp/sitemap.json \
              && curl -fsSL --retry 2 -H 'Cache-Control: no-cache' \
              "https://healthrenewal.org/special-needs/science/cerebral-palsy-hip-surveillance/?release=${nonce}" -o /tmp/science-page.html \
              && curl -fsSL --retry 2 -H 'Cache-Control: no-cache' \
              "https://healthrenewal.org/sitemap-index.xml?release=${nonce}" -o /tmp/sitemap-index.xml; then
              if python - <<'PY'
          import json, os
          from xml.etree import ElementTree as ET
          deployment = json.load(open('/tmp/deployment.json', encoding='utf-8'))
          report = json.load(open('/tmp/report.json', encoding='utf-8'))
          special = json.load(open('/tmp/special.json', encoding='utf-8'))
          science = json.load(open('/tmp/science.json', encoding='utf-8'))
          sitemap = json.load(open('/tmp/sitemap.json', encoding='utf-8'))
          science_page = open('/tmp/science-page.html', encoding='utf-8').read()
          ET.parse('/tmp/sitemap-index.xml')
          assert deployment['release_commit'] == os.environ['EXPECTED_SHA'], deployment
          assert deployment['build_mode'] == 'clean-main-generated-contracts-science-final-sitemap', deployment
          assert report['status'] == 'passed', report
          assert report['htmlPages'] >= 3000, report
          assert special['status'] == 'passed', special
          assert science['status'] == 'passed' and science['topicPages'] >= 12, science
          assert sitemap['status'] == 'passed', sitemap
          assert 'مراقبة الورك في الشلل الدماغي' in science_page
          print({'deployment': deployment, 'cleanBuild': report, 'specialNeeds': special['counts'], 'science': science, 'sitemap': sitemap})
          PY
              then
                ready=1
                break
              fi
            fi
            sleep 5
          done
          test "$ready" = 1
