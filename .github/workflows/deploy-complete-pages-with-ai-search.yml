name: Recover, audit, and deploy complete site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-production
  cancel-in-progress: true

jobs:
  recover-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout current main with full history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch every current branch for content recovery
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*' --prune
          echo "Branches available: $(git for-each-ref --format='%(refname)' refs/remotes/origin | wc -l)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recover richest historical content and consolidate duplicates
        run: |
          set -euo pipefail
          python -m py_compile scripts/recover_content_v1.py
          python scripts/recover_content_v1.py --root . --site _site --days 10

      - name: Enforce recovery inventory
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('_site/api/content-recovery-report.json').read_text(encoding='utf-8'))
          inventory = json.loads(Path('_site/api/content-page-inventory.json').read_text(encoding='utf-8'))
          assert report['htmlPages'] == len(inventory['pages'])
          assert report['htmlPages'] >= 100
          assert report['nonRedirectPages'] > 0
          assert Path('_site/index.html').is_file()
          print({key: report[key] for key in (
              'status', 'htmlPages', 'historicalPagesRestored',
              'duplicateRoutesConsolidated', 'duplicateGroupsMerged',
              'remainingThinPages', 'completenessRatio'
          )})
          PY
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - name: Upload recovered complete site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy recovered complete site
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify recovery report is live
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 120); do
            nonce="${GITHUB_RUN_ID}-${attempt}-$(date +%s%N)"
            if curl -fsSL --retry 2 -H 'Cache-Control: no-cache' \
              "https://healthrenewal.org/api/content-recovery-report.json?recovery=${nonce}" \
              -o /tmp/live-recovery.json; then
              if python - <<'PY'
          import json
          report = json.load(open('/tmp/live-recovery.json', encoding='utf-8'))
          assert report['htmlPages'] >= 100
          assert report['nonRedirectPages'] > 0
          print({key: report[key] for key in (
              'status', 'htmlPages', 'historicalPagesRestored',
              'duplicateRoutesConsolidated', 'remainingThinPages',
              'completenessRatio'
          )})
          PY
              then
                ready=1
                break
              fi
            fi
            sleep 5
          done
          test "$ready" = 1
