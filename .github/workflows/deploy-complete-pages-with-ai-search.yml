name: Build clean complete site and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-production
  cancel-in-progress: false

jobs:
  build:
    name: Audit, rebuild and validate institutional site
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      build_sha: ${{ steps.source.outputs.build_sha }}

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Bind build to current main head
        id: source
        run: |
          set -euo pipefail
          build_sha="$(git rev-parse HEAD)"
          echo "build_sha=${build_sha}" >> "${GITHUB_OUTPUT}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Locate latest validated production baseline
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=validated-production-site&per_page=100" -o /tmp/baselines.json
          python - <<'PY'
          import json, os
          payload = json.load(open('/tmp/baselines.json', encoding='utf-8'))
          candidates = [item for item in payload.get('artifacts', []) if not item.get('expired') and item.get('workflow_run', {}).get('head_branch') == 'main' and item.get('workflow_run', {}).get('id')]
          if not candidates:
              raise SystemExit('No active validated-production-site artifact from main')
          item = max(candidates, key=lambda x: x.get('created_at', ''))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"run_id={item['workflow_run']['id']}\n")
          print({'baselineRunId': item['workflow_run']['id'], 'createdAt': item.get('created_at')})
          PY

      - name: Download validated baseline
        uses: actions/download-artifact@v4
        with:
          name: validated-production-site
          path: /tmp/validated-baseline
          repository: khaledaltheeb/healthrenewal.org
          run-id: ${{ steps.baseline.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Audit repository, restore losses, expand science and finalize publication
        env:
          BUILD_SHA: ${{ steps.source.outputs.build_sha }}
        run: |
          set -euo pipefail
          test -f /tmp/validated-baseline/index.html
          python -m py_compile scripts/normalize_platform_shell.py scripts/build_clean_site_v1.py scripts/ensure_special_needs_publication_v1.py scripts/publish_scientific_special_needs_library_v1.py scripts/publish_complete_sitemap_v360.py

          # Repository is authoritative; validated production restores missing public files only.
          python scripts/build_clean_site_v1.py --root . --site _site --baseline /tmp/validated-baseline

          # Expand the scientific library in the assembled artifact.
          python scripts/publish_scientific_special_needs_library_v1.py _site

          # Every late publisher must receive the same deterministic institutional shell.
          python scripts/normalize_platform_shell.py _site --report-path _site/reports/final-platform-normalization.json

          # Discover the complete artifact after every page publisher and normalizer.
          python scripts/publish_complete_sitemap_v360.py _site --minimum-urls 3000

          # Validate publication families against the FINAL sitemap. Raw historical HTML
          # counts are informational only: old production artifacts may contain retired,
          # merged, noindex or technical pages that must not block a cleaner publication.
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.ensure_special_needs_publication_v1 import validate_publication_inventory

          site = Path('_site')
          baseline = Path('/tmp/validated-baseline')
          clean = json.loads((site / 'api/clean-site-build-v1.json').read_text(encoding='utf-8'))
          sitemap = json.loads((site / 'api/sitemap-completeness-v360.json').read_text(encoding='utf-8'))
          science = json.loads((site / 'api/scientific-special-needs-library-v1.json').read_text(encoding='utf-8'))
          normalization = json.loads((site / 'reports/final-platform-normalization.json').read_text(encoding='utf-8'))
          special = validate_publication_inventory(site, repair={'actions':['baseline-preserved-no-destructive-regeneration']})

          repo_html = sum(1 for p in Path('.').rglob('*.html') if '_site' not in p.parts and '.git' not in p.parts)
          baseline_html = sum(1 for p in baseline.rglob('*.html') if p.is_file())
          final_html = sum(1 for p in site.rglob('*.html') if p.is_file())
          repo_files = sum(1 for p in Path('.').rglob('*') if p.is_file() and '_site' not in p.parts and '.git' not in p.parts)
          baseline_files = sum(1 for p in baseline.rglob('*') if p.is_file())
          final_files = sum(1 for p in site.rglob('*') if p.is_file())

          assert clean['status'] == 'passed', clean
          assert normalization['status'] == 'passed', normalization
          assert baseline_html >= 3000, {'baselineHtml': baseline_html}
          assert final_html >= 3000, {'finalHtml': final_html}
          assert sitemap['status'] == 'passed', sitemap
          assert sitemap['real_indexable_urls'] >= 3000, sitemap
          assert science['status'] == 'passed' and science['topicPages'] >= 12, science
          assert special['status'] == 'passed', special
          assert (site / 'special-needs/science/index.html').is_file()
          assert (site / 'special-needs/reference/index.html').is_file()
          assert (site / 'special-needs/reference/aac-complete-guide/index.html').is_file()
          assert (site / 'special-needs/reference/autism-adhd-differential/index.html').is_file()
          assert (site / 'special-needs/reference/iep-measurable-goals-guide/index.html').is_file()
          assert (site / 'sitemap.xml').is_file()
          assert (site / 'sitemap-index.xml').is_file()
          assert (site / 'robots.txt').is_file()

          audit = {
              'schemaVersion': 4,
              'status': 'passed',
              'policy': 'repository-authoritative; validated production restores missing public paths only; retired/merged/noindex/technical historical HTML is not required to inflate production counts; indexable routes, critical families and final sitemap are authoritative publication gates',
              'repository': {'files': repo_files, 'htmlPages': repo_html},
              'validatedBaseline': {'files': baseline_files, 'htmlPages': baseline_html},
              'finalPublication': {'files': final_files, 'htmlPages': final_html, 'indexableUrls': sitemap['real_indexable_urls']},
              'recovery': {'missingFilesRestored': clean.get('baselineMissingFilesRestored', 0), 'generatedMixBlocksRemoved': clean.get('generatedMixBlocksRemoved', 0), 'pagesPolished': clean.get('pagesPolished', 0)},
              'expansion': {'scientificTopicPages': science['topicPages'], 'referenceClusterRequired': True},
              'specialNeedsCounts': special['counts'],
              'platformNormalization': normalization['counts'],
          }
          api = site / 'api'
          (api / 'repository-production-audit-v2.json').write_text(json.dumps(audit, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          (api / 'final-production-inventory-v1.json').write_text(json.dumps({'schemaVersion':4,'status':'passed','finalHtmlPages':final_html,'realIndexableUrls':sitemap['real_indexable_urls'],'scienceTopicPages':science['topicPages'],'specialNeedsCounts':special['counts'],'platformNormalization':normalization['counts']}, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(audit)
          PY

          cat > _site/deployment.json <<EOF
          {
            "schemaVersion": 9,
            "release_commit": "${BUILD_SHA}",
            "build_mode": "institutional-audit-indexable-route-quality-gate-reference-cluster"
          }
          EOF
          touch _site/.nojekyll

      - name: Preserve validated institutional site
        uses: actions/upload-artifact@v4
        with:
          name: validated-production-site
          path: _site
          include-hidden-files: true
          retention-days: 90
          compression-level: 6

      - uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy institutional site
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify exact institutional publication live
        env:
          EXPECTED_SHA: ${{ needs.build.outputs.build_sha }}
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 60); do
            nonce="${GITHUB_RUN_ID}-${attempt}-$(date +%s)"
            if curl -fsSL --retry 2 -H 'Cache-Control: no-cache' "https://healthrenewal.org/deployment.json?release=${nonce}" -o /tmp/deployment.json \
              && curl -fsSL --retry 2 -H 'Cache-Control: no-cache' "https://healthrenewal.org/api/repository-production-audit-v2.json?release=${nonce}" -o /tmp/audit.json \
              && curl -fsSL --retry 2 -H 'Cache-Control: no-cache' "https://healthrenewal.org/api/final-production-inventory-v1.json?release=${nonce}" -o /tmp/final.json \
              && curl -fsSL --retry 2 -H 'Cache-Control: no-cache' "https://healthrenewal.org/api/scientific-special-needs-library-v1.json?release=${nonce}" -o /tmp/science.json \
              && curl -fsSL --retry 2 -H 'Cache-Control: no-cache' "https://healthrenewal.org/special-needs/science/cerebral-palsy-hip-surveillance/?release=${nonce}" -o /tmp/science-page.html \
              && curl -fsSL --retry 2 -H 'Cache-Control: no-cache' "https://healthrenewal.org/special-needs/reference/aac-complete-guide/?release=${nonce}" -o /tmp/reference-page.html \
              && curl -fsSL --retry 2 -H 'Cache-Control: no-cache' "https://healthrenewal.org/sitemap-index.xml?release=${nonce}" -o /tmp/sitemap-index.xml; then
              if python - <<'PY'
          import json, os
          from xml.etree import ElementTree as ET
          deployment = json.load(open('/tmp/deployment.json', encoding='utf-8'))
          audit = json.load(open('/tmp/audit.json', encoding='utf-8'))
          final = json.load(open('/tmp/final.json', encoding='utf-8'))
          science = json.load(open('/tmp/science.json', encoding='utf-8'))
          science_page = open('/tmp/science-page.html', encoding='utf-8').read()
          reference_page = open('/tmp/reference-page.html', encoding='utf-8').read()
          ET.parse('/tmp/sitemap-index.xml')
          assert deployment['release_commit'] == os.environ['EXPECTED_SHA'], deployment
          assert deployment['build_mode'] == 'institutional-audit-indexable-route-quality-gate-reference-cluster', deployment
          assert audit['status'] == 'passed', audit
          assert audit['finalPublication']['htmlPages'] >= 3000, audit
          assert audit['finalPublication']['indexableUrls'] >= 3000, audit
          assert final['status'] == 'passed' and final['finalHtmlPages'] >= 3000, final
          assert science['status'] == 'passed' and science['topicPages'] >= 12, science
          assert 'مراقبة الورك في الشلل الدماغي' in science_page
          assert 'التواصل المعزز والبديل' in reference_page and 'ASHA' in reference_page, reference_page[:1200]
          print({'deployment': deployment, 'audit': audit, 'final': final, 'science': science})
          PY
              then
                ready=1
                break
              fi
            fi
            sleep 5
          done
          test "$ready" = 1
