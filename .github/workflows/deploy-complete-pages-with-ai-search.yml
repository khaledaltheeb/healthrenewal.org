name: Build clean main-only site and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-production
  cancel-in-progress: false

jobs:
  build:
    name: Build clean authoritative site
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      build_sha: ${{ steps.source.outputs.build_sha }}

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Bind build to current main head
        id: source
        run: |
          set -euo pipefail
          build_sha="$(git rev-parse HEAD)"
          echo "build_sha=${build_sha}" >> "${GITHUB_OUTPUT}"
          echo "Building clean site from ${build_sha}."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build current-main pages without content mixing
        env:
          BUILD_SHA: ${{ steps.source.outputs.build_sha }}
        run: |
          set -euo pipefail
          python -m py_compile scripts/normalize_platform_shell.py scripts/build_clean_site_v1.py
          python scripts/build_clean_site_v1.py --root . --site _site
          python - <<'PY'
          import json
          from pathlib import Path
          site = Path('_site')
          report = json.loads((site / 'api/clean-site-build-v1.json').read_text(encoding='utf-8'))
          assert report['status'] == 'passed', report
          assert report['htmlPages'] >= 3000, report['htmlPages']
          assert (site / 'index.html').is_file()
          assert (site / 'assets/platform/sitewide-polish.css').is_file()
          print(report)
          PY
          cat > _site/deployment.json <<EOF
          {
            "schemaVersion": 3,
            "release_commit": "${BUILD_SHA}",
            "build_mode": "clean-main-only"
          }
          EOF
          touch _site/.nojekyll

      - name: Upload clean build diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: clean-site-build-${{ github.run_id }}
          path: |
            _site/api/clean-site-build-v1.json
            _site/deployment.json
          retention-days: 30

      - uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy clean site
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify exact clean deployment live
        env:
          EXPECTED_SHA: ${{ needs.build.outputs.build_sha }}
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 60); do
            nonce="${GITHUB_RUN_ID}-${attempt}-$(date +%s)"
            if curl -fsSL --retry 2 -H 'Cache-Control: no-cache' \
              "https://healthrenewal.org/deployment.json?release=${nonce}" -o /tmp/deployment.json \
              && curl -fsSL --retry 2 -H 'Cache-Control: no-cache' \
              "https://healthrenewal.org/api/clean-site-build-v1.json?release=${nonce}" -o /tmp/report.json; then
              if python - <<'PY'
          import json, os
          deployment = json.load(open('/tmp/deployment.json', encoding='utf-8'))
          report = json.load(open('/tmp/report.json', encoding='utf-8'))
          assert deployment['release_commit'] == os.environ['EXPECTED_SHA'], deployment
          assert deployment['build_mode'] == 'clean-main-only', deployment
          assert report['status'] == 'passed', report
          assert report['htmlPages'] >= 3000, report
          print({'deployment': deployment, 'cleanBuild': report})
          PY
              then
                ready=1
                break
              fi
            fi
            sleep 5
          done
          test "$ready" = 1
