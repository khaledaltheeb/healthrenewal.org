name: Recover, consolidate, and deploy complete site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-production
  cancel-in-progress: true

jobs:
  build:
    name: Build and validate complete site
    runs-on: ubuntu-latest
    timeout-minutes: 55
    outputs:
      build_sha: ${{ steps.source.outputs.build_sha }}

    steps:
      - name: Checkout current main with full history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Bind the build to the current main head
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git checkout --detach origin/main
          build_sha="$(git rev-parse HEAD)"
          api_sha="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" \
            | python -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')"
          test "${build_sha}" = "${api_sha}"
          echo "build_sha=${build_sha}" >> "${GITHUB_OUTPUT}"
          echo "Building current main at ${build_sha}."

      - name: Fetch every current branch for content recovery
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*' --prune
          echo "Branches available: $(git for-each-ref --format='%(refname)' refs/remotes/origin | wc -l)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Locate latest validated complete-site baseline
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=validated-production-site&per_page=100" \
            -o /tmp/baselines.json
          python - <<'PY'
          import json, os
          payload = json.load(open('/tmp/baselines.json', encoding='utf-8'))
          candidates = [
              item for item in payload.get('artifacts', [])
              if not item.get('expired')
              and item.get('workflow_run', {}).get('head_branch') == 'main'
              and item.get('workflow_run', {}).get('id')
          ]
          if not candidates:
              raise SystemExit('No active validated-production-site artifact from main')
          item = max(candidates, key=lambda x: x.get('created_at', ''))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"run_id={item['workflow_run']['id']}\n")
              output.write(f"artifact_id={item['id']}\n")
              output.write(f"created_at={item.get('created_at', '')}\n")
          print({'baselineArtifactId': item['id'], 'runId': item['workflow_run']['id'], 'createdAt': item.get('created_at')})
          PY

      - name: Download validated complete-site baseline outside public source
        uses: actions/download-artifact@v4
        with:
          name: validated-production-site
          path: /tmp/validated-baseline
          repository: khaledaltheeb/healthrenewal.org
          run-id: ${{ steps.baseline.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Recover richest versions, review aliases, merge duplicates, and complete thin pages
        run: |
          set -euo pipefail
          test -f /tmp/validated-baseline/index.html
          test ! -e _baseline
          test ! -e _legacy_baseline
          python -m py_compile \
            scripts/recover_content_v1.py \
            scripts/recover_content_v2.py \
            scripts/review_content_aliases_v1.py \
            scripts/consolidate_duplicate_pages_v1.py \
            scripts/publish_self_advocacy_base_v170.py \
            scripts/publish_self_advocacy_v170.py \
            scripts/publish_special_needs_cdls_v337.py \
            scripts/finalize_content_quality_v1.py
          python scripts/recover_content_v2.py \
            --root . \
            --site _site \
            --baseline /tmp/validated-baseline \
            --days 10
          python scripts/review_content_aliases_v1.py \
            --site _site \
            --baseline /tmp/validated-baseline \
            --days 10
          python scripts/finalize_content_quality_v1.py --site _site

      - name: Upload recovery diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-recovery-diagnostics-${{ github.run_id }}
          path: |
            _site/api/content-recovery-report.json
            _site/api/content-page-inventory.json
            _site/api/duplicate-consolidation-v1.json
            _site/api/self-advocacy-v170.json
            _site/api/self-advocacy-v171.json
            _site/api/self-advocacy-v172.json
            _site/api/special-needs-cdls-v337.json
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce complete, consolidated, and semantically valid inventory
        env:
          BUILD_SHA: ${{ steps.source.outputs.build_sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          site = Path('_site')
          report = json.loads((site / 'api/content-recovery-report.json').read_text(encoding='utf-8'))
          inventory = json.loads((site / 'api/content-page-inventory.json').read_text(encoding='utf-8'))
          duplicates = json.loads((site / 'api/duplicate-consolidation-v1.json').read_text(encoding='utf-8'))
          self_advocacy = json.loads((site / 'api/self-advocacy-v172.json').read_text(encoding='utf-8'))
          cdls = json.loads((site / 'api/special-needs-cdls-v337.json').read_text(encoding='utf-8'))

          assert report['schemaVersion'] == 2
          assert report['htmlPages'] == len(inventory['pages'])
          assert 3000 <= report['htmlPages'] <= 6000, report['htmlPages']
          assert not any(page['path'].startswith(('_baseline/', '_legacy_baseline/')) for page in inventory['pages'])
          assert report.get('aliasReviewStatus') == 'passed', report.get('aliasReviewStatus')
          assert not report.get('unrestoredRejectedAliases'), report.get('unrestoredRejectedAliases')
          reviewed = report.get('allGeneratedAliasesReviewed', 0)
          retained = report.get('thinAliasesRedirected', 0)
          rejected = report.get('falseAliasesRejected', 0)
          assert retained <= 5, retained
          assert reviewed == retained + rejected, (reviewed, retained, rejected)
          assert report.get('finalQualityRedirects') == 0, report.get('finalQualityRedirects')
          assert len(report.get('aliases', [])) == retained, report.get('aliases')
          assert report['remainingThinPages'] == 0, report['thinPages'][:20]
          assert report['completenessRatio'] == 1.0, report['completenessRatio']
          assert report.get('integrityStatus') == 'passed', report.get('integrityStatus')
          assert report.get('integrityMissingInternalPaths') == 0, report.get('integrityMissingInternalPaths')

          assert duplicates.get('status') == 'passed', duplicates
          assert duplicates.get('duplicateRoutesConsolidated', 0) >= 13, duplicates
          assert duplicates.get('duplicateGroupsMerged', 0) >= 13, duplicates
          assert self_advocacy.get('status') == 'passed', self_advocacy
          assert self_advocacy.get('publicContentPackageCount', 0) >= 9, self_advocacy
          assert self_advocacy.get('standalonePagesCreated') == 0, self_advocacy
          assert cdls.get('status') == 'passed', cdls
          assert cdls.get('single_canonical_route') is True, cdls

          markers = ('دُمج محتوى هذه الصفحة', 'دُمجت هذه الصفحة', 'content-recovery-redirect')
          generated_redirects = []
          for page in site.rglob('*.html'):
              text = page.read_text(encoding='utf-8', errors='replace')
              if any(marker in text for marker in markers):
                  generated_redirects.append(page.relative_to(site).as_posix())
          assert len(generated_redirects) == retained, generated_redirects
          assert (site / 'index.html').is_file()

          deployment = {
              'schemaVersion': 1,
              'release_commit': os.environ['BUILD_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'html_pages': report['htmlPages'],
              'completeness_ratio': report['completenessRatio'],
              'duplicate_routes_consolidated': duplicates['duplicateRoutesConsolidated'],
              'missing_internal_paths': report['integrityMissingInternalPaths'],
          }
          (site / 'deployment.json').write_text(
              json.dumps(deployment, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print({key: report.get(key) for key in (
              'status', 'htmlPages', 'historicalPagesRestored',
              'allGeneratedAliasesReviewed', 'thinAliasesRedirected',
              'falseAliasesRejected', 'thinPagesExpanded',
              'remainingThinPagesExpanded', 'finalQualityExpansions',
              'finalQualityRedirects', 'remainingThinPages',
              'completenessRatio', 'integrityStatus',
              'integrityMissingInternalPaths'
          )})
          print({'duplicateRoutesConsolidated': duplicates['duplicateRoutesConsolidated']})
          print({'generatedRedirects': generated_redirects})
          print({'deployment': deployment})
          PY
          touch _site/.nojekyll

      - name: Preserve validated complete site for 90 days
        uses: actions/upload-artifact@v4
        with:
          name: validated-production-site
          path: _site
          include-hidden-files: true
          retention-days: 90
          compression-level: 6

      - uses: actions/configure-pages@v5

      - name: Upload complete Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy validated complete site
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Refuse deployment if main advanced after the validated build
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_SHA: ${{ needs.build.outputs.build_sha }}
        run: |
          set -euo pipefail
          current_sha="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" \
            | python -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')"
          test "${current_sha}" = "${BUILD_SHA}"
          echo "Deploying validated current main at ${BUILD_SHA}."

      - name: Deploy complete recovered site
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify exact deployed commit and recovery contracts live
        env:
          EXPECTED_SHA: ${{ needs.build.outputs.build_sha }}
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 120); do
            nonce="${GITHUB_RUN_ID}-${attempt}-$(date +%s%N)"
            if curl -fsSL --retry 2 -H 'Cache-Control: no-cache' \
              "https://healthrenewal.org/deployment.json?release=${nonce}" \
              -o /tmp/live-deployment.json \
              && curl -fsSL --retry 2 -H 'Cache-Control: no-cache' \
              "https://healthrenewal.org/api/content-recovery-report.json?recovery=${nonce}" \
              -o /tmp/live-recovery.json \
              && curl -fsSL --retry 2 -H 'Cache-Control: no-cache' \
              "https://healthrenewal.org/api/duplicate-consolidation-v1.json?duplicates=${nonce}" \
              -o /tmp/live-duplicates.json; then
              if python - <<'PY'
          import json, os
          deployment = json.load(open('/tmp/live-deployment.json', encoding='utf-8'))
          report = json.load(open('/tmp/live-recovery.json', encoding='utf-8'))
          duplicates = json.load(open('/tmp/live-duplicates.json', encoding='utf-8'))
          assert deployment['release_commit'] == os.environ['EXPECTED_SHA'], deployment
          assert deployment['schemaVersion'] == 1
          assert report['schemaVersion'] == 2
          assert 3000 <= report['htmlPages'] <= 6000
          assert report.get('aliasReviewStatus') == 'passed'
          assert not report.get('unrestoredRejectedAliases')
          reviewed = report.get('allGeneratedAliasesReviewed', 0)
          retained = report.get('thinAliasesRedirected', 0)
          rejected = report.get('falseAliasesRejected', 0)
          assert retained <= 5
          assert reviewed == retained + rejected
          assert report.get('finalQualityRedirects') == 0
          assert len(report.get('aliases', [])) == retained
          assert report['remainingThinPages'] == 0
          assert report['completenessRatio'] == 1.0
          assert report.get('integrityStatus') == 'passed'
          assert report.get('integrityMissingInternalPaths') == 0
          assert duplicates.get('status') == 'passed'
          assert duplicates.get('duplicateRoutesConsolidated', 0) >= 13
          print({'deployment': deployment})
          print({key: report.get(key) for key in (
              'status', 'htmlPages', 'historicalPagesRestored',
              'allGeneratedAliasesReviewed', 'thinAliasesRedirected',
              'falseAliasesRejected', 'thinPagesExpanded',
              'finalQualityExpansions', 'finalQualityRedirects',
              'remainingThinPages', 'completenessRatio',
              'integrityStatus', 'integrityMissingInternalPaths'
          )})
          print({'duplicateRoutesConsolidated': duplicates['duplicateRoutesConsolidated']})
          PY
              then
                ready=1
                break
              fi
            fi
            sleep 5
          done
          test "$ready" = 1
