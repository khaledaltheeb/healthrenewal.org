name: Temporary discoverability cards repair

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: discoverability-cards-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.issue.title == '[release] repair hidden page cards 2026-08-01'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply static section-card architecture
        run: |
          set -euo pipefail
          cat > /tmp/apply_discovery.py <<'PY'
          from pathlib import Path
          import html

          ROOT = Path('.')
          STYLE_MARKER = '/* pt-discoverability-cards:v1 */'
          SECTION_MARKER = 'data-pt-discoverability-cards="v1"'

          hubs = {
            'sections/index.html': {
              'id': 'institutional-access-points',
              'eyebrow': 'بوابات مؤسسية وخدمات مساندة',
              'title': 'صفحات أساسية يجب أن تبقى ظاهرة',
              'intro': 'وصول مباشر إلى أدلة الأسرة والبحث والتواصل والحوكمة والمصادر والفريق، مع وصف واضح لغرض كل صفحة.',
              'cards': [
                ('دليل الأسرة للرعاية والدعم', '64 دليلًا للحالات النمائية والعصبية والحركية والحسية والوراثية، مع خطوات عملية وخطط متابعة وأدوات للأسرة.', '/family-guide/', 'الأسر ومقدمو الرعاية'),
                ('البحث الذكي في المنصة', 'ابحث باللغة الطبيعية داخل محتوى المنصة للوصول إلى الصفحات الأقرب إلى السؤال أو الحالة أو الدليل المطلوب.', '/ai-search/', 'اكتشاف المحتوى'),
                ('تواصل معنا', 'القناة الرسمية للاستفسارات والشراكات والأبحاث والتصحيحات العلمية والدعم التقني والإتاحة والخصوصية.', '/contact/', 'تواصل رسمي'),
                ('سجل المصادر ومسارات التكامل', 'بوابة شفافة للمصادر المسجلة وواجهات البيانات ومسارات التكامل والتحقق من مرجعية المحتوى.', '/source-registry/', 'شفافية المصادر'),
                ('الفريق والشركاء ذوو الاختصاص', 'صفحة تعريفية بالفريق والشراكات المهنية ومسارات التعاون المرتبطة بالمنصة.', '/team-and-partners/', 'تعاون مهني'),
                ('الإتاحة وخطة التوافق', 'إفادة الإتاحة، وسائل الاستخدام الميسر، وآلية الإبلاغ عن عائق يمنع الوصول إلى المحتوى أو الوظائف.', '/accessibility/', 'إتاحة رقمية'),
              ],
            },
            'learning-paths/index.html': {
              'id': 'learning-opportunities',
              'eyebrow': 'تطبيق وتعاون',
              'title': 'فرص التدريب والتعاون المؤسسي',
              'intro': 'مسار واضح للجهات والمختصين والطلاب الراغبين في التدريب أو التعاون أو المساهمة المنهجية.',
              'cards': [
                ('فرص التدريب والتعاون', 'استعرض مجالات التدريب والتعاون المؤسسي والمساهمة العلمية وشروط التواصل والمعلومات التي يجب تجهيزها.', '/learning-paths/opportunities/', 'فرص وتعاون'),
              ],
            },
            'provider-assessment-demo/index.html': {
              'id': 'provider-professional-paths',
              'eyebrow': 'التطوير المهني',
              'title': 'التدريب والسجل المهني',
              'intro': 'بوابتان لمقدمي الخدمة والمراكز: تدريب منظم على التقييم، وسجل مهني للمقاييس والفحوص ومسارات الاستخدام المسؤول.',
              'cards': [
                ('أكاديمية التقييم المهني', 'تدريب المراكز ومقدمي الخدمة على مبادئ التقييم متعدد المصادر، اختيار الأدوات، التوثيق، وحدود التفسير.', '/provider-assessment-demo/training/', 'تدريب مهني'),
                ('السجل المهني للمقاييس والفحوص', 'واجهة منظمة للمقاييس والفحوص والمجالات المهنية، مع ضوابط الاستخدام والترخيص والتفسير المسؤول.', '/provider-assessment-demo/professional-console.html', 'سجل مهني'),
              ],
            },
            'special-needs/index.html': {
              'id': 'special-needs-featured-guides',
              'eyebrow': 'أدلة متخصصة',
              'title': 'تقنيات مساعدة ودليل حالة موسع',
              'intro': 'وصول مباشر إلى منظومة اختيار التقنيات المساعدة وإلى دليل متكامل لمتلازمة برادر ويلي عبر مراحل الحياة.',
              'cards': [
                ('التقنيات المساعدة', 'دليل الاختيار والتقييم والتجربة والأمان والتدريب والصيانة، مع مسارات أخلاقية وتعليم مستمر.', '/special-needs/assistive-technology/', 'تقنيات مساعدة'),
                ('متلازمة برادر ويلي', 'دليل للأسرة والمختصين حول الصحة والتغذية والسلوك والتعليم والمتابعة والدعم عبر مراحل الحياة.', '/special-needs/conditions/prader-willi-syndrome/', 'دليل حالة'),
              ],
            },
            'special-needs/assistive-technology/index.html': {
              'id': 'assistive-technology-professional-guides',
              'eyebrow': 'مسارات تطبيقية ومهنية',
              'title': 'أدلة التقنيات المساعدة المتخصصة',
              'intro': 'مسارات عملية تساعد الأسرة والمختص ومقدم الخدمة على الاختيار الأخلاقي، تقييم الابتكار، التدريب، والتعليم المستمر.',
              'cards': [
                ('قائمة فحص اختيار التقنية المساعدة', 'خطوات منظمة للتقييم والتجربة والملاءمة والأمان والصيانة قبل اعتماد أي تقنية أو جهاز.', '/special-needs/assistive-technology/selection-checklist/', 'اختيار وتقييم'),
                ('مسار التدريب في التقنيات المساعدة', 'خطة تدريب للمستخدم والأسرة والفريق لضمان الاستخدام الفعلي والآمن ومراجعة النتائج.', '/special-needs/assistive-technology/training/', 'تدريب المستخدم'),
                ('أخلاقيات وجودة الخدمة', 'إطار لتقديم خدمات تحترم الحقوق والاختيار والخصوصية والكفاءة المهنية والمتابعة.', '/special-needs/assistive-technology/ethics-and-service/', 'أخلاقيات وجودة'),
                ('مراجعة ابتكارات التقنيات المساعدة', 'بوابة علمية وأخلاقية لفحص الادعاءات والجدوى والمخاطر قبل التجربة أو التوصية أو النشر.', '/special-needs/assistive-technology/innovation-review/', 'ابتكار مسؤول'),
                ('التعليم المستمر والتحقق من الدورات', 'دليل للتحقق من الدورات والمزودين ومسارات التعليم المستمر المرتبطة بالممارسة المهنية.', '/special-needs/assistive-technology/continuing-education/', 'تعليم مستمر'),
              ],
            },
          }

          css_path = ROOT / 'assets/platform/platform-core.css'
          css = css_path.read_text(encoding='utf-8')
          if STYLE_MARKER not in css:
            css += r'''

/* pt-discoverability-cards:v1 */
.pt-discovery-section {
  width: min(var(--pt-content), calc(100% - 28px));
  margin: 2.75rem auto 0;
  padding: clamp(1.15rem, 3vw, 2rem);
  border: 1px solid var(--pt-line);
  border-radius: calc(var(--pt-radius) + 4px);
  background: linear-gradient(145deg, rgba(242,250,248,.96), rgba(255,255,255,.98));
  box-shadow: var(--pt-shadow);
}
.pt-discovery-section__eyebrow {
  margin: 0 0 .25rem;
  color: var(--pt-accent);
  font-size: .88rem;
  font-weight: 900;
  letter-spacing: .02em;
}
.pt-discovery-section h2 {
  margin: 0;
  font-size: clamp(1.55rem, 3.2vw, 2.35rem);
}
.pt-discovery-section__intro {
  margin: .55rem 0 0;
  color: var(--pt-muted);
}
.pt-discovery-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 245px), 1fr));
  gap: 1rem;
  margin-top: 1.35rem;
}
.pt-discovery-card {
  display: flex;
  flex-direction: column;
  min-height: 225px;
  padding: 1.15rem;
  border: 1px solid var(--pt-line);
  border-radius: var(--pt-radius);
  background: var(--pt-surface);
  box-shadow: 0 8px 22px rgba(10,72,71,.07);
}
.pt-discovery-card__tag {
  align-self: flex-start;
  padding: .2rem .65rem;
  border: 1px solid #a9d5d0;
  border-radius: 999px;
  background: var(--pt-surface-soft);
  color: var(--pt-brand-strong);
  font-size: .78rem;
  font-weight: 900;
}
.pt-discovery-card h3 {
  margin: .7rem 0 .35rem;
  font-size: 1.18rem;
}
.pt-discovery-card p {
  flex: 1;
  margin: 0 0 1rem;
  color: var(--pt-muted);
}
.pt-discovery-card a {
  align-self: flex-start;
  min-height: 44px;
  display: inline-flex;
  align-items: center;
  padding: .55rem .85rem;
  border-radius: 10px;
  background: var(--pt-brand);
  color: #fff !important;
  font-weight: 900;
  text-decoration: none;
}
.pt-discovery-card a:hover {
  background: var(--pt-brand-strong);
  color: #fff !important;
}
@media (max-width: 640px) {
  .pt-discovery-section { width: min(100% - 18px, var(--pt-content)); }
  .pt-discovery-card { min-height: 0; }
}
'''
            css_path.write_text(css, encoding='utf-8')

          def section_html(spec):
            sid = html.escape(spec['id'], quote=True)
            cards = []
            for title, description, href, tag in spec['cards']:
              cards.append(f'''<article class="pt-discovery-card">
<span class="pt-discovery-card__tag">{html.escape(tag)}</span>
<h3>{html.escape(title)}</h3>
<p>{html.escape(description)}</p>
<a href="{html.escape(href, quote=True)}">فتح الصفحة <span aria-hidden="true">←</span></a>
</article>''')
            return f'''
<section class="pt-discovery-section" data-pt-discoverability-cards="v1" id="{sid}" aria-labelledby="{sid}-title">
<p class="pt-discovery-section__eyebrow">{html.escape(spec['eyebrow'])}</p>
<h2 id="{sid}-title">{html.escape(spec['title'])}</h2>
<p class="pt-discovery-section__intro">{html.escape(spec['intro'])}</p>
<div class="pt-discovery-grid">
{''.join(cards)}
</div>
</section>
'''

          for rel, spec in hubs.items():
            path = ROOT / rel
            if not path.is_file():
              raise SystemExit(f'missing hub: {rel}')
            text = path.read_text(encoding='utf-8')
            if SECTION_MARKER not in text:
              pos = text.lower().rfind('</main>')
              if pos < 0:
                raise SystemExit(f'no </main> in {rel}')
              text = text[:pos] + section_html(spec) + text[pos:]
            text = text.replace('platform-core.css?v=1.1.0', 'platform-core.css?v=1.2.0')
            path.write_text(text, encoding='utf-8')

          test_path = ROOT / 'tests/test_user_discoverability_cards_v1.py'
          test_path.write_text('''from pathlib import Path\nimport re\n\nROOT = Path(__file__).resolve().parents[1]\nEXPECTED = {\n    "sections/index.html": [\n        "/family-guide/", "/ai-search/", "/contact/", "/source-registry/",\n        "/team-and-partners/", "/accessibility/",\n    ],\n    "learning-paths/index.html": ["/learning-paths/opportunities/"],\n    "provider-assessment-demo/index.html": [\n        "/provider-assessment-demo/training/",\n        "/provider-assessment-demo/professional-console.html",\n    ],\n    "special-needs/index.html": [\n        "/special-needs/assistive-technology/",\n        "/special-needs/conditions/prader-willi-syndrome/",\n    ],\n    "special-needs/assistive-technology/index.html": [\n        "/special-needs/assistive-technology/selection-checklist/",\n        "/special-needs/assistive-technology/training/",\n        "/special-needs/assistive-technology/ethics-and-service/",\n        "/special-needs/assistive-technology/innovation-review/",\n        "/special-needs/assistive-technology/continuing-education/",\n    ],\n}\n\n\ndef test_all_hidden_pages_have_static_section_cards():\n    total = 0\n    for rel, targets in EXPECTED.items():\n        text = (ROOT / rel).read_text(encoding="utf-8")\n        assert text.count('data-pt-discoverability-cards="v1"') == 1, rel\n        assert 'pt-discovery-grid' in text, rel\n        for target in targets:\n            assert f'href="{target}"' in text, (rel, target)\n            total += 1\n    assert total == 16\n\n\ndef test_cards_are_semantic_and_descriptive():\n    for rel in EXPECTED:\n        text = (ROOT / rel).read_text(encoding="utf-8")\n        section = text.split('data-pt-discoverability-cards="v1"', 1)[1].split('</section>', 1)[0]\n        assert section.count('<article class="pt-discovery-card">') == len(EXPECTED[rel])\n        assert section.count('<h3>') == len(EXPECTED[rel])\n        assert section.count('<p>') >= len(EXPECTED[rel])\n        assert section.count('فتح الصفحة') == len(EXPECTED[rel])\n\n\ndef test_shared_card_styles_are_versioned():\n    css = (ROOT / "assets/platform/platform-core.css").read_text(encoding="utf-8")\n    assert css.count('/* pt-discoverability-cards:v1 */') == 1\n    assert '.pt-discovery-card' in css\n    for rel in EXPECTED:\n        text = (ROOT / rel).read_text(encoding="utf-8")\n        assert 'platform-core.css?v=1.2.0' in text\n''', encoding='utf-8')

          print({'hubs': len(hubs), 'cards': sum(len(x['cards']) for x in hubs.values())})
          PY
          python /tmp/apply_discovery.py
          python -m pytest -q tests/test_user_discoverability_cards_v1.py

      - name: Commit repair robustly
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          files=(
            assets/platform/platform-core.css
            sections/index.html
            learning-paths/index.html
            provider-assessment-demo/index.html
            special-needs/index.html
            special-needs/assistive-technology/index.html
            tests/test_user_discoverability_cards_v1.py
          )
          git add "${files[@]}"
          if ! git diff --cached --quiet; then
            git commit -m 'fix(navigation): expose hidden pages with section cards'
          fi
          pushed=0
          for attempt in $(seq 1 10); do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              git reset --hard origin/main
              python /tmp/apply_discovery.py
              python -m pytest -q tests/test_user_discoverability_cards_v1.py
              git add "${files[@]}"
              git commit -m 'fix(navigation): expose hidden pages with section cards'
            fi
            if git push origin HEAD:main; then pushed=1; break; fi
            sleep $((attempt * 3))
          done
          test "$pushed" = 1

      - name: Discover latest validated production artifact
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsS \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=validated-production-site&per_page=100" \
            -o /tmp/artifacts.json
          python - <<'PY'
          import json, os
          items=[x for x in json.load(open('/tmp/artifacts.json',encoding='utf-8')).get('artifacts',[]) if not x.get('expired') and x.get('workflow_run',{}).get('id')]
          if not items: raise SystemExit('No active validated-production-site artifact found')
          item=sorted(items,key=lambda x:x.get('created_at',''),reverse=True)[0]
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out:
            out.write(f"run_id={item['workflow_run']['id']}\n")
          print({'run_id':item['workflow_run']['id'],'created_at':item.get('created_at')})
          PY

      - name: Download validated production artifact
        uses: actions/download-artifact@v4
        with:
          name: validated-production-site
          path: _site
          repository: khaledaltheeb/healthrenewal.org
          run-id: ${{ steps.artifact.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Overlay current public source
        run: |
          set -euo pipefail
          python - <<'PY'
          import shutil
          from pathlib import Path
          root=Path('.')
          site=Path('_site')
          assert (site/'index.html').is_file()
          text_suffixes={'.html','.htm','.xml','.json','.webmanifest','.txt','.js','.mjs','.css','.svg'}
          skip_top={'.git','.github','node_modules','.venv','venv','dist','build','scripts','tests','docs','reports','content','.v10bundle','.generator-v6','_site'}
          skip_parts={'account-backend','backend','migrations'}
          copied=0
          for source in root.rglob('*'):
            if not source.is_file(): continue
            rel=source.relative_to(root)
            if not rel.parts or rel.parts[0] in skip_top or any(x in skip_parts for x in rel.parts): continue
            if rel.as_posix() == 'deployment.json': continue
            if source.suffix.lower() not in text_suffixes and source.name != 'CNAME': continue
            dest=site/rel
            dest.parent.mkdir(parents=True,exist_ok=True)
            shutil.copy2(source,dest)
            copied += 1
          assert copied >= 100, copied
          for rel in [
            'sections/index.html','learning-paths/index.html','provider-assessment-demo/index.html',
            'special-needs/index.html','special-needs/assistive-technology/index.html'
          ]:
            text=(site/rel).read_text(encoding='utf-8')
            assert 'data-pt-discoverability-cards="v1"' in text, rel
          print({'copied':copied})
          PY
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Install rendered audit dependencies
        run: |
          python -m pip install --quiet selenium==4.27.1
          chromedriver --version

      - name: Verify live cards and full rendered discoverability
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, time
          from collections import Counter, defaultdict, deque
          from urllib.parse import urlsplit
          from urllib.request import Request, urlopen
          from xml.etree import ElementTree as ET
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.support.ui import WebDriverWait

          BASE='https://healthrenewal.org'
          expected={
            '/sections/': ['/family-guide/','/ai-search/','/contact/','/source-registry/','/team-and-partners/','/accessibility/'],
            '/learning-paths/': ['/learning-paths/opportunities/'],
            '/provider-assessment-demo/': ['/provider-assessment-demo/training/','/provider-assessment-demo/professional-console.html'],
            '/special-needs/': ['/special-needs/assistive-technology/','/special-needs/conditions/prader-willi-syndrome/'],
            '/special-needs/assistive-technology/': [
              '/special-needs/assistive-technology/selection-checklist/',
              '/special-needs/assistive-technology/training/',
              '/special-needs/assistive-technology/ethics-and-service/',
              '/special-needs/assistive-technology/innovation-review/',
              '/special-needs/assistive-technology/continuing-education/'
            ]
          }
          options=Options()
          options.add_argument('--headless=new')
          options.add_argument('--no-sandbox')
          options.add_argument('--disable-dev-shm-usage')
          options.add_argument('--window-size=1440,1600')
          options.add_argument('--lang=ar')
          driver=webdriver.Chrome(options=options)
          driver.set_page_load_timeout(30)

          passed=False
          for attempt in range(1,121):
            try:
              ok=True
              for hub,targets in expected.items():
                driver.get(BASE+hub+f'?discoverability_release={attempt}-{time.time_ns()}')
                WebDriverWait(driver,10).until(lambda d:d.execute_script('return document.readyState')=='complete')
                cards=driver.execute_script('''
                  return Array.from(document.querySelectorAll('[data-pt-discoverability-cards="v1"] .pt-discovery-card a[href]')).map(a=>({href:new URL(a.href).pathname,visible:(()=>{const r=a.getBoundingClientRect(),s=getComputedStyle(a);return r.width>0&&r.height>0&&s.display!=="none"&&s.visibility!=="hidden"})()}));
                ''') or []
                visible={x['href'] for x in cards if x['visible']}
                if not set(targets).issubset(visible):
                  ok=False; break
              if ok: passed=True; break
            except Exception:
              pass
            time.sleep(5)
          assert passed, 'new cards did not become live'

          req=Request(BASE+'/sitemap.xml?discoverability_full=1',headers={'Cache-Control':'no-cache','User-Agent':'HealthRenewalDiscoverabilityRelease/1.0'})
          with urlopen(req,timeout=30) as response: root=ET.fromstring(response.read())
          routes=sorted({urlsplit(n.text.strip()).path or '/' for n in root.iter() if n.tag.split('}',1)[-1]=='loc' and n.text and urlsplit(n.text.strip()).netloc=='healthrenewal.org'})
          aliases={}
          for route in routes:
            aliases[route]=route
            if route!='/' and route.endswith('/'):
              aliases[route.rstrip('/')]=route
              aliases[route+'index.html']=route
          def normalize(href):
            p=urlsplit(href)
            if p.netloc not in {'healthrenewal.org','www.healthrenewal.org'}: return None
            path=re.sub(r'/+','/',p.path or '/')
            if path.endswith('/index.html'): path=path[:-10]
            for c in (path,path.rstrip('/'),path.rstrip('/')+'/'):
              if c in aliases:return aliases[c]
            return None
          edges=defaultdict(set); card_edges=defaultdict(set); errors=[]
          js='''
            const visible=el=>{if(!el||el.closest('[hidden],[aria-hidden="true"]'))return false;const s=getComputedStyle(el),r=el.getBoundingClientRect();return s.display!=="none"&&s.visibility!=="hidden"&&Number(s.opacity||1)!==0&&r.width>0&&r.height>0};
            return Array.from(document.querySelectorAll('a[href]')).filter(visible).map(a=>({href:a.href,card:Boolean(a.closest('article,li,.card,[class*="card"],[class*="tile"],[class*="feature"],[class*="resource"],[class*="condition"],[class*="guide"]'))}));
          '''
          for route in routes:
            try:
              driver.get(BASE+route+'?final_discoverability=1')
              WebDriverWait(driver,10).until(lambda d:d.execute_script('return document.readyState')=='complete')
              time.sleep(.25)
              for item in driver.execute_script(js) or []:
                target=normalize(item['href'])
                if target and target!=route:
                  edges[route].add(target)
                  if item['card']:card_edges[route].add(target)
            except Exception as exc:
              errors.append((route,str(exc)[:160]))
          driver.quit()

          inbound=Counter(); card_inbound=Counter()
          for source,targets in edges.items():
            for target in targets: inbound[target]+=1
          for source,targets in card_edges.items():
            for target in targets: card_inbound[target]+=1
          roots=[x for x in ('/','/sections/','/start-here/') if x in routes]
          reachable=set(roots); queue=deque(roots)
          while queue:
            source=queue.popleft()
            for target in edges.get(source,()):
              if target not in reachable: reachable.add(target); queue.append(target)
          orphans=[r for r in routes if r!='/' and inbound[r]==0]
          unreachable=[r for r in routes if r not in reachable]
          no_card=[r for r in routes if r!='/' and card_inbound[r]==0]
          assert not errors, errors[:5]
          assert not orphans, orphans
          assert not unreachable, unreachable
          assert not no_card, no_card
          print({'sitemap_pages':len(routes),'orphans':0,'unreachable':0,'without_card':0,'render_errors':0})
          PY

      - name: Report result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python - <<'PY' >/tmp/body.json
          import json, os
          passed=os.environ.get('JOB_STATUS')=='success'
          body='## إصلاح ظهور الصفحات والبطاقات\n\n'
          body += f"الحالة: **{'passed' if passed else 'failed'}**\n\n"
          if passed:
            body += '- بطاقات تعريفية ثابتة مضافة: **16**\n'
            body += '- فهارس محدثة: **5**\n'
            body += '- صفحات يتيمة بعد النشر: **0**\n'
            body += '- صفحات غير قابلة للوصول من واجهات البداية: **0**\n'
            body += '- صفحات بلا أي بطاقة مرئية: **0**\n'
            body += '- أخطاء العرض: **0**\n'
            body += '- التحقق: **متصفح فعلي بعد تنفيذ JavaScript**\n'
          else:
            body += '- لم يكتمل أحد اختبارات الإصلاح أو النشر الحي.\n'
          print(json.dumps({'body':body},ensure_ascii=False))
          PY
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            --data-binary @/tmp/body.json
