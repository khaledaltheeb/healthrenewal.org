name: Finalize publication cleanup v324 once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/finalize-publication-cleanup-v324.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Serialize v31 and remove temporary release machinery
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          workflow = Path('.github/workflows/validate-all-labs-v22.yml')
          text = workflow.read_text(encoding='utf-8')
          marker = 'concurrency:\n  group: validate-all-labs-v31-main\n  cancel-in-progress: true\n'
          if marker not in text:
              anchor = 'env:\n  SITE_BASE: https://healthrenewal.org/\n\njobs:\n'
              replacement = (
                  'env:\n'
                  '  SITE_BASE: https://healthrenewal.org/\n\n'
                  + marker
                  + '\njobs:\n'
              )
              if anchor not in text:
                  raise SystemExit('v31 workflow insertion anchor is missing')
              workflow.write_text(text.replace(anchor, replacement, 1), encoding='utf-8')

          temporary_paths = (
              '.github/workflows/patch-v31-concurrency-once.yml',
              '.github/workflows/patch-v31-concurrency-direct.yml',
              '.github/workflows/one-shot-validated-pages-v323.yml',
              '.github/workflows/dispatch-one-shot-v323-on-issue.yml',
              '.github/workflows/deploy-observable-pages-v324.yml',
              '.github/workflows/finalize-publication-cleanup-v324.yml',
              'release-v323-issue-trigger.txt',
              'production-rebuild-trigger-v322.json',
              'production-rebuild-trigger-v322.md',
              'production-rebuild-trigger-v322.txt',
              'production-rebuild-trigger-v322.lock',
              'production-rebuild-trigger-v322.ready',
              'production-rebuild-trigger-v322.final',
              'production-rebuild-trigger-v322.complete',
              'production-rebuild-trigger-v322.go',
              'production-rebuild-trigger-v322.merge',
              'production-rebuild-trigger-v322.pr',
              'production-rebuild-trigger-v322.open',
          )
          removed = []
          for relative in temporary_paths:
              path = Path(relative)
              if path.exists():
                  path.unlink()
                  removed.append(relative)

          trigger = Path('deployment.json')
          if trigger.is_file():
              try:
                  payload = json.loads(trigger.read_text(encoding='utf-8'))
              except Exception:
                  payload = {}
              if payload.get('status') == 'publication-surface-ready':
                  trigger.unlink()
                  removed.append('deployment.json')

          receipt = Path('pages-deployment-status.json')
          if not receipt.is_file():
              raise SystemExit('successful Pages deployment receipt is missing')
          status = json.loads(receipt.read_text(encoding='utf-8'))
          expected = {
              'schema_version': 324,
              'status': 'deployed',
              'deployment_outcome': 'success',
              'live_routes_verified': 6,
          }
          for key, value in expected.items():
              if status.get(key) != value:
                  raise SystemExit({'invalid_deployment_receipt': {'key': key, 'expected': value, 'actual': status.get(key)}})

          print({'v31_concurrency': 'enabled', 'removed': removed, 'deployment_receipt': status})
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Repository already clean"
            exit 0
          fi
          git commit -m "ci: finalize publication cleanup v324 [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
