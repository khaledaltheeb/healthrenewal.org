name: Validate special-needs guide compatibility v217

on:
  pull_request:
    branches: [main]
    paths:
      - "content/v209/special-needs-guides/**"
      - "content/v209/special-needs-guides-manifest-ar.json"
      - "content/v210/special-needs-guides/**"
      - "content/v210/special-needs-guides-manifest-ar.json"
      - "content/v211/special-needs-guides/**"
      - "content/v211/special-needs-guides-manifest-ar.json"
      - "content/v212/special-needs-guides/**"
      - "content/v212/special-needs-guides-manifest-ar.json"
      - "content/v214/**"
      - "content/v221/special-needs-guides-production-manifest-ar.json"
      - "scripts/publish_special_needs_guides_v209.py"
      - "scripts/publish_special_needs_guides_v209_compat.py"
      - "scripts/publish_special_needs_guides_v210.py"
      - "scripts/publish_special_needs_guides_v211.py"
      - "scripts/publish_special_needs_guides_v212.py"
      - "scripts/publish_special_needs_guides_v214.py"
      - "scripts/publish_special_needs_guides_v217.py"
      - "scripts/publish_special_needs_guides_v217_core.py"
      - "scripts/integrate_special_needs_guides_v217.py"
      - ".github/workflows/integrate-special-needs-guides-v217.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: special-needs-guides-compat-v217-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile legacy core fifth batch wrapper and verifier
        run: |
          set -euxo pipefail
          python -m py_compile \
            scripts/publish_special_needs_guides_v209.py \
            scripts/publish_special_needs_guides_v209_compat.py \
            scripts/publish_special_needs_guides_v210.py \
            scripts/publish_special_needs_guides_v211.py \
            scripts/publish_special_needs_guides_v212.py \
            scripts/publish_special_needs_guides_v214.py \
            scripts/publish_special_needs_guides_v217_core.py \
            scripts/publish_special_needs_guides_v217.py \
            scripts/integrate_special_needs_guides_v217.py
      - name: Smoke-test legacy 20-guide core and 25-guide production wrapper
        run: |
          set -euxo pipefail
          SITE="$(mktemp -d)"
          mkdir -p "$SITE/special-needs" "$SITE/api"
          cat > "$SITE/special-needs/index.html" <<'HTML'
          <!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>مركز ذوي الاحتياجات الخاصة</title></head><body><main><section><h2>مصادر الوحدة الحالية</h2></section></main></body></html>
          HTML
          cat > "$SITE/sitemap-special-needs.xml" <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9"></urlset>
          XML
          cat > "$SITE/sitemap.xml" <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <sitemapindex xmlns="http://www.sitemaps.org/schemas/sitemap/0.9"></sitemapindex>
          XML
          python scripts/publish_special_needs_guides_v217_core.py "$SITE"
          REPORT="$SITE/api/special-needs-guides-v217.json" python - <<'PY'
          import json,os
          from pathlib import Path
          report=json.loads(Path(os.environ['REPORT']).read_text(encoding='utf-8'))
          assert report['guide_count']==20 and report['batch_count']==4,report
          assert report['batches']==[209,210,211,212],report
          print({'legacy_core':'20/20','batches':'4/4'})
          PY
          python scripts/publish_special_needs_guides_v217.py "$SITE"
          REPORT="$SITE/api/special-needs-guides-v221.json" python - <<'PY'
          import json,os
          from pathlib import Path
          report=json.loads(Path(os.environ['REPORT']).read_text(encoding='utf-8'))
          assert report['guide_count']==25 and report['batch_count']==5,report
          assert report['batches']==[209,210,211,212,214],report
          assert report['legacy_contract']==217,report
          assert report['production_source_file_count']==25,report
          assert report['hub_linked_guides']==25,report
          assert report['external_review_completed'] is False,report
          print({'production':'25/25','batches':'5/5','legacy_contract':217})
          PY
      - name: Verify durable production integration without self-modifying CI
        run: python scripts/integrate_special_needs_guides_v217.py
