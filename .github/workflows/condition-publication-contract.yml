name: Condition publication contract

on:
  pull_request:
    paths:
      - 'special-needs/conditions/**'
      - 'sitemap-special-needs.xml'
      - 'scripts/audit-condition-publication-contract.mjs'
      - '.github/workflows/condition-publication-contract.yml'
  push:
    branches: [main]
    paths:
      - 'special-needs/conditions/**'
      - 'sitemap-special-needs.xml'
      - 'scripts/audit-condition-publication-contract.mjs'
      - '.github/workflows/condition-publication-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: condition-publication-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit condition publication state
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enforce publication contract
        run: node scripts/audit-condition-publication-contract.mjs
