name: Deploy pediatric oncology validated overlay hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-pediatric-oncology-hotfix.yml'
      - 'pediatric-oncology-hotfix.trigger'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: github-pages-production
  cancel-in-progress: true

jobs:
  deploy-hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          path: repo
          fetch-depth: 1

      - name: Bind overlay to current main head
        id: source
        working-directory: repo
        run: |
          set -euo pipefail
          echo "build_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Locate latest validated main baseline
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=validated-production-site&per_page=100" \
            -o /tmp/artifacts.json
          python - <<'PY'
          import json, os
          data = json.load(open('/tmp/artifacts.json', encoding='utf-8'))
          candidates = [
              a for a in data.get('artifacts', [])
              if not a.get('expired')
              and a.get('workflow_run', {}).get('head_branch') == 'main'
              and a.get('workflow_run', {}).get('id')
          ]
          if not candidates:
              raise SystemExit('No non-expired validated-production-site artifact from main')
          item = max(candidates, key=lambda a: a.get('created_at', ''))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f"run_id={item['workflow_run']['id']}\n")
              out.write(f"artifact_id={item['id']}\n")
          print({'runId': item['workflow_run']['id'], 'artifactId': item['id'], 'createdAt': item.get('created_at')})
          PY

      - name: Download validated main baseline
        uses: actions/download-artifact@v4
        with:
          name: validated-production-site
          path: _site
          repository: khaledaltheeb/healthrenewal.org
          run-id: ${{ steps.baseline.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Overlay only governed pediatric oncology materialization
        run: |
          set -euo pipefail
          test -f _site/index.html
          test -f repo/api/pediatric-oncology-materialization-v1.json
          test -d repo/magazine/pediatric-oncology
          rm -rf _site/magazine/pediatric-oncology
          mkdir -p _site/magazine _site/api
          cp -a repo/magazine/pediatric-oncology _site/magazine/
          cp repo/api/pediatric-oncology-materialization-v1.json _site/api/pediatric-oncology-materialization-v1.json
          python repo/scripts/publish_complete_sitemap_v360.py _site --minimum-urls 3000

      - name: Validate six release-token routes before Pages upload
        env:
          BUILD_SHA: ${{ steps.source.outputs.build_sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path('_site/api/pediatric-oncology-materialization-v1.json').read_text(encoding='utf-8'))
          assert report['status'] == 'passed', report
          assert report['records'] == 6, report
          assert report['studies'] == 5 and report['theses'] == 1, report
          sitemap = Path('_site/sitemap.xml').read_text(encoding='utf-8')
          for route in report['routes']:
              page = Path('_site') / route.lstrip('/') / 'index.html'
              assert page.is_file(), page
              text = page.read_text(encoding='utf-8')
              slug = page.parent.name
              token = report['release_tokens'][slug]
              absolute = 'https://healthrenewal.org' + route
              assert f'name="rawafid-release-token" content="{token}"' in text, page
              assert f'rel="canonical" href="{absolute}"' in text, page
              assert 'name="robots" content="index,follow' in text, page
              assert absolute in sitemap, route
              assert text.count('<h1>') == 1, page
          Path('_site/deployment.json').write_text(json.dumps({
              'schemaVersion': 13,
              'release_commit': os.environ['BUILD_SHA'],
              'build_mode': 'pediatric-oncology-hotfix-v2-overlay-latest-validated-main-baseline'
          }, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          Path('_site/.nojekyll').touch()
          print({'status':'passed','records':report['records'],'releaseCommit':os.environ['BUILD_SHA']})
          PY

      - uses: actions/configure-pages@v5

      - name: Upload hotfix Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy hotfix Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify all six routes live before completion
        env:
          EXPECTED_SHA: ${{ steps.source.outputs.build_sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('repo/api/pediatric-oncology-materialization-v1.json').read_text(encoding='utf-8'))
          Path('/tmp/routes.json').write_text(json.dumps(report, ensure_ascii=False), encoding='utf-8')
          PY
          for attempt in $(seq 1 50); do
            nonce="${GITHUB_RUN_ID}-${attempt}-$(date +%s)"
            if curl -fsSL -H 'Cache-Control: no-cache' "https://healthrenewal.org/deployment.json?release=${nonce}" -o /tmp/deployment.json \
              && python - "$EXPECTED_SHA" <<'PY'
          import json, sys
          d=json.load(open('/tmp/deployment.json', encoding='utf-8'))
          raise SystemExit(0 if d.get('release_commit') == sys.argv[1] else 1)
          PY
            then
              if python - "$nonce" <<'PY'
          import json, sys, urllib.request
          report=json.load(open('/tmp/routes.json', encoding='utf-8'))
          nonce=sys.argv[1]
          with urllib.request.urlopen(f'https://healthrenewal.org/sitemap.xml?release={nonce}', timeout=20) as r:
              sitemap=r.read().decode('utf-8')
          for route in report['routes']:
              slug=route.rstrip('/').split('/')[-1]
              token=report['release_tokens'][slug]
              req=urllib.request.Request('https://healthrenewal.org'+route+f'?release={nonce}', headers={'Cache-Control':'no-cache'})
              with urllib.request.urlopen(req, timeout=20) as r:
                  if r.status != 200: raise SystemExit(1)
                  text=r.read().decode('utf-8')
              absolute='https://healthrenewal.org'+route
              if token not in text or f'rel="canonical" href="{absolute}"' not in text or 'name="robots" content="index,follow' not in text or absolute not in sitemap:
                  raise SystemExit(1)
          print({'status':'live-verified','records':report['records']})
          PY
              then exit 0; fi
            fi
            sleep 12
          done
          echo 'Hotfix release did not become exactly verifiable in time' >&2
          exit 1

      - name: Report hotfix outcome
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          STATUS: ${{ job.status }}
          BUILD_SHA: ${{ steps.source.outputs.build_sha }}
        run: |
          gh issue comment 1227 --repo "$GH_REPO" --body "pediatric-oncology-hotfix: ${STATUS}; run=${GITHUB_RUN_ID}; sha=${BUILD_SHA:-unknown}"
