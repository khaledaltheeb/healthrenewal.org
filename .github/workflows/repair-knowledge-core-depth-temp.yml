name: Deepen knowledge-core candidates

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-knowledge-core-depth-temp.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Add topic-specific decision depth without lowering quality floor
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/publish_special_needs_knowledge_core_v1.py')
          text = path.read_text(encoding='utf-8')

          old1 = '''    evidence = f"بُنيت التوصيات على مصادر مؤسسية أصلية مرتبطة مباشرة بالموضوع. وجود مرجع لا يعني أن كل تفصيل ينطبق على كل طالب؛ تُفسر المعلومات في ضوء اللغة والعمر والبيئة والبيانات الفردية. {refs}"\n'''
          new1 = '''    evidence = f"بُنيت التوصيات على مصادر مؤسسية أصلية مرتبطة مباشرة بالموضوع. وجود مرجع لا يعني أن كل تفصيل ينطبق على كل طالب؛ تُفسر المعلومات في ضوء اللغة والعمر والبيئة والبيانات الفردية. {refs}"\n    decision_depth = (\n        f"قبل اعتماد أي قرار في محور {topic['axis']}، حوّل سؤال الصفحة «{topic['title']}» إلى فرضية قابلة للفحص لدى {topic['audience']}. "\n        f"ابدأ بما تقوله البيانات الحالية تحديدًا: {topic['points'][0]} ثم اختبر ما إذا كان النمط ثابتًا عبر موقف أو شخص أو مهمة أخرى، لأن اختلاف السياق قد يغيّر تفسير النتيجة. "\n        f"بعد ذلك قارن أكثر من تفسير معقول بدل القفز إلى تسمية واحدة، وحدد ما الدليل الذي سيجعل الفريق يغيّر رأيه. "\n        f"اجعل الخطوة التالية صغيرة وقابلة للقياس؛ من الخطوات العملية هنا: {topic['steps'][0]} وسجّل نقطة البداية، نوع المساعدة، ومؤشر النتيجة قبل التنفيذ. "\n        f"عند المراجعة، اسأل هل تحسن الوصول أو التعلم أو التواصل أو الاستقلال فعلًا، وهل ظهر الأثر في البيئة التي تهم الطالب. "\n        f"إذا لم يظهر أثر كافٍ، لا تُفسر ذلك تلقائيًا بوصفه نقصًا لدى الطالب؛ افحص وضوح التعليم، ملاءمة الأداة، اللغة، الحواجز الحسية والبيئية، جرعة الدعم وفرصة الممارسة. "\n        f"هذا التسلسل يحافظ على الفرق بين المعلومة العامة والقرار الفردي، ويجعل التوثيق قابلًا للمراجعة مع الأسرة والفريق بدل الاعتماد على الانطباع أو على نتيجة منفردة."\n    )\n'''
          if old1 not in text:
              raise SystemExit('evidence anchor not found')
          text = text.replace(old1, new1, 1)

          old2 = '''<section class="card" id="steps"><h2>خطوات عملية قابلة للتنفيذ والمتابعة</h2><ol>{steps}</ol><p>قبل تعديل الخطة مرة أخرى، حدد ما الذي ستقيسه ومتى ستراجعه. القرار المهني الجيد يجب أن يترك أثرًا يمكن ملاحظته: تحسن في الوصول أو التعلم أو الاستقلال أو المشاركة أو جودة التواصل، وليس مجرد شعور بأن الأمور أفضل.</p></section>'''
          new2 = '''<section class="card" id="steps"><h2>خطوات عملية قابلة للتنفيذ والمتابعة</h2><ol>{steps}</ol><p>قبل تعديل الخطة مرة أخرى، حدد ما الذي ستقيسه ومتى ستراجعه. القرار المهني الجيد يجب أن يترك أثرًا يمكن ملاحظته: تحسن في الوصول أو التعلم أو الاستقلال أو المشاركة أو جودة التواصل، وليس مجرد شعور بأن الأمور أفضل.</p></section><section class="card" id="decision-test"><h2>اختبار القرار قبل اعتماده</h2><p>{esc(decision_depth)}</p></section>'''
          if old2 not in text:
              raise SystemExit('steps section anchor not found')
          text = text.replace(old2, new2, 1)

          old3 = '''<a href="#steps">خطوات عملية</a><a href="#mistakes">'''
          new3 = '''<a href="#steps">خطوات عملية</a><a href="#decision-test">اختبار القرار</a><a href="#mistakes">'''
          if old3 not in text:
              raise SystemExit('toc anchor not found')
          text = text.replace(old3, new3, 1)

          path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile scripts/publish_special_needs_knowledge_core_v1.py
      - name: Commit repair and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/repair-knowledge-core-depth-temp.yml
          git add scripts/publish_special_needs_knowledge_core_v1.py .github/workflows/repair-knowledge-core-depth-temp.yml
          git commit -m 'content: deepen knowledge-core decision guidance'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main --depth=1
            git rebase origin/main
          done
          exit 1

