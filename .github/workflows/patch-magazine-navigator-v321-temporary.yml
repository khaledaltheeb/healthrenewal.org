name: Patch magazine Navigator ACT v321 temporary

on:
  push:
    branches: ["agent/magazine-navigator-act-v321-current"]
    paths:
      - ".github/workflows/patch-magazine-navigator-v321-temporary.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/magazine-navigator-act-v321-current
          fetch-depth: 0
      - name: Update counts tests and live contract
        run: |
          python - <<'PY'
          from pathlib import Path

          def patch(path_name, replacements, insertions=()):
              path = Path(path_name)
              text = path.read_text(encoding='utf-8')
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f'missing anchor in {path_name}: {old}')
                  text = text.replace(old, new)
              for anchor, block in insertions:
                  if block not in text:
                      if anchor not in text:
                          raise SystemExit(f'missing insertion anchor in {path_name}: {anchor}')
                      text = text.replace(anchor, block + anchor, 1)
              path.write_text(text, encoding='utf-8')

          patch('tests/test_magazine_research_v234.py', [
              ('self.assertEqual(len(pages), 72)', 'self.assertEqual(len(pages), 73)'),
              ('self.assertEqual(report["research_summaries_published"], 72)', 'self.assertEqual(report["research_summaries_published"], 73)'),
              ('self.assertEqual(report["remaining_to_target"], 28)', 'self.assertEqual(report["remaining_to_target"], 27)'),
              ('self.assertEqual(len(report["articles"]), 72)', 'self.assertEqual(len(report["articles"]), 73)'),
              ('self.assertEqual(report["sitemap"]["child_urls"], 73)', 'self.assertEqual(report["sitemap"]["child_urls"], 74)'),
              ('self.assertEqual(len(urls), 73)', 'self.assertEqual(len(urls), 74)'),
              ('self.assertEqual(saved["research_summaries_published"], 72)', 'self.assertEqual(saved["research_summaries_published"], 73)'),
              ('self.assertIn(\'"numberOfItems":72\', index)', 'self.assertIn(\'"numberOfItems":73\', index)'),
              ('self.assertIn("72 قراءة علمية مستقلة", index)', 'self.assertIn("73 قراءة علمية مستقلة", index)'),
              ('self.assertIn("المتبقي 28", index)', 'self.assertIn("المتبقي 27", index)'),
              ('self.assertEqual(index.count(\'class="card"\'), 72)', 'self.assertEqual(index.count(\'class="card"\'), 73)'),
              ('self.assertEqual(index.count(\'"@type":"ScholarlyArticle"\'), 72)', 'self.assertEqual(index.count(\'"@type":"ScholarlyArticle"\'), 73)'),
              ('self.assertEqual(index.count(\'"datePublished"\'), 72)', 'self.assertEqual(index.count(\'"datePublished"\'), 73)'),
          ], [
              ('        }\n        for filename, markers in checks.items():', '            "neurodevelopmental-disabilities-navigator-act-parent-stress-rct-2026.html": ("10.1002/aur.70282", "42187205", "d=0.84", "d=0.38", "لم تظهر فروق مهمة"),\n')
          ])

          patch('tests/test_platform_identity_v201.py', [
              ('self.assertIn(\'"numberOfItems":72\', index)', 'self.assertIn(\'"numberOfItems":73\', index)'),
              ('self.assertEqual(index.count(\'class="card"\'), 72)', 'self.assertEqual(index.count(\'class="card"\'), 73)'),
              ('self.assertEqual(report["pages"], 78)', 'self.assertEqual(report["pages"], 79)'),
              ('self.assertEqual(report["magazine_pages"], 72)', 'self.assertEqual(report["magazine_pages"], 73)'),
              ('self.assertEqual(magazine["research_summaries_published"], 72)', 'self.assertEqual(magazine["research_summaries_published"], 73)'),
              ('self.assertEqual(magazine["remaining_to_target"], 28)', 'self.assertEqual(magazine["remaining_to_target"], 27)'),
              ('self.assertEqual(magazine["sitemap"]["child_urls"], 73)', 'self.assertEqual(magazine["sitemap"]["child_urls"], 74)'),
              ('self.assertEqual(magazine_report["research_summaries_published"], 72)', 'self.assertEqual(magazine_report["research_summaries_published"], 73)'),
              ('self.assertEqual(magazine_report["sitemap"]["child_urls"], 73)', 'self.assertEqual(magazine_report["sitemap"]["child_urls"], 74)'),
          ], [
              ('            "magazine/feed.xml",\n', '            "magazine/neurodevelopmental-disabilities-navigator-act-parent-stress-rct-2026.html",\n')
          ])

          workflow = Path('.github/workflows/validate-magazine-research-v234.yml')
          text = workflow.read_text(encoding='utf-8')
          text = text.replace('Validate magazine continuous research v320', 'Validate magazine continuous research v321')
          text = text.replace('magazine_v320_inventory', 'magazine_v321_inventory')
          for old, new in [
              ('assert len(pages) == 72', 'assert len(pages) == 73'),
              ('assert index.count(\'class="card"\') == 72', 'assert index.count(\'class="card"\') == 73'),
              ('assert index.count(\'"@type":"ScholarlyArticle"\') == 72', 'assert index.count(\'"@type":"ScholarlyArticle"\') == 73'),
              ('assert index.count(\'"datePublished"\') == 72', 'assert index.count(\'"datePublished"\') == 73'),
              ('assert \'"numberOfItems":72\' in index', 'assert \'"numberOfItems":73\' in index'),
              ("assert 'المتبقي 28' in index", "assert 'المتبقي 27' in index"),
              ("'generated_cards': 72", "'generated_cards': 73"),
              ("'remaining': 28", "'remaining': 27"),
              ('test "$(find magazine -maxdepth 1 -name \'*-2026.html\' | wc -l)" -eq 63', 'test "$(find magazine -maxdepth 1 -name \'*-2026.html\' | wc -l)" -eq 64'),
              ('test "$(find magazine -maxdepth 1 -name \'*-20*.html\' | wc -l)" -eq 72', 'test "$(find magazine -maxdepth 1 -name \'*-20*.html\' | wc -l)" -eq 73'),
          ]:
              if old not in text:
                  raise SystemExit(f'missing magazine workflow anchor: {old}')
              text = text.replace(old, new)
          anchor = "          grep -q 'TARGET_ARTICLES = 100' scripts/publish_magazine_v201.py\n"
          block = """          grep -q '10.1002/aur.70282' magazine/neurodevelopmental-disabilities-navigator-act-parent-stress-rct-2026.html
          grep -q '42187205' magazine/neurodevelopmental-disabilities-navigator-act-parent-stress-rct-2026.html
          grep -q 'PMC13377316' magazine/neurodevelopmental-disabilities-navigator-act-parent-stress-rct-2026.html
          grep -q 'd=0.84' magazine/neurodevelopmental-disabilities-navigator-act-parent-stress-rct-2026.html
          grep -q 'd=0.38' magazine/neurodevelopmental-disabilities-navigator-act-parent-stress-rct-2026.html
          grep -q 'لم تظهر فروق مهمة' magazine/neurodevelopmental-disabilities-navigator-act-parent-stress-rct-2026.html
          grep -q 'لا تثبت أن ACT يعالج اكتئاب الوالدين' magazine/neurodevelopmental-disabilities-navigator-act-parent-stress-rct-2026.html
          grep -q 'data-pt-normalized="1.1.0"' magazine/neurodevelopmental-disabilities-navigator-act-parent-stress-rct-2026.html
"""
          if block not in text:
              if anchor not in text:
                  raise SystemExit('missing workflow source-contract anchor')
              text = text.replace(anchor, block + anchor, 1)
          workflow.write_text(text, encoding='utf-8')

          live = Path('.github/workflows/verify-magazine-live-v314.yml')
          text = live.read_text(encoding='utf-8')
          text = text.replace('Verify magazine continuous publication live v320', 'Verify magazine continuous publication live v321')
          text = text.replace('magazine-live-v320', 'magazine-live-v321')
          text = text.replace('magazine-v320-', 'magazine-v321-')
          text = text.replace("assert api['research_summaries_published'] >= 72", "assert api['research_summaries_published'] >= 73")
          text = text.replace("'status': 'live-magazine-v320-verified'", "'status': 'live-magazine-v321-verified'")
          page_anchor = '            autism-aspen-low-resource-parent-intervention-rct-2026.html\n'
          if 'neurodevelopmental-disabilities-navigator-act-parent-stress-rct-2026.html' not in text:
              if page_anchor not in text:
                  raise SystemExit('missing live page anchor')
              text = text.replace(page_anchor, '            autism-aspen-low-resource-parent-intervention-rct-2026.html \\\n            neurodevelopmental-disabilities-navigator-act-parent-stress-rct-2026.html\n', 1)
          check_anchor = "              'autism-aspen-low-resource-parent-intervention-rct-2026.html': ('10.3389/fpsyt.2026.1795918', '42404716', '50%', 'p=0.026'),\n"
          check_block = "              'neurodevelopmental-disabilities-navigator-act-parent-stress-rct-2026.html': ('10.1002/aur.70282', '42187205', 'd=0.84', 'd=0.38', 'لم تظهر فروق مهمة'),\n"
          if check_block not in text:
              if check_anchor not in text:
                  raise SystemExit('missing live check anchor')
              text = text.replace(check_anchor, check_anchor + check_block, 1)
          live.write_text(text, encoding='utf-8')
          PY
          python -m py_compile scripts/publish_magazine_v201.py tests/test_magazine_research_v234.py tests/test_platform_identity_v201.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/test_magazine_research_v234.py tests/test_platform_identity_v201.py .github/workflows/validate-magazine-research-v234.yml .github/workflows/verify-magazine-live-v314.yml
          git diff --cached --quiet && exit 0
          git commit -m "test: raise magazine contract to 73 readings v321"
          git push origin HEAD:agent/magazine-navigator-act-v321-current
