name: Temporary push-triggered discoverability repair

on:
  push:
    branches: [main]
    paths:
      - '.github/discoverability-repair-trigger.txt'

permissions:
  contents: write

concurrency:
  group: discoverability-repair-push-v3
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply and validate static cards
        run: |
          set -euo pipefail
          python scripts/repair_discoverability_cards_v1.py
          python -m pytest -q tests/test_user_discoverability_cards_v1.py
      - name: Commit tested repair
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          files=(assets/platform/platform-core.css sections/index.html learning-paths/index.html provider-assessment-demo/index.html special-needs/index.html special-needs/assistive-technology/index.html tests/test_user_discoverability_cards_v1.py)
          git add "${files[@]}"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(navigation): expose hidden pages with section cards'
          for attempt in $(seq 1 8); do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            git reset --hard origin/main
            python scripts/repair_discoverability_cards_v1.py
            python -m pytest -q tests/test_user_discoverability_cards_v1.py
            git add "${files[@]}"
            git commit -m 'fix(navigation): expose hidden pages with section cards'
            sleep $((attempt * 2))
          done
          exit 1
