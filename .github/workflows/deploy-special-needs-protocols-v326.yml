name: Deploy special-needs protocols v326 to GitHub Pages

on:
  workflow_run:
    workflows: ["Publish special-needs protocols v326"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download v326 validated artifact
        uses: actions/download-artifact@v4
        with:
          name: validated-production-site
          path: validated-site
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify artifact, preserve academic library, and prevent rollback
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          import urllib.request
          from pathlib import Path

          root = Path('validated-site')
          report = json.loads((root / 'api/special-needs-protocols-v326.json').read_text(encoding='utf-8'))
          academic = json.loads((root / 'api/academic-library-v326.json').read_text(encoding='utf-8'))
          deployment = json.loads((root / 'deployment.json').read_text(encoding='utf-8'))
          candidate = deployment.get('commit')

          assert report.get('version') == 326 and report.get('status') == 'passed', report
          assert report.get('protocol_count') == 50 and report.get('generated_page_count') == 51, report
          assert report.get('minimum_words', 0) >= 1200 and report.get('minimum_citations', 0) >= 6, report
          assert report.get('external_clinical_review_completed') is False, report

          # A protocol release may extend the site, but it may never roll the
          # academic library back to the old 20/20/20 publication surface.
          assert academic.get('version') == 326 and academic.get('status') == 'passed', academic
          assert academic.get('sections') == {'branches': 25, 'therapies': 27, 'research': 28}, academic
          assert academic.get('total_entries') == 80 and academic.get('generated_pages') == 84, academic
          assert (root / 'library/index.html').is_file()
          assert (root / 'library/branches/clinical-psychology/index.html').is_file()
          assert (root / 'library/therapies/cognitive-behavioral-therapy/index.html').is_file()
          assert (root / 'library/research/randomized-controlled-trial/index.html').is_file()

          assert re.fullmatch(r'[0-9a-f]{40}', candidate or ''), deployment
          for name, evidence in deployment['artifacts'].items():
              path = root / name
              assert path.is_file() and hashlib.sha256(path.read_bytes()).hexdigest() == evidence['sha256'], name
              assert path.stat().st_size == evidence['bytes'], name
          assert (root / 'special-needs/protocols/index.html').is_file()
          for slug in report['protocol_slugs']:
              assert (root / 'special-needs/protocols' / slug / 'index.html').is_file(), slug

          token = os.environ['GH_TOKEN']
          repo = os.environ['GITHUB_REPOSITORY']
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'User-Agent': 'pages-v326',
          }
          def api(path):
              request = urllib.request.Request(f'https://api.github.com/repos/{repo}{path}', headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.loads(response.read().decode())

          current = api('/git/ref/heads/main')['object']['sha']
          status = 'identical' if candidate == current else api(f'/compare/{candidate}...{current}').get('status')
          assert status in {'ahead', 'identical'}, (candidate, current, status)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as stream:
              stream.write(f'CANDIDATE_SHA={candidate}\n')
          print({
              'candidate': candidate,
              'current_main': current,
              'relationship': status,
              'protocols': 50,
              'academic_entries_preserved': 80,
          })
          PY

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: validated-site

      - name: Deploy v326 site
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify all live protocol routes and academic-library preservation
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euxo pipefail
          BASE="${PAGE_URL%/}/"
          TOKEN="${CANDIDATE_SHA}"
          matched=0
          for i in $(seq 1 30); do
            if curl -fsS -H 'Cache-Control: no-cache' "${BASE}deployment.json?v=${TOKEN}-${i}" -o /tmp/deployment.json && \
               EXPECTED="${TOKEN}" python -c "import json,os;d=json.load(open('/tmp/deployment.json'));raise SystemExit(0 if d.get('commit')==os.environ['EXPECTED'] else 1)"; then
              matched=1
              break
            fi
            sleep 10
          done
          test "$matched" -eq 1
          curl -fsS -H 'Cache-Control: no-cache' "${BASE}api/special-needs-protocols-v326.json?v=${TOKEN}" -o /tmp/v326.json
          curl -fsS -H 'Cache-Control: no-cache' "${BASE}special-needs/protocols/?v=${TOKEN}" -o /tmp/protocol-index.html
          curl -fsS -H 'Cache-Control: no-cache' "${BASE}api/academic-library-v326.json?v=${TOKEN}" -o /tmp/academic.json
          curl -fsS -H 'Cache-Control: no-cache' "${BASE}library/?v=${TOKEN}" -o /tmp/library.html
          curl -fsS -H 'Cache-Control: no-cache' "${BASE}library/branches/clinical-psychology/?v=${TOKEN}" -o /tmp/library-sample.html
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          report = json.load(open('/tmp/v326.json', encoding='utf-8'))
          academic = json.load(open('/tmp/academic.json', encoding='utf-8'))
          assert report['version'] == 326 and report['protocol_count'] == 50, report
          assert Path('/tmp/protocol-index.html').read_text(encoding='utf-8').count('فتح البروتوكول الكامل') == 50
          assert academic['sections'] == {'branches': 25, 'therapies': 27, 'research': 28}, academic
          assert academic['total_entries'] == 80 and academic['generated_pages'] == 84, academic
          library = Path('/tmp/library.html').read_text(encoding='utf-8')
          sample = Path('/tmp/library-sample.html').read_text(encoding='utf-8')
          assert all(phrase in library for phrase in ('25 مدخلًا', '27 مدخلًا', '28 مدخلًا'))
          assert 'علم النفس السريري' in sample and 'Clinical Psychology' in sample

          base = os.environ['PAGE_URL'].rstrip('/') + '/'
          token = os.environ['CANDIDATE_SHA']
          for slug in report['protocol_slugs']:
              subprocess.run(
                  ['curl', '-fsS', '-H', 'Cache-Control: no-cache', f'{base}special-needs/protocols/{slug}/?v={token}'],
                  check=True,
                  stdout=subprocess.DEVNULL,
              )
          print({
              'live_commit': token,
              'live_protocols': len(report['protocol_slugs']),
              'academic_entries_preserved': academic['total_entries'],
              'status': 'published-v326-with-library-v326',
          })
          PY
