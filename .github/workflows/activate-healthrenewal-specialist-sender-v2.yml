name: Activate healthrenewal specialist sender v2

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/activate-healthrenewal-specialist-sender-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: specialist-identity-v10-production
  cancel-in-progress: false

env:
  ACCOUNT_API_BASE: https://pterminology-specialist-accounts.pterminology-826ac349.workers.dev
  CORE_API_BASE: https://pterminology-specialists.pterminology-826ac349.workers.dev
  DATABASE_NAME: pterminology-specialists
  IDENTITY_WORKER_NAME: pterminology-specialist-accounts
  OWNER_EMAIL: pterminology@gmail.com

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '826ac34927c1e045c06145a327c2ac52' }}
      ADMIN_API_KEY: ${{ secrets.SPECIALISTS_ADMIN_API_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Select verified Resend sender with one owner-only test
        id: sender
        shell: bash
        run: |
          set -euo pipefail
          required=(CLOUDFLARE_API_TOKEN ADMIN_API_KEY RESEND_API_KEY)
          for name in "${required[@]}"; do
            [[ -n "${!name:-}" ]] || { echo "::error::$name is required"; exit 1; }
          done
          python - <<'PY'
          import json, os, urllib.error, urllib.request
          from pathlib import Path
          candidates = [
              'PTerminology <no-reply@healthrenewal.org>',
              'PTerminology <no-reply@mail.healthrenewal.org>',
              'PTerminology <no-reply@send.healthrenewal.org>',
              'PTerminology <no-reply@email.healthrenewal.org>',
          ]
          key=os.environ['RESEND_API_KEY']
          owner=os.environ['OWNER_EMAIL']
          run=os.environ['GITHUB_RUN_ID']
          attempts=[]
          selected=None
          provider_id_present=False
          for index, sender in enumerate(candidates):
              payload={
                  'from': sender,
                  'to': [owner],
                  'subject': 'PTerminology production sender activation test',
                  'text': 'This single message confirms that the verified Resend sender domain is operational. No password was changed.',
              }
              request=urllib.request.Request(
                  'https://api.resend.com/emails',
                  data=json.dumps(payload).encode('utf-8'),
                  headers={
                      'Authorization': f'Bearer {key}',
                      'Content-Type': 'application/json',
                      'Idempotency-Key': f'pt-sender-activation-v2-{run}-{index}',
                      'User-Agent': 'pterminology-specialist-sender-activation/2.0',
                  },
                  method='POST',
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      status=response.status
                      body=json.loads(response.read().decode('utf-8') or '{}')
              except urllib.error.HTTPError as error:
                  status=error.code
                  raw=error.read().decode('utf-8','replace')
                  try: body=json.loads(raw or '{}')
                  except Exception: body={'message':raw[:500]}
              attempts.append({
                  'domain': sender.rsplit('@',1)[-1].rstrip('>'),
                  'http_status': status,
                  'accepted': 200 <= status < 300,
                  'error_name': body.get('name') if isinstance(body,dict) else None,
                  'error_message': body.get('message') if isinstance(body,dict) else None,
              })
              if 200 <= status < 300:
                  selected=sender
                  provider_id_present=bool(body.get('id')) if isinstance(body,dict) else False
                  break
          safe={
              'selected_sender':selected,
              'selected_domain':selected.rsplit('@',1)[-1].rstrip('>') if selected else None,
              'provider_id_present':provider_id_present,
              'attempts':attempts,
              'test_recipient':'owner',
              'messages_sent':1 if selected else 0,
              'contains_secret_values':False,
          }
          Path('/tmp/sender-selection-v2.json').write_text(json.dumps(safe),encoding='utf-8')
          print(safe)
          if not selected:
              raise SystemExit('No verified healthrenewal.org sender candidate was accepted by Resend')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as handle:
              handle.write('from_email='+selected+'\n')
              handle.write('sender_domain='+safe['selected_domain']+'\n')
          PY

      - name: Discover production D1
        id: resources
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/tokens/verify" \
            | python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("success") and d.get("result",{}).get("status")=="active", d'
          curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database?per_page=100" -o /tmp/d1.json
          database_id="$(python - <<'PY'
          import json, os
          data=json.load(open('/tmp/d1.json',encoding='utf-8'))
          matches=[item for item in data.get('result',[]) if item.get('name')==os.environ['DATABASE_NAME']]
          if not matches or not matches[0].get('uuid'):
              raise SystemExit('D1 database not found')
          print(matches[0]['uuid'])
          PY
          )"
          echo "database_id=${database_id}" >> "$GITHUB_OUTPUT"

      - name: Generate verified-sender Worker configuration
        working-directory: specialists-partners/account-backend
        env:
          D1_DATABASE_ID: ${{ steps.resources.outputs.database_id }}
          FROM_EMAIL: ${{ steps.sender.outputs.from_email }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          def q(value): return '"' + str(value).replace('\\','\\\\').replace('"','\\"') + '"'
          content=f'''name = "pterminology-specialist-accounts"
          main = "src/index-v10-production.js"
          compatibility_date = "2026-07-01"
          workers_dev = true

          [vars]
          ALLOWED_ORIGINS = "https://khaledaltheeb.github.io,https://healthrenewal.org,https://www.healthrenewal.org"
          ACCOUNT_BASE_URL = "https://khaledaltheeb.github.io/pterminology-site/specialists-partners/account/"
          ADMIN_BASE_URL = "https://khaledaltheeb.github.io/pterminology-site/specialists-partners/admin/"
          PASSWORD_RESET_BASE_URL = "https://khaledaltheeb.github.io/pterminology-site/specialists-partners/password-reset/"
          PORTAL_BASE_URL = "https://khaledaltheeb.github.io/pterminology-site/specialists-partners/portal/"
          CORE_API_BASE = "{os.environ['CORE_API_BASE']}"
          TURNSTILE_EXPECTED_HOSTNAMES = "khaledaltheeb.github.io,healthrenewal.org,www.healthrenewal.org"
          IDENTITY_SESSION_HOURS = "12"
          SESSION_BIND_IP = "off"
          OWNER_EMAIL = "pterminology@gmail.com"
          OWNER_PHONE = "+962795945817"
          OWNER_DISPLAY_NAME_AR = "خالد الذيب"
          OWNER_DISPLAY_NAME_EN = "Khaled Altheeb"
          FROM_EMAIL = {q(os.environ['FROM_EMAIL'])}

          [[d1_databases]]
          binding = "DB"
          database_name = "pterminology-specialists"
          database_id = {q(os.environ['D1_DATABASE_ID'])}
          migrations_dir = "../backend/migrations"

          [triggers]
          crons = ["31 2 * * *"]
          '''
          Path('wrangler-sender-activation-v2.toml').write_text(content,encoding='utf-8')
          PY
          chmod 600 wrangler-sender-activation-v2.toml

      - name: Apply migrations and deploy selected sender
        working-directory: specialists-partners/account-backend
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 migrations apply pterminology-specialists --remote --config wrangler-sender-activation-v2.toml
          npx --yes wrangler@4 deploy --config wrangler-sender-activation-v2.toml --minify --keep-vars

      - name: Verify full production operation
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_specialist_identity_v10_production.py
          python - <<'PY'
          import json
          deep=json.load(open('/tmp/identity-deep-health.json',encoding='utf-8'))
          provider=deep.get('emailProvider') or {}
          capabilities=deep.get('capabilities') or {}
          assert provider.get('authValid') is True, provider
          assert provider.get('senderReady') is True, provider
          assert capabilities.get('passwordRecoveryEmail') is True, capabilities
          PY

      - name: Record safe sender activation report
        if: always()
        env:
          SENDER_OUTCOME: ${{ steps.sender.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          selection={}
          try: selection=json.loads(Path('/tmp/sender-selection-v2.json').read_text(encoding='utf-8'))
          except Exception: pass
          normal={}
          deep={}
          try: normal=json.load(open('/tmp/identity-health.json',encoding='utf-8'))
          except Exception: pass
          try: deep=json.load(open('/tmp/identity-deep-health.json',encoding='utf-8'))
          except Exception: pass
          provider=deep.get('emailProvider') or {}
          capabilities=deep.get('capabilities') or {}
          success=(os.environ.get('SENDER_OUTCOME')=='success' and os.environ.get('VERIFY_OUTCOME')=='success' and provider.get('senderReady') is True and capabilities.get('passwordRecoveryEmail') is True)
          report={
              'schema_version':2,
              'checked_at':datetime.now(timezone.utc).isoformat(),
              'workflow_run_id':os.environ.get('GITHUB_RUN_ID'),
              'status':'passed' if success else 'failed',
              'selected_domain':selection.get('selected_domain'),
              'attempts':selection.get('attempts') or [],
              'test_message_accepted':selection.get('messages_sent')==1,
              'provider_id_present':selection.get('provider_id_present') is True,
              'worker_ok':normal.get('ok') is True,
              'worker_version':normal.get('version'),
              'email_auth_valid':provider.get('authValid'),
              'sender_ready':provider.get('senderReady'),
              'sender_code':provider.get('senderCode'),
              'password_recovery_email_ready':capabilities.get('passwordRecoveryEmail'),
              'contains_secret_values':False,
          }
          Path('reports/specialist-sender-activation-v2.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(report)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/specialist-sender-activation-v2.json
          git commit -m "chore: record specialist sender activation v2 [skip ci]" || exit 0
          for attempt in {1..5}; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            sleep $((attempt*3))
          done
          exit 1

      - name: Remove ephemeral configuration
        if: always()
        working-directory: specialists-partners/account-backend
        run: rm -f wrangler-sender-activation-v2.toml
