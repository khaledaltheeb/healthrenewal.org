name: Publish daily tools v150 after institutional deploy

on:
  workflow_run:
    workflows: ["Build complete institutional site v5 and deploy"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    concurrency:
      group: github-pages-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Resolve exact release
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "release_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "release_sha=${TRIGGER_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout exact release sources
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.release_sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve validated institutional baseline
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            echo "run_id=${TRIGGER_RUN_ID}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=validated-production-site&per_page=100" \
            -o /tmp/baselines.json
          python - <<'PY'
          import json, os
          payload=json.load(open('/tmp/baselines.json',encoding='utf-8'))
          items=[x for x in payload.get('artifacts',[]) if not x.get('expired') and x.get('workflow_run',{}).get('head_branch')=='main']
          if not items:
              raise SystemExit('No validated production baseline available')
          item=max(items,key=lambda x:x.get('created_at',''))
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out:
              out.write(f"run_id={item['workflow_run']['id']}\n")
          print({'baselineRunId':item['workflow_run']['id']})
          PY

      - name: Download validated institutional site
        uses: actions/download-artifact@v4
        with:
          name: validated-production-site
          path: _site
          repository: khaledaltheeb/healthrenewal.org
          run-id: ${{ steps.baseline.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Compile and publish daily tools v150
        env:
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/publish_daily_tools_v24_core.py \
            scripts/daily_tools_v100.py \
            scripts/publish_daily_tools_v24.py \
            scripts/daily_tools_v150.py \
            scripts/publish_daily_tools_v150.py \
            scripts/publish_complete_sitemap_v360.py
          test -f _site/index.html
          python scripts/publish_daily_tools_v150.py _site
          python scripts/publish_complete_sitemap_v360.py _site --minimum-urls 3000
          python - <<'PY'
          import json, os
          from pathlib import Path
          site=Path('_site')
          report=json.loads((site/'api/daily-tools-v150.json').read_text(encoding='utf-8'))
          legacy=json.loads((site/'api/daily-tools-v24.json').read_text(encoding='utf-8'))
          index=(site/'daily-tools/index.html').read_text(encoding='utf-8')
          pages=list((site/'daily-tools').glob('*/index.html'))
          assert report['status']=='passed' and report['tools']==150, report
          assert report['newToolsAdded']==50 and report['existingToolsUpgraded']==100, report
          assert report['categories']==10 and report['toolsPerCategory']==15, report
          assert report['indexableSectionPages']==162, report
          assert report['minimumToolPageWordCount']>=420, report
          assert legacy['edition']==150 and legacy['tools']==150 and legacy['pages']==162, legacy
          assert len(pages)==150, len(pages)
          assert '150 أداة نفسية وتربوية يومية' in index, index[:2000]
          assert 'data-index-upgrade="daily-tools-content-v150"' in index
          for slug in ('overthinking-question-funnel','procrastination-friction-audit','tantrum-calm-plan','school-distress-pattern-log','urgent-support-message','sleep-wind-down-plan'):
              text=(site/'daily-tools'/slug/'index.html').read_text(encoding='utf-8')
              assert 'data-content-upgrade="daily-tools-content-v150"' in text, slug
              assert 'FAQPage' in text and 'BreadcrumbList' in text, slug
              assert 'مصادر' in text, slug
          release={
              'schemaVersion':1,'status':'passed','releaseCommit':os.environ['RELEASE_SHA'],
              'edition':150,'tools':150,'newToolsAdded':50,'sectionPages':162,
              'minimumToolPageWordCount':report['minimumToolPageWordCount'],
          }
          (site/'api/daily-tools-release-v150.json').write_text(json.dumps(release,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print({'report':report,'release':release})
          PY

      - name: Preserve v150 complete baseline
        uses: actions/upload-artifact@v4
        with:
          name: validated-production-site
          path: _site
          include-hidden-files: true
          retention-days: 90
          compression-level: 6

      - uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy Pages
        uses: actions/deploy-pages@v4

      - name: Verify exact v150 publication live
        env:
          EXPECTED_SHA: ${{ steps.release.outputs.release_sha }}
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 60); do
            nonce="${GITHUB_RUN_ID}-${attempt}-$(date +%s)"
            if curl -fsSL --retry 2 -H 'Cache-Control: no-cache' \
              "https://healthrenewal.org/api/daily-tools-release-v150.json?release=${nonce}" -o /tmp/release.json \
              && curl -fsSL --retry 2 -H 'Cache-Control: no-cache' \
              "https://healthrenewal.org/api/daily-tools-v150.json?release=${nonce}" -o /tmp/report.json \
              && curl -fsSL --retry 2 -H 'Cache-Control: no-cache' \
              "https://healthrenewal.org/daily-tools/?release=${nonce}" -o /tmp/index.html \
              && curl -fsSL --retry 2 -H 'Cache-Control: no-cache' \
              "https://healthrenewal.org/daily-tools/procrastination-friction-audit/?release=${nonce}" -o /tmp/tool.html; then
              if python - <<'PY'
          import json, os
          release=json.load(open('/tmp/release.json',encoding='utf-8'))
          report=json.load(open('/tmp/report.json',encoding='utf-8'))
          index=open('/tmp/index.html',encoding='utf-8').read()
          tool=open('/tmp/tool.html',encoding='utf-8').read()
          assert release['status']=='passed' and release['releaseCommit']==os.environ['EXPECTED_SHA'], release
          assert release['edition']==150 and release['tools']==150 and release['newToolsAdded']==50, release
          assert report['status']=='passed' and report['tools']==150 and report['indexableSectionPages']==162, report
          assert '150 أداة نفسية وتربوية يومية' in index, index[:2000]
          assert 'تدقيق احتكاك التسويف' in tool and 'daily-tools-content-v150' in tool, tool[:3000]
          assert 'FAQPage' in tool and 'BreadcrumbList' in tool, tool[:3000]
          print({'release':release,'report':report})
          PY
              then
                ready=1
                break
              fi
            fi
            sleep 5
          done
          test "$ready" = 1
