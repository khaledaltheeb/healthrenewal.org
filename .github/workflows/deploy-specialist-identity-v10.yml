name: Deploy specialist identity v10

on:
  pull_request:
    branches: ["main"]
    paths:
      - "specialists-partners/account-backend/src/index.js"
      - "specialists-partners/account-backend/src/index-v8.js"
      - "specialists-partners/account-backend/src/index-v10.js"
      - "specialists-partners/account-backend/src/index-v10-final.js"
      - "specialists-partners/account/**"
      - "specialists-partners/admin/**"
      - "specialists-partners/recover/**"
      - "specialists-partners/password-reset/**"
      - "specialists-partners/assets/runtime-config.js"
      - "specialists-partners/backend/migrations/**"
      - "tests/test_specialist_identity_v10.py"
      - ".github/workflows/deploy-specialist-identity-v10.yml"
  push:
    branches: ["main"]
    paths:
      - "specialists-partners/account-backend/src/index.js"
      - "specialists-partners/account-backend/src/index-v8.js"
      - "specialists-partners/account-backend/src/index-v10.js"
      - "specialists-partners/account-backend/src/index-v10-final.js"
      - "specialists-partners/account/**"
      - "specialists-partners/admin/**"
      - "specialists-partners/recover/**"
      - "specialists-partners/password-reset/**"
      - "specialists-partners/assets/runtime-config.js"
      - "specialists-partners/backend/migrations/**"
      - "tests/test_specialist_identity_v10.py"
      - ".github/workflows/deploy-specialist-identity-v10.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: specialist-identity-v10-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate identity, interface, and recovery contracts
        run: |
          set -euo pipefail
          node --check specialists-partners/account-backend/src/index.js
          node --check specialists-partners/account-backend/src/index-v8.js
          node --check specialists-partners/account-backend/src/index-v10.js
          node --check specialists-partners/account-backend/src/index-v10-final.js
          node --check specialists-partners/admin/admin.js
          node --check specialists-partners/admin/admin-recovery-v10-final.js
          node --check specialists-partners/recover/recover.js
          node --check specialists-partners/password-reset/reset-v9.js
          python -m unittest -v \
            tests.test_specialist_accounts_v5 \
            tests.test_specialist_identity_v6 \
            tests.test_specialist_recovery_v8 \
            tests.test_specialist_identity_v10

  deploy:
    if: ${{ github.event_name != 'pull_request' }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '826ac34927c1e045c06145a327c2ac52' }}
      PREFERRED_D1_DATABASE_ID: ${{ secrets.SPECIALISTS_D1_DATABASE_ID }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      ADMIN_API_KEY: ${{ secrets.SPECIALISTS_ADMIN_API_KEY }}
      REVIEWER_API_KEY: ${{ secrets.SPECIALISTS_REVIEWER_API_KEY }}
      MODERATOR_API_KEY: ${{ secrets.SPECIALISTS_MODERATOR_API_KEY }}
      RATE_LIMIT_SALT: ${{ secrets.SPECIALISTS_RATE_LIMIT_SALT }}
      PASSWORD_PEPPER: ${{ secrets.SPECIALISTS_PASSWORD_PEPPER }}
      FROM_EMAIL: ${{ secrets.SPECIALISTS_FROM_EMAIL }}
      DATABASE_NAME: pterminology-specialists
      ACCOUNT_API_BASE: https://pterminology-specialist-accounts.pterminology-826ac349.workers.dev
      CORE_API_BASE: https://pterminology-specialists.pterminology-826ac349.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate required deployment credentials and discover D1
        id: resources
        shell: bash
        run: |
          set -euo pipefail
          required=(CLOUDFLARE_API_TOKEN RESEND_API_KEY ADMIN_API_KEY RATE_LIMIT_SALT FROM_EMAIL)
          for name in "${required[@]}"; do
            [[ -n "${!name:-}" ]] || { echo "::error::$name is required"; exit 1; }
          done
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/tokens/verify" \
            | python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("success") and d.get("result",{}).get("status")=="active", d'
          if [[ -n "${PREFERRED_D1_DATABASE_ID:-}" ]]; then
            database_id="${PREFERRED_D1_DATABASE_ID}"
          else
            curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database?per_page=100" -o /tmp/d1.json
            database_id="$(python - <<'PY'
          import json, os
          data=json.load(open('/tmp/d1.json',encoding='utf-8'))
          matches=[item for item in data.get('result',[]) if item.get('name')==os.environ['DATABASE_NAME']]
          if not matches or not matches[0].get('uuid'):
              raise SystemExit('D1 database not found')
          print(matches[0]['uuid'])
          PY
          )"
          fi
          [[ -n "${database_id}" ]] || { echo "::error::D1 database id missing"; exit 1; }
          echo "database_id=${database_id}" >> "$GITHUB_OUTPUT"

      - name: Generate production Worker configuration
        working-directory: specialists-partners/account-backend
        env:
          D1_DATABASE_ID: ${{ steps.resources.outputs.database_id }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          def q(value): return '"' + str(value).replace('\\','\\\\').replace('"','\\"') + '"'
          content=f'''name = "pterminology-specialist-accounts"
          main = "src/index-v10-final.js"
          compatibility_date = "2026-07-01"
          workers_dev = true

          [vars]
          ALLOWED_ORIGINS = "https://khaledaltheeb.github.io"
          ACCOUNT_BASE_URL = "https://khaledaltheeb.github.io/pterminology-site/specialists-partners/account/"
          ADMIN_BASE_URL = "https://khaledaltheeb.github.io/pterminology-site/specialists-partners/admin/"
          PASSWORD_RESET_BASE_URL = "https://khaledaltheeb.github.io/pterminology-site/specialists-partners/password-reset/"
          PORTAL_BASE_URL = "https://khaledaltheeb.github.io/pterminology-site/specialists-partners/portal/"
          CORE_API_BASE = "{os.environ['CORE_API_BASE']}"
          TURNSTILE_EXPECTED_HOSTNAMES = "khaledaltheeb.github.io"
          IDENTITY_SESSION_HOURS = "12"
          SESSION_BIND_IP = "off"
          OWNER_EMAIL = "pterminology@gmail.com"
          OWNER_PHONE = "+962795945817"
          OWNER_DISPLAY_NAME_AR = "خالد الذيب"
          OWNER_DISPLAY_NAME_EN = "Khaled Altheeb"
          FROM_EMAIL = {q(os.environ['FROM_EMAIL'])}

          [[d1_databases]]
          binding = "DB"
          database_name = "pterminology-specialists"
          database_id = {q(os.environ['D1_DATABASE_ID'])}
          migrations_dir = "../backend/migrations"

          [triggers]
          crons = ["31 2 * * *"]
          '''
          Path('wrangler-v10.toml').write_text(content,encoding='utf-8')
          secrets={
            'RESEND_API_KEY':os.environ['RESEND_API_KEY'],
            'ADMIN_API_KEY':os.environ['ADMIN_API_KEY'],
            'RATE_LIMIT_SALT':os.environ['RATE_LIMIT_SALT'],
          }
          if os.environ.get('PASSWORD_PEPPER'): secrets['PASSWORD_PEPPER']=os.environ['PASSWORD_PEPPER']
          if os.environ.get('REVIEWER_API_KEY'): secrets['REVIEWER_API_KEY']=os.environ['REVIEWER_API_KEY']
          if os.environ.get('MODERATOR_API_KEY'): secrets['MODERATOR_API_KEY']=os.environ['MODERATOR_API_KEY']
          Path('worker-secrets-v10.json').write_text(json.dumps(secrets),encoding='utf-8')
          PY
          chmod 600 wrangler-v10.toml worker-secrets-v10.json

      - name: Apply D1 migrations
        working-directory: specialists-partners/account-backend
        run: npx --yes wrangler@4 d1 migrations apply pterminology-specialists --remote --config wrangler-v10.toml

      - name: Deploy specialist identity v10
        working-directory: specialists-partners/account-backend
        run: npx --yes wrangler@4 deploy --config wrangler-v10.toml --secrets-file worker-secrets-v10.json --minify --keep-vars

      - name: Verify normal and deep production health
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          for attempt in {1..36}; do
            status="$(curl -sS -o /tmp/identity-health.json -w '%{http_code}' "${ACCOUNT_API_BASE}/health?release=10.1.0-${GITHUB_RUN_ID}-${attempt}" || true)"
            if [[ "${status}" == "200" ]] && python - <<'PY'
          import json
          data=json.load(open('/tmp/identity-health.json',encoding='utf-8'))
          assert data.get('ok') is True, data
          assert data.get('version') == '10.1.0', data
          checks=data.get('checks') or {}
          for key in ['database','identitySchema','turnstile','sessionBinding','singleActiveResetLink','truthfulAdminDelivery','manualRecovery','corsPreflight','strictPasswordPolicy']:
              assert checks.get(key) is True, (key,checks)
          PY
            then ready=true; break; fi
            sleep 5
          done
          [[ "${ready}" == "true" ]] || { cat /tmp/identity-health.json || true; exit 1; }

          deep_status="$(curl -sS -o /tmp/identity-deep-health.json -w '%{http_code}' "${ACCOUNT_API_BASE}/health?deep=1&release=10.1.0-${GITHUB_RUN_ID}" || true)"
          [[ "${deep_status}" == "200" || "${deep_status}" == "503" ]] || { cat /tmp/identity-deep-health.json || true; exit 1; }
          python - <<'PY'
          import json
          data=json.load(open('/tmp/identity-deep-health.json',encoding='utf-8'))
          assert data.get('version') == '10.1.0', data
          provider=data.get('emailProvider') or {}
          assert provider.get('configured') is True, provider
          assert provider.get('code') in {'ready','ready_sending_only','invalid_api_key','authentication_failed','rate_limited','provider_unavailable','provider_rejected','provider_unreachable'}, provider
          PY
          echo "deep_status=${deep_status}" >> "$GITHUB_OUTPUT"

      - name: Record safe production report
        env:
          DEEP_STATUS: ${{ steps.verify.outputs.deep_status }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          normal=json.load(open('/tmp/identity-health.json',encoding='utf-8'))
          deep=json.load(open('/tmp/identity-deep-health.json',encoding='utf-8'))
          provider=deep.get('emailProvider') or {}
          report={
            'schema_version':1,
            'checked_at':datetime.now(timezone.utc).isoformat(),
            'workflow_run_id':os.environ['GITHUB_RUN_ID'],
            'worker':{
              'http_status':200,
              'ok':normal.get('ok') is True,
              'version':normal.get('version'),
              'checks':normal.get('checks') or {},
            },
            'email_provider':{
              'http_status':int(os.environ.get('DEEP_STATUS') or 0),
              'configured':provider.get('configured'),
              'auth_valid':provider.get('authValid'),
              'access':provider.get('access'),
              'code':provider.get('code'),
            },
            'manual_recovery_available':bool((normal.get('capabilities') or {}).get('manualRecovery')),
            'fully_operational':normal.get('ok') is True and provider.get('authValid') is True,
          }
          open('reports/specialist-identity-v10-production.json','w',encoding='utf-8').write(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/specialist-identity-v10-production.json
          git commit -m "chore: record specialist identity v10 production [skip ci]" || exit 0
          for attempt in {1..5}; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            sleep $((attempt*3))
          done
          echo "::error::Could not publish safe production report"
          exit 1

      - name: Remove ephemeral deployment files
        if: always()
        working-directory: specialists-partners/account-backend
        run: rm -f wrangler-v10.toml worker-secrets-v10.json
