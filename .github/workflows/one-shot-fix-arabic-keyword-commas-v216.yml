name: One-shot fix Arabic keyword commas v216

on:
  push:
    branches: ["agent/sitewide-seo-v216"]
    paths:
      - ".github/workflows/one-shot-fix-arabic-keyword-commas-v216.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sitewide-seo-v216
          fetch-depth: 0
      - name: Normalize delimiter punctuation inside keyword phrases
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/enhance_sitewide_seo_v216.py")
          text = path.read_text(encoding="utf-8")
          old_function = '''def normalized_keyword(value: str) -> str:
              return SPACE_RE.sub(" ", value).strip(" |—–-،,.;:").casefold()


          def title_topic'''.replace("          ", "")
          new_function = '''def keyword_phrase(value: str) -> str:
              """Remove meta-keyword delimiters from one topical phrase."""
              return SPACE_RE.sub(" ", re.sub(r"[,،]+", " ", clean_text(value))).strip()


          def normalized_keyword(value: str) -> str:
              return keyword_phrase(value).strip(" |—–-.;:").casefold()


          def title_topic'''.replace("          ", "")
          if old_function in text:
              text = text.replace(old_function, new_function, 1)
          elif 'def keyword_phrase(value: str)' not in text:
              raise SystemExit("Keyword normalization insertion point not found")

          old_candidate = '        candidate = clean_text(candidate)\n        normalized = normalized_keyword(candidate)'
          new_candidate = '        candidate = keyword_phrase(candidate)\n        normalized = normalized_keyword(candidate)'
          if old_candidate in text:
              text = text.replace(old_candidate, new_candidate, 1)
          elif new_candidate not in text:
              raise SystemExit("Keyword candidate normalization point not found")

          path.write_text(text, encoding="utf-8")
          PY
          python -m py_compile scripts/enhance_sitewide_seo_v216.py
          rm .github/workflows/one-shot-fix-arabic-keyword-commas-v216.yml
      - name: Commit idempotency fix and remove this workflow
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add scripts/enhance_sitewide_seo_v216.py .github/workflows/one-shot-fix-arabic-keyword-commas-v216.yml
          git commit -m "SEO: normalize Arabic commas inside keyword phrases"
          git push origin HEAD:agent/sitewide-seo-v216
