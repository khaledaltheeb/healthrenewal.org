name: Deploy specialist identity interface v10.3

on:
  push:
    branches: ["main"]
    paths:
      - "specialists-partners/admin/index.html"
      - "specialists-partners/admin/admin-recovery-v10-final.js"
      - "specialists-partners/admin/admin-provider-status-v10.js"
      - "specialists-partners/assets/runtime-config.js"
      - "specialists-partners/recover/index.html"
      - "specialists-partners/recover/recover.js"
      - "specialists-partners/recover/recover.css"
      - "specialists-partners/password-reset/index.html"
      - "specialists-partners/password-reset/reset-v10.js"
      - "specialists-partners/password-reset/reset-v9.css"
      - "tests/test_specialist_identity_v10.py"
      - ".github/workflows/deploy-specialist-recovery-pages-v8.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: specialist-identity-pages-v10
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate interface source and network contracts
        run: |
          set -euxo pipefail
          node --check specialists-partners/admin/admin-recovery-v10-final.js
          node --check specialists-partners/admin/admin-provider-status-v10.js
          node --check specialists-partners/assets/runtime-config.js
          node --check specialists-partners/recover/recover.js
          node --check specialists-partners/password-reset/reset-v10.js
          python -m unittest -v tests.test_specialist_identity_v10
          python - <<'PY'
          from pathlib import Path
          runtime=Path('specialists-partners/assets/runtime-config.js').read_text(encoding='utf-8')
          recover=Path('specialists-partners/recover/index.html').read_text(encoding='utf-8')
          recover_js=Path('specialists-partners/recover/recover.js').read_text(encoding='utf-8')
          reset=Path('specialists-partners/password-reset/index.html').read_text(encoding='utf-8')
          reset_js=Path('specialists-partners/password-reset/reset-v10.js').read_text(encoding='utf-8')
          core='https://pterminology-specialists.pterminology-826ac349.workers.dev'
          identity='https://pterminology-specialist-accounts.pterminology-826ac349.workers.dev'
          assert 'identityVersion: "10.3.0"' in runtime
          assert 'admin-recovery-v10-final.js?v=10.3.0' in runtime
          assert 'admin-provider-status-v10.js?v=10.3.0' in runtime
          assert 'recover.js?v=10.3.0' in recover
          assert 'reset-v10.js?v=10.3.0' in reset
          for page in (recover, reset):
              assert identity in page and core in page
          for script in (recover_js, reset_js):
              assert 'AbortController' in script
              assert "mode: 'cors'" in script
              assert "redirect: 'error'" not in script
          PY

      - name: Discover latest validated production artifact
        id: artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=validated-production-site&per_page=100" \
            -o /tmp/artifacts.json
          python - <<'PY'
          import json, os
          data=json.load(open('/tmp/artifacts.json',encoding='utf-8'))
          items=[item for item in data.get('artifacts',[]) if not item.get('expired') and item.get('workflow_run',{}).get('id')]
          if not items:
              raise SystemExit('No active validated-production-site artifact found')
          item=sorted(items,key=lambda value:value.get('created_at',''),reverse=True)[0]
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as output:
              output.write(f"run_id={item['workflow_run']['id']}\n")
              output.write(f"artifact_id={item['id']}\n")
          print({'run_id':item['workflow_run']['id'],'artifact_id':item['id'],'created_at':item.get('created_at')})
          PY

      - name: Download current validated production site
        uses: actions/download-artifact@v4
        with:
          name: validated-production-site
          path: _site
          repository: khaledaltheeb/pterminology-site
          run-id: ${{ steps.artifact.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch complete specialist identity interface
        shell: bash
        run: |
          set -euxo pipefail
          test -f _site/index.html
          test -f _site/deployment.json
          for source in \
            specialists-partners/admin/index.html \
            specialists-partners/admin/admin-recovery-v10-final.js \
            specialists-partners/admin/admin-provider-status-v10.js \
            specialists-partners/assets/runtime-config.js \
            specialists-partners/recover/index.html \
            specialists-partners/recover/recover.js \
            specialists-partners/recover/recover.css \
            specialists-partners/password-reset/index.html \
            specialists-partners/password-reset/reset-v10.js \
            specialists-partners/password-reset/reset-v9.css; do
            test -f "${source}"
            mkdir -p "_site/$(dirname "${source}")"
            cp "${source}" "_site/${source}"
          done
          touch _site/.nojekyll
          python - <<'PY'
          from pathlib import Path
          admin=Path('_site/specialists-partners/admin/index.html').read_text(encoding='utf-8')
          runtime=Path('_site/specialists-partners/assets/runtime-config.js').read_text(encoding='utf-8')
          recover=Path('_site/specialists-partners/recover/index.html').read_text(encoding='utf-8')
          recover_js=Path('_site/specialists-partners/recover/recover.js').read_text(encoding='utf-8')
          reset=Path('_site/specialists-partners/password-reset/index.html').read_text(encoding='utf-8')
          reset_js=Path('_site/specialists-partners/password-reset/reset-v10.js').read_text(encoding='utf-8')
          recovery=Path('_site/specialists-partners/admin/admin-recovery-v10-final.js').read_text(encoding='utf-8')
          provider=Path('_site/specialists-partners/admin/admin-provider-status-v10.js').read_text(encoding='utf-8')
          assert 'id="admin-forgot" type="button"' in admin
          assert 'identityVersion: "10.3.0"' in runtime
          assert 'admin-recovery-v10-final.js?v=10.3.0' in runtime
          assert 'admin-provider-status-v10.js?v=10.3.0' in runtime
          assert 'recover.js?v=10.3.0' in recover
          assert 'reset-v10.js?v=10.3.0' in reset
          assert 'all_account_endpoints_unavailable' in recover_js
          assert 'all_account_endpoints_unavailable' in reset_js
          assert 'password-reset-link' in recovery
          assert '/v1/admin/email-provider-status' in provider
          PY

      - uses: actions/configure-pages@v5

      - name: Upload patched production artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy patched artifact
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live specialist identity interface
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ steps.artifact.outputs.run_id }}
        run: |
          set -euo pipefail
          root="https://khaledaltheeb.github.io/pterminology-site/specialists-partners"
          ready=false
          for attempt in {1..60}; do
            nonce="${GITHUB_RUN_ID}-${attempt}-$(date +%s%N)"
            admin_code="$(curl -sS -L -o /tmp/admin.html -w '%{http_code}' "${root}/admin/?v=10.3.0&probe=${nonce}" || true)"
            runtime_code="$(curl -sS -L -o /tmp/runtime.js -w '%{http_code}' "${root}/assets/runtime-config.js?v=10.3.0&probe=${nonce}" || true)"
            recover_code="$(curl -sS -L -o /tmp/recover.html -w '%{http_code}' "${root}/recover/?v=10.3.0&probe=${nonce}" || true)"
            recover_js_code="$(curl -sS -L -o /tmp/recover.js -w '%{http_code}' "${root}/recover/recover.js?v=10.3.0&probe=${nonce}" || true)"
            reset_code="$(curl -sS -L -o /tmp/reset.html -w '%{http_code}' "${root}/password-reset/?v=10.3.0&probe=${nonce}" || true)"
            reset_js_code="$(curl -sS -L -o /tmp/reset-v10.js -w '%{http_code}' "${root}/password-reset/reset-v10.js?v=10.3.0&probe=${nonce}" || true)"
            recovery_code="$(curl -sS -L -o /tmp/admin-recovery.js -w '%{http_code}' "${root}/admin/admin-recovery-v10-final.js?v=10.3.0&probe=${nonce}" || true)"
            provider_code="$(curl -sS -L -o /tmp/admin-provider.js -w '%{http_code}' "${root}/admin/admin-provider-status-v10.js?v=10.3.0&probe=${nonce}" || true)"
            if [[ "${admin_code}" == "200" && "${runtime_code}" == "200" && "${recover_code}" == "200" && "${recover_js_code}" == "200" && "${reset_code}" == "200" && "${reset_js_code}" == "200" && "${recovery_code}" == "200" && "${provider_code}" == "200" ]] \
              && grep -q 'id="admin-forgot" type="button"' /tmp/admin.html \
              && grep -q 'identityVersion: "10.3.0"' /tmp/runtime.js \
              && grep -q 'admin-recovery-v10-final.js?v=10.3.0' /tmp/runtime.js \
              && grep -q 'admin-provider-status-v10.js?v=10.3.0' /tmp/runtime.js \
              && grep -q 'recover.js?v=10.3.0' /tmp/recover.html \
              && grep -q 'all_account_endpoints_unavailable' /tmp/recover.js \
              && grep -q 'reset-v10.js?v=10.3.0' /tmp/reset.html \
              && grep -q 'all_account_endpoints_unavailable' /tmp/reset-v10.js \
              && grep -q 'password-reset-link' /tmp/admin-recovery.js \
              && grep -q '/v1/admin/email-provider-status' /tmp/admin-provider.js; then
              ready=true
              break
            fi
            sleep 5
          done
          [[ "${ready}" == "true" ]] || { echo "::error::Specialist identity interface v10.3 did not become live"; exit 1; }

          mkdir -p reports
          python - <<'PY'
          import hashlib, json, os
          from datetime import datetime, timezone
          files={
            'admin':'/tmp/admin.html',
            'runtime':'/tmp/runtime.js',
            'recovery':'/tmp/recover.html',
            'recovery_script':'/tmp/recover.js',
            'password_reset':'/tmp/reset.html',
            'password_reset_script':'/tmp/reset-v10.js',
            'admin_recovery_script':'/tmp/admin-recovery.js',
            'admin_provider_script':'/tmp/admin-provider.js',
          }
          report={
            'schema_version':1,
            'checked_at':datetime.now(timezone.utc).isoformat(),
            'version':'10.3.0',
            'source_artifact_run_id':os.environ.get('SOURCE_RUN_ID'),
            'workflow_run_id':os.environ['GITHUB_RUN_ID'],
            'pages':{name:{'http_status':200,'sha256':hashlib.sha256(open(path,'rb').read()).hexdigest()} for name,path in files.items()},
            'contracts':{
              'admin_forgot_button':True,
              'owner_manual_recovery':True,
              'authenticated_provider_status':True,
              'recovery_dual_endpoint_csp':True,
              'recovery_network_timeout':True,
              'arabic_password_reset':True,
            },
            'passed':True,
          }
          open('reports/specialist-identity-v10-pages.json','w',encoding='utf-8').write(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY

      - name: Commit safe deployment receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/specialist-identity-v10-pages.json
          git commit -m "chore: record specialist identity v10 pages [skip ci]" || exit 0
          for attempt in {1..5}; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            sleep $((attempt*3))
          done
          echo "::error::Could not publish specialist identity pages receipt"
          exit 1
