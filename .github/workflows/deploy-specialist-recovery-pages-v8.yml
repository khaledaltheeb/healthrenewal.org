name: Deploy specialist recovery interface v8

on:
  push:
    branches: ["main"]
    paths:
      - "specialists-partners/admin/index.html"
      - ".github/workflows/deploy-specialist-recovery-pages-v8.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: specialist-recovery-pages-v8
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Discover latest validated production artifact
        id: artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=validated-production-site&per_page=100" \
            -o /tmp/artifacts.json
          python - <<'PY'
          import json, os
          data=json.load(open('/tmp/artifacts.json',encoding='utf-8'))
          items=[x for x in data.get('artifacts',[]) if not x.get('expired') and x.get('workflow_run',{}).get('id')]
          if not items:
              raise SystemExit('No active validated-production-site artifact found')
          item=sorted(items,key=lambda x:x.get('created_at',''),reverse=True)[0]
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out:
              out.write(f"run_id={item['workflow_run']['id']}\n")
              out.write(f"artifact_id={item['id']}\n")
          print({'run_id':item['workflow_run']['id'],'artifact_id':item['id'],'created_at':item.get('created_at')})
          PY

      - name: Download current validated production site
        uses: actions/download-artifact@v4
        with:
          name: validated-production-site
          path: _site
          repository: khaledaltheeb/pterminology-site
          run-id: ${{ steps.artifact.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch only the verified admin recovery interface
        shell: bash
        run: |
          set -euo pipefail
          test -f _site/index.html
          test -f _site/deployment.json
          test -f specialists-partners/admin/index.html
          mkdir -p _site/specialists-partners/admin
          cp specialists-partners/admin/index.html _site/specialists-partners/admin/index.html
          touch _site/.nojekyll
          python - <<'PY'
          from pathlib import Path
          html=Path('_site/specialists-partners/admin/index.html').read_text(encoding='utf-8')
          assert 'id="admin-forgot" type="button"' in html
          assert 'href="../recover/?v=8"' in html
          assert 'admin.js?v=8.0.0' in html
          assert 'runtime-config.js?v=8.0.0' in html
          PY

      - uses: actions/configure-pages@v5

      - name: Upload patched production artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy patched artifact
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live recovery interface
        shell: bash
        run: |
          set -euo pipefail
          url="https://khaledaltheeb.github.io/pterminology-site/specialists-partners/admin/"
          ready=false
          for attempt in {1..60}; do
            code="$(curl -sS -L -o /tmp/admin.html -w '%{http_code}' "${url}?v=8&probe=${GITHUB_RUN_ID}-${attempt}" || true)"
            if [[ "${code}" == "200" ]] \
              && grep -q 'id="admin-forgot" type="button"' /tmp/admin.html \
              && grep -q 'href="../recover/?v=8"' /tmp/admin.html \
              && grep -q 'admin.js?v=8.0.0' /tmp/admin.html; then
              ready=true
              break
            fi
            sleep 5
          done
          [[ "${ready}" == "true" ]] || { echo "::error::Specialist recovery interface did not become live"; exit 1; }
          mkdir -p reports
          python - <<'PY'
          import hashlib, json, os
          from datetime import datetime, timezone
          body=open('/tmp/admin.html','rb').read()
          report={
            'schema_version':1,
            'checked_at':datetime.now(timezone.utc).isoformat(),
            'page_url':'https://khaledaltheeb.github.io/pterminology-site/specialists-partners/admin/',
            'http_status':200,
            'admin_forgot_button':True,
            'independent_recovery_link':True,
            'sha256':hashlib.sha256(body).hexdigest(),
            'source_artifact_run_id':os.environ.get('SOURCE_RUN_ID'),
            'workflow_run_id':os.environ['GITHUB_RUN_ID'],
            'passed':True,
          }
          open('reports/specialist-recovery-pages-v8.json','w',encoding='utf-8').write(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          PY
        env:
          SOURCE_RUN_ID: ${{ steps.artifact.outputs.run_id }}

      - name: Commit safe deployment receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/specialist-recovery-pages-v8.json
          git commit -m "chore: record specialist recovery pages v8"
          git pull --rebase origin main
          git push origin HEAD:main
