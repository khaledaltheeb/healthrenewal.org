name: Normalize specialist deployment triggers v1

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/normalize-specialist-deploy-triggers-v1.yml"

permissions:
  contents: write

env:
  NORMALIZE_TRIGGER: "2026-07-31T02:30:00+03:00"

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Separate v6 and v8 deployment triggers and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path=Path('.github/workflows/deploy-specialists-account-backend.yml')
          text=path.read_text(encoding='utf-8')
          marker='permissions:\n'
          if marker not in text:
              raise SystemExit('permissions marker missing from v6 workflow')
          tail=text[text.index(marker):]
          header='''name: Validate and deploy specialist identity v6

          on:
            pull_request:
              branches: ["main"]
              paths:
                - "specialists-partners/account/**"
                - "specialists-partners/admin/**"
                - "specialists-partners/account-backend/src/index.js"
                - "specialists-partners/backend/src/index-v2.js"
                - "specialists-partners/backend/migrations/0005_identity_password_admin.sql"
                - "specialists-partners/assets/runtime-config.js"
                - "tests/test_specialist_identity_v6.py"
                - ".github/workflows/deploy-specialists-account-backend.yml"
            push:
              branches: ["main"]
              paths:
                - "specialists-partners/account-backend/src/index.js"
                - "specialists-partners/backend/src/index-v2.js"
                - "specialists-partners/backend/migrations/0005_identity_password_admin.sql"
                - "tests/test_specialist_identity_v6.py"
                - ".github/workflows/deploy-specialists-account-backend.yml"
            workflow_dispatch:
              inputs:
                apply_migrations:
                  description: "Apply pending D1 migrations"
                  required: true
                  default: true
                  type: boolean

          '''
          header='\n'.join(line[10:] if line.startswith('          ') else line for line in header.splitlines())+'\n'
          path.write_text(header+tail,encoding='utf-8')
          PY

          rm -f .github/workflows/audit-cloudflare-email-service-v1.yml
          rm -f .github/workflows/report-specialist-recovery-v8-runs.yml
          rm -f .github/workflows/normalize-specialist-deploy-triggers-v1.yml

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/deploy-specialists-account-backend.yml
          git add -u .github/workflows
          git commit -m "chore: separate specialist v6 and v8 deploy triggers [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
