name: Restore known specialist secrets now

on:
  push:
    branches:
      - agent/restore-known-specialist-secrets-now
    paths:
      - reports/restore-known-specialist-secrets-trigger.txt

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '826ac34927c1e045c06145a327c2ac52' }}
      WORKER_NAME: pterminology-specialist-accounts
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      ADMIN_API_KEY: ${{ secrets.SPECIALISTS_ADMIN_API_KEY }}
      RATE_LIMIT_SALT: ${{ secrets.SPECIALISTS_RATE_LIMIT_SALT }}
      PASSWORD_PEPPER: ${{ secrets.SPECIALISTS_PASSWORD_PEPPER }}
      REVIEWER_API_KEY: ${{ secrets.SPECIALISTS_REVIEWER_API_KEY }}
      MODERATOR_API_KEY: ${{ secrets.SPECIALISTS_MODERATOR_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/restore-known-specialist-secrets-now
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate source secrets are available
        shell: bash
        run: |
          set -euo pipefail
          required=(CLOUDFLARE_API_TOKEN RESEND_API_KEY ADMIN_API_KEY RATE_LIMIT_SALT)
          for name in "${required[@]}"; do
            [[ -n "${!name:-}" ]] || { echo "::error::$name is required"; exit 1; }
          done

      - name: Restore known secret values without exposing them
        shell: bash
        run: |
          set -euo pipefail
          put_secret() {
            local name="$1"
            local value="${!name:-}"
            [[ -n "$value" ]] || return 0
            printf '%s' "$value" | npx --yes wrangler@4 secret put "$name" --name "$WORKER_NAME" >/tmp/secret-${name}.log
          }
          put_secret RESEND_API_KEY
          put_secret ADMIN_API_KEY
          put_secret RATE_LIMIT_SALT
          put_secret PASSWORD_PEPPER
          put_secret REVIEWER_API_KEY
          put_secret MODERATOR_API_KEY

      - name: Re-enable workers.dev and inspect secret names
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          curl -fsS "${auth[@]}" -X POST \
            --data '{"enabled":true,"previews_enabled":true}' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/pterminology-specialist-accounts/subdomain" \
            -o /tmp/subdomain.json
          curl -fsS "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/secrets" \
            -o /tmp/secrets.json
          python - <<'PY'
          import json
          subdomain=json.load(open('/tmp/subdomain.json',encoding='utf-8'))
          secrets=json.load(open('/tmp/secrets.json',encoding='utf-8'))
          assert subdomain.get('success') is True and (subdomain.get('result') or {}).get('enabled') is True, subdomain
          assert secrets.get('success') is True, secrets
          names=sorted(str(item.get('name') or '') for item in (secrets.get('result') or []))
          required={'RESEND_API_KEY','ADMIN_API_KEY','RATE_LIMIT_SALT'}
          missing=sorted(required-set(names))
          if missing:
              raise SystemExit('Known secret restoration incomplete: '+', '.join(missing))
          safe={
            'names':names,
            'known_required_present':True,
            'turnstile_present':'TURNSTILE_SECRET' in names,
            'workers_dev_enabled':True
          }
          open('/tmp/safe-known-secret-state.json','w',encoding='utf-8').write(json.dumps(safe,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(safe,ensure_ascii=False))
          PY

      - name: Commit safe restoration report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          state=json.load(open('/tmp/safe-known-secret-state.json',encoding='utf-8'))
          report={
            'schema_version':1,
            'restored_at':datetime.now(timezone.utc).isoformat(),
            'worker':'pterminology-specialist-accounts',
            'secret_values_not_recorded':True,
            'secret_names':state['names'],
            'known_required_present':state['known_required_present'],
            'turnstile_present':state['turnstile_present'],
            'workers_dev_enabled':state['workers_dev_enabled'],
            'passed':state['known_required_present'] and state['workers_dev_enabled']
          }
          open('reports/known-specialist-secrets-restored-now.json','w',encoding='utf-8').write(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/known-specialist-secrets-restored-now.json
          git commit -m "chore: record known specialist secret restoration [skip ci]"
          git push origin HEAD:agent/restore-known-specialist-secrets-now

      - name: Remove temporary output
        if: always()
        run: rm -f /tmp/secret-*.log /tmp/subdomain.json /tmp/secrets.json /tmp/safe-known-secret-state.json
