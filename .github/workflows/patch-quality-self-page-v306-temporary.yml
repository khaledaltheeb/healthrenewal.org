name: Apply quality audit self-page exclusion v306 temporary

on:
  push:
    branches: ["agent/outside-the-box-scientific-review-v305"]
    paths:
      - ".github/workflows/patch-quality-self-page-v306-temporary.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/outside-the-box-scientific-review-v305
          fetch-depth: 0
      - name: Patch one deterministic audit line
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/audit_outside_the_box_quality_v306.py')
          text = path.read_text(encoding='utf-8')
          old = '    pages = sorted(root.rglob("index.html"))\n'
          new = '    pages = sorted(path for path in root.rglob("index.html") if path.parent.name != ROUTE)\n'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('audit page selection anchor missing')
          path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile scripts/audit_outside_the_box_quality_v306.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/audit_outside_the_box_quality_v306.py
          git diff --cached --quiet && exit 0
          git commit -m "fix: exclude quality report from pre-render link metrics v306"
          git push origin HEAD:agent/outside-the-box-scientific-review-v305
