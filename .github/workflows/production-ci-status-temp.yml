name: Temporary production CI status probe

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  inspect:
    if: github.event.issue.title == '[diagnostic] production ci status 2026-07-31'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Inspect recent main runs
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?branch=main&per_page=100" \
            -o /tmp/runs.json
          python3 - <<'PY' > /tmp/report.txt
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/runs.json').read_text())
          runs=data.get('workflow_runs',[])
          print('Recent main workflow runs:')
          for r in runs[:60]:
              print('\t'.join(str(x) for x in (
                  r.get('id'), r.get('name'), r.get('head_sha'), r.get('event'),
                  r.get('status'), r.get('conclusion'), r.get('run_attempt'), r.get('html_url')
              )))
          latest_sha=runs[0].get('head_sha') if runs else ''
          print('\nLatest observed SHA:',latest_sha)
          relevant=[r for r in runs if r.get('head_sha')==latest_sha]
          print('Runs on latest observed SHA:',len(relevant))
          print('Failed/cancelled latest runs:')
          for r in relevant:
              if r.get('conclusion') in {'failure','cancelled','timed_out','action_required','startup_failure'}:
                  print(r.get('id'),r.get('name'),r.get('conclusion'),r.get('html_url'))
          PY

          python3 - <<'PY' >> /tmp/report.txt
          import json, os, urllib.request
          from pathlib import Path
          data=json.loads(Path('/tmp/runs.json').read_text())
          runs=data.get('workflow_runs',[])
          token=os.environ['GH_TOKEN']
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'ci-status-probe'}
          failed=[r for r in runs[:80] if r.get('conclusion') in {'failure','cancelled','timed_out','action_required','startup_failure'}]
          print('\nFailed run job summaries:')
          for run in failed[:20]:
              req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{run['id']}/jobs?per_page=100",headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=30) as response:
                      jobs=json.load(response).get('jobs',[])
              except Exception as exc:
                  print(run['id'],run.get('name'),'JOB_FETCH_ERROR',repr(exc)); continue
              bad=[j for j in jobs if j.get('conclusion') in {'failure','cancelled','timed_out','action_required','startup_failure'}]
              if not bad: continue
              print(f"RUN {run['id']} {run.get('name')} sha={run.get('head_sha')} conclusion={run.get('conclusion')}")
              for job in bad:
                  print(f"  JOB {job.get('id')} {job.get('name')} conclusion={job.get('conclusion')} url={job.get('html_url')}")
                  for step in job.get('steps',[]):
                      if step.get('conclusion') in {'failure','cancelled','timed_out','action_required','startup_failure'}:
                          print(f"    STEP {step.get('number')} {step.get('name')} conclusion={step.get('conclusion')}")
          PY

      - name: Publish status
        if: always()
        run: |
          python3 - <<'PY' >/tmp/body.json
          import json
          from pathlib import Path
          report=Path('/tmp/report.txt').read_text(errors='replace') if Path('/tmp/report.txt').exists() else 'No status report.'
          print(json.dumps({'body':'## Production CI status\n\n```text\n'+report[-60000:]+'\n```'}))
          PY
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            --data-binary @/tmp/body.json
