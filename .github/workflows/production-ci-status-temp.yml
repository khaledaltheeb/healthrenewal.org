name: Temporary production CI status probe

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  inspect:
    if: github.event.issue.title == '[diagnostic] production ci status 2026-07-31'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Inspect compact production pipeline status
        continue-on-error: true
        shell: bash
        run: |
          exec > >(tee /tmp/status.log) 2>&1
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" \
            -o /tmp/ref.json
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?branch=main&per_page=40" \
            -o /tmp/runs.json

          python3 - <<'PY' > /tmp/report.json
          import json, os, urllib.request
          from pathlib import Path

          repo=os.environ['GITHUB_REPOSITORY']
          token=os.environ['GH_TOKEN']
          head=json.loads(Path('/tmp/ref.json').read_text())['object']['sha']
          runs=json.loads(Path('/tmp/runs.json').read_text()).get('workflow_runs',[])
          relevant_names={
              'Validate every assessment and cognitive tool v31',
              'Audit production discovery contract v220',
              'Deploy validated main to GitHub Pages',
          }
          selected=[]
          for run in runs:
              if run.get('name') in relevant_names or run.get('head_sha')==head:
                  selected.append({
                      'id':run.get('id'),
                      'name':run.get('name'),
                      'head_sha':run.get('head_sha'),
                      'event':run.get('event'),
                      'status':run.get('status'),
                      'conclusion':run.get('conclusion'),
                      'attempt':run.get('run_attempt'),
                      'url':run.get('html_url'),
                  })
              if len(selected)>=20:
                  break

          headers={
              'Authorization':f'Bearer {token}',
              'Accept':'application/vnd.github+json',
              'X-GitHub-Api-Version':'2022-11-28',
              'User-Agent':'compact-ci-status-probe',
          }
          failures=[]
          for run in selected:
              if run['conclusion'] not in {'failure','cancelled','timed_out','action_required','startup_failure'}:
                  continue
              request=urllib.request.Request(f"https://api.github.com/repos/{repo}/actions/runs/{run['id']}/jobs?per_page=30",headers=headers)
              try:
                  with urllib.request.urlopen(request,timeout=20) as response:
                      jobs=json.load(response).get('jobs',[])
              except Exception as exc:
                  failures.append({'run_id':run['id'],'job_fetch_error':repr(exc)})
                  continue
              for job in jobs:
                  if job.get('conclusion') not in {'failure','cancelled','timed_out','action_required','startup_failure'}:
                      continue
                  failures.append({
                      'run_id':run['id'],
                      'workflow':run['name'],
                      'job_id':job.get('id'),
                      'job':job.get('name'),
                      'conclusion':job.get('conclusion'),
                      'failed_steps':[
                          {'number':step.get('number'),'name':step.get('name'),'conclusion':step.get('conclusion')}
                          for step in job.get('steps',[])
                          if step.get('conclusion') in {'failure','cancelled','timed_out','action_required','startup_failure'}
                      ],
                  })
          print(json.dumps({
              'main_head':head,
              'selected_runs':selected,
              'failed_jobs':failures,
          },indent=2))
          PY

      - name: Publish compact status
        if: always()
        shell: bash
        run: |
          python3 - <<'PY' >/tmp/body.json
          import json
          from pathlib import Path
          if Path('/tmp/report.json').exists():
              report=Path('/tmp/report.json').read_text(errors='replace')
          elif Path('/tmp/status.log').exists():
              report=Path('/tmp/status.log').read_text(errors='replace')[-20000:]
          else:
              report='No status report.'
          print(json.dumps({'body':'## Production CI status\n\n```json\n'+report[:30000]+'\n```'}))
          PY
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            --data-binary @/tmp/body.json
