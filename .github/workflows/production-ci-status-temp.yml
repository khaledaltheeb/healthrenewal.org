name: Temporary production v6 status probe

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/production-ci-status-temp.yml
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: temporary-production-v6-monitor
  cancel-in-progress: true

jobs:
  inspect:
    if: >-
      github.event_name != 'issues' ||
      github.event.issue.title == '[diagnostic] production v6 status'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number || 767 }}
    steps:
      - name: Follow current production v6 workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          issue = os.environ['ISSUE_NUMBER']
          workflow_name = 'Build complete institutional site v6 and deploy'
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'healthrenewal-production-v6-probe',
          }

          def api(path):
              req = urllib.request.Request(f'https://api.github.com/repos/{repo}{path}', headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.loads(response.read().decode('utf-8'))

          selected = None
          for _ in range(120):
              runs = api('/actions/runs?branch=main&per_page=100').get('workflow_runs', [])
              matches = [r for r in runs if r.get('name') == workflow_name]
              matches.sort(key=lambda r: r.get('created_at', ''), reverse=True)
              if matches:
                  selected = matches[0]
                  if selected.get('status') == 'completed':
                      break
              time.sleep(10)

          report = {'workflow': workflow_name, 'run': None, 'jobs': []}
          if selected:
              report['run'] = {k: selected.get(k) for k in ('id','head_sha','event','status','conclusion','run_attempt','created_at','updated_at','html_url')}
              jobs = api(f"/actions/runs/{selected['id']}/jobs?per_page=100").get('jobs', [])
              for job in jobs:
                  report['jobs'].append({
                      'id': job.get('id'),
                      'name': job.get('name'),
                      'status': job.get('status'),
                      'conclusion': job.get('conclusion'),
                      'html_url': job.get('html_url'),
                      'failed_steps': [
                          {'number': s.get('number'), 'name': s.get('name'), 'conclusion': s.get('conclusion')}
                          for s in job.get('steps', [])
                          if s.get('conclusion') in {'failure','cancelled','timed_out','action_required','startup_failure'}
                      ],
                  })

          body = '### Production v6 diagnostic\n\n```json\n' + json.dumps(report, ensure_ascii=False, indent=2) + '\n```'
          data = json.dumps({'body': body}).encode('utf-8')
          req = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/issues/{issue}/comments',
              data=data,
              method='POST',
              headers={**headers, 'Content-Type':'application/json'},
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              response.read()
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY
