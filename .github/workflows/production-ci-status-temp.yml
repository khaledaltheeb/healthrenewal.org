name: Temporary production CI status probe

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/production-ci-status-temp.yml
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: temporary-production-ci-monitor
  cancel-in-progress: true

jobs:
  inspect:
    if: >-
      github.event_name != 'issues' ||
      github.event.issue.title == '[diagnostic] production ci status 2026-07-31'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number || 767 }}
    steps:
      - name: Follow newest deployable main release pipeline
        continue-on-error: true
        shell: bash
        run: |
          exec > >(tee /tmp/status.log) 2>&1
          set -euo pipefail
          python3 - <<'PY' > /tmp/report.json
          from __future__ import annotations

          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          REPO = os.environ['GITHUB_REPOSITORY']
          TOKEN = os.environ['GH_TOKEN']
          API = f'https://api.github.com/repos/{REPO}'
          HEADERS = {
              'Authorization': f'Bearer {TOKEN}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'healthrenewal-production-monitor',
          }
          VALIDATE = 'Validate every assessment and cognitive tool v31'
          AUDIT = 'Audit production discovery contract v220'
          DEPLOY = 'Deploy validated main to GitHub Pages'
          BAD = {'failure', 'cancelled', 'timed_out', 'action_required', 'startup_failure'}
          ACCEPTABLE_VALIDATION_EVENTS = {'push', 'workflow_dispatch'}

          def api(path: str) -> dict:
              request = urllib.request.Request(API + path, headers=HEADERS)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.loads(response.read().decode('utf-8'))

          def current_head() -> str:
              return str(api('/git/ref/heads/main')['object']['sha'])

          def recent_runs() -> list[dict]:
              return list(api('/actions/runs?branch=main&per_page=100').get('workflow_runs', []))

          compare_cache: dict[tuple[str, str], bool] = {}

          def is_ancestor(candidate: str, head: str) -> bool:
              key = (candidate, head)
              if key in compare_cache:
                  return compare_cache[key]
              if candidate == head:
                  compare_cache[key] = True
                  return True
              candidate_q = urllib.parse.quote(candidate, safe='')
              head_q = urllib.parse.quote(head, safe='')
              try:
                  status = str(api(f'/compare/{candidate_q}...{head_q}').get('status', ''))
              except urllib.error.HTTPError as error:
                  if error.code in {404, 409, 422}:
                      compare_cache[key] = False
                      return False
                  raise
              result = status in {'ahead', 'identical'}
              compare_cache[key] = result
              return result

          def newest_validation(runs: list[dict], head: str) -> dict | None:
              candidates = [
                  run for run in runs
                  if run.get('name') == VALIDATE
                  and run.get('event') in ACCEPTABLE_VALIDATION_EVENTS
                  and isinstance(run.get('head_sha'), str)
                  and len(str(run.get('head_sha'))) == 40
              ]
              candidates.sort(key=lambda item: str(item.get('created_at', '')), reverse=True)
              for run in candidates:
                  if is_ancestor(str(run['head_sha']), head):
                      return run
              return None

          def newest_exact(runs: list[dict], name: str, sha: str) -> dict | None:
              matches = [
                  run for run in runs
                  if run.get('name') == name and run.get('head_sha') == sha
              ]
              matches.sort(key=lambda item: str(item.get('created_at', '')), reverse=True)
              return matches[0] if matches else None

          def compact(run: dict | None) -> dict | None:
              if not run:
                  return None
              return {
                  'id': run.get('id'),
                  'name': run.get('name'),
                  'head_sha': run.get('head_sha'),
                  'event': run.get('event'),
                  'status': run.get('status'),
                  'conclusion': run.get('conclusion'),
                  'attempt': run.get('run_attempt'),
                  'created_at': run.get('created_at'),
                  'url': run.get('html_url'),
              }

          def failed_jobs(run: dict) -> list[dict]:
              output = []
              for job in api(f"/actions/runs/{run['id']}/jobs?per_page=100").get('jobs', []):
                  if job.get('conclusion') not in BAD:
                      continue
                  output.append({
                      'job_id': job.get('id'),
                      'job': job.get('name'),
                      'conclusion': job.get('conclusion'),
                      'url': job.get('html_url'),
                      'failed_steps': [
                          {
                              'number': step.get('number'),
                              'name': step.get('name'),
                              'conclusion': step.get('conclusion'),
                          }
                          for step in job.get('steps', [])
                          if step.get('conclusion') in BAD
                      ],
                  })
              return output

          started = time.time()
          observed_main = ''
          release_sha = ''
          observations = []
          result = {
              'status': 'timed-out',
              'main_head': None,
              'release_sha': None,
              'release_is_ancestor_of_main': False,
              'validation': None,
              'discovery_audit': None,
              'pages_deployment': None,
              'failed_jobs': [],
              'head_changes': [],
              'release_changes': [],
          }

          while time.time() - started < 3600:
              try:
                  head = current_head()
                  if head != observed_main:
                      if observed_main:
                          result['head_changes'].append({'from': observed_main, 'to': head})
                      observed_main = head
                      compare_cache.clear()
                      print(f'Current main head: {observed_main}', flush=True)

                  runs = recent_runs()
                  validation = newest_validation(runs, observed_main)
                  candidate_release = str(validation.get('head_sha')) if validation else ''
                  if candidate_release and candidate_release != release_sha:
                      if release_sha:
                          result['release_changes'].append({'from': release_sha, 'to': candidate_release})
                      release_sha = candidate_release
                      print(f'Following deployable release SHA: {release_sha}', flush=True)

                  audit = newest_exact(runs, AUDIT, release_sha) if release_sha else None
                  deploy = newest_exact(runs, DEPLOY, release_sha) if release_sha else None
                  ancestor = bool(release_sha and is_ancestor(release_sha, observed_main))
                  result.update({
                      'main_head': observed_main,
                      'release_sha': release_sha or None,
                      'release_is_ancestor_of_main': ancestor,
                      'validation': compact(validation),
                      'discovery_audit': compact(audit),
                      'pages_deployment': compact(deploy),
                  })

                  snapshot = (
                      observed_main,
                      release_sha or None,
                      validation.get('status') if validation else None,
                      validation.get('conclusion') if validation else None,
                      audit.get('status') if audit else None,
                      audit.get('conclusion') if audit else None,
                      deploy.get('status') if deploy else None,
                      deploy.get('conclusion') if deploy else None,
                  )
                  if not observations or observations[-1] != snapshot:
                      observations.append(snapshot)
                      print(snapshot, flush=True)

                  if validation and validation.get('status') == 'completed':
                      if validation.get('conclusion') in BAD:
                          result['status'] = 'validation-failed'
                          result['failed_jobs'] = failed_jobs(validation)
                          break
                      if validation.get('conclusion') == 'success':
                          if audit and audit.get('status') == 'completed':
                              if audit.get('conclusion') in BAD:
                                  result['status'] = 'discovery-audit-failed'
                                  result['failed_jobs'] = failed_jobs(audit)
                                  break
                              if audit.get('conclusion') == 'success':
                                  if deploy and deploy.get('status') == 'completed':
                                      if deploy.get('conclusion') == 'success':
                                          result['status'] = 'passed'
                                      else:
                                          result['status'] = 'pages-deployment-failed'
                                          result['failed_jobs'] = failed_jobs(deploy)
                                      break
              except (urllib.error.URLError, TimeoutError, KeyError, ValueError) as error:
                  print(f'Monitor retry after error: {error!r}', flush=True)
              time.sleep(20)

          result['observations'] = [list(item) for item in observations[-40:]]
          result['elapsed_seconds'] = round(time.time() - started, 1)
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: Publish final monitor result
        if: always()
        shell: bash
        run: |
          python3 - <<'PY' >/tmp/body.json
          import json
          from pathlib import Path
          if Path('/tmp/report.json').exists():
              report=Path('/tmp/report.json').read_text(errors='replace')
          elif Path('/tmp/status.log').exists():
              report=Path('/tmp/status.log').read_text(errors='replace')[-25000:]
          else:
              report='No status report.'
          print(json.dumps({'body':'## Production pipeline monitor\n\n```json\n'+report[:45000]+'\n```'}))
          PY
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            --data-binary @/tmp/body.json
