name: Verify CI concurrency contract (historical hotfix)

# Historical one-shot hotfix retained for auditability. The original issue-triggered
# workflow could write directly to main after its concurrency change was already
# present, and GitHub was recording configuration-failure runs on subsequent pushes.
# Keep the record, but make future execution explicit, read-only, and deterministic.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify latest-only concurrency contract
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/validate-all-labs-v22.yml')
          text = path.read_text(encoding='utf-8')
          expected_group = (
              'group: validate-all-labs-v31-'
              + '$'
              + '{{ github.event.pull_request.number || github.ref }}'
          )
          assert text.count('concurrency:') == 1, text.count('concurrency:')
          assert expected_group in text
          assert 'cancel-in-progress: true' in text
          print('Concurrency contract is present; no mutation required.')
          PY

      - name: Prove historical verifier is source read-only
        run: |
          set -euxo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain)"
