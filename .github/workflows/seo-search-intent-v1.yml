name: SEO search intent v1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**/*.html"
      - "scripts/fix_specific_seo_warnings_v1.py"
      - "scripts/materialize_sectors_v10_compat_v4.py"
      - "tests/test_materialize_sectors_v10_compat_v4.py"
      - "content/seo-priority-urls.txt"
      - ".github/workflows/seo-search-intent-v1.yml"
  pull_request:
    branches: [main]
    paths:
      - "**/*.html"
      - "scripts/fix_specific_seo_warnings_v1.py"
      - "scripts/materialize_sectors_v10_compat_v4.py"
      - "tests/test_materialize_sectors_v10_compat_v4.py"
      - "content/seo-priority-urls.txt"
      - ".github/workflows/seo-search-intent-v1.yml"

permissions:
  contents: read

concurrency:
  group: seo-search-intent-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Compile reviewed SEO contracts
        run: |
          python -m py_compile \
            scripts/audit_seo_intent_v1.py \
            scripts/fix_specific_seo_warnings_v1.py \
            scripts/materialize_sectors_v10_compat_v4.py \
            scripts/enforce_sitewide_heading_intent_v2.py \
            tests/test_materialize_sectors_v10_compat_v4.py

      - name: Validate governed page regeneration
        run: python -m unittest tests.test_materialize_sectors_v10_compat_v4 -v

      - name: Confirm reviewed page-specific SEO state
        run: python scripts/fix_specific_seo_warnings_v1.py --check

      - name: Audit priority search intent
        run: python scripts/audit_seo_intent_v1.py --scope priority --strict --report /tmp/seo-intent-priority-v1.json

      - name: Audit complete sitemap search intent
        run: python scripts/audit_seo_intent_v1.py --scope all --strict --report /tmp/seo-intent-all-v1.json

      - name: Validate heading contract without rewriting pages
        run: python scripts/enforce_sitewide_heading_intent_v2.py --check --report /tmp/sitewide-heading-intent-v2.json

      - name: Prove validation is non-mutating
        run: git diff --exit-code

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-search-intent-validation-${{ github.sha }}
          path: |
            /tmp/seo-intent-priority-v1.json
            /tmp/seo-intent-all-v1.json
            /tmp/sitewide-heading-intent-v2.json
          if-no-files-found: ignore
          retention-days: 30
