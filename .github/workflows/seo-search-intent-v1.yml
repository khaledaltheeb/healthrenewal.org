name: SEO search intent v1

on:
  workflow_dispatch:
  push:
    branches:
      - feat/sitewide-seo-intent-contract-v1-20260801
    paths:
      - ".seo-bundle/**"
      - "scripts/audit_seo_intent_v1.py"
      - "scripts/enhance_search_intent_v1.py"
      - "tests/test_seo_intent_contract_v1.py"
      - "content/seo-priority-urls.txt"
      - "docs/SEO_SEARCH_INTENT_CONTRACT.md"
      - "family-guide/**"
      - "magazine/**"
      - "sitemap*.xml"
      - ".github/workflows/seo-search-intent-v1.yml"
  pull_request:
    paths:
      - ".seo-bundle/**"
      - "scripts/audit_seo_intent_v1.py"
      - "scripts/enhance_search_intent_v1.py"
      - "tests/test_seo_intent_contract_v1.py"
      - "content/seo-priority-urls.txt"
      - "docs/SEO_SEARCH_INTENT_CONTRACT.md"
      - "family-guide/**"
      - "magazine/**"
      - "sitemap*.xml"
      - ".github/workflows/seo-search-intent-v1.yml"

permissions:
  contents: write

concurrency:
  group: seo-search-intent-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Materialize verified contract scripts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scripts
          cat .seo-bundle/chunks/audit.* | base64 --decode | gzip --decompress > scripts/audit_seo_intent_v1.py
          cat .seo-bundle/chunks/enhance.* | base64 --decode | gzip --decompress > scripts/enhance_search_intent_v1.py
          echo "260b35428135d49b0b767f0e85c0ddf30db05d7c8a41f8e532fbaf6c05488386  scripts/audit_seo_intent_v1.py" | sha256sum --check
          echo "6c99043a2d0734ad749c2b787799221037eca11c87faad701c82ebd7953ec7c4  scripts/enhance_search_intent_v1.py" | sha256sum --check
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/enhance_search_intent_v1.py")
          source = path.read_text(encoding="utf-8")
          old = '''def iter_family_pages() -> Iterable[Path]:
              for path in sorted(FAMILY_ROOT.glob("*/index.html")):
                  if path.with_name("data.js").is_file():
                      yield path
          '''
          new = '''def iter_family_pages() -> Iterable[Path]:
              for path in sorted(FAMILY_ROOT.glob("*/index.html")):
                  if not path.with_name("data.js").is_file():
                      continue
                  source = path.read_text(encoding="utf-8")
                  if re.search(r'<meta\\s+name=["\\\']robots["\\\'][^>]*noindex', source, flags=re.I):
                      continue
                  yield path
          '''
          if old not in source:
              raise SystemExit("Expected family iterator contract was not found")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY
          chmod +x scripts/audit_seo_intent_v1.py scripts/enhance_search_intent_v1.py

      - name: Compile contract scripts
        run: python -m py_compile scripts/audit_seo_intent_v1.py scripts/enhance_search_intent_v1.py

      - name: Run contract tests
        run: python -m unittest tests.test_seo_intent_contract_v1 -v

      - name: Generate deterministic search-intent surface
        run: python scripts/enhance_search_intent_v1.py --write

      - name: Audit the 100 priority URLs
        run: python scripts/audit_seo_intent_v1.py --scope priority --report reports/seo-intent-priority-v1.json

      - name: Audit the complete sitemap surface
        run: python scripts/audit_seo_intent_v1.py --scope all --report reports/seo-intent-all-v1.json

      - name: Check generated diff
        run: git diff --check

      - name: Commit generated pages, scripts, and audit reports
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        shell: bash
        run: |
          git rm -r .seo-bundle
          git add scripts family-guide magazine reports tests content docs .github/workflows/seo-search-intent-v1.yml
          if git diff --cached --quiet; then
            echo "Generated surface is current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "feat(seo): pre-render intent content and audit priority URLs"
            git push origin "HEAD:${BRANCH}"
          fi

      - name: Enforce priority contract
        run: python scripts/audit_seo_intent_v1.py --scope priority --strict --report reports/seo-intent-priority-v1.json

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-search-intent-v1-${{ github.sha }}
          path: |
            reports/seo-intent-priority-v1.json
            reports/seo-intent-priority-v1.md
            reports/seo-intent-all-v1.json
            reports/seo-intent-all-v1.md
          retention-days: 30
