name: SEO search intent v1

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "**/*.html"
      - "scripts/**"
      - "tests/test_seo_intent_contract_v1.py"
      - "tests/test_sitewide_heading_intent_v2.py"
      - "content/seo-priority-urls.txt"
      - "docs/SEO_SEARCH_INTENT_CONTRACT.md"
      - "sitemap*.xml"
      - ".github/workflows/seo-search-intent-v1.yml"
  pull_request:
    branches:
      - main
    paths:
      - "**/*.html"
      - "scripts/**"
      - "tests/test_seo_intent_contract_v1.py"
      - "tests/test_sitewide_heading_intent_v2.py"
      - "content/seo-priority-urls.txt"
      - "docs/SEO_SEARCH_INTENT_CONTRACT.md"
      - "sitemap*.xml"
      - ".github/workflows/seo-search-intent-v1.yml"

permissions:
  contents: write

concurrency:
  group: seo-search-intent-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Compile and syntax-check generators
        run: |
          python -m py_compile \
            scripts/audit_seo_intent_v1.py \
            scripts/enhance_search_intent_v1.py \
            scripts/upgrade_magazine_intent_v2.py \
            scripts/apply_static_seo_fixes_v1.py \
            scripts/deduplicate_phase8_sitemap_v1.py \
            scripts/remediate_seo_warnings_v1.py \
            scripts/summarize_seo_warnings_v1.py \
            scripts/enforce_sitewide_heading_intent_v2.py
          node --check scripts/prerender_provider_assessment_v1.js

      - name: Run semantic contract tests
        run: |
          python -m unittest tests.test_seo_intent_contract_v1 -v
          python -m unittest tests.test_sitewide_heading_intent_v2 -v

      - name: Deduplicate phase 8 sitemap ownership
        run: python scripts/deduplicate_phase8_sitemap_v1.py --write

      - name: Apply static sitemap and hub migration
        run: python scripts/apply_static_seo_fixes_v1.py --write

      - name: Pre-render family condition content
        run: python scripts/enhance_search_intent_v1.py --write

      - name: Upgrade every magazine research article
        run: python scripts/upgrade_magazine_intent_v2.py --write

      - name: Pre-render provider assessment pathways
        run: node scripts/prerender_provider_assessment_v1.js --write

      - name: Resolve remaining title description and image warnings
        run: python scripts/remediate_seo_warnings_v1.py --write

      - name: Enforce H1 H2 H3 and search-intent questions on every indexable page
        run: python scripts/enforce_sitewide_heading_intent_v2.py --write --report reports/sitewide-heading-intent-v2.json

      - name: Normalize generated fallback whitespace
        run: |
          python - <<'PY'
          from pathlib import Path

          marker = 'data-sitewide-heading-intent="v2"'
          for path in Path(".").rglob("*.html"):
              source = path.read_text(encoding="utf-8")
              if marker not in source:
                  continue
              trailing_newline = source.endswith("\n")
              normalized = "\n".join(line.rstrip() for line in source.splitlines())
              if trailing_newline:
                  normalized += "\n"
              if normalized != source:
                  path.write_text(normalized, encoding="utf-8")
          PY

      - name: Record the stable final heading state
        run: python scripts/enforce_sitewide_heading_intent_v2.py --check --report reports/sitewide-heading-intent-v2.json

      - name: Audit the 100 priority URLs
        run: python scripts/audit_seo_intent_v1.py --scope priority --report reports/seo-intent-priority-v1.json

      - name: Audit the complete sitemap surface
        run: python scripts/audit_seo_intent_v1.py --scope all --report reports/seo-intent-all-v1.json

      - name: Normalize report timestamps
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in (Path("reports/seo-intent-priority-v1.json"), Path("reports/seo-intent-all-v1.json")):
              payload = json.loads(path.read_text(encoding="utf-8"))
              payload["summary"]["generated_at"] = "2026-08-01T00:00:00+00:00"
              path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Summarize all warnings by code and URL
        run: |
          python scripts/summarize_seo_warnings_v1.py reports/seo-intent-priority-v1.json reports/seo-warnings-priority-v1.json
          python scripts/summarize_seo_warnings_v1.py reports/seo-intent-all-v1.json reports/seo-warnings-all-v1.json

      - name: Enforce zero unresolved warnings
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          failed = []
          for path in (Path("reports/seo-warnings-priority-v1.json"), Path("reports/seo-warnings-all-v1.json")):
              payload = json.loads(path.read_text(encoding="utf-8"))
              if payload["warnings"]:
                  failed.append(f"{path}: {payload['warnings']} warnings")
          if failed:
              raise SystemExit("\n".join(failed))
          PY

      - name: Check generated diff
        run: git diff --check

      - name: Commit generated pages, sources, and reports
        env:
          BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        shell: bash
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Generated surface is current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "feat(seo): complete sitemap semantic and search-intent migration"
            git push origin "HEAD:${BRANCH}"
          fi

      - name: Enforce the priority contract
        run: python scripts/audit_seo_intent_v1.py --scope priority --strict --report reports/seo-intent-priority-v1.json

      - name: Enforce the complete sitemap contract
        run: python scripts/audit_seo_intent_v1.py --scope all --strict --report reports/seo-intent-all-v1.json

      - name: Enforce the sitewide heading and question contract
        run: python scripts/enforce_sitewide_heading_intent_v2.py --check --report reports/sitewide-heading-intent-v2.json

      - name: Verify deterministic composed generation
        if: success()
        run: |
          python scripts/deduplicate_phase8_sitemap_v1.py --write
          python scripts/apply_static_seo_fixes_v1.py --write
          python scripts/enhance_search_intent_v1.py --write
          python scripts/upgrade_magazine_intent_v2.py --write
          node scripts/prerender_provider_assessment_v1.js --write
          python scripts/remediate_seo_warnings_v1.py --write
          python scripts/enforce_sitewide_heading_intent_v2.py --write --report reports/sitewide-heading-intent-v2.json
          git diff --exit-code -- . \
            ':!reports/seo-intent-priority-v1.json' \
            ':!reports/seo-intent-priority-v1.md' \
            ':!reports/seo-intent-all-v1.json' \
            ':!reports/seo-intent-all-v1.md'

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-search-intent-v1-${{ github.sha }}
          path: |
            reports/sitewide-heading-intent-v2.json
            reports/seo-intent-priority-v1.json
            reports/seo-intent-priority-v1.md
            reports/seo-intent-all-v1.json
            reports/seo-intent-all-v1.md
            reports/seo-warnings-priority-v1.json
            reports/seo-warnings-priority-v1.md
            reports/seo-warnings-all-v1.json
            reports/seo-warnings-all-v1.md
          retention-days: 30
