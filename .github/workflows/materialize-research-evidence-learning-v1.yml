name: Materialize research evidence learning v1

on:
  push:
    branches: [main]
    paths:
      - 'scripts/publish_research_evidence_learning_v1.py'
      - 'scripts/build_research_evidence_learning_v2.py'
      - 'scripts/enrich_research_evidence_learning_v1.py'
      - 'scripts/finalize_research_evidence_learning_hub_v3.py'
      - '.github/workflows/materialize-research-evidence-learning-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-research-evidence-learning-v1
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build, enrich and normalize evidence library
        run: |
          set -euo pipefail
          python -m py_compile scripts/publish_research_evidence_learning_v1.py scripts/build_research_evidence_learning_v2.py scripts/enrich_research_evidence_learning_v1.py scripts/finalize_research_evidence_learning_hub_v3.py
          python scripts/build_research_evidence_learning_v2.py .
          python scripts/enrich_research_evidence_learning_v1.py .
          python scripts/finalize_research_evidence_learning_hub_v3.py .
      - name: Final quality, SEO and anti-duplication gate
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          section = Path('sections/research-evidence-learning')
          pages = sorted(section.glob('*/index.html'))
          assert len(pages) >= 500, len(pages)
          hub = (section / 'index.html').read_text(encoding='utf-8')
          expected_hub_title = f'<title>البحث والدليل والتعلم | {len(pages)} دليل لفهم الدراسات وتقييم الأدلة | منصة روافد</title>'
          assert expected_hub_title in hub, expected_hub_title
          assert f'{len(pages)} دليل منهجي' in hub
          assert f'"numberOfItems":{len(pages)}' in hub

          titles, canonicals, descriptions = [], [], []
          paragraph_sets = {}
          minimum_words = 10**9
          for page in pages:
              source = page.read_text(encoding='utf-8')
              visible = re.sub(r'\s+', ' ', re.sub(r'<[^>]+>', ' ', source)).strip()
              wc = len(re.findall(r'[\u0600-\u06FFA-Za-z0-9]+', visible))
              minimum_words = min(minimum_words, wc)
              assert wc >= 850, (page, wc)
              titles.append(re.search(r'<title>(.*?)</title>', source, re.S).group(1))
              canonicals.append(re.search(r'<link rel="canonical" href="([^"]+)"', source).group(1))
              descriptions.append(re.search(r'<meta name="description" content="([^"]+)"', source).group(1))
              assert source.count('<h1>') == 1, page
              assert source.count('<!-- research-evidence-editorial-v2 -->') == 1, page
              assert 'index,follow' in source, page
              assert 'application/ld+json' in source, page
              assert 'BreadcrumbList' in source, page
              assert source.count('rel="noopener noreferrer"') >= 3, page
              paras = {
                  re.sub(r'\s+', ' ', re.sub(r'<[^>]+>', ' ', p)).strip()
                  for p in re.findall(r'<p\b[^>]*>(.*?)</p>', source, re.S | re.I)
              }
              paragraph_sets[page.parent.name] = {p for p in paras if len(p) >= 80}
          assert len(set(titles)) == len(pages)
          assert len(set(canonicals)) == len(pages)
          assert len(set(descriptions)) == len(pages)

          names = sorted(paragraph_sets)
          worst = (0.0, '', '')
          for i, left in enumerate(names):
              a = paragraph_sets[left]
              for right in names[i + 1:]:
                  b = paragraph_sets[right]
                  union = a | b
                  score = len(a & b) / len(union) if union else 1.0
                  if score > worst[0]: worst = (score, left, right)
          assert worst[0] < 0.72, worst

          report = {
              'schemaVersion': 3,
              'status': 'passed',
              'sectionUrl': 'https://healthrenewal.org/sections/research-evidence-learning/',
              'minimumChildPages': 500,
              'childPages': len(pages),
              'hubPages': 1,
              'totalPages': len(pages) + 1,
              'hubCountSynchronized': True,
              'uniqueTitles': len(set(titles)),
              'uniqueUrls': len(set(canonicals)),
              'uniqueDescriptions': len(set(descriptions)),
              'minimumWordCount': minimum_words,
              'maxParagraphJaccard': round(worst[0], 4),
              'editorialDiversification': True,
              'sourcePolicy': 'institutional-primary-methodology-sources',
              'seo': {'canonical': True, 'robotsIndexFollow': True, 'metaDescription': True, 'openGraph': True, 'twitter': True, 'jsonLd': True, 'breadcrumbs': True, 'itemList': True},
          }
          Path('api').mkdir(exist_ok=True)
          Path('api/research-evidence-learning-v1.json').write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(report)
          PY
      - name: Commit deterministic publication
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sections/research-evidence-learning api/research-evidence-learning-v1.json
          if git diff --cached --quiet; then
            echo 'Research evidence learning publication is already current.'
          else
            git commit -m 'content: materialize research evidence learning library'
            git push
          fi