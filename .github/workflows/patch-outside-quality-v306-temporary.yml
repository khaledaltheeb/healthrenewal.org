name: Wire outside-the-box quality audit v306 temporary

on:
  push:
    branches: ["agent/outside-the-box-scientific-review-v305"]
    paths:
      - ".github/workflows/patch-outside-quality-v306-temporary.yml"

permissions:
  contents: write

jobs:
  patch-quality-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/outside-the-box-scientific-review-v305
          fetch-depth: 0
      - name: Patch production and deterministic audit
        run: |
          python - <<'PY'
          from pathlib import Path

          audit = Path('scripts/audit_outside_the_box_quality_v306.py')
          text = audit.read_text(encoding='utf-8')
          old = '    html_pages = sorted(root.rglob("index.html"))\n'
          new = '    html_pages = sorted(path for path in root.rglob("index.html") if path.parent.name != ROUTE)\n'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('quality audit page-selection anchor missing')

          start = text.index('def publish(site: Path) -> dict[str, Any]:')
          end = text.index('\ndef main() -> int:', start)
          replacement = '''def publish(site: Path) -> dict[str, Any]:
              site = site.resolve()
              root = site / SECTION
              if not root.is_dir():
                  raise ValueError("Outside-the-box section is missing")
              target = root / ROUTE
              target.mkdir(parents=True, exist_ok=True)
              placeholder = "<!doctype html><html lang=\"ar\" dir=\"rtl\"><head><meta charset=\"utf-8\"><title>تدقيق الجودة</title></head><body><main><h1>تدقيق الجودة</h1></main></body></html>"
              if not (target / "index.html").is_file():
                  (target / "index.html").write_text(placeholder, encoding="utf-8")

              hub_path = root / "index.html"
              hub_block = f"""{HUB_START}<section class="rg-section" data-quality-audit-v306><div class="rg-wrap"><p class="rg-kicker">تدقيق بعد النشر</p><h2>فحص اكتمال الصفحات والروابط والواجهات</h2><p class="rg-muted">اجتاز القسم تدقيقًا آليًا للصفحات المئة والخطط الألف والروابط وSEO والإتاحة وتطابق واجهات البيانات، مع إبقاء الفجوات العلمية المتبقية معلنة.</p><div class="rg-actions"><a class="rg-button secondary" href="{ROUTE}/">فتح تقرير الجودة</a></div></div></section>{HUB_END}"""
              hub_path.write_text(replace_marker(hub_path.read_text(encoding="utf-8"), HUB_START, HUB_END, hub_block), encoding="utf-8")
              review_path = root / "review-governance/index.html"
              review_block = f"""{REVIEW_START}<section class="rg-section" data-quality-audit-v306><div class="rg-wrap"><p class="rg-kicker">تدقيق التكامل</p><h2>العقد التقني والمنهجي مفحوص</h2><p class="rg-muted">الأخطاء الحرجة في المخرج الحالي: 0. هذا لا يغير حالة المراجعة التخصصية المستقلة، التي تبقى غير مكتملة ومعلنة.</p><div class="rg-actions"><a class="rg-button secondary" href="../{ROUTE}/">فتح تقرير التدقيق</a></div></div></section>{REVIEW_END}"""
              review_path.write_text(replace_marker(review_path.read_text(encoding="utf-8"), REVIEW_START, REVIEW_END, review_block), encoding="utf-8")
              update_sitemap(site)

              report = audit(site)
              if report["critical_error_count"]:
                  raise ValueError(json.dumps(report["errors"], ensure_ascii=False, indent=2))
              quality_html = render_page(report)
              if quality_html.count("<h1") != 1 or 'rel="canonical"' not in quality_html or '<html lang="ar" dir="rtl">' not in quality_html:
                  raise ValueError("Quality audit page shell is incomplete")
              (target / "index.html").write_text(quality_html, encoding="utf-8")
              api = site / "api"
              (api / "outside-the-box-quality-audit-v306.json").write_text(json.dumps(report, ensure_ascii=False, indent=2) + "\\n", encoding="utf-8")
              patch_summary(site, report)
              final = audit(site)
              if final["critical_error_count"]:
                  raise ValueError(json.dumps(final["errors"], ensure_ascii=False, indent=2))
              return report

'''
          replacement = '\n'.join(line[14:] if line.startswith('              ') else line for line in replacement.splitlines()) + '\n\n'
          text = text[:start] + replacement + text[end + 1:]
          audit.write_text(text, encoding='utf-8')

          home = Path('scripts/apply_homepage_v20.py')
          text = home.read_text(encoding='utf-8')
          old_meta = '        "outside_the_box_review_governance_publisher": 305,\n'
          new_meta = old_meta + '        "outside_the_box_quality_audit": 306,\n'
          if '"outside_the_box_quality_audit": 306' not in text:
              if text.count(old_meta) != 1:
                  raise SystemExit('review metadata anchor missing or ambiguous')
              text = text.replace(old_meta, new_meta, 1)
          old_run = '    run_publisher("publish_outside_the_box_review_governance_v305.py")\n'
          new_run = old_run + '    run_publisher("audit_outside_the_box_quality_v306.py")\n'
          if 'run_publisher("audit_outside_the_box_quality_v306.py")' not in text:
              if text.count(old_run) != 1:
                  raise SystemExit('review publisher run anchor missing or ambiguous')
              text = text.replace(old_run, new_run, 1)
          home.write_text(text, encoding='utf-8')
          PY
          python -m py_compile scripts/audit_outside_the_box_quality_v306.py scripts/apply_homepage_v20.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/audit_outside_the_box_quality_v306.py scripts/apply_homepage_v20.py
          git diff --cached --quiet && exit 0
          git commit -m "fix: make post-publication quality audit deterministic v306"
          git push origin HEAD:agent/outside-the-box-scientific-review-v305
