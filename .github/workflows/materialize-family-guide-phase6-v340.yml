name: Materialize family guide phase six v340

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/materialize-family-guide-phase6-v340.yml"
      - "family-guide/**"
      - "api/family-guide-v1.json"
      - "sitemap-family-guide.xml"
      - "tests/test_family_guide_v335.py"

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/family-guide-phase6-v340
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild 48-condition inventory
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re
          from xml.sax.saxutils import escape
          root=Path('.')
          version='1.5.0'; review_date='2026-07-30'
          new_slugs=['satb2-associated-syndrome','mbd5-haploinsufficiency','adnp-syndrome','dyrk1a-syndrome','med13l-syndrome','christianson-syndrome','coffin-siris-syndrome','wiedemann-steiner-syndrome']
          api_path=root/'api/family-guide-v1.json'; api=json.loads(api_path.read_text(encoding='utf-8'))
          old=[x['slug'] for x in api['conditions']]; order=old+[x for x in new_slugs if x not in old]
          assert len(order)==48 and len(order)==len(set(order)),len(order)
          pattern=re.compile(r'\}\)\((\{.*\})\);\s*$',re.S); objects={}
          for slug in order:
            path=root/'family-guide/conditions'/slug/'data.js'; assert path.is_file(),path
            m=pattern.search(path.read_text(encoding='utf-8')); assert m,slug
            objects[slug]=json.loads(m.group(1)); assert objects[slug]['slug']==slug
          fd=root/'family-guide/family-guide-data.js'; current=json.loads(fd.read_text(encoding='utf-8').strip().split('=',1)[1].rstrip(';'))
          payload={'version':version,'reviewed_at':review_date,'methodology':current['methodology'],'conditions':[{k:objects[s][k] for k in ['slug','title','en','classification','summary']} for s in order]}
          fd.write_text('window.FAMILY_GUIDE_DATA='+json.dumps(payload,ensure_ascii=False,separators=(',',':'))+';\n',encoding='utf-8')
          base='https://khaledaltheeb.github.io/pterminology-site/family-guide/conditions/'
          api['version']=version; api['reviewed_at']=review_date
          api['conditions']=[{'slug':s,'title':objects[s]['title'],'en':objects[s]['en'],'classification':objects[s]['classification'],'summary':objects[s]['summary'],'url':base+s+'/','data_url':base+s+'/data.js'} for s in order]
          api_path.write_text(json.dumps(api,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          lines=['<?xml version="1.0" encoding="UTF-8"?>','<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">',f'  <url><loc>https://khaledaltheeb.github.io/pterminology-site/family-guide/</loc><lastmod>{review_date}</lastmod><changefreq>monthly</changefreq><priority>1.0</priority></url>']
          lines += [f'  <url><loc>{escape(base+s+"/")}</loc><lastmod>{review_date}</lastmod><changefreq>monthly</changefreq><priority>0.9</priority></url>' for s in order]
          lines += [f'  <url><loc>https://khaledaltheeb.github.io/pterminology-site/family-guide/tools/{t}/</loc><lastmod>{review_date}</lastmod><changefreq>monthly</changefreq><priority>0.75</priority></url>' for t in ['family-plan','behavior-log','appointment-prep']]
          lines.append('</urlset>'); (root/'sitemap-family-guide.xml').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          p=root/'family-guide/index.html'; text=p.read_text(encoding='utf-8')
          text=text.replace('عبر 40 دليلًا أسريًا','عبر 48 دليلًا أسريًا').replace('"numberOfItems":40','"numberOfItems":48').replace('يضم الإصدار الحالي 40 دليلًا','يضم الإصدار الحالي 48 دليلًا').replace('40 دليلًا منشورًا وقابلًا للتوسع','48 دليلًا منشورًا وقابلًا للتوسع')
          text=re.sub(r'family-guide-data\.js\?v=[0-9.]+',f'family-guide-data.js?v={version}',text); p.write_text(text,encoding='utf-8')
          assert '48 دليلًا' in text and '"numberOfItems":48' in text
          p=root/'tests/test_family_guide_v335.py'; text=p.read_text(encoding='utf-8')
          text=re.sub(r"assert api\['version'\]=='[^']+'","assert api['version']=='1.5.0'",text); text=re.sub(r"assert len\(api\['conditions'\]\)==\d+","assert len(api['conditions'])==48",text); p.write_text(text,encoding='utf-8')
          p=root/'family-guide/README.md'; text=p.read_text(encoding='utf-8'); text=re.sub(r'# دليل الأسرة v\d+','# دليل الأسرة v340',text); text=re.sub(r'- \d+ دليل حالة منشورًا','- 48 دليل حالة منشورًا',text); p.write_text(text,encoding='utf-8')
          print({'conditions':len(order),'version':version})
          PY
      - name: Validate generated inventory
        run: |
          python tests/test_family_guide_v335.py
          node --check family-guide/family-guide-data.js
          for file in family-guide/conditions/*/data.js; do node --check "$file"; done
          python - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('sitemap-family-guide.xml')
          print({'xml':'passed'})
          PY
      - name: Commit inventory files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/family-guide-v1.json family-guide/family-guide-data.js family-guide/index.html family-guide/README.md sitemap-family-guide.xml tests/test_family_guide_v335.py
          if git diff --cached --quiet; then echo "Inventory already materialized"; exit 0; fi
          git commit -m "feat: expand family guide inventory to 48 conditions v340"
          git pull --rebase origin agent/family-guide-phase6-v340
          git push origin HEAD:agent/family-guide-phase6-v340
