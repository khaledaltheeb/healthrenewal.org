name: Verify live special-needs publication v1

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/verify-live-special-needs-publication-v1.yml"
      - "scripts/verify_live_special_needs_publication_v1.py"
      - "tests/test_verify_live_special_needs_publication_v1.py"
  workflow_run:
    workflows: ["Deploy complete generated site"]
    types: [completed]
  schedule:
    - cron: "47 */6 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: live-special-needs-publication-proof-${{ github.event_name }}-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: true

jobs:
  validate-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile and test the live verifier
        run: |
          set -euo pipefail
          python -m py_compile scripts/verify_live_special_needs_publication_v1.py
          python -m unittest tests.test_verify_live_special_needs_publication_v1

  verify-live:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout verifier source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Wait for the matching canonical Pages deployment
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 180); do
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-complete-pages-with-ai-search.yml/runs?branch=main&event=push&per_page=30" \
              > /tmp/pages-runs.json
            set +e
            python - <<'PY'
          import json
          import os

          payload = json.load(open("/tmp/pages-runs.json", encoding="utf-8"))
          candidates = [
              run for run in payload.get("workflow_runs", [])
              if run.get("head_sha") == os.environ["BASE_SHA"]
          ]
          if not candidates:
              print({"base_sha": os.environ["BASE_SHA"], "deployment_run": "not-found"})
              raise SystemExit(2)
          run = max(candidates, key=lambda value: value.get("created_at", ""))
          summary = {
              key: run.get(key)
              for key in (
                  "id",
                  "event",
                  "status",
                  "conclusion",
                  "head_sha",
                  "created_at",
                  "run_started_at",
                  "updated_at",
                  "html_url",
              )
          }
          print(summary)
          if run.get("status") != "completed":
              raise SystemExit(2)
          if run.get("conclusion") != "success":
              raise SystemExit(1)
          PY
            code=$?
            set -e
            if [ "$code" = 0 ]; then
              ready=1
              break
            fi
            if [ "$code" = 1 ]; then
              echo "The matching canonical Pages deployment failed."
              exit 1
            fi
            sleep 5
          done
          test "$ready" = 1
      - name: Verify every published special-needs route
        run: |
          set -euo pipefail
          python scripts/verify_live_special_needs_publication_v1.py \
            --base-url https://healthrenewal.org \
            --timeout 25 \
            --retries 3 \
            --workers 10
