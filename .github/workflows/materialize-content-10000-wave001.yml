name: Materialize content 10000 wave001

on:
  push:
    branches: [main]
    paths:
      - 'content/strategy/content-10000-master-plan-v1.json'
      - 'content/strategy/source-registry-wave001-v1.json'
      - 'scripts/publish_content_10000_wave001.py'
      - 'scripts/diversify_content_10000_wave001_v2.py'
      - '.github/workflows/materialize-content-10000-wave001.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-content-10000-wave001
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and diversify wave001 into repository
        run: |
          set -euo pipefail
          python -m py_compile scripts/publish_content_10000_wave001.py scripts/diversify_content_10000_wave001_v2.py
          rm -rf care-guides/clinical-literacy
          python scripts/publish_content_10000_wave001.py .
          python scripts/diversify_content_10000_wave001_v2.py .
      - name: Final publication gate
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          section = Path('care-guides/clinical-literacy')
          pages = sorted(section.glob('*/index.html'))
          assert len(pages) == 66, len(pages)
          assert (section / 'index.html').is_file()
          titles, descriptions, canonicals = [], [], []
          paragraph_sets = {}
          minimum_words = 10**9
          minimum_sources = 10**9
          for page in pages:
              source = page.read_text(encoding='utf-8')
              visible = re.sub(r'\s+', ' ', re.sub(r'<[^>]+>', ' ', source)).strip()
              wc = len(re.findall(r'[\w\u0600-\u06ff]+', visible, re.UNICODE))
              minimum_words = min(minimum_words, wc)
              assert wc >= 1400, (page, wc)
              assert source.count('<!-- content-10000-wave001 -->') == 1, page
              assert source.count('<!-- content-10000-wave001-v2 -->') == 1, page
              assert 'index,follow' in source, page
              assert 'application/ld+json' in source, page
              assert 'BreadcrumbList' in source, page
              source_count = source.count('rel="noopener noreferrer"')
              minimum_sources = min(minimum_sources, source_count)
              assert source_count >= 3, (page, source_count)
              titles.append(re.search(r'<title>(.*?)</title>', source, re.S).group(1))
              descriptions.append(re.search(r'<meta name="description" content="([^"]+)"', source).group(1))
              canonicals.append(re.search(r'<link rel="canonical" href="([^"]+)"', source).group(1))
              paras = {
                  re.sub(r'\s+', ' ', re.sub(r'<[^>]+>', ' ', p)).strip()
                  for p in re.findall(r'<p\b[^>]*>(.*?)</p>', source, re.S | re.I)
              }
              paragraph_sets[page.parent.name] = {p for p in paras if len(p) >= 80}
          assert len(set(titles)) == 66
          assert len(set(descriptions)) == 66
          assert len(set(canonicals)) == 66
          names = sorted(paragraph_sets)
          worst = (0.0, '', '')
          for i, left in enumerate(names):
              a = paragraph_sets[left]
              for right in names[i+1:]:
                  b = paragraph_sets[right]
                  union = a | b
                  score = len(a & b) / len(union) if union else 1.0
                  if score > worst[0]:
                      worst = (score, left, right)
          assert worst[0] < 0.60, worst
          report = {
              'schemaVersion': 1,
              'program': 'content-10000',
              'wave': '001',
              'status': 'passed',
              'childPages': 66,
              'hubPages': 1,
              'totalPages': 67,
              'minimumWordCount': minimum_words,
              'minimumSourcesPerPage': minimum_sources,
              'uniqueTitles': len(set(titles)),
              'uniqueDescriptions': len(set(descriptions)),
              'uniqueCanonicals': len(set(canonicals)),
              'maxParagraphJaccard': round(worst[0], 4),
              'antiDuplicationLimit': 0.60,
              'editorialV2': True,
              'sourceFirst': True,
              'intentFirst': True,
          }
          Path('api/content-10000-wave001.json').parent.mkdir(parents=True, exist_ok=True)
          Path('api/content-10000-wave001.json').write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(report)
          PY
      - name: Commit deterministic publication with safe retry
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          snapshot="${RUNNER_TEMP}/content-10000-wave001.tar"
          tar -cf "$snapshot" care-guides/clinical-literacy api/content-10000-wave001.json

          for attempt in 1 2 3; do
            echo "Publication push attempt ${attempt}/3"
            git fetch origin main --depth=1
            git reset --hard origin/main
            rm -rf care-guides/clinical-literacy
            rm -f api/content-10000-wave001.json
            tar -xf "$snapshot"
            git add care-guides/clinical-literacy api/content-10000-wave001.json

            if git diff --cached --quiet; then
              echo 'Publication already present on latest main'
              exit 0
            fi

            git commit -m 'content: materialize content 10000 wave001'
            if git push origin HEAD:main; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo 'Failed to publish after 3 non-force retries' >&2
              exit 1
            fi
          done
