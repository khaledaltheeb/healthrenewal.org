name: One-shot expose SEO idempotency paths v216

on:
  push:
    branches: ["agent/sitewide-seo-v216"]
    paths:
      - ".github/workflows/one-shot-expose-seo-idempotency-v216.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sitewide-seo-v216
          fetch-depth: 0
      - name: Add exact idempotency paths to verification report
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/verify_sitewide_seo_v216.py")
          text = path.read_text(encoding="utf-8")
          old = '        "idempotency_failure_count": len(set(idempotency_failures)),\n        "failure_count": len(failures),'
          new = '        "idempotency_failure_count": len(set(idempotency_failures)),\n        "idempotency_failures": sorted(set(idempotency_failures))[:300],\n        "failure_count": len(failures),'
          if old not in text and '"idempotency_failures": sorted(set(idempotency_failures))[:300]' not in text:
              raise SystemExit("Idempotency report insertion point not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          rm .github/workflows/one-shot-expose-seo-idempotency-v216.yml
      - name: Commit diagnostic improvement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify_sitewide_seo_v216.py .github/workflows/one-shot-expose-seo-idempotency-v216.yml
          git commit -m "SEO: report exact idempotency failure paths"
          git push origin HEAD:agent/sitewide-seo-v216
