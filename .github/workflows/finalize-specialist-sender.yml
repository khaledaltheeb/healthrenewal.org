name: Finalize verified specialist sender

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/finalize-specialist-sender.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-specialist-sender
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Pin verified production sender
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/deploy-specialist-identity-v10-production.yml')
          lines = path.read_text(encoding='utf-8').splitlines()
          matches = [index for index, line in enumerate(lines) if line.strip().startswith('FROM_EMAIL:')]
          if len(matches) != 1:
              raise SystemExit(f'Expected one FROM_EMAIL environment line, found {len(matches)}')
          lines[matches[0]] = '      FROM_EMAIL: "PTerminology <no-reply@healthrenewal.org>"'
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/deploy-specialist-identity-v10-production.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: pin verified specialist sender"
          for attempt in {1..5}; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            sleep $((attempt * 3))
          done
          exit 1
