name: Transfer magazine v331 onto latest main temporary

on:
  push:
    branches: ["agent/magazine-school-writing-rct-v331-final"]
    paths:
      - ".github/workflows/transfer-magazine-v331-temporary.yml"

permissions:
  contents: write

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/magazine-school-writing-rct-v331-final
          fetch-depth: 0
      - name: Copy the five isolated magazine files from the reviewed branch
        run: |
          set -euxo pipefail
          git fetch origin agent/magazine-school-writing-rct-v331-clean
          for path in \
            .github/workflows/validate-magazine-research-v234.yml \
            .github/workflows/verify-magazine-live-v314.yml \
            magazine/adolescent-school-guided-narrative-writing-cluster-rct-2026.html \
            tests/test_magazine_research_v234.py \
            tests/test_platform_identity_v201.py
          do
            git show origin/agent/magazine-school-writing-rct-v331-clean:"${path}" > "${path}"
          done
          python -m py_compile tests/test_magazine_research_v234.py tests/test_platform_identity_v201.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/validate-magazine-research-v234.yml .github/workflows/verify-magazine-live-v314.yml magazine/adolescent-school-guided-narrative-writing-cluster-rct-2026.html tests/test_magazine_research_v234.py tests/test_platform_identity_v201.py
          git diff --cached --quiet && exit 0
          git commit -m "content: transfer school narrative-writing reading v331"
          git push origin HEAD:agent/magazine-school-writing-rct-v331-final
