name: Build Rawafid identity rollout

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: rawafid-brand-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply-brand:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'brand/rawafid-full-site'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Rawafid rollout branch
        uses: actions/checkout@v4
        with:
          ref: brand/rawafid-full-site
          fetch-depth: 0

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Arabic fonts and renderers
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core fonts-noto-extra libcairo2
          python -m pip install --upgrade pip
          python -m pip install pillow cairosvg

      - name: Apply approved Rawafid identity
        run: python scripts/apply_rawafid_brand.py

      - name: Validate rollout
        run: |
          python -m py_compile scripts/apply_rawafid_brand.py
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('reports/rawafid-brand-rollout.json').read_text(encoding='utf-8'))
          assert report['html_files'] > 0, report
          assert report['stale_brand_files'] == 0, report
          assert report['html_files_enriched'] > 0, report
          print(report)
          PY
          test -s assets/brand/logo-mark.svg
          test -s assets/brand/logo-lockup.svg
          test -s assets/brand/rawafid-mark.png
          test -s assets/brand/rawafid-logo.png
          test -s assets/brand/rawafid-social-card.jpg
          test -s favicon.ico
          test -s manifest.webmanifest

      - name: Commit generated site-wide identity
        run: |
          git config user.name "Rawafid Brand Automation"
          git config user.email "actions@users.noreply.github.com"
          git restore --source=HEAD --worktree --staged .github
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "feat(brand): adopt Rawafid identity across the full site"
          git push origin HEAD:brand/rawafid-full-site
