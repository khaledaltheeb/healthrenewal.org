name: Quick Info production v2 finalizer

on:
  workflow_run:
    workflows:
      - Recover richest historical content and deploy complete site
    types:
      - completed

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: quick-info-production-v2
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}

    steps:
      - name: Checkout exact deployed source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Refuse stale source revision
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          current_sha="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" \
            | python -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')"
          test "${current_sha}" = "${SOURCE_SHA}"
          echo "source_sha=${SOURCE_SHA}" >> "${GITHUB_OUTPUT}"
          echo "Finalizing current main at ${SOURCE_SHA}."

      - name: Download validated production artifact
        uses: actions/download-artifact@v4
        with:
          name: validated-production-site
          path: _site
          repository: khaledaltheeb/healthrenewal.org
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile finalizer and canonical runtime helpers
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/upgrade_quick_info_production_v2.py \
            scripts/normalize_platform_shell.py \
            scripts/inject_google_tag_manager.py

      - name: Upgrade every recovered Quick Info article
        run: |
          set -euo pipefail
          test -f _site/api/v1/quick-info.json
          test "$(find _site/quick-info -mindepth 2 -maxdepth 2 -name index.html | wc -l)" -eq 395
          python scripts/upgrade_quick_info_production_v2.py --root _site --repo-root .

      - name: Enforce V2 people-first quality contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          import xml.etree.ElementTree as ET

          report = json.loads(Path('_site/api/quick-info-upgrade-v2.json').read_text(encoding='utf-8'))
          manifest = json.loads(Path('_site/api/v2/quick-info.json').read_text(encoding='utf-8'))

          assert report['status'] == 'passed', report
          assert report['pages'] == 395, report
          assert report['primaryPages'] == 250, report
          assert report['historicalRecoveredPages'] == 145, report
          assert report['minimumWords'] >= 1700, report
          assert report['medianWords'] >= 1700, report
          assert report['hubRecoveredLinks'] == 145, report
          assert report['sectionSitemapUrls'] == 396, report
          assert report['repeatedV2ParagraphGroups'] == 0, report
          assert report['runtimePages'] == 396, report
          assert report['failures'] == [], report

          assert manifest['version'] == '2.0.0', manifest
          assert manifest['count'] == 395, manifest
          assert manifest['primaryCount'] == 250, manifest
          assert manifest['historicalRecoveredCount'] == 145, manifest
          assert len(manifest['items']) == 395, manifest
          assert min(item['words'] for item in manifest['items']) >= 1700
          assert len({item['slug'] for item in manifest['items']}) == 395

          ns = {'sm': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
          root = ET.parse('_site/sitemap-quick-info.xml').getroot()
          locations = [node.text or '' for node in root.findall('sm:url/sm:loc', ns)]
          assert len(locations) == 396, len(locations)
          assert len(locations) == len(set(locations)), 'duplicate Quick Info sitemap locations'
          assert 'https://healthrenewal.org/quick-info/' in locations

          print({k: v for k, v in report.items() if k != 'failures'})
          PY

          test "$(grep -rl 'QUICK_INFO_LONGFORM_V2_START' _site/quick-info/*/index.html | wc -l)" -eq 395
          test "$(grep -rl 'QUICK_INFO_LONGFORM_V1_START' _site/quick-info/*/index.html | wc -l)" -eq 0
          test "$(grep -rl 'GTM-WBLQVBG4' _site/quick-info/index.html _site/quick-info/*/index.html | wc -l)" -eq 396
          test "$(grep -rl 'G-VLZMV8Y4JP' _site/quick-info/index.html _site/quick-info/*/index.html | wc -l)" -eq 396
          test "$(grep -rl 'pt-platform-shell:v1' _site/quick-info/index.html _site/quick-info/*/index.html | wc -l)" -eq 396
          grep -q '145 صفحة إضافية' _site/quick-info/index.html
          grep -q '395 صفحة' _site/quick-info/index.html

      - name: Preserve V2 diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: quick-info-production-v2-${{ github.event.workflow_run.id }}
          path: |
            _site/api/quick-info-upgrade-v2.json
            _site/api/v2/quick-info.json
            _site/sitemap-quick-info.xml
          retention-days: 90

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload V2 production artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy Quick Info V2 validated production
    needs: finalize
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Refuse stale deployment if main advanced
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.finalize.outputs.source_sha }}
        run: |
          set -euo pipefail
          current_sha="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" \
            | python -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')"
          test "${current_sha}" = "${SOURCE_SHA}"

      - name: Deploy V2 production artifact
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify V2 live on the public domain
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 80); do
            nonce="${GITHUB_RUN_ID}-${attempt}-$(date +%s%N)"
            if curl -fsSL --retry 2 -H 'Cache-Control: no-cache' \
              "https://healthrenewal.org/api/quick-info-upgrade-v2.json?release=${nonce}" \
              -o /tmp/quick-info-v2.json \
              && curl -fsSL --retry 2 -H 'Cache-Control: no-cache' \
              "https://healthrenewal.org/quick-info/fatigue-or-laziness/?release=${nonce}" \
              -o /tmp/recovered-page.html \
              && curl -fsSL --retry 2 -H 'Cache-Control: no-cache' \
              "https://healthrenewal.org/quick-info/sadness-vs-depression/?release=${nonce}" \
              -o /tmp/primary-page.html; then
              if python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/quick-info-v2.json').read_text(encoding='utf-8'))
          assert report['status'] == 'passed', report
          assert report['pages'] == 395, report
          assert report['primaryPages'] == 250, report
          assert report['historicalRecoveredPages'] == 145, report
          assert report['minimumWords'] >= 1700, report
          assert report['repeatedV2ParagraphGroups'] == 0, report
          for filename in ('/tmp/recovered-page.html', '/tmp/primary-page.html'):
              source = Path(filename).read_text(encoding='utf-8')
              assert 'QUICK_INFO_LONGFORM_V2_START' in source
              assert 'GTM-WBLQVBG4' in source
              assert 'G-VLZMV8Y4JP' in source
              assert 'pt-platform-shell:v1' in source
          print(report)
          PY
              then
                ready=1
                break
              fi
            fi
            sleep 4
          done
          test "$ready" = 1
