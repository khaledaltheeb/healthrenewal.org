name: Diagnose E5 deployment workflow runs

on:
  pull_request:
    paths:
      - '.github/workflows/diagnose-e5-deploy-runs-temp.yml'

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    if: github.head_ref == 'agent/e5-live-diagnose-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/e5-live-diagnose-v2
          fetch-depth: 0
      - name: Query deployment workflow runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p reports
          curl -fsS \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-semantic-search-live.yml/runs?per_page=20" \
            -o /tmp/runs.json
          python - <<'PY'
          import datetime,json
          data=json.load(open('/tmp/runs.json',encoding='utf-8'))
          rows=[]
          for run in data.get('workflow_runs',[]):
              rows.append({key:run.get(key) for key in ('id','name','event','status','conclusion','run_number','run_attempt','head_branch','head_sha','created_at','updated_at','run_started_at','html_url','jobs_url')})
          report={'schemaVersion':1,'checkedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'totalCount':data.get('total_count'),'runs':rows}
          open('reports/e5-deploy-workflow-runs.json','w',encoding='utf-8').write(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - name: Commit workflow run report
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/e5-deploy-workflow-runs.json
          git commit -m 'diagnose: record E5 deployment workflow runs'
          git push origin HEAD:agent/e5-live-diagnose-v2
