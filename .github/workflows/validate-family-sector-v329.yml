name: Validate family mental-health sector v329

on:
  pull_request:
    branches: [main]
    paths:
      - "sectors/family/**"
      - "sectors/index.html"
      - "scripts/verify_family_sector_v329.py"
      - "tests/test_family_sector_v329.py"
      - ".github/workflows/validate-family-sector-v329.yml"
  push:
    branches: [main]
    paths:
      - "sectors/family/**"
      - "sectors/index.html"
      - "scripts/verify_family_sector_v329.py"
      - "tests/test_family_sector_v329.py"
      - ".github/workflows/validate-family-sector-v329.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: family-sector-v329-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Compile verifier and tests
        run: python3 -m py_compile scripts/verify_family_sector_v329.py tests/test_family_sector_v329.py
      - name: Run family-sector contract
        id: contract
        shell: bash
        run: |
          set +e
          python3 scripts/verify_family_sector_v329.py --json > /tmp/family-sector-v329-report.json 2>&1
          code=$?
          cat /tmp/family-sector-v329-report.json
          printf 'exit_code=%s\n' "$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload exact contract report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: family-sector-v329-report
          path: /tmp/family-sector-v329-report.json
          if-no-files-found: error
          retention-days: 7
      - name: Enforce contract
        if: steps.contract.outputs.exit_code != '0'
        run: exit 1
      - name: Run regression tests
        run: python3 -m unittest -v tests.test_family_sector_v329
      - name: Verify publication wiring
        run: |
          set -euxo pipefail
          test -s sectors/family/index.html
          test -s sectors/family/library/index.html
          test -s sectors/family/assessment/index.html
          test -s sectors/family/interventions/index.html
          test -s sectors/family/assets/family-sector.css
          grep -q 'href="family/"' sectors/index.html
          grep -q 'MedicalWebPage' sectors/family/index.html
          grep -q 'FAQPage' sectors/family/index.html
          grep -q 'لا تعني مراجعة علاجية خارجية مستقلة' sectors/family/index.html
          grep -q 'family-sector-a11y-scroll-v329' sectors/family/assets/family-sector.css
          ! grep -R -n 'noindex' sectors/family
          ! grep -R -n 'href="#"' sectors/family
