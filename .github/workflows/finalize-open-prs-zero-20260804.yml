name: Finalize open PRs to zero

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-open-prs-zero-20260804.yml

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  consolidate:
    if: github.event.head_commit.message == 'chore: run final PR consolidation'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: final-open-pr-consolidation
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Preserve, consolidate, publish and close
        shell: bash
        run: bash .github/scripts/finalize-open-prs-zero-20260804.sh
