name: Validate security disclosure contract

on:
  pull_request:
    paths:
      - 'SECURITY.md'
      - 'security.txt'
      - '.well-known/security.txt'
      - '.github/ISSUE_TEMPLATE/security-contact.yml'
      - '.generator-v6/part03'
      - 'docs/innovation-register.md'
      - 'scripts/validate_security_disclosure.py'
      - '.github/workflows/validate-security-disclosure.yml'
  push:
    branches: [main]
    paths:
      - 'SECURITY.md'
      - 'security.txt'
      - '.well-known/security.txt'
      - '.github/ISSUE_TEMPLATE/security-contact.yml'
      - '.generator-v6/part03'
      - 'docs/innovation-register.md'
      - 'scripts/validate_security_disclosure.py'
      - '.github/workflows/validate-security-disclosure.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile validator
        run: python -m py_compile scripts/validate_security_disclosure.py
      - name: Validate disclosure contract
        run: python scripts/validate_security_disclosure.py
      - name: Reconstruct and compile production generator
        run: |
          cat .generator-v6/part* > /tmp/build_site.py
          python -m py_compile /tmp/build_site.py
      - name: Verify machine-readable files in production output
        run: |
          rm -rf _site
          python /tmp/build_site.py
          test -f _site/security.txt
          test -f _site/.well-known/security.txt
          cmp security.txt _site/security.txt
          cmp security.txt _site/.well-known/security.txt
          test "$(find _site -mindepth 1 | wc -l)" -eq 510
