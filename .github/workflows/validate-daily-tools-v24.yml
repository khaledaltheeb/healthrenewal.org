name: Validate daily tools catalog v100

on:
  pull_request:
    branches: ["main"]
    paths:
      - "content/v24/daily-tools-v100/**"
      - "content/v24/daily-tools-sources-v100.json"
      - "content/v24/daily-tools-learning-paths-ar.json"
      - "scripts/publish_daily_tools_v24.py"
      - "scripts/daily_tools_v100.py"
      - "scripts/audit_daily_tools_quality_v100.py"
      - "scripts/publish_daily_tools_v24_core.py"
      - "scripts/verify_daily_tools_v24.py"
      - "scripts/apply_daily_tools_marshmallow_v219.py"
      - "scripts/expose_daily_tools_home_v219.py"
      - ".github/workflows/validate-daily-tools-v24.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-tools-v100-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile and validate source catalog
        run: |
          set -euxo pipefail
          python -m py_compile \
            scripts/publish_daily_tools_v24.py \
            scripts/daily_tools_v100.py \
            scripts/audit_daily_tools_quality_v100.py \
            scripts/publish_daily_tools_v24_core.py \
            scripts/verify_daily_tools_v24.py \
            scripts/apply_daily_tools_marshmallow_v219.py \
            scripts/expose_daily_tools_home_v219.py
          grep -q 'CATALOG_CONTRACT = 100' scripts/daily_tools_v100.py
          grep -q 'daily-tools-v100' scripts/daily_tools_v100.py
          python scripts/verify_daily_tools_v24.py
          python scripts/audit_daily_tools_quality_v100.py

      - name: Validate current homepage integration
        run: |
          set -u
          mkdir -p _audit
          cp index.html /tmp/daily-tools-index-before.html
          cp scripts/verify_homepage_v19.py /tmp/daily-tools-home-verifier-before.py
          status=0
          {
            echo '=== expose daily tools on current homepage ==='
            python scripts/expose_daily_tools_home_v219.py || status=$?
            echo '=== verify current homepage ==='
            python scripts/verify_homepage_v19.py || status=$?
            echo '=== diff check ==='
            git diff --check || status=$?
            echo "status=$status"
          } > _audit/daily-tools-homepage-integration.log 2>&1
          cat _audit/daily-tools-homepage-integration.log
          cp index.html _audit/daily-tools-homepage-after.html
          cp scripts/verify_homepage_v19.py _audit/daily-tools-home-verifier-after.py
          cp /tmp/daily-tools-index-before.html index.html
          cp /tmp/daily-tools-home-verifier-before.py scripts/verify_homepage_v19.py
          exit "$status"

      - name: Generate production pages in isolated homepage fixture
        run: |
          set -euxo pipefail
          rm -rf _site
          mkdir -p _site
          cat > _site/sitemap.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <sitemapindex xmlns="http://www.sitemaps.org/schemas/sitemap/0.9"></sitemapindex>
          XML
          cat > _site/index.html <<'HTML'
          <!doctype html><html lang="ar" dir="rtl"><head><title>منصة اختبار</title>
          <meta name="keywords" content="الصحة النفسية">
          <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"CollectionPage","@id":"https://healthrenewal.org/#home","hasPart":[]}]}</script>
          </head><body><nav><a href="provider-assessment-demo/">منصة التقييم</a></nav>
          <article><a href="cognitive-tests/">فتح المهام</a></article></body></html>
          HTML
          python scripts/publish_daily_tools_v24.py _site
          python scripts/verify_daily_tools_v24.py _site

      - name: Check counts privacy metadata and discovery
        run: |
          set -euxo pipefail
          python - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path
          report=json.loads(Path('_site/api/daily-tools-v24.json').read_text(encoding='utf-8'))
          quality=json.loads(Path('_audit/daily-tools-quality-v100.json').read_text(encoding='utf-8'))
          assert report['catalog_contract']==100,report
          assert report['tools']>=100 and report['categories']>=10 and report['paths']>=10,report
          assert report['pages']==report['tools']+report['paths']+2,report
          assert len(list(Path('_site/daily-tools').glob('*/index.html')))+1==report['tools']+1
          assert len(list(Path('_site/learning-paths').glob('*/index.html')))+1==report['paths']+1
          root=ET.parse('_site/sitemap-tools-paths.xml').getroot()
          assert len(list(root))==report['pages']
          assert report['local_only'] and report['search_and_filters'] and report['per_tool_sources']
          assert report['homepage_linked'] and report['marshmallow_palette']
          assert quality['status']=='passed' and quality['tools']==report['tools'],quality
          assert quality['near_duplicate_pairs']==[],quality
          assert quality['minimum_sources_per_tool']>=2,quality
          print(report)
          print(quality)
          PY
          grep -R -q 'data-catalog="daily-tools-v100"' _site/daily-tools _site/learning-paths
          grep -q 'data-tool-search' _site/daily-tools/index.html
          grep -q 'data-category-select' _site/daily-tools/index.html
          grep -R -q 'لا تُرسل البيانات إلى خادم' _site/daily-tools
          ! grep -R -Eqi 'text-shadow|rgba\(0[[:space:]]*,[[:space:]]*0[[:space:]]*,[[:space:]]*0|fetch\(|XMLHttpRequest|navigator\.sendBeacon|تشخيصك|يعالج نهائيًا|بديل عن الطبيب' \
            _site/daily-tools _site/learning-paths

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-tools-v100-preview
          path: |
            _audit/daily-tools-quality-v100.json
            _audit/daily-tools-homepage-integration.log
            _audit/daily-tools-homepage-after.html
            _audit/daily-tools-home-verifier-after.py
            _site/index.html
            _site/daily-tools
            _site/learning-paths
            _site/sitemap-tools-paths.xml
            _site/api/daily-tools-v24.json
          if-no-files-found: warn
          retention-days: 14
