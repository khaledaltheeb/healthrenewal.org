name: Validate 100 Arabic learning paths v326

on:
  pull_request:
    branches: ["main"]
    paths:
      - "content/v24/**"
      - "content/v326/learning-paths/**"
      - "scripts/publish_daily_tools_v24.py"
      - "scripts/publish_daily_tools_v24_core.py"
      - "scripts/publish_learning_paths_v326.py"
      - "scripts/learning_paths_catalog_v326.py"
      - "scripts/verify_daily_tools_v24.py"
      - "scripts/apply_daily_tools_marshmallow_v219.py"
      - "scripts/expose_daily_tools_home_v219.py"
      - ".github/workflows/validate-daily-tools-v24.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: learning-paths-v326-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile and validate source catalog
        run: |
          set -euxo pipefail
          python -m py_compile \
            scripts/publish_daily_tools_v24.py \
            scripts/publish_daily_tools_v24_core.py \
            scripts/publish_learning_paths_v326.py \
            scripts/learning_paths_catalog_v326.py \
            scripts/verify_daily_tools_v24.py \
            scripts/apply_daily_tools_marshmallow_v219.py \
            scripts/expose_daily_tools_home_v219.py
          grep -q 'SEO_CONTRACT = 326' scripts/publish_daily_tools_v24.py
          grep -q 'publish_learning_paths' scripts/publish_daily_tools_v24.py
          python scripts/verify_daily_tools_v24.py

      - name: Generate pages in an isolated homepage fixture
        run: |
          set -euxo pipefail
          rm -rf _site
          mkdir -p _site
          cat > _site/sitemap.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <sitemapindex xmlns="http://www.sitemaps.org/schemas/sitemap/0.9"></sitemapindex>
          XML
          cat > _site/index.html <<'HTML'
          <!doctype html><html lang="ar" dir="rtl"><head><title>منصة اختبار</title>
          <meta name="keywords" content="الصحة النفسية">
          <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"CollectionPage","@id":"https://khaledaltheeb.github.io/pterminology-site/#home","hasPart":[]}]}</script>
          </head><body><nav><a href="provider-assessment-demo/">منصة التقييم</a></nav>
          <article><a href="cognitive-tests/">فتح المهام</a></article></body></html>
          HTML
          python scripts/publish_daily_tools_v24.py _site
          python scripts/verify_daily_tools_v24.py _site

      - name: Check count SEO discovery privacy and prohibited claims
        run: |
          set -euxo pipefail
          test "$(find _site/daily-tools -name index.html | wc -l)" -eq 9
          test "$(find _site/learning-paths -name index.html | wc -l)" -eq 101
          test "$(grep -o '<url>' _site/sitemap-tools-paths.xml | wc -l)" -eq 110
          test "$(grep -R -l 'class=\"module\"' _site/learning-paths/*/index.html | wc -l)" -eq 100
          grep -q '100 مسار تعلم' _site/learning-paths/index.html
          grep -q 'مئة مسار تعلم مؤسسي' _site/index.html
          grep -R -q 'data-design="marshmallow-v219"' _site/daily-tools _site/learning-paths
          grep -R -q 'data-seo="institutional-v326"' _site/daily-tools _site/learning-paths
          ! grep -R -Eqi 'text-shadow|rgba\(0[[:space:]]*,[[:space:]]*0[[:space:]]*,[[:space:]]*0|fetch\(|XMLHttpRequest|navigator\.sendBeacon|تشخيصك|يعالج نهائيًا|بديل عن الطبيب' \
            _site/daily-tools _site/learning-paths
          grep -R -q 'لا تُرسل البيانات إلى خادم' _site/daily-tools
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('_site/api/daily-tools-v24.json').read_text(encoding='utf-8'))
          assert report['learning_paths_catalog_version']==326,report
          assert report['tools']==8 and report['paths']==100 and report['pages']==110,report
          assert report['path_categories']==10 and report['path_sources']>=20,report
          print(report)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: learning-paths-v326-preview
          path: |
            _site/index.html
            _site/daily-tools
            _site/learning-paths
            _site/sitemap-tools-paths.xml
            _site/api/daily-tools-v24.json
          if-no-files-found: warn
          retention-days: 14
