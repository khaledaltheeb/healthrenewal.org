name: Temporary diagnose encyclopedia patch transport

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect transported chunk digests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/804/comments?per_page=100" \
            -o /tmp/pr-comments.json
          python - <<'PY'
          import base64
          import hashlib
          import json
          import re
          from pathlib import Path

          expected = {
              0: (9000, 'a1f7a3b5bda959b89e7cdd82e171028bdb37eee2bc9c6bdeb15dc3ef4929ccd1'),
              1: (9000, 'd8ed396dfd17b8ec86dd1608e7dea67fec07fe89ef9080a10231af6f6ed25ebb'),
              2: (9000, '1c88bb3f86348bc3112ff7eae39e12ab1640c0c3e0a078b607c3a7acf5047ea0'),
              3: (9000, '915137c6aabde0d1756dfefc06acdfbbc11ea9a5960fdaef5b372e83d2061cc9'),
              4: (9000, 'ea3b03abb2f24935919d2300988885c0c2a13791b42694430d0293125740e5b6'),
              5: (5696, '54c748b0f87dd91c6ec065bb3a1e51468efbed6ffe9e3adafd355b1cce05a315'),
          }
          comments = json.loads(Path('/tmp/pr-comments.json').read_text(encoding='utf-8'))
          pattern = re.compile(r'^ENCYPATCH-V1-(\d{2})-OF-06\n([A-Za-z0-9+/=]+)\s*$')
          chunks = {}
          for item in comments:
              match = pattern.match(str(item.get('body') or ''))
              if match:
                  chunks[int(match.group(1))] = match.group(2)
          failures = []
          for index in range(6):
              value = chunks.get(index, '')
              digest = hashlib.sha256(value.encode('ascii')).hexdigest()
              actual = (len(value), digest)
              print({'index': index, 'actual': actual, 'expected': expected[index], 'matches': actual == expected[index]})
              if actual != expected[index]:
                  failures.append(index)
          encoded = ''.join(chunks[index] for index in range(6))
          raw = base64.b64decode(encoded, validate=True)
          print({'raw_bytes': len(raw), 'raw_sha256': hashlib.sha256(raw).hexdigest(), 'bad_chunks': failures})
          if failures:
              raise SystemExit(f'Corrupt chunks: {failures}')
          PY
