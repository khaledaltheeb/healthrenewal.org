name: Validate institutional sectors portal v327

on:
  pull_request:
    branches: [main]
    paths:
      - "sectors/index.html"
      - "scripts/verify_sectors_portal_v327.py"
      - "tests/test_sectors_portal_v327.py"
      - ".github/workflows/validate-sectors-portal-v327.yml"
  push:
    branches: [main]
    paths:
      - "sectors/index.html"
      - "scripts/verify_sectors_portal_v327.py"
      - "tests/test_sectors_portal_v327.py"
      - ".github/workflows/validate-sectors-portal-v327.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sectors-portal-v327-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Compile portal verifier and tests
        run: |
          python3 --version
          python3 -m py_compile \
            scripts/verify_sectors_portal_v327.py \
            tests/test_sectors_portal_v327.py

      - name: Verify portal contract and capture report
        id: portal_contract
        shell: bash
        run: |
          set +e
          python3 scripts/verify_sectors_portal_v327.py --json \
            > /tmp/sectors-portal-v327-report.json 2>&1
          code=$?
          cat /tmp/sectors-portal-v327-report.json
          printf 'exit_code=%s\n' "$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload exact portal report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sectors-portal-v327-report
          path: /tmp/sectors-portal-v327-report.json
          if-no-files-found: error
          retention-days: 7

      - name: Enforce portal contract
        if: steps.portal_contract.outputs.exit_code != '0'
        run: |
          echo "Sectors portal v327 contract failed; inspect the uploaded report."
          exit 1

      - name: Run mutation and regression tests
        run: python3 -m unittest -v tests.test_sectors_portal_v327

      - name: Verify production discovery and platform-shell markers
        run: |
          set -euxo pipefail
          grep -q 'href="sectors/"' index.html
          grep -q '"sectors/"' scripts/audit_publication_surface_v322.py
          grep -q 'https://healthrenewal.org/sectors/' sectors/index.html
          grep -q '"@type":"ItemList"' sectors/index.html
          grep -q '"@type":"FAQPage"' sectors/index.html
          grep -q 'مراجعة تحريرية ومنهجية داخلية' sectors/index.html
          grep -q '<!-- pt-platform-shell:v1 -->' sectors/index.html
          grep -q 'data-pt-normalized="1.1.0"' sectors/index.html
          ! grep -q 'noindex' sectors/index.html
