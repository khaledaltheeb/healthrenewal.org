name: Audit Cloudflare email service v1

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/audit-cloudflare-email-service-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: audit-cloudflare-email-service-v1
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '826ac34927c1e045c06145a327c2ac52' }}
      OWNER_EMAIL: pterminology@gmail.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Inspect zones, verified destinations, and sending domains
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]] || { echo "::error::CLOUDFLARE_API_TOKEN missing"; exit 1; }
          mkdir -p reports /tmp/cf-email
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")

          curl -sS "${auth[@]}" "https://api.cloudflare.com/client/v4/zones?per_page=100" -o /tmp/cf-email/zones.json
          curl -sS "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/email/routing/addresses?per_page=100" -o /tmp/cf-email/addresses.json

          python - <<'PY'
          import json, os, subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          token=os.environ['CLOUDFLARE_API_TOKEN']
          account=os.environ['CLOUDFLARE_ACCOUNT_ID']
          owner=os.environ['OWNER_EMAIL'].lower()
          headers=['-H',f'Authorization: Bearer {token}','-H','Content-Type: application/json']

          def load(path):
              try: return json.loads(Path(path).read_text(encoding='utf-8'))
              except Exception as exc: return {'success':False,'errors':[{'message':str(exc)}]}

          def get(url):
              result=subprocess.run(['curl','-sS',*headers,url],capture_output=True,text=True,timeout=60)
              try: data=json.loads(result.stdout)
              except Exception: data={'success':False,'errors':[{'message':result.stderr or result.stdout[:200]}]}
              return data

          zones_data=load('/tmp/cf-email/zones.json')
          addresses_data=load('/tmp/cf-email/addresses.json')
          zones=[]
          for zone in zones_data.get('result') or []:
              zid=zone.get('id')
              name=zone.get('name')
              routing=get(f'https://api.cloudflare.com/client/v4/zones/{zid}/email/routing')
              sending=get(f'https://api.cloudflare.com/client/v4/zones/{zid}/email/sending/subdomains?per_page=100')
              zones.append({
                  'id':zid,
                  'name':name,
                  'status':zone.get('status'),
                  'routing':{
                      'api_success':routing.get('success') is True,
                      'enabled':(routing.get('result') or {}).get('enabled'),
                      'status':(routing.get('result') or {}).get('status'),
                      'errors':[str(x.get('message',''))[:180] for x in routing.get('errors') or []],
                  },
                  'sending_subdomains':[
                      {
                          'name':item.get('name'),
                          'enabled':item.get('enabled'),
                          'return_path_domain':item.get('return_path_domain'),
                      }
                      for item in (sending.get('result') or [])
                  ],
                  'sending_api_success':sending.get('success') is True,
                  'sending_errors':[str(x.get('message',''))[:180] for x in sending.get('errors') or []],
              })

          addresses=[]
          for item in addresses_data.get('result') or []:
              addresses.append({
                  'id':item.get('id'),
                  'email':item.get('email'),
                  'verified':bool(item.get('verified')),
                  'verified_at':item.get('verified'),
              })

          enabled_senders=[
              {'zone':z['name'],'domain':s['name']}
              for z in zones for s in z['sending_subdomains'] if s.get('enabled')
          ]
          owner_verified=any((a.get('email') or '').lower()==owner and a.get('verified') for a in addresses)
          report={
              'schema_version':1,
              'checked_at':datetime.now(timezone.utc).isoformat(),
              'zones_api_success':zones_data.get('success') is True,
              'addresses_api_success':addresses_data.get('success') is True,
              'addresses_errors':[str(x.get('message',''))[:180] for x in addresses_data.get('errors') or []],
              'owner_destination_verified':owner_verified,
              'verified_destinations':[a for a in addresses if a.get('verified')],
              'enabled_sending_domains':enabled_senders,
              'zones':zones,
              'cloudflare_fallback_ready':bool(owner_verified and enabled_senders),
          }
          Path('reports/cloudflare-email-service-v1.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY

      - name: Commit safe email capability report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/cloudflare-email-service-v1.json
          git commit -m "chore: record Cloudflare email service audit v1"
          git pull --rebase origin main
          git push origin HEAD:main
